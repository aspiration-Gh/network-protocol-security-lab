":"2 = Configure-Ack（接受了降级）","Identifier":"回填同一个值"},"say":"服务器接受了 PAP：配置层面看不出异常，链路照常建立。","sub":"认证强度就这样被静默降了一级。"},{"who":"客户端","to":"服务器 NAS","pkt":4,"bubble":"明文口令","hl":["Code","Peer-ID","Password"],"vals":{"Code":"1 = Authenticate-Request","Peer-ID":"alice","Password":"s3cr3t（明文，6 字节）"},"say":"PAP 把用户名和口令明文送出，抓一次就到手，还能原样重放。","sub":"这正是 CHAP 要解决的两个问题。"}],"cmds":{"linux":[{"c":"sudo tcpdump -ni any -X -c 10 'pppoes'","n":"看信息字段开头的 c2 21 / c2 23 / c0 23，判断协商成了哪种认证","s":"补充（vault 无 tcpdump）"},{"c":"sudo tcpdump -ni any -X 'ether proto 0x8864 and ether[20:2] = 0xc023' -c 5","n":"只抓 PAP：偏移 20 就是 PPP 协议字段，出现 0xC023 即已被降级","s":"补充（vault 无 tcpdump）"},{"c":"sudo grep -iE 'auth|chap|pap' /etc/ppp/options","n":"对照本机配置：没写 refuse-pap 就等于允许降级","s":"补充（pppd 配置文件，vault 未收录）"}],"ps":[{"c":"Get-NetAdapter | Format-Table Name,Status","n":"降级后链路照样 Up，光看状态发现不了","s":"《系统》PowerShell.md · 网络与系统管理"}],"cmd":[{"c":"netsh ras show authmode","n":"看认证模式（需管理员）：pap 允许明文，chap/mschapv2 才是目标","s":"补充（Windows 自带）"},{"c":"rasdial","n":"重拨一次看是否仍能连上（降级不会影响连通性）","s":"补充（Windows 自带）"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"把认证方式锁死在策略里，再用新挑战和强口令把爆破成本抬起来","lead":"两个攻击对应两道防线：协商阶段不接受降级，认证阶段不接受可预测。","scenes":[{"name":"锁死 CHAP + 选项白名单 + 周期再认证","steps":[{"who":"服务器 NAS","to":"—","pkt":1,"bubble":"只接受 CHAP","hl":["Code","Option 1 Value"],"vals":{"Code":"3 = Configure-Nak / 4 = Configure-Reject","Option 1 Value":"0xC023 → 直接拒绝，不给 PAP 回退"},"say":"两端强制 chap，禁用 PAP 回退；不合规的选项直接 Reject。","sub":"认证方式不能由对端建议，只能由策略决定。"},{"who":"服务器 NAS","to":"客户端","pkt":1,"bubble":"选项白名单","hl":["Option 1 Type","Option 2 Type"],"vals":{"Option 1 Type":"3（认证协议，必须 CHAP 及以上）","Option 2 Type":"5（Magic-Number，允许）"},"say":"LCP 选项走白名单：只认已知类型与足够强的算法，其余记日志。","sub":"老旧 NAS 往往只能开关 PAP，这是现实约束。"},{"who":"服务器 NAS","to":"客户端","pkt":2,"bubble":"新挑战","hl":["Identifier","Value-Size","Value"],"vals":{"Identifier":"每次递增，不复用","Value-Size":"16（与摘要算法一致）","Value":"每次重新生成的 16 字节随机数"},"say":"每次认证换新挑战，并周期性再认证，把重放窗口压到一次。","sub":"挑战值可预测，就等于回到 PAP 的处境。"},{"who":"攻击者 A","to":"服务器 NAS","pkt":3,"bubble":"重放无效","hl":["Code","Value"],"vals":{"Code":"4 = Failure（旧摘要对不上）","Value":"旧 Response → 与新挑战不匹配"},"say":"重放同一条 Response：挑战变了，摘要对不上，直接失败。","sub":"配合失败计数与告警，连爆破也会留下痕迹。","evil":true},{"who":"服务器 NAS","to":"客户端","pkt":0,"bubble":"载荷仍是明文","hl":["Protocol","Information"],"vals":{"Protocol":"0x0021（认证后就是明文 IP 数据报）","Information":"认证通过后承载的业务数据"},"say":"CHAP 只解决「你是谁」，认证之后 PPP 载荷仍然明文。","sub":"要防窃听与篡改，得上 MPPE 或 L2TP over IPsec。"}],"cmds":{"linux":[{"c":"sudo grep -riE 'refuse-pap|require-mschap|auth' /etc/ppp/ 2>/dev/null","n":"确认本机 pppd 明确拒绝 PAP，而不是靠「默认」","s":"补充（pppd 配置，vault 未收录）"},{"c":"sudo tcpdump -ni any -X 'ether proto 0x8864 and ether[20:2] = 0xc023' -c 5","n":"防护后复测：这条过滤条件应当永远抓不到包","s":"补充（vault 无 tcpdump）"},{"c":"sudo ip xfrm state","n":"有 IPsec 的 SA，就说明 PPP 载荷已被封装加密","s":"补充（ip xfrm，vault 未收录）"}],"ps":[{"c":"Get-NetIPsecQuickModeSA | Format-Table LocalAddress,RemoteAddress,EncryptionAlgorithm","n":"快速模式 SA（需管理员）：算法一栏非空即说明链路上有密码学保护","s":"《系统》PowerShell.md · 网络与系统管理"},{"c":"Get-NetAdapter | Format-Table Name,Status","n":"复测：链路仍 Up，说明加固没有把正常连接谈崩","s":"《系统》PowerShell.md · 网络与系统管理"}],"cmd":[{"c":"netsh ras show authmode","n":"复核（需管理员）：认证模式必须只有 chap/mschapv2，没有 pap","s":"补充（Windows 自带）"},{"c":"rasdial","n":"重新拨号验证：加固后正常用户仍能认证成功","s":"补充（Windows 自带）"}]}}]}]}},{"proto":{"id":"pppoe","name":"PPPoE","cn":"以太网上的点对点协议","en":"Point-to-Point Protocol over Ethernet","layer":"link","chapter":"第二章","extra":false,"oneLine":"把 PPP 帧塞进以太网：发现阶段用广播找到 BRAS 并拿到 16 位 Session ID，会话阶段用单播承载 PPP 认证与数据。","sections":[{"h":"把以太网的经济性和 PPP 的认证计费缝在一起","p":"以太网便宜、易扩展，但没有「用户」这个概念：它只有 MAC 地址，没有账号、没有会话、没有计费点。PPP 恰好相反：它有 PAP/CHAP 认证、有 IPCP 动态分配地址、有会话级的计费与限速，却只能跑在点对点链路上，帧出不了本地介质。\n\nPPPoE（PPP over Ethernet）把两者接起来：在广播式以太网上建立一条逻辑点对点隧道，让每个用户拥有独立的 PPP 会话。运营商因此能用熟悉的拨号模型管理宽带用户——一个账号、一次认证、一条会话、一份计费；用户端也沿用拨号软件，配置简单。代价是每帧多 8 字节（PPPoE 6 + PPP 协议 2），MTU 从 1500 降到 1492。"},{"h":"发现阶段四步：先找到服务器，再拿到 Session ID","p":"发现阶段用以太网类型 0x8863，目的是让客户端知道服务器的 MAC 地址，并取得一个会话标识。四步是：客户端广播 PADI（Active Discovery Initiation，代码 0x09，Session_ID 必须为 0x0000）；一台或多台接入集中器单播回 PADO（Offer，0x07）；客户端挑一个回 PADR（Request，0x19）；被选中的设备回 PADS（Session-confirmation，0x65），其中带着分配的 Session ID。\n\n整个发现阶段没有任何认证：谁能先回 PADO，谁就被选中。这是 PPPoE 最根本的信任假设，也是假冒服务器攻击的全部空间。结束时还可能用 PADT（Terminate，0xA7）通知会话终止，它同样没有认证字段。"},{"h":"会话阶段只有 6 字节头，且全部单播","p":"会话阶段用以太网类型 0x8864，PPPoE 头固定 6 字节：1 字节版本与类型（各 4 位，规定都是 0x1，合起来 0x11）、1 字节代码（会话阶段固定 0x00）、2 字节 Session ID、2 字节长度。长度只计算 PPPoE 载荷，不含以太网头和 PPPoE 头。\n\n会话建立后，双方只用发现阶段确定的 MAC 地址与 Session ID 通信，所有帧都是单播——这一点很关键：攻击者不在会话路径上就收不到帧。Session ID 是 16 位无符号数，0xFFFF 保留不可用，可枚举空间约 6.5 万，且不带任何密码学保护。"},{"h":"发现阶段的 TAG 是参数信封：类型 + 长度 + 值","p":"发现报文的载荷是一串标签（TAG），每个标签是 2 字节类型、2 字节长度、可变长值。关键几个：0x0101 Service-Name（长度为 0 表示接受任意服务名）、0x0102 AC-Name（接入集中器名称）、0x0103 Host-Uniq（客户端用来把响应与请求配对，服务器必须原样回填）、0x0104 AC-Cookie（服务器下发的防 DoS 令牌，客户端必须在 PADR 里原样带回）、0x0110 Relay-Session-Id（中继代理用）。\n\nAC-Cookie 的设计意图值得注意：它强迫客户端证明「我能收到发往我这个 MAC 的单播」，从而提高伪造源 MAC 洪泛的成本；但它只是一个不透明令牌，不是身份认证。"},{"h":"PPPoE 的信任假设：谁先回答，谁就是服务器","p":"发现阶段没有认证，会话阶段的认证（CHAP/PAP）又是「服务器验证客户端」的单向认证。两者叠加的结果是：客户端从不验证服务器。攻击者只要比真 BRAS 更快地回一个 PADO，就能把会话引到自己身上，再代理转发给真 BRAS——用户能正常上网，完全不会察觉。\n\n此外 PADT 无认证（可强制任意用户下线）、Session ID 仅 16 位（可猜测注入）、PADI 依赖广播（可洪泛耗尽会话资源）。这些都不是实现 bug，而是「把 PPP 的认证模型搬到广播域」时留下的结构性缺口。"}],"packets":[{"title":"发现阶段 PADI（以太网类型 0x8863，广播）","note":"目的地址是广播，Session_ID 必须为 0x0000。两个标签：Service-Name 长度为 0 表示接受任意服务，Host-Uniq 是客户端自选的 4 字节随机值，用于把 PADO 与本次请求配对。","hex":"ff ff ff ff ff ff 00 0c 29 11 22 33 88 63 11 09 00 00 00 0c 01 01 00 00 01 03 00 04 de ad be ef 24 3b ef 48","fields":[{"name":"Destination Address","cn":"目的地址","off":0,"len":6,"bits":"48 位全 1 = 广播","tone":"addr","desc":"FF:FF:FF:FF:FF:FF，因为客户端此时还不知道服务器在哪里。","sec":"广播意味着同一广播域内所有设备都能收到 PADI，攻击者无需任何前置信息即可发现可攻击的客户端。"},{"name":"Source Address","cn":"源地址","off":6,"len":6,"bits":"","tone":"addr","desc":"00:0c:29:11:22:33，客户端 MAC。服务器之后只向这个地址单播 PADO。","sec":"源 MAC 可伪造。伪造大量源 MAC 发 PADI 就是会话耗尽攻击；服务器若不做 AC-Cookie 校验就无法分辨真假。"},{"name":"EtherType","cn":"以太网类型","off":12,"len":2,"bits":"","tone":"type","desc":"0x8863 = PPPoE 发现阶段；0x8864 = PPPoE 会话阶段。","sec":"两个阶段靠这个值区分。只按 0x8864 过滤的设备会漏掉发现阶段报文，反之亦然。"},{"name":"Ver / Type","cn":"版本与类型","off":14,"len":1,"bits":"高 4 bit Version=0x1 / 低 4 bit Type=0x1","tone":"type","desc":"整字节 0x11，协议规定两个字段都必须是 1。","sec":"取值写死，可作为协议识别特征；错误取值的报文按规范应被丢弃，宽松实现则可能继续解析，形成模糊测试面。"},{"name":"Code","cn":"代码","off":15,"len":1,"bits":"","tone":"type","desc":"0x09 = PADI；0x07 = PADO；0x19 = PADR；0x65 = PADS；0xA7 = PADT；会话阶段为 0x00。","sec":"报文语义全看这一个字节。伪造 PADT（0xA7）即可拆掉别人的会话，而它没有任何认证。"},{"name":"Session ID","cn":"会话标识","off":16,"len":2,"bits":"","tone":"id","desc":"发现阶段固定 0x0000（尚未分配）；PADS 中填入服务器分配的会话号，之后整个会话阶段保持不变。0xFFFF 保留不可用。","sec":"16 位可枚举，且明文出现在每一帧里。攻击者抓到一次就能伪造该会话的报文注入。"},{"name":"Length","cn":"长度","off":18,"len":2,"bits":"","tone":"len","desc":"0x000c = 12，只计算 PPPoE 载荷（两个标签共 12 字节），不含以太网头与 PPPoE 头。","sec":"长度与实际载荷不符会造成解析越界或截断，是 PPPoE 模糊测试的常见输入。"},{"name":"TAG 1 Type","cn":"标签 1 类型","off":20,"len":2,"bits":"","tone":"type","desc":"0x0101 = Service-Name。其他：0x0102 AC-Name、0x0103 Host-Uniq、0x0104 AC-Cookie、0x0110 Relay-Session-Id。","sec":"未知标签按规范必须忽略，这给厂商私有标签留了空间；攻击者可塞入畸形标签测试解析器健壮性。"},{"name":"TAG 1 Length","cn":"标签 1 长度","off":22,"len":2,"bits":"","tone":"len","desc":"0x0000，表示值为空，即「任何服务名都可以」。","sec":"长度为 0 的 Service-Name 说明客户端不限定运营商，攻击者的假服务器无需知道服务名就能应答。"},{"name":"TAG 2 Type","cn":"标签 2 类型","off":24,"len":2,"bits":"","tone":"type","desc":"0x0103 = Host-Uniq。","sec":"它只用于请求-响应配对，不提供任何认证；服务器若不加校验，攻击者可伪造 PADO 抢答而不被客户端发现。"},{"name":"TAG 2 Length","cn":"标签 2 长度","off":26,"len":2,"bits":"","tone":"len","desc":"0x0004，值占 4 字节。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"TAG 2 Value","cn":"Host-Uniq 值","off":28,"len":4,"bits":"","tone":"data","desc":"0xdeadbeef，客户端随机选取的关联标识。","sec":"可预测的 Host-Uniq 会让攻击者更容易把伪造的 PADO 与请求配对；它只是一个关联号，不是随机挑战。"},{"name":"Frame Check Sequence","cn":"帧校验序列","off":32,"len":4,"bits":"","tone":"check","desc":"CRC-32，本例 0x48ef3b24。","sec":"无密钥，伪造发现报文时重算即可。"}]},{"title":"发现阶段 PADO（代码 0x07，服务器应答）","note":"服务器单播回应，携带 Service-Name、AC-Name（BRAS-01）、AC-Cookie 与回填的 Host-Uniq。客户端据 PADO 决定选哪台服务器，这里的「先到先得」正是攻击入口。","hex":"00 0c 29 11 22 33 00 1a 2b 3c 4d 5e 88 63 11 07 00 00 00 23 01 01 00 00 01 02 00 07 42 52 41 53 2d 30 31 01 04 00 08 11 22 33 44 55 66 77 88 01 03 00 04 de ad be ef 7e 87 dc 66","fields":[{"name":"Destination Address","cn":"目的地址","off":0,"len":6,"bits":"","tone":"addr","desc":"00:0c:29:11:22:33，即发 PADI 的客户端 MAC，单播回应。","sec":"单播到源 MAC 意味着不在路径上的主机看不到 PADO，但攻击者本来就在同一广播域，照样能收到。"},{"name":"Source Address","cn":"源地址","off":6,"len":6,"bits":"","tone":"addr","desc":"00:1a:2b:3c:4d:5e，服务器的 MAC。客户端此后把会话帧全部发往这个地址。","sec":"客户端不校验这个 MAC 是否属于合法 BRAS——攻击者填自己的 MAC 即可接管会话。"},{"name":"EtherType","cn":"以太网类型","off":12,"len":2,"bits":"","tone":"type","desc":"0x8863，仍属发现阶段。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Ver / Type","cn":"版本与类型","off":14,"len":1,"bits":"高 4 bit Version=0x1 / 低 4 bit Type=0x1","tone":"type","desc":"0x11。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Code","cn":"代码","off":15,"len":1,"bits":"","tone":"type","desc":"0x07 = PADO（PPPoE Active Discovery Offer）。","sec":"假服务器发的也是这个代码，客户端没有任何办法从报文内容判断真伪。"},{"name":"Session ID","cn":"会话标识","off":16,"len":2,"bits":"","tone":"id","desc":"0x0000，PADO 阶段仍未分配，要等 PADS 才给值。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Length","cn":"长度","off":18,"len":2,"bits":"","tone":"len","desc":"0x0023 = 35，四个标签的总长。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"TAG Service-Name","cn":"服务名标签","off":20,"len":4,"bits":"","tone":"type","desc":"01 01 00 00：类型 0x0101、长度 0、值为空，表示支持任意服务名。","sec":"假服务器同样可以宣称支持任意服务名，这段内容不构成任何证明。"},{"name":"TAG AC-Name","cn":"接入集中器名称标签","off":24,"len":11,"bits":"","tone":"data","desc":"类型 0x0102、长度 7、值 ASCII “BRAS-01”。","sec":"名称只是展示用的字符串，客户端通常不校验；攻击者填一个和真设备一样的名字即可伪装。"},{"name":"TAG AC-Cookie","cn":"防 DoS 令牌标签","off":35,"len":12,"bits":"","tone":"data","desc":"类型 0x0104、长度 8、值 1122334455667788。服务器生成的不透明令牌，客户端必须在 PADR 中原样带回。","sec":"它强迫客户端证明能收到单播，抬高伪造源 MAC 洪泛的成本；但它不是身份凭证，攻击者收到自己的 Cookie 照样能回填。"},{"name":"TAG Host-Uniq","cn":"请求关联标签","off":47,"len":8,"bits":"","tone":"data","desc":"类型 0x0103、长度 4、值 deadbeef，与 PADI 中的值一致（服务器必须原样回填）。","sec":"不校验 Host-Uniq 的客户端会把任意 PADO 当成对自己请求的应答，抢答攻击因此更容易成功。"},{"name":"Frame Check Sequence","cn":"帧校验序列","off":55,"len":4,"bits":"","tone":"check","desc":"CRC-32，本例 0x66dc877e。","sec":"无密钥，不能证明报文来自真服务器。"}]},{"title":"会话阶段数据帧（以太网类型 0x8864，内含 PPP + IPv4 + TCP）","note":"PPPoE 头只有 6 字节，长度 0x002a = 42 只算 PPP 部分（协议 2 + IP 40）。PPP 协议字段 0x0021 表示 IPv4；协商 ACFC 后 PPP 的 0xFF 03 被省略，所以这里直接从协议字段开始。","hex":"00 1a 2b 3c 4d 5e 00 0c 29 11 22 33 88 64 11 00 12 34 00 2a 00 21 45 00 00 28 1c 46 40 00 40 06 9b 2e c0 a8 01 0a c0 a8 01 01 c3 50 00 50 12 34 56 78 9a bc de f0 50 10 20 00 66 7e 00 00 2e 1b f0 5f","fields":[{"name":"Destination Address","cn":"目的地址","off":0,"len":6,"bits":"","tone":"addr","desc":"00:1a:2b:3c:4d:5e，会话对端的 MAC（本例是服务器侧），来自发现阶段。","sec":"会话阶段全部单播，所以不在路径上的主机抓不到帧——但同一广播域内的攻击者可以先做 ARP/表污染把流量引过来。"},{"name":"Source Address","cn":"源地址","off":6,"len":6,"bits":"","tone":"addr","desc":"00:0c:29:11:22:33，客户端 MAC。","sec":"服务器通常按「源 MAC + Session ID」校验会话归属，伪造两者即可注入。"},{"name":"EtherType","cn":"以太网类型","off":12,"len":2,"bits":"","tone":"type","desc":"0x8864 = PPPoE 会话阶段。","sec":"与发现阶段的 0x8863 区分；这种「同协议两个 EtherType」的结构常让只做单值过滤的 ACL 出现遗漏。"},{"name":"Ver / Type","cn":"版本与类型","off":14,"len":1,"bits":"高 4 bit Version=0x1 / 低 4 bit Type=0x1","tone":"type","desc":"0x11。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Code","cn":"代码","off":15,"len":1,"bits":"","tone":"type","desc":"0x00，会话阶段固定值。发现阶段的代码（0x09/0x07/0x19/0x65/0xA7）在这里一律不出现。","sec":"若在 0x8864 帧里收到非 0 代码，说明有实现错误或有人在混用阶段，可作为检测特征。"},{"name":"Session ID","cn":"会话标识","off":16,"len":2,"bits":"","tone":"id","desc":"0x1234，PADS 阶段分配，整个会话期间不变。会话由「源 MAC + 目的 MAC + Session ID」三者共同唯一确定。","sec":"16 位可枚举、明文可见。攻击者抓到一个数据帧就拿到了注入所需的两项关键信息（另加 MAC）。"},{"name":"Length","cn":"长度","off":18,"len":2,"bits":"","tone":"len","desc":"0x002a = 42 = PPP 协议字段 2 字节 + IPv4 数据报 40 字节。","sec":"长度只算 PPP 载荷。构造长度与真实字节不符的帧可测试 BRAS 的解析健壮性。"},{"name":"PPP Protocol","cn":"PPP 协议","off":20,"len":2,"bits":"","tone":"type","desc":"0x0021 = IPv4（0xC021 LCP、0xC023 PAP、0xC223 CHAP、0x8021 IPCP）。","sec":"PPP 的多路分解就在这里。会话内的认证报文（PAP/CHAP）同样走这个字段，嗅探者据此区分「认证阶段」与「数据阶段」。"},{"name":"PPP Information","cn":"PPP 信息（IPv4 数据报）","off":22,"len":40,"bits":"IP 首部 20 字节 + TCP 首部 20 字节","tone":"data","desc":"源 192.168.1.10、目的 192.168.1.1，TCP 50000 → 80，纯 ACK。","sec":"PPPoE 不加密，载荷明文。若这里跑的是 PAP，口令就在这段字节里；若是 HTTP，表单内容也在这里。"},{"name":"Frame Check Sequence","cn":"帧校验序列","off":62,"len":4,"bits":"","tone":"check","desc":"CRC-32，覆盖到载荷末尾，本例 0x5ff01b2e。","sec":"无密钥，不提供来源证明。"}]}],"attacks":[{"name":"Rogue PPPoE Server","cn":"假冒 PPPoE 服务器（抢答 PADO）","impact":"客户端被劫持到攻击者主机：明文口令到手，后续全部流量可被嗅探与篡改，而用户仍能正常上网。","steps":[{"who":"攻击者 A","to":"客户端 C（广播域内）","label":"PADO（Code=0x07, AC-Name=“BRAS-01”, AC-Cookie=任意值, Host-Uniq 回填），抢在真 BRAS 之前发出","note":"客户端只等第一个 PADO，先到者被选中"},{"who":"客户端 C","to":"攻击者 A","label":"PADR（Code=0x19, Session_ID=0, 回填攻击者的 AC-Cookie）","note":"会话被引向攻击者主机，真 BRAS 完全不知情"},{"who":"攻击者 A","to":"客户端 C","label":"PADS（Code=0x65, Session_ID=0x1234）","note":"发现阶段结束，客户端此后只用攻击者 MAC + 0x1234 通信"},{"who":"客户端 C","to":"攻击者 A","label":"会话阶段：LCP → PAP Authenticate-Request（01 01 00 11 05 …）","note":"用户名与口令以明文送到攻击者手上"},{"who":"攻击者 A","to":"真 BRAS","label":"用受害者凭证（或自有账号）代为上线，双向中转流量","note":"用户能正常上网，但流量全程经过攻击者；可做 DNS 劫持、内容注入"}],"defense":"强制 CHAP 并让客户端校验服务器身份（EAP-TLS 证书或预共享的 BRAS 标识）；接入设备开启 PPPoE 报文合法性检查与用户端口隔离。"},{"name":"PADI Flooding","cn":"PADI 洪泛与会话耗尽","impact":"BRAS 的会话表与 CPU 被占满，新用户无法拨号，已在线的用户也可能被挤掉。","steps":[{"who":"攻击者 A","to":"BRAS","label":"PADI（Code=0x09, SA=随机 MAC, Host-Uniq=随机值），每秒数万条","note":"每个 PADI 都触发 BRAS 创建会话上下文并生成 PADO"},{"who":"BRAS","to":"伪造源 MAC","label":"逐条回 PADO（含 AC-Cookie、Session 资源预留）","note":"会话表项被迅速占满，CPU 忙于构造应答"},{"who":"受害者 B","to":"BRAS","label":"正常 PADI（Service-Name=空）","note":"无空闲会话资源，PADO 被丢弃或延迟"},{"who":"受害者 B","to":"—","label":"拨号超时重试，最终失败","note":"拒绝服务；已在线用户若被踢下线重拨也会失败"}],"defense":"在接入设备上限制每端口 PADI 速率与最大并发会话数，并用 AC-Cookie 强制客户端先证明地址可达再分配资源。"},{"name":"Forged PADT","cn":"伪造 PADT 强制下线","impact":"可对任意在线用户强制断线，并可配合假冒服务器在重拨窗口完成劫持。","steps":[{"who":"攻击者 A","to":"客户端 C","label":"PADT（Code=0xA7, Session_ID=0x1234, DA=C 的 MAC, SA 伪造成 BRAS 的 MAC）","note":"PADT 没有任何认证字段，Session ID 从抓包即可得到"},{"who":"客户端 C","to":"—","label":"收到 PADT 后立即拆除 PPP 会话与虚拟接口","note":"用户掉线，需要重新拨号"},{"who":"攻击者 A","to":"客户端 C","label":"在重拨窗口抢先回 PADO（与假冒服务器攻击组合）","note":"掉线与劫持形成闭环，用户只感觉「网络不稳定」"},{"who":"攻击者 A","to":"BRAS","label":"对同一广播域内多个 Session ID 循环发送 PADT","note":"批量踢线，造成区域性断网投诉"}],"defense":"客户端与服务器校验 PADT 的源 MAC 与 Session ID 是否与本地会话一致，并对 PADT 做速率限制与告警。"}],"defenses":[{"name":"强制 CHAP、禁用 PAP","how":"BRAS 侧配置只接受 CHAP，拒绝协商到 PAP；客户端侧同样不接受服务器下发的 PAP 请求。","limit":"只保护口令不上线，不保护会话数据；弱口令仍可被离线爆破；也无法阻止假冒服务器（客户端依然不验证对端）。"},{"name":"PADI/PADR 限速 + 最大会话数 + AC-Cookie","how":"在接入设备上对发现报文做速率限制（每端口每秒 PADI 数），限制单端口最大 PPPoE 会话数；开启 AC-Cookie 让客户端先证明单播可达。","limit":"伪造源 MAC 的分布式洪泛可绕过单端口限速；AC-Cookie 只提高成本不消除攻击；限速过严会误伤集中重拨（如断电恢复）。"},{"name":"用户端口隔离（PVLAN / 端口保护）","how":"把每个用户端口划入隔离 VLAN 或启用端口保护，使同一接入设备下的用户之间二层不可达，只能与 BRAS 通信。","limit":"只在本设备生效，跨汇聚层需全网一致；会切断用户间的合法互访（局域网共享、打印机）；对已控制 BRAS 上联的攻击者无效。"},{"name":"PADT/会话一致性校验","how":"客户端与 BRAS 都检查 PADT 的源 MAC、Session ID 与本地会话记录是否匹配，不匹配直接丢弃并记录日志。","limit":"源 MAC 可伪造，只能提高门槛；Session ID 是明文，抓到一次就能构造出「完全匹配」的报文。"}],"calcs":["checksum"],"quiz":[{"q":"PPPoE 环境下链路的 MTU 为什么通常是 1492 而不是 1500？","options":["因为以太网帧最大只有 1492 字节","因为 PPPoE 头 6 字节加 PPP 协议字段 2 字节占了 8 字节载荷空间","因为 PPP 的 MRU 默认是 1492"],"a":1,"why":"以太网数据字段上限 1500，PPPoE 头 6 字节与 PPP 协议字段 2 字节要从里面扣掉，剩 1492 给 IP 数据报；因此 PPPoE 链路上常需把 TCP MSS 调到 1452。"},{"q":"会话阶段的帧使用什么地址形式？","options":["继续使用广播，靠 Session ID 区分用户","全部单播，沿用发现阶段确定的 MAC 与 Session ID","使用组播地址 01:00:5E 系列"],"a":1,"why":"RFC 2516 规定会话阶段所有以太网帧都是单播，目的地址为发现阶段学到的对端 MAC，配合 Session ID 唯一标识会话。"},{"q":"PADI 报文里的 Session ID 应该是什么值？","options":["0x0000，因为会话尚未分配","0xFFFF，表示广播会话","由客户端随机生成"],"a":0,"why":"PADI 阶段还没有会话，Session_ID 必须为 0x0000；0xFFFF 被保留且禁止使用。会话号由服务器在 PADS 中分配。"}]},"script":{"id":"pppoe","notes":{"Session ID":{"short":"16 位会话号，明文可见","more":"发现阶段固定 0x0000，PADS 里由服务器分配，之后整个会话不变。会话由「源 MAC + 目的 MAC + Session ID」三要素唯一确定，三者全明文。","sec":"抓到一次就能复制三要素，注入与伪造 PADT 都不需要凭证。"},"TAG AC-Cookie":{"short":"服务器发的不透明令牌","more":"PADO 里下发，客户端必须在 PADR 中原样带回。它让服务器先确认「这个客户端能单播收到我的应答」，提高伪造源 MAC 的抢答成本。","sec":"只提高成本不消除攻击：真 Cookie 可以被转发，抢答者仍能骗过客户端。"},"TAG Host-Uniq":{"short":"客户端配对用的随机值","more":"客户端自选，服务器必须在 PADO 里原样回填。它解决的是「哪个应答对应我这次的 PADI」，不承担任何身份鉴别作用。","sec":"配对成功不等于对端可信，客户端没有验证 PADO 来源的手段。"},"PPP Protocol":{"short":"PPP 内层协议，决定载荷","more":"0x0021 是 IPv4，0xC021 LCP、0xC023 PAP、0xC223 CHAP、0x8021 IPCP。会话阶段 0x8864 之后就是它，决定后面载荷的类型。","sec":"认证与数据同走这一层且都明文，抓到会话就等于拿到 PPP 全部内容。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"发现阶段广播换一个 Session ID，会话阶段全部单播：两个 EtherType 分工","lead":"0x8863 找服务器，0x8864 传数据。会话一旦建立，两端 MAC 与会话号就固定下来。","scenes":[{"name":"发现 → 会话","steps":[{"who":"客户端","to":"广播","pkt":0,"bubble":"PADI","hl":["Destination Address","EtherType","Code","Session ID","TAG 2 Value"],"vals":{"Destination Address":"FF:FF:FF:FF:FF:FF（还不知道 BRAS 在哪）","EtherType":"0x8863 = 发现阶段","Code":"0x09 = PADI","Session ID":"0x0000（尚未分配）","TAG 2 Value":"0xdeadbeef（Host-Uniq，配对用）"},"say":"客户端广播 PADI：谁提供 PPPoE 服务？此时会话号还是 0。","sub":"发现阶段没有任何认证，谁先答都可能被选中。"},{"who":"服务器 BRAS","to":"客户端","pkt":1,"bubble":"PADO","hl":["Code","Session ID","TAG AC-Name","TAG AC-Cookie","TAG Host-Uniq"],"vals":{"Code":"0x07 = PADO","Session ID":"0x0000（此时仍未分配）","TAG AC-Name":"BRAS-01（自报的名字）","TAG AC-Cookie":"1122334455667788（不透明令牌）","TAG Host-Uniq":"deadbeef（必须原样回填）"},"say":"BRAS 单播回应：报出 AC-Name，给一个 AC-Cookie，回填 Host-Uniq。","sub":"客户端靠 Host-Uniq 把应答与自己的请求配对。"},{"who":"客户端","to":"BRAS","pkt":1,"bubble":"PADR → PADS","hl":["Code","Session ID","TAG AC-Cookie"],"vals":{"Code":"0x19 = PADR，0x65 = PADS","Session ID":"0x1234（PADS 中分配）","TAG AC-Cookie":"必须原样带回"},"say":"客户端选定这台 BRAS，PADS 里拿到会话号 0x1234。","sub":"会话号 16 位，全程不变，也不加密。"},{"who":"客户端","to":"BRAS","pkt":2,"bubble":"会话数据","hl":["EtherType","Code","Session ID","PPP Protocol"],"vals":{"EtherType":"0x8864 = 会话阶段（全部单播）","Code":"0x00（会话阶段固定）","Session ID":"0x1234","PPP Protocol":"0x0021 = IPv4"},"say":"会话阶段全部单播，以太网类型换成 0x8864，Code 固定 0。","sub":"PPP 的 LCP/CHAP/IPCP 都在这一阶段跑。"},{"who":"客户端","to":"BRAS","pkt":2,"bubble":"三要素定会话","hl":["Source Address","Destination Address","Session ID"],"vals":{"Source Address":"00:0c:29:11:22:33（客户端）","Destination Address":"00:1a:2b:3c:4d:5e（BRAS）","Session ID":"0x1234"},"say":"「源 MAC + 目的 MAC + Session ID」三者唯一确定一条会话。","sub":"三者全是明文，抓到就能复制。"}],"cmds":{"linux":[{"c":"sudo tcpdump -eni eth0 -c 5 'ether proto 0x8863'","n":"只看发现阶段：PADI/PADO 的 Code 在以太网偏移 15 字节","s":"补充（vault 无 tcpdump）"},{"c":"sudo tcpdump -eni eth0 -c 5 'ether proto 0x8864'","n":"只看会话阶段：单播、带 Session ID，里面是 PPP","s":"补充（vault 无 tcpdump）"},{"c":"ip -s link show","n":"会话起来后会出现 ppp0，看它的收发计数","s":"《系统》Linux.md · ip"}],"ps":[{"c":"Get-NetAdapter | Where-Object InterfaceDescription -like '*PPPoE*' | Format-Table Name,Status,LinkSpeed","n":"WAN Miniport (PPPoE) 的状态与速率","s":"《系统》PowerShell.md · 网络与系统管理"},{"c":"Get-NetIPAddress | Format-Table InterfaceAlias,IPAddress,PrefixLength","n":"IPCP 分配到的地址落在 PPP 适配器上","s":"《系统》PowerShell.md · 获取本机 IP 配置：Get-NetIPAddress"}],"cmd":[{"c":"ipconfig /all","n":"PPP 适配器段落：IPCP 拿到的地址、DNS 与拨号服务器","s":"《系统》Windows CMD.md · ipconfig"},{"c":"rasdial","n":"本机拨号连接与状态，重拨也在这里","s":"补充（Windows 自带，vault 未收录）"}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"发现阶段没认证：抢答 PADO 劫走会话，伪造 PADT 把人踢下线","lead":"PPPoE 的两个阶段都靠「明文标识」而不是凭证。所以抢答和伪造都不用破密码。","scenes":[{"name":"假冒 BRAS 抢答 PADO（会话劫持）","steps":[{"who":"客户端","to":"广播","pkt":0,"bubble":"PADI","hl":["Destination Address","Code","Session ID"],"vals":{"Destination Address":"FF:FF:FF:FF:FF:FF（全网都能听见）","Code":"0x09 = PADI","Session ID":"0x0000"},"say":"客户端广播找服务器，广播域里的每台设备都收得到。","sub":"包括攻击者那块网卡。"},{"who":"攻击者 A","to":"客户端","pkt":1,"bubble":"抢先 PADO","hl":["Source Address","Code","TAG AC-Name","TAG AC-Cookie"],"vals":{"Source Address":"00:1a:2b:3c:4d:5e（伪装成 BRAS 的 MAC）","Code":"0x07 = PADO","TAG AC-Name":"BRAS-01（名字照抄）","TAG AC-Cookie":"任意值（客户端无法验证真伪）"},"say":"抢在真 BRAS 之前回 PADO，名字照抄，Cookie 随便填一个。","sub":"客户端只等第一个应答，先到的就被选中。","evil":true},{"who":"客户端","to":"攻击者 A","pkt":1,"bubble":"PADR 交给攻击者","hl":["Code","Session ID","TAG AC-Cookie"],"vals":{"Code":"0x19 = PADR","Session ID":"0x1234（由攻击者的 PADS 分配）","TAG AC-Cookie":"攻击者给的那个值，原样回填"},"say":"客户端把 PADR 发给攻击者，会话被引到劫持者身上。","sub":"PADS 与 Session ID 现在都由攻击者说了算。"},{"who":"客户端","to":"攻击者 A","pkt":2,"bubble":"认证与数据都经过","hl":["Session ID","PPP Protocol","PPP Information"],"vals":{"Session ID":"0x1234","PPP Protocol":"0xC023 时是 PAP 明文，0x0021 是业务数据","PPP Information":"明文 IP 包，可读可改"},"say":"会话里的 PPP 认证走攻击者：协商成 PAP 就直接读到口令。","sub":"就算用 CHAP，后续业务数据仍可嗅探与改写。"},{"who":"攻击者 A","to":"BRAS（真）","pkt":2,"bubble":"代理转发","hl":["Source Address","Session ID","PPP Information"],"vals":{"Source Address":"换成自己的 MAC","Session ID":"换成真 BRAS 分配的会话号","PPP Information":"原样转发，用户照常上网"},"say":"攻击者把流量转给真 BRAS，用户能正常上网，全程无感。","sub":"最难发现的一类中间人：故障现象为零。","evil":true}],"cmds":{"linux":[{"c":"sudo tcpdump -eni eth0 'ether proto 0x8863' -c 10","n":"一次拨号出现两个 PADO（源 MAC 不同）就是有人在抢答","s":"补充（vault 无 tcpdump）"},{"c":"sudo tcpdump -eni eth0 'ether proto 0x8864' -c 5","n":"会话帧的目的 MAC 若不是 BRAS 的真实 MAC，说明被劫持","s":"补充（vault 无 tcpdump）"},{"c":"ip neigh show","n":"同网段出现可疑的 PPPoE 对端 MAC，配合 ARP 表交叉验证","s":"《系统》Linux.md · ip"}],"ps":[{"c":"Get-NetAdapter | Format-Table Name,InterfaceDescription,Status","n":"PPPoE 适配器是否 Up——被劫持后它照样 Up","s":"《系统》PowerShell.md · 网络与系统管理"},{"c":"Get-NetAdapterStatistics | Format-Table Name,BytesSent,BytesReceived","n":"流量照走，看不出异常，这正说明它是透明代理型劫持","s":"《系统》PowerShell.md · 网络与系统管理"}],"cmd":[{"c":"rasdial","n":"断开重拨，观察拨号耗时与对端信息有没有变化","s":"补充（Windows 自带）"},{"c":"ipconfig /all","n":"对比拨号前后拿到的网关与 DNS，被劫持时常指向异常地址","s":"《系统》Windows CMD.md · ipconfig"}]}},{"name":"伪造 PADT 强制下线","steps":[{"who":"攻击者 A","to":"—","pkt":2,"bubble":"读三要素","hl":["Source Address","Destination Address","Session ID"],"vals":{"Source Address":"客户端 MAC","Destination Address":"BRAS MAC","Session ID":"0x1234（明文可得）"},"say":"从任意一个会话帧读出三要素：两端 MAC 与会话号。","sub":"不需要任何凭证，抓一次就够。","evil":true},{"who":"攻击者 A","to":"客户端","pkt":2,"bubble":"PADT","hl":["Code","Session ID","Source Address"],"vals":{"Code":"0xA7 = PADT（伪造）","Session ID":"0x1234","Source Address":"伪造成 BRAS 的 MAC"},"say":"伪造一条 PADT：Code=0xA7，会话号照抄，源 MAC 写成 BRAS。","sub":"PADT 没有任何认证字段。","evil":true},{"who":"客户端","to":"—","pkt":2,"bubble":"拆会话","hl":["Session ID"],"vals":{"Session ID":"0x1234 → 立即拆除 PPP 会话与虚拟接口"},"say":"客户端收到 PADT 就拆会话，虚拟接口消失，用户掉线。","sub":"重新拨号要几秒到几十秒。"},{"who":"攻击者 A","to":"客户端","pkt":1,"bubble":"重拨窗口抢答","hl":["Code","TAG Host-Uniq"],"vals":{"Code":"0x07 = PADO（抢在真 BRAS 前）","TAG Host-Uniq":"照抄客户端的值"},"say":"在这个重拨窗口抢先回 PADO，把重连直接引到自己身上。","sub":"断线加抢答，就是一次干净的会话劫持。","evil":true}],"cmds":{"linux":[{"c":"sudo tcpdump -eni eth0 'ether proto 0x8863 and ether[15] = 0xa7'","n":"只抓 PADT：不该出现的时刻出现，就是有人在下线你","s":"补充（vault 无 tcpdump）"},{"c":"sudo tcpdump -eni eth0 'ether proto 0x8863' -c 20","n":"完整看一遍流程：PADI→PADO→PADR→PADS→PADT","s":"补充（vault 无 tcpdump）"},{"c":"ip -s link show","n":"ppp0 消失的时间点，就是 PADT 生效的时刻","s":"《系统》Linux.md · ip"}],"ps":[{"c":"Get-NetAdapter | Format-Table Name,Status","n":"PPPoE 适配器从 Up 变 Disconnected 的时刻，就是被下线","s":"《系统》PowerShell.md · 网络与系统管理"}],"cmd":[{"c":"rasdial","n":"看连接列表：连接消失说明 PADT 生效","s":"补充（Windows 自带）"},{"c":"netsh interface ipv4 show interfaces","n":"虚拟接口是否还在，确认断线发生在哪一层","s":"《系统》Windows CMD.md · netsh"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"Cookie 抬门槛、限速保资源、CHAP 保口令、PADT 做一致性校验","lead":"同一场抢答重放一遍：这次客户端带回的 Cookie 对不上，会话不会落到攻击者手上。","scenes":[{"name":"AC-Cookie + 限速 + CHAP + PADT 校验","steps":[{"who":"服务器 BRAS","to":"客户端","pkt":1,"bubble":"AC-Cookie 强校验","hl":["Code","TAG AC-Cookie"],"vals":{"Code":"0x07 = PADO（Cookie 每次新生成）","TAG AC-Cookie":"PADR 必须带回同值，否则丢弃"},"say":"AC-Cookie 让客户端先证明单播可达，抢答者拿不到真 Cookie。","sub":"只提高成本：Cookie 可被转发，攻击没被消除。"},{"who":"客户端","to":"BRAS","pkt":0,"bubble":"限速 PADI","hl":["Code","TAG 2 Value"],"vals":{"Code":"0x09 = PADI（每端口 ≤ 10 条/秒）","TAG 2 Value":"Host-Uniq 随机，服务端据此去重"},"say":"接入设备对 PADI/PADR 限速并限制单端口最大会话数。","sub":"会话上下文不再被一次洪泛吃光。"},{"who":"客户端","to":"BRAS","pkt":2,"bubble":"CHAP 而非 PAP","hl":["PPP Protocol"],"vals":{"PPP Protocol":"0xC223（CHAP：口令不上线）"},"say":"会话内强制 CHAP：口令不上线，抓到会话也没有明文口令。","sub":"弱口令仍可离线爆破，但至少不是明文。"},{"who":"客户端","to":"—","pkt":2,"bubble":"PADT 校验","hl":["Source Address","Session ID"],"vals":{"Source Address":"必须与本地记录的 BRAS MAC 一致","Session ID":"必须与本地会话记录一致"},"say":"PADT 先校验源 MAC 与会话号，不匹配直接丢弃并记日志。","sub":"源 MAC 可伪造，所以这只是提高门槛。"},{"who":"客户端","to":"BRAS","pkt":2,"bubble":"端口隔离","hl":["Destination Address"],"vals":{"Destination Address":"只能到 BRAS，同端口下用户之间不可达"},"say":"用户端口做隔离（PVLAN/端口保护），别人的 PADI/PADO 你看不到。","sub":"广播域被切开，抢答就没有舞台。"}],"cmds":{"linux":[{"c":"sudo tcpdump -eni eth0 'ether proto 0x8863 and ether[15] = 0x07' -c 10","n":"数 PADO 的条数与来源：正常只有一台 BRAS，两个就要查","s":"补充（vault 无 tcpdump）"},{"c":"sudo timeout 5 tcpdump -eni eth0 'ether proto 0x8863 and ether[15] = 0x09' | wc -l","n":"5 秒内 PADI 条数：单端口几十条以上就是洪泛","s":"补充（vault 无 tcpdump）"},{"c":"sudo tcpdump -eni eth0 'ether proto 0x8864' -c 5","n":"复核会话帧只在与 BRAS MAC 之间单播","s":"补充（vault 无 tcpdump）"}],"ps":[{"c":"Get-NetAdapter | Format-Table Name,Status","n":"防护后复测：PPPoE 适配器稳定 Up，不再反复掉线","s":"《系统》PowerShell.md · 网络与系统管理"},{"c":"Get-NetAdapterStatistics | Format-Table Name,BytesSent,BytesReceived","n":"流量恢复正常，没有额外的中转跳数痕迹","s":"《系统》PowerShell.md · 网络与系统管理"}],"cmd":[{"c":"rasdial","n":"连续拨号三次，都能稳定连上说明限速没设过严","s":"补充（Windows 自带）"},{"c":"ipconfig /all","n":"复核每次拨号拿到的 DNS 与网关一致，没有被改写","s":"《系统》Windows CMD.md · ipconfig"}]}}]}]}},{"proto":{"id":"l2tp","name":"L2TP","cn":"第二层隧道协议","en":"Layer 2 Tunneling Protocol","layer":"link","chapter":"第二章","extra":false,"oneLine":"把 PPP 帧用 UDP 1701 在 IP 网里搬运的隧道协议：控制通道带 Ns/Nr 可靠传输，数据通道尽力而为，本身不提供加密。","sections":[{"h":"PPP 帧出不了本地链路，于是需要隧道","p":"PPP 的地址字段固定 0xFF，它假定两端之间存在一条直接的点对点链路；一旦用户与服务器之间隔着 IP 骨干网，PPP 帧既没有可路由的地址，也没有分片与重传机制，根本无法穿越。L2TP（Layer 2 Tunneling Protocol）解决的就是这段「跨越」：把 PPP 帧原样装进隧道，在 IP 网上运到对端再拆出来。\n\n它是标准合并的产物：1998 年思科的第二层转发（L2F）与 1999 年微软等提出的点对点隧道协议（PPTP）互不兼容，IETF 于 1999 年 8 月把两者的思路合成 L2TP。隧道的一般形式是「协议 B（隧道头（协议 A））」——隧道只改变中间的运输方式，不改变两端是什么。"},{"h":"LAC 与 LNS：一条隧道复用多条会话","p":"隧道的两个端点是 L2TP 接入集中器（L2TP Access Concentrator, LAC，靠近用户侧）与 L2TP 网络服务器（L2TP Network Server, LNS，靠近企业网侧），二者互为对等体。LAC 负责在远程系统与 LNS 之间转发 PPP 报文，并维护隧道（Tunnel）与会话（Session）两级连接；LNS 为远程用户提供访问企业内网的服务。\n\n隧道与会话是两层概念：一条隧道里可以复用多条会话，隧道 ID 相同、会话 ID 不同的报文被复用在同一条隧道上，不必为每个用户建一条隧道。两个 ID 都是 16 位，而且各自独立分配——发起方与接收方对同一条隧道使用的 ID 不同，报文头里填的永远是接收方指定的 ID。"},{"h":"双通道：控制消息要可靠，数据消息不要","p":"L2TP 跑在 UDP 之上，端口 1701，两种消息分走两条通道。控制消息（T=1）用于隧道与会话的建立、维护、拆除，走可靠控制通道：带长度字段、带 Ns/Nr 序号，丢包由 L2TP 自己重传。数据消息（T=0）承载用户 PPP 帧，不做重传——丢包交给上层 TCP 处理，避免「可靠 over 可靠」的性能损耗。\n\n首部 2 字节是标志与版本：T 类型、L 长度存在位、S 序号存在位、O 偏移存在位、P 优先级位，低 4 位是版本号（L2TPv2 为 2）。三条硬规则：控制消息必须 L=1、S=1、O=0。要长度是为了解析，要序号是为了可靠传输，不要偏移是因为控制消息没有需要对齐的载荷。"},{"h":"控制消息体是 AVP 序列，第一个必须是 Message Type","p":"控制消息的载荷是一串属性值对（Attribute Value Pair, AVP）：2 字节的「M 位 + H 位 + 10 位长度」，2 字节厂商 ID，2 字节属性类型，然后是值。M 位是「不认识就必须处理」的强制位（不认识的强制 AVP 会导致会话甚至整条隧道被拆除），H 位表示值被隐藏（用 MD5 与随机向量做混淆，用于传递口令类敏感值）。长度包含 AVP 头本身，最小 6 字节。\n\n第一条 AVP 必须是 Message Type（属性类型 0）：1 = SCCRQ、2 = SCCRP、3 = SCCCN、4 = StopCCN、6 = Hello、10 = ICRQ、12 = ICCN、14 = CDN。建立隧道时双方用挑战类 AVP 做 CHAP 式的双向认证，并各自通过 Assigned Tunnel ID 告知对方「以后请用这个 ID 称呼我」。"},{"h":"L2TP 只搬不藏：隧道不等于加密","p":"L2TP 本身没有任何密码学保护：PPP 载荷明文传输，数据消息没有完整性校验，Ns/Nr 只用于排序而不参与安全判定。它能提供的最多是控制通道的 CHAP 式对端认证（依赖预共享密钥），以及用 H 位隐藏个别 AVP 的值。\n\n所以「L2TP 是安全协议」是一个常见误解。真实部署必须叠加 IPsec，形成 L2TP over IPsec：由 ESP 加密整个 L2TP/UDP 包并提供完整性校验与抗重放，L2TP 只负责搬运二层帧。判断一个隧道方案是否安全，看的不是它叫不叫隧道，而是它有没有密钥、有没有完整性校验。"}],"packets":[{"title":"控制报文 SCCRQ（T=1，含 5 个 AVP）","note":"标志 0xC8 0x02：T=1、L=1、S=1、O=0、P=0、版本 2。控制消息必须带长度与 Ns/Nr。SCCRQ 的 Tunnel ID 与 Session ID 都填 0（还不知道对方用哪个 ID 称呼自己），最后用 Assigned Tunnel ID 告知对方自己的 ID=42。","hex":"c8 02 00 36 00 00 00 00 00 00 00 00 80 08 00 00 00 00 00 01 80 08 00 00 00 02 01 00 80 0a 00 00 00 07 6c 61 63 31 80 08 00 00 00 09 00 2a 80 08 00 00 00 0a 00 08","fields":[{"name":"Flags + Version","cn":"标志与版本","off":0,"len":2,"bits":"第 1 字节：最高位 T / 次高位 L / 两位保留 / S / 一位保留 / O / P；第 2 字节：高 4 位保留、低 4 位版本","tone":"flag","desc":"0xC8 0x02 = T=1（控制消息）、L=1（有长度）、S=1（有 Ns/Nr）、O=0（无偏移）、P=0，版本 2。控制消息这三条是强制的。","sec":"这 2 字节决定了整条报文的解析方式：L 位被清零可让解析器不去读长度字段，S 位被清零可让序号检查被跳过，属于典型的协议解析绕过手法。"},{"name":"Length","cn":"长度","off":2,"len":2,"bits":"","tone":"len","desc":"0x0036 = 54，整个报文的octets 数（含首部与全部 AVP）。仅在 L=1 时存在。","sec":"长度不准会导致 AVP 遍历越界；控制消息解析开销大于数据消息，伪造超长控制报文是廉价的 DoS 手段。"},{"name":"Tunnel ID","cn":"隧道标识","off":4,"len":2,"bits":"","tone":"id","desc":"0x0000。SCCRQ 阶段还不知道对端的隧道 ID，所以填 0；之后的报文填接收方分配的 ID。","sec":"16 位、明文、可枚举。攻击者扫 Tunnel ID 就能找到活动隧道，进而注入数据报文或伪造 StopCCN。"},{"name":"Session ID","cn":"会话标识","off":6,"len":2,"bits":"","tone":"id","desc":"0x0000。控制消息固定填 0（作用于整条隧道），数据消息才填具体会话 ID。","sec":"控制消息不校验会话号，只要 Tunnel ID 匹配就能作用于整条隧道——这使伪造 StopCCN 的成本极低。"},{"name":"Ns","cn":"发送序号","off":8,"len":2,"bits":"","tone":"seq","desc":"0x0000，本会话控制通道的第一个报文序号。仅在 S=1 时存在。","sec":"序号只用于可靠传输与排序，不参与安全判定；不校验序号的实现可被重放控制消息。"},{"name":"Nr","cn":"期望接收序号","off":10,"len":2,"bits":"","tone":"seq","desc":"0x0000，表示尚未收到对方任何报文。","sec":"伪造 Nr 可让对端的重传窗口错乱，造成控制通道卡死。"},{"name":"AVP: Message Type","cn":"消息类型 AVP","off":12,"len":8,"bits":"M=1 / H=0 / 长度=8；Vendor ID=0；Attribute Type=0；值=0x0001","tone":"type","desc":"80 08 00 00 00 00 00 01：必须是第一条 AVP，值 1 = SCCRQ（Start-Control-Connection-Request）。","sec":"Message Type 的 M 位有特殊语义：为 1 且类型未知时，整条隧道必须被清除。攻击者发一个未知类型加 M=1 的报文即可拆隧道。"},{"name":"AVP: Protocol Version","cn":"协议版本 AVP","off":20,"len":8,"bits":"M=1 / H=0 / 长度=8；Attribute Type=2；值=0x0100","tone":"misc","desc":"0x0100 表示版本 1、修订 0，是 L2TPv2 的常规取值。","sec":"版本协商可被降级：诱导双方接受更旧的版本，从而绕过新版才有的校验。"},{"name":"AVP: Host Name","cn":"主机名 AVP","off":28,"len":10,"bits":"M=1 / H=0 / 长度=10；Attribute Type=7；值 ASCII “lac1”","tone":"data","desc":"发送方的主机名，用于日志与运维识别。","sec":"明文暴露设备命名规则与拓扑信息，为攻击者提供资产画像；也常被用来伪造对端身份（名字本身无认证作用）。"},{"name":"AVP: Assigned Tunnel ID","cn":"分配的隧道 ID AVP","off":38,"len":8,"bits":"M=1 / H=0 / 长度=8；Attribute Type=9；值=0x002a","tone":"id","desc":"值为 42，告诉对端「以后发给我的报文请把 Tunnel ID 填 42」。","sec":"隧道 ID 由本端自选、对端原样使用，没有任何随机性要求；实现常用递增计数，攻击者极易预测并枚举。"},{"name":"AVP: Receive Window Size","cn":"接收窗口大小 AVP","off":46,"len":8,"bits":"M=1 / H=0 / 长度=8；Attribute Type=10；值=0x0008","tone":"misc","desc":"值为 8，表示控制通道允许 8 个未被确认的报文。","sec":"窗口越大，重传前的缓存占用越多；伪造超小窗口可让对端一次只发一个报文，拖慢隧道建立。"}]},{"title":"数据报文（T=0，PPP 帧原样装进隧道）","note":"标志 0x40 0x02：T=0（数据）、L=1、S=0（本例不带序号）、O=0、版本 2。首部只有 8 字节，后面直接是 PPP 帧：地址控制 0xFF 0x03、协议 0x0021（IPv4），再往里是 IP 与 TCP。方向是 LAC → LNS，所以 Tunnel ID 填 LNS 分配的 7 而不是 LAC 自己的 42。","hex":"40 02 00 34 00 07 01 01 ff 03 00 21 45 00 00 28 1c 46 40 00 40 06 9b 2e c0 a8 01 0a c0 a8 01 01 c3 50 00 50 12 34 56 78 9a bc de f0 50 10 20 00 66 7e 00 00","fields":[{"name":"Flags + Version","cn":"标志与版本","off":0,"len":2,"bits":"T=0 / L=1 / S=0 / O=0 / P=0；低 4 位版本=2","tone":"flag","desc":"0x40 0x02。数据消息的长度与序号都是可选的：本例带长度、不带序号，因此首部 8 字节；若 S=1 还要再加 4 字节 Ns/Nr。","sec":"S=0 表示没有序号，也就无法检测重放与乱序。数据通道本身不做这些，所以抗重放必须由 IPsec 提供。"},{"name":"Length","cn":"长度","off":2,"len":2,"bits":"","tone":"len","desc":"0x0034 = 52，整个 L2TP 报文长度（8 字节首部 + 44 字节 PPP 帧）。","sec":"长度与实际不符可让接收端把尾部字节当成新报文（报文走私）。"},{"name":"Tunnel ID","cn":"隧道标识","off":4,"len":2,"bits":"","tone":"id","desc":"0x0007：LNS 在 SCCRP 中分配的隧道 ID。注意方向性——SCCRQ 里 LAC 自报 Assigned Tunnel ID=42，意思是「发给我的报文请填 42」；因此 LAC 发往 LNS 的报文填对端的 7，LNS 发往 LAC 的才填 42。","sec":"接收端只用它查隧道表，不校验来源。抓到一次就知道该填什么，16 位空间也足够枚举。"},{"name":"Session ID","cn":"会话标识","off":6,"len":2,"bits":"","tone":"id","desc":"0x0101 = 257，标识这条隧道里的具体用户会话，由对端在会话建立时分配。","sec":"接收端凭它找到对应的虚拟接口，把 PPP 帧送进正确的会话。ID 可枚举，注入时不需要任何凭证。"},{"name":"PPP Address / Control","cn":"PPP 地址与控制","off":8,"len":2,"bits":"","tone":"flag","desc":"0xFF 0x03，即 PPP 的固定地址与无编号帧控制字段。协商 ACFC 后这两个字节可被省略。","sec":"解析器若假定这两个字节一定存在，遇到 ACFC 压缩的帧就会把协议字段读错，形成解析歧义。"},{"name":"PPP Protocol","cn":"PPP 协议","off":10,"len":2,"bits":"","tone":"type","desc":"0x0021 = IPv4。若为 0xC023 / 0xC223，则载荷是 PAP / CHAP 认证报文。","sec":"决定解封装后交给谁。攻击者可把任意协议塞进隧道，只要对端不过滤就直达内网协议栈。"},{"name":"IPv4 Header","cn":"内层 IP 首部","off":12,"len":20,"bits":"版本/IHL、TOS、总长 0x0028、ID 0x1c46、DF=1、TTL=64、协议 6（TCP）","tone":"data","desc":"源 192.168.1.10、目的 192.168.1.1。这个 IP 包对隧道来说是透明载荷，隧道设备不修改它。","sec":"内层源 IP 完全由用户控制，LNS 若不做入口过滤，用户就能以任意源地址访问内网（地址伪造）。"},{"name":"TCP Header","cn":"内层 TCP 首部","off":32,"len":20,"bits":"源端口 50000 / 目的端口 80 / 数据偏移 5 / 标志 ACK","tone":"data","desc":"无载荷的纯 ACK 段，校验和 0x667e。","sec":"端口与内容全明文。隧道中继路径上的任意节点都能读到应用层数据，包括明文口令与 HTTP 正文。"}]},{"title":"控制报文 StopCCN（拆隧道，仅 36 字节）","note":"一条 36 字节的控制报文就能拆除整条隧道及其全部会话：Tunnel ID=42 命中 LAC（42 是 LAC 在 SCCRQ 中为自己分配的 ID），Session ID=0 表示作用于整条隧道，Message Type=4 即 StopCCN，Result Code=1 表示一般性错误。","hex":"c8 02 00 24 00 2a 00 00 00 07 00 03 80 08 00 00 00 00 00 04 80 08 00 00 00 09 00 2a 80 08 00 00 00 01 00 01","fields":[{"name":"Flags + Version","cn":"标志与版本","off":0,"len":2,"bits":"T=1 / L=1 / S=1 / O=0 / P=0；版本 2","tone":"flag","desc":"0xC8 0x02，与 SCCRQ 相同，表示这是控制消息且带长度与序号。","sec":"攻击者只要照抄任意控制报文的这两个字节，就能让报文通过格式检查。"},{"name":"Length","cn":"长度","off":2,"len":2,"bits":"","tone":"len","desc":"0x0024 = 36。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Tunnel ID","cn":"隧道标识","off":4,"len":2,"bits":"","tone":"id","desc":"0x002a = 42，指向 LAC 上的那条隧道（对端发往 LAC 时必须用 42）。","sec":"这就是攻击的全部关键：只要猜中（或枚举到）42，一条报文就能拆掉整条隧道。"},{"name":"Session ID","cn":"会话标识","off":6,"len":2,"bits":"","tone":"id","desc":"0x0000，控制消息固定填 0。","sec":"填 0 意味着影响范围是整条隧道而非单个会话，破坏力被放大。"},{"name":"Ns","cn":"发送序号","off":8,"len":2,"bits":"","tone":"seq","desc":"0x0007，发送方控制通道的当前序号。","sec":"序号可任意填写。若接收端严格校验序号，伪造报文需要先观察到当前窗口；否则连这一步都省了。"},{"name":"Nr","cn":"期望接收序号","off":10,"len":2,"bits":"","tone":"seq","desc":"0x0003，表示已收到对方序号 2 及之前的报文。","sec":"伪造 Nr 可让对端误以为报文已确认，从而丢弃待重传的控制消息。"},{"name":"AVP: Message Type","cn":"消息类型 AVP","off":12,"len":8,"bits":"M=1 / H=0 / 长度=8；Attribute Type=0；值=0x0004","tone":"type","desc":"值 4 = StopCCN（Stop-Control-Connection-Notification）。","sec":"语义完全由这个 8 字节 AVP 决定，而它没有任何签名或 MAC。"},{"name":"AVP: Assigned Tunnel ID","cn":"分配的隧道 ID AVP","off":20,"len":8,"bits":"M=1 / H=0 / 长度=8；Attribute Type=9；值=0x002a","tone":"id","desc":"回填 42，与首部 Tunnel ID 一致，进一步确认目标隧道。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"AVP: Result Code","cn":"结果码 AVP","off":28,"len":8,"bits":"M=1 / H=0 / 长度=8；Attribute Type=1；值=0x0001","tone":"misc","desc":"1 = General error（一般性错误），另有 2 无资源、3 协议版本不支持、4 未授权等。可再跟一个可选 Error Code。","sec":"合法客户端看到 Result Code 才会老实下线；伪造时随便填一个合法值就能让对端正常执行拆除流程。"}]}],"attacks":[{"name":"Cleartext Sniffing","cn":"隧道内明文嗅探","impact":"中继路径上任意节点都能读出 PPP 载荷（含明文口令与 HTTP 内容），隧道只改变了运输方式，没有提供任何机密性。","steps":[{"who":"攻击者 A","to":"IP 骨干网（LAC 与 LNS 之间）","label":"在中间节点镜像或嗅探 UDP 1701 流量","note":"L2TP 头里的 Tunnel ID / Session ID 都是明文，无需解密即可分流"},{"who":"攻击者 A","to":"—","label":"剥掉 IP / UDP / L2TP 头，取出 PPP 帧（ff 03 00 21 …）","note":"载荷未加密，PPP 帧直接可读"},{"who":"攻击者 A","to":"—","label":"若内层是 PAP，按 Peer-ID/Password 长度字段切出账号口令；若是 HTTP，读出正文与 Cookie","note":"零成本获取凭证，无需任何破解"},{"who":"攻击者 A","to":"—","label":"按 Session ID 分组，重组每个用户的完整会话","note":"可还原单个用户的上网行为、邮件内容与文件传输"}],"defense":"部署 L2TP over IPsec（ESP 加密整个 L2TP/UDP 包）或改用 TLS 类 VPN；只在受控网段内运行裸 L2TP。"},{"name":"Data Message Injection","cn":"伪造数据报文注入","impact":"无凭证即可向隧道注入任意报文，等于从企业网内部发起攻击，可扫描、投毒、横向移动。","steps":[{"who":"攻击者 A","to":"—","label":"从任意一个抓到的数据报文读出 Tunnel ID=7、Session ID=0x0101、两端 IP","note":"两个 ID 都是 16 位明文，抓一次即得"},{"who":"攻击者 A","to":"LNS（UDP 1701）","label":"伪造数据报文：40 02 00 xx 00 07 01 01 ff 03 00 21 + 伪造的 IP 包","note":"LNS 只按 Tunnel/Session ID 查虚拟接口，不校验来源与内容"},{"who":"LNS","to":"企业内网","label":"解封装、剥掉 L2TP 头，把伪造的 IP 包送进内网接口","note":"内层源 IP 可任意伪造，目标主机看到的是「来自隧道对端」的合法帧"},{"who":"攻击者 A","to":"企业内网","label":"注入 ARP 应答、DHCP 应答或直接的扫描流量","note":"隧道成为进入内网的跳板，且日志里只看到 LNS 在发包"}],"defense":"必须叠加 IPsec（ESP 提供完整性校验与抗重放）；防火墙上只放行已知对端 IP 的 1701/UDP，并对 LNS 入向做内层源地址过滤。"},{"name":"Forged StopCCN","cn":"伪造 StopCCN 拆隧道","impact":"一条 36 字节的控制报文即可拆除整条隧道及其全部会话，且 Tunnel ID 可枚举，能批量打击。","steps":[{"who":"攻击者 A","to":"LAC","label":"StopCCN：c8 02 00 24 00 2a 00 00 … AVP Message Type=4 + Result Code=1，发往 LAC","note":"Tunnel ID 命中即可，Session ID 填 0 影响整条隧道"},{"who":"LAC","to":"攻击者 A","label":"回 StopCCN 确认，并清理隧道状态与全部会话","note":"所有复用该隧道的用户同时掉线，虚拟接口被删除"},{"who":"用户群","to":"—","label":"PPP 会话中断，业务断连，需要重新拨号","note":"一次注入造成整条隧道的可用性损失"},{"who":"攻击者 A","to":"LAC","label":"按 Tunnel ID 递增枚举，循环向 LAC 发送 StopCCN","note":"控制消息解析开销大于数据消息，可持续消耗 CPU 并反复打断业务"}],"defense":"只接受已知对端 IP 的 1701/UDP 并对控制消息限速；开启隧道认证与 IPsec，使伪造报文无法通过完整性校验。"}],"defenses":[{"name":"L2TP over IPsec","how":"用 IPsec 传输模式（或隧道模式）保护 L2TP/UDP 1701：ESP 加密整个 L2TP 报文，提供完整性校验与基于序列号的抗重放。","limit":"带来 4%~8% 带宽开销与 MTU 缩减（需调 TCP MSS、注意分片）；配置与证书管理复杂；端点被控时加密层形同虚设。"},{"name":"1701/UDP 源地址白名单与控制消息限速","how":"在防火墙上只允许已知 LAC 地址访问 LNS 的 1701/UDP，并对单位时间的控制消息（尤其 SCCRQ/StopCCN）做速率限制与告警。","limit":"UDP 无连接，源 IP 可伪造；NAT 后多个 LAC 共享同一地址时难以区分；限速只能减缓 DoS，不能阻止单条伪造报文拆隧道。"},{"name":"隧道认证与 AVP 隐藏","how":"在 SCCRQ/SCCRP 中用 Challenge / Challenge-Response AVP 做基于共享密钥的双向认证；对含口令类信息的 AVP 置 H 位，用随机向量与 MD5 混淆其值。","limit":"只保护控制通道的建立，不保护数据通道；共享密钥弱时可被离线爆破；H 位只是混淆而非强加密，抓包者仍可离线尝试。"},{"name":"Tunnel / Session ID 随机化与长度校验","how":"实现上用密码学随机数生成 16 位 ID 而不是递增计数，并严格校验 Length 与 AVP 长度、拒绝未知的强制 AVP。","limit":"16 位空间熵不足（最多 65536），ID 又在每个数据报文中明文出现，抓到一次即失效；随机化只提高盲注成本。"}],"calcs":[],"quiz":[{"q":"为什么 L2TP 控制消息必须 L=1、S=1、O=0？","options":["因为控制消息要带长度便于解析、要序号做可靠传输，且不承载需要对齐的载荷","因为控制消息必须加密，这三个位是加密标志","因为 UDP 要求所有报文都带序号与偏移"],"a":0,"why":"控制消息涉及隧道与会话状态机的正确性，丢失会导致状态错乱，所以必须有长度和 Ns/Nr 做重传；偏移量是给需要对齐的载荷用的，控制消息用不上。"},{"q":"L2TP 使用 CHAP 做隧道端点认证，是否意味着它提供了机密性？","options":["是，CHAP 会协商会话密钥并加密载荷","否，CHAP 只认证对端身份，原始 L2TP 的 PPP 载荷仍明文传输","是，但只加密控制通道"],"a":1,"why":"CHAP 只解决「对端是谁」，且只保护认证交换本身。机密性与完整性必须由 IPsec（ESP）提供，即 L2TP over IPsec。"},{"q":"一条 L2TP 隧道里可以承载多少条会话？","options":["只能一条，隧道与会话一一对应","可以多条，隧道 ID 相同、会话 ID 不同的报文复用同一条隧道","最多两条，分别对应上下行"],"a":1,"why":"隧道与会话是两级概念，一条隧道可复用多条会话，不必为每个用户单建隧道——这正是 L2TP 高效的地方。"}]},"script":{"id":"l2tp","notes":{"Flags + Version":{"short":"T/L/S/O/P + 版本 2","more":"首字节最高位 T 区分控制(1)与数据(0)，接着 L(有长度)、S(有 Ns/Nr)、O(有偏移)、P(优先级)，低 4 位是版本。控制消息必须 T=1、L=1、S=1、O=0。","sec":"解析器靠这几位决定头有多长，乱填能触发长度计算错位。"},"Tunnel ID":{"short":"填接收方给的隧道号","more":"2 字节，指这条隧道在接收方那里的编号。两个方向取值不同：谁发的报文就填对端分配的 ID。SCCRQ 里填 0，因为还不知道对端的号。","sec":"16 位明文且可枚举，命中一个 ID 就能拆掉整条隧道。"},"AVP: Message Type":{"short":"第一条 AVP，定报文类型","more":"必须是最前面的 AVP，值 1=SCCRQ、2=SCCRP、4=StopCCN、6=CDN 等。整个控制通道的状态机就靠它推进，伪造它等于伪造控制消息。","sec":"类型字段无认证，一条伪造的 StopCCN 就能清空整条隧道。"},"Ns":{"short":"控制通道发送序号","more":"2 字节，本端控制通道的当前序号，只在 S=1 时存在。控制消息靠 Ns/Nr 做窗口与重传，数据消息默认不带，隧道层不为数据保可靠。","sec":"序号只用于排序与重传，不参与任何安全判定，不抗重放。"},"Nr":{"short":"期望收到的下一个序号","more":"2 字节，表示已正确收到对方该序号之前的全部报文，同时也是对它们的确认。接收窗口大小由 Receive Window Size AVP 声明。","sec":"ACK 语义可被伪造，攻击者能构造出「对端已确认」的假象。"},"AVP: Result Code":{"short":"StopCCN 里的拆隧道原因","more":"值 1 一般性错误、2 资源不足、3 协议版本不支持、4 未授权，后面还可跟可选 Error Code。拆隧道时用来告诉对端为什么断。","sec":"原因字段完全由发送方填写，被伪造时运维会被误导到错误方向。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"控制通道建隧道（可靠、带序号），数据通道搬 PPP（尽力而为）","lead":"两种报文只差一个 T 位：T=1 是控制，T=0 是数据。隧道本身不加密。","scenes":[{"name":"建控制连接 → 建会话 → 传数据 → 拆隧道","steps":[{"who":"LAC","to":"LNS","pkt":0,"bubble":"SCCRQ","hl":["Flags + Version","Tunnel ID","Session ID","AVP: Message Type","AVP: Assigned Tunnel ID"],"vals":{"Flags + Version":"0xC8 0x02 = T=1, L=1, S=1, 版本 2","Tunnel ID":"0x0000（还不知道对端的号）","Session ID":"0x0000（控制消息固定填 0）","AVP: Message Type":"1 = SCCRQ","AVP: Assigned Tunnel ID":"42（以后发给我的报文填 42）"},"say":"SCCRQ 开隧道：Tunnel ID 填 0，用 AVP 告诉对方「以后叫我 42」。","sub":"控制消息必须 L=1、S=1、O=0，缺一不可。"},{"who":"LAC","to":"LNS","pkt":0,"bubble":"CHAP 双向认证","hl":["AVP: Message Type","AVP: Host Name","AVP: Protocol Version"],"vals":{"AVP: Message Type":"SCCRQ/SCCRP 中夹带 Challenge/Response AVP","AVP: Host Name":"lac1（对端据此识别）","AVP: Protocol Version":"0x0100（v1 r0）"},"say":"控制连接建立时用 CHAP 做双向认证，比 PPP 常见的单向更强。","sub":"它基于共享密钥，且不保护数据通道。"},{"who":"LAC","to":"LNS","pkt":0,"bubble":"建会话","hl":["Tunnel ID","AVP: Assigned Tunnel ID"],"vals":{"Tunnel ID":"0x002a = 42（用对端给的号称呼它）","AVP: Assigned Tunnel ID":"会话阶段分配 Session ID = 0x0101"},"say":"隧道里再建会话：一条隧道复用多条会话，靠 Session ID 区分用户。","sub":"隧道号与会话号都是 3 幕","title":"防护在哪一步掐断它","desc":"ESP 把整条隧道包起来，1701 只对已知对端开放，ID 随机化 + Length 校验","lead":"L2TP 本身给不了安全，必须在它外面加一层。加完再重放同一场注入与拆隧道。","scenes":[{"name":"L2TP over IPsec + 白名单 + ID 随机化","steps":[{"who":"LAC","to":"LNS","pkt":1,"bubble":"ESP 封装","hl":["Flags + Version","Length","Tunnel ID"],"vals":{"Flags + Version":"外层已是 ESP，抓包看不到 L2TP 头","Length":"ESP 载荷里才是原来的 L2TP 报文","Tunnel ID":"加密后不可见，注入无从下手"},"say":"L2TP over IPsec：整个 L2TP/UDP 报文被 ESP 加密并认证。","sub":"抓包只剩 ESP，隧道号与会话号都看不见了。"},{"who":"防火墙","to":"—","pkt":2,"bubble":"白名单 + 限速","hl":["Tunnel ID","AVP: Message Type"],"vals":{"Tunnel ID":"只接受已知 LAC 地址发来的 1701","AVP: Message Type":"SCCRQ/StopCCN 单独限速并告警"},"say":"1701/UDP 只对已知 LAC 的 IP 放行，控制消息另做速率限制。","sub":"源 IP 可伪造，所以还必须有 IPsec 兜底。"},{"who":"LNS","to":"LAC","pkt":0,"bubble":"ID 随机化","hl":["AVP: Assigned Tunnel ID","AVP: Receive Window Size"],"vals":{"AVP: Assigned Tunnel ID":"用随机数生成，不用递增","AVP: Receive Window Size":"8（窗口有限，便于限速与审计）"},"say":"Tunnel/Session ID 用密码学随机数生成，并严格校验 Length 与 AVP 长度。","sub":"16 位空间熵不足，随机化只能提高盲注成本。"},{"who":"LAC","to":"LNS","pkt":0,"bubble":"AVP 认证 + H 位","hl":["AVP: Message Type","AVP: Host Name"],"vals":{"AVP: Message Type":"用 Challenge/Challenge-Response AVP 做共享密钥认证","AVP: Host Name":"敏感 AVP 置 H 位混淆其值"},"say":"控制通道用 Challenge AVP 做双向认证，敏感 AVP 置 H 位隐藏。","sub":"H 位是混淆不是加密，抓包者仍可离线尝试。"},{"who":"LNS","to":"LAC","pkt":1,"bubble":"复测","hl":["Tunnel ID","Session ID","PPP Protocol"],"vals":{"Tunnel ID":"解密后与本地表项一致才接收","Session ID":"会话照常转发，业务不中断","PPP Protocol":"0x0021 正常"},"say":"防护后复测：合法隧道的数据报文照常转发，伪造的进不来。","sub":"加密只保护管道，端点被控时仍然无效。"}],"cmds":{"linux":[{"c":"sudo ip xfrm state","n":"IPsec 的 SA 列表：有 SA 且算法非空，说明隧道被 ESP 保护","s":"补充（ip xfrm，vault 未收录）"},{"c":"sudo tcpdump -ni any -c 5 'esp'","n":"抓到的应是 ESP（协议号 50）而不是 UDP 1701，这是加密生效的直接证据","s":"补充（vault 无 tcpdump）"},{"c":"sudo iptables -L INPUT -n --line-numbers | grep 1701","n":"复核 1701 的放行规则是否已收敛到已知对端","s":"补充（iptables，vault 未收录）"}],"ps":[{"c":"Get-NetIPsecQuickModeSA | Format-Table LocalAddress,RemoteAddress,EncryptionAlgorithm","n":"快速模式 SA 的加密算法（需管理员）：非空即加密生效","s":"《系统》PowerShell.md · 网络与系统管理"},{"c":"Get-NetIPsecMainModeSA | Format-Table LocalAddress,RemoteAddress","n":"主模式 SA（需管理员）：对端身份认证是否已建立","s":"《系统》PowerShell.md · 网络与系统管理"}],"cmd":[{"c":"netsh advfirewall firewall show rule name=all | findstr /i 1701","n":"Windows 防火墙里与 1701 相关的规则，确认只对特定地址放行","s":"《系统》Windows CMD.md · netsh"},{"c":"netstat -ano -p UDP | findstr :1701","n":"复核 1701 仍在监听且对端受限","s":"《系统》Windows CMD.md · netstat"}]}}]}]}},{"proto":{"id":"ipv4","name":"IPv4","cn":"网际协议第四版","en":"Internet Protocol version 4","layer":"network","chapter":"第三章","extra":false,"oneLine":"无连接、不可靠的数据报服务：靠 20 字节首部里的地址与分片控制字段把异构链路串起来，也正因为不认证源、不校验载荷，成了欺骗与分片攻击的源头。","sections":[{"h":"网络层只承诺尽力而为，把可靠性推给端系统","p":"IP 向上只提供无连接、不可靠的数据报服务：不建连接、不保序、不重传，路由器只做“按目的地址查表转发”这一件事，转发完不保留任何状态。这样设计有三层考虑：异构链路（以太网、光纤、卫星、无线）各段差错率差异太大，网络层无法对端到端质量打包票；路由器无状态才可扩展，崩溃也不影响已有连接；真正知道“要不要重传”的只有两端主机，可靠性交给 TCP 更划算。\n\n代价写在协议里：既然路由器只管把包送到，它也就不会去验证“这个源地址是不是真的属于这条链路”“这些分片是不是同一个人发的”。本章后面所有的源地址欺骗、分片污染，前提都是这句话。"},{"h":"首部长度的单位是 4 字节，20 字节是常态、60 字节是上限","p":"首部第一个字节被切成两半：高 4 位版本号（IPv4 为 4），低 4 位首部长度（IHL），单位是 4 字节而不是字节。值 5 表示 20 字节，是绝大多数报文的实际长度；值 15 表示 60 字节，是含选项的上限。选项字段长度可变，必须用全 0 的 EOL 或全 1 的 NOP 填充到 4 字节的整数倍，填充字节随即成为首部的一部分。\n\n这个“单位陷阱”是构造畸形包最省事的地方：只要把 IHL 写大而实际字节不够，解析器就会把后面的载荷当成选项读，字段全部错位；写小则把选项当载荷，上层协议解析随之崩坏。解析器必须把 IHL、总长度、实际收到字节数三者交叉校验，才谈得上健壮。"},{"h":"标识、标志、片偏移三字段联动，才能把片装回原报文","p":"链路 MTU 装不下时就要分片，IPv4 允许源主机与沿途路由器都分片。分片时把标识字段复制到每一片，目的端据此把片归入同一队列；MF 位标记“后面还有没有片”，最后一片 MF=0；片偏移记录本片数据在原报文中的位置，单位 8 字节，所以除最后一片外每片数据长度必须是 8 的倍数。重组只在目的端做，中间路由器从不重组。\n\n课程算例：总长 3820 字节（20 首部 + 3800 数据），要求每片不超过 1420 字节。每片可装 1420−20=1400 字节且 1400=8×175，正好合格；3800÷1400 得 2 余 1000，故 3 片，数据长度 1400、1400、1000，总长 1420、1420、1020，标识全部为 23333，MF 依次 1、1、0，片偏移依次 0、175、350。"},{"h":"源地址字段没有任何验证机制，转发决策只看目的地址","p":"路由器查表时只用目的地址，从不检查源地址是否可能从该入接口进来。于是攻击者可以把源地址写成任意值：报文照样送达，回包却寄给了被冒充者。这带来三个派生特征：单向性，攻击者收不到响应，因此多用于盲攻击或反射放大；身份隐匿，路径上没有任何字段暴露真实地址；可组合性，它本身不造成破坏，但为 DNS 缓存污染、TCP 序列号预测与劫持、反射型 DDoS 提供了入场券。\n\n真正治本的手段是在接入侧做入口过滤（BCP38/uRPF）：源地址不属于该网段就直接丢弃，让伪造在源头失败，而不是在终点靠猜。这也是为什么源地址欺骗至今仍有生存空间——它取决于全球接入网的配置纪律，而不是某一台设备的功能。"},{"h":"分片把长度与位置都交给发送方填写，重组逻辑天生脆弱","p":"总长度只有 16 位、单片的长度永远合法，但“重组后有多长”没有任何字段约束：把多个合法的小片拼起来，就能得到超过 65535 字节的数据报，早期协议栈按固定 65535 字节缓冲区拷贝，直接溢出，这就是死亡之 ping。片偏移虽然必须是 8 的倍数，但“偏移 + 长度是否越过前一片末尾”无人校验，第二片落在第一片内部时，重组计算出的长度相减为负，被当成巨大无符号数，造成越界写，这就是 teardrop。\n\n更隐蔽的是污染型攻击：标识字段常按 +1 递增、可预测，伪造片抢先进入别人的重组队列，覆盖 DNS 响应里的 A 记录，再让上层校验和重新对得上，接收端就会把篡改后的结果写进缓存。所以防御的主思路是“避免分片”：用 DF 位配合 PMTUD 找路径 MTU，让 TCP 用 MSS 对齐，工程上再叠加“重叠片一律丢弃、限制重组队列与超时、对重组总长设上限”。"}],"packets":[{"title":"IPv4 首部 20 字节（无选项）+ TCP SYN","hex":"45 00 00 28 1c 46 40 00 40 06 4c c8 c0 a8 01 0a 08 08 08 08 30 39 00 50 00 00 00 01 00 00 00 00 50 02 72 10 3b 86 00 00","note":"一次 HTTP 建连，IHL=5、DF=1，总长 40 字节。","fields":[{"name":"Version","cn":"版本","off":0,"len":1,"bits":"bit0-3 = 0100（4）","tone":"version","desc":"4 位版本号，IPv4 固定为 4，与 IPv6 的 0110 区分。接收端靠它决定用哪套解析器。","sec":"版本字段与首部长度、总长度不自洽是最廉价的畸形包手法：把版本改成 6 或 IHL 改成 0，可试探协议栈分支是否越界。"},{"name":"IHL","cn":"首部长度","off":0,"len":1,"bits":"bit4-7，值 × 4 = 字节数（5~15）","tone":"ihl","desc":"本例 0x45 的低 4 位为 5，即 20 字节。单位是 4 字节，不是字节。","sec":"解析器若只信 IHL 而不与总长度、实收字节数交叉校验，会把载荷误当选项读，造成字段错位，是重叠分片与信息泄露的入口。"},{"name":"Differentiated Services","cn":"区分服务","off":1,"len":1,"bits":"前 6 位 DSCP / 后 2 位 ECN","tone":"svc","desc":"原设计为 3 位优先级 + 4 位服务类型 + 1 位保留，现按 DSCP/ECN 解释，一般为 0。","sec":"可伪造 EF 等高优先级抢占队列，或把攻击流量混进被信任的流量类，绕过按类限速的策略。"},{"name":"Total Length","cn":"总长度","off":2,"len":2,"bits":"16 位，单位字节","tone":"len","desc":"首部 + 数据之和，本例 0x0028 = 40。上限 65535，但链路 MTU 更小，超出需分片。","sec":"与实际字节数不符是分片攻击的常用手段：偏短让后续字节被当成下一层解析，偏大则诱导重组缓冲区按错误尺寸分配。"},{"name":"Identification","cn":"标识","off":4,"len":2,"bits":"16 位","tone":"id","desc":"源主机计数器产生，分片时复制到每一片，目的端靠它把片归入同一重组队列。本例 0x1c46。","sec":"许多实现按 +1 递增，可预测。猜到 IPID 就能把伪造分片塞进别人的重组队列——DNS 缓存污染成功的条件之一。"},{"name":"Flags","cn":"标志","off":6,"len":1,"bits":"bit0 保留=0 / bit1 DF / bit2 MF","tone":"flag","desc":"DF=1 表示禁止分片，超 MTU 则丢弃并回 ICMP 差错；MF=1 表示后面还有片。本例 0x40 → DF=1、MF=0。","sec":"DF 是 PMTUD 的支点，封掉 ICMP 类型 3 编码 4 会让 PMTUD 黑洞；MF 组合可制造永不完成的重组队列，耗尽缓冲。"},{"name":"Fragment Offset","cn":"片偏移","off":6,"len":2,"bits":"高 3 位为标志，低 13 位为偏移（单位 8 字节）","tone":"flag","desc":"本片数据在原报文中的起点，除以 8 后填入 13 位。本例 0x4000 → DF=1、偏移 0。","sec":"teardrop 的核心：偏移本身合法（8 的倍数），但与上一片长度重叠，重组时长度相减为负被当作巨大无符号数，越界写导致崩溃。"},{"name":"Time To Live","cn":"生存时间","off":8,"len":1,"bits":"8 位，1~255","tone":"ttl","desc":"实际语义是跳数上限，每经一个路由器减 1，为 0 则丢弃并回 ICMP 超时。本例 64。","sec":"可用于逐跳探测拓扑；也能当隐蔽通道载体（把数据编码进 TTL 序列），或让报文恰好死在目标前一跳。"},{"name":"Protocol","cn":"协议","off":9,"len":1,"bits":"8 位","tone":"proto","desc":"指出载荷交给谁：1=ICMP、6=TCP、17=UDP、41=IPv6、50=ESP、51=AH。本例 6。","sec":"值可任意填写，与端口、内容不一致时能骗过只看协议号的粗粒度 ACL；它也是接收端决定走 AH/ESP 处理的唯一依据。"},{"name":"Header Checksum","cn":"首部检验和","off":10,"len":2,"bits":"16 位反码求和","tone":"cksum","desc":"只覆盖首部，不覆盖数据。每跳 TTL 减 1 后必须重算，否则被丢弃。","sec":"不校验载荷，改数据最便宜；反过来说，只改 TTL 不重算会被丢，攻击者构造畸形包时必须同步修正校验和，这本身成了检测特征。"},{"name":"Source Address","cn":"源地址","off":12,"len":4,"bits":"32 位","tone":"addr","desc":"发送方地址，本例 192.168.1.10。转发过程中无人核验它是否属于该入接口的网段。","sec":"可任意伪造，是反射放大、DNS 污染、TCP 劫持的前置条件；单向性使其多用于盲攻击，受害者无法反查真实来源。"},{"name":"Destination Address","cn":"目的地址","off":16,"len":4,"bits":"32 位，可为单播/组播/广播","tone":"addr","desc":"本例 8.8.8.8。路由表按它查下一跳，是唯一真正影响转发的地址。","sec":"定向广播地址加伪造源是 Smurf 放大的支点；组播地址可让一次发送命中多个受害者，扩大放大倍数。"},{"name":"TCP Header (payload)","cn":"TCP 首部（载荷）","off":20,"len":20,"bits":"20 字节","tone":"port","desc":"源端口 0x3039（12345）→ 目的端口 0x0050（80），序号 1，SYN 置位，窗口 29200，校验和已按伪首部计算。","sec":"端口是服务指纹，也是 NAT 与策略匹配的依据；序号可预测时（老式实现按时间递增）会被用于 TCP 劫持，这也是源地址欺骗的经典搭档。"}]},{"title":"含源路由选项的 IPv4 首部（IHL=7，28 字节）","hex":"47 00 00 24 2b 17 00 00 20 01 2f 93 0a 00 00 05 ac 10 00 09 83 07 04 0a 00 00 01 00 08 00 f3 2c 04 d2 00 01","note":"选项为 LSRR（松散源路由），7 字节选项 + 1 字节 EOL 填充；载荷是 8 字节 ICMP 回送请求首部。","fields":[{"name":"Version","cn":"版本","off":0,"len":1,"bits":"bit0-3 = 0100（4）","tone":"version","desc":"4 位版本号，本例 0x47 的高 4 位为 4。","sec":"版本与首部长度、总长度组合不自洽是最廉价的畸形包构造手法。"},{"name":"IHL","cn":"首部长度","off":0,"len":1,"bits":"bit4-7 = 7 → 28 字节","tone":"ihl","desc":"有选项时 IHL 随之增大，7 个单位即 28 字节，剩余选项空间还有 32 字节可用。","sec":"把 IHL 写大而实际字节不足，解析器会把载荷当选项读，字段全部错位。"},{"name":"Differentiated Services","cn":"区分服务","off":1,"len":1,"bits":"前 6 位 DSCP / 后 2 位 ECN","tone":"svc","desc":"本例 0x00，普通尽力而为。","sec":"可伪造高优先级抢占队列，把攻击流量混入被信任的流量类绕过限速。"},{"name":"Total Length","cn":"总长度","off":2,"len":2,"bits":"16 位","tone":"len","desc":"本例 0x0024 = 36 = 28 首部 + 8 载荷。","sec":"总长度小于首部长度时数据长度为负，是典型的畸形包判据。"},{"name":"Identification","cn":"标识","off":4,"len":2,"bits":"16 位","tone":"id","desc":"本例 0x2b17，用于分片归并；若不分片则仅供重组队列取号。","sec":"递增的 IPID 可预测，是分片污染的前提条件之一。"},{"name":"Flags","cn":"标志","off":6,"len":1,"bits":"bit0 保留 / bit1 DF / bit2 MF","tone":"flag","desc":"本例 DF=0、MF=0，允许沿途路由器分片。","sec":"DF=1 配合 PMTUD 可避免分片；MF 组合可制造永不完成的重组队列。"},{"name":"Fragment Offset","cn":"片偏移","off":6,"len":2,"bits":"高 3 位标志，低 13 位偏移（×8）","tone":"flag","desc":"本例 0，即完整报文的起始片。","sec":"偏移重叠是 teardrop 的核心；偏移必须与已到达片首尾相接。"},{"name":"Time To Live","cn":"生存时间","off":8,"len":1,"bits":"8 位","tone":"ttl","desc":"本例 0x20 = 32，说明这台主机到目标不超过 32 跳。","sec":"可用于逐跳探测拓扑，也能当隐蔽通道载体；值太小会让报文死在半路。"},{"name":"Protocol","cn":"协议","off":9,"len":1,"bits":"8 位 = 1（ICMP）","tone":"proto","desc":"本例载荷是 ICMP 回送请求，故协议字段为 1。","sec":"值可伪造；与端口、内容不一致时能骗过只看协议号的粗粒度 ACL。"},{"name":"Header Checksum","cn":"首部检验和","off":10,"len":2,"bits":"16 位反码求和","tone":"cksum","desc":"本例 0x2f93，按 28 字节首部计算；有选项时计算范围随之变长。","sec":"只覆盖首部，改载荷不受影响；攻击者构造畸形包必须同步修正它。"},{"name":"Source Address","cn":"源地址","off":12,"len":4,"bits":"32 位","tone":"addr","desc":"本例 10.0.0.5。","sec":"可任意伪造，是反射放大与劫持的基础；同网段伪造尤其容易奏效。"},{"name":"Destination Address","cn":"目的地址","off":16,"len":4,"bits":"32 位","tone":"addr","desc":"本例 172.16.0.9。","sec":"定向广播地址加伪造源是 Smurf 放大的支点。"},{"name":"Options","cn":"选项","off":20,"len":7,"bits":"类型 1 + 长度 1 + 指针 1 + 地址 4","tone":"opt","desc":"0x83 = LSRR（松散源路由），长度 7，指针 4（下一个待处理地址槽的偏移），地址 10.0.0.1。其他类型：0x89 严格源路由、0x07 记录路由、0x44 时间戳。","sec":"源路由让报文按攻击者指定的路径走，可从防火墙的“可信邻居”方向进入，绕过基于入接口的 ACL；现代设备通常直接丢弃带源路由选项的报文。"},{"name":"Padding","cn":"填充","off":27,"len":1,"bits":"1 字节","tone":"pad","desc":"0x00（EOL）把选项补齐到 4 字节整数倍，本例首部因此为 28 字节。","sec":"填充常被解析器忽略，可作隐蔽数据载体；填充长度算错则首部与载荷边界错位。"},{"name":"ICMP (payload)","cn":"ICMP 载荷","off":28,"len":8,"bits":"8 字节","tone":"type","desc":"类型 8、代码 0 的回送请求首部，标识 0x04d2、序号 1，无数据。","sec":"ICMP 只有 8 字节固定头，其后全可自由填充，这也是隧道能藏数据的原因。"}]},{"title":"分片示例：第 2 片（MF=0，偏移=2）","hex":"45 00 00 24 1c 47 00 02 40 11 8c be c0 a8 01 0a 08 08 08 08 41 42 43 44 45 46 47 48 49 4a 4b 4c 4d 4e 4f 50","note":"原报文 52 字节（20+32），链路 MTU 36，故切成两片各 16 字节数据；本片是后 16 字节。","fields":[{"name":"Version + IHL","cn":"版本与首部长度","off":0,"len":1,"bits":"bit0-3 版本=4 / bit4-7 IHL=5","tone":"version","desc":"本例 0x45，即无选项的 20 字节首部。分片时每片都复制一份完整首部，开销随片数放大。","sec":"首部长度与总长度不自洽是畸形包的常见构造；分片场景下还会与偏移字段交叉出错。"},{"name":"Differentiated Services","cn":"区分服务","off":1,"len":1,"bits":"前 6 位 DSCP / 后 2 位 ECN","tone":"svc","desc":"本例 0x00。每片都复制同一个值，重组后不会因分类标记不同而错判。","sec":"可伪造高优先级抢占队列，把攻击流量混进被信任的流量类绕过限速。"},{"name":"Total Length","cn":"总长度","off":2,"len":2,"bits":"16 位","tone":"len","desc":"本例 0x0024 = 36 = 20 + 16。每片都带完整 20 字节首部，故小片效率极低。","sec":"大量极小分片可放大首部开销、耗尽重组队列，是低成本 DoS 手法。"},{"name":"Identification","cn":"标识","off":4,"len":2,"bits":"16 位","tone":"id","desc":"本例 0x1c47，与第 1 片完全相同，接收端据此归并。","sec":"标识可预测是分片污染的前提：猜到 IPID 才能把伪造片塞进别人的重组队列。"},{"name":"Flags + Fragment Offset","cn":"标志与片偏移","off":6,"len":2,"bits":"bit0 保留 / bit1 DF / bit2 MF；低 13 位偏移 ×8","tone":"flag","desc":"本例 0x0002：DF=0、MF=0（最后一片）、偏移 2，即本片数据从原报文第 16 字节开始。","sec":"偏移必须与已到达片的长度首尾相接。重叠时不同实现“先到者胜/后到者胜”不一致，正是绕过 IDS 与污染缓存的着力点。"},{"name":"Time To Live","cn":"生存时间","off":8,"len":1,"bits":"8 位","tone":"ttl","desc":"本例 64。分片后每一片独立转发、独立减跳，可能走不同路径、乱序到达。","sec":"不同片走不同路径会让基于路径的检测失效，也让按流统计的设备漏计。"},{"name":"Protocol","cn":"协议","off":9,"len":1,"bits":"8 位","tone":"proto","desc":"本例 17（UDP）。分片后只有第一片含上层首部，后续片仍带着协议号。","sec":"只有第一片含端口，后续片没有端口信息，按端口过滤的设备对分片只能放行或全丢，这是分片绕过防火墙的原理。"},{"name":"Header Checksum","cn":"首部检验和","off":10,"len":2,"bits":"16 位","tone":"cksum","desc":"本例 0x8cbe，按本片 20 字节首部计算；每片的校验和各自独立。","sec":"分片场景下校验和只护住首部，片内数据仍无人校验，污染型攻击正是钻这个空子。"},{"name":"Source Address","cn":"源地址","off":12,"len":4,"bits":"32 位","tone":"addr","desc":"本例 192.168.1.10，与第 1 片一致。","sec":"重组只按标识与偏移归并，不校验来源；伪造片只要标识对上就能混入。"},{"name":"Destination Address","cn":"目的地址","off":16,"len":4,"bits":"32 位","tone":"addr","desc":"本例 8.8.8.8。","sec":"同一标识的片若被导向不同目的地址，接收端之间不会互相告知，形成“分片拆分”检测盲区。"},{"name":"Fragment Data","cn":"分片数据","off":20,"len":16,"bits":"16 字节","tone":"data","desc":"本例为原报文第 16~31 字节，内容 41~50（ASCII A~P）。","sec":"数据区长度的上限由 MTU 决定；大量小片可放大首部开销并耗尽重组队列。"}]}],"attacks":[{"name":"IP Source Address Spoofing","cn":"源地址欺骗（盲攻击/反射）","impact":"受害者相信报文来自被冒充者，回包与追责全部指向无辜第三方。","steps":[{"who":"攻击者","to":"受害者主机","label":"IP 首部 源=192.168.1.10（冒充者），目的=受害者，TCP 标志 SYN","note":"路径上没有任何设备核验源地址，报文照常转发。"},{"who":"受害者主机","to":"被冒充者","label":"SYN+ACK 目的=192.168.1.10","note":"回包寄给了被冒充者，攻击者看不到，形成单向性。"},{"who":"被冒充者","to":"受害者主机","label":"收到莫名其妙的 SYN+ACK，回 RST","note":"无辜主机被卷入，日志里留下的是它的地址。"},{"who":"受害者主机","to":"—","label":"半连接表被占满，合法用户无法建连","note":"若用随机源地址泛洪，即 SYN Flood；防守方按源 IP 封禁会误伤第三方。"},{"who":"攻击者","to":"—","label":"不发任何可追溯的报文，只保留伪造模板","note":"同一模板可复用于 DNS 污染、TCP 序列号猜测，成为后续攻击的地基。"}],"defense":"接入侧入口过滤（BCP38/uRPF）让伪造在源头失败；边界再加基于源地址与入接口一致性的 ACL。"},{"name":"Teardrop","cn":"泪滴攻击（重叠分片）","impact":"重组时长度计算为负被当作巨大无符号数，协议栈越界写导致崩溃或重启。","steps":[{"who":"攻击者","to":"受害者主机","label":"片 1：标识=0x1234，偏移=0，MF=1，数据 1400 字节","note":"完全合法的一片，先占住重组队列的位置。"},{"who":"攻击者","to":"受害者主机","label":"片 2：标识=0x1234，偏移=100（即第 800 字节），MF=0，数据 1400 字节","note":"偏移是 8 的倍数，字段本身合法；但起点落在片 1 内部。"},{"who":"受害者主机","to":"—","label":"重组：本片起点 800 − 已写 1400 = −600","note":"实现按无符号数解释，长度变成极大值。"},{"who":"受害者主机","to":"—","label":"按该长度 memcpy 越界写","note":"堆或栈被破坏，进程崩溃、系统蓝屏或重启。"},{"who":"受害者主机","to":"—","label":"重组队列残留，后续合法分片继续错拼","note":"即使不崩溃，也会造成持续丢包与错乱。"}],"defense":"收到重叠分片一律丢弃（不合并、不覆盖），并对重组总长与队列数量设上限。"},{"name":"Ping of Death","cn":"死亡之 ping","impact":"重组后总长超过 65535 字节的 ICMP 回送请求撑爆固定缓冲区，主机死机。","steps":[{"who":"攻击者","to":"路由器","label":"ICMP Echo Request，载荷构造为 65536+ 字节","note":"单个 IP 报文受 16 位总长度限制，攻击者直接构造超长载荷交协议栈分片。"},{"who":"路由器","to":"受害者主机","label":"按 MTU=1500 切成 40+ 片，每片总长均 ≤1500","note":"每一片单独看都完全合法，沿途过滤设备无异常可查。"},{"who":"受害者主机","to":"—","label":"逐片收下，按标识+偏移归并","note":"协议本身没有“重组后总长上限”的强校验。"},{"who":"受害者主机","to":"—","label":"把 65536+ 字节拷入 65535 字节固定缓冲区","note":"早期 Windows 等实现分配尺寸按 16 位字段计算，直接溢出。"},{"who":"受害者主机","to":"—","label":"堆栈破坏 → 崩溃、挂起，需重启","note":"单包即可拒绝服务，属于典型的剧毒包/杀手包。"}],"defense":"对重组结果做总长上限校验，并在协议栈层拒绝超长重组；及时打补丁。"},{"name":"Fragment Bypass","cn":"分片绕过防火墙/IDS","impact":"过滤设备只看到第一片，后续片被放行，被禁止的载荷进入内网。","steps":[{"who":"攻击者","to":"边界防火墙","label":"片 1：偏移 0，8 字节数据，内容为一个“允许”的 UDP 首部（目的端口 53）","note":"防火墙按端口过滤，只检查第一片，判定为合法 DNS 流量。"},{"who":"边界防火墙","to":"内网主机","label":"放行片 1","note":"端口信息只存在于第一片，后续片没有端口可查。"},{"who":"攻击者","to":"内网主机","label":"片 2：偏移 1（第 8 字节起），承载真正的攻击载荷（如指向 3389 的会话数据）","note":"无端口字段，防火墙只能按“分片”整体放行或整体丢弃。"},{"who":"内网主机","to":"—","label":"重组出完整报文，上层把它交给真实目的端口","note":"策略被绕过，且日志里只有一次“DNS 请求”。"},{"who":"攻击者","to":"内网主机","label":"再用重叠片覆盖关键字段（如让第二片覆盖第一片的端口）","note":"不同设备重组策略不同，IDS 看到的内容与主机实际处理的内容可以不一致。"}],"defense":"边界设备重组后再检测，或直接丢弃分片；对必须放行的协议做应用层代理而非端口放行。"}],"defenses":[{"name":"入口/出口过滤（BCP38 + uRPF）","how":"在接入路由器上按入接口做源前缀校验：若源地址的反向路由不指向该入接口，判为伪造直接丢弃；运营商侧同时过滤私有地址、回环地址、组播源等不可路由前缀。","limit":"依赖全球接入网配置纪律，未部署的自治域仍可发包；多宿主与非对称路由场景下严格模式 uRPF 会误杀合法流量，只能退化为松散模式，防不住同前缀内的伪造。"},{"name":"重叠分片丢弃 + 重组资源上限","how":"重组时只接受首尾严格相接的分片，任何重叠、跨越、超长一律整组丢弃；同时限制同时存在的重组队列数、单队列分片数与重组超时，并对重组总长设硬上限。","limit":"不同操作系统对重叠片的处理历史上并不统一，严格丢弃会改变与旧实现的互操作行为；限制队列数本身在洪泛下仍会丢合法流量，只是把崩溃换成丢包。"},{"name":"PMTUD + TCP MSS 对齐，尽量不分片","how":"发送方置 DF=1 按本地 MTU 发包，收到 ICMP 类型 3 编码 4（需要分片但 DF 置位）就调小尺寸重发，直到不再收到；TCP 在 SYN 阶段用 MSS 选项把报文段对齐路径 MTU，从源头避免分片。","limit":"完全依赖 ICMP 差错报文能回来，防火墙全量封禁 ICMP 会造成 PMTUD 黑洞（能 ping 通却打不开网页）；UDP 无握手、报文大小由应用给定，无法自适应，分片在 UDP 上仍难避免。"},{"name":"丢弃带源路由选项与畸形首部的报文","how":"边界设备解析首部后，凡出现 LSRR/SSRR 源路由选项、IHL 与总长度不自洽、总长小于首部长度、版本与解析分支不符的报文，直接丢弃并记日志。","limit":"需要设备具备逐字段解析能力，纯硬件线速转发设备往往只做五元组匹配；合法排错场景偶尔使用记录路由，一刀切会影响运维。"}],"calcs":["checksum","frag"],"quiz":[{"q":"某 IPv4 数据报总长 3020 字节（20 字节首部），需分片为不超过 820 字节，第 3 片的片偏移是多少？","options":["200","150","300","1600"],"a":0,"why":"数据 3000 字节，每片可装 800 字节且 800=8×100，共 4 片（800/800/800/600）。第 3 片起点是第 1600 字节，1600÷8=200。偏移的单位是 8 字节，直接用字节数会算成 1600。"},{"q":"IP 首部检验和能发现载荷被篡改吗？","options":["能，它覆盖整个数据报","不能，它只覆盖首部","能，但只在 DF=0 时","不能，因为它只是奇偶校验"],"a":1,"why":"它是 16 位反码求和，覆盖范围仅限首部。载荷完整性只能靠 TCP/UDP 校验和或 IPSec 兜底，这也是分片污染攻击必须同时骗过上层校验和的原因。"},{"q":"为什么用随机源地址的 SYN 泛洪，按源 IP 封禁往往无效甚至有害？","options":["因为源地址被加密了","因为 SYNFIN 不走 IP 层","因为源地址可伪造，封禁会误伤被冒充的正常主机","因为封禁只对 UDP 生效"],"a":2,"why":"转发只看目的地址、不验证源地址，攻击者可每包换一个伪造源；防守方按源封禁等于替攻击者打击第三方，真实攻击者始终不出现。"}]},"script":{"id":"ipv4","notes":{"IHL":{"short":"首部长度，单位 4 字节","more":"4 位，值 ×4 才是字节数：5 = 20 字节（常态），15 = 60 字节上限。选项必须填充到 4 字节整数倍，所以 IHL 能把选项和载荷的边界挪来挪去。","sec":"写大而字节不够，解析器就把载荷当选项读，字段全部错位。"},"Total Length":{"short":"整包长度，16 位上限 65535","more":"含首部与数据的字节数，最大 65535。它只约束单个分片，不约束重组后的总长——死亡之 ping 正是钻这一点。","sec":"与 IHL 不自洽（总长 < 首部长）是最经典的畸形包构造。"},"Identification":{"short":"分片同组编号，可被猜中","more":"同一原始报文的所有分片复制同一个标识（IPv4 16 位，IPv6 分片头 32 位），接收端据此归队。历史上多为递增计数器，因此可预测。","sec":"猜中标识就能把伪造分片塞进别人的重组队列，篡改上层报文。"},"Fragment Offset":{"short":"本片在原文中的位置","more":"13 位，单位 8 字节，所以除最后一片外每片数据长度必须是 8 的倍数。偏移本身合法，但「偏移 + 长度」是否越过前一片没有字段约束。","sec":"重叠偏移让重组长度算成负数，是 teardrop 的落点。"},"Flags + Fragment Offset":{"short":"MF 标记还有没有下一片","more":"高 3 位为保留、DF、MF；低 13 位是偏移（×8）。MF=1 表示后面还有片，MF=0 表示这是最后一片；DF=1 禁止分片，超 MTU 只能丢并回 ICMP。","sec":"重叠片与「偏移指向已收区间」都要靠这里的组合来判断。"},"Time To Live":{"short":"跳数预算，每跳减 1","more":"8 位，1~255，每经过一台路由器减 1，减到 0 就丢弃并回 ICMP 超时。它同时是防环机制和路径长度的间接度量。","sec":"TTL 异常一致或递增，常被用来判断伪造源地址的真实跳数。"},"Header Checksum":{"short":"只校验首部，不校验载荷","more":"16 位反码求和，只覆盖 IP 首部，每跳因 TTL 变化都要重算。载荷完整性完全不在这里。","sec":"载荷被改 IP 层查不出来，这也解释了为什么分片污染要靠上层校验和兜底。"},"Options":{"short":"可选字段：源路由、记录路由","more":"长度可变，LSRR/SSRR 可以把中转节点地址写进首部，从而指定报文路径；记录路由则让沿途设备填地址。出现选项时 IHL 随之变大。","sec":"源路由让实际路径与「看起来的来源」脱钩，可绕过基于接口的 ACL。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"20 字节首部跟着地址走，装不下就切片，目的端再拼回来","lead":"先看一个包从主机到目的端。三件事要盯住：地址决定去向、TTL 决定寿命、标识与偏移决定能不能拼回原样。","scenes":[{"name":"首部 → 转发 → 分片 → 重组","steps":[{"who":"主机A","to":"网关R1","pkt":0,"bubble":"IP 数据报 40 字节","hl":["Version","IHL","Total Length","Source Address","Destination Address"],"vals":{"Version":"4","IHL":"5（20 字节）","Total Length":"40","Source Address":"192.168.1.10","Destination Address":"8.8.8.8"},"say":"首部二十字节：版本 4、IHL=5，源与目的地址各占 4 字节。","sub":"地址是路由器唯一要读的东西，也是唯一没人核对的字段。"},{"who":"网关R1","to":"目的服务器","pkt":0,"bubble":"转发：TTL−1","hl":["Time To Live","Header Checksum","Protocol"],"vals":{"Time To Live":"64 → 63","Header Checksum":"每跳重算","Protocol":"6（TCP）"},"say":"每跳把 TTL 减一并重算首部检验和——只校验首部，不碰载荷。","sub":"载荷被改了 IP 层也发现不了，完整性得靠 TCP 或 IPSec。"},{"who":"网关R1","to":"目的服务器","pkt":2,"bubble":"分片：52 → 2×36 字节","hl":["Total Length","Identification","Flags + Fragment Offset","Fragment Data"],"vals":{"Total Length":"36","Identification":"0x1c47","Flags + Fragment Offset":"offset=2（第 16 字节）, MF=0","Fragment Data":"16 字节"},"say":"下一跳 MTU 只有 36 字节：52 字节被切成两片，标识原样复制。","sub":"偏移单位是 8 字节，所以除最后一片外长度必须是 8 的倍数。"},{"who":"目的服务器","to":"—","pkt":2,"bubble":"重组：按标识归队","hl":["Identification","Flags + Fragment Offset","Fragment Data"],"vals":{"Identification":"0x1c47 同组","Flags + Fragment Offset":"offset=2 → 从第 16 字节写起","Fragment Data":"拼回 32 字节"},"say":"目的端按「标识 + 偏移」归队，MF=0 说明这是最后一片。","sub":"中间路由器从不重组，只把片各自送到。"},{"who":"主机A","to":"网关R1","pkt":1,"bubble":"带 LSRR 选项的 28 字节首部","hl":["IHL","Options","Protocol"],"vals":{"IHL":"7（28 字节）","Options":"LSRR 9.0.0.1","Protocol":"1（ICMP）"},"say":"可选字段能把中转节点写进首部，IHL 因此从 5 变成 7。","sub":"排障时有用，但它能让报文从「被信任的邻居」进来。"}],"cmds":{"linux":[{"c":"ip -4 route get 8.8.8.8","n":"看这条目的地址走哪个出口、源地址被选成哪个——转发决策的全部输入","s":"《系统》Linux.md · ip"},{"c":"ping -M do -s 1472 8.8.8.8","n":"DF=1 打 1472 字节载荷，能通说明路径 MTU 1500，全程没分片","s":"《系统》Linux.md · ping"},{"c":"traceroute -n 8.8.8.8","n":"逐跳列出路径与 RTT，某跳之后全星号通常是策略丢包而非断开","s":"补充（vault 无 traceroute，看逐跳路径必备）"}],"ps":[{"c":"Test-NetConnection 8.8.8.8 -InformationLevel Detailed","n":"本机视角的连通性：是否可达、走了哪个源地址、RTT 多少","s":"《系统》PowerShell.md · Test-NetConnection"}],"cmd":[{"c":"tracert -d 8.8.8.8","n":"-d 不反解域名，最快看出在第几跳开始不通","s":"《系统》Windows CMD.md · tracert"},{"c":"ping -f -l 1472 8.8.8.8","n":"-f 置 DF、-l 指定载荷；1472+28=1500，通即证明无需分片","s":"《系统》Windows CMD.md · ping"}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"源地址没人核对，分片没人担保——两处空白各开一扇门","lead":"本幕两招都只利用一件事：路由器只按目的地址转发、接收端只按标识与偏移归队。","scenes":[{"name":"源地址欺骗：伪造源，回包打给第三方","steps":[{"who":"攻击者","to":"目的服务器","pkt":0,"bubble":"SYN｜源=192.168.1.10","evil":true,"hl":["Source Address","Destination Address","Protocol"],"vals":{"Source Address":"192.168.1.10（冒充别人）","Destination Address":"8.8.8.8","Protocol":"6（TCP）"},"say":"源地址随手填成别人的：没有一台设备核对它是否属于这条链路。","sub":"转发只看目的地址，源地址只被抄进日志。"},{"who":"目的服务器","to":"被冒充者","pkt":0,"bubble":"SYN+ACK → 192.168.1.10","hl":["Destination Address","Source Address"],"vals":{"Destination Address":"192.168.1.10","Source Address":"8.8.8.8"},"say":"回包按源地址寄出，落到被冒充者头上，攻击者根本收不到。","sub":"这就是单向性：只能做盲攻击或反射。"},{"who":"被冒充者","to":"目的服务器","pkt":0,"bubble":"RST","hl":["Source Address","Destination Address","Time To Live"],"vals":{"Source Address":"192.168.1.10（真实主人）","Destination Address":"8.8.8.8","Time To Live":"64"},"say":"无辜主机收到莫名其妙的 SYN+ACK，只能回 RST，日志里留下的是它。","sub":"追责、封禁、告警全部指向第三方。"},{"who":"攻击者","to":"目的服务器","pkt":0,"bubble":"SYN ×N｜源随机","evil":true,"hl":["Source Address","Time To Live"],"vals":{"Source Address":"每次都换","Time To Live":"随机"},"say":"换一个源地址再来一次：按源 IP 封禁就变成误伤第三方。","sub":"随机伪造源的 SYN 泛洪，是最省事的拒绝服务。"},{"who":"攻击者","to":"—","pkt":0,"bubble":"模板复用","hl":["Source Address"],"vals":{"Source Address":"192.168.1.10"},"say":"整场攻击里，攻击者的真实地址从未出现在任何字段中。","sub":"同一份模板可直接用于 DNS 污染与序列号猜测。"}],"cmds":{"linux":[{"c":"sudo tcpdump -ni any 'ip src 192.168.1.10 and tcp[tcpflags] & tcp-syn != 0'","n":"抓「以被冒充者名义发来的 SYN」：本不该出现在这个方向的流量","s":"补充（vault 无 tcpdump，抓伪造报文必备）"},{"c":"sudo hping3 -S -a 192.168.1.10 -p 80 8.8.8.8 -c 3","n":"-a 指定伪造源地址，发 3 个 SYN 看是否被路径丢弃（仅授权环境）","s":"补充（hping3 是构造伪造源分组的标准工具）"},{"c":"ip -4 route get 192.168.1.10","n":"反查该源地址的回程路由，uRPF 就是拿它和入接口比对","s":"《系统》Linux.md · ip"}],"ps":[{"c":"Test-NetConnection 8.8.8.8 -Port 80","n":"从本机看能否建连；受害者侧看到的是「连上了又被 RST」","s":"《系统》PowerShell.md · Test-NetConnection"}],"cmd":[{"c":"netstat -an | findstr 8.8.8.8","n":"连接表里只有被冒充的那个源地址，找不到真正发包的人","s":"《系统》Windows CMD.md · netstat"}]}},{"name":"泪滴：重叠分片让长度算成负数","steps":[{"who":"攻击者","to":"受害者主机","pkt":2,"bubble":"片 1｜offset=0 MF=1","evil":true,"hl":["Identification","Flags + Fragment Offset","Total Length","Fragment Data"],"vals":{"Identification":"0x1234","Flags + Fragment Offset":"offset=0, MF=1","Total Length":"1420","Fragment Data":"1400 字节"},"say":"第一片完全合法：偏移 0、MF=1，先占住重组队列的位置。","sub":"接收端靠标识把片归进同一个队列。"},{"who":"攻击者","to":"受害者主机","pkt":2,"bubble":"片 2｜offset=100","evil":true,"hl":["Identification","Flags + Fragment Offset"],"vals":{"Identification":"0x1234 同组","Flags + Fragment Offset":"offset=100（第 800 字节）, MF=0"},"say":"第二片偏移写成 100，起点落在第一片内部，字段本身仍合法。","sub":"「偏移 + 长度」是否越过前一片，没有任何字段约束。"},{"who":"受害者主机","to":"—","pkt":2,"bubble":"重组：算长度","hl":["Flags + Fragment Offset","Fragment Data"],"vals":{"Flags + Fragment Offset":"offset=100","Fragment Data":"800（起点）− 1400（已写）"},"say":"重组时「本片起点减已写长度」得 −600，被当成巨大无符号数。","sub":"长度一算错，后面的拷贝就没有边界。"},{"who":"受害者主机","to":"—","pkt":2,"bubble":"按该长度 memcpy","hl":["Fragment Data","Total Length"],"vals":{"Fragment Data":"越界写","Total Length":"远超缓冲区"},"say":"按这个长度拷贝，堆或栈被写穿，协议栈崩溃、主机重启。","sub":"几个分片就能打掉一台主机，不必占带宽。"},{"who":"受害者主机","to":"—","pkt":2,"bubble":"队列残留","hl":["Identification","Flags + Fragment Offset"],"vals":{"Identification":"0x1234 仍在队列","Flags + Fragment Offset":"后续片继续错拼"},"say":"即使不崩溃，残留队列也会让后续合法分片继续错拼、持续丢包。","sub":"只发片不发全，同样能耗尽重组资源。"}],"cmds":{"linux":[{"c":"sudo tcpdump -ni any 'ip[6:2] & 0x1fff != 0'","n":"只抓片偏移非 0 的分片，看它们是否首尾相接、有无重叠","s":"补充（vault 无 tcpdump，分片取证必备）"},{"c":"nstat -az | grep -i reasm","n":"看 IpReasmReqds / IpReasmFails：失败数上涨说明收到异常或残缺分片","s":"补充（iproute2 的 nstat，比读 /proc/net/snmp 省事）"}],"ps":[{"c":"Get-NetIPAddress -AddressFamily IPv4 | Select IPAddress,PrefixLength,InterfaceAlias","n":"列出本机地址与接口，确认哪块网卡在收分片","s":"《系统》PowerShell.md · Get-NetIPAddress"}],"cmd":[{"c":"netsh interface ipv4 show subinterfaces","n":"看各接口 MTU，判断多大的包会被切、切出来多少片","s":"《系统》Windows CMD.md · netsh"},{"c":"ping -l 1472 -f 8.8.8.8","n":"自己造一个 DF 大包，确认路径 MTU 与分片边界","s":"《系统》Windows CMD.md · ping"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"把伪造按在入口，把重叠片按在重组之前，把分片从源头消掉","lead":"两条思路：让伪造到不了（入口过滤），让重组不成立（重叠即丢、尽量不分片）。","scenes":[{"name":"入口过滤 + 重叠即丢 + 不分片","steps":[{"who":"接入路由器","to":"—","pkt":0,"bubble":"uRPF：反查源地址","hl":["Source Address","Destination Address"],"vals":{"Source Address":"192.168.1.10（伪造）","Destination Address":"反向路由不指向此接口"},"say":"入口过滤拿源地址反查路由：对不上入接口就当场丢弃。","sub":"BCP38 + uRPF，让伪造在源头失败。"},{"who":"边界防火墙","to":"—","pkt":2,"bubble":"重叠片 → 整组丢弃","hl":["Flags + Fragment Offset","Identification"],"vals":{"Flags + Fragment Offset":"offset=100 与已收区间重叠","Identification":"0x1234 整组丢"},"say":"重叠分片一律整组丢弃，不合并也不覆盖，teardrop 失去前提。","sub":"同时给重组队列数与总长设硬上限。"},{"who":"边界防火墙","to":"—","pkt":1,"bubble":"源路由选项 → 丢弃","hl":["Options","IHL"],"vals":{"Options":"LSRR / SSRR","IHL":"7"},"say":"带源路由选项的报文在边界直接丢，借可信邻居绕 ACL 的路被掐掉。","sub":"源路由正常业务几乎不用，代价接近零。"},{"who":"主机A","to":"网关R1","pkt":0,"bubble":"DF=1 按 MTU 发","hl":["Flags","Total Length"],"vals":{"Flags":"DF=1","Total Length":"1500"},"say":"发端置 DF 按 MTU 发包，收到 ICMP 3/4 再调小——从源头不分片。","sub":"不分片，就没有队列可污染、没有偏移可重叠。"},{"who":"网关R1","to":"主机A","pkt":0,"bubble":"ICMP 3/4 报出下一跳 MTU","hl":["Total Length","Flags"],"vals":{"Total Length":"1420 重发","Flags":"DF=1"},"say":"按报出的 MTU 调小重发，直到不再收到「需要分片」的差错。","sub":"ICMP 全封会造成黑洞：能 ping 通、大包不通。"}],"cmds":{"linux":[{"c":"sysctl net.ipv4.conf.all.rp_filter net.ipv4.conf.eth0.rp_filter","n":"1 = 严格 uRPF（反查必须走同一接口），2 = 松散模式，0 = 关闭","s":"补充（vault 无 rp_filter 小节，源地址校验的开关）"},{"c":"ping -M do -s 1472 8.8.8.8","n":"验证 PMTUD 生效：不报错说明路径 MTU 1500 且无需分片","s":"《系统》Linux.md · ping"},{"c":"sudo tcpdump -ni any 'ip[6:2] & 0x1fff != 0'","n":"过滤后应只剩零散合法分片；持续出现重叠片说明策略没生效","s":"补充（vault 无 tcpdump）"}],"ps":[{"c":"Get-NetIPAddress -AddressFamily IPv4 | Select IPAddress,PrefixLength","n":"核对本机前缀，作为「源地址该不该出现在这个网段」的判据","s":"《系统》PowerShell.md · Get-NetIPAddress"}],"cmd":[{"c":"netsh interface ipv4 show subinterfaces","n":"确认各接口 MTU，避免人为把 MTU 调小后又出现大量分片","s":"《系统》Windows CMD.md · netsh"},{"c":"ping -f -l 1472 8.8.8.8","n":"置 DF 探路，出现「需要拆分但设置了 DF」即该跳 MTU 偏小","s":"《系统》Windows CMD.md · ping"}]}}]}]}},{"proto":{"id":"ipv6","name":"IPv6","cn":"网际协议第六版","en":"Internet Protocol version 6","layer":"network","chapter":"第三章","extra":true,"oneLine":"把首部固定成 40 字节、把可选功能外挂成扩展首部链：路由器转发更快，但链上每一节都可能被用来藏数据或绕检测。","sections":[{"h":"40 字节定长首部去掉了检验和、IHL 与分片字段，转发路径只需读 8 个字段","p":"IPv4 首部里那些“要算、要变”的字段在 IPv6 被清理掉了：没有首部检验和（链路层与上层已有校验，避免每跳重算），没有 IHL（长度固定 40 字节），没有分片相关字段（分片改由扩展首部表达），也没有选项。剩下的只有版本、流量类、流标签、有效载荷长度、下一个首部、跳数限制和两个 128 位地址。\n\n对路由器的直接好处是处理固定偏移、无需变长解析，硬件流水线更容易做深。对安全的直接影响是“结构规整、畸形空间变小”，但代价是：那些被移出首部的功能并没有消失，只是被推到了扩展首部链上，而链上的内容中间设备通常不看。"},{"h":"下一个首部字段把可选功能串成链，只有逐跳选项会被沿途路由器处理","p":"每个扩展首部的第一个字节都是“下一个首部”，值指出后面是什么，从而串成一条链：0 逐跳选项、43 路由选择、44 分片、50 ESP、51 AH、60 目的站选项，最后指向 6/17/58 等上层协议。RFC 8200 建议的顺序是：基本首部、逐跳选项、目的站选项、路由选择、分片、AH、ESP、目的站选项、上层首部。\n\n关键性质：除逐跳选项外，中间路由器一律不处理扩展首部，只按目的地址转发。这让转发效率很高，也意味着一条链上可以塞进任意多节而沿途设备“看不见”。链的深度、每节的合理性只能由终点自己校验——这正是扩展首部被用来做隐蔽通道与绕过的原因。"},{"h":"分片只允许源主机做，中间路由器不再切包","p":"IPv6 规定分片只能由源节点执行，沿途路由器遇到超 MTU 且不允许分片的报文只能丢弃并回 ICMPv6“包太大”（类型 2），源端据此调小尺寸，这就是 IPv6 的 PMTUD，属于必选行为而非可选优化。分片信息放在 8 字节的分片扩展首部里：下一个首部、保留、13 位片偏移（单位仍是 8 字节）、2 位保留、1 位 M 标志、32 位标识。\n\n好处是中间设备不再参与分片与重组，少了一整类攻击面（teardrop 那种“路由器切出来的畸形片”没有了）。但源端仍可分片，接收端仍要重组，仍要面对只发片不发全、偏移重叠、标识可预测这些老问题；而“路由器不解析分片头”又让基于分片头的绕过更隐蔽。"},{"h":"NDP 用 ICMPv6 取代了 ARP，把地址解析与路由发现都放在组播上","p":"IPv6 没有广播，也没有 ARP。地址解析由邻居请求/邻居通告（NS 类型 135 / NA 类型 136）完成：请求方把 NS 发到被请求节点的 solicited-node 组播地址，目标用自己的链路层地址回应；路由器周期性或按请求发送路由通告（RA 类型 134），携带当前跳数限制、路由器生存期、可达时间与前缀信息选项，主机据此做无状态地址自动配置（SLAAC）并选定默认网关。\n\nNDP 有一个 IPv4 没有的护栏：所有 NDP 报文的跳数限制必须是 255，接收端会校验，因此远端伪造的 NDP 报文无法穿越路由器进来。但这个护栏只挡住“跨网段伪造”，同一链路内的节点依然可以随意发送 NS/NA/RA——信任模型和 ARP 一样，仍然是无认证的。"},{"h":"地址空间变大没有改变信任模型：源地址与邻居身份依旧不被验证","p":"128 位地址解决的是“够不够用”，不是“可不可信”。转发依旧只看目的地址，源地址依旧可以伪造；NDP 依旧没有签名，谁先应答、谁的应答更“像”，谁就赢。于是出现了两类现实攻击：一类针对首部链，用路由选择首部指定中转节点做放大或绕过（RH0 已被 RFC 5095 废弃），用分片首部把上层首部切到第二片，让只查第一片的设备看不到端口；另一类针对 NDP，伪造 NA 抢地址、伪造 RA 抢默认网关，效果与 ARP 欺骗完全对应。\n\n防护也是对应的两条线：链这一侧靠“只允许已知扩展首部、限制链深度、丢弃 RH0”，邻居这一侧靠交换机侧的 RA Guard/ND Inspection 与 SEND（用密码学签名保护 NDP，但部署极少）。"}],"packets":[{"title":"IPv6 基本首部 40 字节 + TCP 段","hex":"60 01 23 45 00 14 06 40 20 01 0d b8 00 00 00 00 00 00 00 00 00 00 00 01 20 01 0d b8 00 00 00 00 00 00 00 00 00 00 00 02 01 bb c9 3b 11 22 33 44 55 66 77 88 50 10 fa f0 7d 23 00 00","note":"8 个字段、定长 40 字节，源/目的各 16 字节；本例流量类为 0、流标签 0x12345。","fields":[{"name":"Version","cn":"版本","off":0,"len":1,"bits":"bit0-3 = 0110（6）","tone":"version","desc":"4 位版本号，固定为 6。与 IPv4 的首字节布局完全不同：IPv4 这一字节还兼作 IHL。","sec":"同一链路上靠它分流两套解析器，把版本改成 4 会让后面的 40 字节被按 IPv4 解析，是最直接的畸形包构造点。"},{"name":"Traffic Class","cn":"流量类","off":1,"len":1,"bits":"本字节高 4 位为 TC 低 4 位；TC 高 4 位在第 0 字节低 4 位","tone":"svc","desc":"8 位，等价于 IPv4 的 DSCP+ECN，用于区分服务等级，本例为 0。","sec":"可伪造高优先级抢占队列，或借流量类把攻击流量混进被放行的类别，绕过按类限速。"},{"name":"Flow Label","cn":"流标签","off":2,"len":2,"bits":"完整 20 位 = 第 1 字节低 4 位 + 本 16 位","tone":"id","desc":"20 位，源端给同一“流”打同一标签，中间设备可据此做负载分担而不必解析传输层。本例 0x12345。","sec":"标签由发送方自由填写，可用来把流量伪装成某条被优待的流，或反过来让多个攻击流共享标签以规避按流统计。"},{"name":"Payload Length","cn":"有效载荷长度","off":4,"len":2,"bits":"16 位，单位字节","tone":"len","desc":"只算 40 字节基本首部之后的部分，包含所有扩展首部。本例 0x0014 = 20（TCP 首部）。","sec":"与实收字节数不符会让解析器在读扩展首部时越界；由于没有首部检验和，长度错误不会有任何校验环节拦下。"},{"name":"Next Header","cn":"下一个首部","off":6,"len":1,"bits":"8 位","tone":"proto","desc":"指出紧随其后的首部类型：0 逐跳选项、43 路由、44 分片、50 ESP、51 AH、6 TCP、17 UDP、58 ICMPv6。本例 6。","sec":"这是整条扩展首部链的入口。值可伪造，也可插入一串设备不认识的类型，让不同设备对“上层是什么”产生分歧，从而绕过过滤。"},{"name":"Hop Limit","cn":"跳数限制","off":7,"len":1,"bits":"8 位","tone":"ttl","desc":"每经一个路由器减 1，为 0 丢弃并回 ICMPv6 超时。功能等价于 TTL，但名字更准确。本例 64。","sec":"NDP 规定必须为 255 且接收端校验，这是防止跨网段伪造邻居报文的唯一护栏；也仍可用于拓扑探测与隐蔽编码。"},{"name":"Source Address","cn":"源地址","off":8,"len":16,"bits":"128 位","tone":"addr","desc":"本例 2001:db8::1。转发过程中同样不做真实性校验。","sec":"可伪造，且地址空间巨大使基于黑名单的封禁更无效；SEND 与源地址验证体系（SAVI）才是对症手段。"},{"name":"Destination Address","cn":"目的地址","off":24,"len":16,"bits":"128 位","tone":"addr","desc":"本例 2001:db8::2。组播地址（ff00::/8）用于 NDP 与发现协议。","sec":"向 solicited-node 组播发 NS 只需惊动目标节点，攻击者可借此做地址扫描；RA 的目的地址是 ff02::1，一次通告覆盖全链路。"},{"name":"TCP Header (payload)","cn":"TCP 首部（载荷）","off":40,"len":20,"bits":"20 字节","tone":"port","desc":"源端口 0x01bb（443）→ 目的端口 0xc93b（51515），ACK 置位，窗口 64240，校验和按 IPv6 伪首部计算。","sec":"IPv6 没有首部校验和，传输层校验和成为唯一的端到端完整性检查，改载荷必须重算，否则被静默丢弃。"}]},{"title":"IPv6 分片扩展首部 + UDP 第一个分片","hex":"60 00 00 00 00 18 2c 40 20 01 0d b8 00 00 00 00 00 00 00 00 00 00 00 0a 20 01 0d b8 00 00 00 00 00 00 00 00 00 00 00 0b 11 00 00 01 de ad be ef 13 88 13 89 00 18 3a dc 41 42 43 44 45 46 47 48","note":"下一个首部=44 进入分片头；分片头再指向 17（UDP）。原 UDP 数据报 24 字节，本片承载前 8 字节数据、M=1。","fields":[{"name":"Version / TC / Flow Label","cn":"版本/流量类/流标签","off":0,"len":4,"bits":"bit0-3 版本=6 / bit4-11 TC / bit12-31 流标签","tone":"version","desc":"本例 0x60000000：版本 6、流量类 0、流标签 0（未启用）。","sec":"流标签由发送方自由填写，可把攻击流量伪装成某条被优待的流，或让多个攻击流共用标签规避按流统计。"},{"name":"Next Header","cn":"下一个首部","off":6,"len":1,"bits":"8 位 = 44","tone":"proto","desc":"44 表示后面是分片扩展首部，而不是上层协议。","sec":"把上层首部藏到第二个分片里，只查第一片的设备就看不到端口——这是 IPv6 分片绕过的核心手法。"},{"name":"Hop Limit","cn":"跳数限制","off":7,"len":1,"bits":"8 位 = 64","tone":"ttl","desc":"每跳减 1，为 0 丢弃。","sec":"NDP 报文要求为 255 并校验，分片报文没有这个约束，可被用于跨网段的伪造片注入。"},{"name":"Source Address","cn":"源地址","off":8,"len":16,"bits":"128 位","tone":"addr","desc":"本例 2001:db8::a。","sec":"可伪造，且地址空间巨大使黑名单式封禁基本无效；接收端重组时也不核验来源。"},{"name":"Destination Address","cn":"目的地址","off":24,"len":16,"bits":"128 位","tone":"addr","desc":"本例 2001:db8::b。","sec":"同一标识的分片若发往不同目的地址，中间设备与终点看到的分片集合可能不同，形成检测盲区。"},{"name":"Payload Length","cn":"有效载荷长度","off":4,"len":2,"bits":"16 位","tone":"len","desc":"本例 0x0018 = 24，含 8 字节分片头 + 16 字节（UDP 首部 + 前 8 字节数据）。","sec":"扩展首部也计入载荷长度，长度算错会让后续首部解析整体偏移。"},{"name":"Fragment Next Header","cn":"分片头的下一个首部","off":40,"len":1,"bits":"8 位 = 17","tone":"proto","desc":"指出“可分片部分”的初始首部类型，此处为 UDP。","sec":"该值决定重组后交给谁解析；把它写成 6 而实际是 17，可让重组端与检测设备得出不同的上层协议结论。"},{"name":"Reserved","cn":"保留","off":41,"len":1,"bits":"8 位，发送置 0","tone":"pad","desc":"保留字段，接收端忽略。","sec":"必须为 0，非 0 可作为异常检测判据；同时也是一块可被塞入数据的空隙。"},{"name":"Fragment Offset / Res / M","cn":"片偏移与 M 标志","off":42,"len":2,"bits":"bit0-12 偏移（×8）/ bit13-14 保留 / bit15 M","tone":"flag","desc":"本例 0x0001：偏移 0、M=1，说明这是第一片且后面还有片。","sec":"13 位偏移上限 65528 字节，与 IPv4 相同；重叠偏移在 IPv6 中同样是重组的实现雷区。"},{"name":"Identification","cn":"标识","off":44,"len":4,"bits":"32 位","tone":"id","desc":"本例 0xdeadbeef，同一原始报文的所有片共用。","sec":"32 位比 IPv4 的 16 位更难猜，暴力枚举伪造成本上升；但在同一 SA/同一目标上仍有可观测的规律可循。"},{"name":"UDP Source Port","cn":"UDP 源端口","off":48,"len":2,"bits":"16 位","tone":"port","desc":"本例 0x1388 = 5000。","sec":"端口只存在于第一片，后续分片没有端口，按端口过滤的设备只能对分片整体放行或整体丢弃。"},{"name":"UDP Destination Port","cn":"UDP 目的端口","off":50,"len":2,"bits":"16 位 = 0x1389（5001）","tone":"port","desc":"目的端口只在第一片里，后续分片没有端口信息。","sec":"把上层首部藏到第二片，只查第一片的设备看不到端口——这是 IPv6 分片绕过的核心手法。"},{"name":"UDP Length","cn":"UDP 长度","off":52,"len":2,"bits":"16 位 = 24（含 8 字节首部）","tone":"len","desc":"指整个 UDP 数据报的长度，而非本片长度；正因为如此，接收端能看出重组后应有多少字节。","sec":"长度字段与实际数据不符是构造畸形分片的常用手段，可诱导重组缓冲区分配错误。"},{"name":"UDP Checksum","cn":"UDP 校验和","off":54,"len":2,"bits":"16 位（含 IPv6 伪首部）","tone":"cksum","desc":"本例 0x3adc，按完整 UDP 数据报（含伪首部）计算，分片不影响它的计算范围。","sec":"IPv6 中 UDP 校验和是强制项，改载荷必须重算，否则接收端静默丢弃——这给分片污染提高了门槛。"},{"name":"Fragment Data","cn":"分片数据","off":56,"len":8,"bits":"8 字节","tone":"data","desc":"本例为 UDP 数据的前 8 字节（41~48）。","sec":"分片数据长度必须是 8 的倍数（最后一片除外），这是偏移字段以 8 字节计数的直接约束。"}]},{"title":"路由通告 RA（ICMPv6 类型 134，56 字节）","hex":"86 00 82 1a 40 00 07 08 00 00 00 00 00 00 00 00 01 01 00 1a 2b 3c 4d 5e 03 04 40 c0 00 27 8d 00 00 09 3a 80 00 00 00 00 20 01 0d b8 00 01 00 00 00 00 00 00 00 00 00 00","note":"偏移自 ICMPv6 首字节起算；外层 IPv6 源地址必须是链路本地地址、跳数限制必须为 255。","fields":[{"name":"Type","cn":"类型","off":0,"len":1,"bits":"8 位 = 134","tone":"type","desc":"134 表示路由通告。NDP 的四个基本类型：133 路由器请求、134 路由通告、135 邻居请求、136 邻居通告。","sec":"伪造 134 即为“假路由器”攻击：主机据此改写默认网关与前缀，与 ARP 欺骗同一性质。"},{"name":"Code","cn":"代码","off":1,"len":1,"bits":"8 位 = 0","tone":"code","desc":"NDP 报文的代码字段固定为 0。","sec":"过滤规则若只按类型放行而忽略来源，代码字段不提供任何区分能力。"},{"name":"Checksum","cn":"校验和","off":2,"len":2,"bits":"16 位（含伪首部）","tone":"cksum","desc":"覆盖 ICMPv6 报文与 IPv6 伪首部（源、目的、长度、下一个首部=58）。","sec":"改任何字段都必须重算，否则被丢弃；因此伪造 RA 的门槛只是“会算校验和”，并不构成任何认证。"},{"name":"Cur Hop Limit","cn":"当前跳数限制","off":4,"len":1,"bits":"8 位 = 64","tone":"ttl","desc":"主机发往外网的报文默认填入该值，0 表示未指定。","sec":"把它改成 1 可让受害主机的出网流量在第一跳就被丢弃，形成静默断网。"},{"name":"M / O / Reserved","cn":"管理位/其他配置位/保留","off":5,"len":1,"bits":"bit0 M / bit1 O / bit2-7 保留","tone":"flag","desc":"M=1 表示地址由 DHCPv6 分配，O=1 表示其他参数从 DHCPv6 获取。本例两位均为 0，即纯 SLAAC。","sec":"翻转 M 位可让主机放弃 SLAAC 转而等待并不存在的 DHCPv6，造成大范围地址配置失败。"},{"name":"Router Lifetime","cn":"路由器生存期","off":6,"len":2,"bits":"16 位，单位秒","tone":"len","desc":"本例 1800 秒，0 表示该路由器不可作为默认网关。","sec":"攻击者发 Lifetime 很大的伪造 RA 可长期占据默认网关；反过来发 Lifetime=0 可立刻把真网关摘掉。"},{"name":"Reachable Time","cn":"可达时间","off":8,"len":4,"bits":"32 位，单位毫秒","tone":"len","desc":"邻居被认为可达的时长，0 表示未指定，由实现自行决定。","sec":"把可达时间调得极短会迫使主机频繁发 NS，放大链路流量与设备负载。"},{"name":"Retrans Timer","cn":"重传定时器","off":12,"len":4,"bits":"32 位，单位毫秒","tone":"len","desc":"NS 重传间隔，0 表示未指定。","sec":"配合极短的可达时间可制造 NS 风暴，属于低成本的链路层 DoS。"},{"name":"Option: SLLA","cn":"源链路层地址选项","off":16,"len":2,"bits":"类型=1 / 长度=1（单位 8 字节）","tone":"opt","desc":"告知主机本路由器的 MAC，长度字段以 8 字节为单位，故 1 表示 8 字节。","sec":"这一项让主机把网关 IP 与 MAC 绑定；伪造它即可在 NDP 层完成与 ARP 欺骗等价的中人攻击。"},{"name":"SLLA Address","cn":"源链路层地址值","off":18,"len":6,"bits":"6 字节 MAC","tone":"mac","desc":"本例 00:1a:2b:3c:4d:5e。","sec":"攻击者填自己的 MAC，全链路主机的默认网关条目就被改写。"},{"name":"Option: Prefix Information","cn":"前缀信息选项","off":24,"len":4,"bits":"类型=3 / 长度=4（32 字节）","tone":"opt","desc":"向主机通告一个可做 SLAAC 的前缀，含前缀长度、L/A 标志、两个生存期。","sec":"伪造该选项可让主机自动配置出攻击者网段内的地址，或把已有地址的生存期清零导致失联。"},{"name":"Prefix Length","cn":"前缀长度","off":26,"len":1,"bits":"8 位 = 64","tone":"len","desc":"前缀的位数，常见 64 以便用接口标识符补齐 128 位。","sec":"长度写错会让主机算出错误的子网，直接破坏同链路通信。"},{"name":"L / A Flags","cn":"链路标志与自治标志","off":27,"len":1,"bits":"bit0 L / bit1 A / bit2-7 保留","tone":"flag","desc":"L=1 表示该前缀在链路上（可直接寻址），A=1 表示可用于 SLAAC。本例 0xC0，两位都为 1。","sec":"A=0 且 L=1 可让主机保留地址却无法自动配置新地址，制造难以排查的连接异常。"},{"name":"Valid Lifetime","cn":"有效生存期","off":28,"len":4,"bits":"32 位，单位秒","tone":"len","desc":"本例 2592000 秒（30 天），地址在此之后必须废弃。","sec":"写成极小值可让全链路地址迅速过期，等效于一次大范围拒绝服务。"},{"name":"Preferred Lifetime","cn":"首选生存期","off":32,"len":4,"bits":"32 位，单位秒","tone":"len","desc":"本例 604800 秒（7 天），超过后地址仍可用但不用于新建连接。","sec":"调整它可以渐进地把流量从某个前缀上赶走，隐蔽性比直接断网更高。"},{"name":"Reserved2","cn":"保留字段","off":36,"len":4,"bits":"32 位，置 0","tone":"pad","desc":"前缀信息选项内部的保留字段，发送置 0、接收忽略。","sec":"必须为 0，非 0 可作为异常判据；也是一块可被塞入数据的空隙。"},{"name":"Prefix","cn":"前缀","off":40,"len":16,"bits":"128 位（高 64 位有效）","tone":"addr","desc":"本例 2001:db8:1::/64，低 64 位保留为 0。","sec":"伪造者只要把前缀换成自己控制的网段，就能把受害者的出网流量引到指定网关。"}]}],"attacks":[{"name":"Routing Header Type 0","cn":"路由选择首部（RH0）绕过与放大","impact":"报文按攻击者列出的中转节点逐跳前进，可绕过基于路径的策略，并被用作流量放大器。","steps":[{"who":"攻击者","to":"边界路由器","label":"IPv6 首部 下一个首部=43；路由头 type=0，地址列表=[受害者 A, 受害者 B, 目标]","note":"路由头指定中转节点，形式上完全合法。"},{"who":"边界路由器","to":"受害者 A","label":"按路由头把报文送往第一个中转地址","note":"路由器不处理扩展首部内容，只按路由头推进。"},{"who":"受害者 A","to":"受害者 B","label":"同一报文继续按地址列表前进","note":"一份报文在链路上被复制成多份流量，形成放大。"},{"who":"受害者 B","to":"目标","label":"报文最终到达目标，源地址仍是攻击者的伪造值","note":"目标看到的是来自受害者 B 的流量，ACL 中“信任 B”的规则被利用。"},{"who":"目标","to":"受害者 A","label":"回包按正常路由返回，直接打到第一个中转节点","note":"两个受害者互相打流量，攻击者只发一份，放大倍数等于地址列表长度。"}],"defense":"按 RFC 5095 丢弃 type 0 路由头（RH0 已废弃），只允许 type 2（移动 IPv6）等明确需要的类型并校验中转节点数量。"},{"name":"Fragment Header Bypass","cn":"分片首部绕过检测","impact":"上层首部被切到第二个分片，只检查第一片的防火墙/IDS 看不到端口与标志，策略被绕过。","steps":[{"who":"攻击者","to":"边界设备","label":"IPv6 首部 下一个首部=44，分片头 offset=0、M=1，片内只放 8 字节“无害”数据","note":"第一片里没有任何传输层首部，检测设备拿不到端口和 TCP 标志。"},{"who":"边界设备","to":"内网主机","label":"按“未知上层”放行第一片","note":"很多设备对无法解析的片段选择放行，只记录协议号 44。"},{"who":"攻击者","to":"内网主机","label":"第二片 offset=1、M=0，片内从 TCP 首部开始","note":"端口、标志、甚至完整请求都藏在第二片。"},{"who":"内网主机","to":"—","label":"重组后得到完整 TCP 段，交给目标端口处理","note":"边界设备从未看到端口，策略形同虚设。"},{"who":"攻击者","to":"内网主机","label":"进一步用重叠偏移让检测端与主机重组出不同内容","note":"不同实现的重叠处理差异被利用，形成 IDS  evasion。"}],"defense":"边界设备先重组再检测，或直接丢弃带分片首部的报文；对必须放行的流量做应用层代理。"},{"name":"NDP Spoofing","cn":"邻居发现欺骗（伪造 NA/RA）","impact":"受害主机的网关或邻居映射被改写，流量经攻击者中转，可监听、篡改或直接断网。","steps":[{"who":"攻击者","to":"受害者主机","label":"RA：源=fe80::attacker，路由器生存期=9000，含 Prefix 选项指向攻击者网段","note":"主机把攻击者的链路本地地址记为默认网关，优先级高于原网关。"},{"who":"受害者主机","to":"—","label":"路由表默认网关被替换，前缀表新增一条","note":"配置是“自己学来的”，排查时很难怀疑到一台主机被骗。"},{"who":"受害者主机","to":"攻击者","label":"出网报文 目的 MAC=攻击者 MAC","note":"二层直接送到攻击者网卡，不经原网关。"},{"who":"攻击者","to":"原网关","label":"可转发、可篡改、也可直接丢弃","note":"转发时通信“正常”但多一跳时延；丢弃时表现为断网。"},{"who":"攻击者","to":"受害者主机","label":"另发伪造 NA：Target=原网关地址，Target Link-Layer=攻击者 MAC，R=1","note":"即使静态配置了网关 IP，邻居缓存仍被改写，攻击可长期驻留。"}],"defense":"交换机侧启用 RA Guard 与 ND Inspection，只允许指定端口发 RA/NA；更彻底的是 SEND，用密码学签名保护 NDP。"}],"defenses":[{"name":"RA Guard / ND Inspection（接入交换机）","how":"在接入交换机上按端口角色过滤 NDP：用户端口禁止发送 RA，NA/NS 的源链路层地址必须与端口学习到的绑定表一致；配合 IPv6 DHCP Snooping 建立地址绑定。","limit":"依赖交换机能力与正确划分信任端口，二层被绕开（如私接交换机、隧道）即失效；同一广播域内已授权的设备伪造仍无法识别，且不防跨网段的有状态攻击。"},{"name":"SEND（安全邻居发现）","how":"用密码学地址（CGA）把接口标识符与公钥绑定，NDP 报文携带 RSA 签名与证书选项，接收端验证签名后才更新邻居缓存，从机制上给 NDP 加上认证。","limit":"需要 PKI 与路由器证书链支撑，主机与网络设备都要实现，计算开销大；现实部署极少，跨域互通困难，因此实际网络仍以 RA Guard 这类“打补丁”手段为主。"},{"name":"扩展首部白名单与链深度限制","how":"边界设备只放行业务确实需要的扩展首部类型（通常只有 ESP/AH 与逐跳选项），丢弃 RH0、未知类型、重复出现或深度超过阈值的首部链，并要求首部长度与 8 字节对齐。","limit":"ESP 加密后中间设备根本看不到内层首部，链上白名单对加密流量无效；过严的限制会误伤移动 IPv6、过渡隧道等合法用法，且需要设备具备完整解析能力。"}],"calcs":["frag"],"quiz":[{"q":"IPv6 首部为什么取消了首部检验和？","options":["因为链路层和上层已有校验，避免每跳重算","因为 128 位地址太长算不动","因为校验和会泄露地址","因为 IPv6 不允许差错检测"],"a":0
