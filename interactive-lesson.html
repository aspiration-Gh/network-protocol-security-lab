<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网络协议安全 · 交互课堂（三幕剧本）</title>
<style>:root{
  --bg:#0a0e13; --panel:#0f151d; --panel2:#161f2a; --ink:#e9f0f7; --dim:#8697ab;
  --line:#1e2a37; --accent:#ffb454; --cyan:#4dd0e1; --ok:#7ee787; --bad:#ff6b6b;
  --t1:#6ea8fe; --t2:#c792ea; --t3:#ffb454; --t4:#4dd0e1; --t5:#7ee787; --t6:#f78c6c;
  --t7:#82aaff; --t8:#94a3b8; --t9:#f07178; --t10:#ffd166; --t11:#a3e635; --t12:#7b8ba0;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
}
html[data-theme="light"]{
  --bg:#f6f8fb; --panel:#fff; --panel2:#eef3f9; --ink:#14202c; --dim:#5d6d80;
  --line:#d6dfea; --accent:#a86300; --cyan:#0b7285; --ok:#1a7f37; --bad:#c92a2a;
  --t1:#1c5fd0; --t2:#7b3fbf; --t3:#a86300; --t4:#0b7285; --t5:#1a7f37; --t6:#c2410c;
  --t7:#2b4ea2; --t8:#57687c; --t9:#b02a37; --t10:#8a6100; --t11:#4d7c0f; --t12:#5b6b7f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75}
code,.mono{font-family:var(--mono)}

/* top */
.top{display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);z-index:20}
.top .home{color:var(--dim);font-size:13px;font-family:var(--mono)}
.top .grow{margin-left:auto;display:flex;gap:8px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;
  padding:7px 13px;font-size:13.5px;font-family:var(--sans)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#12181f;font-weight:700}
.btn.ghost{background:none}
.btn[disabled]{opacity:.35;cursor:default}

.wrap{max-width:1380px;margin:0 auto;padding:26px 26px 90px}
h1{margin:0 0 6px;font-size:30px;letter-spacing:.5px}
h1 small{font-size:15px;color:var(--dim);font-family:var(--mono);font-weight:400;margin-left:10px}
.one{color:var(--dim);font-size:15px;margin:0 0 22px;max-width:760px}

/* acts */
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.act{flex:1;min-width:180px;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:12px 16px;
  background:var(--panel);position:relative;transition:.15s}
.act:hover{border-color:var(--accent)}
.act.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.act .k{font-family:var(--mono);font-size:12px;color:var(--dim)}
.act .t{font-size:17px;font-weight:700;margin-top:2px}
.act.on .t{color:var(--accent)}
.act .d{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.5}
.act.attack.on{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.act.attack.on .t{color:var(--bad)}
.act.defend.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.act.defend.on .t{color:var(--ok)}

.scenes{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.scene{cursor:pointer;font-size:13px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);color:var(--dim);
  font-family:var(--mono)}
.scene.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}

/* stage */
.stage{display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-areas:"topo tree" "hex hex";
  gap:16px 24px;margin:18px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:20px 22px 20px;min-height:780px}
.topo{grid-area:topo;position:relative;border-right:1px dashed var(--line);padding-right:14px;min-height:420px}
.node{position:absolute;left:0;width:calc(100% - 98px);display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel2);font-size:13.5px;transition:.2s}
.node .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:0 0 9px}
.node.on{border-color:var(--accent);color:var(--accent)}
.node.on .dot{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.node.evil.on{border-color:var(--bad);color:var(--bad)}
.node.evil.on .dot{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 22%,transparent)}
.node .role{font-size:11px;color:var(--dim);margin-left:auto;font-family:var(--mono)}
.puck{position:absolute;z-index:5;left:52px;width:auto;max-width:94px;padding:2px 6px;border-radius:16px;font-size:11px;
  overflow:hidden;text-overflow:ellipsis;
  font-family:var(--mono);background:var(--accent);color:#12181f;white-space:nowrap;opacity:0;
  transition:left .5s ease,top .5s ease,opacity .2s}
.puck.show{opacity:1}
.puck.bad{background:var(--bad);color:#fff}
.puck.ok{background:var(--ok);color:#0b1a10}

.wire{grid-area:tree;min-width:0;display:flex;flex-direction:column}
.hexblock{grid-area:hex;min-width:0}
.legend{position:absolute;bottom:-6px;left:0;display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.legend span{display:flex;align-items:center;gap:4px}
.wire-hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.wire-hd b{font-size:15px}
.wire-hd .path{color:var(--cyan);font-family:var(--mono);font-size:12.5px}
.wire-hd .tag{font-size:11px;padding:1px 7px;border-radius:5px;border:1px solid var(--bad);color:var(--bad);font-family:var(--mono)}
.wire-hd .tag.ok{border-color:var(--ok);color:var(--ok)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 6px}
.chip{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--panel2);
  min-width:52px;flex:1 1 auto;transition:.18s;position:relative;overflow:hidden}
.chip .cn{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .v{display:block;font-family:var(--mono);font-size:12.5px;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.chip.hit{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel2));
  animation:pulse 1.6s ease-in-out infinite}
.chip.hit .cn{color:var(--accent)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 40%,transparent)}
  50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 0%,transparent)}}
.chip.warn{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel2))}
.chip.warn .cn{color:var(--bad)}
.chip.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel2))}
.chip.good .cn{color:var(--ok)}
.hint{font-size:12px;color:var(--dim);font-family:var(--mono)}

/* say */
.say{margin:16px 0 0;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:12px;padding:16px 20px;font-size:18px;line-height:1.7;min-height:84px}
.say .sub{display:block;margin-top:6px;font-size:13.5px;color:var(--dim);line-height:1.6}

/* control */
.ctrl{display:flex;align-items:center;gap:10px;margin:14px 0 0;flex-wrap:wrap}
.dots{display:flex;gap:5px;align-items:center;margin-left:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer;transition:.15s}
.dots i:hover{background:var(--dim)}
.dots i.evil{background:color-mix(in srgb,var(--bad) 45%,var(--line))}
.dots i.on{background:var(--accent);transform:scale(1.35)}
.dots i.on.evil{background:var(--bad)}
.ctrl .stepno{font-family:var(--mono);font-size:12.5px;color:var(--dim);margin-left:4px}
.ctrl .spacer{margin-left:auto}
.bar{height:3px;background:var(--line);border-radius:3px;margin:14px 0 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:26px 0 0;overflow:hidden}
.panel > summary,.panel > .hd{cursor:pointer;padding:14px 18px;font-weight:700;display:flex;gap:10px;align-items:center}
.panel .hd .k{font-size:12px;color:var(--dim);font-family:var(--mono);margin-left:auto;font-weight:400}
.panel .bd{padding:0 18px 18px}
details.panel > summary{list-style:none}
details.panel > summary::-webkit-details-marker{display:none}
details.panel > summary::after{content:"▾";margin-left:auto;color:var(--dim)}
details.panel[open] > summary::after{content:"▴"}
.deep .sec{margin:0 0 16px}
.deep h4{margin:0 0 6px;font-size:15px;color:var(--cyan)}
.deep p{margin:0 0 10px;font-size:14.5px;color:var(--ink)}
.deep b{color:var(--accent)}
.deep code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:13px;color:var(--cyan)}

.defs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.def{border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:10px;padding:12px 14px}
.def b{color:var(--ok);font-size:14px}
.def p{margin:6px 0;font-size:13.5px}
.def .lim{color:var(--bad);font-size:12.5px;border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}

table.fl{width:100%;border-collapse:collapse;font-size:13px}
table.fl th{text-align:left;color:var(--dim);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.fl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.fl .fname{font-family:var(--mono);font-weight:600}
table.fl .fsec{color:var(--bad)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}

.q{margin:0 0 16px}
.q .qt{font-weight:600;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:9px 13px;margin:7px 0;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans)}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel2))}
.why{display:none;font-size:13px;color:var(--dim);border-left:2px solid var(--cyan);padding-left:10px;margin-top:6px}
.why.show{display:block}


/* ===== v3：树 + hex + 箭头 + 命令 ===== */
.arrowsvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.dashline{animation:dashmove 1.1s linear infinite}
@keyframes dashmove{to{stroke-dashoffset:-28}}
.pkchip{position:absolute;left:auto;right:4px;z-index:6;max-width:96px;padding:2px 7px;border-radius:14px;
  font-size:11px;font-family:var(--mono);background:var(--accent);color:#12181f;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;opacity:0;transition:top .55s ease,opacity .2s}
.pkchip.show{opacity:1}
.pkchip.bad{background:var(--bad);color:#fff}
.pkchip.ok{background:var(--ok);color:#0b1a10}

.tree{border:1px solid var(--line);border-radius:10px;background:var(--panel2);max-height:560px;overflow:auto;font-size:13px}
.tgroup{border-bottom:1px solid var(--line)}
.tgroup:last-child{border-bottom:0}
.tg-hd{display:flex;gap:8px;align-items:center;padding:6px 10px;color:var(--cyan);font-family:var(--mono);
  font-size:12.5px;cursor:pointer;user-select:none}
.tg-hd:hover{background:color-mix(in srgb,var(--cyan) 8%,transparent)}
.tg-hd .n{margin-left:auto;color:var(--dim);font-size:11px}
.tg-hd .chev{font-style:normal;transition:.15s;display:inline-block}
.tgroup.closed .tg-bd{display:none}
.tgroup.closed .chev{transform:rotate(-90deg)}
.trow{padding:3px 10px 4px 26px;cursor:crosshair;border-left:2px solid transparent}
.tmain{display:grid;grid-template-columns:200px minmax(0,1fr) 62px 18px;gap:10px;align-items:baseline}
.trow .tn{display:flex;gap:6px;align-items:baseline;overflow:hidden}
.trow .tn b{color:var(--ink);font-weight:600;font-size:12.5px;white-space:nowrap}
.trow .tn i{color:var(--dim);font-style:normal;font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tshort{color:var(--dim);font-size:11.5px;padding-left:0;margin-top:1px;line-height:1.5}
.tq{cursor:pointer;width:15px;height:15px;line-height:14px;text-align:center;border-radius:50%;border:1px solid var(--line);
  color:var(--dim);font-size:10.5px;font-family:var(--mono)}
.tq:hover{border-color:var(--accent);color:var(--accent)}
.tmore{display:none;margin:5px 0 2px;padding:7px 10px;border-left:2px solid var(--accent);background:var(--panel);border-radius:0 6px 6px 0}
.tmore p{margin:0;font-size:12.5px;color:var(--ink);line-height:1.6}
.tmore .tsec{color:var(--bad);margin-top:3px}
.trow.open .tmore{display:block}
.trow.on{border-left-color:var(--accent)}
.trow:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.trow.on{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.trow .tn{color:var(--dim);font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.trow .tv{font-family:var(--mono);color:var(--ink);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .toff{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;opacity:.75}
.trow.on .toff{color:var(--accent);opacity:1}

.hexwrap{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:9px 11px}
.hexhdr{display:flex;gap:10px;color:var(--dim);font-family:var(--mono);font-size:11px;padding-bottom:6px;
  border-bottom:1px dashed var(--line);margin-bottom:6px}
.hexhdr .hxoff{width:50px;flex:0 0 50px}
.hexhdr .hxhead{width:411px;flex:0 0 411px;letter-spacing:.2px}
.hexhdr .hxasc{letter-spacing:.2px;cursor:help}
.hexbody{font-family:var(--mono);font-size:12.5px;max-height:210px;overflow:auto}
.hexhdr span:last-child{margin-left:8px}
.hxrow{display:flex;gap:10px;line-height:1.9;white-space:nowrap}
.hxoff{color:var(--dim);width:50px;flex:0 0 50px}
.hxbytes{display:flex;gap:3px}
.hb{width:23px;text-align:center;border-radius:3px;cursor:crosshair;color:var(--ink);transition:.1s}
.hb:hover{outline:1px dashed var(--accent)}
.hb.on{outline:2px solid var(--accent);outline-offset:1px;color:var(--accent);background:color-mix(in srgb,var(--accent) 26%,transparent)}
.g-eth{background:color-mix(in srgb,var(--t6) 20%,transparent)}
.g-ip{background:color-mix(in srgb,var(--t1) 20%,transparent)}
.g-tcp{background:color-mix(in srgb,var(--t2) 20%,transparent)}
.g-opt{background:color-mix(in srgb,var(--t7) 22%,transparent)}
.g-data{background:color-mix(in srgb,var(--t8) 26%,transparent)}
.hxasc{color:var(--dim);border-left:1px solid var(--line);padding-left:10px;letter-spacing:0;opacity:.85}

.cmdtabs{display:flex;gap:6px;margin:2px 0 10px}
.cmdt{cursor:pointer;font-family:var(--mono);font-size:12.5px;padding:4px 11px;border-radius:14px;
  border:1px solid var(--line);color:var(--dim)}
.cmdt:hover{color:var(--ink)}
.cmdt.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.cmdrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.cmdrow:last-child{border-bottom:0}
.cmdrow code{grid-column:1;font-size:13px;color:var(--cyan);background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:7px 10px;white-space:pre-wrap;word-break:break-all;line-height:1.6}
.btn.mini{grid-column:2;grid-row:1;font-size:11.5px;padding:4px 9px;align-self:start}
.cmdn{grid-column:1 / -1;font-size:13.5px;color:var(--ink);margin-top:2px}
.cmdn .src{display:inline-block;margin-left:8px;font-size:11px;color:var(--dim);font-family:var(--mono);
  border:1px solid var(--line);border-radius:4px;padding:0 6px}
.foot{margin:34px 0 0;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:900px){
  .stage{grid-template-columns:1fr}
  .topo{border-right:0;border-bottom:1px dashed var(--line);padding:0 0 12px}
  .wrap{padding:18px 14px 70px}
  h1{font-size:24px}
  .say{font-size:16px}
}

/* ===== v4：协议导航 ===== */
.navwrap{display:flex;flex-direction:column;gap:6px;margin:0 0 18px;padding:10px 12px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px}
.navrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.navlab{font-family:var(--mono);font-size:11px;color:var(--dim);width:52px;flex:0 0 52px}
.pchip{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  border-radius:16px;padding:4px 11px;font-size:13px;font-family:var(--sans)}
.pchip:hover{border-color:var(--accent);color:var(--accent)}
.pchip.on{background:var(--accent);border-color:var(--accent);color:#12181f;font-weight:700}
.pchip i{font-style:normal;font-size:10px;margin-left:5px;border:1px solid currentColor;border-radius:4px;padding:0 3px;opacity:.8}
.trow.hl{background:color-mix(in srgb,var(--accent) 8%,transparent);border-left-color:var(--accent)}

/* ===== 自适应：铺满视口，字号随宽度温和缩放 ===== */
.wrap{max-width:none;width:100%;padding:clamp(14px,1.6vw,34px) clamp(16px,2.2vw,56px) 90px}
h1{font-size:clamp(24px,1.9vw,38px)}
h1 small{font-size:clamp(13px,0.9vw,17px)}
.one{font-size:clamp(14px,0.9vw,17px);max-width:min(100%,96em)}
.navwrap{padding:clamp(8px,0.9vw,16px) clamp(10px,1.2vw,20px)}
.pchip{font-size:clamp(12.5px,0.8vw,15px);padding:clamp(4px,.45vw,7px) clamp(10px,.9vw,16px)}
.navlab{font-size:clamp(10.5px,.7vw,12.5px);width:clamp(46px,3.4vw,64px);flex:0 0 auto}
.act .t{font-size:clamp(15px,1vw,20px)}
.act .d{font-size:clamp(11.5px,.78vw,14px)}
.scene{font-size:clamp(12px,.78vw,14px)}

/* 舞台：铺满、按视口高度伸展，树吃掉剩余高度 */
.stage{grid-template-columns:clamp(280px,20vw,430px) minmax(0,1fr);
  grid-template-rows:minmax(380px,1fr) auto;
  min-height:clamp(620px,76vh,980px);gap:clamp(12px,1.2vw,26px)}
.topo{min-height:clamp(380px,60vh,760px)}
.wire{min-height:0}
.tree{max-height:none;flex:1 1 auto;min-height:240px;overflow:auto;font-size:clamp(12.5px,0.82vw,14.5px)}
.tg-hd{font-size:clamp(12px,.8vw,14px);padding:clamp(5px,.5vw,9px) clamp(8px,.9vw,14px)}
.trow{padding:clamp(3px,.35vw,6px) clamp(8px,.9vw,14px) clamp(4px,.4vw,7px) clamp(20px,2vw,34px)}
.tmain{grid-template-columns:clamp(180px,14vw,320px) minmax(0,1fr) clamp(54px,4vw,84px) 18px}
.trow .tn b{font-size:clamp(12px,.82vw,14.5px)}
.trow .tn i{font-size:clamp(10.5px,.7vw,12.5px)}
.trow .tv{font-size:clamp(11.5px,.8vw,14px)}
.tshort{font-size:clamp(11px,.74vw,13px)}
.tmore p{font-size:clamp(12px,.8vw,13.5px)}

<script id="pdata" type="application/json">{"protos":[{"proto":{"id":"ethernet","name":"Ethernet II","cn":"以太网","en":"Ethernet II / IEEE 802.3","layer":"link","chapter":"第二章","extra":false,"oneLine":"用 48 位 MAC 地址在广播介质上寻址、用 CRC-32 只做检错的链路层底座；交换机靠「按源地址学习、按目的地址转发」把共享总线变成端口隔离。","sections":[{"h":"48 位 MAC 地址回答「这一帧给谁」，但它从来不是身份","p":"以太网把每块网卡编成一个 48 位地址（MAC 地址，也叫硬件地址、物理地址）：前 24 位是 IEEE 注册管理机构分配给厂家的组织唯一标识符（Organizationally Unique Identifier, OUI），例如 00-0C-29 属于 VMware、00-00-0C 属于 Cisco；后 24 位由厂家自行指派，保证出厂不重复。第一字节的最低位是 I/G 位：0 表示单播，1 表示组播，48 位全 1（FF:FF:FF:FF:FF:FF）是广播地址，且只能作为目的地址使用。\n\n这套编址最容易被误解的一点是「固化在 ROM 里」。固化只是出厂行为：主机启动时把地址从 ROM 拷进内存，之后发帧用的是内存里那一份，操作系统一条命令就能改写。所以链路层没有任何身份可信度——凡是靠 MAC 做准入或做审计的设计，都必须假设它可以被伪造成任意值。"},{"h":"帧边界由前导码与 SFD 划出，帧尾只有 4 字节 CRC 兜底","p":"上线时先发 8 字节前导码：7 个 0x55 让接收端时钟与发送端对齐，最后一个字节 0xD5 是帧开始定界符（Start Frame Delimiter, SFD），它之后的第一个比特就是目的地址的第 0 位。帧本身是「目的 6 字节 + 源 6 字节 + 类型/长度 2 字节 + 数据 46~1500 字节 + FCS 4 字节」，合法帧长 64~1518 字节。\n\n64 字节下限有物理原因：CSMA/CD 要求最短帧的发送时间不小于争用时隙 2τ，10 Mbit/s 以太网的 2τ 是 51.2 μs，折算即 64 字节；短于此，发送方可能在冲突信号返回之前就发完并误判发送成功。1518 上限来自早期交换机的内存成本。数据不足 46 字节要填充，接收方按上层（IP 总长度）截断，填充不会污染上层数据。"},{"h":"第三个字段兼作类型与长度，0x0600 是唯一判据","p":"以太网 V2 把第 12、13 字节定义为类型（Type）：0x0800 是 IPv4、0x0806 是 ARP、0x86DD 是 IPv6、0x8100 是 802.1Q 标签、0x8863 与 0x8864 是 PPPoE 的发现阶段与会话阶段。IEEE 802.3 则把它定义为长度（Length），并规定：值大于 0x0600（1536）时按类型解释，与 V2 完全一致；小于 0x0600 时按长度解释，数据字段里装的是 LLC 帧。阈值取 1536 是因为最大数据字段只有 1500，长度值不可能更大。\n\n实际网卡只实现 MAC 子层，LLC 基本被 IP 取代，所以今天几乎全是 V2 帧。但这个双义字段是过滤绕过的经典入口：只按 EtherType 放行或阻断的设备，遇到被再次封装的帧（VLAN、PPPoE、MPLS）就可能看错层次。"},{"h":"交换机只信源地址：学习、查表、泛洪三步撑起转发","p":"交换机收到帧先看源地址：不在表里就新增「MAC 地址 → 端口」表项，已在表里就更新端口与老化计时（典型 300 秒）。再看目的地址：命中且不在入口端口就单播转发；命中且在入口端口就丢弃；查不到就向除入口以外的所有端口泛洪。表项存在内容可寻址存储器（Content Addressable Memory, CAM）里，容量由硬件固定，常见 8K~16K 条。\n\n这套「即插即用」的机制有三个结构性弱点：只信源地址、不做任何验证；表容量有限；未知目的地址的兜底动作就是泛洪。第三条尤其关键——泛洪不是异常，而是算法的正常分支，MAC 泛洪攻击要做的只是让「查不到」成为常态。"},{"h":"FCS 只防随机误码，链路层根本没有认证","p":"帧尾 4 字节 FCS 是 CRC-32（生成多项式 0x04C11DB7，反射实现为 0xEDB88320）对「目的地址到数据末尾」的计算结果，按小端放到线上。它能检出全部单比特差错、双比特差错以及长度不超过 32 位的突发差错，所以叫「无差错接受」——凡被收下的帧，极大概率没有传输差错。\n\n但 CRC 没有密钥。攻击者改动任意字段后重算 FCS，接收方照样收下，这就是「检错」不能替代「认证」的根本原因。链路层整体上既没有身份也没有完整性：能接入同一广播域的人可以伪造源地址、伪造内容，甚至伪造帧边界——超短帧、超大帧、错位 SFD 都是现成的攻击面。"}],"packets":[{"title":"以太网 V2 帧（前导码 8B + 帧 64B，恰好是最小合法帧）","note":"载荷是一条 40 字节的 TCP 纯 ACK（IP 总长 0x0028），数据字段不足 46 字节，补 6 字节 0x00。前导码不计入帧长，FCS 覆盖目的地址到填充末尾共 60 字节。","hex":"55 55 55 55 55 55 55 d5 00 1a 2b 3c 4d 5e 00 0c 29 11 22 33 08 00 45 00 00 28 1c 46 40 00 40 06 9b 2e c0 a8 01 0a c0 a8 01 01 c3 50 00 50 12 34 56 78 9a bc de f0 50 10 20 00 66 7e 00 00 00 00 00 00 00 00 1f e1 37 bb","fields":[{"name":"Preamble + SFD","cn":"前导码 + 帧开始定界符","off":0,"len":8,"bits":"前 7 字节 0x55（10101010…），第 8 字节 0xD5（10101011）","tone":"misc","desc":"接收端用这 8 字节完成比特与字节同步；0xD5 末尾的 11 表示「下一比特起就是帧内容」。它不参与 FCS 计算，也不属于帧长（帧长从目的地址算起）。","sec":"定界完全依赖物理层电平，接收方无条件相信 SFD 之后就是帧头。能在链路上注入信号的人可以自己造一个「帧开头」，或用超短帧让上游解析错位。"},{"name":"Destination Address","cn":"目的地址","off":8,"len":6,"bits":"首字节最低位为 I/G 位：0 单播 / 1 组播；48 位全 1 为广播","tone":"addr","desc":"本例 00:1a:2b:3c:4d:5e，首字节 0x00 最低位是 0，属单播；OUI 为 00:1a:2b。交换机只按它查表决定从哪个端口发出。","sec":"目的地址由发送方填写且无人校验。伪造它可以做两件事：让帧被送到不该收的端口（配合表污染），或让受害者收不到本该收到的帧。"},{"name":"Source Address","cn":"源地址","off":14,"len":6,"bits":"","tone":"addr","desc":"源地址，只允许单播（广播或组播不能作源）。本例 00:0c:29:11:22:33，OUI 00:0c:29 是 VMware 虚拟网卡。","sec":"交换机自学习的唯一依据。伪造源 MAC 就能改写 CAM 表项，把「网关 MAC → 上行口」改成「网关 MAC → 攻击者口」；MAC 泛洪则是每帧换一个源 MAC 把表灌满。"},{"name":"Type","cn":"类型","off":20,"len":2,"bits":"","tone":"type","desc":"0x0800 = IPv4。其他常见值：0x0806 ARP、0x86DD IPv6、0x8100 802.1Q、0x8863/0x8864 PPPoE。大于 0x0600 时按类型解释。","sec":"决定上层多路分解。只按 EtherType 过滤的设备会被封装绕过：VLAN 标签、PPPoE、QinQ 都能把被封的协议藏在另一层类型后面。"},{"name":"Data + Pad","cn":"数据与填充","off":22,"len":46,"bits":"","tone":"data","desc":"IPv4 数据报 40 字节（首部 20 + TCP 首部 20，本例为纯 ACK）+ 6 字节 0x00 填充。真实数据长度由 IP 首部的总长度字段 0x0028 界定。","sec":"承载明文载荷。填充区常被用来夹带隐藏数据；「真实长度由上层字段决定」意味着链路层从不校验内容边界。"},{"name":"Frame Check Sequence","cn":"帧检验序列","off":68,"len":4,"bits":"","tone":"check","desc":"CRC-32（多项式 0x04C11DB7，反射实现 0xEDB88320），覆盖目的地址到填充末尾共 60 字节，小端存放，本例值 0xbb37e11f。","sec":"无密钥。改动任何字节后重算 CRC 即可通过校验，所以 FCS 只挡随机误码，挡不住主动篡改——攻击工具默认都会重算它。"}]},{"title":"IEEE 802.3 帧：第三字段是长度，载荷是 LLC + STP BPDU","note":"同一段线上跑的另一种帧：长度字段 0x0026 表示 LLC+BPDU 共 38 字节，数据不足 46 字节补 8 字节 0x00。目的地址是 IEEE 保留的桥接组播地址，交换机不过滤它，所以 BPDU 能直达所有端口。","hex":"01 80 c2 00 00 00 00 0c 29 11 22 33 00 26 42 42 03 00 00 00 00 00 80 00 00 0c 29 11 22 00 00 00 00 00 80 00 00 0c 29 11 22 33 80 01 00 00 00 14 00 02 00 0f 00 00 00 00 00 00 00 00 07 15 b4 c6","fields":[{"name":"Destination Address","cn":"目的地址（桥接组播）","off":0,"len":6,"bits":"首字节 0x01 最低位为 1，属组播","tone":"addr","desc":"01:80:c2:00:00:00 是 IEEE 802.1D 保留的「所有网桥」组播地址，STP 配置 BPDU 固定用它。","sec":"交换机对这类帧不做用户端口过滤，BPDU 可直达每一个端口。谁能伪造更优的 BPDU，谁就能被选成根桥，把全网的二层流量引到自己身上。"},{"name":"Source Address","cn":"源地址","off":6,"len":6,"bits":"","tone":"addr","desc":"本例 00:0c:29:11:22:33，它同时在载荷里自报为桥 ID 8000.000c.2911.2233。","sec":"桥 ID 由 2 字节优先级加 6 字节 MAC 组成，比较时先比优先级再比 MAC。伪造一个更小的桥 ID 即可抢根桥。"},{"name":"Length","cn":"长度","off":12,"len":2,"bits":"","tone":"len","desc":"0x0026 = 38，表示后面的 LLC 头加 BPDU 共 38 字节。因为小于 0x0600，必须按长度解释，不能按类型解释。","sec":"长度值与真实字节数不符会让接收端解析错位，是协议模糊测试最常见的输入之一；某些驱动对超长/超短长度字段处理不一致，可造成崩溃。"},{"name":"LLC DSAP","cn":"目的服务访问点","off":14,"len":1,"bits":"","tone":"type","desc":"0x42 是生成树协议（Spanning Tree Protocol, STP）的链路层服务访问点；0xAA 则表示后接 SNAP 头。","sec":"LLC 层的多路分解值，决定载荷交给哪个上层实体。伪造它可以把 BPDU 投给错误的处理流程。"},{"name":"LLC SSAP","cn":"源服务访问点","off":15,"len":1,"bits":"最低位 C/R（命令/响应）","tone":"type","desc":"本例 0x42，与 DSAP 相同，表示由 STP 实体发出。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"LLC Control","cn":"LLC 控制","off":16,"len":1,"bits":"","tone":"flag","desc":"0x03 是无编号信息帧（Unnumbered Information, UI），无序号、无确认。","sec":"无序号意味着 LLC 本身不具备重放检测，重复的 BPDU 会被照样处理。"},{"name":"BPDU Protocol ID","cn":"BPDU 协议标识","off":17,"len":2,"bits":"","tone":"type","desc":"固定 0x0000，标识这是 802.1D 生成树报文。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"BPDU Version","cn":"BPDU 版本","off":19,"len":1,"bits":"","tone":"type","desc":"0x00 表示传统 STP（802.1D）；0x02 表示快速生成树 RSTP，0x03 表示 MSTP。","sec":"版本混用会造成协商异常，攻击者可发低版本 BPDU 迫使网络退回慢收敛的 STP。"},{"name":"BPDU Type","cn":"BPDU 类型","off":20,"len":1,"bits":"","tone":"type","desc":"0x00 是配置 BPDU；0x80 是拓扑变化通知（TCN）BPDU。","sec":"持续发送 TCN 会让交换机反复刷新 CAM 表，造成全网泛洪与短暂中断。"},{"name":"BPDU Flags","cn":"BPDU 标志","off":21,"len":1,"bits":"bit0 TC（拓扑变化）/ bit7 TCA（拓扑变化确认）","tone":"flag","desc":"本例 0x00，两个标志都为 0，表示拓扑稳定。","sec":"伪造 TC=1 可让交换机把老化时间从 300 秒缩到 15 秒，CAM 表被快速清空，全网进入泛洪状态。"},{"name":"Root Identifier","cn":"根桥标识","off":22,"len":8,"bits":"前 2 字节优先级 + 后 6 字节 MAC","tone":"id","desc":"本例 8000.000c.2911.2200，优先级 0x8000（默认 32768）。","sec":"根桥决定全网转发树。攻击者声明自己是根桥（优先级 0 + 自己的 MAC），所有流量就会绕经它，形成二层中间人。"},{"name":"Root Path Cost","cn":"根路径开销","off":30,"len":4,"bits":"","tone":"misc","desc":"本例 0，表示发送者自认为直连根桥。开销按链路速率累计，10M 为 100、100M 为 19、1G 为 4。","sec":"伪造开销 0 可让自己在所有端口的路径比较中胜出，从而被选为指定桥，接管该网段的转发。"},{"name":"Bridge Identifier","cn":"桥标识","off":34,"len":8,"bits":"前 2 字节优先级 + 后 6 字节 MAC","tone":"id","desc":"本例 8000.000c.2911.2233，即发送该 BPDU 的交换机自身标识。","sec":"桥 ID 与端口 ID 一起决定端口角色；伪造它可以让合法交换机的端口被判为阻塞，造成黑洞。"},{"name":"Port Identifier","cn":"端口标识","off":42,"len":2,"bits":"高 4 bit 端口优先级 + 低 12 bit 端口号","tone":"id","desc":"本例 0x8001：优先级 8（0x8），端口号 1。","sec":"端口优先级可被用来影响指定端口选举，配合桥 ID 伪造可精确控制哪条链路被阻塞。"},{"name":"Message Age","cn":"消息年龄","off":44,"len":2,"bits":"单位为 1/256 秒","tone":"misc","desc":"本例 0，表示刚由根桥发出。每经过一台交换机加 1 秒。","sec":"超过 Max Age 未被刷新，交换机会认为根桥失效并重新选举——伪造大量「临期」BPDU 可制造反复重收敛。"},{"name":"Max Age","cn":"最大年龄","off":46,"len":2,"bits":"单位为 1/256 秒","tone":"misc","desc":"本例 0x0014 = 20 秒，BPDU 超过该年龄即被丢弃。","sec":"攻击者把 Max Age 改小，可让拓扑信息频繁过期，造成转发中断。"},{"name":"Hello Time","cn":"Hello 时间","off":48,"len":2,"bits":"单位为 1/256 秒","tone":"misc","desc":"本例 0x0002 = 2 秒，根桥每 2 秒发一次配置 BPDU。","sec":"Hello 间隔决定故障感知速度；伪造极小值会让 CPU 被 BPDU 处理占满。"},{"name":"Forward Delay","cn":"转发延迟","off":50,"len":2,"bits":"单位为 1/256 秒","tone":"misc","desc":"本例 0x000f = 15 秒，端口在 Listening、Learning 状态各停留这么久。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Padding","cn":"填充","off":52,"len":8,"bits":"","tone":"data","desc":"8 字节 0x00，把 38 字节的 LLC+BPDU 补到 46 字节的数据字段下限。","sec":"填充内容不被校验，可用于夹带隐蔽数据。"},{"name":"Frame Check Sequence","cn":"帧检验序列","off":60,"len":4,"bits":"","tone":"check","desc":"CRC-32，覆盖目的地址到填充末尾共 60 字节，本例值 0xc6b41507。","sec":"与 V2 帧一样无密钥，伪造 BPDU 时重算即可通过校验。"}]}],"attacks":[{"name":"MAC Flooding","cn":"MAC 泛洪（CAM 表耗尽）","impact":"交换机退化为集线器：未知单播全部泛洪，攻击者被动嗅探整个 VLAN 的流量，并伴随带宽与 CPU 耗尽。","steps":[{"who":"攻击者 A","to":"交换机 S1","label":"帧（SA=随机 MAC_n，DA=00:1a:2b:3c:4d:5e），每帧换一个源 MAC，速率约 1000 帧/秒","note":"S1 按源地址逐条学习，CAM 表占用持续上升"},{"who":"交换机 S1","to":"攻击者 A","label":"写入表项（随机 MAC_n → Gi0/24），同时对未知目的帧向其余端口泛洪","note":"表用量逼近硬件上限（常见 8K~16K 条）"},{"who":"攻击者 A","to":"交换机 S1","label":"继续灌入第 N+1 个随机 MAC","note":"表满后新表项学不进；老表项又被 300 秒老化挤出，表长期处于「满且错」"},{"who":"受害者 B","to":"服务器 C","label":"正常 HTTP 帧（SA=B，DA=C，Type=0x0800）","note":"查表未命中，按规则向除入口外的所有端口泛洪"},{"who":"交换机 S1","to":"攻击者 A","label":"把 B→C 的帧复制到 Gi0/24","note":"攻击者拿到会话内容与明文口令，同时泛洪帧挤占带宽造成登录延迟"}],"defense":"接入端口启用 Port Security 限制可学习 MAC 数量（如 maximum 10 + violation restrict），让第 11 个 MAC 直接被丢弃，CAM 表不再被污染。"},{"name":"MAC Spoofing + ARP Poisoning","cn":"MAC 欺骗配合 ARP 投毒（从被动嗅探升级为中间人）","impact":"同一广播域内可任意窃听与篡改，且受害者网络仍然可用，用户几乎无法察觉。","steps":[{"who":"攻击者 A","to":"受害者 B","label":"ARP 应答（Sender IP=192.168.1.1 网关，Sender MAC=00:0c:29:11:22:33 攻击者）","note":"B 的 ARP 缓存把网关 IP 绑到攻击者 MAC，有效期数分钟"},{"who":"攻击者 A","to":"交换机 S1","label":"帧（SA=00:0c:29:11:22:33，DA=B）","note":"S1 学习到「攻击者 MAC → Gi0/24」，若该 MAC 原在别处则表项被改写"},{"who":"受害者 B","to":"网关（实为攻击者 A）","label":"IP 包（目的 192.168.1.1），封装在 DA=攻击者 MAC 的帧中","note":"流量被改道，不再直达上行口"},{"who":"攻击者 A","to":"网关 192.168.1.1","label":"原样转发，仅把源 MAC 换成自己的地址","note":"链路仍然连通，B 的上网体验不变"},{"who":"攻击者 A","to":"—","label":"抓取明文 HTTP 表单、FTP 口令，或改写响应内容","note":"被动嗅探升级为主动篡改；若转发 HTTP 可注入脚本"}],"defense":"启用 DHCP Snooping 建立 IP-MAC-端口绑定表，再用动态 ARP 检测（DAI）逐帧比对，不一致的 ARP 直接丢弃。"}],"defenses":[{"name":"Port Security（端口安全）","how":"在接入端口限定可学习或可绑定的 MAC 数量（如 maximum 10），可用 sticky 把学到的地址固化到配置；超限动作可选 protect（丢弃）、restrict（丢弃并告警）、shutdown（关闭端口）。","limit":"只保护接入端口；端口下挂 hub 或小交换机会导致多设备超限被整口关闭；攻击者可故意触发 violation 把端口打掉，属于「用防御机制做 DoS」，需配 errdisable recovery。"},{"name":"静态 MAC 绑定与端口-地址一对一","how":"管理员手工配置 switchport port-security mac-address 或静态 CAM 表项，把特定 MAC 固定到特定端口，未登记的源 MAC 一律丢弃。","limit":"运维成本高，终端一流动就失效；只约束本端口，不能阻止上行口或 trunk 侧被冒充；对虚拟化环境（一台主机多个 MAC）几乎不可行。"},{"name":"DHCP Snooping + 动态 ARP 检测（DAI）","how":"DHCP Snooping 监听 DHCP 交互，生成「IP-MAC-端口-VLAN」绑定表；DAI 按表逐帧校验 ARP 报文的发送方信息，不符即丢弃，并可限制单位时间 ARP 数量。","limit":"依赖 DHCP 分配地址，静态 IP 主机没有绑定表项（需手工加 ACL）；绑定表本身可被伪造的 DHCP 报文污染；不防 VLAN 跳跃，也不防伪造源 IP 的三层攻击。"},{"name":"端口隔离与私有 VLAN（PVLAN）","how":"把用户端口划入隔离 VLAN，使其只能与上行口通信、彼此二层不可达；PVLAN 进一步区分隔离端口与团体端口。","limit":"只在单台交换机内生效，跨设备要全网一致配置；会切断用户之间的合法互访（如局域网共享），且对已获得 trunk 的攻击者无效。"}],"calcs":["checksum","frag"],"quiz":[{"q":"以太网最短帧长为什么是 64 字节？","options":["因为 CRC-32 需要至少 64 字节才有检错能力","因为 CSMA/CD 要求最短帧发送时间不小于争用时隙 2τ（10 Mbit/s 下 51.2 μs）","因为 MAC 地址表只能索引 64 字节的帧"],"a":1,"why":"10 Mbit/s × 51.2 μs ÷ 8 = 64 字节。帧太短，发送方会在最远端的冲突信号返回之前就发完并释放信道，从而漏检冲突。"},{"q":"帧的第 12、13 字节是 0x05 0xDC（1500），应当如何解释？","options":["按类型解释，表示上层是编号 1500 的协议","按长度解释，数据字段里是 LLC 帧，长度 1500 字节","按 VLAN ID 解释，属于 VLAN 1500"],"a":1,"why":"0x05DC = 1500，小于 0x0600 的阈值，按 802.3 规定必须解释为长度，此时数据字段装的是 LLC 帧；大于 0x0600 才是类型。"},{"q":"交换机收到一个帧，其源 MAC 已在表中但记录的端口与本次入口不同，交换机会怎么做？","options":["丢弃该帧，因为源地址与端口不一致说明是欺骗","把表项更新为本次入口端口并刷新老化时间","向两个端口都转发一次"],"a":1,"why":"自学习只信源地址、不做验证，规则就是「源地址已存在则更新」。因此伪造源 MAC 持续发帧即可把「网关 MAC → 上行口」改写成攻击者端口。"}]},"script":{"id":"ethernet","notes":{"Preamble + SFD":{"short":"8B 前导码，用来定界","more":"7 个 0x55 让收发时钟对齐，末字节 0xD5 的末尾 11 表示下一比特就是目的地址第一位。它不参与 FCS，也不计入 64~1518 的帧长。","sec":"定界靠物理层电平，能在链路上注入信号的人就能自己造帧头。"},"Frame Check Sequence":{"short":"CRC-32，只检错不防改","more":"覆盖目的地址到填充末尾共 60 字节，小端存放。无密钥，任何改动重算 CRC 即可通过，所以主动篡改的工具都会顺手重算它。","sec":"把 FCS 当完整性保护是常见误判，它只挡随机误码。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"学源、查目的、查不到就泛洪：一台交换机的全部智能就在这里","lead":"先看空表交换机转发第一帧。三个动作决定一切：按源地址学、按目的地址查、查不到就泛洪。","scenes":[{"name":"自学习：学源、查目的、查不到就泛洪","steps":[{"who":"主机 A","to":"交换机 S1","pkt":0,"bubble":"帧 A→B","hl":["Destination Address","Source Address","Type"],"vals":{"Destination Address":"00:1a:2b:3c:4d:5e（B，表里查不到）","Source Address":"00:0c:29:11:22:33（A）","Type":"0x0800 = IPv4"},"say":"A 发出第一个帧，交换机在空表里查不到目的地址 B。","sub":"只能先拿源地址学一条表项，再做下一步。"},{"who":"交换机 S1","to":"主机 B / C / D","pkt":0,"bubble":"泛洪","hl":["Destination Address"],"vals":{"Destination Address":"00:1a:2b:3c:4d:5e（查不到 → 除入口外全部复制）"},"say":"查不到目的地址，就把帧复制给除入口外的每个端口。","sub":"C 和 D 收到后丢弃，只有 B 认领这个目的地址。"},{"who":"交换机 S1","to":"—","pkt":0,"bubble":"写表","hl":["Source Address"],"vals":{"Source Address":"00:0c:29:11:22:33 → Gi0/1，老化 300 秒"},"say":"表项就是「源 MAC → 进入的端口」，没有任何验证。","sub":"谁发帧谁就能声明自己占哪条线，这是全部弱点。"},{"who":"主机 B","to":"交换机 S1","pkt":0,"bubble":"帧 B→A","hl":["Destination Address","Source Address"],"vals":{"Source Address":"00:1a:2b:3c:4d:5e（B）","Destination Address":"00:0c:29:11:22:33（A）"},"say":"B 回帧：交换机先学 (B, Gi0/3)，再查目的地址 A。","sub":"表里已有 A 在 1 口，于是不再泛洪。"},{"who":"交换机 S1","to":"主机 A","pkt":0,"bubble":"单播转发","hl":["Destination Address"],"vals":{"Destination Address":"00:0c:29:11:22:33（命中 1 口）"},"say":"这一帧只从 1 口发出，其余端口完全看不到。","sub":"表准就是交换机，表不准就是 hub——这就是攻击目标。"},{"who":"交换机 S1","to":"所有端口","pkt":1,"bubble":"BPDU 泛出","hl":["Destination Address","Length","BPDU Type"],"vals":{"Destination Address":"01:80:c2:00:00:00（桥接组播，不过滤）","Length":"0x0026 = 38（小于 0x0600 就按长度解释）","BPDU Type":"0x00 配置 BPDU"},"say":"STP 的 BPDU 用组播地址发出，交换机把它送进所有端口。","sub":"第三字段小于 0x0600 是长度而非类型，两种帧同线共存。"}],"cmds":{"linux":[{"c":"ip -s link","n":"每块网卡的 RX/TX 包数与 errors/dropped，先确认链路真在收发","s":"《系统》Linux.md · ip"},{"c":"ip neigh show","n":"本机的 IP→MAC 邻居表，就是终端这一侧的「CAM 表」","s":"《系统》Linux.md · ip"},{"c":"sudo tcpdump -eni any -c 5","n":"-e 打出源/目的 MAC，五行就能看出这段线在跑什么帧","s":"补充（vault 无 tcpdump，看帧头必备）"}],"ps":[{"c":"Get-NetAdapter | Format-Table Name,InterfaceDescription,MacAddress,Status","n":"每块网卡的 MAC 与速率，对照帧里的源/目的地址","s":"《系统》PowerShell.md · 网络与系统管理"},{"c":"Get-NetNeighbor -AddressFamily IPv4 | Format-Table IPAddress,LinkLayerAddress,State","n":"IPv4 邻居表，等价 arp -a 但多一个 State","s":"《系统》PowerShell.md · 网络与系统管理"}],"cmd":[{"c":"getmac /v","n":"一行一块网卡：连接名、网卡型号、物理地址","s":"补充（Windows 自带，vault 未收录）"},{"c":"arp -a","n":"ARP 缓存里 IP 与 MAC 的对应，重点看网关那条","s":"《系统》Windows CMD.md · arp"}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"把表灌满，交换机退回 hub；再改写一条表项，从「看得见」变成「改得了」","lead":"两个攻击打的其实是同一件事：源地址不可验证。一个拿它打容量，一个拿它打映射。","scenes":[{"name":"MAC 泛洪：把 CAM 表灌满","steps":[{"who":"攻击者 A","to":"交换机 S1","pkt":0,"bubble":"随机 SA ×N","hl":["Source Address","Data + Pad"],"vals":{"Source Address":"每帧换一个随机 MAC（02:xx:xx:xx:xx:xx）","Data + Pad":"垃圾载荷，只为把帧长凑到 64 字节"},"say":"每秒上千帧，源地址每帧都换，交换机逐条照着学。","sub":"表是硬件 CAM，条目数固定，常见 8K~16K。","evil":true},{"who":"交换机 S1","to":"攻击者 A","pkt":0,"bubble":"写满表项","hl":["Source Address"],"vals":{"Source Address":"随机 MAC_n → Gi0/24，表占用已近上限"},"say":"每个假源地址都占一条表项，用量一路涨到硬件上限。","sub":"合法主机的表项被挤掉，或者被老化掉。"},{"who":"主机 C","to":"服务器","pkt":0,"bubble":"查不到 → 泛洪","hl":["Destination Address"],"vals":{"Destination Address":"00:1a:2b:3c:4d:5e（表满，查不到）"},"say":"正常主机发的帧也查不到了，按规则必须泛洪到所有端口。","sub":"交换机退化成 hub，攻击者口自然收到一份。"},{"who":"攻击者 A","to":"—","pkt":0,"bubble":"收下明文","hl":["Data + Pad"],"vals":{"Data + Pad":"别人的 FTP/SMTP 会话内容，全部明文"},"say":"混杂模式下把泛洪来的帧全收下，会话内容直接可读。","sub":"FTP、SMTP、Telnet 的用户名口令都在这里。"},{"who":"攻击者 A","to":"交换机 S1","pkt":0,"bubble":"持续灌注","hl":["Source Address"],"vals":{"Source Address":"继续换 MAC，随时补上空出来的位置"},"say":"表一有老化腾位就立刻补满，让「查不到」变成常态。","sub":"泛洪帧本身也在挤带宽和交换机 CPU。","evil":true}],"cmds":{"linux":[{"c":"ip -s link show eth0","n":"盯 RX 包数与 errors：泛洪时包数暴涨、errors 跟着上升","s":"《系统》Linux.md · ip"},{"c":"sudo tcpdump -eni eth0 -c 20 'ether src not 00:0c:29:11:22:33'","n":"20 个非本机源 MAC 的帧——正常几乎为空，泛洪时刷屏","s":"补充（vault 无 tcpdump）"},{"c":"sudo bridge fdb show | wc -l","n":"Linux 网桥的 FDB 条数，等价交换机的 CAM 表用量","s":"补充（bridge 命令，vault 未收录）"}],"ps":[{"c":"Get-NetAdapterStatistics | Format-Table Name,ReceivedUnicastPackets,ReceivedBroadcastPackets","n":"收包统计：泛洪时非单播包与非本机包明显增多","s":"《系统》PowerShell.md · 网络与系统管理"},{"c":"(Get-NetNeighbor).Count","n":"邻居表条数，异常增多说明这一段有大量伪造 MAC 在活动","s":"《系统》PowerShell.md · 网络与系统管理"}],"cmd":[{"c":"netstat -e","n":"以太网统计：单播/非单播包数与错误数，泛洪时非单播暴涨","s":"《系统》Windows CMD.md · netstat"},{"c":"arp -a","n":"ARP 表里冒出大量陌生 MAC 或同一 IP 多个 MAC，就是泛洪加投毒的痕迹","s":"《系统》Windows CMD.md · arp"}]}},{"name":"MAC 欺骗 + ARP 投毒：从嗅探升级成中间人","steps":[{"who":"攻击者 A","to":"受害者 B","pkt":0,"bubble":"伪造 SA=网关","hl":["Source Address"],"vals":{"Source Address":"网关的 MAC（攻击者自行填写）"},"say":"把源地址改成网关的 MAC，再配一条「网关 IP 是我」的 ARP 应答。","sub":"ARP 应答无需请求就能被接受，缓存直接覆盖。","evil":true},{"who":"交换机 S1","to":"—","pkt":0,"bubble":"表项被改写","hl":["Source Address"],"vals":{"Source Address":"网关 MAC → Gi0/24（原来在 Gi0/1）"},"say":"交换机只按源地址学习：网关的 MAC 现在记在攻击者口上。","sub":"真网关从此收不到上行帧，直到表项被刷新。"},{"who":"受害者 B","to":"网关","pkt":0,"bubble":"帧走错口","hl":["Destination Address"],"vals":{"Destination Address":"网关 MAC（表里指向攻击者口）"},"say":"B 发往网关的帧被送到攻击者口，而不是真网关。","sub":"攻击者看到全部上行流量，还能改了再转发。"},{"who":"攻击者 A","to":"网关（真）","pkt":0,"bubble":"转手重放","hl":["Data + Pad"],"vals":{"Data + Pad":"原样或改写后转发给真网关"},"say":"攻击者把帧改完再发给真网关，双方通信照常，用户无感。","sub":"无加密时这是完整中间人；有 TLS 就只剩流量元数据。","evil":true}],"cmds":{"linux":[{"c":"ip neigh show 192.168.1.1","n":"网关的 MAC 变成攻击者就是投毒成功，正常应与交换机侧一致","s":"《系统》Linux.md · ip"},{"c":"sudo tcpdump -eni eth0 'arp' -c 10","n":"抓 ARP：同一 IP 反复宣告不同 MAC，就是投毒在刷缓存","s":"补充（vault 无 tcpdump）"},{"c":"sudo arping -I eth0 -c 3 192.168.1.1","n":"主动探测网关：回应 MAC 与缓存里不一致说明被冒充","s":"补充（iputils-arping，vault 未收录）"}],"ps":[{"c":"Get-NetNeighbor -AddressFamily IPv4 | Where-Object IPAddress -eq 192.168.1.1 | Format-List IPAddress,LinkLayerAddress,State","n":"单看网关那一条：MAC 还是不是真网关","s":"《系统》PowerShell.md · 网络与系统管理"},{"c":"Get-NetAdapter | Format-Table Name,Status,LinkSpeed","n":"网卡状态正常但流量异常，就是二层被改写而非链路故障","s":"《系统》PowerShell.md · 网络与系统管理"}],"cmd":[{"c":"arp -a 192.168.1.1","n":"网关 IP 对应的物理地址，被投毒时显示攻击者 MAC","s":"《系统》Windows CMD.md · arp"},{"c":"netsh interface ipv4 show neighbors","n":"按接口列邻居缓存含 State，便于对比刷新前后","s":"《系统》Windows CMD.md · netsh"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"限住每个口能学几个 MAC，再用绑定表校验 ARP——泛洪与投毒同时失效","lead":"同一场泛洪重放一遍：这次第 11 个 MAC 就进不了表，表稳定则泛洪无收益。","scenes":[{"name":"端口安全 + DAI：把「查不到」和「改得了」同时堵住","steps":[{"who":"交换机 S1（接入口）","to":"—","pkt":0,"bubble":"maximum 10 + sticky","hl":["Source Address"],"vals":{"Source Address":"合法主机 MAC 学满 10 条后封口"},"say":"接入口限定 10 个 MAC，sticky 把合法地址固化，超限即 violation。","sub":"protect 丢弃 / restrict 告警 / shutdown 关端口。"},{"who":"攻击者 A","to":"交换机 S1","pkt":0,"bubble":"第 11 个 MAC","hl":["Source Address"],"vals":{"Source Address":"随机 MAC（第 11 个）→ 被丢弃，不入表"},"say":"随机源地址到第 11 个就被丢，进不了 CAM 表。","sub":"表不再被灌满，泛洪的前提消失。","evil":true},{"who":"主机 C","to":"服务器","pkt":0,"bubble":"仍是单播","hl":["Destination Address"],"vals":{"Destination Address":"命中表项 → 只从对应口发出"},"say":"表项稳定，正常帧继续按表单播，攻击者口收不到。","sub":"攻击收益从「全看」变成「看不见」。"},{"who":"交换机 S1","to":"—","pkt":0,"bubble":"DAI 校验","hl":["Source Address"],"vals":{"Source Address":"ARP 发送方 IP/MAC 与绑定表逐帧比对"},"say":"DAI 拿 DHCP Snooping 的「IP-MAC-端口」表校验每一个 ARP。","sub":"不一致直接丢弃，投毒的 ARP 应答到不了受害者。"},{"who":"受害者 B","to":"网关","pkt":0,"bubble":"回真网关","hl":["Destination Address"],"vals":{"Destination Address":"网关 MAC 仍在正确的上行口"},"say":"网关 MAC 没被改写，B 的帧照常走上行口到真网关。","sub":"没有 DHCP Snooping 就没有绑定表，DAI 无从判定。"},{"who":"运维","to":"—","pkt":0,"bubble":"边界别忘","hl":["Source Address"],"vals":{"Source Address":"上行口只做静态绑定，不开粘滞学习"},"say":"上行口和级联口若也开粘滞，一次误封就是整段掉线。","sub":"配 errdisable recovery，防止被故意打成 DoS。"}],"cmds":{"linux":[{"c":"sudo bridge fdb show br0 | awk '{print $3}' | sort | uniq -c | sort -rn | head","n":"哪个端口学到的 MAC 最多：单口上千条就是泛洪，正常应个位数","s":"补充（bridge 命令，vault 未收录）"},{"c":"sudo bridge fdb show dev eth1 | wc -l","n":"单口 MAC 条数——端口安全的 maximum 在 Linux 网桥上的等价检查","s":"补充（bridge 命令，vault 未收录）"},{"c":"ip neigh show | grep -c lladdr","n":"邻居表条数，投毒后常见同一 MAC 对应多个 IP","s":"《系统》Linux.md · ip"}],"ps":[{"c":"Get-NetNeighbor -State Reachable | Format-Table IPAddress,LinkLayerAddress","n":"只看可达项，投毒后网关那行的 MAC 会变成攻击者","s":"《系统》PowerShell.md · 网络与系统管理"},{"c":"Get-NetAdapterStatistics | Format-Table Name,ReceivedBroadcastPackets","n":"防护后复测：非单播收包不再随攻击增长","s":"《系统》PowerShell.md · 网络与系统管理"}],"cmd":[{"c":"netsh interface ipv4 show neighbors","n":"复核网关 MAC 是否已恢复为真实设备","s":"《系统》Windows CMD.md · netsh"},{"c":"arp -a","n":"先 arp -d * 清缓存再看，能区分「缓存旧值」与「真被改」","s":"《系统》Windows CMD.md · arp"}]}}]}]}},{"proto":{"id":"vlan","name":"802.1Q VLAN","cn":"虚拟局域网","en":"IEEE 802.1Q Virtual LAN","layer":"link","chapter":"第二章","extra":true,"oneLine":"在源地址之后插入 4 字节标签，用 12 位 VID 把一台交换机切成多个互不广播的广播域——它做的是隔离，不是加密。","sections":[{"h":"12 位 VID 把一台交换机切成多个广播域","p":"VLAN（Virtual LAN，虚拟局域网）在逻辑上把一台交换机划分成多个广播域：同一 VLAN 内的帧正常二层转发，跨 VLAN 必须经过三层设备。标识靠 802.1Q 标签里的 12 位 VLAN ID（VID），取值 0~4095，其中 0 与 4095 保留，实际可用 1~4094。一台 48 口交换机因此能承担过去几十台独立交换机的工作：广播风暴、ARP 广播、CAM 表规模都被限制在单个 VLAN 内。\n\n安全动机同样直接：财务、监控、访客、IoT 不应该看到彼此的二层流量。但这是「隔离」而不是「加密」——同一个 VLAN 内部，ARP 欺骗、MAC 泛洪、嗅探一样成立；一旦标签可被伪造，隔离也就失效。"},{"h":"标签插在源地址之后：TPID 0x8100 加 2 字节 TCI","p":"802.1Q 在源地址与类型字段之间插入 4 字节。前 2 字节是标签协议标识（Tag Protocol Identifier, TPID），固定 0x8100，作用是告诉接收端「后面是标签而不是类型」；后 2 字节是标签控制信息（Tag Control Information, TCI）：高 3 位是优先级（Priority Code Point, PCP，即 802.1p），接着 1 位是丢弃指示（Drop Eligible Indicator, DEI），低 12 位是 VID。\n\nPCP 常被忽略，却是一条真实攻击面：交换机按 PCP 把帧放进不同队列，伪造 PCP=7 能让普通主机的帧抢占语音队列。QinQ（802.1ad）在外层再加一个 0x88A8 标签供运营商区分客户，这正是双标签跳跃所利用的机制。"},{"h":"access、trunk 与 native VLAN 决定谁能看见标签","p":"接入口（access port）只属于一个 VLAN：收到无标签帧就打上该 VLAN 的标签，发出时再把标签剥掉，终端完全感知不到 VLAN 的存在。干道口（trunk port）承载多个 VLAN，通常发出时保留标签，收到时按标签归类。\n\n关键细节是 native VLAN：trunk 上属于 native VLAN 的帧不带标签发送，对端收到无标签帧也归入自己的 native VLAN。这本是为兼容不支持标签的老设备，却造成一个不对称——「无标签」在链路两端各自有含义。两端 native VLAN 配置不一致时，帧就会从一个 VLAN 悄悄串到另一个；双标签攻击则利用「交换机只剥一层标签」的行为把内层标签送过 trunk。"},{"h":"VLAN 是隔离手段，不是安全边界","p":"把 VLAN 当成安全域的前提是「配置正确且没人能改标签」。一旦攻击者拿到一个 trunk 口（通过 DTP 协商或错误配置），全部 VLAN 都对他透明；一旦 native VLAN 配置错位，无标签帧就会串域。所以真实部署里 VLAN 必须与端口安全、端口隔离（PVLAN）、VACL 以及未用端口 shutdown 一起使用。\n\n还要注意跨交换机的一致性：VLAN 数据库、native VLAN、允许列表必须在整条链路上对齐，否则故障表现是「偶发串流」而不是明确报错。这类问题既难排查，也正好给攻击者留下稳定窗口。"}],"packets":[{"title":"单标签 802.1Q 帧（PCP=5、VID=100）","note":"标签插在源地址之后、类型之前，帧因此比普通 V2 帧长 4 字节。PCP=5 通常是语音或视频的优先级，VID=100 属于业务 VLAN。","hex":"00 1a 2b 3c 4d 5e 00 0c 29 11 22 33 81 00 a0 64 08 00 45 00 00 28 1c 46 40 00 40 06 9b 2e c0 a8 01 0a c0 a8 01 01 c3 50 00 50 12 34 56 78 9a bc de f0 50 10 20 00 66 7e 00 00 00 00 00 00 00 00 ff e9 a8 0c","fields":[{"name":"Destination Address","cn":"目的地址","off":0,"len":6,"bits":"首字节最低位 I/G：0 单播 / 1 组播","tone":"addr","desc":"本例 00:1a:2b:3c:4d:5e，单播地址，与未打标签时位置相同（VLAN 标签不改变二层寻址）。","sec":"标签帧的目的 MAC 仍是明文，攻击者不解析标签也能判断这帧发给谁。"},{"name":"Source Address","cn":"源地址","off":6,"len":6,"bits":"","tone":"addr","desc":"本例 00:0c:29:11:22:33。标签紧跟在它后面，二者共同决定这一帧在交换机上的学习与转发。","sec":"交换机把 VLAN 与源 MAC 一起学习，表项形如「VLAN 100 + MAC → 端口」；伪造源 MAC 只能在同一个 VLAN 内生效，这一点常被误认为「VLAN 能防 MAC 欺骗」。"},{"name":"TPID","cn":"标签协议标识","off":12,"len":2,"bits":"","tone":"type","desc":"0x8100 表示 802.1Q 标签；0x88A8 表示 802.1ad（QinQ 外层）；0x9100 是部分厂商私有的双标签标记。","sec":"这是双标签攻击的关键字节：外层写 0x8100 冒充普通标签，内层再放一个 0x8100，接收方只剥一层后把第二层当成载荷继续转发。"},{"name":"TCI","cn":"标签控制信息","off":14,"len":2,"bits":"高 3 bit PCP（802.1p 优先级）/ 次 1 bit DEI / 低 12 bit VID","tone":"id","desc":"本例 0xA064：PCP=5（二进制 101，语音级优先级）、DEI=0、VID=0x064=100。VID=1 通常是管理 VLAN，0 与 4095 保留。","sec":"VID 决定这一帧属于哪个广播域，也是跳跃攻击的目标字段；PCP 可被伪造以抢占高优先级队列（QoS 欺骗）；DEI=1 让帧在拥塞时优先被丢弃。"},{"name":"Type","cn":"类型","off":16,"len":2,"bits":"","tone":"type","desc":"0x0800 = IPv4。它是标签之后真正的类型字段，位置比未打标签时后移 4 字节。","sec":"只按固定偏移读 EtherType 的简易解析器会把 TCI 当成类型，导致过滤规则失效——这是「标签混淆」类绕过的基础。"},{"name":"Data + Pad","cn":"数据与填充","off":18,"len":46,"bits":"","tone":"data","desc":"IPv4 + TCP 共 40 字节，补 6 字节 0x00。注意标签不计入 1500 字节的 MTU，但计入 64~1518 的帧长。","sec":"加了标签后帧长增加 4 字节，最大帧可达 1522 字节。把 MTU 当 1500 的转发设备可能丢弃这些帧，形成「打标签即断流」的可用性问题。"},{"name":"Frame Check Sequence","cn":"帧检验序列","off":64,"len":4,"bits":"","tone":"check","desc":"CRC-32，覆盖目的地址到填充末尾（含标签），本例 0x0ca8e9ff。","sec":"无密钥。改 VID 或 PCP 后重算 FCS 即可，标签本身没有任何完整性和来源证明。"}]},{"title":"双标签帧（外层 VID=1 native，内层 VID=20）","note":"这就是 double tagging 的实际报文形态：两个 0x8100 标签连在一起。外层写 native VLAN 的 VID，交换机在 trunk 上发出时会把它剥掉；内层 VID=20 原封不动到达对端交换机。","hex":"00 1a 2b 3c 4d 5e 00 0c 29 11 22 33 81 00 00 01 81 00 00 14 08 00 45 00 00 28 1c 46 40 00 40 06 9b 2e c0 a8 01 0a c0 a8 01 01 c3 50 00 50 12 34 56 78 9a bc de f0 50 10 20 00 66 7e 00 00 00 00 00 00 00 00 59 78 62 f3","fields":[{"name":"Destination Address","cn":"目的地址","off":0,"len":6,"bits":"","tone":"addr","desc":"00:1a:2b:3c:4d:5e：目标 VLAN 20 内某台主机的 MAC。攻击者必须先知道它，否则帧在目标 VLAN 内无人接收。","sec":"攻击者可以先泛洪或嗅探拿到目标 VLAN 的 MAC 列表，这也是「VLAN 跳跃」常与 MAC 泛洪配合的原因。"},{"name":"Source Address","cn":"源地址","off":6,"len":6,"bits":"","tone":"addr","desc":"00:0c:29:11:22:33：攻击者的 MAC。它在两个 VLAN 里都会被学习到，因此容易被日志发现。","sec":"由于回程流量会按内层 VLAN 20 转发回接入端口，而该端口属于 VLAN 10，攻击者收不到回包——这决定了双标签只能单向注入。"},{"name":"Outer TPID","cn":"外层标签标识","off":12,"len":2,"bits":"","tone":"type","desc":"0x8100：伪装成普通 802.1Q 标签。","sec":"外层标签的唯一作用是让入口交换机认为「这是一帧 native VLAN 的标签帧」，从而正常接收并进入转发流程。"},{"name":"Outer TCI","cn":"外层 TCI","off":14,"len":2,"bits":"高 3 bit PCP / 次 1 bit DEI / 低 12 bit VID","tone":"id","desc":"本例 0x0001：PCP=0、DEI=0、VID=1（默认 native VLAN）。","sec":"外层 VID 必须填 trunk 的 native VLAN。交换机对 native VLAN 的帧不做标签检查，于是「打标签的 native 帧」被照收，这是整个攻击的前提。"},{"name":"Inner TPID","cn":"内层标签标识","off":16,"len":2,"bits":"","tone":"type","desc":"0x8100：第二个标签，被外层交换机当作普通载荷内容。","sec":"交换机只解析一层标签，内层这 4 字节在入口处不被检查，随载荷一路穿过 trunk。"},{"name":"Inner TCI","cn":"内层 TCI","off":18,"len":2,"bits":"高 3 bit PCP / 次 1 bit DEI / 低 12 bit VID","tone":"id","desc":"本例 0x0014：VID=20，即攻击者想进入的目标 VLAN。","sec":"对端交换机收到后按内层 VID=20 归类转发，帧就此跨过 VLAN 边界——这就是 VLAN 跳跃（VLAN Hopping）。"},{"name":"Type","cn":"类型","off":20,"len":2,"bits":"","tone":"type","desc":"0x0800 = IPv4。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Data + Pad","cn":"数据与填充","off":22,"len":46,"bits":"","tone":"data","desc":"IPv4 + TCP 40 字节，补 6 字节 0x00。实际攻击中这里放的是伪造的 ARP 应答或 DHCP 报文。","sec":"攻击载荷通常是「网关 IP → 攻击者 MAC」的 ARP 应答，用来让目标 VLAN 的主机把流量发给攻击者。"},{"name":"Frame Check Sequence","cn":"帧检验序列","off":68,"len":4,"bits":"","tone":"check","desc":"CRC-32，覆盖到填充末尾，本例 0xf3627859。","sec":"重算即可，无任何防伪能力。"}]}],"attacks":[{"name":"Double Tagging","cn":"双标签 VLAN 跳跃","impact":"绕过 VLAN 隔离，向任意 VLAN 单向注入帧（典型是伪造网关 ARP），为后续中间人攻击铺路。","steps":[{"who":"攻击者 A","to":"交换机 S1（接入端口，VLAN 10）","label":"帧：外层 81 00 / TCI=0x0001（native）/ 内层 81 00 / TCI=0x0014（VID=20）/ IPv4 载荷","note":"S1 按外层 VID=1 处理，认为这是一帧 native VLAN 流量，正常接收"},{"who":"交换机 S1","to":"交换机 S2（trunk 口）","label":"剥掉外层标签后发出，线上只剩 81 00 00 14 …","note":"native VLAN 的帧在 trunk 上不带标签，所以外层标签被剥掉；内层标签作为载荷原样保留"},{"who":"交换机 S2","to":"受害者 B（VLAN 20 接入端口）","label":"按内层 VID=20 归类，转发到 VLAN 20 的端口","note":"帧跨过了 VLAN 边界，到达本不该可达的主机"},{"who":"受害者 B","to":"—","label":"接收伪造的 ARP 应答（192.168.20.1 → 攻击者 MAC）","note":"B 的 ARP 缓存被污染，但它的回程流量走 VLAN 20，攻击者收不到"},{"who":"攻击者 A","to":"—","label":"重复注入（单向），只发不收","note":"形成单向中间人：可让 B 的流量发往错误网关，造成断网或黑洞，或配合其他手段做劫持"}],"defense":"把 trunk 的 native VLAN 改为未使用的隔离 VLAN（并在两端一致），接入端口强制 switchport mode access、关闭 DTP。"},{"name":"Switch Spoofing","cn":"交换机欺骗（DTP 协商成 trunk）","impact":"一条网线接入即成为 trunk 口，攻击者获得全部 VLAN 的标签流量，可读可写。","steps":[{"who":"攻击者 A","to":"交换机 S1","label":"DTP 帧（目的 01:80:c2:00:00:0d，Domain TLV 声明域名，Status=0x03 请求形成 trunk）","note":"若端口处于 auto 或 desirable 模式，S1 会参与协商"},{"who":"交换机 S1","to":"攻击者 A","label":"DTP 应答（Status=0x04，trunk 已启用，允许 VLAN 列表 1-4094）","note":"端口被协商成 trunk，攻击者侧开始收到带标签的帧"},{"who":"攻击者 A","to":"交换机 S1","label":"构造 802.1Q 帧，VID 取 1、10、20、100 逐个尝试","note":"trunk 口接受带标签帧，攻击者获得全部 VLAN 的可达性"},{"who":"攻击者 A","to":"受害者 B（VLAN 20）","label":"带 VID=20 的 ARP 应答 + 双向可达","note":"与双标签不同，这里回程也通，可做完整双向中间人"}],"defense":"全局配置 switchport nonegotiate 并显式指定 switchport mode access，未使用端口 shutdown 并划入黑洞 VLAN。"}],"defenses":[{"name":"关闭 DTP、强制 access 模式","how":"在接入端口配置 switchport mode access 与 switchport nonegotiate，禁止发送和响应 DTP；只在上联口显式配置 trunk 并限定允许 VLAN 列表。","limit":"需要逐口配置，漏掉一个口就全盘失效；上联口必须保留 trunk，仍可能被上游设备影响；对已经物理接入的合法用户端口无效。"},{"name":"native VLAN 隔离与一致性","how":"把 trunk 的 native VLAN 改为一个不承载业务的隔离 VLAN（如 999），两端配置一致；部分设备可开启「给 native VLAN 帧也打标签」。","limit":"两端不一致本身就是串 VLAN 的成因，改配置需全链路同步、风险高；某些老设备不支持 tagged native，兼容性受限。"},{"name":"端口隔离 / 私有 VLAN（PVLAN）","how":"把用户端口设为隔离端口，使其只能与上行口通信；同一 VLAN 内的用户互相不可达，从根上阻断横向嗅探与 ARP 投毒。","limit":"只在单台交换机内生效，跨设备需全网一致；会切断用户间合法互访；对已获得 trunk 的攻击者无效。"},{"name":"未用端口 shutdown + 黑洞 VLAN","how":"把空余端口关闭并划入一个无三层接口的 VLAN，防止陌生人插线即接入。","limit":"属于减少暴露面而非检测；运维新增设备时常被临时打开而忘记恢复；不防内部人员使用自己的合法端口。"}],"calcs":["checksum"],"quiz":[{"q":"双标签 VLAN 跳跃为什么通常只能单向注入？","options":["因为内层标签会被入口交换机改写","因为回程帧按内层 VLAN 转发，而攻击者端口属于另一个 VLAN，收不到","因为 VID 只有 12 位，无法双向寻址"],"a":1,"why":"目标主机的回包在 VLAN 20 内按正常规则转发，不会带着第二个标签回到攻击者的 VLAN 10 端口，所以攻击者只能发、不能收。"},{"q":"trunk 上属于 native VLAN 的帧如何传输？","options":["带 0x8100 标签，VID 字段填 0","不带标签，对端收到无标签帧后归入自己的 native VLAN","带 0x88A8 外层标签"],"a":1,"why":"native VLAN 的设计就是为了兼容不支持标签的设备，因此帧不加标签；两端 native VLAN 必须一致，否则无标签帧会串到另一个广播域。"},{"q":"802.1Q 标签插在以太网帧的什么位置？","options":["帧最前面，前导码之后","源地址之后、类型字段之前","FCS 之前，作为帧尾的一部分"],"a":1,"why":"标签占 4 字节（TPID 2 + TCI 2），插在 SA 与 Type 之间，因此打标签后 EtherType 的偏移从 12 变成 16。"}]},"script":{"id":"vlan","notes":{"TPID":{"short":"标签类型号，0x8100","more":"2 字节：0x8100 是 802.1Q 标签，0x88A8 是 802.1ad（QinQ 外层），0x9100 是部分厂商的私有双标签标记。它把后面所有字段整体后移 4 字节。","sec":"设备只认 TPID 判断有没有标签，改 TPID 就能让帧绕过只看 0x8100 的过滤器。"},"TCI":{"short":"2B：优先级+DEI+VID","more":"高 3 bit 是 PCP 优先级，中间 1 bit 是 DEI，低 12 bit 是 VID。VID 取 1~4094，0 与 4095 保留，1 通常是 native。","sec":"12 位 VID 只是分类标记，不加密也不认证，改一个字节就换了广播域。"},"Outer TCI":{"short":"外层标签的 VID","more":"双标签帧里外层交换机只看这一层。攻击者把外层写成 native VLAN 的 VID，交换机就会把它当成普通 native 流量收下并剥掉。","sec":"外层 VID 是双标签跳跃的唯一开关，native VLAN 隔离就是从这里掐断。"},"Inner TCI":{"short":"内层 VID，真正目标","more":"外层被剥掉后，这一层就成了线上唯一的标签，被下一跳交换机当作合法 VLAN。12 位空间内的任意 VID 都可以被填进来。","sec":"内层 VID 决定帧落进哪个广播域，它是注入的目标而非障碍。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"4 字节标签、12 位 VID：一台交换机被切成多个互不广播的广播域","lead":"看一帧从 access 口进去、过 trunk、再从另一个 access 口出来的全过程。标签只在交换机之间活着。","scenes":[{"name":"打标签、过 trunk、剥标签","steps":[{"who":"交换机 S1","to":"—","pkt":0,"bubble":"插入 4B 标签","hl":["TPID","TCI"],"vals":{"TPID":"0x8100（刚插入的标签）","TCI":"PCP=5, DEI=0, VID=100（按端口 PVID 打）"},"say":"帧进 access 口，交换机在源地址后插入 4 字节，VID 取端口 PVID。","sub":"标签把「物理端口」变成了「逻辑广播域」。"},{"who":"交换机 S1","to":"交换机 S2（trunk）","pkt":0,"bubble":"带标签上行","hl":["TPID","TCI","Type"],"vals":{"TCI":"VID=100 原样保留","Type":"0x0800（标签之后才是类型）"},"say":"trunk 上每帧都带标签，哪个帧属于哪个 VLAN 一目了然。","sub":"标签不计入 1500 的 MTU，但计入 64~1518 的帧长。"},{"who":"交换机 S2","to":"—","pkt":0,"bubble":"查 VID 表","hl":["TCI"],"vals":{"TCI":"VID=100 → 只在 VLAN 100 的成员口里查"},"say":"S2 用 VID 选出转发表，只在 VLAN 100 的端口里找目的地址。","sub":"别的 VID 的端口连帧都看不到，这就是隔离。"},{"who":"交换机 S2","to":"VLAN 100 主机","pkt":0,"bubble":"剥标签","hl":["Destination Address","Type"],"vals":{"Destination Address":"00:1a:2b:3c:4d:5e（VLAN 100 内）","Type":"0x0800（标签已剥，位置回移 4B）"},"say":"出口是 access 口，交换机剥掉标签，主机收到普通 V2 帧。","sub":"终端全程不知道 VLAN 存在。"},{"who":"交换机 S1","to":"—","pkt":0,"bubble":"native VLAN","hl":["TCI"],"vals":{"TCI":"VID=1（native，trunk 上不打标签）"},"say":"native VLAN 的帧在 trunk 上不带标签——这正是双标签的缺口。","sub":"两端 native VLAN 不一致，本身就是串 VLAN 的成因。"}],"cmds":{"linux":[{"c":"sudo ip link add link eth0 name eth0.100 type vlan id 100","n":"在 Linux 上造一个 VLAN 100 子接口，等价交换机上划一个 VLAN","s":"《系统》Linux.md · ip"},{"c":"ip -d link show eth0.100","n":"-d 会显示 vlan id 100 与 protocol 802.1Q，确认标签真挂上了","s":"《系统》Linux.md · ip"},{"c":"sudo tcpdump -eni eth0 -c 5 'vlan'","n":"只抓带 802.1Q 标签的帧，输出里能看到 vlan 100 与优先级","s":"补充（vault 无 tcpdump）"}],"ps":[{"c":"Get-NetIPAddress -AddressFamily IPv4 | Format-Table InterfaceAlias,IPAddress,PrefixLength","n":"按接口看网段：不同网段往往对应不同 VLAN","s":"《系统》PowerShell.md · 获取本机 IP 配置：Get-NetIPAddress"},{"c":"Get-NetAdapter | Format-Table Name,InterfaceDescription,LinkSpeed,MtuSize","n":"MTU 一栏：打标签后载荷少 4 字节，跨 trunk 容易撞 MTU","s":"《系统》PowerShell.md · 网络与系统管理"}],"cmd":[{"c":"ipconfig /all","n":"看每块网卡的 IP 与默认网关，确认主机落在哪个 VLAN 网段","s":"《系统》Windows CMD.md · ipconfig"},{"c":"netsh interface ipv4 show subinterfaces","n":"列出接口与 MTU，排查打过标签后大包不通","s":"《系统》Windows CMD.md · netsh"}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"双标签骗过外层剥离，DTP 一条网线谈成 trunk：隔离被两种方式绕开","lead":"VLAN 是隔离不是加密。攻击只做一件事：让帧出现在不该出现的 VID 上。","scenes":[{"name":"双标签跳跃（Double Tagging）","steps":[{"who":"攻击者 A","to":"交换机 S1（access 口，VLAN 10）","pkt":1,"bubble":"双 0x8100","hl":["Outer TPID","Outer TCI","Inner TPID","Inner TCI"],"vals":{"Outer TCI":"VID=1（native）","Inner TCI":"VID=20（想进的那个 VLAN）"},"say":"一帧塞两个标签：外层写 native VLAN，内层写想进的那个。","sub":"接入口只认外层，内层被当成载荷原样带走。","evil":true},{"who":"交换机 S1","to":"交换机 S2（trunk）","pkt":1,"bubble":"剥外层","hl":["Inner TPID","Inner TCI"],"vals":{"Inner TCI":"VID=20（此时成了线上唯一的标签）"},"say":"S1 按 native VLAN 处理，剥掉外层后从 trunk 发出。","sub":"剩下那一层，S2 会当成合法的 VLAN 20 标签。"},{"who":"交换机 S2","to":"VLAN 20 主机","pkt":1,"bubble":"投递成功","hl":["Destination Address","Inner TCI"],"vals":{"Destination Address":"VLAN 20 内某台主机的 MAC","Inner TCI":"VID=20 → 从 VLAN 20 的端口送出"},"say":"S2 按内层 VID=20 转发，帧落进目标 VLAN 的端口。","sub":"攻击者已经在目标广播域里了。"},{"who":"攻击者 A","to":"—","pkt":1,"bubble":"单向","hl":["Data + Pad"],"vals":{"Data + Pad":"伪造的 ARP 应答（网关 IP → 攻击者 MAC）"},"say":"这条路是单向的：目标 VLAN 的回包不会按原路回到攻击者。","sub":"所以双标签用来注入（投毒、扫端口），不是双向中间人。","evil":true},{"who":"交换机 S2","to":"受害者","pkt":1,"bubble":"缓存被覆盖","hl":["Destination Address"],"vals":{"Destination Address":"受害者 MAC（它的 ARP 缓存已指向攻击者）"},"say":"受害者接受伪造 ARP，把网关 MAC 换成攻击者，后续上行全走它。","sub":"单向注入加缓存覆盖，等于一侧中间人。"}],"cmds":{"linux":[{"c":"sudo tcpdump -eni eth0 'vlan and vlan'","n":"抓一帧两个标签的帧：输出会出现 vlan 1, vlan 20 两层","s":"补充（vault 无 tcpdump）"},{"c":"sudo tcpdump -eni eth0 'ether[12:2]=0x8100 and ether[16:2]=0x8100'","n":"按字节偏移硬匹配双标签：偏移 12 与 16 都是 0x8100","s":"补充（vault 无 tcpdump）"},{"c":"sudo ip link add link eth0 name eth0.20 type vlan id 20","n":"在本机造 VLAN 20 子接口：验证「能不能进那个 VLAN」最直接","s":"《系统》Linux.md · ip"}],"ps":[{"c":"Get-NetIPAddress -AddressFamily IPv4 | Format-Table InterfaceAlias,IPAddress,PrefixLength","n":"列出本机能到的网段：出现不属于自己 VLAN 的网段就是越界","s":"《系统》PowerShell.md · 获取本机 IP 配置：Get-NetIPAddress"},{"c":"Get-NetAdapterStatistics | Format-Table Name,ReceivedUnicastPackets","n":"收到本不该到达的帧，单播收包会异常增长","s":"《系统》PowerShell.md · 网络与系统管理"}],"cmd":[{"c":"arp -a","n":"看目标 VLAN 内的主机是否出现在本机 ARP 表——注入成功后会出现","s":"《系统》Windows CMD.md · arp"},{"c":"netsh interface ipv4 show interfaces","n":"接口与 MTU：双标签多 4 字节，跨 MTU 时大包先丢","s":"《系统》Windows CMD.md · netsh"}]}},{"name":"交换机欺骗：DTP 把接入口谈成 trunk","steps":[{"who":"攻击者 A","to":"交换机 S1","pkt":0,"bubble":"DTP 请求 trunk","hl":["Destination Address"],"vals":{"Destination Address":"01:80:c2:00:00:0d（DTP 组播，交换机必收）"},"say":"往接入口发 DTP 请求：端口若是 auto 或 desirable 就会谈成 trunk。","sub":"DTP 帧本身不带标签，谈成了后续帧才带。","evil":true},{"who":"交换机 S1","to":"攻击者 A","pkt":0,"bubble":"trunk 已启用","hl":["TPID","TCI"],"vals":{"TPID":"0x8100（该口开始收带标签帧）","TCI":"允许 VLAN 1-4094 全部"},"say":"端口变成 trunk，每个 VLAN 的带标签帧都送到这条网线。","sub":"一条网线等于全部 VLAN 的读权限。"},{"who":"攻击者 A","to":"—","pkt":0,"bubble":"读 VLAN 100","hl":["TPID","TCI","Data + Pad"],"vals":{"TCI":"VID=100（业务 VLAN）","Data + Pad":"别人的业务载荷，明文"},"say":"在 trunk 上抓包，VID=100 的业务流量整段可读。","sub":"标签只是分类标记，没有任何加密。","evil":true},{"who":"攻击者 A","to":"VLAN 20","pkt":0,"bubble":"改 VID 回注","hl":["TPID","TCI"],"vals":{"TCI":"改成 VID=20 再发回，直接落进目标 VLAN"},"say":"把抓到的帧改个 VID 再注入，等于在任意 VLAN 里有一台主机。","sub":"trunk 给的是读写权，不只是读。","evil":true}],"cmds":{"linux":[{"c":"sudo tcpdump -eni eth0 'ether dst 01:80:c2:00:00:0d'","n":"抓 DTP 帧：接入口还在发/回 DTP，就说明没关协商","s":"补充（vault 无 tcpdump）"},{"c":"sudo tcpdump -eni eth0 -c 10 'vlan'","n":"自己口上能抓到带标签帧，说明这个口已经是 trunk","s":"补充（vault 无 tcpdump）"},{"c":"sudo ip link add link eth0 name eth0.20 type vlan id 20 && sudo ip addr add 192.168.20.66/24 dev eth0.20","n":"造 VLAN 20 子接口并配址，验证能否与目标 VLAN 通信","s":"《系统》Linux.md · ip"}],"ps":[{"c":"Get-NetAdapter | Format-Table Name,Status,LinkSpeed","n":"确认网卡处于 Up 且能收到非本网段的帧","s":"《系统》PowerShell.md · 网络与系统管理"},{"c":"Get-NetIPAddress | Format-Table InterfaceAlias,IPAddress","n":"一个物理口上出现多个网段地址，就是越界信号","s":"《系统》PowerShell.md · 获取本机 IP 配置：Get-NetIPAddress"}],"cmd":[{"c":"ipconfig /all","n":"看网卡上是否出现多个网段地址——越界的直接信号","s":"《系统》Windows CMD.md · ipconfig"},{"c":"arp -a","n":"能直接解析到别的 VLAN 的主机 MAC，说明二层已经打通","s":"《系统》Windows CMD.md · arp"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"关协商、把 native VLAN 换成黑洞、收窄 trunk 允许列表：两条路同时断","lead":"双标签打的是 native VLAN，交换机欺骗打的是 DTP。一个改配置，一个关协议。","scenes":[{"name":"access 口写死 + native 隔离 + 允许列表收敛","steps":[{"who":"交换机 S1（接入口）","to":"—","pkt":0,"bubble":"mode access + nonegotiate","hl":["TCI"],"vals":{"TCI":"PVID=100（只做 access，不发也不应 DTP）"},"say":"接入口写死 access 且 nonegotiate：DTP 请求没人应答，谈不成 trunk。","sub":"漏配一个口，整台交换机的隔离就等于没有。"},{"who":"攻击者 A","to":"交换机 S1","pkt":1,"bubble":"外层不再命中","hl":["Outer TCI","Inner TCI"],"vals":{"Outer TCI":"VID=1 → native 已改成 999，不匹配","Inner TCI":"VID=20（进不来）"},"say":"native VLAN 换成不承载业务的 999，双标签的外层失去意义。","sub":"外层剥掉后落到黑洞 VLAN，内层到不了业务口。","evil":true},{"who":"交换机 S1","to":"交换机 S2（trunk）","pkt":1,"bubble":"VID 不在允许列表","hl":["Inner TCI"],"vals":{"Inner TCI":"VID=20 → 只放行 100 与 999，直接丢弃"},"say":"trunk 显式列出允许的 VLAN，没列的 VID 一律丢。","sub":"这条规则同时挡住跳跃与误配串 VLAN。"},{"who":"VLAN 100 主机","to":"交换机 S1","pkt":0,"bubble":"正常帧仍通","hl":["TPID","TCI"],"vals":{"TCI":"VID=100（业务 VLAN 放行）"},"say":"业务 VLAN 100 的帧照常打标签上行，隔离与连通同时成立。","sub":"代价是必须逐口、逐链路配置一致。"},{"who":"运维","to":"—","pkt":0,"bubble":"空口 shutdown","hl":["TCI"],"vals":{"TCI":"未用端口 shutdown 并划入黑洞 VLAN"},"say":"多余端口全关，能插线即用的口少一个，暴露面就少一块。","sub":"临时打开的口最容易被忘记恢复，整改后要复查。"}],"cmds":{"linux":[{"c":"bridge vlan show","n":"每个网桥端口的 PVID 与允许 VLAN 列表——交换机配置的等价物","s":"补充（bridge 命令，vault 未收录）"},{"c":"sudo bridge vlan add dev eth1 vid 100 pvid untagged","n":"把 eth1 配成 VLAN 100 的 access 口（PVID=100、出口不带标签）","s":"补充（bridge 命令，vault 未收录）"},{"c":"sudo bridge vlan add dev eth0 vid 100 tagged","n":"把 eth0 配成 trunk 只放行 VLAN 100，按需开而不是全开","s":"补充（bridge 命令，vault 未收录）"}],"ps":[{"c":"Get-NetAdapter | Format-Table Name,Status,MtuSize","n":"复核网卡状态与 MTU，改过 VLAN 后大包能不能过","s":"《系统》PowerShell.md · 网络与系统管理"},{"c":"Get-NetIPAddress -AddressFamily IPv4 | Format-Table InterfaceAlias,IPAddress","n":"确认主机只拿到本 VLAN 网段的地址","s":"《系统》PowerShell.md · 获取本机 IP 配置：Get-NetIPAddress"}],"cmd":[{"c":"netsh interface ipv4 show subinterfaces","n":"按接口看 MTU；不符时表现为小包通、大包不通","s":"《系统》Windows CMD.md · netsh"},{"c":"ipconfig /all","n":"确认主机地址没有越界到别的 VLAN 网段","s":"《系统》Windows CMD.md · ipconfig"}]}}]}]}},{"proto":{"id":"ppp","name":"PPP","cn":"点对点协议","en":"Point-to-Point Protocol","layer":"link","chapter":"第二章","extra":false,"oneLine":"点对点链路上的通用封装：一个可定界的帧 + LCP 建链 + PAP/CHAP 认证 + NCP（IPCP）配址，认证只证明「你是谁」，不保护「别人看不见」。","sections":[{"h":"PPP 把封装、建链、认证、配址拆成四件独立的事","p":"点对点协议（Point-to-Point Protocol, PPP）由三部分组成：把 IP 数据报封装到串行链路的方法（帧格式本身）、链路控制协议（Link Control Protocol, LCP）用于建立与测试链路、网络控制协议（Network Control Protocol, NCP）用于配置网络层参数。NCP 不是单一协议而是一族：承载 IP 时它就是 IP 控制协议（IP Control Protocol, IPCP）。\n\n这种拆分体现了一个清晰的分层思想：链路层参数（LCP）与网络层参数（NCP）解耦，同一条链路可以先跑 IP 再跑 IPX 而不必重建。PPP 的五阶段也是这个顺序：链路不可用 → 链路建立（LCP）→ 认证（PAP 或 CHAP）→ 网络层协议（IPCP）→ 链路终止（LCP）。"},{"h":"帧只有 6 个字段，协议字段负责多路分解","p":"PPP 帧是「标志 0x7E + 地址 0xFF + 控制 0x03 + 协议 2 字节 + 信息 + FCS 2 字节 + 标志 0x7E」。地址固定 0xFF、控制固定 0x03，因为点对点链路上只有两个对等体，既不需要寻址也不需要介质访问控制；这两个字节在协商地址控制压缩（Address-and-Control-Field-Compression, ACFC）后可以省掉。\n\n协议字段决定信息字段里装的是什么：0xC021 是 LCP、0xC023 是 PAP、0xC223 是 CHAP、0x8021 是 IPCP、0x0021 是 IPv4。信息字段长度可变，默认最大接收单元（Maximum Receive Unit, MRU）1500 字节。信息中出现 0x7E、0x7D 或小于 0x20 的字符时，用 0x7D 转义并与 0x20 异或。"},{"h":"LCP 是总控：Code/ID/Length 加选项 TLV 谈链路参数","p":"LCP 报文格式是 1 字节代码（Code）、1 字节标识符（Identifier）、2 字节长度（Length）和可变长数据。代码 1~4 是配置类（Configure-Request/Ack/Nak/Reject），5~6 是终止类，7 是 Code-Reject，8 是 Protocol-Reject，9~10 是 Echo-Request/Reply 保活，11 是 Discard-Request。配置请求的数据部分是一个个选项 TLV：类型 1 字节、长度 1 字节、值可变，常见类型有 1（MRU）、2（ACCM）、3（认证协议）、5（Magic-Number）、7（PFC）、8（ACFC）。\n\n标识符只解决「哪个响应对应哪个请求」的乱序问题：它从 0x01 起递增，可预测可枚举，不是随机数，因此不具备抗重放能力。与 TCP 序号不同，LCP 的 ID 是配对标签，不是安全参数。"},{"h":"PAP 两次握手明文，CHAP 三次握手挑战-响应","p":"密码认证协议（Password Authentication Protocol, PAP）是两次握手：被认证方直接发出「用户名 + 明文口令」，认证方查本地口令库后回确认或拒绝。缺陷在设计本身：口令明文上线，任何能嗅探链路的人都直接拿到；报文没有随机值，抓到的整个报文可以原样重放。\n\n询问握手认证协议（Challenge Handshake Authentication Protocol, CHAP）改成三次：认证方先发随机挑战值，被认证方回「用户名 + Hash(口令 ‖ 挑战值)」，认证方本地算出期望值比对，并周期性重新挑战。口令因此不上线，旧响应对新挑战也无效，重放的窗口被压掉。代价是认证方仍需保存可计算的明文口令，且弱口令加 MD5 仍可离线爆破。"},{"h":"IPCP 只在网络层阶段之后才被接受，代码只用 1~7","p":"IPCP 与 LCP 用同一套包交换机制，但协议字段是 0x8021，且只在 PPP 进入网络层协议阶段后才开始交换：在此之前收到的 IPCP 包一律丢弃。这条「阶段门禁」保证认证先于参数协商，攻击者不能跳过认证直接索要一个 IP 地址。\n\n它只增加三类配置选项：IP 地址（类型 3）、主 DNS（0x81）与次 DNS（0x83）服务器地址、以及 IP 压缩协议（类型 2，Van Jacobson 压缩）。代码字段只承认 1~7，其他值一律回 Code-Reject。地址分配是计费与授权真正的落点：谁拿到哪个地址、能用多久，全在这一步决定。"},{"h":"认证只解决「你是谁」，加密是另一件事","p":"PPP 的链路建立完成并不等于链路安全：认证通过后载荷仍然明文，FCS 也只是无密钥的 CRC-16。要防窃听与篡改，必须叠加密码学层——链路层可用微软点对点加密（Microsoft Point-to-Point Encryption, MPPE），或直接跑在 L2TP over IPsec、TLS 隧道里。\n\n还要理解协商本身是攻击面：认证方式由 LCP 协商决定，中间人只要改写 Configure-Request 里的认证协议选项，就能把 CHAP 谈成 PAP 甚至不认证，而两端都不会报错。所以真实加固必须「强制认证方式、拒绝降级」，不能只依赖协商结果。"}],"packets":[{"title":"PPP 帧（信息字段承载 LCP Configure-Request，含首尾 0x7E）","note":"首尾各一个 0x7E 做帧定界，地址固定 0xFF、控制固定 0x03。协议字段 0xC021 说明信息字段是一个 LCP 报文，共 15 字节。FCS 是 CRC-16，本例 0x90e5，线上小端为 e5 90。","hex":"7e ff 03 c0 21 01 01 00 0f 03 05 c2 23 05 05 06 00 00 00 01 e5 90 7e","fields":[{"name":"Flag","cn":"标志","off":0,"len":1,"bits":"","tone":"flag","desc":"0x7E，帧定界符，标识一帧的开始（帧尾还有同样的一个 0x7E）。","sec":"帧边界靠单字节 0x7E 判定，信息字段中的 0x7E 必须转义。只发一个孤立转义字节就断流，可让接收端解析器停在非法状态。"},{"name":"Address","cn":"地址","off":1,"len":1,"bits":"","tone":"addr","desc":"固定 0xFF（标准广播地址）。点对点链路只有两个对等体，没有寻址需求，取值恒定。","sec":"无鉴别能力。它既不是发送方标识也不是接收方标识，绝不能作为身份依据。"},{"name":"Control","cn":"控制","off":2,"len":1,"bits":"","tone":"flag","desc":"固定 0x03，即无编号帧（Unnumbered Information, UI），无序号、无确认。","sec":"没有序号意味着 PPP 帧本身无法检测重放与乱序，重放防护只能靠上层（如 CHAP 的随机挑战）。"},{"name":"Protocol","cn":"协议","off":3,"len":2,"bits":"","tone":"type","desc":"0xC021 = LCP、0xC023 = PAP、0xC223 = CHAP、0x8021 = IPCP、0x0021 = IPv4。本例 0xC021。","sec":"多路分解字段，可被用于类型混淆：把 PAP 报文标成 CHAP、或把未知协议塞进链路，取决于对端是否严格执行白名单。"},{"name":"Information","cn":"信息","off":5,"len":15,"bits":"","tone":"data","desc":"默认不超过 1500 字节（受 MRU 约束）。本例是一个完整的 LCP Configure-Request：01 01 00 0f + 两个选项。","sec":"承载上层报文，可能是明文口令（PAP）或哈希响应（CHAP）。字段长度由 MRU 协商，超长可被截断或丢弃。"},{"name":"FCS","cn":"帧校验序列","off":20,"len":2,"bits":"","tone":"check","desc":"CRC-16（多项式 0x8408 反射，初值 0xFFFF，结果取反），覆盖地址到信息字段，本例 0x90e5，小端发送。","sec":"无密钥，只能检错不能抗篡改；改报文后重算即可通过，不能替代认证。"},{"name":"Flag","cn":"结束标志","off":22,"len":1,"bits":"","tone":"flag","desc":"0x7E，与首部相同的定界符，标识帧结束。","sec":"结束标志可被提前插入以截断帧，造成后续字节被解析为一个新帧（帧拼接攻击）。"}]},{"title":"LCP Configure-Request（PPP 协议字段 0xC021 的载荷）","note":"两个选项：认证协议要求 CHAP/MD5（0xC223 + 算法 0x05），以及 Magic-Number 用于环路检测。长度字段 0x000f 是整个 LCP 报文（含 4 字节头）的长度。","hex":"01 01 00 0f 03 05 c2 23 05 05 06 00 00 00 01","fields":[{"name":"Code","cn":"代码","off":0,"len":1,"bits":"","tone":"type","desc":"1 = Configure-Request，2 = Configure-Ack，3 = Configure-Nak，4 = Configure-Reject，5/6 = Terminate-Request/Ack，7 = Code-Reject，8 = Protocol-Reject，9/10 = Echo-Request/Reply，11 = Discard-Request。","sec":"代码 3、4 是降级攻击的入口：伪造 Nak/Reject 可以迫使对端放弃强认证选项，改谈更弱的参数。"},{"name":"Identifier","cn":"标识符","off":1,"len":1,"bits":"","tone":"id","desc":"本例 0x01，通常从 0x01 起逐个加 1，响应报文必须回填相同的值。","sec":"只做请求-响应配对，可预测可枚举，不提供抗重放能力；攻击者能预判下一个 ID，从而伪造应答。"},{"name":"Length","cn":"长度","off":2,"len":2,"bits":"","tone":"len","desc":"0x000f = 15，表示整个 LCP 报文（代码 1 + 标识符 1 + 长度 2 + 数据 11）的总长度。","sec":"长度与实际字节数不符会导致解析越界；把长度写小可让尾部的选项被忽略，从而悄悄跳过认证选项。"},{"name":"Option 1 Type","cn":"选项 1 类型","off":4,"len":1,"bits":"","tone":"type","desc":"3 = Authentication-Protocol（认证协议）。其他常见类型：1 MRU、2 ACCM、5 Magic-Number、7 PFC、8 ACFC。","sec":"认证方式就是在这里谈出来的。中间人改写这个选项即可把 CHAP 降为 PAP，甚至删掉整个认证选项。"},{"name":"Option 1 Length","cn":"选项 1 长度","off":5,"len":1,"bits":"","tone":"len","desc":"5，表示该选项共 5 字节（类型 1 + 长度 1 + 值 3）。","sec":"选项长度是链式解析的唯一步进依据，畸形长度可造成跳过或重复解析。"},{"name":"Option 1 Value","cn":"选项 1 值","off":6,"len":3,"bits":"前 2 字节协议号，后 1 字节算法","tone":"id","desc":"0xC223 = CHAP，算法 0x05 = CHAP with MD5（RFC 1994）；若为 0xC023 + 0x05 则是 PAP。","sec":"算法字段决定了抗爆破强度：MD5 已被认为偏弱，MS-CHAPv2 也存在降级与离线破解路径，强场景应使用 EAP-TLS。"},{"name":"Option 2 Type","cn":"选项 2 类型","off":9,"len":1,"bits":"","tone":"type","desc":"5 = Magic-Number，用于检测链路环路（若收到的 Magic-Number 与自己发出的一致，说明帧被环回）。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Option 2 Length","cn":"选项 2 长度","off":10,"len":1,"bits":"","tone":"len","desc":"6，表示该选项共 6 字节（类型 1 + 长度 1 + 值 4）。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Option 2 Value","cn":"选项 2 值","off":11,"len":4,"bits":"","tone":"misc","desc":"0x00000001：本端随机生成的 Magic-Number。","sec":"它只是环路检测，不是随机挑战，不能被当作抗重放参数使用。"}]},{"title":"CHAP Challenge（认证方 → 被认证方，Code=1）","note":"Value-Size 说明随机值的长度（本例 16 字节，对应 MD5 输出长度），后面跟认证方的名字。这个挑战值每次认证都重新生成，是 CHAP 抗重放的全部依据。","hex":"01 07 00 1a 10 a1 b2 c3 d4 e5 f6 07 18 29 3a 4b 5c 6d 7e 8f 90 4c 4e 53 2d 31","fields":[{"name":"Code","cn":"代码","off":0,"len":1,"bits":"","tone":"type","desc":"1 = Challenge；2 = Response；3 = Success；4 = Failure（RFC 1994）。","sec":"代码 1 与 2 的配对靠标识符；伪造 Code=3 的 Success 报文可以直接骗过某些客户端实现。"},{"name":"Identifier","cn":"标识符","off":1,"len":1,"bits":"","tone":"id","desc":"本例 0x07。每发一次挑战必须改变，应答必须原样复制该值。","sec":"标识符可预测，但它不承担抗重放职责——抗重放靠的是每次不同的挑战值。"},{"name":"Length","cn":"长度","off":2,"len":2,"bits":"","tone":"len","desc":"0x001a = 26，= 4 字节头 + 1 字节 Value-Size + 16 字节值 + 5 字节名字。","sec":"长度字段与 Value-Size 的组合是常见的解析歧义点，可被用来制造越界读取。"},{"name":"Value-Size","cn":"值长度","off":4,"len":1,"bits":"","tone":"len","desc":"16，表示挑战值占 16 字节。CHAP 只规定这是 1 字节的长度，具体长度取决于摘要算法（MD5 为 16 字节）与实现。","sec":"长度可变意味着解析器必须严格边界检查；把该值写成 255 而实际数据不足，是典型的畸形报文攻击。"},{"name":"Value","cn":"挑战值","off":5,"len":16,"bits":"","tone":"data","desc":"本例 a1b2c3d4e5f60718293a4b5c6d7e8f90，16 字节随机数。","sec":"随机性质量决定抗重放与抗预计算能力。若随机源可预测，攻击者能预先算好响应值，CHAP 的保护就退化为 PAP。"},{"name":"Name","cn":"认证方名字","off":21,"len":5,"bits":"","tone":"data","desc":"ASCII “LNS-1”，告诉被认证方是谁在挑战它。","sec":"名字只是提示，客户端通常不做校验——这正是「假服务器」攻击可行的原因：被认证方无法验证对端身份。"}]},{"title":"CHAP Response（Code=2，口令不上线，只传哈希）","note":"Value 是 MD5(Identifier ‖ 口令 ‖ 挑战值) 的前 16 字节（RFC 1994 规定摘要覆盖标识符、口令与挑战），Name 是用户名。注意载荷里没有任何可还原口令的明文。","hex":"02 07 00 1a 10 3f 7a 91 c2 d4 e6 b8 05 1a 2c 3d 4e 5f 60 71 82 61 6c 69 63 65","fields":[{"name":"Code","cn":"代码","off":0,"len":1,"bits":"","tone":"type","desc":"2 = Response。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Identifier","cn":"标识符","off":1,"len":1,"bits":"","tone":"id","desc":"0x07，与收到的挑战一致，用于配对本次认证交换。","sec":"它同时参与哈希计算，因此同一口令对不同标识符算出的响应也不同。"},{"name":"Length","cn":"长度","off":2,"len":2,"bits":"","tone":"len","desc":"0x001a = 26（4 头 + 1 + 16 + 5）。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Value-Size","cn":"值长度","off":4,"len":1,"bits":"","tone":"len","desc":"16，MD5 摘要长度。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Value","cn":"响应值","off":5,"len":16,"bits":"","tone":"data","desc":"本例 3f7a91c2d4e6b8051a2c3d4e5f607182，是 MD5(0x07 ‖ 口令 ‖ 挑战值) 的结果。","sec":"摘要一旦被截获，攻击者就可以离线跑字典：对每个候选口令重算一次哈希比对。弱口令在秒级被还原，这是 CHAP 最主要的剩余风险。"},{"name":"Name","cn":"用户名","off":21,"len":5,"bits":"","tone":"data","desc":"ASCII “alice”，认证方据此检索本地口令库。","sec":"用户名明文出现，可用于账号枚举；配合响应值即可定向爆破某个已知账号。"}]},{"title":"PAP Authenticate-Request（Code=1，口令明文）","note":"Peer-ID-Length / Peer-ID 与 Password-Length / Password 两组「长度 + 值」串起来。值区不是以 0 结尾的字符串，完全靠长度字段切分。","hex":"01 01 00 11 05 61 6c 69 63 65 06 73 33 63 72 33 74","fields":[{"name":"Code","cn":"代码","off":0,"len":1,"bits":"","tone":"type","desc":"1 = Authenticate-Request；2 = Authenticate-Ack；3 = Authenticate-Nak。","sec":"PAP 只有这三种代码，没有挑战报文，因此整个认证过程不存在任何随机因素。"},{"name":"Identifier","cn":"标识符","off":1,"len":1,"bits":"","tone":"id","desc":"0x01，应答必须回填同一个值。","sec":"递增且可预测，不提供安全性。"},{"name":"Length","cn":"长度","off":2,"len":2,"bits":"","tone":"len","desc":"0x0011 = 17 = 4 + 1 + 5 + 1 + 6。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Peer-ID-Length","cn":"用户名长度","off":4,"len":1,"bits":"","tone":"len","desc":"5，表示用户名占 5 字节。","sec":"长度字段决定后面口令字段的起点，畸形值可让解析器把口令的一部分当成用户名。"},{"name":"Peer-ID","cn":"用户名","off":5,"len":5,"bits":"","tone":"data","desc":"ASCII “alice”，明文字节 61 6c 69 63 65。","sec":"账号明文出现，抓包即完成账号枚举。"},{"name":"Password-Length","cn":"口令长度","off":10,"len":1,"bits":"","tone":"len","desc":"6，表示口令占 6 字节。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Password","cn":"口令","off":11,"len":6,"bits":"","tone":"data","desc":"ASCII “s3cr3t”，明文字节 73 33 63 72 33 74。","sec":"整个协议最核心的缺陷：口令明文上线。任何能嗅探链路的人直接得到凭证，且该报文可原样重放通过认证。"}]},{"title":"IPCP Configure-Request（协议字段 0x8021）","note":"三个选项：IP 地址（类型 3）、主 DNS（0x81）、次 DNS（0x83），值都填 0.0.0.0 表示「请对方分配」。IPCP 只在网络层协议阶段之后才被接受。","hex":"01 02 00 16 03 06 00 00 00 00 81 06 00 00 00 00 83 06 00 00 00 00","fields":[{"name":"Code","cn":"代码","off":0,"len":1,"bits":"","tone":"type","desc":"1 = Configure-Request。IPCP 只使用 1~7，其他代码回 Code-Reject。","sec":"代码白名单本身就是一道边界：只认 1~7 可避免把 LCP 的保活/丢弃类报文误当配置报文处理。"},{"name":"Identifier","cn":"标识符","off":1,"len":1,"bits":"","tone":"id","desc":"0x02，与 LCP 一样用于请求-响应配对。","sec":"可预测，不抗重放。"},{"name":"Length","cn":"长度","off":2,"len":2,"bits":"","tone":"len","desc":"0x0016 = 22 = 4 + 6 + 6 + 6。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Option Type（IP-Address）","cn":"IP 地址选项","off":4,"len":1,"bits":"","tone":"type","desc":"3 = IP-Address，长度固定 6（类型 1 + 长度 1 + 地址 4）。","sec":"这是分配地址的地方，也是伪造地址的入口：客户端可以请求一个已被占用的地址，制造地址冲突。"},{"name":"Option Length","cn":"选项长度","off":5,"len":1,"bits":"","tone":"len","desc":"6。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"IP Address","cn":"请求的 IP 地址","off":6,"len":4,"bits":"","tone":"addr","desc":"0.0.0.0，表示请服务器分配；若填具体地址则是静态协商。","sec":"地址直接决定计费与访问控制归属，伪造请求可占用他人地址或绕过基于 IP 的策略。"},{"name":"Option Type（Primary DNS）","cn":"主 DNS 选项","off":10,"len":1,"bits":"","tone":"type","desc":"0x81 = Primary DNS Server，长度 6。","sec":"DNS 地址由服务器下发且客户端默认信任，恶意 BRAS 可下发自己的 DNS 做劫持。"},{"name":"Option Length","cn":"选项长度","off":11,"len":1,"bits":"","tone":"len","desc":"6。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Primary DNS Address","cn":"主 DNS 地址","off":12,"len":4,"bits":"","tone":"addr","desc":"0.0.0.0，请求服务器提供。","sec":"若被恶意服务器填成攻击者地址，之后所有域名解析都可被投毒。"},{"name":"Option Type（Secondary DNS）","cn":"次 DNS 选项","off":16,"len":1,"bits":"","tone":"type","desc":"0x83 = Secondary DNS Server，长度 6。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Option Length","cn":"选项长度","off":17,"len":1,"bits":"","tone":"len","desc":"6。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Secondary DNS Address","cn":"次 DNS 地址","off":18,"len":4,"bits":"","tone":"addr","desc":"0.0.0.0，请求服务器提供。","sec":"主 DNS 被墙时客户端会回落到次 DNS，同样是被投毒的机会。"}]}],"attacks":[{"name":"PAP Sniffing and Replay","cn":"PAP 口令嗅探与重放","impact":"口令明文泄露，且整个认证报文可原样重放通过，攻击者直接获得该用户的网络身份与计费归属。","steps":[{"who":"攻击者 A","to":"链路（串口/被镜像的接入链路）","label":"被动嗅探 PPP 帧，过滤 Protocol=0xC023","note":"捕获到 Code=1 的 Authenticate-Request 全文"},{"who":"攻击者 A","to":"—","label":"按 Peer-ID-Length/Peer-ID、Password-Length/Password 切分数据字段","note":"直接读出 “alice” 与 “s3cr3t”，无任何计算成本"},{"who":"攻击者 A","to":"认证方 NAS","label":"重放完全相同的 01 01 00 11 05 … 报文（可改 Identifier）","note":"PAP 无挑战值、无序号，NAS 无法区分这是新请求还是录播"},{"who":"认证方 NAS","to":"攻击者 A","label":"Code=2 Authenticate-Ack（Identifier 回填相同值）","note":"认证通过，攻击者获得该账号的 IP 地址与接入权限"},{"who":"攻击者 A","to":"内网 / 计费系统","label":"以受害者身份上网、访问内网资源","note":"身份与计费绑定被打破，日志里留下的是受害者的账号"}],"defense":"两端强制 ppp authentication chap 并禁用 PAP 回退；链路必须加密（MPPE 或 IPsec），使嗅探无法取得明文凭证。"},{"name":"LCP Authentication Downgrade","cn":"LCP 协商降级（把 CHAP 谈成 PAP）","impact":"认证强度由协商结果决定，中间人改写一个选项就能把 CHAP 降为 PAP，两端都不会报错。","steps":[{"who":"攻击者 A","to":"用户 C 与 NAS 之间","label":"截获 LCP Configure-Request：01 01 00 0f 03 05 c2 23 05 …","note":"看到对端要求 CHAP/MD5（0xC223 + 0x05）"},{"who":"攻击者 A","to":"认证方 NAS","label":"改写为 01 01 00 0f 03 05 c0 23 05（协议号改成 PAP），重算 FCS 后转发","note":"FCS 无密钥，改完重算即可通过校验"},{"who":"认证方 NAS","to":"攻击者 A","label":"Configure-Ack（02 01 00 0f …）","note":"NAS 认为对端只支持 PAP，协商「成功」，没有任何告警"},{"who":"用户 C","to":"认证方 NAS","label":"PAP Authenticate-Request（明文口令）","note":"口令以明文字节出现在链路上"},{"who":"攻击者 A","to":"—","label":"抓取 01 01 00 11 05 … 报文","note":"降级成功后，嗅探即等于拿到凭证"}],"defense":"两端用配置强制认证方式（不接受 Nak 降级、拒绝未知或弱选项），并对 LCP 选项做白名单校验与日志告警。"},{"name":"CHAP Offline Dictionary Attack","cn":"CHAP 响应离线爆破","impact":"口令本身不上线，但弱口令加 MD5 仍可在离线字典攻击下被还原，账号被完全接管。","steps":[{"who":"攻击者 A","to":"链路","label":"抓取 Challenge（Code=1，16 字节 Value）与 Response（Code=2，16 字节 Value）","note":"得到一对 (Identifier, 挑战值, 响应摘要)，无需与服务器交互"},{"who":"攻击者 A","to":"本地算力","label":"对字典中每个候选口令计算 MD5(Identifier ‖ 口令 ‖ 挑战值)","note":"纯离线，服务器完全无法察觉"},{"who":"攻击者 A","to":"—","label":"与抓到的响应摘要逐字节比对","note":"命中即恢复口令；常见弱口令在 GPU 上秒级完成"},{"who":"攻击者 A","to":"认证方 NAS","label":"用还原出的口令正常发起 CHAP 认证","note":"身份被接管，且这次认证在日志里看起来完全合法"}],"defense":"强制强口令、加长挑战值、改用 SHA-1/SHA-256 类摘要；高安全场景直接上 EAP-TLS 证书认证，避免任何可离线爆破的口令派生。"}],"defenses":[{"name":"强制 CHAP 并禁用 PAP","how":"在 NAS 与客户端两侧都配置认证方式为 CHAP（ppp authentication chap），拒绝协商到 PAP 或「不认证」；对 Configure-Nak 建议的弱选项一律拒绝而不是接受。","limit":"认证方必须能取到可计算的明文口令才能验证响应，口令库泄露即全线失守；弱口令仍可离线爆破；也只做了单向认证，客户端无法验证服务器。"},{"name":"链路层加密（MPPE / L2TP over IPsec）","how":"MPPE 用 RC4 与会话密钥（由 MS-CHAP 派生）加密 PPP 载荷；更彻底的做法是把 PPP 帧放进 IPsec ESP 或 TLS 隧道，由密码学层提供机密性与完整性。","limit":"MPPE 基于 RC4，早期 40/56 位密钥版本已被攻破；IPsec 带来 4%~8% 带宽开销与 MTU 缩减（需调 MSS），配置复杂，且端点被控时加密无效。"},{"name":"LCP 选项白名单与协商审计","how":"只接受已知且允许的选项类型与取值（认证协议必须是 CHAP 且算法足够强），对不符合的 Configure-Request 直接 Reject 并记录日志。","limit":"需要两端设备都支持细粒度策略，老旧 NAS 往往只能开关 PAP；配置过严会导致合法客户端无法上线，运维上常被放宽。"},{"name":"认证失败计数与账号锁定","how":"对同一账号的连续失败做计数与延迟/锁定，并告警异常来源（同一账号多地登录）。","limit":"可被用来做账号锁定型 DoS；对分布式慢速爆破效果有限；离线爆破根本不会触发这些计数。"}],"calcs":["checksum"],"quiz":[{"q":"CHAP 为什么能抵抗「抓到包就登录」的重放攻击？","options":["因为它把口令加密后传输","因为每次挑战的随机值不同，旧响应对新挑战无效，且口令从不上线","因为它在报文里加了递增序号"],"a":1,"why":"响应是 Hash(口令 ‖ 挑战值)，口令不出本机；挑战值每次重新生成，重放旧响应必然比对失败。但弱口令仍可离线爆破。"},{"q":"PAP 可被重放的根本原因是什么？","options":["口令用 Base64 编码，容易被解码","报文没有随机挑战值，认证请求与「新请求」无法区分","PAP 没有长度字段，解析会错位"],"a":1,"why":"PAP 是两次握手、明文、无随机因素，抓到的报文就是一个永远有效的凭证；Base64 只是编码，与重放无关。"},{"q":"若在进入网络层协议阶段之前收到 IPCP 包，PPP 应如何处理？","options":["正常处理，IPCP 与 LCP 没有先后要求","丢弃该包，IPCP 只在网络层协议阶段之后才被接受","回一个 Code-Reject 并重新协商 LCP"],"a":1,"why":"阶段门禁保证认证先于参数协商，防止攻击者跳过认证直接索要 IP 地址；在此之前收到的 IPCP 包一律丢弃。"}]},"script":{"id":"ppp","notes":{"Option 1 Value":{"short":"认证协议+算法，可被改","more":"3 字节：前 2 字节 PPP 协议号，后 1 字节算法。0xC223+0x05 是 CHAP/MD5，0xC023+0x05 是 PAP。改这两字节即可降级。","sec":"认证强度由协商结果决定，所以必须由策略锁死，不能听对方的建议。"},"Value-Size":{"short":"挑战值/摘要的长度","more":"1 字节，CHAP 只规定长度不规定值。MD5 时填 16；若摘要算法或实现变化，这位决定后面跟几个字节，长度与算法必须匹配。","sec":"长度字段是解析器的锚点，填错可让对端读越界或错位。"},"Value":{"short":"挑战值或响应摘要","more":"Challenge 里是随机数，Response 里是 MD5(Identifier ‖ 口令 ‖ 挑战值) 前 16 字节。两者等长，靠 Code 区分语义，线上都明文可见。","sec":"摘要可离线爆破，挑战值若可预测则退化成 PAP 的处境。"},"Password":{"short":"PAP 明文口令","more":"长度由 Password-Length 界定，不以下标 0 结尾。字段里就是口令的 ASCII 字节，抓包即得，且整条请求可原样重放。","sec":"这是 PPP 认证里最贵的一个字段，泄露即账号失守。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"LCP 谈参数、CHAP 验身份、IPCP 发地址：三个协议串在一条链路上","lead":"PPP 是一条点对点链路上的三段协商。注意顺序：参数先谈，身份再验，地址最后发。","scenes":[{"name":"建链 → 认证 → 配址","steps":[{"who":"客户端","to":"服务器 NAS","pkt":0,"bubble":"PPP 帧","hl":["Flag","Address","Control","Protocol"],"vals":{"Flag":"0x7E 帧定界","Address":"0xFF（点对点，取值固定）","Control":"0x03 无编号帧","Protocol":"0xC021 = LCP"},"say":"首尾各一个 0x7E 定界，地址固定 0xFF、控制固定 0x03。","sub":"没有序号也没有确认，PPP 本身不提供可靠传输。"},{"who":"客户端","to":"服务器 NAS","pkt":1,"bubble":"LCP Configure-Request","hl":["Code","Option 1 Type","Option 1 Value","Option 2 Type"],"vals":{"Code":"1 = Configure-Request","Option 1 Type":"3 = Authentication-Protocol","Option 1 Value":"0xC223 + 0x05 = CHAP/MD5","Option 2 Type":"5 = Magic-Number（环路检测）"},"say":"客户端提出：认证方式必须是 CHAP/MD5，并带一个 Magic-Number。","sub":"认证方式是被协商出来的——这正是被降级的地方。"},{"who":"服务器 NAS","to":"客户端","pkt":2,"bubble":"CHAP Challenge","hl":["Code","Identifier","Value-Size","Value","Name"],"vals":{"Code":"1 = Challenge","Identifier":"0x07（本题的交换编号）","Value-Size":"16（摘要算法决定的长度）","Value":"每次重新生成的随机数","Name":"LNS-1（自称的身份）"},"say":"认证方发一个随机挑战值，顺便报上自己的名字。","sub":"挑战值的新鲜度，是 CHAP 抗重放的全部依据。"},{"who":"客户端","to":"服务器 NAS","pkt":3,"bubble":"CHAP Response","hl":["Code","Identifier","Value","Name"],"vals":{"Code":"2 = Response","Identifier":"0x07（原样回填）","Value":"MD5(ID ‖ 口令 ‖ 挑战)","Name":"alice（供对端查库）"},"say":"客户端用口令和挑战值算摘要，只把摘要发回去。","sub":"线上没有口令，只有 16 字节哈希。"},{"who":"服务器 NAS","to":"客户端","pkt":5,"bubble":"IPCP 要地址","hl":["Code","Option Type（IP-Address）","IP Address","Primary DNS Address"],"vals":{"Code":"1 = Configure-Request","IP Address":"0.0.0.0（请服务器分配）","Primary DNS Address":"0.0.0.0（请服务器提供）"},"say":"认证通过才允许 IPCP：请求分配 IP 与 DNS。","sub":"认证阶段之前收到的 IPCP 会被直接丢弃。"}],"cmds":{"linux":[{"c":"ip -s link","n":"看 ppp0 的收发计数与 errors，确认链路真的起来了","s":"《系统》Linux.md · ip"},{"c":"sudo tcpdump -ni any -vv -c 5 'pppoes'","n":"若跑在 PPPoE 上，-vv 会把 LCP/CHAP 的协议字段解出来","s":"补充（vault 无 tcpdump）"},{"c":"sudo grep -iE 'auth|chap|pap' /etc/ppp/options","n":"本机 pppd 的认证配置，决定协商时会提什么条件","s":"补充（pppd 配置文件，vault 未收录）"}],"ps":[{"c":"Get-NetAdapter | Where-Object InterfaceDescription -like '*PPP*' | Format-Table Name,Status,LinkSpeed","n":"WAN Miniport (PPP/PPPoE) 的连接状态与速率","s":"《系统》PowerShell.md · 网络与系统管理"},{"c":"Get-NetIPAddress | Format-Table InterfaceAlias,IPAddress,PrefixLength","n":"IPCP 分配到的地址落在那块适配器上","s":"《系统》PowerShell.md · 获取本机 IP 配置：Get-NetIPAddress"}],"cmd":[{"c":"rasdial","n":"列出本机拨号连接与状态，PPP 链路是否已连接一目了然","s":"补充（Windows 自带，vault 未收录）"},{"c":"ipconfig /all","n":"PPP 适配器段落显示 IPCP 分配到的地址与 DNS","s":"《系统》Windows CMD.md · ipconfig"}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"重放打不穿 CHAP，但离线爆破能；真正省事的办法是把认证降级成 PAP","lead":"两个攻击各打一半：一个打摘要（口令强度），一个打协商（认证方式）。","scenes":[{"name":"CHAP 响应：重放无效，离线爆破有效","steps":[{"who":"攻击者 A","to":"链路","pkt":2,"bubble":"抓 Challenge","hl":["Value","Name"],"vals":{"Value":"挑战值 16 字节（明文传输）","Name":"LNS-1（还告诉你是谁在挑战）"},"say":"挑战值本身不保密，抓包就能拿到。","sub":"拿到它才能算摘要，但还缺口令。","evil":true},{"who":"攻击者 A","to":"服务器 NAS","pkt":3,"bubble":"重放旧 Response","hl":["Identifier","Value"],"vals":{"Identifier":"0x07（与请求对得上）","Value":"上一次抓到的旧摘要"},"say":"把上一次的 Response 原样重发：ID 对得上，但挑战值已经换了。","sub":"服务器算的是新挑战的摘要，旧值必然不匹配。","evil":true},{"who":"服务器 NAS","to":"攻击者 A","pkt":3,"bubble":"Failure","hl":["Code"],"vals":{"Code":"4 = Failure（认证失败）"},"say":"重放一次就废：每次挑战都换随机数，旧响应没有第二次价值。","sub":"所以打 CHAP 靠的不是重放，是离线爆破。"},{"who":"攻击者 A","to":"本地算力","pkt":3,"bubble":"离线算字典","hl":["Identifier","Value"],"vals":{"Identifier":"0x07（参与摘要计算）","Value":"MD5(0x07 ‖ 候选口令 ‖ 挑战值)，逐个比对"},"say":"抓到的是一对（挑战值，摘要），本地拿字典一个个算摘要比对。","sub":"全程不碰服务器，日志里什么都不会留。","evil":true},{"who":"攻击者 A","to":"—","pkt":3,"bubble":"命中弱口令","hl":["Name","Value"],"vals":{"Name":"alice（用户名也是明文）","Value":"候选口令命中 → 口令被还原"},"say":"弱口令几秒就命中：MD5 快，字典够大就够用。","sub":"口令一到手，攻击者认证起来与本人无异。","evil":true}],"cmds":{"linux":[{"c":"sudo tcpdump -ni any -X -c 20 'pppoes'","n":"-X 打十六进制：Challenge 与 Response 各 16 字节都在里面","s":"补充（vault 无 tcpdump）"},{"c":"printf '\\x07s3cr3t\\xa1\\xb2\\xc3\\xd4\\xe5\\xf6\\x07\\x18\\x29\\x3a\\x4b\\x5c\\x6d\\x7e\\x8f\\x90' | md5sum","n":"按 RFC 1994 算 MD5(ID ‖ 口令 ‖ 挑战)，一行就是一个候选口令","s":"补充（CHAP 摘要算法演示）"},{"c":"for p in 123456 password s3cr3t; do printf \"\\x07$p\\xa1\\xb2\\xc3\\xd4\\xe5\\xf6\\x07\\x18\\x29\\x3a\\x4b\\x5c\\x6d\\x7e\\x8f\\x90\" | md5sum; done","n":"三行输出 = 三个候选口令的摘要，与抓到的响应值逐行比对","s":"补充（离线字典爆破最小模型）"}],"ps":[{"c":"Get-NetAdapter | Where-Object InterfaceDescription -like '*PPP*' | Format-Table Name,Status","n":"确认这条链路爆破期间一直在线，否则抓不到有效样本","s":"《系统》PowerShell.md · 网络与系统管理"},{"c":"Get-NetIPAddress | Format-Table InterfaceAlias,IPAddress","n":"记录链路地址，便于把抓包与接口对应起来","s":"《系统》PowerShell.md · 获取本机 IP 配置：Get-NetIPAddress"}],"cmd":[{"c":"netsh ras show authmode","n":"本机 RAS 认证方式（需管理员）：出现 pap 就说明可降到明文","s":"补充（Windows 自带，vault 未收录）"},{"c":"rasdial","n":"看连接状态与被拒次数——离线爆破不会留下任何痕迹","s":"补充（Windows 自带）"}]}},{"name":"LCP 协商降级：两字节把 CHAP 换成 PAP","steps":[{"who":"攻击者 A","to":"链路","pkt":1,"bubble":"截获 CR","hl":["Code","Option 1 Value"],"vals":{"Code":"1 = Configure-Request","Option 1 Value":"0xC223 + 0x05（要求 CHAP/MD5）"},"say":"中间人截获客户端的 Configure-Request，看到要求的是 CHAP/MD5。","sub":"这个字段是明文，改起来没有任何门槛。","evil":true},{"who":"攻击者 A","to":"服务器 NAS","pkt":1,"bubble":"改成 PAP","hl":["Option 1 Value","Option 2 Value"],"vals":{"Option 1 Value":"0xC023 + 0x05（改成 PAP，只动 2 字节）","Option 2 Value":"原样保留（避免被怀疑）"},"say":"把 0xC223 改成 0xC023，重算 FCS 后转发给认证方。","sub":"没有完整性保护，改完两端都不会报错。","evil":true},{"who":"服务器 NAS","to":"客户端","pkt":1,"bubble":"Configure-Ack","hl":["Code","Identifier"],"vals":{"Code
