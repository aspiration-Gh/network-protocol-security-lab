Name"],"vals":{"Proto Name":"@cert-authority"},"say":"第一次连接就校验证书链，不再盲信对方递过来的公钥。","sub":"TOFU 的缺口全在首次连接，这里把它补上。"},{"who":"攻击者","to":"受害者 A","pkt":0,"bubble":"冒充失败","evil":true,"hl":["Proto Name"],"vals":{"Proto Name":"SSH- 但证书对不上"},"say":"攻击者仍回同一行版本串，但签发者不在信任列表里。","sub":"客户端直接断开，不会弹 yes/no。"},{"who":"客户端","to":"服务器","pkt":1,"bubble":"只留现代算法","hl":["kex_algorithms","server_host_key_algorithms"],"vals":{"kex_algorithms":"curve25519-sha256","server_host_key_algorithms":"ssh-ed25519"},"say":"清单里没有弱项，取交集不可能落到 group1 或裸 rsa-sha。","sub":"降级的前提是清单里有可降的东西。"},{"who":"服务器","to":"客户端","pkt":2,"bubble":"只留公钥认证","hl":["Method Name","Message Code"],"vals":{"Method Name":"publickey","Message Code":"52"},"say":"口令认证关闭，MaxAuthTries 设 3，爆破连入口都没有。","sub":"51 号消息里只剩 publickey 一种方法。"},{"who":"客户端","to":"服务器","pkt":0,"bubble":"22 只对管理网开","hl":["Proto Name"],"vals":{"Proto Name":"22 → 堡垒机"},"say":"22 端口只对管理网或堡垒机开放，外部访问先入 VPN。","sub":"边界收敛之后，算法加固才有意义。"}],"cmds":{"linux":[{"c":"sudo sshd -T | grep -Ei 'kexalgorithms|hostkeyalgorithms|ciphers|macs'","n":"打印生效配置：确认只剩 curve25519-sha256 与 ssh-ed25519","s":"补充（sshd -T 打印生效配置）"},{"c":"sudo sshd -T | grep -Ei 'passwordauthentication|maxauthtries|permitrootlogin'","n":"确认口令认证关闭、MaxAuthTries 3、root 不许直接登录","s":"补充（sshd -T 打印生效配置）"},{"c":"ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key-cert.pub","n":"查主机证书的签发 CA 与有效期，客户端只信 CA 就不必逐台预置指纹","s":"补充（ssh-keygen -l 打印证书）"}],"ps":[{"c":"ssh -o StrictHostKeyChecking=yes -o KexAlgorithms=curve25519-sha256 user@192.0.2.10","n":"客户端侧同样收紧：弱算法写在命令行里也连不上","s":"补充（OpenSSH 客户端选项）"}],"cmd":[{"c":"netsh advfirewall firewall show rule name=all | findstr /i \"22\"","n":"确认 22 只对管理网段放行，公网没有直接入口","s":"《系统》Windows CMD.md · netsh"}]}}]}]}},{"proto":{"id":"telnet","name":"Telnet","cn":"远程终端协议","en":"Telnet","layer":"application","chapter":"第五章","extra":true,"oneLine":"用一条字节流同时承载数据与命令的远程终端协议，靠 IAC 转义与选项协商工作，全程明文。","sections":[{"h":"NVT：给异构终端造一个共同的虚拟终端","p":"Telnet（RFC 854）要解决的问题很具体：一台 IBM 主机和一台 Unix 主机对行结束、字符集、终端的理解完全不同，直接互连必然错乱。它的解法是先定义一个网络虚拟终端 NVT，双方各自把本地表示转换成 NVT 再上网，落地时再转回来。NVT-ASCII 是 7 位字符集，行结束规定为 CR LF；如果只需要一个回车而不换行，必须写成 CR NUL，孤立的 CR 要避免。这条规则听起来琐碎，却保证了同一串字节在两端被解释成同样的意思——而所有注入类问题的着力点恰恰在这里：只要一端对字节的解释与另一端不同，夹带的字节就能变成命令。"},{"h":"IAC：命令与数据挤在同一条字节流里","p":"Telnet 没有独立的带内控制通道，命令和数据共用一条 TCP 流。它用一个保留字节 0xFF（IAC，Interpret As Command）当开关：0xFF 之后的那一个字节按命令码解释，而不是按字符解释。要让数据里真的出现 0xFF，必须写成两个 0xFF，接收方看到双写就还原成一个数据字节。命令码集中在 240 到 255：SE、NOP、DM、BRK、IP、AO、AYT、EC、EL、GA、SB，以及 WILL、WONT、DO、DONT。这个设计的代价是：任何一个把用户输入拼进 Telnet 流的程序，都必须先做 0xFF 转义，漏一次就等于给对端开了一条注入通道。"},{"h":"选项协商：四个动词，两个方向，各自独立","p":"选项用四个动词协商：WILL 表示我愿意或我正在执行，DO 表示请你执行，WONT 表示我不做或停止，DONT 表示请你停止。每个方向单独协商——服务器发 IAC WILL ECHO 是声明\"由我来回显你输入的字符\"，客户端回 IAC DO ECHO 表示同意，于是客户端关掉本地回显，这就是登录时口令不上屏的原因。常见选项包括 ECHO（1）、SUPPRESS-GO-AHEAD（3）、TERMINAL-TYPE（24）、NAWS（31，窗口大小）与 LINEMODE（34）。协商可以被拒绝，但拒绝必须被状态机记住，否则对端反复重发请求就会形成无休止的协商循环。"},{"h":"子协商：SB 把结构化参数塞进流里","p":"带参数的选项用子协商表达：IAC SB 加选项码加若干参数字节，最后以 IAC SE 收尾。终端类型的问答最典型：服务器发 IAC DO TERMINAL-TYPE，客户端回 IAC WILL TERMINAL-TYPE；服务器再发 IAC SB TERMINAL-TYPE 1（SEND）IAC SE，客户端用 IAC SB TERMINAL-TYPE 0（IS）加 xterm 加 IAC SE 回答。注意 SB 段里没有长度字段，边界完全由 IAC SE 的位置决定，段内字节也必须遵守 0xFF 转义。只要有一个 0xFF 没被双写，边界就会错位，后面的数据会被当成命令码执行，这是 Telnet 解析器最常出事的地方。"},{"h":"为什么它必然被 SSH 取代","p":"Telnet 的所有缺陷指向同一件事：它假设链路可信。口令与全部会话内容明文传输，嗅探者不需要任何技巧就能拿到凭据；TCP 之上没有完整性校验，中间人可以插字节、改命令；更麻烦的是命令与数据同流这个结构，让 0xFF 成为永久的注入面。SSH 在同一位置做了三件 Telnet 做不到的事：先建立加密信道再认证，用 MAC 保护每一个包，把控制信令放进独立的协议层而不是数据流里。因此今天的 Telnet 只剩设备带外管理口与老旧工控场景，而且必须关在隔离网内、只从管理网访问。"}],"packets":[{"title":"选项协商：IAC WILL ECHO 与 IAC DO ECHO","note":"每个方向独立协商；服务器声明自己回显，客户端同意后关闭本地回显","hex":"ff fb 01 ff fd 01","fields":[{"name":"IAC","cn":"命令引导符","off":0,"len":1,"bits":"","tone":"esc","desc":"0xFF，Interpret As Command。它把流从\"数据模式\"切到\"命令模式\"，后面的一个字节必须按命令码解释而不是按字符解释。","sec":"这是整个协议最脆弱的一个字节：任何未能对它做转义的数据通道，都变成了向对端发命令的通道。"},{"name":"WILL","cn":"WILL 命令","off":1,"len":1,"bits":"","tone":"cmd","desc":"251。发送方声明\"我愿意／我已经开始执行该选项\"。这里服务器说自己会回显客户端输入的字符。","sec":"WILL 是单向声明，对方可以用 DONT 拒绝；不校验对方是否真的执行，是日志与实际行为不一致的常见来源。"},{"name":"Option ECHO","cn":"选项：回显","off":2,"len":1,"bits":"","tone":"opt","desc":"1 = ECHO。服务器回显意味着终端侧不再本地回显，用户敲的字符由服务器送回来显示。","sec":"正因如此，攻击者注入一条 WILL ECHO 就能让用户看不到自己输入的口令，而字节照样明文上网。"},{"name":"IAC","cn":"命令引导符","off":3,"len":1,"bits":"","tone":"esc","desc":"第二个 IAC，开始反方向的协商。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"DO","cn":"DO 命令","off":4,"len":1,"bits":"","tone":"cmd","desc":"253。发送方请求对方执行该选项，或确认自己期望对方执行。这里是客户端同意由服务器回显。","sec":"DO 与 WILL 成对出现才形成一致状态；只发 DO 不发 WILL 的实现会造成半开协商，行为不可预测。"},{"name":"Option ECHO","cn":"选项：回显","off":5,"len":1,"bits":"","tone":"opt","desc":"同一个选项号 1，方向相反。选项号空间是全局的，方向由 WILL/DO 决定。","sec":"本字段在常见攻击中不作为独立手段。"}]},{"title":"子协商 SB…SE：终端类型 xterm 的回答","note":"IAC SB + 选项号 + 限定符 + 参数 + IAC SE，SB 段内部同样要遵守 0xFF 转义","hex":"ff fa 18 00 78 74 65 72 6d ff f0","fields":[{"name":"IAC","cn":"命令引导符","off":0,"len":1,"bits":"","tone":"esc","desc":"0xFF，进入命令模式。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"SB","cn":"子协商开始","off":1,"len":1,"bits":"","tone":"cmd","desc":"250。表示后面是一段属于某个选项的结构化参数，直到 IAC SE 为止。","sec":"SB 段是 Telnet 里唯一能携带长参数的地方，也是历史上缓冲区溢出最集中的位置。"},{"name":"Option TERMINAL-TYPE","cn":"选项：终端类型","off":2,"len":1,"bits":"","tone":"opt","desc":"24。终端类型选项有三条子命令：1 = SEND（请对方报类型），0 = IS（我的是这个），2 = 帮助信息。","sec":"服务器按终端类型选择控制序列，伪造一个特殊类型可诱使服务器发出可被终端误解的转义序列。"},{"name":"Qualifier IS","cn":"限定符 IS","off":3,"len":1,"bits":"","tone":"arg","desc":"0 表示 IS，即\"我的终端类型就是后面这串\"。","sec":"限定符不在 0/1/2 之内时，不同实现的处理从忽略到崩溃都有，是模糊测试的常见入口。"},{"name":"Terminal Type","cn":"终端类型串","off":4,"len":5,"bits":"","tone":"data","desc":"xterm，长度由 SB 与 IAC SE 之间的边界决定，没有显式长度字段。","sec":"没有长度前缀意味着解析完全依赖 IAC SE 的位置；一个未转义的 0xFF 就能让边界错位，把后面的数据当命令执行。"},{"name":"IAC","cn":"命令引导符","off":9,"len":1,"bits":"","tone":"esc","desc":"结束子协商前的 IAC。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"SE","cn":"子协商结束","off":10,"len":1,"bits":"","tone":"cmd","desc":"240。End of subnegotiation，SB 段到此为止。","sec":"缺失 SE 会让接收方一直等待，形成状态机卡死；多发 SE 则可能被当成数据。"}]},{"title":"数据流里的 0xFF 与裸 CR：NVT 的两条转义规则","note":"数据里的 0xFF 双写，单独的回车写成 CR NUL；本例为用户输入 cat 加一个字面 0xFF 再回车","hex":"63 61 74 20 ff ff 0d 00","fields":[{"name":"Data","cn":"数据字节","off":0,"len":3,"bits":"","tone":"data","desc":"cat 三个可打印字符，按 NVT-ASCII 直接传输。NVT-ASCII 是 7 位字符集，但传输字节仍是 8 位。","sec":"命令内容明文可见，攻击者能直接看出用户在执行什么。"},{"name":"SP","cn":"空格","off":3,"len":1,"bits":"","tone":"sep","desc":"普通空格字符，没有特殊语义。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"IAC IAC","cn":"转义的 0xFF","off":4,"len":2,"bits":"","tone":"esc","desc":"两个连续的 0xFF：第一个是 IAC，第二个是被转义的数据字节。接收方必须把它还原成单个 0xFF 数据。","sec":"转义规则是防御注入的唯一手段；少做一次双写，数据就变成了发给对端的命令。"},{"name":"CR","cn":"回车","off":6,"len":1,"bits":"","tone":"term","desc":"0x0D。NVT 规定 CR 后面必须跟 LF（换行）或 NUL，不能单独出现。","sec":"孤立的 CR 会让接收方无法判断这是\"换行\"还是\"回到行首\"，这一歧义可被用来构造显示欺骗。"},{"name":"NUL","cn":"CR 的填充字节","off":7,"len":1,"bits":"","tone":"pad","desc":"0x00。CR NUL 表示\"只想要一个回车\"这一动作，而不是换行。","sec":"本字段在常见攻击中不作为独立手段。"}]}],"attacks":[{"name":"Cleartext Sniffing and Session Hijack","cn":"明文嗅探与会话劫持","impact":"凭据直接泄露，攻击者还可以接管已建立的会话注入命令。","steps":[{"who":"攻击者","to":"接入交换机","label":"镜像口或共享网段抓包，过滤 tcp port 23","note":"Telnet 无加密，抓到即得到完整会话文本"},{"who":"客户端","to":"Telnet 服务器","label":"login: admin\\r\\n","note":"用户名以 NVT-ASCII 明文出现"},{"who":"服务器","to":"客户端","label":"Password: （此时 IAC WILL ECHO 已生效）","note":"本地不回显只影响屏幕显示，字节仍然明文上网"},{"who":"客户端","to":"Telnet 服务器","label":"P@ssw0rd\\r\\n","note":"口令明文可见，攻击者无需破解"},{"who":"攻击者","to":"Telnet 服务器","label":"用同一凭据登录，或按四元组与序列号向现有连接注入命令","note":"协议没有会话凭证，服务器无法区分本人与持包人"}],"defense":"禁用 23 端口改用 SSH；确需保留的放进带外管理网并全程审计。"},{"name":"IAC Sequence Injection","cn":"IAC 会话语义注入","impact":"攻击者用数据通道改掉客户端行为：口令不回显、进程被杀、终端类型被伪造。","steps":[{"who":"攻击者","to":"业务系统","label":"提交含 0xFF 的内容，如文件名 report\\xff\\xfb\\x01.txt","note":"攻击者只需找到一个会被回显或转发到终端的数据入口"},{"who":"业务系统","to":"Telnet 网关","label":"把该内容原样写入 Telnet 流，未做 0xFF 双写","note":"转义缺失使数据字节获得了命令语义"},{"who":"Telnet 客户端","to":"本地终端","label":"收到 0xFF 0xFB 0x01，解析为 IAC WILL ECHO","note":"客户端以为服务器会回显，于是关闭本地回显"},{"who":"受害者","to":"Telnet 客户端","label":"继续输入口令","note":"口令既不上屏也无从核对，但仍明文发往对端，攻击者嗅探即可获得"},{"who":"攻击者","to":"Telnet 客户端","label":"追加 0xFF 0xF4（IAC IP）或 0xFF 0xFA 0x18 … 0xFF 0xF0","note":"前者中断前台进程，后者伪造终端类型，改变后续所有控制序列的解释"}],"defense":"所有写入 Telnet 流的外部数据强制 0xFF 双写，网关侧只放行必要选项。"},{"name":"Option Negotiation Storm","cn":"选项协商风暴","impact":"单条连接即可让老旧设备的管理口失去响应，属于低速率拒绝服务。","steps":[{"who":"攻击者","to":"Telnet 服务器","label":"对每个选项连续发 IAC DO 1 / DO 3 / DO 24 …","note":"每条报文只有 3 字节，成本极低"},{"who":"服务器","to":"攻击者","label":"IAC WONT 1（拒绝）","note":"服务器按协议回复拒绝"},{"who":"攻击者","to":"Telnet 服务器","label":"立即重发 IAC DO 1","note":"拒绝不被接受，协商状态无法收敛"},{"who":"服务器","to":"攻击者","label":"再次 IAC WONT 1，双方在 3 字节报文上来回","note":"CPU 与带宽被这种微流量占满，合法用户无法进入登录"}],"defense":"实现完整的协商状态机，记住已拒绝的选项并忽略重复请求，同时对 23 端口会话限速。"}],"defenses":[{"name":"以 SSH 取代 Telnet","how":"关闭 23 端口，改用 SSH（22 端口）做交互式登录，文件传输走 SFTP；非交互管理改用 NETCONF over SSH 或厂商 API。","limit":"老旧交换机、工控 PLC、Console 服务器往往只支持 Telnet，替换意味着换硬件；很多设备的救援通道仍是 Telnet。"},{"name":"带外管理网隔离","how":"Telnet 只允许从独立的管理网访问，经跳板机与 ACL 限制，管理口不与业务网互通。","limit":"隔离只挡住外部，管不住被突破后的横向移动与内部人员；管理网一旦失守，全部设备同时暴露。"},{"name":"网关侧 IAC 转义与选项白名单","how":"任何把外部数据写入 Telnet 流的组件都必须对 0xFF 做双写，并只放行 ECHO、SGA、TERMINAL-TYPE、NAWS 等必要选项。","limit":"只堵注入，不解决明文传输；转义漏一处就整体失效，第三方组件的行为也难以审计。"}],"calcs":[],"quiz":[{"q":"Telnet 数据流里要传一个真正的 0xFF 字节，应该怎么写？","options":["直接写一个 0xFF","写成两个连续的 0xFF","写成 0xFF 0x00"],"a":1,"why":"第一个 0xFF 是 IAC 引导符，第二个是被转义的数据字节，接收方还原成一个 0xFF；单写会被当成命令引导。"},{"q":"服务器发送 IAC WILL ECHO 的含义是什么？","options":["请求客户端回显","服务器声明由自己回显，客户端应关闭本地回显","要求关闭回显"],"a":1,"why":"WILL 是\"我愿意执行\"的声明，ECHO 选项的含义是回显对方输入；客户端回 DO ECHO 后关掉本地回显，避免字符重复。"},{"q":"为什么选项协商可能形成无限循环？","options":["因为 TCP 会重传丢失的协商报文","因为一方反复请求、另一方反复拒绝，状态机若不记录已拒绝项就会永远往复","因为 IAC 只能单向发送"],"a":1,"why":"协议没有规定拒绝后不得重发请求，实现必须记录协商状态并忽略重复请求，否则 3 字节报文就能互相刷屏。"}]},"script":{"id":"telnet","notes":{"IAC":{"short":"0xFF 开关，之后一字节是命令","more":"Interpret As Command：这个字节把流从数据模式切到命令模式，紧接的一个字节按命令码解释；数据里要出现 0xFF 必须双写。","sec":"任何未对 0xFF 转义的数据通道，都变成了向对端发命令的通道。"},"Option ECHO":{"short":"回显选项，关掉本地回显","more":"服务器发 WILL ECHO 表示由它回显，客户端回 DO ECHO 后关闭本地回显，这就是登录时口令不上屏的全部机制。","sec":"注入一条 WILL ECHO 就能让用户看不到自己输入的口令，而字节照样明文上网。"},"Terminal Type":{"short":"无长度字段，边界只靠 IAC SE","more":"SB 段里没有长度前缀，字符串一直到 IAC SE 为止；段内字节同样要遵守 0xFF 转义，漏一次边界就会错位。","sec":"边界错位后，后面的数据会被当成命令码执行，这是 Telnet 解析器最常出事的地方。"},"SB":{"short":"子协商开始，到 IAC SE 结束","more":"250，表示后面是一段属于某个选项的结构化参数；终端类型、窗口大小这类带参数的选项都靠它承载。","sec":"SB 段是 Telnet 里唯一能携带长参数的地方，也是缓冲区溢出最集中的位置。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"0xFF 划界、四个动词协商、SB 段承载参数：全部明文","lead":"只看两个字节就够：0xFF 让流切到命令模式，双写 0xFF 再把它变回数据。","scenes":[{"name":"协商与转义","steps":[{"who":"服务器","to":"客户端","pkt":0,"bubble":"IAC WILL ECHO","hl":["IAC","WILL","Option ECHO"],"vals":{"IAC":"0xFF","WILL":"251","Option ECHO":"1（ECHO）"},"say":"服务器声明由它回显，这是口令不上屏的全部机制。","sub":"选项号是全局的，方向由 WILL/DO 决定。"},{"who":"客户端","to":"服务器","pkt":0,"bubble":"IAC DO ECHO","hl":["IAC","DO","Option ECHO"],"vals":{"DO":"253","Option ECHO":"1"},"say":"客户端同意，随后关掉本地回显，避免字符重复。","sub":"两个方向各自协商，状态机必须记住结果。"},{"who":"服务器","to":"客户端","pkt":1,"bubble":"询问终端类型","hl":["SB","Option TERMINAL-TYPE"],"vals":{"SB":"250","Option TERMINAL-TYPE":"24"},"say":"带参数的选项走子协商：IAC SB 加选项码，用 IAC SE 收尾。","sub":"SB 段没有任何长度字段，边界只认 SE 的位置。"},{"who":"客户端","to":"服务器","pkt":1,"bubble":"IS xterm","hl":["Qualifier IS","Terminal Type","SE"],"vals":{"Qualifier IS":"0（IS）","Terminal Type":"xterm","SE":"240"},"say":"客户端把终端类型塞进 SB 段，服务器据此挑控制序列。","sub":"段内字节同样要 0xFF 转义，漏一次边界就错位。"},{"who":"客户端","to":"服务器","pkt":2,"bubble":"cat + 0xFF + 回车","hl":["Data","IAC IAC","CR","NUL"],"vals":{"Data":"cat","IAC IAC":"0xFF 0xFF","CR":"0x0D","NUL":"0x00"},"say":"数据里要出现 0xFF 必须双写；孤立回车写成 CR NUL。","sub":"NVT 只有这两条转义规则，全靠实现老实遵守。"}],"cmds":{"linux":[{"c":"telnet 192.0.2.10","n":"连 23 端口；登录后 Ctrl+] 再输入 toggle options 能看实时协商","s":"补充（telnet 客户端，仓库未收录）"},{"c":"timeout 3 telnet 192.0.2.10 | od -An -tx1 -w16","n":"把服务端发来的字节按十六进制看：ff fb 01 就是 IAC WILL ECHO","s":"补充（od 十六进制查看）"},{"c":"ss -tnie '( dport = :23 )'","n":"看会话字节计数；Telnet 全明文，收发量与会话内容一一对应","s":"补充（ss 套接字统计，仓库未收录）"}],"ps":[{"c":"Test-NetConnection 192.0.2.10 -Port 23","n":"测 23 端口；通了说明明文终端还开着","s":"《系统》PowerShell.md · 10. Cmdlet 网络与系统管理"}],"cmd":[{"c":"netstat -an | findstr :23","n":"看本机 23 端口的连接状态","s":"《系统》Windows CMD.md · netstat"}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"一条路听内容，一条路改行为：明文与同流命令各是一个入口","lead":"嗅探不需要技巧，注入只需要一个没做转义的入库点。","scenes":[{"name":"明文嗅探与会话劫持","steps":[{"who":"攻击者","to":"接入交换机","pkt":2,"bubble":"镜像口抓包","evil":true,"hl":["Data"],"vals":{"Data":"tcp port 23"},"say":"同网段或镜像口抓包，整条会话都是可读文本。","sub":"协议没有任何加密层，抓到即得到内容。"},{"who":"客户端","to":"服务器","pkt":2,"bubble":"login: admin","hl":["Data"],"vals":{"Data":"login: admin"},"say":"用户名以 NVT-ASCII 明文出现，就是屏幕上的那行字。","sub":"口令还没开始，账户名已经交出去了。"},{"who":"服务器","to":"客户端","pkt":0,"bubble":"Password:","hl":["Option ECHO"],"vals":{"Option ECHO":"1（不回显）"},"say":"IAC WILL ECHO 只让屏幕不显示，字节照旧明文上网。","sub":"看不见不等于加密，这是最容易误解的一点。"},{"who":"客户端","to":"服务器","pkt":2,"bubble":"P@ssw0rd","hl":["Data","CR"],"vals":{"Data":"P@ssw0rd","CR":"0x0D"},"say":"口令就在载荷里，攻击者不需要任何破解。","sub":"CR NUL 还是 CR LF 只影响回车语义，不影响可读性。"},{"who":"攻击者","to":"服务器","pkt":2,"bubble":"重放凭据","evil":true,"hl":["Data"],"vals":{"Data":"USER/PASS 重放"},"say":"协议没有会话凭证，持包人就是本人，服务器分不出来。","sub":"四元组对上还能直接往现有连接里注入命令。"}],"cmds":{"linux":[{"c":"sudo tcpdump -i eth0 -A 'tcp port 23'","n":"-A 直接打出可读文本，login 与口令两行原样可见","s":"补充（tcpdump，仓库未收录）"},{"c":"sudo tcpdump -i eth0 -X 'tcp port 23'","n":"-X 十六进制加 ASCII，能看到 IAC（ff）协商与明文数据混在一起","s":"补充（tcpdump，仓库未收录）"},{"c":"ss -tnie '( dport = :23 )'","n":"确认连接仍活跃；没有会话令牌，四元组对上就能注入","s":"补充（ss 套接字统计，仓库未收录）"}],"ps":[{"c":"Get-NetTCPConnection -RemotePort 23","n":"列出到 23 端口的连接与进程，确认谁在明文登录","s":"《系统》PowerShell.md · 10. Cmdlet 网络与系统管理"}],"cmd":[{"c":"netstat -ano | findstr :23","n":"看连接状态与占用进程 PID","s":"《系统》Windows CMD.md · netstat"}]}},{"name":"IAC 会话语义注入","steps":[{"who":"攻击者","to":"业务系统","pkt":1,"bubble":"report\\xff\\xfb\\x01.txt","evil":true,"hl":["Terminal Type"],"vals":{"Terminal Type":"report + 0xFF 0xFB 0x01 + .txt"},"say":"找一个会被回显或转发到终端的数据入口，把 0xFF 藏进文件名。","sub":"只需要一个没做转义的入库点。"},{"who":"业务系统","to":"Telnet 网关","pkt":1,"bubble":"原样写入","hl":["Terminal Type"],"vals":{"Terminal Type":"未双写，直接写入"},"say":"缺一次 0xFF 双写，数据字节就获得了命令语义。","sub":"转义规则是唯一防线，漏一处整体失效。"},{"who":"Telnet 客户端","to":"本地终端","pkt":0,"bubble":"解析成 IAC WILL ECHO","hl":["IAC","WILL","Option ECHO"],"vals":{"IAC":"0xFF","WILL":"251","Option ECHO":"1"},"say":"客户端把它当成服务器协商，回 DO ECHO 后关掉本地回显。","sub":"从此用户输入什么都不会出现在屏幕上。"},{"who":"受害者","to":"Telnet 客户端","pkt":2,"bubble":"继续输入口令","hl":["Data"],"vals":{"Data":"口令（不上屏）"},"say":"口令既看不到也无法核对，仍明文发往对端。","sub":"嗅探这条路同时被打开。"},{"who":"攻击者","to":"Telnet 客户端","pkt":1,"bubble":"伪造子协商","evil":true,"hl":["SB","Option TERMINAL-TYPE"],"vals":{"SB":"0xFF 0xFA（伪造 SB）","Option TERMINAL-TYPE":"24 → 换掉终端类型"},"say":"再灌一段伪造的 SB，把终端类型改成服务端预期外的值。","sub":"之后服务器发的每个控制序列都被解释错。"}],"cmds":{"linux":[{"c":"printf 'report\\xff\\xfb\\x01.txt' | xxd","n":"构造带 0xFF 的载荷：ff fb 01 就是 IAC WILL ECHO","s":"补充（xxd 十六进制查看）"},{"c":"printf '\\xff\\xfb\\x01' | nc -w1 192.0.2.10 23","n":"把未转义的协商字节直接灌进 23 端口，看对端是否按命令解析","s":"补充（nc 裸 TCP 发送）"},{"c":"ss -tnie '( dport = :23 )'","n":"确认注入走的还是同一条明文会话","s":"补充（ss 套接字统计，仓库未收录）"}],"ps":[{"c":"Test-NetConnection 192.0.2.10 -Port 23","n":"先确认 23 可达，注入才有对象","s":"《系统》PowerShell.md · 10. Cmdlet 网络与系统管理"}],"cmd":[{"c":"netstat -an | findstr :23","n":"确认会话存在，注入与嗅探走同一条流","s":"《系统》Windows CMD.md · netstat"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"关端口、双写转义、选项白名单：三道闸各挡一类问题","lead":"换协议消掉明文，转义消掉注入，白名单消掉多余的协商面。","scenes":[{"name":"关端口 + 转义 + 白名单","steps":[{"who":"管理员","to":"接入设备","pkt":0,"bubble":"23 关闭","hl":["Option ECHO"],"vals":{"Option ECHO":"23 → 停止监听"},"say":"先关端口：交互登录一律改走 22 的 SSH。","sub":"换协议是唯一能把明文问题一次性消掉的办法。"},{"who":"业务系统","to":"Telnet 网关","pkt":1,"bubble":"0xFF → 0xFF 0xFF","hl":["Terminal Type"],"vals":{"Terminal Type":"双写转义后"},"say":"所有外部数据写进流之前强制双写，注入字节退化回普通字符。","sub":"转义必须落在写入口，不能靠事后过滤。"},{"who":"Telnet 客户端","to":"本地终端","pkt":0,"bubble":"只放行白名单选项","hl":["IAC","WILL","Option ECHO"],"vals":{"WILL":"仅 ECHO/SGA/TT/NAWS","Option ECHO":"1"},"say":"网关只放行 ECHO、SGA、TERMINAL-TYPE、NAWS，多余协商直接拒。","sub":"状态机记住已拒绝项，顺带堵住协商风暴。"},{"who":"攻击者","to":"Telnet 网关","pkt":1,"bubble":"同一个文件名","evil":true,"hl":["Terminal Type"],"vals":{"Terminal Type":"report + 0xFF 0xFB 0x01 + .txt"},"say":"同样的载荷再来一次，两个 0xFF 被还原成数据而不是命令。","sub":"文件名字面上只是多了一个不可打印字符。"},{"who":"Telnet 客户端","to":"本地终端","pkt":2,"bubble":"report 加一个字符","hl":["Data","IAC IAC"],"vals":{"Data":"report","IAC IAC":"还原成一个 0xFF"},"say":"客户端只把它当普通字符写进屏幕，回显与进程都不受影响。","sub":"数据回到数据的位置，命令语义消失。"},{"who":"管理员","to":"—","pkt":0,"bubble":"管理网隔离","hl":["IAC"],"vals":{"IAC":"管理网内才可达"},"say":"确需保留的设备口关进独立管理网，经跳板机访问并全程审计。","sub":"隔离挡住外部，审计管住内部。"}],"cmds":{"linux":[{"c":"sudo ss -tlnp | grep ':23 '","n":"确认没有进程监听 23；没有输出就是关干净了","s":"补充（ss 套接字统计，仓库未收录）"},{"c":"ssh user@192.0.2.10","n":"改用 SSH 交互登录，口令与命令都在加密信道内","s":"《系统》Linux.md · 8. Linux 远程登录"},{"c":"sudo tcpdump -ni eth0 -X 'tcp port 23' | grep -c 'ff fb'","n":"统计流里未转义的 IAC 协商，白名单生效时应为 0","s":"补充（tcpdump，仓库未收录）"}],"ps":[{"c":"Get-NetTCPConnection -LocalPort 23 -State Listen","n":"确认本机不再监听 23，无输出即已关闭","s":"《系统》PowerShell.md · 10. Cmdlet 网络与系统管理"}],"cmd":[{"c":"netsh advfirewall firewall show rule name=\"Block-Telnet\"","n":"确认 23 端口的阻断规则已建立并生效","s":"《系统》Windows CMD.md · netsh"}]}}]}]}},{"proto":{"id":"snmp","name":"SNMP","cn":"简单网络管理协议","en":"Simple Network Management Protocol","layer":"application","chapter":"第五章","extra":true,"oneLine":"用 BER 编码在 UDP 上轮询设备 MIB 树的管理协议，v1/v2c 只有一个明文团体名，v3 才补上认证与加密。","sections":[{"h":"一问一答的模型：管理者、代理与被管理对象","p":"SNMP（Simple Network Management Protocol，简单网络管理协议）把网络管理拆成两个角色：管理者（manager）主动发问，代理（agent）守着被管理对象作答。被管理对象是设备上的变量，用对象标识符 OID 命名，整体组织成一棵 MIB 树。协议跑在 UDP 上，代理监听 161，Trap 与 Inform 发往管理者的 162。选 UDP 不是疏忽：轮询是周期性的短报文，建立连接的开销大于收益，丢掉一次下个周期再问即可。代价是报文没有握手、没有拥塞控制，源地址可任意伪造，于是一个\"查询\"天然就是可被借用的放大器。"},{"h":"v1 与 v2c 的全部安全性只有一个团体名字符串","p":"SNMPv1 与 v2c 用团体名（community string）作为唯一凭据：它相当于一个共享口令，明文放在报文里，读操作常用 public、写操作常用 private。服务器只比对字符串，相等就执行，不区分是谁、从哪来。v2c 相对 v1 增加了 GetBulk（一次取多个后继值）、64 位计数器与 Inform，功能更强但安全模型一字未改。这意味着任何能发 UDP 包的人都能读整棵 MIB 树，只要他猜中那串字符；而默认团体名在出厂配置里就能查到，爆破往往只需试几个词。"},{"h":"BER 编码：TLV 让报文可以被任意拼装","p":"SNMP 报文不是定长首部加变长体，而是 ASN.1 的 BER 编码：每个元素都是\"标签 + 长度 + 值\"的 TLV，层层嵌套。版本是 INTEGER，团体名是 OCTET STRING，PDU 用上下文标签 0xA0 到 0xA8 区分 Get、GetNext、Response、Set、GetBulk、Inform、Trap、Report。这种编码极其灵活，也极其依赖解析器的严格性：长度字段写错、嵌套深度异常、同一段字节被两层长度解释，都可能让不同实现对同一条报文得出不同结论。历史上大量 SNMP 漏洞不是协议设计错，而是 BER 解析器的边界检查漏了。"},{"h":"v3 与 USM：引擎标识、时间窗、密钥本地化","p":"SNMPv3 把安全性做成可插拔的安全模型，最常用的是 USM（User-based Security Model）：报文头里的 msgFlags 用三个 bit 表示是否认证（auth）、是否加密（priv）、是否需要 Report，只有 authPriv（0x03）才同时具备完整性与机密性。USM 的六项参数是引擎标识、引擎启动次数、引擎时间、用户名、认证参数与加密参数：引擎标识定位对端并作为密钥本地化的输入，boots 与 time 构成 150 秒的接受窗口以抵御重放，认证参数是 HMAC-MD5-96 或 HMAC-SHA-96 的 12 字节截断值。用户名不是登录账户，而是一组算法与密钥的索引。"},{"h":"认证解决\"是谁\"，VACM 解决\"能做什么\"","p":"USM 只证明报文来自持有某用户密钥的一方，它不回答这个用户能读哪些 OID。授权由 VACM（View-based Access Control Model）完成：把用户按安全模型与安全级别归组，每组绑定一个视图（view），视图用 OID 子树加掩码定义可见范围，再按 read、write、notify 三类权限分别授予。配置时常犯的错是只配认证不配视图，于是 any 用户继承默认视图；或者视图掩码写错，把整棵子树意外放开。安全级别与视图必须一起设计，否则认证做得再好，也只证明了\"某个合法用户读了不该读的东西\"。"}],"packets":[{"title":"SNMPv2c GetRequest：一个 SEQ 套着版本、团体名和 PDU","note":"团体名 public 明文可见；整个报文只有一个 SEQ 外壳，没有任何长度固定的首部","hex":"30 29 02 01 01 04 06 70 75 62 6c 69 63 a0 1c 02 04 12 34 56 78 02 01 00 02 01 00 30 0e 30 0c 06 08 2b 06 01 02 01 01 01 00 05 00","fields":[{"name":"Message","cn":"报文外层 SEQUENCE","off":0,"len":2,"bits":"","tone":"tag","desc":"0x30 是 BER 的 SEQUENCE，长度 0x27 表示其后 39 字节为内容。整个 SNMP 报文就是一个 ASN.1 SEQUENCE，没有固定长度的首部。","sec":"没有长度字段的强约束意味着报文可以任意嵌套拼装，解析器必须严格校验每一层的长度与类型，否则就是现成的模糊测试入口。"},{"name":"msgVersion","cn":"版本号","off":2,"len":3,"bits":"","tone":"ver","desc":"INTEGER 1 表示 SNMPv2c（0 是 v1，3 是 v3）。这一个整数决定整条报文的解析路径，包括安全模型。","sec":"版本字段决定了是否走 USM 认证：把它从 3 改成 1，报文就可能被当成无认证的 v1 交给另一套处理逻辑，是经典的类型混淆入口。"},{"name":"community","cn":"团体名","off":5,"len":8,"bits":"","tone":"secret","desc":"OCTET STRING \"public\"，6 个可打印字节。这是 v1/v2c 唯一的\"身份凭据\"，等价于共享口令，且明文放在报文里。","sec":"团体名可用字典枚举，默认的 public/private 几乎是公网资产普查的入场券；抓包一次就永久获得。"},{"name":"GetRequest-PDU","cn":"PDU 类型与长度","off":13,"len":2,"bits":"","tone":"tag","desc":"0xA0 = [0] IMPLICIT，即 GetRequest-PDU。其它取值：0xA1 GetNext、0xA2 Response、0xA3 SetRequest、0xA5 GetBulk、0xA6 Inform、0xA7 Trap。","sec":"SetRequest（0xA3）与 GetBulk（0xA5）是攻击者最关心的两种：前者改配置，后者放大流量。"},{"name":"request-id","cn":"请求标识","off":15,"len":6,"bits":"","tone":"id","desc":"0x12345678，4 字节。响应必须原值回填，客户端据此把响应与请求配对。","sec":"与 DNS 的 16 位 ID 同理：这个标识是\"响应是否属于我的\"的唯一依据，而它没有任何密码学保护，可被猜测。"},{"name":"error-status","cn":"错误状态","off":21,"len":3,"bits":"","tone":"code","desc":"请求里固定为 0。响应里非 0 表示错误：1 tooBig、2 noSuchName、3 badValue、5 genErr 等。","sec":"错误码泄露设备实现细节（如 noSuchName 与 noSuchObject 的差别可区分 v1/v2c 实现），便于针对性利用。"},{"name":"error-index","cn":"错误索引","off":24,"len":3,"bits":"","tone":"code","desc":"指示是第几个 varbind 出错，从 1 开始计数，0 表示与具体变量无关。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"VarBindList","cn":"变量绑定列表","off":27,"len":2,"bits":"","tone":"list","desc":"SEQUENCE，内含若干 VarBind。一个请求可以一次问多个 OID，这让枚举的带宽效率很高。","sec":"一次请求打包上百个 OID 是 OID 枚举的常规手法，流量很小而信息量很大。"},{"name":"VarBind","cn":"单个变量绑定","off":29,"len":2,"bits":"","tone":"list","desc":"每个 VarBind 是一个 SEQUENCE，由\"名字 + 值\"两元素组成；请求里值填 NULL。","sec":"请求里值恒为 NULL 是识别扫描流量的一个特征：正常轮询通常问少量固定 OID，而扫描器一次问大量无关 OID。"},{"name":"name (OID 1.3.6.1.2.1.1.1.0)","cn":"对象标识符","off":31,"len":10,"bits":"","tone":"oid","desc":"编码为 06 08 2b 06 01 02 01 01 01 00：前两段 1.3 压成 40×1+3=43（0x2b），其余每段一字节。1.3.6.1.2.1.1.1 是 sysDescr，末尾 .0 表示标量实例。","sec":"OID 树是设备的信息地图：sysDescr 拿型号固件、ifTable 拿接口与流量、ipRouteTable 拿拓扑，逐层走一遍等于给网络画图。"},{"name":"value (NULL)","cn":"值：NULL","off":41,"len":2,"bits":"","tone":"pad","desc":"05 00，长度为 0 的 NULL。GetRequest 只问不答，值占位。","sec":"本字段在常见攻击中不作为独立手段。"}]},{"title":"SNMPv2c GetBulkRequest：max-repetitions 就是放大倍数的旋钮","note":"一个几十字节的请求，可让代理生成上千字节的响应","hex":"30 28 02 01 01 04 06 70 75 62 6c 69 63 a5 1b 02 03 00 c0 de 02 01 00 02 01 32 30 0e 30 0c 06 08 2b 06 01 02 01 02 02 01 05 00","fields":[{"name":"Message","cn":"报文外层 SEQUENCE","off":0,"len":2,"bits":"","tone":"tag","desc":"整个报文仍是一个 SEQUENCE，长度取决于后面各层。请求侧总长只有几十字节，响应侧由代理决定，两者的不对称正是放大倍数的来源。","sec":"攻击者只需付出几十字节的出口带宽，代理就会按 max-repetitions 生成上千字节的回包，且回包全部打向被伪造的源地址。"},{"name":"msgVersion","cn":"版本号","off":2,"len":3,"bits":"","tone":"ver","desc":"INTEGER 1，SNMPv2c。GetBulk 是 v2 才引入的 PDU 类型，v1 设备收到会当作未知类型丢弃。","sec":"v2c 的广泛部署让 GetBulk 成为最省力的放大器：无需认证即可触发大响应。"},{"name":"community","cn":"团体名","off":5,"len":8,"bits":"","tone":"secret","desc":"\"public\"。多数设备的默认只读团体名，扫描器第一批就试它。","sec":"只要团体名正确，代理就会回答；爆破成功的标志就是收到一个格式完整、varbind 非空的 Response。"},{"name":"GetBulkRequest-PDU","cn":"PDU 类型：GetBulk","off":13,"len":2,"bits":"","tone":"tag","desc":"0xA5 = [5] IMPLICIT BulkPDU。语义是\"从下一个 OID 起连续取 N 个\"，一次请求替代 N 次 GetNext。","sec":"这个设计本意是减少网管站轮询开销，在伪造源地址的场景下直接变成流量放大器。"},{"name":"request-id","cn":"请求标识","off":15,"len":5,"bits":"","tone":"id","desc":"0x0000c0de，随请求变化。响应原样回填，攻击者根本不需要收到它。","sec":"放大攻击里请求标识毫无意义——攻击者不看回包，回包全流向受害者。"},{"name":"non-repeaters","cn":"非重复字段数","off":20,"len":3,"bits":"","tone":"count","desc":"0 表示列表里前 0 个 varbind 只取一次，其余按 max-repetitions 重复。","sec":"把它设成 0 并只放一个 OID，能让全部重复都落在同一个表上，放大效率最高。"},{"name":"max-repetitions","cn":"最大重复次数","off":23,"len":3,"bits":"","tone":"count","desc":"50，表示对每个重复型 varbind 连续返回 50 个后继值。取值越大响应越长，上限由代理与 msgMaxSize 决定。","sec":"这是放大倍数的直接旋钮：请求侧不变，响应侧从几十字节涨到数千字节。"},{"name":"VarBindList","cn":"变量绑定列表","off":26,"len":2,"bits":"","tone":"list","desc":"SEQUENCE，本例只含一个 varbind，指向 ifTable 的入口。","sec":"用表入口而不是具体叶子，可以顺着表一次走完整行，信息密度最高。"},{"name":"VarBind","cn":"单个变量绑定","off":28,"len":2,"bits":"","tone":"tag","desc":"一个 SEQUENCE，名字 + 值。GetBulk 里值同样填 NULL。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"name (OID 1.3.6.1.2.1.2.2.1)","cn":"对象标识符：ifTable","off":30,"len":10,"bits":"","tone":"oid","desc":"1.3.6.1.2.1.2.2.1 是 ifEntry，接口表的行模板；它的列包括 ifDescr、ifType、ifSpeed、ifInOctets 等。","sec":"从这一行可以读出设备有多少接口、链路速率与流量，是网络拓扑测绘的起点。"},{"name":"value (NULL)","cn":"值：NULL","off":40,"len":2,"bits":"","tone":"pad","desc":"05 00，占位。","sec":"本字段在常见攻击中不作为独立手段。"}]},{"title":"SNMPv3 引擎发现报文：全局首部 + 安全参数 + ScopedPDU","note":"msgFlags=0x04 表示无认证无加密，目的只是问出对方的 engineID","hex":"30 38 02 01 03 30 0e 02 01 01 02 03 00 ff e3 04 01 04 02 01 03 04 10 30 0e 04 00 02 01 00 02 01 00 04 00 04 00 04 00 30 11 04 00 04 00 a0 0b 02 01 01 02 01 00 02 01 00 30 00","fields":[{"name":"Message","cn":"报文外层 SEQUENCE","off":0,"len":2,"bits":"","tone":"tag","desc":"SNMPv3 报文同样是 ASN.1 SEQUENCE，但内容从\"版本 + 团体名 + PDU\"变成\"版本 + 全局首部 + 安全参数 + 数据\"。","sec":"v3 的结构把安全参数抬到与 PDU 平级，使认证与加密可以整段包裹数据，这是它与 v1/v2c 的根本差别。"},{"name":"msgVersion","cn":"版本号 = 3","off":2,"len":3,"bits":"","tone":"ver","desc":"INTEGER 3，标识这是 SNMPv3，后面必须按 RFC 3412 的框架解析。","sec":"版本号是解析路径的开关：降到 1 或 2 就绕过 USM，因此边界设备必须按配置的版本白名单校验，而不是信任报文自称的版本。"},{"name":"msgGlobalData","cn":"全局首部","off":5,"len":2,"bits":"","tone":"tag","desc":"HeaderData SEQUENCE，含 msgID、msgMaxSize、msgFlags、msgSecurityModel 四项，与安全模型无关，任何 v3 报文都有。","sec":"这一段是明文，嗅探者可从中读出报文大小上限与安全级别，为后续探测提供依据。"},{"name":"msgID","cn":"报文标识","off":7,"len":3,"bits":"","tone":"id","desc":"请求与响应配对的标识，作用类似 v2c 的 request-id。","sec":"与 request-id 一样无密码学保护；但在 v3 中它不承担身份判断，风险低于 v2c。"},{"name":"msgMaxSize","cn":"最大报文尺寸","off":10,"len":5,"bits":"","tone":"len","desc":"65507，发送方愿意接收的最大报文长度，最小值 484。决定 GetBulk 响应能被塞多大。","sec":"该值由发送方声明，攻击者可声明较大值诱导代理生成更大响应，是放大攻击的一个隐藏旋钮。"},{"name":"msgFlags","cn":"标志字节","off":15,"len":3,"bits":"bit0 authFlag / bit1 privFlag / bit2 reportableFlag / bit3-7 保留（必须为 0）","tone":"flag","desc":"0x04 表示 only reportable（无认证无加密）；bit0=1 表示 auth，bit1=1 表示 priv，bit2=1 表示需要 Report。0x03 即 authPriv。","sec":"auth 与 priv 位是攻击者首先要看的：0x00 或 0x04 的报文没有认证，可以随意伪造；只有 0x03 才同时有完整性与机密性。"},{"name":"msgSecurityModel","cn":"安全模型号","off":18,"len":3,"bits":"","tone":"model","desc":"3 表示 USM（User-based Security Model）；1 是 v1 的简单共同体模型，2 是 v2c。","sec":"模型号与版本号必须匹配，不匹配时应丢弃；实现若只按版本号分派，就会出现绕过认证的解析歧义。"},{"name":"msgSecurityParameters (OCTET STRING 包裹 USM SEQUENCE)","cn":"安全参数容器","off":21,"len":18,"bits":"","tone":"crypto","desc":"外层是 OCTET STRING，里面装的是一段完整的 BER 编码 USM SEQUENCE。这层\"字符串里套结构\"的设计让安全模型可以整体替换。","sec":"双层编码意味着同一段字节有两套长度解释，历史上多次出现因内外长度不一致而绕过认证的解析漏洞。"},{"name":"msgData (ScopedPDU)","cn":"数据区","off":39,"len":2,"bits":"","tone":"tag","desc":"明文时是一个 ScopedPDU SEQUENCE：contextEngineID、contextName、PDU 三部分；加密时整个 ScopedPDU 被替换成一段密文 OCTET STRING。","sec":"加密与否在结构上就看得出来（SEQUENCE 还是 OCTET STRING），因此\"是否启用了 priv\"本身是可观测信息。"},{"name":"contextEngineID","cn":"上下文引擎标识","off":41,"len":2,"bits":"","tone":"id","desc":"本例为空。用于在同一台设备上选择被管理的多个上下文（多实例、虚拟路由器）。","sec":"上下文机制让一台代理可暴露多个逻辑设备，权限若未按上下文隔离，低权用户可能读到另一实例的数据。"},{"name":"contextName","cn":"上下文名","off":43,"len":2,"bits":"","tone":"id","desc":"本例为空，即默认上下文。","sec":"VACM 的授权判断包含上下文维度，配置遗漏会让某个上下文对所有用户开放。"},{"name":"GetRequest-PDU","cn":"PDU 类型","off":45,"len":2,"bits":"","tone":"tag","desc":"0xA0 = GetRequest。发现阶段的 PDU 内容不被处理，代理只回一个 Report。","sec":"Report PDU（0xA8）会带回引擎标识与时间，等于把设备指纹主动送上门。"},{"name":"request-id","cn":"请求标识","off":47,"len":3,"bits":"","tone":"id","desc":"本例 1。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"error-status","cn":"错误状态","off":50,"len":3,"bits":"","tone":"code","desc":"0，请求中固定。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"error-index","cn":"错误索引","off":53,"len":3,"bits":"","tone":"code","desc":"0。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"VarBindList","cn":"变量绑定列表（空）","off":56,"len":2,"bits":"","tone":"list","desc":"长度为 0 的空 SEQUENCE：发现阶段不关心取什么值，只想要对方的引擎参数。","sec":"空 varbind 列表本身就是发现扫描的流量特征，可作为检测规则。"}]},{"title":"USM 安全参数：v3 的身份、时间窗与密钥全在这 6 个字段里","note":"以上一条报文中 msgSecurityParameters 的内容单独展开，本例是发现阶段的空值形态","hex":"30 0e 04 00 02 01 00 02 01 00 04 00 04 00 04 00","fields":[{"name":"UsmSecurityParameters","cn":"USM 参数 SEQUENCE","off":0,"len":2,"bits":"","tone":"crypto","desc":"这 6 个字段依次是引擎标识、引擎启动次数、引擎时间、用户名、认证参数、加密参数。整段被塞进外层报文的 msgSecurityParameters（一个 OCTET STRING）里。","sec":"把安全参数整体做成\"字符串里的结构\"，好处是安全模型可替换，坏处是同一段字节有两套长度语义，解析漏洞大多长在这里。"},{"name":"msgAuthoritativeEngineID","cn":"权威引擎标识","off":2,"len":2,"bits":"","tone":"id","desc":"本例为空，这是\"引擎发现\"报文的特征：客户端还不知道对端引擎标识，先发空值去问。正式报文中是 5 到 32 字节，前 4 字节为企业号且最高位置 1（例如 80001f88 表示 8072），第 5 字节说明剩余部分的格式：1 为 IPv4、2 为 IPv6、3 为 MAC、4/5 为人工指定，128 以上由厂商定义。","sec":"引擎标识是密钥本地化的输入，也是判断报文是否属于本引擎的依据；它还会被 Report 报文带回，等于主动交出一份设备指纹。"},{"name":"msgAuthoritativeEngineBoots","cn":"引擎启动次数","off":4,"len":3,"bits":"","tone":"count","desc":"本例 0（发现阶段未知）。正式值为该引擎自首次配置以来重启的次数，用于识别\"引擎被重置\"这一事件。","sec":"boots 一旦回退，说明设备重启或配置被清空，接收方必须拒绝旧报文，否则被清零的时间窗会把重放攻击重新放进来。"},{"name":"msgAuthoritativeEngineTime","cn":"引擎时间","off":7,"len":3,"bits":"","tone":"count","desc":"本例 0。正式值是引擎启动后经过的秒数，与 boots 一起构成时间窗。","sec":"接收方只接受与本机时间相差不超过 150 秒的报文，这个窗口是抵御重放的核心；窗口放大等于给重放留门。"},{"name":"msgUserName","cn":"用户名","off":10,"len":2,"bits":"","tone":"id","desc":"本例为空（发现阶段）。USM 里的\"用户\"不是系统登录账户，而是一组\"认证算法 + 认证密钥 + 加密算法 + 加密密钥\"的索引。","sec":"用户名明文可见、可枚举；但只有同时持有该用户的本地化密钥才能算出正确的认证参数，因此枚举本身不等于能冒充。"},{"name":"msgAuthenticationParameters","cn":"认证参数","off":12,"len":2,"bits":"","tone":"crypto","desc":"本例为空（未认证）。启用认证时这里是 12 字节的 HMAC 截断值（HMAC-MD5-96 或 HMAC-SHA-96）：发送方把本字段置零后对整个报文算 HMAC，取前 12 字节填入。","sec":"这 12 字节是整个 v3 的完整性根基；把字段清零重算是接收方的验证动作，也是攻击者离线猜测口令时唯一能拿来自校验的比对值。"},{"name":"msgPrivacyParameters","cn":"加密参数","off":14,"len":2,"bits":"","tone":"crypto","desc":"本例为空。启用加密时这里是 8 字节的 privParameters：DES-CBC 模式下即 8 字节 IV，AES-CFB 模式下是盐值。","sec":"IV 若可预测，相同明文会产生相同密文，配置内容的重复模式因此泄露；这也是要求 IV 用盐值派生的原因。"}]}],"attacks":[{"name":"Community String Brute Force","cn":"团体名爆破","impact":"整台设备的 MIB 被读空，若 private 可用还能直接改配置。","steps":[{"who":"攻击者","to":"目标网段","label":"UDP 扫描 161，收集有响应的地址","note":"SNMP 无连接，扫描只需发一个 GetRequest 看有无 Response"},{"who":"攻击者","to":"代理","label":"GetRequest(community=\"public\", OID=1.3.6.1.2.1.1.1.0)","note":"用默认只读团体名试第一个，命中即返回 sysDescr"},{"who":"代理","to":"攻击者","label":"Response(community=\"public\", sysDescr=\"Cisco IOS …\")","note":"厂商、型号、固件版本一次性到手，据此挑选对应漏洞"},{"who":"攻击者","to":"代理","label":"换字典继续试 private、cisco、admin 等","note":"写团体名命中后 SetRequest 即可改 ifAdminStatus 关端口、改配置"},{"who":"攻击者","to":"代理","label":"SetRequest(ifAdminStatus.1 = down)","note":"合法 OID 加合法团体名，设备日志里看不出异常，链路被静默关闭"}],"defense":"改掉默认团体名并只读、升级 v3 authPriv，同时用 ACL 限制可访问代理的源地址。"},{"name":"OID Enumeration / MIB Walk","cn":"OID 枚举与资产测绘","impact":"网络拓扑、接口清单、路由表、运行进程被完整还原，为下一步攻击提供地图。","steps":[{"who":"攻击者","to":"代理","label":"GetNext(1.3.6.1.2.1.1) 逐条走 sysDescr、sysName、sysLocation","note":"先确认设备身份与管理员留下的位置备注，常含机房与机柜号"},{"who":"攻击者","to":"代理","label":"GetBulk(1.3.6.1.2.1.2.2.1, max-repetitions=50)","note":"一次取 50 个 ifEntry 后继值，拿到全部接口、速率与流量计数"},{"who":"攻击者","to":"代理","label":"GetBulk(1.3.6.1.2.1.4.21 / 1.3.6.1.2.1.4.24)","note":"读 ipRouteTable 与 ipCidrRouteTable，还原路由与下一跳关系"},{"who":"攻击者","to":"代理","label":"GetBulk(1.3.6.1.2.1.25.4.2.1.2)（主机资源 MIB）","note":"在服务器上可枚举运行进程名，判断装了哪些中间件与杀软"},{"who":"攻击者","to":"本地","label":"拼接 OID 结果，画出拓扑图并标注版本","note":"无需任何漏洞利用，仅凭只读权限就完成侦察"}],"defense":"VACM 按最小必要视图授权，屏蔽路由表与进程表子树；对批量 GetBulk 做速率与 varbind 数量限制。"},{"name":"SNMP Reflection Amplification","cn":"SNMP 反射放大","impact":"几十字节的伪造请求换来数千字节的响应，全部砸向受害者。","steps":[{"who":"攻击者","to":"开放代理","label":"伪造源地址为受害者，发 GetBulk(community=public, max-repetitions=50)","note":"请求侧只需几十字节，无需与代理建立任何状态"},{"who":"开放代理","to":"—","label":"按 OID 遍历 MIB，组装大量 varbind","note":"代理消耗 CPU 与内存生成响应，成本由第三方承担"},{"who":"开放代理","to":"受害者","label":"Response 数千字节，目的地址就是被伪造的源","note":"受害者收到的全是\"合法\"的 SNMP 响应，源地址分布在整个互联网"},{"who":"攻击者","to":"多个开放代理","label":"并发向上千个代理发送同样的伪造请求","note":"放大倍数乘以代理数量，带宽被迅速占满"},{"who":"受害者","to":"—","label":"链路拥塞，正常业务中断","note":"追溯只能追到被利用的代理，真正的攻击者不在链路上"}],"defense":"对公网关闭 161 与 162，强制入口过滤（BCP38）拦截伪造源，并对代理做响应速率限制。"}],"defenses":[{"name":"升级到 SNMPv3 authPriv","how":"启用 USM 的认证与加密（HMAC-SHA-96 与 AES），msgFlags 置 0x03，为每个管理站分配独立用户与本地化密钥，定期轮换。","limit":"老设备只支持 v1/v2c，混跑时往往保留一个 v2c 团体名做兼容，等于把后门留着；加密与认证带来明显 CPU 开销，低端设备轮询量大了会掉包。"},{"name":"VACM 最小视图与上下文隔离","how":"按角色建立视图，只暴露必要 OID 子树，读、写、通知三类权限分开授予，写权限默认不给，并按 context 隔离多实例。","limit":"视图用 OID 子树加掩码表达，掩码写错会把整棵子树意外放开；配置分散在每台设备上，批量审计困难。"},{"name":"改默认团体名 + ACL + 管理网隔离","how":"禁用默认 public/private，只读团体名随机化，用设备 ACL 只允许管理网段访问 161，162 只向指定收集器发送。","limit":"团体名仍是明文共享口令，嗅探一次即失效；ACL 依赖源 IP 可信，而源 IP 可伪造；隔离网一旦被突破，全部设备同时暴露。"},{"name":"关闭开放代理与响应限速","how":"公网接口不响应 SNMP，代理侧限制单位时间的响应数与单个 GetBulk 的 varbind 上限，边界做入口过滤拦截伪造源。","limit":"入口过滤需要运营商配合，部署激励极弱；限速只能削减放大倍数，无法让代理不被当作反射器。"}],"calcs":[],"quiz":[{"q":"SNMPv2c 与 v1 在安全模型上的差别是什么？","options":["v2c 增加了加密与认证","v2c 功能增强（GetBulk、64 位计数器、Inform）但安全模型完全相同，仍是明文团体名","v2c 用公钥替代了团体名"],"a":1,"why":"v2c 只改了 PDU 类型与计数器宽度，团体名照旧明文比对；真正的安全模型是 v3 的 USM 才引入的。"},{"q":"USM 里 boots 与 time 两个字段的作用是什么？","options":["用于计算加密密钥","构成时间窗抵御重放，接收方只接受与本机时间差 150 秒内的报文","标识设备厂商与型号"],"a":1,"why":"两者共同表示对端引擎的运行时刻，超出窗口的报文一律丢弃；重放的旧报文时间对不上，因此失效。"},{"q":"为什么 GetBulk 特别适合做放大攻击？","options":["因为它的报文头部更大，占用更多带宽","因为一个很小的请求能让代理连续返回大量后继值，响应远大于请求","因为它基于 TCP，可以建立长连接"],"a":1,"why":"max-repetitions 直接决定返回条目数，请求几十字节、响应可达数千字节，且 UDP 无需握手，源地址可随意伪造。"}]},"script":{"id":"snmp","notes":{"community":{"short":"明文共享口令，v1/v2c 唯一凭据","more":"OCTET STRING，服务器只做字符串比对，相等就执行，不区分是谁、从哪来；读常用 public，写常用 private，都写在出厂配置里。","sec":"抓包一次就永久获得，默认值几乎是公网资产普查的入场券。"},"max-repetitions":{"short":"放大倍数的直接旋钮","more":"GetBulk 对每个重复型 varbind 连续返回这么多个后继值，取值越大响应越长，上限由代理与 msgMaxSize 决定。","sec":"请求侧不变、响应侧涨几十倍，配合伪造源地址就是流量放大器。"},"msgFlags":{"short":"auth/priv 位决定有没有保护","more":"bit0 认证、bit1 加密、bit2 需要 Report；0x00 与 0x04 都没有认证可以随意伪造，只有 0x03 同时具备完整性与机密性。","sec":"看这两位就知道报文能不能被伪造，边界设备该按它而不是按版本号放行。"},"msgAuthenticationParameters":{"short":"v3 的完整性靠这 12 字节","more":"启用认证时填 HMAC-MD5-96 或 HMAC-SHA-96 的前 12 字节：发送方把本字段置零后对整个报文算 HMAC，接收方照做比对。","sec":"这 12 字节也是攻击者离线猜口令时唯一能拿来自校验的比对值。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"一问一答：一个 SEQ 套着版本、团体名和 PDU","lead":"全程 UDP，没有握手也没有状态。留意团体名那一行——它决定后面能不能打。","scenes":[{"name":"查询、应答、批量取","steps":[{"who":"管理者","to":"代理","pkt":0,"bubble":"GetRequest","hl":["msgVersion","community","GetRequest-PDU"],"vals":{"msgVersion":"1（v2c）","community":"public","GetRequest-PDU":"0xA0"},"say":"往 161 发一个查询，版本与团体名都明文摊在报文里。","sub":"整个报文就是一个 ASN.1 SEQUENCE，没有定长首部。"},{"who":"管理者","to":"代理","pkt":0,"bubble":"OID = sysDescr.0","hl":["name (OID 1.3.6.1.2.1.1.1.0)","value (NULL)"],"vals":{"name (OID 1.3.6.1.2.1.1.1.0)":"1.3.6.1.2.1.1.1.0","value (NULL)":"NULL"},"say":"问 sysDescr，值留 NULL 占位：查询只问不答。","sub":"前两段 1.3 压成 0x2b 一个字节。"},{"who":"代理","to":"管理者","pkt":0,"bubble":"Response","hl":["request-id","error-status"],"vals":{"request-id":"0x12345678 原值回填","error-status":"0（无错）"},"say":"应答把 request-id 原值带回，客户端靠它把响应与请求配对。","sub":"这个标识没有任何密码学保护，可以被猜。"},{"who":"管理者","to":"代理","pkt":1,"bubble":"GetBulk","hl":["GetBulkRequest-PDU","non-repeaters","max-repetitions"],"vals":{"GetBulkRequest-PDU":"0xA5","non-repeaters":"0","max-repetitions":"50"},"say":"GetBulk 一次取 50 个后继值，轮询从 50 次降到 1 次。","sub":"这是 v2 才有的 PDU，v1 设备收到会丢弃。"},{"who":"代理","to":"管理者","pkt":1,"bubble":"走 ifTable","hl":["name (OID 1.3.6.1.2.1.2.2.1)"],"vals":{"name (OID 1.3.6.1.2.1.2.2.1)":"1.3.6.1.2.1.2.2.1"},"say":"顺着 ifEntry 一路走完，接口、速率、流量计数一次到手。","sub":"从表入口走比问具体叶子的信息密度高得多。"},{"who":"管理者","to":"代理","pkt":2,"bubble":"v3 引擎发现","hl":["msgVersion","msgFlags","msgSecurityModel"],"vals":{"msgVersion":"3","msgFlags":"0x04","msgSecurityModel":"3（USM）"},"say":"v3 换了结构：全局首部加安全参数，msgFlags 说明有没有保护。","sub":"0x03 才是 authPriv，同时有完整性与机密性。"}],"cmds":{"linux":[{"c":"snmpwalk -v2c -c public 192.0.2.10 1.3.6.1.2.1.1","n":"走 sys 组，sysDescr、sysName、sysLocation 一次读完","s":"补充（net-snmp 工具集，仓库未收录）"},{"c":"snmpget -v2c -c public 192.0.2.10 1.3.6.1.2.1.1.1.0","n":"只取 sysDescr，验证团体名与 OID 都对","s":"补充（net-snmp 工具集，仓库未收录）"},{"c":"snmpbulkget -v2c -c public -Cn0 -Cr50 192.0.2.10 1.3.6.1.2.1.2.2.1","n":"-Cr50 一次取 50 个后继值，等价 50 次 GetNext","s":"补充（net-snmp 工具集，仓库未收录）"}],"ps":[{"c":"Get-NetUDPEndpoint -LocalPort 161 -ErrorAction SilentlyContinue","n":"看本机有没有代理在 161 上监听 UDP","s":"补充（PowerShell NetTCPIP 模块，仓库未收录）"}],"cmd":[{"c":"netstat -an | findstr :161","n":"UDP 161 显示 *:* 的监听行，说明本机代理在听","s":"《系统》Windows CMD.md · netstat"}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"先猜口令读空设备，再用同一套报文把代理变成放大器","lead":"同一个 GetBulk，读的时候是效率工具，伪造源地址发出去就是放大器。","scenes":[{"name":"团体名爆破与 OID 枚举","steps":[{"who":"攻击者","to":"目标网段","pkt":0,"bubble":"扫 161/udp","evil":true,"hl":["GetRequest-PDU"],"vals":{"GetRequest-PDU":"0xA0 探测"},"say":"发一个 GetRequest，有 Response 就说明这地址跑着代理。","sub":"UDP 无连接，扫描成本只有一个包。"},{"who":"攻击者","to":"代理","pkt":0,"bubble":"community=public","evil":true,"hl":["community","name (OID 1.3.6.1.2.1.1.1.0)"],"vals":{"community":"public","name (OID 1.3.6.1.2.1.1.1.0)":"sysDescr"},"say":"字典第一个就试出厂默认的只读团体名。","sub":"只比对字符串，不问是谁、从哪来。"},{"who":"代理","to":"攻击者","pkt":0,"bubble":"命中了","hl":["community","value (NULL)"],"vals":{"community":"public 有效","value (NULL)":"Cisco IOS 15.x"},"say":"回包带回厂商与固件版本，等于附赠该打哪个 CVE。","sub":"错误码差异还能区分实现，便于精准匹配。"},{"who":"攻击者","to":"代理","pkt":1,"bubble":"GetBulk 枚举","evil":true,"hl":["max-repetitions","name (OID 1.3.6.1.2.1.2.2.1)"],"vals":{"max-repetitions":"50","name (OID 1.3.6.1.2.1.2.2.1)":"ifEntry 走表"},"say":"接口、速率、路由表、进程表逐表走一遍，拓扑图就有了。","sub":"全程只读，不需要任何漏洞利用。"},{"who":"攻击者","to":"代理","pkt":1,"bubble":"SetRequest","evil":true,"hl":["community","name (OID 1.3.6.1.2.1.2.2.1)"],"vals":{"community":"private 命中","name (OID 1.3.6.1.2.1.2.2.1)":"ifAdminStatus.1 = down"},"say":"写团体名一旦命中就能改配置，关一个口不留痕迹。","sub":"合法 OID 加合法团体名，日志里看不出异常。"}],"cmds":{"linux":[{"c":"onesixtyone -c /usr/share/seclists/Discovery/SNMP/common-snmp-community-strings.txt 192.0.2.0/24","n":"用字典并发试团体名，命中会打出 sysDescr","s":"补充（onesixtyone 团体名扫描）"},{"c":"snmpwalk -v2c -c private 192.0.2.10 1.3.6.1.2.1.2.2.1","n":"换写团体名走 ifEntry，能读说明 private 也开着","s":"补充（net-snmp 工具集，仓库未收录）"},{"c":"snmpset -v2c -c private 192.0.2.10 1.3.6.1.2.1.2.2.1.7.1 i 2","n":"把 1 号口 ifAdminStatus 置 2（down），链路静默断开","s":"补充（net-snmp 工具集，仓库未收录）"}],"ps":[{"c":"Test-Connection 192.0.2.10 -Count 1 -Quiet","n":"先确认目标在线；UDP 没有 RST，不通不会报错","s":"《系统》PowerShell.md · 10. Cmdlet 网络与系统管理"}],"cmd":[{"c":"netstat -an | findstr :161","n":"看本机是否也在监听 161，避免自测时打到自己","s":"《系统》Windows CMD.md · netstat"}]}},{"name":"GetBulk 反射放大","steps":[{"who":"攻击者","to":"开放代理","pkt":1,"bubble":"src = 受害者","evil":true,"hl":["max-repetitions","non-repeaters"],"vals":{"max-repetitions":"50","non-repeaters":"0"},"say":"把源地址伪造成受害者，发一个几十字节的 GetBulk。","sub":"UDP 没有握手，代理无法回头确认。"},{"who":"开放代理","to":"受害者","pkt":1,"bubble":"Response 数千字节","hl":["Message","max-repetitions"],"vals":{"Message":"请求 40 字节","max-repetitions":"50 → 响应上千字节"},"say":"代理按 max-repetitions 生成大量 varbind，全部打向伪造的源。","sub":"请求标识它根本不需要看，回包不看也照样生成。"},{"who":"攻击者","to":"多个开放代理","pkt":1,"bubble":"并发上千台","evil":true,"hl":["request-id","community"],"vals":{"request-id":"每次都不同","community":"public"},"say":"同样的包并发灌向上千个代理，放大倍数再乘代理数。","sub":"带宽在受害者侧汇聚，成本由第三方承担。"},{"who":"受害者","to":"—","pkt":1,"bubble":"链路打满","hl":["Message"],"vals":{"Message":"全是合法 SNMP 响应"},"say":"收到的全是格式完整的响应，源地址分布在整个互联网。","sub":"追溯只能追到被利用的代理，攻击者不在链路上。"}],"cmds":{"linux":[{"c":"snmpbulkget -v2c -c public -Cn0 -Cr50 192.0.2.10 1.3.6.1.2.1.2.2.1","n":"-Cr50 让代理一次回 50 个后继值，回包通常是请求的几十倍","s":"补充（net-snmp 工具集，仓库未收录）"},{"c":"sudo tcpdump -ni eth0 'udp port 161' -c 5 -vv","n":"看请求与响应长度差，两者之比就是放大倍数","s":"补充（tcpdump，仓库未收录）"},{"c":"sudo hping3 --udp -a 198.51.100.9 -p 161 -c 100 192.0.2.10","n":"-a 伪造源地址发 100 个请求，回包全打向 198.51.100.9","s":"补充（hping3 伪造源地址）"}],"ps":[{"c":"Get-NetUDPEndpoint -LocalPort 161 -ErrorAction SilentlyContinue","n":"对照本机：开放代理就是在这里听 161 的那台","s":"补充（PowerShell NetTCPIP 模块，仓库未收录）"}],"cmd":[{"c":"netstat -an | findstr :161","n":"确认 161 的 UDP 监听形态，判断是否存在开放代理","s":"《系统》Windows CMD.md · netstat"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"版本白名单 + USM 认证 + 视图收敛，再关掉公网入口","lead":"认证解决「是不是他发的」，视图解决「他能看什么」，入口过滤解决「他能不能到」。","scenes":[{"name":"只能 v3 authPriv","steps":[{"who":"管理者","to":"代理","pkt":2,"bubble":"只许 v3 authPriv","hl":["msgVersion","msgFlags","msgSecurityModel"],"vals":{"msgVersion":"3","msgFlags":"0x03","msgSecurityModel":"3（USM）"},"say":"版本白名单只留 v3，团体名那条解析路径整条关掉。","sub":"版本号是解析路径的开关，必须按配置校验而非听报文自称。"},{"who":"管理者","to":"代理","pkt":3,"bubble":"HMAC + 时间窗","hl":["msgAuthoritativeEngineBoots","msgAuthoritativeEngineTime","msgAuthenticationParameters"],"vals":{"msgAuthoritativeEngineBoots":"boots","msgAuthoritativeEngineTime":"time（±150 秒）","msgAuthenticationParameters":"12 字节 HMAC"},"say":"12 字节认证参数加 150 秒时间窗，伪造与重放都过不去。","sub":"boots 回退说明引擎被重置，旧报文一律拒。"},{"who":"攻击者","to":"代理","pkt":0,"bubble":"v2c + public","evil":true,"hl":["msgVersion","community"],"vals":{"msgVersion":"0（v1）","community":"public"},"say":"老办法重放一次：v2c 与 public 直接被版本策略丢掉。","sub":"没有 Response，扫描连第一步都过不了。"},{"who":"攻击者","to":"代理","pkt":1,"bubble":"GetBulk 50","evil":true,"hl":["max-repetitions","name (OID 1.3.6.1.2.1.2.2.1)"],"vals":{"max-repetitions":"被压到 10","name (OID 1.3.6.1.2.1.2.2.1)":"视图外 → noSuchObject"},"say":"批量请求被限到 10 条，VACM 视图外的子树根本不可见。","sub":"放大倍数的旋钮被拧小，信息面也一起收窄。"},{"who":"代理","to":"—","pkt":3,"bubble":"视图只到必要子树","hl":["msgUserName","msgAuthenticationParameters"],"vals":{"msgUserName":"mon（只读视图）","msgAuthenticationParameters":"认证通过"},"say":"每个管理站一个用户、一份本地化密钥，读权限按视图给。","sub":"认证证明是谁，视图决定能读什么，两件事分开配。"},{"who":"边界路由器","to":"—","pkt":0,"bubble":"入口过滤","hl":["Message"],"vals":{"Message":"伪造源在边界被丢"},"say":"161 与 162 不对公网开放，边界做 uRPF 与 BCP38 拦伪造源。","sub":"放大器被关掉，反射这条路才真正断。"}],"cmds":{"linux":[{"c":"snmpget -v3 -l authPriv -u mon -a SHA -A 'AuthPass1' -x AES -X 'PrivPass1' 192.0.2.10 1.3.6.1.2.1.1.1.0","n":"只有 authPriv 能读到值；换 -v2c 或错口令会超时","s":"补充（net-snmp 工具集，仓库未收录）"},{"c":"snmpwalk -v2c -c public 192.0.2.10 1.3.6.1.2.1.1","n":"重放老办法：无响应即版本白名单生效","s":"补充（net-snmp 工具集，仓库未收录）"},{"c":"sudo iptables -A INPUT -p udp --dport 161 ! -s 10.0.0.0/8 -j DROP","n":"161 只接受管理网段来源，公网查询直接丢","s":"补充（iptables 访问控制）"}],"ps":[{"c":"Get-NetUDPEndpoint -LocalPort 161 -ErrorAction SilentlyContinue","n":"确认本机不再对公网开放 161","s":"补充（PowerShell NetTCPIP 模块，仓库未收录）"}],"cmd":[{"c":"netsh advfirewall firewall add rule name=\"Block-SNMP\" dir=in action=block protocol=UDP localport=161","n":"在主机防火墙上封掉入向 161（管理网例外需另加允许规则）","s":"《系统》Windows CMD.md · netsh"}]}}]}]}},{"proto":{"id":"sava","name":"SAVA","cn":"真实源地址验证体系结构","en":"Source Address Validation Architecture","layer":"extension","chapter":"拓展课","extra":false,"oneLine":"从接入网、地址域内、地址域间三层验证 IP 源地址是否真的属于发送者，把“自填的回信地址”变成可追溯的身份。","sections":[{"h":"整个 IPv4 首部里，只有源地址能承载身份","p":"把 20 字节首部逐个字段过一遍会发现一件事：版本、长度、标识、TTL、协议号都是“怎么送”的信息，唯独源地址被上层当成了“谁发的”。因为 TCP 的四元组、DNS 的应答匹配、防火墙的白名单、数据库的可信来源配置，全都拿 IP 地址当对端标识。而这个字段由发送方在构造首部时自己填，协议没规定它必须与实际接入位置一致，也没有任何字段能证明它属于谁。首部校验和是唯一的“校验”字样字段，但它只是反码求和，人人可以重算，改完源地址顺手补一次就完全合法。地址同时承担位置与身份两个角色，而网络只诚实地记录了前者的一部分。"},{"h":"伪造能成立，只需要两个条件同时满足","p":"第一个条件是协议层：源地址由发送方填写且没有签名，这一步已经满足。第二个条件是设备行为：网关转发时只查目的地址做表查找，源地址对它只是回程信息，不影响转发决策，所以出口不做源地址检查也能把包送出去。两条叠加，源地址就退化成一个纯粹的“回信地址备注”，写什么都行。国际上的主动测量给出了量级：CAIDA 的 Spoofer 项目截至 2021 年 2 月测得约 21.1% 的 IPv4 地址块、约 24% 的自治系统仍允许伪造源地址的报文出网。二十多年过去仍有近四分之一敞开，原因是源地址过滤的正外部性——部署者付成本，受益的是别人。"},{"h":"两类伪造：随机地址打可用性，特定地址借信任","p":"按“是否针对特定地址”可以把基于源地址伪造的攻击分成两支。第一支用大量随机源地址：目的主机为每个半开连接分配状态，回包永远回不来，三次握手完不成而资源已被占住，这就是 DDoS；同时受害者反查到的地址是随机的，追溯链直接断掉，因此也被用来隐藏身份、规避审查。第二支伪造某个受信任主机的地址：大量早期服务把源 IP 当身份凭据，rlogin/rsh 的主机信任、路由器管理白名单、基于 IP 的 ACL 都属于这一类。远程访问注入是典型组合——先用 DDoS 让被冒充者沉默，再猜出连接标识与序列号，最后以它的源地址向目的主机发指令，上层协议会认为这是老朋友。"},{"h":"传统办法各自差在哪：假设对称、标签可照抄、配置爆炸","p":"Ingress Filtering 要求边缘路由器精确掌握“本网应出现的源前缀”，在多出口、客户自带地址、移动场景下规则迅速膨胀，败在配置成本。uRPF 用源地址反查路由表，判断出接口是否等于入接口，它默认回程路径等于来程路径：多宿主与流量工程造成路由非对称时合法流量被误杀，而攻击者与被伪造者从同一接口进来的“同方向假冒”它根本看不见。签名类方案（SPM、Passport、StackPi、Base）往 ToS 或选项字段塞身份标签，标签是包头里可写的固定格式，学会格式就能照抄。HIP 把身份从地址中剥离，方向正确，但要改全球几十亿台主机的协议栈。四条路各有死穴，共同点是都没有形成覆盖全网的分层结构。"},{"h":"SAVA 三层三粒度：越靠近主机，证据越可靠","p":"真实源地址验证体系结构 SAVA（Source Address Validation Architecture）不去发明新的过滤算法，而是把验证按位置分层：接入层到主机与单个地址的粒度，域内到前缀粒度，域间到地址域前缀粒度。越靠近主机，能看到的地址分配过程越完整，绑定越难欺骗；越往骨干走，地址已被聚合，只能做粗判。三层各管一件事：接入层保证地址使用可追溯，域内层保护核心设备不被伪造源的高速流量打瘫，域间层保证前缀不被冒用。设计原则三条——可扩展（层次化、粒度可变）、可演进（协议兼容、部分部署可共存、各运营商各自实现）、自身安全（标识唯一可追溯、标签防篡改、不依赖单点信任）。"},{"h":"SAVI 三步曲与地址域：把验证边界对齐管理边界","p":"接入网这一层的做法是 SAVI：不去听主机“自称”什么地址，而是旁路监听地址分配的控制报文（DHCPv4/v6、ND、RA），拿到网络正式分配出去的地址；再把这个地址与主机的链路层属性绑定，这个属性叫绑定锚（端口、MAC、VLAN、隧道标识），由设备本地掌握、远端无法伪造；最后对每个数据包比对源地址与入端口的绑定锚，不匹配就丢弃。绑定不在分配完成时建立，而要等重复地址检测（DAD）静默期满，因为分出去不等于可用。DHCP 场景用 RFC 7513，SEND 场景用 RFC 7219，无状态分配只能用 RFC 6620 的先来先服务，验证强度最弱。多种方法共存时需要 SAVA-MIX 统一绑定表并做冲突消解，否则每种方法会拒绝别人建立的绑定。管理单元则从自治域改为地址域——同一机构所属全部 IP 地址中的可部分管理范围，可嵌套、可只覆盖一部分，容纳没有 ASN、不用 BGP 的校园网。"}],"packets":[{"title":"IPv4 首部：唯一能承载“身份”的字段是源地址","note":"20 字节固定首部，源地址由发送方单方面填写，首部里没有任何字段能证明它属于谁","hex":"45 00 00 28 1a 2b 40 00 40 06 34 26 c0 00 02 42 c6 33 64 09","fields":[{"name":"Version / IHL","cn":"版本 / 首部长度","off":0,"len":1,"bits":"bit0-3 版本=4 / bit4-7 首部长度=5（×4=20 字节）","tone":"flag","desc":"高 4 位是版本（4 表示 IPv4），低 4 位是首部长度，单位是 4 字节，0x5 即 20 字节。带选项时该值变大。","sec":"首部长度可被写成与真实结构不符的值，制造解析歧义（重叠分片、选项走私），但它不承担身份职责。"},{"name":"DSCP / ECN","cn":"服务类型 ToS","off":1,"len":1,"bits":"bit0-5 DSCP / bit6-7 ECN","tone":"flag","desc":"早期表示优先级与延迟吞吐要求，现在拆成 DSCP（区分服务码点）与 ECN（显式拥塞通知）。","sec":"这是首部里少数“有富余位”的字段，历史上多个源地址签名方案（SPM、Passport）正是往这里塞身份标签，因此也成了标签伪造的舞台。"},{"name":"Total Length","cn":"总长度","off":2,"len":2,"bits":"","tone":"len","desc":"整个分组的字节数（首部加数据），本例 40。最小值 20，最大值 65535。","sec":"总长度与实际字节不符是畸形包检测的经典特征，可用于探测或绕过中间设备。"},{"name":"Identification","cn":"标识","off":4,"len":2,"bits":"","tone":"id","desc":"分片重组时用来判断哪些片属于同一个原始分组，本例 0x1a2b。","sec":"该字段常被实现为递增计数器，可预测；它让攻击者能预判分片归属，配合重叠分片做过滤绕过。"},{"name":"Flags / Fragment Offset","cn":"标志 / 片偏移","off":6,"len":2,"bits":"bit0 保留 / bit1 DF / bit2 MF / bit3-15 片偏移（×8 字节）","tone":"flag","desc":"高 3 位是标志：bit0 保留、bit1 DF（不分片）、bit2 MF（还有分片）；低 13 位是片偏移，单位 8 字节。本例 0x4000 = DF 置位，偏移 0。","sec":"分片是绕过“只看第一个片”的过滤设备的传统手法；源地址验证若只作用于首片，后续片就成了缺口。"},{"name":"TTL","cn":"生存时间","off":8,"len":1,"bits":"","tone":"ttl","desc":"每经过一个路由器减 1，减到 0 丢弃，用来防止环路。本例 64。","sec":"TTL 可反推操作系统默认值与路径长度；攻击者用不同初始 TTL 的伪造包可混淆路径推断。"},{"name":"Protocol","cn":"协议号","off":9,"len":1,"bits":"","tone":"proto","desc":"指明载荷类型：1 ICMP、6 TCP、17 UDP。本例 6。","sec":"协议号决定上层解析路径，改它能构造“同一源地址不同协议”的探测组合，用于穿透按协议放行的 ACL。"},{"name":"Header Checksum","cn":"首部校验和","off":10,"len":2,"bits":"","tone":"check","desc":"只对首部 20 字节做反码求和校验。本例 0x3426。它只保证比特传输没出错，不保证内容是真的。","sec":"这是全篇最容易被误读的字段：校验和人人可重算，改完源地址顺手重算一次即可，对伪造零阻力。"},{"name":"Source Address","cn":"源地址","off":12,"len":4,"bits":"","tone":"src","desc":"发送方标识，同时被当作回程地址。本例 192.0.2.66。协议没有规定它必须与发送者的实际接入位置一致，也没有任何字段能证明这一点。","sec":"整份体系的安全缺口就在这 4 个字节：上层协议（TCP 四元组、DNS、应用白名单）全把它当身份用，它却只是一个自填的备注。"},{"name":"Destination Address","cn":"目的地址","off":16,"len":4,"bits":"","tone":"dst","desc":"转发依据，路由器逐跳查表使用。本例 198.51.100.9。","sec":"目的地址受网络侧控制、由路由体系保证可达，因此它不是伪造点；但它决定伪造包最终砸向谁。"}]},{"title":"ICMP 回显请求：伪造源地址能构造出的最小可信报文","note":"20 字节 IPv4 首部 + 8 字节 ICMP，源地址写成别人的地址，受害者会把这台机器的回包全部收下","hex":"45 00 00 1c 1a 2c 40 00 40 01 34 36 c0 00 02 42 c6 33 64 09 08 00 f7 f7 00 07 00 01","fields":[{"name":"IPv4 Header（前 12 字节）","cn":"IPv4 首部前 12 字节","off":0,"len":12,"bits":"","tone":"hdr","desc":"版本 4、首部长度 5、总长度 28、标识 0x1a2c、DF 置位、TTL 64、协议 1（ICMP）、首部校验和 0x3436，全部按真实字段算出。","sec":"整个首部里唯一需要“撒谎”的只有源地址一个字段，改完重算校验和即可，构造成本几乎为零——这正是源地址伪造被称为“廉价攻击前提”的原因。"},{"name":"Source Address","cn":"源地址（被伪造成别人的）","off":12,"len":4,"bits":"","tone":"src","desc":"192.0.2.66，实际发送者的接入位置可能在完全不同的网段。部署了 SAVI 的接入交换机会拿它与入端口的绑定锚比对，不一致直接丢弃。","sec":"未部署验证的接入网里，这个字段可以填任何值：内网地址用于穿透内网 ACL，公网地址用于反射放大。"},{"name":"Destination Address","cn":"目的地址","off":16,"len":4,"bits":"","tone":"dst","desc":"198.51.100.9，被攻击的目标或反射的靶子。","sec":"目的地无法选择回包路径，只能被动接收；伪造源地址把“谁打我”这个问题变成了无解。"},{"name":"Type","cn":"ICMP 类型","off":20,"len":1,"bits":"","tone":"code","desc":"8 表示回显请求（Echo Request），对应的应答是 0。","sec":"选回显请求是因为它的应答确定且立即返回，最适合作反射器：一个 28 字节的请求能换回 28 字节以上的响应并带完整 IP 首部开销。"},{"name":"Code","cn":"代码","off":21,"len":1,"bits":"","tone":"code","desc":"回显请求固定为 0。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Checksum","cn":"ICMP 校验和","off":22,"len":2,"bits":"","tone":"check","desc":"对 ICMP 首部加数据做反码求和，本例 0xf7f7。","sec":"与 IP 首部校验和同理，只防误码不防伪造；很多过滤设备却仍把它当作合法性判据。"},{"name":"Identifier","cn":"标识符","off":24,"len":2,"bits":"","tone":"id","desc":"0x0007，用于把应答与请求配对。","sec":"伪造时该值可任意填，因为攻击者根本不打算接收应答——他把源地址改成了受害者的。"},{"name":"Sequence Number","cn":"序列号","off":26,"len":2,"bits":"","tone":"seq","desc":"0x0001，每发一个请求递增一次。","sec":"递增序列让反射流量看起来像正常探测，可降低被流量清洗设备识别的概率。"}]}],"attacks":[{"name":"Spoofed Reflection DDoS","cn":"伪造源地址的反射式 DDoS","impact":"受害者被成千上万台第三方设备同时回包打瘫，且无法追溯到真正的发起者。","steps":[{"who":"攻击者","to":"接入交换机","label":"构造 ICMP 回显请求，源地址填 198.51.100.9（受害者），目的填反射器","note":"接入层未部署 SAVI，交换机只按目的 MAC 转发，不看源地址"},{"who":"接入交换机","to":"边界路由器","label":"原样转发，源地址仍是 198.51.100.9","note":"出口未做 Ingress Filtering 或 uRPF，伪造包顺利出网"},{"who":"边界路由器","to":"反射器","label":"查表转发至开放 DNS/NTP/SNMP 服务器","note":"互联网上大量开放服务愿意义务代答"},{"who":"反射器","to":"受害者","label":"把响应（往往远大于请求）发往 198.51.100.9","note":"响应流量在受害者处汇聚，放大倍数乘以反射器数量"},{"who":"受害者","to":"—","label":"链路与连接表被打满，正常业务中断","note":"日志里的源地址全是无辜的第三方，追溯在此断链"}],"defense":"接入层部署 SAVI 绑定、边界做入口过滤（BCP38），并关闭开放递归与开放代理。"},{"name":"Partial Deployment Bypass","cn":"地址域失配绕过","impact":"已部署验证的区域照样收到伪造包，因为验证边界与管理边界没对齐。","steps":[{"who":"管理员","to":"接入交换机","label":"只在一个院系的交换机上启用 SAVI，其余子网暂缓","note":"增量部署的典型中间态，绑定表只覆盖部分端口"},{"who":"攻击者","to":"未部署子网","label":"接入同一校园网内另一栋楼的老旧交换机","note":"该端口没有绑定表，源地址不受任何检查"},{"who":"攻击者","to":"核心路由器","label":"源地址填已部署院系的合法前缀 10.20.30.0/24 内某个地址","note":"域内层只看“是否属于本域前缀”，判定为合法"},{"who":"核心路由器","to":"目标服务器","label":"转发该包，前缀校验通过","note":"服务器依据源地址把它当作内网可信主机"},{"who":"攻击者","to":"目标服务器","label":"以该源地址发起访问，绕过基于 IP 的白名单","note":"伪造者获得了“内部主机”的身份，而绑定表根本没覆盖它"}],"defense":"用地址域而非 AS 划边界，对未部署区域的前缀单独收紧策略，并在域内层做方向性前缀校验。"},{"name":"First-Come-First-Served Binding Capture","cn":"先到先得抢占绑定","impact":"合法主机反倒被判为伪造者而被断网，攻击者占住地址做中间人。","steps":[{"who":"攻击者","to":"SAVI 交换机","label":"在启用 FCFS SAVI 的无状态分配网段抢先发出源地址为 2001:db8::66 的数据包","note":"该网段没有 DHCP 交互可监听，交换机只能按“谁先声明谁拥有”建立绑定"},{"who":"SAVI 交换机","to":"绑定表","label":"写入 2001:db8::66 ↔ 攻击者端口","note":"绑定表被先到者占住，没有任何权威分配记录可对照"},{"who":"合法主机","to":"SAVI 交换机","label":"上线并配置同一地址（本应属于它）","note":"它的包源地址与绑定锚不符，被逐包丢弃"},{"who":"SAVI 交换机","to":"合法主机","label":"持续丢包，主机表现为“网络不通”","note":"运维往往先怀疑主机配置，攻击者获得了时间窗口"},{"who":"攻击者","to":"网关","label":"以自己的端口冒用该地址收发，做中间人或直接窃取流量","note":"绑定表反过来成了攻击者的护身符"}],"defense":"无状态场景配合地址冲突检测与 DAD 监听，静态地址纳入管理台账，并对绑定变更做告警。"}],"defenses":[{"name":"接入网 SAVI 绑定","how":"在接入交换机上旁路监听 DHCP/ND/RA，把分配出去的地址与端口、MAC、VLAN 等绑定锚写入绑定表，逐包比对源地址，不匹配即丢弃；DHCP 场景等 DAD 静默期满再建绑定。","limit":"只管到单域可控的接入网；静态配置地址、未部署的下挂子网、无端口概念的无线接入都是缺口，FCFS 场景只能先到先得，验证强度明显下降。"},{"name":"uRPF（单播反向路径转发）","how":"用源地址反查路由表，严格模式要求反查出的出接口等于报文入接口，松散模式只要求该前缀在路由表中存在。","limit":"严格模式假设路由对称，多宿主、流量工程、Anycast 会造成大量假阳性；松散模式误杀少但基本挡不住伪造；两种模式都看不见同方向假冒。"},{"name":"Ingress Filtering（入口过滤）","how":"边缘路由器按“本网应出现的源前缀”白名单检查出向流量，不属于本网的一律丢弃。","limit":"需要逐条维护前缀，多出口与客户自带地址会让规则爆炸；部署收益归他人、成本归自己，缺乏激励，这正是 20% 以上地址块仍可伪造的原因。"},{"name":"SAVA-X 域间信任联盟","how":"联盟成员的边界路由器在出方向做地址域级源前缀检查并打上可验证标签，入方向校验标签与源前缀是否一致；标签与状态机（SMA）绑定、随状态推进变化，联盟用区块链共识维护互认凭据。","limit":"只覆盖联盟内流量，联盟外的报文仍无验证；成员互认、证书体系与状态机同步的组织成本高，联盟越大协商越复杂。"},{"name":"IPv6 地址内嵌可信标识（AID）","how":"把 IPv6 地址后 64 位的接口标识替换为经认证并哈希的可信设备标识 AID，配合动态更新与审计机制，实现端网协同的身份识别与溯源。","limit":"只适用于 IPv6，需要端侧与管理域共同改造；动态更新与可追溯之间存在张力，审计链本身成为需要保护的高价值目标。"}],"calcs":["checksum","cidr"],"quiz":[{"q":"严格模式的 uRPF 为什么挡不住“同方向假冒”？","options":["因为它只检查目的地址","因为它只校验源地址反查出的出接口是否等于入接口，攻击者与被伪造者从同一接口进来时校验照样通过","因为它需要 DNSSEC 支持"],"a":1,"why":"uRPF 判断的是“这个源地址是否应该从这边来”，同方向进来时答案是“应该”，因此伪造包合法通过。"},{"q":"SAVI 为什么把绑定建立在链路层属性（绑定锚）上，而不是给主机发证书？","options":["因为链路层属性加密强度更高","因为要对主机协议栈透明、不改终端，而端口与 MAC 由接入设备本地掌握、远端难以伪造","因为证书机制还不成熟"],"a":1,"why":"接入网要面对安卓、iOS、嵌入式等异构终端，无法要求它们配合；链路层属性是设备本地事实，验证成本只落在网络侧。"},{"q":"SAVA 用“地址域”替代“自治域”作为管理单元，主要解决什么问题？","options":["提高路由收敛速度","解决增量部署时验证边界与地址管理边界不重合的问题，例如没有 ASN、不用 BGP 的校园网","让 IPv4 地址可以重复使用"],"a":1,"why":"地址域是同一机构所属地址中可部分管理的范围，可嵌套、可只覆盖一部分，因此能与真实管理边界对齐，支持部分部署。"}]},"script":{"id":"sava","notes":{"Source Address":{"short":"自填的回信地址，没有任何签名","more":"发送方构造首部时自己写，协议没有规定它必须与实际接入位置一致，也没有任何字段能证明它属于谁；上层却拿它当身份用。","sec":"整份体系的安全缺口就在这 4 个字节：身份与位置被压进了同一个字段。"},"Header Checksum":{"short":"只是反码求和，人人可重算","more":"只对首部 20 字节做反码求和，保证比特传输没出错；改完源地址顺手重算一次，报文就完全合法。","sec":"最容易被误读的字段：它防误码，不防伪造。"},"Type":{"short":"回显请求 8，应答确定且立刻返回","more":"ICMP 类型 8 是回显请求、0 是回显应答；请求小、应答确定且立即返回，因此最适合被借来当反射器。","sec":"28 字节的请求换回 28 字节以上的应答，放大倍数再乘以反射器数量。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"四个字节既当位置又当身份，而它由发送方自己写","lead":"这一幕不讲报文细节，只回答一个问题：包里的「谁发的」，凭什么被相信？","scenes":[{"name":"源地址只是一个备注","steps":[{"who":"主机","to":"网关","pkt":0,"bubble":"src 192.0.2.66","hl":["Source Address","Header Checksum"],"vals":{"Source Address":"192.0.2.66（自己填）","Header Checksum":"改完重算即可"},"say":"首部里唯一承担身份的是源地址，可它由发送方自己写。","sub":"协议没规定它必须与实际接入位置一致。"},{"who":"网关","to":"下一跳","pkt":0,"bubble":"只查目的地址","hl":["Destination Address","TTL"],"vals":{"Destination Address":"198.51.100.9","TTL":"64 → 63"},"say":"转发只按目的地址查表，源地址对路由决策毫无影响。","sub":"出口不看源地址，包照样能送出去。"},{"who":"受害者","to":"—","pkt":1,"bubble":"四元组当身份","hl":["Source Address","Destination Address"],"vals":{"Source Address":"被当作对端标识","Destination Address":"只当回程依据"},"say":"TCP 四元组、DNS 应答匹配、防火墙白名单，全都拿 IP 当身份。","sub":"地址同时扮演位置与身份，网络只记录了位置的一角。"},{"who":"伪造者","to":"—","pkt":1,"bubble":"改一个字段","hl":["IPv4 Header（前 12 字节）","Source Address"],"vals":{"IPv4 Header（前 12 字节）":"校验和重算 0x3436","Source Address":"换成 198.51.100.9"},"say":"造一个伪造包只需改源地址一个字段，校验和顺手重算。","sub":"构造成本几乎为零，这就是廉价攻击前提。"},{"who":"测量方","to":"互联网","pkt":0,"bubble":"21% 仍可伪造","hl":["Source Address"],"vals":{"Source Address":"21.1% 地址块可伪造"},"say":"CAIDA 2021 年测量：约 21% 的 IPv4 地址块仍能把伪造源送出去。","sub":"部署者付成本、受益的是别人，二十多年没填平。"}],"cmds":{"linux":[{"c":"ip -4 addr show","n":"看本机地址：配什么就填什么，源地址没有任何签名","s":"补充（iproute2，仓库未收录）"},{"c":"sudo tcpdump -ni eth0 -c 5 'icmp[icmptype] == 8' -vv","n":"看回显请求的源地址：谁填的都能发出去","s":"补充（tcpdump，仓库未收录）"},{"c":"ping -c1 -I 10.0.0.99 198.51.100.9","n":"-I 指定一个不属于本机的源地址，发得出去说明本地不校验","s":"补充（ping -I 指定源地址）"}],"ps":[{"c":"Get-NetIPAddress -AddressFamily IPv4","n":"看本机地址与前缀长度，源地址就是从这里取的自填值","s":"《系统》PowerShell.md · 10. Cmdlet 网络与系统管理"}],"cmd":[{"c":"ipconfig","n":"看地址、掩码、网关；首部源地址由主机自己写入","s":"《系统》Windows CMD.md · ipconfig"}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"随机源地址换流量，特定源地址换信任","lead":"同一处缺口有两种用法：一个把回包全引向别人，一个借别人的身份进门。","scenes":[{"name":"伪造源地址反射放大","steps":[{"who":"攻击者","to":"接入交换机","pkt":1,"bubble":"src = 受害者","evil":true,"hl":["Source Address","Destination Address"],"vals":{"Source Address":"198.51.100.9（受害者）","Destination Address":"反射器"},"say":"构造回显请求，源地址填受害者，接入层只按目的 MAC 转发。","sub":"没有绑定表，源地址不受任何检查。"},{"who":"接入交换机","to":"边界路由器","pkt":1,"bubble":"原样转发","hl":["Source Address","Type"],"vals":{"Source Address":"仍是 198.51.100.9","Type":"8 回显请求"},"say":"出口没做 Ingress Filtering 也没做 uRPF，伪造包顺利出网。","sub":"网关只关心目的地可达，不问来源归属。"},{"who":"边界路由器","to":"反射器","pkt":1,"bubble":"查表转发","hl":["Destination Address","Checksum"],"vals":{"Destination Address":"开放 DNS/NTP/SNMP","Checksum":"0xf7f7 合法"},"say":"送到开放服务；校验和合法，过滤设备也挑不出毛病。","sub":"互联网上愿意义务代答的机器很多。"},{"who":"反射器","to":"受害者","pkt":1,"bubble":"Echo Reply","hl":["Source Address","Type"],"vals":{"Source Address":"反射器地址","Type":"0 回显应答"},"say":"响应远大于请求，全部打向被伪造的源。","sub":"放大倍数乘以反射器数量，就是受害者的入向流量。"},{"who":"受害者","to":"—","pkt":1,"bubble":"追溯断链","hl":["Sequence Number"],"vals":{"Sequence Number":"递增，像正常探测"},"say":"日志里的源地址全是无辜第三方，追溯在这里断链。","sub":"受害者无法区分正常探测与攻击回包。"}],"cmds":{"linux":[{"c":"sudo hping3 --icmp -a 198.51.100.9 -c 1000 203.0.113.20","n":"-a 伪造源地址，1000 个回显请求让反射器全回给受害者","s":"补充（hping3 伪造源地址）"},{"c":"sudo tcpdump -ni eth0 'icmp and src 203.0.113.20' -c 3 -vv","n":"抓反射回来的回显应答，确认请求小、响应大","s":"补充（tcpdump，仓库未收录）"},{"c":"cat /proc/sys/net/ipv4/conf/all/rp_filter","n":"0 表示本机没开反向路径校验，伪造包才能出网","s":"补充（内核参数，rp_filter）"}],"ps":[{"c":"Test-Connection 203.0.113.20 -Count 1 -Quiet","n":"先确认反射器可达，不回显也得能到","s":"《系统》PowerShell.md · 10. Cmdlet 网络与系统管理"}],"cmd":[{"c":"tracert -d 203.0.113.20","n":"看包到反射器经几跳，路径上的出口是否做源地址过滤一看便知","s":"《系统》Windows CMD.md · tracert"}]}},{"name":"伪造特定地址借信任","steps":[{"who":"管理员","to":"接入交换机","pkt":0,"bubble":"只在一个院系启用","hl":["Source Address"],"vals":{"Source Address":"绑定表只覆盖部分端口"},"say":"增量部署的中间态：一个院系开了 SAVI，其余子网暂缓。","sub":"验证边界与管理边界没对齐，缺口就出现在这里。"},{"who":"攻击者","to":"未部署子网","pkt":1,"bubble":"接老交换机","evil":true,"hl":["Source Address","Destination Address"],"vals":{"Source Address":"10.20.30.66（借来的）","Destination Address":"内网服务器"},"say":"从没部署验证的老接入交换机进来，源地址不受任何检查。","sub":"伪造一个「内部」地址的成本只是配一次。"},{"who":"核心路由器","to":"目标服务器","pkt":0,"bubble":"前缀校验通过","hl":["Source Address","Protocol"],"vals":{"Source Address":"10.20.30.66 属于本域","Protocol":"6（TCP）"},"say":"域内层只判断「是否属于本域前缀」，判定合法，照转。","sub":"粒度是前缀而不是主机，看不出是谁在用。"},{"who":"目标服务器","to":"—","pkt":1,"bubble":"当作可信主机","hl":["Source Address"],"vals":{"Source Address":"命中 IP 白名单"},"say":"基于源 IP 的白名单放行，伪造者获得了内部身份。","sub":"早期 rlogin/rsh 的主机信任也是同一套逻辑。"},{"who":"攻击者","to":"目标服务器","pkt":1,"bubble":"以内部身份操作","evil":true,"hl":["Source Address","Type"],"vals":{"Source Address":"10.20.30.66","Type":"借信任下发指令"},"say":"先让被冒充者沉默，再猜连接标识与序列号，以它的地址下指令。","sub":"上层协议认为这是老朋友，不会二次验证。"}],"cmds":{"linux":[{"c":"ip route get 10.20.30.66","n":"看这个借来的地址从哪条路由走，判断域内层会怎么判","s":"补充（iproute2，仓库未收录）"},{"c":"sudo ip -4 addr add 10.20.30.66/24 dev eth0","n":"在本机网卡上配一个不属于自己的地址，这是伪造的工程形态","s":"补充（iproute2，仓库未收录）"},{"c":"curl -s -m 3 --interface 10.20.30.66 http://10.20.30.10/","n":"--interface 指定源地址，服务器按 IP 白名单会把它当内网主机","s":"补充（curl 指定源地址）"}],"ps":[{"c":"Get-NetIPAddress -AddressFamily IPv4 | Select-Object IPAddress, PrefixLength","n":"确认本机已经用上了借来的地址","s":"《系统》PowerShell.md · 10. Cmdlet 网络与系统管理"}],"cmd":[{"c":"arp -a","n":"看网关 MAC；伪造地址后回包仍发到本机，说明二层没拦住","s":"《系统》Windows CMD.md · arp"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"SAVI 绑定表在接入层逐包比对，边界再兜一层","lead":"不看主机自称什么，只看网络分配了什么、从哪个端口进来。","scenes":[{"name":"SAVI 绑定表挡住伪造源","steps":[{"who":"主机 A","to":"SAVI 交换机","pkt":0,"bubble":"申请地址","hl":["Source Address","Protocol"],"vals":{"Source Address":"DHCPv6 / ND 申请","Protocol":"17（UDP）"},"say":"先按正常流程申请地址，交换机旁路监听分配报文。","sub":"不听主机「自称」，只听网络「分配」。"},{"who":"SAVI 交换机","to":"绑定表","pkt":0,"bubble":"写绑定","hl":["Source Address","Flags / Fragment Offset"],"vals":{"Source Address":"10.20.30.66 ↔ Gi1/0/3 + MAC","Flags / Fragment Offset":"暂不生效，等 DAD"},"say":"把分配出去的地址与端口、MAC、VLAN 这些绑定锚写进表。","sub":"分配出去不等于可用，还要等重复地址检测。"},{"who":"主机 A","to":"SAVI 交换机","pkt":0,"bubble":"DAD 静默期满","hl":["Source Address","Destination Address"],"vals":{"Source Address":"10.20.30.66","Destination Address":"网关"},"say":"静默期内没收到邻居通告，绑定才生效，合法包逐包核对通过。","sub":"把「唯一性」也一起纳进了验证。"},{"who":"攻击者","to":"SAVI 交换机","pkt":1,"bubble":"伪造源再来一次","evil":true,"hl":["Source Address"],"vals":{"Source Address":"198.51.100.9（伪造）"},"say":"同样的伪造包重放：源地址与入端口的绑定锚对不上。","sub":"越靠近主机，看到的分配过程越完整，越难骗。"},{"who":"SAVI 交换机","to":"—","pkt":1,"bubble":"丢弃并计数","hl":["Source Address","Type"],"vals":{"Source Address":"不匹配 → 丢","Type":"8 回显请求"},"say":"不匹配即丢，反射流量在第一个交换机就被掐断。","sub":"代价是一张绑定表，收益是全网的追溯能力。"},{"who":"边界路由器","to":"—","pkt":0,"bubble":"uRPF + BCP38 兜底","hl":["Source Address","Header Checksum"],"vals":{"Source Address":"反查路由失败即丢","Header Checksum":"校验和合法也没用"},"say":"接入层覆盖不到的由边界入口过滤兜底，两层互补。","sub":"静态地址与下挂子网仍是缺口，靠台账与地址域对齐。"}],"cmds":{"linux":[{"c":"ip neigh show","n":"看邻居表里地址与 MAC 的绑定；SAVI 表思路相同，锚换成端口","s":"补充（iproute2，仓库未收录）"},{"c":"sudo sysctl -w net.ipv4.conf.all.rp_filter=1","n":"打开 uRPF 严格模式：源地址反查出的出接口必须等于入接口","s":"补充（内核参数，rp_filter）"},{"c":"sudo iptables -A INPUT -i eth0 ! -s 10.20.30.0/24 -j DROP","n":"域内层的前缀校验：这个接口上只许出现本域前缀","s":"补充（iptables 前缀过滤）"}],"ps":[{"c":"Get-NetNeighbor -AddressFamily IPv4","n":"看邻居表里 IP 与 MAC 的对应，地址被别的 MAC 占用立刻可见","s":"《系统》PowerShell.md · 10. Cmdlet 网络与系统管理"}],"cmd":[{"c":"netsh interface ipv4 show neighbors","n":"看邻居缓存里的地址与 MAC 对应，与台账比对可发现冒用","s":"《系统》Windows CMD.md · netsh"}]}}]}]}}]}</script>
<script>window.__SHORT__={"Protocol":"上交给谁：6=TCP，17=UDP","Source Port":"进程身份，随机高端口抗盲猜","Destination Port":"服务指纹，扫描与 ACL 的锚点","Sequence Number":"字节流进度，SYN 里就是 ISN","Window":"还能收多少字节，0 就别再发","Checksum":"覆盖伪首部+首部+数据","Urgent Pointer":"带外数据指针，几乎没人用","Acknowledgment Number":"下一个想要的字节，猜中即冒充","Data Offset / Reserved":"TCP 头多长（×4），含选项","MSS Option":"能收多大段，1460 是经典值","SACK-Permitted Option":"允许选择性确认，丢包只重传缺的那段","Timestamps Option":"算 RTT 与防序号回绕（PAWS）","NOP Option":"填充对齐，凑 4 字节边界","Window Scale Option":"窗口左移位数，把 64KB 上限放大","arp::EtherType":"帧类型 0x0806 表示 ARP","arp::Hardware Type":"硬件类型，以太网为 1","arp::Operation":"1 请求 / 2 应答，无认证位","arp::Sender Hardware Address":"发送方 MAC，可随意填写","arp::Sender Protocol Address":"发送方 IP，冒充的落点","arp::Target Hardware Address":"目标 MAC，请求时全 0","arp::Target Protocol Address":"被解析的 IP","dhcp::xid":"事务标识，配对请求与应答","dhcp::chaddr":"客户端 MAC，地址按它记忆","dhcp::yiaddr":"分给客户端的地址，可任意填","dhcp::giaddr":"中继地址，服务器完全相信它","dhcp::opt53":"报文类型，8 种之一","dhcp::opt61":"客户端标识，真正的身份字段","dhcp::opt51-val":"租期，写多长就绑多久","dhcp::opt54-val":"服务器标识，客户端认谁","dhcp::opt03-val":"默认网关，全部出网流量的第一跳","dhcp::opt06-val":"DNS 服务器，解析结果的来源","dns::ID":"16 位事务标识，可枚举","dns::QNAME":"长度前缀域名，隧道塞数据","dns::ANCOUNT":"回答数，伪造时故意留空","dns::NSCOUNT":"授权数，投毒的注入点","dns::TTL":"缓存时长＝劫持时长","dns::RDATA":"记录数据，最终连向的地址","dns::ARCOUNT":"附加数，放大与隧道特征","dns::TYPE":"资源类型，决定载荷怎么读","ethernet::Preamble + SFD":"8B 前导码，用来定界","ethernet::Frame Check Sequence":"CRC-32，只检错不防改","ftp::Argument":"用户名明文，可直接枚举账户","ftp::Host Address":"PORT 里的目标地址，可填任何人","ftp::Type Code":"A 改行结束，I 原样过字节","ftp::Pasv Argument":"227 里的地址端口，可被中间人改","http::Method":"方法即能力，PUT 最险","http::Request-Target":"路径加查询串，GET 必外泄","http::Host-Value":"虚拟主机路由的枢纽","http::Cookie-Value":"会话凭据，拿到即等于本人","http::Set-Cookie:":"服务端下发凭据的唯一途径","http::Cookie-Attrs":"属性决定凭据能被谁拿走","http::Content-Length:":"长度声明，偷渡的入口","http::CL-Value":"长度值，与实际字节比对","http::R+StreamID":"流标识，HTTP/2 的并发单位","http::Flags":"帧标志，语义随类型变","icmp::Next-Hop MTU":"这跳能过的最大字节数","icmp::Gateway Internet Address":"「更好的下一跳」地址","icmp::Original IP Header + 8 bytes":"引用原始报文，可被伪造","icmp::Originate Timestamp":"毫秒时间戳，泄漏运行时长","ipsec::Next Header":"后面装的是什么协议","ipsec::SPI":"32 位安全参数索引，选 SA 用","ipsec::ICV":"完整性校验值，长度由算法定","ipsec::Exchange Type":"34 建 SA / 35 认证","ipsec::Initiator's SPI":"发起方 SPI，不得为 0","ipsec::Transform Type":"加密/PRF/完整性/DH","ipsec::Pad Length":"填充了多少字节","ipv4::IHL":"首部长度，单位 4 字节","ipv4::Total Length":"整包长度，16 位上限 65535","ipv4::Identification":"分片同组编号，可被猜中","ipv4::Fragment Offset":"本片在原文中的位置","ipv4::Flags + Fragment Offset":"MF 标记还有没有下一片","ipv4::Time To Live":"跳数预算，每跳减 1","ipv4::Header Checksum":"只校验首部，不校验载荷","ipv4::Options":"可选字段：源路由、记录路由","ipv6::Flow Label":"20 位流标签，给流分类用","ipv6::Hop Limit":"跳数上限，等价 IPv4 的 TTL","ipv6::Fragment Next Header":"分片头之后是什么协议","ipv6::Fragment Offset / Res / M":"偏移 13 位 + M 标志","ipv6::Cur Hop Limit":"RA 建议主机用的默认跳数","ipv6::Router Lifetime":"这台路由器能当网关多久","ipv6::Option: SLLA":"源链路层地址选项","ipv6::L / A Flags":"L 上链路 / A 自动配置","l2tp::Flags + Version":"T/L/S/O/P + 版本 2","l2tp::Tunnel ID":"填接收方给的隧道号","l2tp::AVP: Message Type":"第一条 AVP，定报文类型","l2tp::Ns":"控制通道发送序号","l2tp::Nr":"期望收到的下一个序号","l2tp::AVP: Result Code":"StopCCN 里的拆隧道原因","mail::MAIL FROM":"信封发件人，只是一句自称","mail::RCPT TO":"实际投递对象，可多次出现","mail::EHLO":"自报域名，不构成身份证明","mail::Return-Path":"投递方写入，比 From 可信","mail::Received":"逐跳追加的真实来源链","mail::From":"显示发件人，完全由发件人填","mail::Subject":"社工话术的主战场","mail::Message-ID":"唯一标识，暴露生成方","mail::354":"唯一的中间态应答","mail::PASS":"明文口令，嗅探即得","ppp::Option 1 Value":"认证协议+算法，可被改","ppp::Value-Size":"挑战值/摘要的长度","ppp::Value":"挑战值或响应摘要","ppp::Password":"PAP 明文口令","pppoe::Session ID":"16 位会话号，明文可见","pppoe::TAG AC-Cookie":"服务器发的不透明令牌","pppoe::TAG Host-Uniq":"客户端配对用的随机值","pppoe::PPP Protocol":"PPP 内层协议，决定载荷","quic::Header Form + Fixed Bit + Type + Reserved + PN Len":"一个字节定形态，低 4 位还被盖住","quic::Destination Connection ID":"连接的唯一身份，也是劫持入口","quic::Token Length":"地址验证令牌，Retry 后才非零","quic::Frames":"载荷里的帧序列，多流就在这里交错","sava::Source Address":"自填的回信地址，没有任何签名","sava::Header Checksum":"只是反码求和，人人可重算","sava::Type":"回显请求 8，应答确定且立刻返回","snmp::community":"明文共享口令，v1/v2c 唯一凭据","snmp::max-repetitions":"放大倍数的直接旋钮","snmp::msgFlags":"auth/priv 位决定有没有保护","snmp::msgAuthenticationParameters":"v3 的完整性靠这 12 字节","ssh::Cookie":"16 字节随机数，混进密钥推导","ssh::kex_algorithms":"算法清单，取交集最弱者胜出","ssh::Message Code":"消息号决定分派到哪一层","ssh::Method Name":"none 探测会回显可用方法","telnet::IAC":"0xFF 开关，之后一字节是命令","telnet::Option ECHO":"回显选项，关掉本地回显","telnet::Terminal Type":"无长度字段，边界只靠 IAC SE","telnet::SB":"子协商开始，到 IAC SE 结束","tls::Client Version":"降级攻击的主战场，就两个字节","tls::Cipher Suites":"列表里留着弱套件＝自备降级路","tls::Session ID":"恢复会话的 bearer 凭证","tls::extended_master_secret (0x0017)":"空扩展，专治握手被移植","tls13::legacy_version":"写死的 0x0303，只为骗中间盒","tls13::supported_versions (0x002b)":"1.3 真正的版本协商，剥掉就降级","tls13::key_share (0x0033)":"第一个飞行就送出 ECDHE 的一半","tls13::pre_shared_key (0x0029)":"票据即凭证，必须是最后一个扩展","tls13::early_data (0x002a)":"一个空扩展，开启全部重放风险","udp::Length":"8 位首部里的总长，写错就骗解析器","udp::Checksum":"只防随机误码，不构成完整性","udp::Data":"原封不动交给应用，明文可读","vlan::TPID":"标签类型号，0x8100","vlan::TCI":"2B：优先级+DEI+VID","vlan::Outer TCI":"外层标签的 VID","vlan::Inner TCI":"内层 VID，真正目标"};window.__MORE__={"Protocol":"上交给哪个协议：6=TCP，17=UDP，1=ICMP，47=GRE。防火墙规则与隧道封装都按它匹配。","Source Port":"把「主机到主机」切成「进程到进程」。客户端用随机高端口，是为了让盲猜四元组变难；固定端口则暴露服务身份。","Destination Port":"服务的指纹：443=HTTPS、53=DNS、22=SSH。扫描、ACL、限速、反射放大都按它选靶。","Sequence Number":"本段第一个字节在字节流中的位置。SYN 段里它就是 ISN。猜中它就能在不知道内容的情况下伪造数据段或 RST。","Window":"告诉对方「我还能收多少字节」。窗口为 0 就是流控暂停；窗口探测能推断接收缓冲大小，也是慢速攻击的着力点。","Checksum":"覆盖伪首部（源/目的 IP）+ TCP 首部 + 数据。改任何字段都要重算，算错整段被丢弃——校验和是最便宜的一道保险。","Urgent Pointer":"配合 URG 标志指向带外数据的位置，几乎无人实现。正因为无人校验，它常被用作隐蔽信道。","Acknowledgment Number":"期望收到的下一个字节，即「我已经连续收到这么多」。它同时也是伪造报文的通行证：ack 落在对方期望窗口内才被接受。","Data Offset / Reserved":"TCP 首部有多长，单位 4 字节：5=20 字节，带 20 字节选项时是 10=40 字节。畸形值会让解析器把载荷读成首部。","MSS Option":"告诉对方「我这个方向一次最多能收多少字节数据」，不含 TCP/IP 头。1460 = 1500（以太网 MTU）− 20（IP）− 20（TCP）。设大了会被分片，设小了浪费带宽；攻击者可伪造小 MSS 让服务端把数据切碎，增加开销。","SACK-Permitted Option":"表示自己支持 SACK。丢包时接收方可以告诉发送方「我收到了哪几段」，避免把整个窗口重传一遍。选项本身也可被用来探测操作系统。","Timestamps Option":"两个 32 位时间戳：TSval（发送时刻）与 TSecr（回显对方时刻）。用来算 RTT、防序号回绕（PAWS）。时间戳可泄漏主机运行时长，也是隐蔽信道之一。","NOP Option":"一字节的填充，只为让后续选项对齐到 4 字节边界。解析器对 NOP 的处理差异，是历史攻击面之一。","Window Scale Option":"窗口字段只有 16 位，最大 64KB；这个选项约定「窗口值左移几位」，把上限放大到 1GB 量级。只在 SYN 里协商，中途不能改。","arp::EtherType":"以太网帧头 14 字节里的最后 2 字节，0x0806 是 ARP，0x0800 是 IPv4，0x86DD 是 IPv6。交换机靠它决定把载荷交给哪个上层解析。","arp::Hardware Type":"16 位，0x0001 表示以太网。它和下面的协议类型、两个长度字段一起，说明「用什么地址去解析什么地址」。","arp::Operation":"16 位操作码，只有请求、应答与 RARP 四种取值。没有序号、没有签名，接收端无法把一条应答和任何请求对应起来。","arp::Sender Hardware Address":"48 位，本应等于帧头源 MAC。交换机只看帧头学转发表，主机只看这里更新缓存——两个平面被分开处理，就产生了伪造空间。","arp::Sender Protocol Address":"32 位。填谁的地址，接收端就把谁的 IP 映射到发送方 MAC 上。填网关地址就是冒充网关，填内网主机地址就是骗网关。","arp::Target Hardware Address":"48 位。请求报文里因为还不知道对方硬件地址，填全 0；应答里填请求方的 MAC。有些实现会直接拿它覆盖缓存。","arp::Target Protocol Address":"32 位，请求时是「我在找谁」的地址，应答时是发起解析的那一方的地址。扫描就是拿它做递增遍历。","dhcp::xid":"4 字节随机数，客户端生成，服务器在 OFFER/ACK 中原样返回。客户端只靠它确认“这条应答回的是我的请求”，不校验对方身份。","dhcp::chaddr":"16 字节，前 hlen（6）字节有效。服务器按这个 MAC 分配与记忆地址，因此改 chaddr 就等于换了一台新机器。","dhcp::yiaddr":"“your IP”。服务器在 OFFER/ACK 中填入选定的地址，客户端在收到 ACK 后把它配到网卡上。仿冒服务器可以填任意值。","dhcp::giaddr":"中继代理转发时填入自己面向客户端的接口地址，服务器据此判断请求来自哪个子网并从对应地址池取地址。","dhcp::opt53":"TLV 结构：0x35 + 长度 1 + 值。1 DISCOVER、2 OFFER、3 REQUEST、5 ACK、6 NAK、7 RELEASE，每个报文的第一条选项都是它。","dhcp::opt61":"长度 7：类型 1（以太网）+ 6 字节 MAC。它才是“客户端身份”的正式表达，服务器应当用它而非 chaddr 做绑定，避免语义重叠。","dhcp::opt51-val":"32 位秒数。客户端据此算出 T1=0.5T 续租、T2=0.875T 改广播，到期必须停用地址。","dhcp::opt54-val":"合法服务器的 IPv4 地址，客户端此后把 REQUEST 单播到这个地址。它决定了客户端心里“谁是服务器”。","dhcp::opt03-val":"可含多个地址，客户端所有非本地流量都发往这里。它是把“配错地址”升级为“全面中间人”的那一个开关。","dhcp::opt06-val":"客户端的首选解析器。改了它，后续所有域名解析都可被引导到攻击者指定的地址，也是伪造站点最省事的一步。","dns::ID":"查询方随机生成，应答必须原样复制。接收方只靠它把响应与待决查询配对，取值空间 65536，平均发三万多条候选就能命中。","dns::QNAME":"域名不是点分字符串，而是“长度字节+标签”串，末字节 0x00 为根。单标签≤63 字节、全名≤255 字节，长度上限同时限定了隧道单包容量。","dns::ANCOUNT":"声明答案区记录条数。查询报文为 0，响应里是直接回答的条数。伪造者不知道真实 A 记录，只能把它写成 0，转而把内容塞进授权区。","dns::NSCOUNT":"声明授权区条目数，原本用于告诉解析器下一步该问哪些权威服务器。它天然携带“与问题无关的指引”，因此是名字连锁攻击的落脚处。","dns::TTL":"记录可被缓存的秒数。易变的 A 记录通常 300~600 秒，稳定的 NS 记录约 172800 秒。写得越长，攻击者一次命中的收益越久。","dns::RDATA":"按 TYPE 解释的载荷：A 记录是 4 字节 IPv4，TXT 是文本，NS 是主机名。用户最终连到哪个 IP，就由这串字节决定。","dns::ARCOUNT":"声明附加区条目数，通常是 NS 对应的 A 记录，启用 EDNS 后至少为 1（OPT 伪记录）。异常偏大意味着响应体积异常。","dns::TYPE":"2 字节类型值：A=1、NS=2、CNAME=5、MX=15、TXT=16、AAAA=28、OPT=41。同一段字节，类型不同解释完全不同。","ethernet::Preamble + SFD":"7 个 0x55 让收发时钟对齐，末字节 0xD5 的末尾 11 表示下一比特就是目的地址第一位。它不参与 FCS，也不计入 64~1518 的帧长。","ethernet::Frame Check Sequence":"覆盖目的地址到填充末尾共 60 字节，小端存放。无密钥，任何改动重算 CRC 即可通过，所以主动篡改的工具都会顺手重算它。","ftp::Argument":"USER 命令后面的账户名以 NVT-ASCII 明文出现，服务器据此查本地账户表；回 331 说明账户存在、在等口令，回 530 说明不存在或已被拒绝。","ftp::Host Address":"四个十进字段拼成 32 位 IPv4 地址，RFC 959 没有要求它等于控制连接的源地址，服务器照填照连，于是成为反弹扫描的原语。","ftp::Type Code":"TYPE A 把行结束统一成 CRLF，接收方再转回本地格式；TYPE I 把数据当连续比特装进 8 位传输字节，不做任何转换，传二进制必须用它。","ftp::Pasv Argument":"与 PORT 命令同样的 6 数字格式，给出服务器正在监听的地址与临时端口；客户端据此主动连出，这段数字就是数据连接的去向。","http::Method":"3 字节大写 ASCII，定义对资源的动作：GET/HEAD 读、POST 提交、PUT 覆盖、DELETE 删除、OPTIONS 探测、TRACE 回显。方法本身不带权限语义。","http::Request-Target":"origin-form 的目标，包含路径与查询串。查询串会进浏览器历史、代理日志与 Referer 头，任何中间环节都能读到。","http::Host-Value":"HTTP/1.1 唯一必选首部的值，一台服务器用同一个 IP 承载多个站点，全靠这个名字决定命中哪个 vhost。","http::Cookie-Value":"键值对形式，SID 是服务端会话的索引，服务端不认人只认这串字符。整个会话体系里价值最高的一小段字节。","http::Set-Cookie:":"响应首部，携带键值对与属性：Path 限定发送路径，HttpOnly 禁止脚本读取，Secure 限定只在 TLS 下发送，SameSite 控制跨站携带。","http::Cookie-Attrs":"Cookie 值与属性的合体。属性是边界不是建议：HttpOnly 让 document.cookie 读不到，Secure 让明文请求不带它，SameSite 拦跨站自动携带。","http::Content-Length:":"声明主体字节数的两种方式之一，另一种是 Transfer-Encoding: chunked。两者同时出现且矛盾时，前后端可能各信一个。","http::CL-Value":"主体字节数。它必须与真实正文逐字节吻合；偏大就会把后续报文的字节吞进本次主体，偏小则把剩余字节留给下一个请求。","http::R+StreamID":"31 位流标识加 1 位保留位。帧属于流、流属于连接，多条流可在一条 TCP 上并发并乱序重组；SETTINGS 作用于整条连接故为 0。","http::Flags":"8 位标志，含义由帧类型决定：DATA 的 0x01 是 END_STREAM、0x08 是 PADDED；SETTINGS 的 0x01 是 ACK。同一字节解释不同。","icmp::Next-Hop MTU":"16 位，出现在类型 3 编码 4（需要分片但 DF 置位）里，告诉源端下一跳链路的 MTU 是多少，源端据此调小报文尺寸。这是 PMTUD 的唯一信令。","icmp::Gateway Internet Address":"32 位，重定向报文用它告诉主机：去往某个目的时，直接交给这个网关更近。代码 0/1/2/3 分别对应网络、主机、服务类型三种粒度。","icmp::Original IP Header + 8 bytes":"差错报文必须带回触发它的原始 IP 首部与前 8 字节，让源端知道是哪条流出错。至少 28 字节，重定向里也用它证明「我引用的是你的包」。","icmp::Originate Timestamp":"32 位，自世界时午夜起的毫秒数。时间戳请求/应答（13/14）里还有接收与发送时间戳，据此可推测对端的时钟、时区与开机时长。","ipsec::Next Header":"8 位。AH 里它指向被保护的上层（6 TCP、17 UDP、4 IPv4）；ESP 里它在尾部，解密去填充后才读得到，决定载荷交给谁处理。IPv6 的扩展首部链也靠它串起来。","ipsec::SPI":"与目的 IP、安全协议标识（AH/ESP）三元组唯一标识一条 SA。接收方靠它在 SAD 里找到「这份报文该用哪套算法与密钥」，同一 SA 内 SPI 相同。","ipsec::ICV":"AH 的 ICV 覆盖整个 IP 包（易变字段除外）；ESP 的 ICV 只覆盖 SPI 到下一个首部，不含外层新首部。长度须为 32 位整数倍，常见 96 或 128 位截断。","ipsec::Exchange Type":"8 位。34 = IKE_SA_INIT，明文协商算法并交换 DH 公钥；35 = IKE_AUTH，加密传身份做认证；36 建子 SA；37 负责删除与保活。","ipsec::Initiator's SPI":"64 位，标识这次 IKE 交换的发起方。首个报文中响应方 SPI 必须填 0，之后由响应方补上自己的值，两边用这一对 SPI 认这条 IKE SA。","ipsec::Transform Type":"8 位，每个 Transform 说明自己在协商什么：1 = ENCR 加密，2 = PRF 伪随机函数，3 = INTEG 完整性，4 = DH 组，5 = ESN 扩展序号。","ipsec::Pad Length":"8 位，配合填充字段把明文凑成加密算法要求的块长，并隐藏真实长度。接收端解密后按它截掉尾部，再读下一个首部决定交给谁。","ipv4::IHL":"4 位，值 ×4 才是字节数：5 = 20 字节（常态），15 = 60 字节上限。选项必须填充到 4 字节整数倍，所以 IHL 能把选项和载荷的边界挪来挪去。","ipv4::Total Length":"含首部与数据的字节数，最大 65535。它只约束单个分片，不约束重组后的总长——死亡之 ping 正是钻这一点。","ipv4::Identification":"同一原始报文的所有分片复制同一个标识（IPv4 16 位，IPv6 分片头 32 位），接收端据此归队。历史上多为递增计数器，因此可预测。","ipv4::Fragment Offset":"13 位，单位 8 字节，所以除最后一片外每片数据长度必须是 8 的倍数。偏移本身合法，但「偏移 + 长度」是否越过前一片没有字段约束。","ipv4::Flags + Fragment Offset":"高 3 位为保留、DF、MF；低 13 位是偏移（×8）。MF=1 表示后面还有片，MF=0 表示这是最后一片；DF=1 禁止分片，超 MTU 只能丢并回 ICMP。","ipv4::Time To Live":"8 位，1~255，每经过一台路由器减 1，减到 0 就丢弃并回 ICMP 超时。它同时是防环机制和路径长度的间接度量。","ipv4::Header Checksum":"16 位反码求和，只覆盖 IP 首部，每跳因 TTL 变化都要重算。载荷完整性完全不在这里。","ipv4::Options":"长度可变，LSRR/SSRR 可以把中转节点地址写进首部，从而指定报文路径；记录路由则让沿途设备填地址。出现选项时 IHL 随之变大。","ipv6::Flow Label":"与源/目的地址一起标识一条「流」，让中间设备不必拆传输层首部就能做负载分担与 QoS。它不是安全字段，随机取值还能防止被用来做设备指纹。","ipv6::Hop Limit":"8 位，每经一台路由器减 1，减到 0 丢弃并回 ICMPv6 超时。NDP 报文要求它必须是 255，接收端据此判断对方是否同链路。","ipv6::Fragment Next Header":"8 位，位于 8 字节分片扩展首部内，指出重组完成后该把数据交给谁（6 TCP、17 UDP、58 ICMPv6）。它在第一个分片里可见，在后续分片里意义相同。","ipv6::Fragment Offset / Res / M":"偏移单位仍是 8 字节，M=1 表示后面还有分片。IPv6 只允许源主机分片，中途路由器遇到超 MTU 只回「包太大」，所以这里不会出现路由器切出来的片。","ipv6::Cur Hop Limit":"8 位，路由器通告里告诉主机：发出的报文默认把跳数限制设成多少（常见 64）。主机据此更新自己接口的默认值。","ipv6::Router Lifetime":"16 位，单位秒。非 0 表示可以当默认网关，0 表示只是通告前缀、不要当网关。主机按它维护默认路由的生存期。","ipv6::Option: SLLA":"NDP 报文的选项字段，类型 1、长度 1（单位 8 字节），携带发送方的 6 字节 MAC。接收端用它更新邻居缓存，省掉一次额外解析。","ipv6::L / A Flags":"前缀信息选项里的两位：L=1 表示该前缀可用于判断同链路，A=1 表示主机可据此前缀用无状态方式自动配置地址（SLAAC）。","l2tp::Flags + Version":"首字节最高位 T 区分控制(1)与数据(0)，接着 L(有长度)、S(有 Ns/Nr)、O(有偏移)、P(优先级)，低 4 位是版本。控制消息必须 T=1、L=1、S=1、O=0。","l2tp::Tunnel ID":"2 字节，指这条隧道在接收方那里的编号。两个方向取值不同：谁发的报文就填对端分配的 ID。SCCRQ 里填 0，因为还不知道对端的号。","l2tp::AVP: Message Type":"必须是最前面的 AVP，值 1=SCCRQ、2=SCCRP、4=StopCCN、6=CDN 等。整个控制通道的状态机就靠它推进，伪造它等于伪造控制消息。","l2tp::Ns":"2 字节，本端控制通道的当前序号，只在 S=1 时存在。控制消息靠 Ns/Nr 做窗口与重传，数据消息默认不带，隧道层不为数据保可靠。","l2tp::Nr":"2 字节，表示已正确收到对方该序号之前的全部报文，同时也是对它们的确认。接收窗口大小由 Receive Window Size AVP 声明。","l2tp::AVP: Result Code":"值 1 一般性错误、2 资源不足、3 协议版本不支持、4 未授权，后面还可跟可选 Error Code。拆隧道时用来告诉对端为什么断。","mail::MAIL FROM":"逆向路径，服务器退信时用它。它与首部 From 是两个独立字段，可以不一致。整条会话没有任何一步验证“你是不是这个地址的主人”。","mail::RCPT TO":"每出现一次就是一个收件人，服务器逐个应答。它与首部 To 互不校验，“显示 A、投递给 B”在协议上完全合法。","mail::EHLO":"请求进入 ESMTP 扩展模式，服务器用多行 250 应答列出支持的能力。域名完全由客户端填写、不被校验。","mail::Return-Path":"由最终投递的 MTA 依据信封 MAIL FROM 写入，收件人看不到，退信按它走。它是“别人替你写的字段”。","mail::Received":"每个经手 MTA 在最上方追加一行，形成时间由早到晚的接力记录，含真实来源 IP 与所用协议。以制表符开头的续行属于同一字段。","mail::From":"纯展示用字段：显示名加地址。客户端多数只渲染显示名，地址被折叠或根本不显示，显示名可以写成任何机构。","mail::Subject":"一句话主题，可含 MIME 编码字承载非 ASCII。它直接决定收件人是否点开，因此集中了制造紧迫感与指向权威的所有话术。","mail::Message-ID":"形如 <唯一串@生成方域名>，用于去重与串起会话。域名部分暴露了生成方，同一 ID 出现在多封不同内容的信里是批量伪造的痕迹。","mail::354":"3 开头既不是成功也不是失败，而是“继续说”。服务器在此之后进入数据模式，为可能到来的任意长度内容预留资源。","mail::PASS":"口令以完全明文发送，除 Base64 之外没有任何保护（它甚至不是 Base64）。同网段嗅探即可拿到账号口令。","ppp::Option 1 Value":"3 字节：前 2 字节 PPP 协议号，后 1 字节算法。0xC223+0x05 是 CHAP/MD5，0xC023+0x05 是 PAP。改这两字节即可降级。","ppp::Value-Size":"1 字节，CHAP 只规定长度不规定值。MD5 时填 16；若摘要算法或实现变化，这位决定后面跟几个字节，长度与算法必须匹配。","ppp::Value":"Challenge 里是随机数，Response 里是 MD5(Identifier ‖ 口令 ‖ 挑战值) 前 16 字节。两者等长，靠 Code 区分语义，线上都明文可见。","ppp::Password":"长度由 Password-Length 界定，不以下标 0 结尾。字段里就是口令的 ASCII 字节，抓包即得，且整条请求可原样重放。","pppoe::Session ID":"发现阶段固定 0x0000，PADS 里由服务器分配，之后整个会话不变。会话由「源 MAC + 目的 MAC + Session ID」三要素唯一确定，三者全明文。","pppoe::TAG AC-Cookie":"PADO 里下发，客户端必须在 PADR 中原样带回。它让服务器先确认「这个客户端能单播收到我的应答」，提高伪造源 MAC 的抢答成本。","pppoe::TAG Host-Uniq":"客户端自选，服务器必须在 PADO 里原样回填。它解决的是「哪个应答对应我这次的 PADI」，不承担任何身份鉴别作用。","pppoe::PPP Protocol":"0x0021 是 IPv4，0xC021 LCP、0xC023 PAP、0xC223 CHAP、0x8021 IPCP。会话阶段 0x8864 之后就是它，决定后面载荷的类型。","quic::Header Form + Fixed Bit + Type + Reserved + PN Len":"0xc3 即长首部、固定位 1、类型 00（Initial）、保留位 00、包号长 4 字节。低 4 位受首部保护，线上看到的是掩码异或后的值；去保护后保留位必须为 0。","quic::Destination Connection ID":"首个 Initial 里是 8 字节随机值，只用作派生 Initial 密钥的盐；之后由服务器指定，客户端此后每个包都带着它。短首部不带长度字段，长度由接收方上下文决定。","quic::Token Length":"varint。客户端首个 Initial 为 0；收到 Retry 后重发的 Initial 会带服务器给的令牌。服务器发出的 Initial 必须为 0，客户端收到非零值应丢弃。","quic::Frames":"载荷是帧序列，本例两个 STREAM 帧：0x0a 表示有 LEN、无 OFF、无 FIN，随后是流 ID、长度与数据。不同流的数据可在同一包里交错发送，各自独立重传。","sava::Source Address":"发送方构造首部时自己写，协议没有规定它必须与实际接入位置一致，也没有任何字段能证明它属于谁；上层却拿它当身份用。","sava::Header Checksum":"只对首部 20 字节做反码求和，保证比特传输没出错；改完源地址顺手重算一次，报文就完全合法。","sava::Type":"ICMP 类型 8 是回显请求、0 是回显应答；请求小、应答确定且立即返回，因此最适合被借来当反射器。","snmp::community":"OCTET STRING，服务器只做字符串比对，相等就执行，不区分是谁、从哪来；读常用 public，写常用 private，都写在出厂配置里。","snmp::max-repetitions":"GetBulk 对每个重复型 varbind 连续返回这么多个后继值，取值越大响应越长，上限由代理与 msgMaxSize 决定。","snmp::msgFlags":"bit0 认证、bit1 加密、bit2 需要 Report；0x00 与 0x04 都没有认证可以随意伪造，只有 0x03 同时具备完整性与机密性。","snmp::msgAuthenticationParameters":"启用认证时填 HMAC-MD5-96 或 HMAC-SHA-96 的前 12 字节：发送方把本字段置零后对整个报文算 HMAC，接收方照做比对。","ssh::Cookie":"双方各生成一个并互相交换，作为共享秘密 K 与交换哈希 H 的输入之一，使任何一方都无法单独决定会话密钥与 session_id。","ssh::kex_algorithms":"4 字节长度加逗号分隔的算法名，按偏好从高到低排列；协商取客户端列表里第一个服务器也支持的项，因此清单里留着弱算法就会被选中。","ssh::Message Code":"传输层 1-49、认证层 50-79、连接层 80 以上；20 是 KEXINIT，50 是认证请求，51 与 52 是失败与成功。","ssh::Method Name":"none 是不带任何凭据的探测，服务器必定回 51，并在列表里给出真正支持的方法：publickey、password、keyboard-interactive。","telnet::IAC":"Interpret As Command：这个字节把流从数据模式切到命令模式，紧接的一个字节按命令码解释；数据里要出现 0xFF 必须双写。","telnet::Option ECHO":"服务器发 WILL ECHO 表示由它回显，客户端回 DO ECHO 后关闭本地回显，这就是登录时口令不上屏的全部机制。","telnet::Terminal Type":"SB 段里没有长度前缀，字符串一直到 IAC SE 为止；段内字节同样要遵守 0xFF 转义，漏一次边界就会错位。","telnet::SB":"250，表示后面是一段属于某个选项的结构化参数；终端类型、窗口大小这类带参数的选项都靠它承载。","tls::Client Version":"客户端在 ClientHello 里报自己支持的最高版本（本例 0x0303 即 TLS 1.2）；服务器若只支持更低版本就回自己的版本，客户端再自行判断是否接受。","tls::Cipher Suites":"每个套件 2 字节，按客户端偏好降序排列。本例四个里 0xc02f 是 ECDHE+AES-GCM，0x009c 是静态 RSA，0x002f 是 CBC。","tls::Session ID":"32 字节会话标识，服务器在 ServerHello 里回填表示接受恢复，此后双方跳过证书鉴别，直接用缓存的主密钥与套件。它必须随机、不可枚举，并设置合理的过期时间。","tls::extended_master_secret (0x0017)":"启用后主密钥派生会把整段握手 transcript 的哈希也纳入输入，而不再只用两个随机数。服务器在 ServerHello 里回显该扩展即表示同意。","tls13::legacy_version":"固定填 0x0303（TLS 1.2），是刻意撒谎：真实版本偏好放在 supported_versions 里。旧中间盒见到更高版本号会直接拒绝握手。","tls13::supported_versions (0x002b)":"1 字节列表长度加若干 2 字节版本号，按偏好降序，本例只有 0x0304。服务器在 ServerHello 里回写选定版本，取代报最高版本的旧做法。","tls13::key_share (0x0033)":"列表长度加若干 KeyShareEntry（组号、长度、公钥），本例是 x25519 的 32 字节公钥。客户端在第一个飞行就送出密钥交换的一半。","tls13::pre_shared_key (0x0029)":"identities（票据与混淆年龄）加 binders（对截断 transcript 的 HMAC）。必须排最后，因为 binder 覆盖它之前的所有字节。","tls13::early_data (0x002a)":"空扩展，只表示接下来会发 0-RTT；真正上限 max_early_data_size 由服务器在票据里给出，收到 HelloRetryRequest 必须丢弃重发。","udp::Length":"UDP 首部加数据的总长，不含 12 字节伪首部；最小 8、最大 65535，所以单个报文不超过 64 KB。接收方要核对 IP 总长减 IP 首部是否等于它。","udp::Checksum":"对伪首部加首部加数据做 16 位反码求和再取反；数据为奇数长度时末字节右补 0x00 参与运算，补的字节不传输；结果为 0 须填 0xffff。","udp::Data":"UDP 保留应用交下来的报文边界，既不合也不拆。本例是 29 字节 DNS 查询：事务 ID、标志、问题数，然后是长度前缀编码的域名与 QTYPE。","vlan::TPID":"2 字节：0x8100 是 802.1Q 标签，0x88A8 是 802.1ad（QinQ 外层），0x9100 是部分厂商的私有双标签标记。它把后面所有字段整体后移 4 字节。","vlan::TCI":"高 3 bit 是 PCP 优先级，中间 1 bit 是 DEI，低 12 bit 是 VID。VID 取 1~4094，0 与 4095 保留，1 通常是 native。","vlan::Outer TCI":"双标签帧里外层交换机只看这一层。攻击者把外层写成 native VLAN 的 VID，交换机就会把它当成普通 native 流量收下并剥掉。","vlan::Inner TCI":"外层被剥掉后，这一层就成了线上唯一的标签，被下一跳交换机当作合法 VLAN。12 位空间内的任意 VID 都可以被填进来。"};window.__SEC__={"Sequence Number":"可预测即可盲注入数据","Window":"窗口探测可推断接收缓冲与链路状态","Checksum":"校验和是全链路最后一道便宜保险，改任何字段都要重算","arp::EtherType":"伪造时 EtherType 必须写对，否则接收端根本不进 ARP 处理。","arp::Hardware Type":"长度字段被改成非 6/4 时，解析器若不复核就会越界读。","arp::Operation":"把操作码写成 2，一条「合法应答」就构造完成了。","arp::Sender Hardware Address":"帧头写真实网卡保证回程可达，载荷写别人的 MAC 完成冒充。","arp::Sender Protocol Address":"同一 IP 出现多个 MAC，是 ARP 欺骗最直接的判据。","arp::Target Hardware Address":"把应答发给广播地址，一次就能覆盖整个广播域。","arp::Target Protocol Address":"逐个递增地发请求，几秒就能测绘整个广播域。","dhcp::xid":"只要 xid 对上，伪造应答就能被接受——这是仿冒服务器唯一必须猜对的字段。","dhcp::chaddr":"饥饿攻击伪造的就是这里；Snooping 校验的也是这里。","dhcp::yiaddr":"填成隔离网段或攻击者主机的地址，就等于把客户端引走。","dhcp::giaddr":"伪造 giaddr 就能让服务器从别的子网发地址，造成跨网段错配。","dhcp::opt53":"终端只会发 1/3/7/8，出现 2/5/6 就说明有“服务器”在这个端口上说话。","dhcp::opt61":"只改 chaddr 不改 opt61 的实现会被识别为同一个人。","dhcp::opt51-val":"写成 4294967295 等于让错误配置在重启前永不失效，异常长租期是硬检测规则。","dhcp::opt54-val":"仿冒者把它写自己，客户端之后所有续租都只找攻击者。","dhcp::opt03-val":"改成攻击者主机，明文凭据与全部流量都先过他手。","dhcp::opt06-val":"网关与 DNS 同时被改，等于把出网判断和名字解析一起接管。","dns::ID":"它是整个协议唯一的血缘证明，也是 Kaminsky 攻击的全部成本。","dns::QNAME":"标签逼近 63 且熵值高，是隧道最硬的外形特征。","dns::ANCOUNT":"“答不上来却给了指引”正是投毒报文的指纹。","dns::NSCOUNT":"问 A 却收到 B 域的 NS，说明解析权正在被移交。","dns::TTL":"陌生记录配上千古长 TTL，是伪造报文的强特征。","dns::RDATA":"整个 DNS 安全体系要守的就是这 4 个字节。","dns::ARCOUNT":"小查询换来数 KB 应答，是反射放大与隧道的共同形状。","dns::TYPE":"TXT/NULL 记录频次异常是隐蔽信道的典型信号。","ethernet::Preamble + SFD":"定界靠物理层电平，能在链路上注入信号的人就能自己造帧头。","ethernet::Frame Check Sequence":"把 FCS 当完整性保护是常见误判，它只挡随机误码。","ftp::Argument":"明文用户名让攻击者能区分「账户不存在」与「口令错」，撞库省掉一半试错成本。","ftp::Host Address":"只校验参数格式不校验归属，等于把服务器的出向连接权交给了客户端。","ftp::Type Code":"选错类型会静默改坏文件：长度与哈希全变，会话却照样显示传输成功。","ftp::Pasv Argument":"中间人把它换成自己的地址，文件就流向攻击者，而控制连接看不出任何异常。","http::Method":"服务端误开 PUT，等于把写权限交给全网；TRACE 未关可被用于跨站追踪。","http::Request-Target":"凭据绝不能放查询串，它天然被记录、被转发给第三方。","http::Host-Value":"改成 internal.admin.example 常能直接摸到只绑内网域名的后台。","http::Cookie-Value":"嗅探可截、XSS 可读、CSRF 可借，三者都不需要破解任何加密。","http::Set-Cookie:":"缺 HttpOnly 是 XSS 偷凭据的前提，缺 SameSite 是 CSRF 的前提。","http::Cookie-Attrs":"三个属性各封一条窃取路径，缺一条就漏一条。","http::Content-Length:":"CL.TE 与 TE.CL 的成立条件，就是这条
