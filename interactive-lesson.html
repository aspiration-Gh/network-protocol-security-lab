,"why":"以太网/PPP 有帧校验，TCP/UDP 有覆盖伪首部的校验和，网络层再算一次收益很低，而每跳 TTL 变化都要重算，代价却落在所有路由器上。代价是首部被篡改不会有网络层告警。"},{"q":"IPv6 中分片可以在哪里发生？","options":["源主机和沿途路由器都可以","只有源主机","只有目的主机","只有边界路由器"],"a":1,"why":"IPv6 规定分片只由源节点执行，路由器遇到超 MTU 只能丢包并回 ICMPv6 类型 2“包太大”，由源端调小尺寸。这消除了中间设备参与分片/重组的一整类攻击面。"},{"q":"同一链路上的攻击者伪造 RA 为什么能生效，跳数限制=255 的校验为什么拦不住它？","options":["因为交换机自动改写跳数","因为 RA 不使用跳数限制","因为校验只针对跨网段报文，同链路直发天然满足 255","因为 255 校验只对 NA 生效"],"a":2,"why":"跳数限制校验的目的是挡住远端伪造：跨路由的报文跳数必然被减过。攻击者就在同一链路，报文跳数仍是 255，校验通过。NDP 本身没有认证，只能靠 RA Guard 或 SEND。"}]},"script":{"id":"ipv6","notes":{"Flow Label":{"short":"20 位流标签，给流分类用","more":"与源/目的地址一起标识一条「流」，让中间设备不必拆传输层首部就能做负载分担与 QoS。它不是安全字段，随机取值还能防止被用来做设备指纹。","sec":"取值是否随机，能反推对端操作系统的实现特征。"},"Hop Limit":{"short":"跳数上限，等价 IPv4 的 TTL","more":"8 位，每经一台路由器减 1，减到 0 丢弃并回 ICMPv6 超时。NDP 报文要求它必须是 255，接收端据此判断对方是否同链路。","sec":"RA/NS 的跳数限制不是 255 就该丢——这是防伪造的第一道硬检查。"},"Fragment Next Header":{"short":"分片头之后是什么协议","more":"8 位，位于 8 字节分片扩展首部内，指出重组完成后该把数据交给谁（6 TCP、17 UDP、58 ICMPv6）。它在第一个分片里可见，在后续分片里意义相同。","sec":"把真实上层协议藏在第二个分片，是绕过端口检测的经典手法。"},"Fragment Offset / Res / M":{"short":"偏移 13 位 + M 标志","more":"偏移单位仍是 8 字节，M=1 表示后面还有分片。IPv6 只允许源主机分片，中途路由器遇到超 MTU 只回「包太大」，所以这里不会出现路由器切出来的片。","sec":"重叠偏移与「首片不含上层首部」是绕过检测的两个抓手。"},"Cur Hop Limit":{"short":"RA 建议主机用的默认跳数","more":"8 位，路由器通告里告诉主机：发出的报文默认把跳数限制设成多少（常见 64）。主机据此更新自己接口的默认值。","sec":"伪造 RA 可以顺手把这个值改小，让受害者的流量提前被丢弃。"},"Router Lifetime":{"short":"这台路由器能当网关多久","more":"16 位，单位秒。非 0 表示可以当默认网关，0 表示只是通告前缀、不要当网关。主机按它维护默认路由的生存期。","sec":"填一个很大的值，伪造的网关就能长期占据默认路由。"},"Option: SLLA":{"short":"源链路层地址选项","more":"NDP 报文的选项字段，类型 1、长度 1（单位 8 字节），携带发送方的 6 字节 MAC。接收端用它更新邻居缓存，省掉一次额外解析。","sec":"这个选项就是 NDP 版的「我是这个 MAC」，伪造它等于伪造邻居。"},"L / A Flags":{"short":"L 上链路 / A 自动配置","more":"前缀信息选项里的两位：L=1 表示该前缀可用于判断同链路，A=1 表示主机可据此前缀用无状态方式自动配置地址（SLAAC）。","sec":"A=1 的伪造前缀会让主机自动配出一个攻击者网段的地址。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"40 字节定长首部 + 一条可无限接长的扩展首部链","lead":"IPv6 把可选功能从首部里搬到了链上：路由器不再解析，转发更快，但链上的内容也没人看。地址解析改由 NDP 在组播上完成。","scenes":[{"name":"定长首部 → 扩展首部链 → 分片 → RA","steps":[{"who":"主机A","to":"服务器","pkt":0,"bubble":"IPv6 基本首部 40 字节","hl":["Version","Payload Length","Next Header","Hop Limit"],"vals":{"Version":"6","Payload Length":"20","Next Header":"6（TCP）","Hop Limit":"64"},"say":"首部定长四十字节：没有校验和、没有 IHL、也没有分片字段。","sub":"字段少、偏移固定，路由器流水线更容易做深。"},{"who":"主机A","to":"服务器","pkt":0,"bubble":"128 位地址 + 流标签","hl":["Source Address","Destination Address","Flow Label"],"vals":{"Source Address":"2001:db8::1","Destination Address":"2001:db8::2","Flow Label":"0x12345"},"say":"地址各 128 位；流标签让中间设备不拆传输层就能给流分类。","sub":"可选功能没有消失，只是被推到扩展首部链上。"},{"who":"网关R1","to":"服务器","pkt":1,"bubble":"下一个首部 = 44（分片）","hl":["Next Header","Hop Limit","Source Address"],"vals":{"Next Header":"44（分片扩展首部）","Hop Limit":"63","Source Address":"2001:db8::a"},"say":"装不下就挂一节分片首部：下一个首部 44，之后才轮到 UDP。","sub":"除逐跳选项外，路由器一律不处理扩展首部。"},{"who":"主机A","to":"服务器","pkt":1,"bubble":"首片：offset=0 M=1","hl":["Fragment Offset / Res / M","Identification","Fragment Next Header","UDP Destination Port"],"vals":{"Fragment Offset / Res / M":"offset=0, M=1","Identification":"0xdeadbeef","Fragment Next Header":"17（UDP）","UDP Destination Port":"5001"},"say":"分片只由源主机做；路由器超 MTU 只回 ICMPv6「包太大」。","sub":"少了一整类「路由器切出畸形片」的攻击面。"},{"who":"网关R1","to":"主机A","pkt":2,"bubble":"RA 类型 134：默认网关与前缀","hl":["Type","Cur Hop Limit","Router Lifetime","Option: SLLA","Prefix Length"],"vals":{"Type":"134（路由通告）","Cur Hop Limit":"64","Router Lifetime":"1800","Option: SLLA":"00:1a:2b:3c:4d:5e","Prefix Length":"64"},"say":"地址从哪来靠 RA：默认网关、前缀与跳数限制全塞在这条报文里。","sub":"IPv6 没有广播也没有 ARP，地址解析改由组播上的 NS/NA 完成。"}],"cmds":{"linux":[{"c":"ip -6 route get 2001:db8::2","n":"看这条 v6 目的走哪个接口、源地址选成什么（含是否经隧道）","s":"《系统》Linux.md · ip"},{"c":"ip -6 addr show scope global","n":"确认接口上的 v6 地址与前缀长度，判断是不是 SLAAC 自动配出来的","s":"《系统》Linux.md · ip"},{"c":"ping -6 -c 3 2001:db8::2","n":"IPv6 下的 ping 走 ICMPv6（类型 128/129），与 v4 不是同一套类型","s":"《系统》Linux.md · ping"}],"ps":[{"c":"Test-NetConnection 2001:db8::2 -InformationLevel Detailed","n":"本机到 v6 目标的连通性与源地址，能区分「没路由」和「被过滤」","s":"《系统》PowerShell.md · Test-NetConnection"}],"cmd":[{"c":"netsh int ipv6 show neighbors","n":"v6 邻居表：NS/NA 解析出来的链路层地址都在这里","s":"《系统》Windows CMD.md · netsh"},{"c":"netsh int ipv6 show route","n":"v6 路由表，默认路由 ::/0 的下一跳就是 RA 给的网关","s":"《系统》Windows CMD.md · netsh"}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"RA/NA 无认证可伪造，分片头能把上层首部藏到第二片","lead":"两条路：一条改主机的路由与邻居缓存（NDP），一条骗过边界的解析器（分片首部）。都不需要攻破任何设备。","scenes":[{"name":"NDP 欺骗：一条 RA 换掉默认网关","steps":[{"who":"攻击者","to":"主机A","pkt":2,"bubble":"伪造 RA｜生存期 9000 秒","evil":true,"hl":["Type","Cur Hop Limit","Router Lifetime","Option: SLLA","Prefix Length"],"vals":{"Type":"134（路由通告）","Cur Hop Limit":"64","Router Lifetime":"9000","Option: SLLA":"aa:bb:cc:dd:ee:ff（攻击者）","Prefix Length":"64"},"say":"一条伪造 RA 就把默认网关换掉：生存期填 9000 秒，能占很久。","sub":"源地址必须是链路本地、跳数限制必须 255，伪造者也照做。"},{"who":"主机A","to":"—","pkt":2,"bubble":"写进默认路由与前缀表","hl":["Router Lifetime","L / A Flags","Prefix Length"],"vals":{"Router Lifetime":"9000","L / A Flags":"L=1, A=1（自动配地址）","Prefix Length":"64"},"say":"主机把攻击者记成默认网关，还按 A 标志自动配了个假前缀地址。","sub":"主机侧没有任何告警，路由表看着完全正常。"},{"who":"主机A","to":"攻击者","pkt":0,"bubble":"出网报文改投攻击者","hl":["Destination Address","Hop Limit","Next Header"],"vals":{"Destination Address":"2001:db8:bad::1（攻击者）","Hop Limit":"64","Next Header":"6（TCP）"},"say":"出网报文全改投攻击者，主机主观上认为一切正常。","sub":"只多一跳时延，业务不断，最难被发现。"},{"who":"攻击者","to":"原网关","pkt":0,"bubble":"可转发、可篡改、可丢弃","hl":["Source Address","Destination Address"],"vals":{"Source Address":"保留原始源地址","Destination Address":"真实网关"},"say":"攻击者可以选择转发、篡改或直接丢弃，断了排查先怀疑上游。","sub":"不转发就是针对整段子网的断网。"},{"who":"攻击者","to":"主机A","pkt":2,"bubble":"再补一条伪造 NA","evil":true,"hl":["Option: SLLA","SLLA Address"],"vals":{"Option: SLLA":"类型 1：目标链路层地址","SLLA Address":"aa:bb:cc:dd:ee:ff（冒充原网关）"},"say":"再补一条伪造邻居通告改邻居缓存，连同网段就近访问也一起劫走。","sub":"RA 管路由，NA 管邻居，两条报文各关一扇门。"}],"cmds":{"linux":[{"c":"ip -6 neigh show","n":"邻居缓存里网关的 MAC 是否变成陌生地址，NDP 欺骗的直接证据","s":"《系统》Linux.md · ip"},{"c":"sudo tcpdump -ni any 'icmp6 and ip6[40] == 134'","n":"抓所有 RA：本不该发 RA 的地址发出来的就是伪造","s":"补充（vault 无 tcpdump，NDP 取证必备）"},{"c":"ip -6 route show default","n":"默认路由的下一跳与生存期：被伪造 RA 换掉时这里换人","s":"《系统》Linux.md · ip"}],"ps":[{"c":"Get-NetIPAddress -AddressFamily IPv6 | Select IPAddress,PrefixLength,InterfaceAlias","n":"是否多出一个攻击者网段的前缀地址（说明 A 标志被利用）","s":"《系统》PowerShell.md · Get-NetIPAddress"}],"cmd":[{"c":"netsh int ipv6 show neighbors","n":"核对网关的链路层地址是否还是预期值","s":"《系统》Windows CMD.md · netsh"},{"c":"netsh int ipv6 show route","n":"默认路由 ::/0 的下一跳被换掉，是最直观的劫持证据","s":"《系统》Windows CMD.md · netsh"}]}},{"name":"分片首部绕过：把端口藏进第二片","steps":[{"who":"攻击者","to":"边界防火墙","pkt":1,"bubble":"首片｜offset=0 M=1，只放 8 字节","evil":true,"hl":["Next Header","Fragment Offset / Res / M","Payload Length","Fragment Data"],"vals":{"Next Header":"44（分片）","Fragment Offset / Res / M":"offset=0, M=1","Payload Length":"24","Fragment Data":"8 字节无害数据"},"say":"首片里没有任何传输层首部，检测设备拿不到端口与标志。","sub":"只能看到「下一个首部 44」，剩下全是不可解析的字节。"},{"who":"边界防火墙","to":"内网主机","pkt":1,"bubble":"按「未知上层」放行","hl":["Next Header","Hop Limit"],"vals":{"Next Header":"44 → 解析不出上层","Hop Limit":"64"},"say":"设备对解析不出上层的片段常选择放行，只记一条协议号 44。","sub":"策略里没有这一条，日志里也没有端口可写。"},{"who":"攻击者","to":"内网主机","pkt":1,"bubble":"第二片｜offset=1 M=0","evil":true,"hl":["Fragment Offset / Res / M","Fragment Next Header","UDP Destination Port"],"vals":{"Fragment Offset / Res / M":"offset=1（第 8 字节）, M=0","Fragment Next Header":"17（UDP）","UDP Destination Port":"5001"},"say":"第二片才从 UDP 首部开始，端口 5001 与整个请求都藏在这一片。","sub":"偏移单位仍是 8 字节，正好错开首片放数据的位置。"},{"who":"内网主机","to":"—","pkt":1,"bubble":"重组出完整 UDP 报文","hl":["Fragment Offset / Res / M","Identification","UDP Length"],"vals":{"Fragment Offset / Res / M":"offset=0 + offset=1 拼接","Identification":"0xdeadbeef","UDP Length":"24（含 8 字节首部）"},"say":"重组后得到完整 UDP 报文交给 5001，防火墙全程没见过端口。","sub":"检测点与终点看到的不是同一份数据，策略形同虚设。"},{"who":"攻击者","to":"内网主机","pkt":1,"bubble":"再叠重叠偏移","evil":true,"hl":["Fragment Offset / Res / M","Identification"],"vals":{"Fragment Offset / Res / M":"重叠偏移","Identification":"0xdeadbeef 同组"},"say":"再用重叠偏移，让检测端与主机重组出不同内容，绕开 IDS。","sub":"不同实现对重叠片的处理差异，正是 evasion 的空间。"}],"cmds":{"linux":[{"c":"sudo tcpdump -ni any 'ip6[6] == 44'","n":"只看下一个首部为 44 的报文，把所有分片单独列出来","s":"补充（vault 无 tcpdump，分片取证必备）"},{"c":"sudo nft list ruleset | grep -i frag","n":"查本机规则集里有没有针对分片头的丢弃或重组策略","s":"补充（nftables，vault 无）"},{"c":"sudo tcpdump -ni any 'ip6[6] == 44 and ip6[44+2:2] & 0x1fff != 0'","n":"只抓偏移非 0 的分片：首片看不到端口时，这些就是被藏起来的部分","s":"补充（vault 无 tcpdump）"}],"ps":[{"c":"Get-NetFirewallRule | Where-Object DisplayName -like '*IPv6*' | Select-Object DisplayName,Enabled","n":"核对 v6 相关规则是否只按端口匹配（分片绕过正是钻这个空子）","s":"《系统》PowerShell.md · 网络管理 Cmdlet"}],"cmd":[{"c":"netsh advfirewall firewall show rule name=all | findstr /i ipv6","n":"列出 v6 规则，看有没有基于端口、却忽略分片的条目","s":"《系统》Windows CMD.md · netsh"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"接入侧管住谁能发 RA/NA，边界只放行白名单首部并先重组","lead":"防守点很明确：NDP 要在接入交换机上按端口角色拦，扩展首部要在边界按类型与链深管，废弃的 RH0 直接丢。","scenes":[{"name":"RA Guard + 首部白名单 + 先重组后检测","steps":[{"who":"接入交换机","to":"—","pkt":2,"bubble":"RA Guard：用户口禁发 RA","hl":["Type","Option: SLLA"],"vals":{"Type":"134 → 用户端口来的直接丢","Option: SLLA":"必须与端口绑定表一致"},"say":"RA Guard：用户接入口只准发 NS/NA，任何 RA 一律丢，伪造网关失效。","sub":"再配合 ND Inspection 校验 NA 的源链路层地址。"},{"who":"主机A","to":"—","pkt":2,"bubble":"默认网关只能来自信任端口","hl":["Router Lifetime","Prefix Length","L / A Flags"],"vals":{"Router Lifetime":"始终是 1800","Prefix Length":"64","L / A Flags":"L=1, A=1"},"say":"攻击者的 RA 连缓存都进不去，默认路由与前缀表保持原样。","sub":"更彻底的是 SEND：用 CGA 与签名给 NDP 加认证。"},{"who":"边界防火墙","to":"—","pkt":1,"bubble":"扩展首部白名单","hl":["Next Header","Fragment Next Header"],"vals":{"Next Header":"44 不在白名单 → 丢弃","Fragment Next Header":"不放行未知链"},"say":"只放行业务确实需要的扩展首部类型，分片头与未知链直接丢。","sub":"链上重复出现或深度超阈值同样丢弃。"},{"who":"边界防火墙","to":"内网主机","pkt":1,"bubble":"必须放行的先重组再检测","hl":["Fragment Offset / Res / M","Identification"],"vals":{"Fragment Offset / Res / M":"重组后再取端口","Identification":"0xdeadbeef 整组"},"say":"必须放行的分片先重组，拿到端口与标志后再匹配策略。","sub":"检测点必须和终点看到同一份数据，否则永远慢一步。"},{"who":"边界防火墙","to":"—","pkt":0,"bubble":"RH0 已废弃，见到即丢","hl":["Next Header","Source Address"],"vals":{"Next Header":"43（路由头）且 type=0 → 丢弃","Source Address":"2001:db8::66"},"say":"按 RFC 5095 丢掉 type 0 路由头，靠中转列表放大与绕行的路被掐断。","sub":"只保留移动 IPv6 等明确需要的类型，并校验中转节点数。"}],"cmds":{"linux":[{"c":"sysctl net.ipv6.conf.all.accept_ra net.ipv6.conf.all.forwarding","n":"accept_ra=0 表示主机不接受 RA；转发开启时内核也会忽略 RA","s":"补充（vault 无 accept_ra 小节）"},{"c":"ip -6 neigh show nud all","n":"含各种状态的全量邻居表，定期与基线比对可发现被改写","s":"《系统》Linux.md · ip"},{"c":"sudo tcpdump -ni any 'ip6[6] == 43 or ip6[6] == 44'","n":"确认路由头与分片头已被边界丢弃：这里不该再看到它们","s":"补充（vault 无 tcpdump）"}],"ps":[{"c":"Get-NetIPAddress -AddressFamily IPv6 | Select IPAddress,PrefixLength,InterfaceAlias","n":"检查是否凭空多出攻击者网段的前缀地址","s":"《系统》PowerShell.md · Get-NetIPAddress"}],"cmd":[{"c":"netsh int ipv6 show neighbors","n":"巡检网关的链路层地址；被 NA 欺骗时这里最先变化","s":"《系统》Windows CMD.md · netsh"},{"c":"netsh interface ipv6 show subinterfaces","n":"看接口 MTU，MTU 设置得当能减少分片需求","s":"《系统》Windows CMD.md · netsh"}]}}]}]}},{"proto":{"id":"arp","name":"ARP","cn":"地址解析协议","en":"Address Resolution Protocol","layer":"network","chapter":"第三章","extra":false,"oneLine":"把 IP 解析成 MAC 的最后一跳：28 字节报文里没有任何认证字段，谁能发出应答，谁就能决定别人的流量去哪。","sections":[{"h":"ARP 补的是“知道你在哪、却不知道你网卡是谁”这个缺口","p":"跨网寻址靠 IP，链路上真正交付靠 MAC。当主机 A 要把帧发给同一子网的 209.0.0.6 时，它必须先知道对方的硬件地址，于是广播一条“谁有 209.0.0.6？告诉 209.0.0.5”的请求，同网段所有网卡都会收到，只有目标会以单播回应自己的 MAC，A 把这条映射写进缓存后才能真正封装成帧发出。若目的 IP 不在同一子网，A 解析的不是最终主机，而是默认网关的 MAC——帧要交给网关去转发。\n\n“解析网关”这一点解释了攻击后果的量级：冒充网关的 MAC，就能让整个子网的外网流量改道；而解析请求是广播，等于把“我在找谁”公开给同一广播域里的每一个接口。"},{"h":"缓存更新有两条触发路径，其中一条是“顺手牵羊”","p":"主机更新 ARP 缓存的情形有两种：收到 ARP 应答时；收到发给自己的 ARP 请求时。第二条最容易被忽视——请求报文里带着发送方的 IP 与 MAC，收到的人会先把这条映射写进自己的缓存，再考虑要不要回答。于是攻击者只要发一个请求，就能污染目标缓存，完全不必等对方回话。\n\n缓存存在老化时间（常见数分钟），这既是网络自愈能力（错误表项会过期），也迫使攻击者周期性重发伪造应答，而“周期性重发”恰好是检测时最好用的特征。另外，主机在地址变更或开机时会主动广播“免费 ARP”，用来自我宣告并纠正他人缓存——这个本用于善意的机制，同样可以被伪造者拿来直接覆盖别人的表项。"},{"h":"28 字节的报文把“我是谁”完全交给发送方填写","p":"ARP 载荷固定 28 字节：硬件类型、协议类型、硬件地址长度、协议地址长度、操作码、发送方硬件地址、发送方 IP、目标硬件地址、目标 IP。操作码只有 1 请求、2 应答、3/4 供 RARP 使用，没有“认证”“签名”这样的取值。报文直接封在以太网帧里，帧类型 0x0806，前面是 6 字节目的 MAC、6 字节源 MAC。\n\n于是伪造的门槛等于零：把发送方 IP 写成网关地址、发送方 MAC 写成自己的网卡，一条“合法”的应答就构造完了。接收端没有序列号可以核对请求与应答的对应关系，也没有任何字段能证明“这条应答来自它声称的那台机器”。这不是实现疏忽，而是协议设计时局域网的信任假设——同轴电缆时代，能发包的人本来就在物理链路上。"},{"h":"帧头与载荷可以互相矛盾，这正是伪造的落点","p":"以太网帧头里有源 MAC，ARP 载荷里又有发送方硬件地址，两者本应一致。交换机只学习帧头源 MAC 来建立转发表，而主机更新缓存时看的是载荷里的发送方字段——两个平面被分开处理，就产生了可乘之机：帧头源 MAC 写真实网卡（保证交换机把回程帧送到攻击者），载荷里的发送方字段写被冒充的地址。\n\n同理，应答可以单播也可以广播；广播应答会让同一广播域内所有主机一起更新缓存，一次发送污染全网，效率远高于逐台欺骗。检测时“帧头源 MAC 与 ARP 载荷发送方硬件地址不一致”是一条硬判据，而“一个 IP 出现多个 MAC”“一个 MAC 对应多个 IP”则是从缓存表角度看的等价判据。"},{"h":"ARP 没有打补丁的余地，只能在链路层加校验或缩小广播域","p":"ARP 不带认证字段，也不打算带；它甚至没有版本号可以做平滑升级。所以安全加固只能是三条路：加一层校验（交换机侧 DAI 按 DHCP Snooping 绑定表核对 ARP 的 IP-MAC 对、网关与关键服务器做静态绑定）、换一套协议（Secure ARP 用密码学保护 ARP，需两端支持、兼容性差）、缩小广播域（端口隔离、私用 VLAN 让终端之间无法直接二层通信，ARP 欺骗的前提被破坏）。\n\n这三条都有明确边界：DAI 依赖绑定表，静态 IP 主机往往不在表里；静态绑定维护成本高，换设备就失效；端口隔离会影响正常的横向业务。因此在 IPv4 与以太网体系内，ARP 欺骗只能被缓解，不可能被根治——这也是它至今仍是内网渗透第一步的原因。"}],"packets":[{"title":"ARP 请求（以太网帧 14 字节 + ARP 载荷 28 字节）","hex":"ff ff ff ff ff ff b2 34 55 10 22 10 08 06 00 01 08 00 06 04 00 01 b2 34 55 10 22 10 82 17 2b 14 00 00 00 00 00 00 82 17 2b 19","note":"“Who has 130.23.43.25? Tell 130.23.43.20”，目的 MAC 全 F 广播，目标硬件地址填 0。","fields":[{"name":"Ethernet Destination","cn":"目的以太网地址","off":0,"len":6,"bits":"48 位","tone":"mac","desc":"全 F 即广播，同广播域内所有网卡都会把帧交给上层。本例 ff:ff:ff:ff:ff:ff。","sec":"广播是 ARP 的效率来源也是暴露面：一次请求让所有主机都看到谁在找谁；攻击者同样可以用广播应答一次污染全网。"},{"name":"Ethernet Source","cn":"源以太网地址","off":6,"len":6,"bits":"48 位","tone":"mac","desc":"发送方网卡地址，本例 b2:34:55:10:22:10。交换机只按这个字段学习转发表。","sec":"它与 ARP 载荷里的发送方硬件地址可以不一致：帧头写真实网卡保证回程可达，载荷写被冒充的地址，形成“交换机信帧头、主机信载荷”的错位。"},{"name":"EtherType","cn":"帧类型","off":12,"len":2,"bits":"16 位 = 0x0806","tone":"type","desc":"0x0806 表示载荷是 ARP；0x86dd 是 IPv6，0x0800 是 IPv4。","sec":"抓包过滤与 ACL 的匹配依据；把类型改错可让报文被主机丢弃，或让只按类型过滤的设备漏检。"},{"name":"Hardware Type","cn":"硬件类型","off":14,"len":2,"bits":"16 位 = 0x0001","tone":"type","desc":"1 表示以太网。其他值对应令牌环、FDDI 等历史链路。","sec":"非 1 的取值会让部分协议栈走不同分支，是畸形 ARP 的构造点。"},{"name":"Protocol Type","cn":"协议类型","off":16,"len":2,"bits":"16 位 = 0x0800","tone":"type","desc":"0x0800 表示要解析的是 IPv4 地址。","sec":"与帧类型不一致时，不同实现的处理路径分歧，可用于探测或绕过解析型设备。"},{"name":"Hardware Length","cn":"硬件地址长度","off":18,"len":1,"bits":"8 位 = 6","tone":"len","desc":"MAC 地址字节数，以太网为 6。","sec":"长度与实际地址不符会让解析器错位读取后续字段，是历史上多个 ARP 相关漏洞的成因。"},{"name":"Protocol Length","cn":"协议地址长度","off":19,"len":1,"bits":"8 位 = 4","tone":"len","desc":"IPv4 地址字节数，固定 4。","sec":"改成非 4 的值可让解析器按错误步长读取发送方/目标地址，构造出“看似某 IP、实际另一 IP”的报文。"},{"name":"Operation","cn":"操作码","off":20,"len":2,"bits":"16 位：1 请求 / 2 应答 / 3 RARP 请求 / 4 RARP 应答","tone":"code","desc":"本例 0x0001 为请求。整个协议只有这四个取值，其中没有“认证”或“签名”。","sec":"攻击者只需把操作码写成 2，就能发送一条无需请求对应的应答；主机收到任何 2 都会更新缓存，这是欺骗成立的关键。"},{"name":"Sender Hardware Address","cn":"发送方硬件地址","off":22,"len":6,"bits":"48 位","tone":"mac","desc":"声称“我的 MAC 是这个”，本例与帧头源地址相同。","sec":"欺骗时填攻击者自己的 MAC，让受害者的流量二层直达攻击者网卡；与帧头不一致即为强异常信号。"},{"name":"Sender Protocol Address","cn":"发送方 IP 地址","off":28,"len":4,"bits":"32 位","tone":"addr","desc":"声称“我是谁”，本例 130.23.43.20。","sec":"填成网关地址即“冒充网关”，填成某台服务器地址即“冒充主机”；这一字段是整个欺骗的载荷核心。"},{"name":"Target Hardware Address","cn":"目标硬件地址","off":32,"len":6,"bits":"48 位","tone":"mac","desc":"请求时全 0（还不知道），应答时填对方 MAC。","sec":"请求场景下全 0 是正常的；若请求里带了非 0 值而对方又照抄，可作为异常判据。"},{"name":"Target Protocol Address","cn":"目标 IP 地址","off":38,"len":4,"bits":"32 位","tone":"addr","desc":"要解析谁的地址，本例 130.23.43.25。","sec":"用它遍历整个网段即为 ARP 扫描：逐 IP 发请求，有应答的就是在线主机。"}]},{"title":"伪造 ARP 应答：把网关 IP 指向攻击者 MAC（免费 ARP 形态）","hex":"ff ff ff ff ff ff aa bb cc dd ee ff 08 06 00 01 08 00 06 04 00 02 aa bb cc dd ee ff 0a 0a 0a 08 00 11 22 33 44 55 0a 0a 0a 01","note":"操作码=2，发送方 IP 填网关 10.10.10.8、发送方 MAC 填攻击者 aa:bb:cc:dd:ee:ff，目的为广播，一次覆盖全网。","fields":[{"name":"Ethernet Destination","cn":"目的以太网地址","off":0,"len":6,"bits":"48 位全 F","tone":"mac","desc":"广播发送，同网段所有主机都会处理这条应答，无需逐台欺骗。","sec":"广播应答是效率最高的污染方式；若改为单播则只影响指定受害者，隐蔽性更好。"},{"name":"Ethernet Source","cn":"源以太网地址","off":6,"len":6,"bits":"48 位","tone":"mac","desc":"攻击者真实网卡 aa:bb:cc:dd:ee:ff，保证受害者的回程帧能到达攻击者。","sec":"交换机据此学习端口，攻击者因此能收到本应发给网关的帧——这是“能转发”的前提。"},{"name":"EtherType","cn":"帧类型","off":12,"len":2,"bits":"16 位 = 0x0806","tone":"type","desc":"标准 ARP 类型，不含任何异常值。","sec":"报文层面完全合法，没有畸形字段可查，所以检测只能靠行为与状态不一致，而不是特征匹配。"},{"name":"Hardware Type","cn":"硬件类型","off":14,"len":2,"bits":"16 位 = 0x0001","tone":"type","desc":"以太网，与正常请求完全相同。","sec":"非 1 的取值会让部分协议栈走不同分支，是构造畸形 ARP 的入口。"},{"name":"Protocol Type","cn":"协议类型","off":16,"len":2,"bits":"16 位 = 0x0800","tone":"type","desc":"要解析的是 IPv4 地址。","sec":"与帧类型不一致时不同实现处理路径分歧，可用于探测与绕过。"},{"name":"Hardware Length","cn":"硬件地址长度","off":18,"len":1,"bits":"8 位 = 6","tone":"len","desc":"MAC 地址 6 字节。","sec":"长度与内容不符会让解析器错位读取，历史上多个 ARP 漏洞由此而来。"},{"name":"Protocol Length","cn":"协议地址长度","off":19,"len":1,"bits":"8 位 = 4","tone":"len","desc":"IPv4 地址 4 字节。","sec":"改成非 4 可构造“看似某 IP、实际另一 IP”的报文，绕过只看字符串的检测。"},{"name":"Operation","cn":"操作码","off":20,"len":2,"bits":"16 位 = 2（应答）","tone":"code","desc":"直接发应答，不等待也不对应任何请求。","sec":"主机不校验“我是否发过这条请求”，因此主动应答同样被接受，这是无需请求即可污染的根本原因。"},{"name":"Sender Hardware Address","cn":"发送方硬件地址","off":22,"len":6,"bits":"48 位","tone":"mac","desc":"攻击者 MAC，与帧头一致，因此帧头/载荷一致性检查在这里抓不到。","sec":"高级伪造会让帧头与载荷都写被冒充的地址，再用其他手段保证流量经过自己，此时的判据要换成缓存表的一对多异常。"},{"name":"Sender Protocol Address","cn":"发送方 IP 地址","off":28,"len":4,"bits":"32 位 = 10.10.10.8","tone":"addr","desc":"被冒充的网关地址。这一字段与真实网关无关，纯粹是声称。","sec":"受害者缓存条目被改写为 10.10.10.8 → aa:bb:cc:dd:ee:ff，此后所有出网流量都发给攻击者。"},{"name":"Target Hardware Address","cn":"目标硬件地址","off":32,"len":6,"bits":"48 位","tone":"mac","desc":"填受害者的 MAC（00:11:22:33:44:55），也可全 0。","sec":"填具体值让报文看起来更像针对某台主机的正常应答；全 0 则是典型免费 ARP 形态。"},{"name":"Target Protocol Address","cn":"目标 IP 地址","off":38,"len":4,"bits":"32 位 = 10.10.10.1","tone":"addr","desc":"受害者地址。若改为遍历网段逐个发送，即为批量污染。","sec":"同一 IP 在短时间内收到指向不同 MAC 的应答，是检测系统最直接的告警条件。"}]}],"attacks":[{"name":"ARP Spoofing MITM","cn":"ARP 欺骗中间人","impact":"双向流量都经攻击者网卡中转，可监听、篡改、注入，或直接丢弃造成断网。","steps":[{"who":"攻击者","to":"受害者 A","label":"ARP 应答：发送方 IP=网关 10.10.10.8，发送方 MAC=aa:bb:cc:dd:ee:ff（攻击者）","note":"A 的缓存条目被改写，出网流量改为发往攻击者。"},{"who":"攻击者","to":"网关","label":"ARP 应答：发送方 IP=10.10.10.1（受害者 A），发送方 MAC=攻击者","note":"网关缓存也被改写，回程流量同样指向攻击者，双向路径闭合。"},{"who":"受害者 A","to":"攻击者","label":"以太网帧 目的 MAC=aa:bb:cc:dd:ee:ff，载荷仍是发往 8.8.8.8 的 IP 报文","note":"A 主观上认为自己在和网关通信，没有任何告警。"},{"who":"攻击者","to":"网关","label":"原样转发（或先改载荷再转发）","note":"通信看起来正常，只多了一跳时延，可长期驻留不被发现。"},{"who":"攻击者","to":"受害者 A / 网关","label":"每 30 秒重发一次伪造应答","note":"对抗 ARP 缓存老化（常见数分钟），维持污染状态。"},{"who":"攻击者","to":"目标服务器","label":"在明文协议中提取凭据，或对 HTTPS 做降级/证书替换","note":"若选择不转发，则直接构成拒绝服务，且排查时先怀疑网络而非主机。"}],"defense":"交换机侧启用 DAI 按 DHCP Snooping 绑定表校验 ARP，关键设备做静态绑定，并把终端之间隔离到不同私用 VLAN。"},{"name":"ARP Scanning","cn":"ARP 扫描与资产测绘","impact":"几秒内摸清整个广播域的在线主机、MAC 厂商与网关地址，为后续欺骗选定目标。","steps":[{"who":"攻击者","to":"同网段全部地址","label":"对 10.10.10.1~10.10.10.254 逐个发 ARP 请求（目的 MAC 广播，目标 IP 递增）","note":"无需 TCP/UDP，不触发任何基于端口的策略，也不产生三次握手日志。"},{"who":"在线主机","to":"攻击者","label":"ARP 应答：发送方 IP/MAC 为自己的真实值","note":"一次交互即暴露 IP、MAC、网卡厂商（MAC 前三字节 OUI）。"},{"who":"攻击者","to":"—","label":"汇总应答，得到存活清单与网关地址","note":"比 ping 扫描更可靠：很多主机封 ICMP 但不会封 ARP。"},{"who":"攻击者","to":"—","label":"按 OUI 识别打印机、摄像头、工控设备等弱终端","note":"据此挑选最可能缺乏防护的欺骗目标。"},{"who":"攻击者","to":"选定受害者","label":"转入定向 ARP 欺骗或中间人","note":"扫描阶段几乎不留日志，是被忽视的早期侦查环节。"}],"defense":"接入交换机开启 ARP 速率限制与端口安全，配合 ARP 检测工具对短时间大量请求告警。"}],"defenses":[{"name":"DAI（动态 ARP 检测）","how":"交换机建立 DHCP Snooping 绑定表（IP、MAC、端口、VLAN），对每个 ARP 报文核对发送方 IP-MAC-端口是否与绑定表一致，不一致则丢弃；同时可限制单位时间 ARP 报文数量。","limit":"强依赖 DHCP Snooping 与绑定表，静态配置 IP 的主机、服务器往往不在表里，需手工补静态绑定；无法防住同网段内已被授权设备的伪造，跨交换机时需逐台配置。"},{"name":"静态 ARP 绑定","how":"在网关、关键服务器与重要终端上手工写入 IP-MAC 静态表项，禁止动态覆盖，并定期巡检核对。","limit":"维护成本随终端数量线性上升，换网卡或换设备即失效；终端侧需要管理员权限逐台配置，在移动办公与访客网络中基本不可行。"},{"name":"端口隔离 / 私用 VLAN","how":"在接入交换机上把终端端口划入隔离组或私用 VLAN，使同一交换机的终端之间无法直接二层互通，只能与上行网关通信。","limit":"破坏 ARP 欺骗的“同广播域”前提，但同时切断终端间合法的共享与发现协议；跨交换机、跨 VLAN 的路径需另行设计，无线侧往往不适用。"},{"name":"ARP 行为检测（ARPWatch 类）","how":"持续采集 ARP 请求/应答，建立“IP↔MAC”基线，对同一 IP 出现多个 MAC、同一 MAC 对应多个 IP、某 MAC 高频发送应答等模式告警。","limit":"只能发现与告警，不能阻断；依赖干净的初始基线与长期维护，DHCP 频繁变动、集群与虚拟化环境误报率高，加密或分段网络中可见性不足。"}],"calcs":[],"quiz":[{"q":"主机从未发出 ARP 请求，收到一条声称“网关 IP 在攻击者 MAC 上”的 ARP 应答，它会更新缓存吗？","options":["会，ARP 应答无需与请求对应","不会，必须与请求匹配","只在网关地址上会","只在应答为单播时会"],"a":0,"why":"ARP 没有请求-响应绑定，也没有认证字段，收到操作码为 2 的报文就直接更新（或新建）表项；正因如此，攻击者可以主动发送免费 ARP 完成污染。"},{"q":"以下哪种 ARP 缓存状态最应被视为欺骗信号？","options":["一个 IP 对应一个 MAC","同一 IP 在短时间内对应多个不同 MAC","缓存表为空","表项带有老化时间"],"a":1,"why":"正常是严格一对一。同一 IP 出现多个 MAC 说明有人冒充该 IP；反之一个 MAC 对应多个 IP，说明有人在网关侧冒充一堆主机。"},{"q":"为什么说 ARP 欺骗在 IPv4/以太网体系内无法根治？","options":["因为交换机性能不足","因为 ARP 报文太长","因为协议本身没有认证字段且不可平滑升级","因为 MAC 地址会冲突"],"a":2,"why":"28 字节报文里没有任何可承载认证的字段，也没有版本协商机制。只能靠外部校验（DAI、静态绑定）、换协议（Secure ARP）或缩小广播域来缓解。"}]},"script":{"id":"arp","notes":{"EtherType":{"short":"帧类型 0x0806 表示 ARP","more":"以太网帧头 14 字节里的最后 2 字节，0x0806 是 ARP，0x0800 是 IPv4，0x86DD 是 IPv6。交换机靠它决定把载荷交给哪个上层解析。","sec":"伪造时 EtherType 必须写对，否则接收端根本不进 ARP 处理。"},"Hardware Type":{"short":"硬件类型，以太网为 1","more":"16 位，0x0001 表示以太网。它和下面的协议类型、两个长度字段一起，说明「用什么地址去解析什么地址」。","sec":"长度字段被改成非 6/4 时，解析器若不复核就会越界读。"},"Operation":{"short":"1 请求 / 2 应答，无认证位","more":"16 位操作码，只有请求、应答与 RARP 四种取值。没有序号、没有签名，接收端无法把一条应答和任何请求对应起来。","sec":"把操作码写成 2，一条「合法应答」就构造完成了。"},"Sender Hardware Address":{"short":"发送方 MAC，可随意填写","more":"48 位，本应等于帧头源 MAC。交换机只看帧头学转发表，主机只看这里更新缓存——两个平面被分开处理，就产生了伪造空间。","sec":"帧头写真实网卡保证回程可达，载荷写别人的 MAC 完成冒充。"},"Sender Protocol Address":{"short":"发送方 IP，冒充的落点","more":"32 位。填谁的地址，接收端就把谁的 IP 映射到发送方 MAC 上。填网关地址就是冒充网关，填内网主机地址就是骗网关。","sec":"同一 IP 出现多个 MAC，是 ARP 欺骗最直接的判据。"},"Target Hardware Address":{"short":"目标 MAC，请求时全 0","more":"48 位。请求报文里因为还不知道对方硬件地址，填全 0；应答里填请求方的 MAC。有些实现会直接拿它覆盖缓存。","sec":"把应答发给广播地址，一次就能覆盖整个广播域。"},"Target Protocol Address":{"short":"被解析的 IP","more":"32 位，请求时是「我在找谁」的地址，应答时是发起解析的那一方的地址。扫描就是拿它做递增遍历。","sec":"逐个递增地发请求，几秒就能测绘整个广播域。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"广播问一句、单播答一句，映射写进内存，几分钟后老化","lead":"ARP 只做一件事：把 IP 换成 MAC。注意它没有序号、没有签名，也没有「这条应答对应哪次请求」的概念。","scenes":[{"name":"请求 → 应答 → 写缓存","steps":[{"who":"主机A","to":"同网段广播","pkt":0,"bubble":"Who has 10.10.10.8?","hl":["Ethernet Destination","Operation","Sender Protocol Address","Target Protocol Address"],"vals":{"Ethernet Destination":"ff:ff:ff:ff:ff:ff（广播）","Operation":"1（请求）","Sender Protocol Address":"10.10.10.1（自己）","Target Protocol Address":"10.10.10.8（网关）"},"say":"「谁有 10.10.10.8？告诉 10.10.10.1」——一封广播问遍整个广播域。","sub":"目的 IP 不在本网段时，解析的是网关的 MAC，不是最终主机。"},{"who":"网关","to":"主机A","pkt":1,"bubble":"10.10.10.8 is at 00:11:22:33:44:55","hl":["Operation","Sender Hardware Address","Sender Protocol Address","Ethernet Destination"],"vals":{"Operation":"2（应答）","Sender Hardware Address":"00:11:22:33:44:55","Sender Protocol Address":"10.10.10.8","Ethernet Destination":"单播回主机A"},"say":"只有它自己回答，单播交出自己的 MAC——一次交互就够，不需要确认。","sub":"应答不必与请求对应，谁发来都照收。"},{"who":"主机A","to":"—","pkt":0,"bubble":"写入 ARP 缓存","hl":["Sender Protocol Address","Sender Hardware Address","Target Protocol Address"],"vals":{"Sender Protocol Address":"10.10.10.8","Sender Hardware Address":"00:11:22:33:44:55","Target Protocol Address":"后续发帧直接查表"},"say":"IP 到 MAC 的映射写进内存里的 ARP 表，之后发帧查表，不再问。","sub":"表项存在 RAM 里，重启即清空，靠老化定时器维护。"},{"who":"主机A","to":"—","pkt":0,"bubble":"表项老化","hl":["Sender Hardware Address"],"vals":{"Sender Hardware Address":"过期后重新解析"},"say":"表项有老化时间（常见几分钟），过期就得重新问一遍。","sub":"这既是自愈能力，也逼攻击者周期性重发伪造应答。"},{"who":"主机A","to":"同网段广播","pkt":0,"bubble":"免费 ARP：自我宣告","hl":["Operation","Sender Protocol Address","Target Protocol Address"],"vals":{"Operation":"1（请求，目标填自己）","Sender Protocol Address":"10.10.10.1","Target Protocol Address":"10.10.10.1"},"say":"开机或换网卡时广播免费 ARP，自我宣告并顺手纠正别人的错误表项。","sub":"本用于善意纠正，伪造者拿它直接覆盖别人的表项。"}],"cmds":{"linux":[{"c":"ip neigh show","n":"ARP 表的现代写法：IP、MAC 与状态（REACHABLE / STALE / FAILED）","s":"《系统》Linux.md · ip"},{"c":"ping -c 2 10.10.10.8 && ip neigh show 10.10.10.8","n":"先触发一次解析再看表项，能观察到由 REACHABLE 转 STALE 的老化过程","s":"《系统》Linux.md · ping"}],"ps":[{"c":"Get-NetNeighbor -AddressFamily IPv4 | Select IPAddress,LinkLayerAddress,State","n":"邻居表：State 为 Reachable 是通的，Permanent 是静态绑定","s":"《系统》PowerShell.md · Get-NetNeighbor"}],"cmd":[{"c":"arp -a","n":"按接口列出 IP-MAC 对照表，类型 dynamic 表示可被动态覆盖","s":"《系统》Windows CMD.md · arp"},{"c":"arp -a 10.10.10.8","n":"只查网关那一条，核对 MAC 是否还是预期值","s":"《系统》Windows CMD.md · arp"}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"谁能发出应答，谁就能决定别人的流量去哪；谁发请求，谁就能测绘","lead":"两招都零门槛：伪造一条应答，或把请求发满整个网段。前者改流量，后者画地图。","scenes":[{"name":"中间人：两边各骗一次，双向都过攻击者","steps":[{"who":"攻击者","to":"主机A","pkt":1,"bubble":"应答｜网关 IP = 攻击者 MAC","evil":true,"hl":["Operation","Sender Protocol Address","Sender Hardware Address","Ethernet Destination"],"vals":{"Operation":"2（应答）","Sender Protocol Address":"10.10.10.8（冒充网关）","Sender Hardware Address":"aa:bb:cc:dd:ee:ff（攻击者）","Ethernet Destination":"ff:ff:ff:ff:ff:ff"},"say":"一条伪造应答：网关的 IP 指向攻击者 MAC，广播一次覆盖全网。","sub":"主机不会去核对「我到底问过没有」。"},{"who":"攻击者","to":"网关","pkt":1,"bubble":"应答｜受害者 IP = 攻击者 MAC","evil":true,"hl":["Operation","Sender Protocol Address","Sender Hardware Address","Target Protocol Address"],"vals":{"Operation":"2（应答）","Sender Protocol Address":"10.10.10.1（冒充受害者）","Sender Hardware Address":"aa:bb:cc:dd:ee:ff","Target Protocol Address":"10.10.10.8"},"say":"反手再骗网关一次：受害者的 IP 也指向攻击者，双向路径闭合。","sub":"只骗一边只能看到上行，骗两边才拿得到完整会话。"},{"who":"主机A","to":"攻击者","pkt":0,"bubble":"目的 MAC = 攻击者","hl":["Ethernet Destination","Ethernet Source","EtherType"],"vals":{"Ethernet Destination":"aa:bb:cc:dd:ee:ff","Ethernet Source":"b2:34:55:10:22:10","EtherType":"0x0800（里面是 IP）"},"say":"主机A 以为在和网关说话，帧却进了攻击者网卡，它没有任何告警。","sub":"帧头目的 MAC 就是查 ARP 表查出来的结果。"},{"who":"攻击者","to":"网关","pkt":0,"bubble":"原样转发","hl":["Ethernet Source","Ethernet Destination"],"vals":{"Ethernet Source":"aa:bb:cc:dd:ee:ff（攻击者的真实网卡）","Ethernet Destination":"00:11:22:33:44:55（网关）"},"say":"转发一遍，通信看着正常，只多一跳时延，可以长期驻留不被发现。","sub":"选择不转发就是拒绝服务，且排查时先怀疑网络。"},{"who":"攻击者","to":"主机A","pkt":1,"bubble":"每 30 秒重发一次","evil":true,"hl":["Operation","Sender Protocol Address","Sender Hardware Address"],"vals":{"Operation":"2（应答）","Sender Protocol Address":"10.10.10.8","Sender Hardware Address":"aa:bb:cc:dd:ee:ff"},"say":"对抗缓存老化，周期性重发——这个规律正是检测最好用的特征。","sub":"某 MAC 高频发送应答，基线一比就露。"}],"cmds":{"linux":[{"c":"sudo tcpdump -ni any 'arp and arp[6:2] == 2'","n":"只看 ARP 应答（操作码 2），某 MAC 密集应答即为欺骗特征","s":"补充（vault 无 tcpdump，ARP 取证必备）"},{"c":"sudo arpspoof -i eth0 -t 10.10.10.1 10.10.10.8","n":"对 10.10.10.1 冒充 10.10.10.8（dsniff 包，仅限授权环境）","s":"补充（dsniff 的 arpspoof，vault 无）"},{"c":"ip neigh show 10.10.10.8","n":"看受害者缓存里网关的 MAC 有没有变成陌生地址","s":"《系统》Linux.md · ip"}],"ps":[{"c":"Get-NetNeighbor -IPAddress 10.10.10.8 | Select IPAddress,LinkLayerAddress,State","n":"本机视角核对网关 MAC；被污染时这里就是攻击者网卡","s":"《系统》PowerShell.md · Get-NetNeighbor"}],"cmd":[{"c":"arp -a | findstr 10.10.10.8","n":"网关条目是否还指向预期 MAC，一眼可判","s":"《系统》Windows CMD.md · arp"}]}},{"name":"ARP 扫描：不要端口，也能把网段摸清","steps":[{"who":"攻击者","to":"同网段 254 个地址","pkt":0,"bubble":"Who has 10.10.10.1~254?","evil":true,"hl":["Operation","Ethernet Destination","Target Protocol Address"],"vals":{"Operation":"1（请求）","Ethernet Destination":"ff:ff:ff:ff:ff:ff","Target Protocol Address":"10.10.10.1 → 10.10.10.254 递增"},"say":"逐个 IP 发请求：不走 TCP/UDP，端口策略和握手日志都看不见它。","sub":"被问到的主机即使不回话，网卡也已经把帧收下了。"},{"who":"在线主机","to":"攻击者","pkt":1,"bubble":"应答｜真实 IP 与 MAC","hl":["Operation","Sender Protocol Address","Sender Hardware Address"],"vals":{"Operation":"2（应答）","Sender Protocol Address":"自己的 IP","Sender Hardware Address":"自己的 MAC"},"say":"谁在线谁应答：一次交互就交出 IP、MAC 与网卡厂商。","sub":"MAC 前三字节是 OUI，能认出设备型号。"},{"who":"攻击者","to":"—","pkt":0,"bubble":"汇总：存活清单","hl":["Sender Protocol Address","Sender Hardware Address"],"vals":{"Sender Protocol Address":"存活 IP 列表","Sender Hardware Address":"对应 MAC 列表"},"say":"汇总应答，得到整段存活清单和网关地址。","sub":"比 ping 扫描可靠：很多主机封 ICMP 却不封 ARP。"},{"who":"攻击者","to":"—","pkt":0,"bubble":"按 OUI 挑软柿子","hl":["Hardware Type","Sender Hardware Address"],"vals":{"Hardware Type":"0x0001（以太网）","Sender Hardware Address":"b2:34:55 → OUI 查厂商"},"say":"按网卡厂商认出打印机、摄像头、工控设备这些弱终端。","sub":"这些设备往往没有 DAI 保护，也长期不换 MAC。"},{"who":"攻击者","to":"选定受害者","pkt":1,"bubble":"转入定向欺骗","evil":true,"hl":["Operation","Sender Protocol Address","Target Protocol Address"],"vals":{"Operation":"2（应答）","Sender Protocol Address":"10.10.10.8","Target Protocol Address":"10.10.10.1"},"say":"扫描阶段得到的清单直接变成受害者名单，转入定向欺骗。","sub":"测绘不产生破坏，所以最容易被放过。"}],"cmds":{"linux":[{"c":"sudo arp-scan -I eth0 --localnet","n":"一次扫完整个网段，输出 IP、MAC 与厂商（仅授权环境）","s":"补充（arp-scan 专用于二层测绘，vault 无）"},{"c":"for i in $(seq 1 254); do ping -c1 -W1 10.10.10.$i >/dev/null & done; wait; ip neigh show","n":"没有 arp-scan 时的替代：并发 ping 触发解析，再读邻居表","s":"《系统》Linux.md · ping"},{"c":"ip neigh show | grep -v FAILED","n":"过滤掉解析失败的表项，剩下的就是当前活跃邻居","s":"《系统》Linux.md · ip"}],"ps":[{"c":"Get-NetNeighbor -AddressFamily IPv4 | Where-Object State -ne 'Unreachable'","n":"本机邻居表里的活跃项，等价于一次被动测绘结果","s":"《系统》PowerShell.md · Get-NetNeighbor"}],"cmd":[{"c":"arp -a","n":"扫完后整张表就是清单，IP、MAC、类型一览","s":"《系统》Windows CMD.md · arp"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"交换机按绑定表校验，主机写死表项，广播域被切开","lead":"ARP 没有补丁可打，只能在它外面加一层校验，或把「同广播域」这个前提拆掉。","scenes":[{"name":"绑定表 + 静态项 + 缩小广播域","steps":[{"who":"接入交换机","to":"—","pkt":1,"bubble":"DAI：核 IP-MAC-端口","hl":["Operation","Sender Protocol Address","Sender Hardware Address"],"vals":{"Operation":"2","Sender Protocol Address":"与绑定表不符","Sender Hardware Address":"与端口学习结果不符"},"say":"DAI 按 DHCP Snooping 绑定表核对，伪造应答在交换机上就被丢弃。","sub":"绑定表来自 DHCP，静态配置的主机要手工补。"},{"who":"网关","to":"—","pkt":1,"bubble":"静态表项：不许动态覆盖","hl":["Sender Protocol Address","Sender Hardware Address"],"vals":{"Sender Protocol Address":"10.10.10.1","Sender Hardware Address":"00:11:22:33:44:55（写死）"},"say":"关键设备写静态绑定，动态应答覆盖不了它。","sub":"代价随终端数量线性上升，换网卡即失效。"},{"who":"主机A","to":"网关","pkt":0,"bubble":"端口隔离：只与网关二层互通","hl":["Ethernet Destination","Target Protocol Address"],"vals":{"Ethernet Destination":"只能到上行网关","Target Protocol Address":"10.10.10.8"},"say":"端口隔离或私用 VLAN 破坏「同广播域」前提，终端之间收不到彼此的 ARP。","sub":"同时也切断了终端间合法的共享与发现协议。"},{"who":"监控","to":"—","pkt":1,"bubble":"一对多即告警","hl":["Sender Protocol Address","Sender Hardware Address"],"vals":{"Sender Protocol Address":"同一 IP 出现两个 MAC","Sender Hardware Address":"同一 MAC 对应多个 IP"},"say":"ARPWatch 类工具按「一对一被破坏」告警：一对多就是有人在冒充。","sub":"只能发现不能阻断，基线比规则更重要。"},{"who":"主机A","to":"—","pkt":0,"bubble":"缓存维持原值","hl":["Sender Protocol Address","Sender Hardware Address"],"vals":{"Sender Protocol Address":"10.10.10.8","Sender Hardware Address":"仍是 00:11:22:33:44:55"},"say":"闭环：伪造应答进不了缓存，表里的网关 MAC 始终没变。","sub":"IPv4/以太网体系内只能缓解，根治要换协议。"}],"cmds":{"linux":[{"c":"sudo ip neigh replace 10.10.10.8 lladdr 00:11:22:33:44:55 nud permanent","n":"写静态邻居表项，permanent 不会被任何动态应答覆盖","s":"《系统》Linux.md · ip"},{"c":"ip -s neigh show","n":"带统计的邻居表：观察条目是否被频繁改写","s":"《系统》Linux.md · ip"},{"c":"sudo tcpdump -ni any 'arp and arp[6:2] == 2 and not ether src 00:11:22:33:44:55'","n":"抓「不是网关发的、却声称自己是网关」的应答，即 DAI 的软件版","s":"补充（vault 无 tcpdump）"}],"ps":[{"c":"Get-NetNeighbor | Group-Object LinkLayerAddress | Where-Object Count -gt 1","n":"一个 MAC 对应多个 IP：有人在网关侧冒充一堆主机","s":"《系统》PowerShell.md · Get-NetNeighbor"}],"cmd":[{"c":"arp -a","n":"巡检时核对网关条目；类型从 dynamic 变 permanent 说明绑定生效","s":"《系统》Windows CMD.md · arp"},{"c":"netsh interface ipv4 show neighbors","n":"netsh 视角的邻居表，与 arp -a 互为印证","s":"《系统》Windows CMD.md · netsh"}]}}]}]}},{"proto":{"id":"icmp","name":"ICMP","cn":"网际控制报文协议","en":"Internet Control Message Protocol","layer":"network","chapter":"第三章","extra":false,"oneLine":"IP 的传话人：本意只报告差错，却因为能改变主机的路由与放行策略，成了重定向劫持、隐蔽隧道与放大攻击的工具。","sections":[{"h":"ICMP 是 IP 的辅助协议，却被封在 IP 里当作载荷","p":"IP 只承诺尽力而为：不建连接、不做差错控制、不告知传输质量。要让源主机知道“包为什么没到”，就需要一个反馈机制，这就是 ICMP。它被封装在 IP 数据报里传输，IP 首部的协议字段值为 1；但从“被装进载荷”这个角度看，它又像上层协议。这两个身份并存，正是后面所有滥用的起点。\n\n报文结构非常克制：前 4 个字节固定为类型、代码、校验和，接着的 4 个字节随类型变化（回送请求里是标识与序号、重定向里是网关地址、时间戳里是三个时间值），再往后是数据。校验和覆盖整个 ICMP 报文（首部加数据），与只覆盖首部的 IP 校验和不同——所以任何篡改载荷的隧道实现都必须重算校验和，这也是识别伪造 ICMP 的一个切入点。"},{"h":"三类报文：差错只回源主机，控制报文能改行为，请求应答可被探测","p":"差错报告报文有类型 3 目的不可达、11 超时、12 参数问题，它们的模式是“路由器发现问题、只通知源主机”，不发给中间转发者，也从不纠正差错——重传是 TCP 的事，ICMP 只负责告知。控制报文有类型 4 源抑制（已废弃）与类型 5 重定向，它们的共同点是会改变源主机的行为。请求应答报文是成对的问答：8/0 回送请求与应答、13/14 时间戳、17/18 地址掩码、9/10 路由器通告与请求。\n\n这个分类的安全含义很直接：差错报文是信息泄露（内含原始报文首部，可暴露内部地址结构）；控制报文是策略改写（伪造一条就等于远程改别人的转发表）；请求应答是探测面（ping、时间戳、掩码扫描都靠它）。所以“按类型+代码精细放行”比“全开或全封”更接近正确答案。"},{"h":"重定向的设计假设是“路由器一定比主机更懂拓扑”","p":"当主机把包发给默认网关 R1，而 R1 查表发现同网段还有更近的下一跳 R2 时，它会把包照常转发给 R2，同时回一条 ICMP 重定向（类型 5），在类型相关字段里填上 R2 的地址，告诉主机“下次直接发给它”。代码 0/1/2/3 分别表示基于网络、基于主机、以及带服务类型的对应形式。\n\n这套机制只在“同网段存在两个出口且主机选错了”时才该出现，正常情况下极少触发。它的假设是路由器可信、且它掌握主机不知道的拓扑信息。一旦假设被打破——攻击者与受害者同网段，直接伪造一条源地址为网关的重定向——主机就会把去往某目标的下一跳改成攻击者，流量被劫持。更麻烦的是这条错误路由会长期留在路由表里，不像 ARP 那样几分钟就过期。"},{"h":"PING 跳过传输层，因此任何基于端口的策略对它都无效","p":"ping 直接使用 ICMP 回送请求与回送应答，不经过 TCP 或 UDP，是“应用层直接使用网络层协议”的典型例子。这带来两个后果：一是它不受端口号约束，按端口写的访问控制、按端口做的资产发现都看不到它；二是它的载荷默认没有意义（Windows 填一串字母），于是“把载荷换成真正的数据”就成了最省事的隐蔽通道。\n\n隧道实现的做法是把命令与文件切片塞进 Echo 的 Data 字段，重算校验和，两端各跑一个客户端/服务端，把这条 ICMP 通道当成长连接使用。它的隐蔽性来自三点：报文本身可以携带数据、由内核处理不占任何端口、走的是最常被“为了排障”放行的 Echo/EchoReply。检测因此不能靠类型白名单，只能看大小分布、请求与响应字节数是否对称、目的地址是否固定、时间间隔是否机械。"},{"h":"封禁 ICMP 会让网络失明，放开又会打开三类攻击面","p":"ICMP 不是可有可无的：路径 MTU 发现依赖类型 3 编码 4（需要分片但 DF 置位）把“下一跳 MTU”带回源端，全封 ICMP 会造成 PMTUD 黑洞，表现为大包不通、小包正常、能 ping 通却打不开网页；traceroute 依赖类型 11 超时；UDP 端口扫描靠类型 3 编码 3（端口不可达）判断关闭。\n\n放开的风险同样具体：重定向可被伪造以改路由，Echo 可被用作隧道，Echo 泛洪与定向广播可做放大。正确的做法是按类型与代码放行必要项（例如允许 3/4、3/3、11/0、0/8，禁止 5 与 17/18），在边界做速率限制，并在主机侧关闭“接受重定向”。这是一次典型的“用配置换攻击面”，代价是最小化放行清单需要持续维护。"}],"packets":[{"title":"ICMP 回送请求（类型 8，40 字节）","hex":"08 00 48 89 04 d2 00 01 61 62 63 64 65 66 67 68 69 6a 6b 6c 6d 6e 6f 70 71 72 73 74 75 76 77 61 62 63 64 65 66 67 68 69","note":"ping 的典型形态：外层 IPv4 首部协议字段填 1，ICMP 载荷 32 字节填充；校验和覆盖整个 ICMP 报文。","fields":[{"name":"Type","cn":"类型","off":0,"len":1,"bits":"8 位 = 8","tone":"type","desc":"8 回送请求、0 回送应答、3 目的不可达、5 重定向、11 超时、13/14 时间戳、17/18 地址掩码。","sec":"防火墙过滤的第一依据；只按类型放行会留下“用 Echo 做隧道”的空间，必须连代码与载荷行为一起看。"},{"name":"Code","cn":"代码","off":1,"len":1,"bits":"8 位 = 0","tone":"code","desc":"同一类型下的细分原因，回送请求固定为 0；类型 3 下 0 网络不可达、1 主机不可达、3 端口不可达、4 需分片但 DF 置位。","sec":"编码 3 是 UDP 扫描的判据，编码 4 是 PMTUD 的信令；只放行类型而封掉特定代码，会精确地打断某项功能而不易察觉。"},{"name":"Checksum","cn":"校验和","off":2,"len":2,"bits":"16 位反码求和","tone":"cksum","desc":"覆盖整个 ICMP 报文（首部 + 数据）。本例由构造时计算得出。","sec":"隧道必须重算它，否则被内核直接丢弃；反过来说，看到“校验和正确但载荷是随机字节”的 Echo，就是隧道的典型特征。"},{"name":"Identifier","cn":"标识符","off":4,"len":2,"bits":"16 位","tone":"id","desc":"用来匹配请求与应答，本例 0x04d2 = 1234。ping 每进程分配一个。","sec":"固定标识符可被用来区分隧道的不同会话；也可被用来做“只回应特定标识”的隐蔽触发条件。"},{"name":"Sequence Number","cn":"序号","off":6,"len":2,"bits":"16 位，逐包递增","tone":"seq","desc":"从 0 开始每发一包加 1，本例 1。","sec":"序号机械递增是隧道流量的可测特征；正常 ping 的序号与时间间隔呈线性关系，隧道则常出现跳号与不等间隔。"},{"name":"Data","cn":"数据","off":8,"len":32,"bits":"32 字节（长度可变）","tone":"data","desc":"默认是无意义填充，Linux 常按时间戳填充，Windows 填一串字母。本例为经典字母串。","sec":"这块空间就是隧道的数据通道：把命令与文件切片塞进来，长度足够、位置自由、无人校验内容。"}]},{"title":"目的不可达·需要分片但 DF 置位（类型 3 编码 4）","hex":"03 04 ca 32 00 00 05 dc 45 00 05 dc 77 01 00 00 3f 11 48 f2 0a 00 00 05 ac 10 00 09 13 88 13 89 05 dc 00 00","note":"PMTUD 的信令报文：类型相关字段的低 16 位给出下一跳 MTU 1500，后面引用原始数据报首部与 8 字节数据。","fields":[{"name":"Type","cn":"类型","off":0,"len":1,"bits":"8 位 = 3","tone":"type","desc":"目的不可达，表示数据报无法交付。","sec":"边界设备整类封禁会打断 PMTUD 与 UDP 扫描判据；应按编码放行。"},{"name":"Code","cn":"代码","off":1,"len":1,"bits":"8 位 = 4","tone":"code","desc":"4 表示“需要分片但 DF 置位”，由 RFC 1191 定义为路径 MTU 发现的信令。","sec":"封掉这一编码，发送方永远学不到路径 MTU，大包被静默丢弃，形成“能 ping 通但打不开网页”的经典故障。"},{"name":"Checksum","cn":"校验和","off":2,"len":2,"bits":"16 位","tone":"cksum","desc":"覆盖整个 ICMP 报文与引用的原始报文片段。","sec":"伪造该报文可让发送方把 MTU 调得过小，造成性能骤降甚至连接失败，属于隐蔽的路径攻击。"},{"name":"Unused","cn":"未使用","off":4,"len":2,"bits":"16 位，置 0","tone":"pad","desc":"保留字段，发送置 0。","sec":"非 0 可作为异常判据；也是构造畸形报文时可被填充的空隙。"},{"name":"Next-Hop MTU","cn":"下一跳 MTU","off":6,"len":2,"bits":"16 位，单位字节","tone":"len","desc":"本例 1500。发送方据此把报文尺寸降到不超过该值。","sec":"恶意把它写成极小值（如 68）会让发送方切成大量小片，放大首部开销并拖垮性能，是低成本的路径攻击。"},{"name":"Original IP Header + 8 bytes","cn":"原始数据报首部与 8 字节数据","off":8,"len":28,"bits":"至少 IP 首部 + 8 字节","tone":"data","desc":"把触发差错的原始报文前 28 字节带回源端，用于匹配是哪条流出了问题。","sec":"这段内容会暴露内网地址、端口与协议，是信息收集的免费来源；也常被 IDS 用作关联分析的依据。"}]},{"title":"ICMP 重定向（类型 5 编码 1）","hex":"05 01 1d 60 0a 0a 0a 08 45 00 00 3c 5c 01 40 00 3f 06 1a 9b 0a 0a 0a 01 ac 10 05 05 c9 3b 00 50 00 00 00 01","note":"类型相关字段直接就是“更好的下一跳”地址 10.10.10.8，后面引用原始数据报首部与 8 字节数据。","fields":[{"name":"Type","cn":"类型","off":0,"len":1,"bits":"8 位 = 5","tone":"type","desc":"重定向，路由器用它告诉同网段主机存在更优路由。","sec":"伪造它等于远程改写受害者的路由表；这是 ICMP 从“通知”变成“劫持”的唯一入口。"},{"name":"Code","cn":"代码","off":1,"len":1,"bits":"8 位 = 1","tone":"code","desc":"0 基于网络、1 基于主机、2 基于网络与服务类型、3 基于主机与服务类型。本例 1 表示针对单个主机。","sec":"编码 1 影响范围最小、最不易被察觉；编码 0 可一次性改掉整个网段的路由。"},{"name":"Checksum","cn":"校验和","off":2,"len":2,"bits":"16 位","tone":"cksum","desc":"覆盖整个报文；伪造者只要会算校验和，报文在协议层就完全合法。","sec":"没有任何签名与序列号，接收端无法区分它来自真网关还是同网段的攻击者。"},{"name":"Gateway Internet Address","cn":"网关地址","off":4,"len":4,"bits":"32 位","tone":"gw","desc":"本例 10.10.10.8：告诉主机“下次发往该目标请交给这个地址”。","sec":"这就是攻击载荷：填成攻击者地址即流量劫持，填成不存在的地址即黑洞式拒绝服务。"},{"name":"Original IP Header + 8 bytes","cn":"原始数据报首部与 8 字节","off":8,"len":28,"bits":"至少 28 字节","tone":"data","desc":"指出是哪条流触发了重定向，主机据此只更新对应目的地址的路由。","sec":"只改一条目的地址的路由，比改默认网关更隐蔽，排查时常先怀疑网络设备而不是本机被骗。"}]},{"title":"时间戳请求（类型 13，20 字节）","hex":"0d 00 4a df 04 d2 00 02 0a 1b 2c 3d 0a 1b 2c 50 0a 1b 2c 6e","note":"三个 32 位时间值单位为毫秒（自世界时午夜起算），应答类型为 14，其余字段原样回填。","fields":[{"name":"Type","cn":"类型","off":0,"len":1,"bits":"8 位 = 13","tone":"type","desc":"13 请求、14 应答。用于测量往返时延与两端时钟差。","sec":"很多网络放行 ping 却忘了封 13/14，于是它成了无需端口的探测与时钟侦察手段。"},{"name":"Code","cn":"代码","off":1,"len":1,"bits":"8 位 = 0","tone":"code","desc":"时间戳报文代码固定为 0。","sec":"无细分能力，过滤只能按类型整体处理。"},{"name":"Checksum","cn":"校验和","off":2,"len":2,"bits":"16 位","tone":"cksum","desc":"覆盖整个 20 字节报文。","sec":"改任何时间值都必须重算，否则被丢弃。"},{"name":"Identifier","cn":"标识符","off":4,"len":2,"bits":"16 位","tone":"id","desc":"与序号配合匹配请求与应答，本例 0x04d2。","sec":"可被用来关联同一工具的多次探测，形成侦察画像。"},{"name":"Sequence Number","cn":"序号","off":6,"len":2,"bits":"16 位","tone":"seq","desc":"本例 2，逐包递增。","sec":"递增规律使批量探测容易被流量基线识别。"},{"name":"Originate Timestamp","cn":"发起时间戳","off":8,"len":4,"bits":"32 位，毫秒","tone":"data","desc":"发送方填写的本地时间，本例 0x0a1b2c3d。","sec":"暴露主机时钟；时钟偏差可被用于 Kerberos 票据、TLS 证书有效期等与时间相关的攻击面判断。"},{"name":"Receive Timestamp","cn":"接收时间戳","off":12,"len":4,"bits":"32 位，毫秒","tone":"data","desc":"接收方收到请求的时间，本例 0x0a1b2c50。","sec":"与发起时间相减可得单程时延，用于推断链路性质与地理位置。"},{"name":"Transmit Timestamp","cn":"发送时间戳","off":16,"len":4,"bits":"32 位，毫秒","tone":"data","desc":"接收方回送应答的时间，本例 0x0a1b2c6e。","sec":"三个时间值联立可估算两端时钟差，是隐蔽的资产指纹来源。"}]}],"attacks":[{"name":"ICMP Redirect Attack","cn":"ICMP 重定向改路由","impact":"受害主机把去往指定目标的下一跳改为攻击者，流量可被监听、篡改或黑洞。","steps":[{"who":"攻击者","to":"—","label":"侦查：确定受害者默认网关 10.10.10.8 与同网段位置","note":"同网段即可直发，无需路由可达，也不需要攻破任何设备。"},{"who":"攻击者","to":"受害者主机","label":"ICMP 类型=5 代码=1，源 IP=10.10.10.8（伪造成网关），网关地址字段=攻击者 10.10.10.66","note":"报文字段完全合法，校验和正确，协议层无异常。"},{"who":"受害者主机","to":"—","label":"接受重定向，路由表新增 目标→10.10.10.66","note":"默认信任“看起来来自网关”的改道建议，且该条目长期有效。"},{"who":"受害者主机","to":"攻击者","label":"后续发往该目标的报文全部改道","note":"攻击者可监听、篡改，或干脆不转发，形成对单一目标的精确断网。"},{"who":"攻击者","to":"受害者主机","label":"周期性重发重定向维持条目","note":"即使条目被路由更新覆盖，也会被重新写回，隐蔽性极强。"}],"defense":"主机侧关闭“接受 ICMP 重定向”，网关侧丢弃非网关设备发出的重定向并限制本机发送。"},{"name":"ICMP Tunnel","cn":"ICMP 隐蔽隧道","impact":"在只放行 ping 的网络里建立双向数据通道，绕过防火墙与端口级审计。","steps":[{"who":"攻击者","to":"边界防火墙","label":"ICMP Echo 类型=8 代码=0，标识符固定 0x04d2，载荷前 4 字节为会话号、其后为分片数据","note":"报文类型是最常被“为排障”放行的 Echo，直接通过。"},{"who":"边界防火墙","to":"内网跳板","label":"按类型放行，未检查载荷内容","note":"没有端口可查，端口策略与主机监听检查都抓不到这条通道。"},{"who":"内网跳板","to":"—","label":"内核把 ICMP 交给隧道服务端，服务端剥离载荷重组命令","note":"通道由内核处理，不占用任何监听端口。"},{"who":"内网跳板","to":"攻击者","label":"Echo Reply 类型=0，载荷为命令输出（常做 Base64 与压缩）","note":"响应字节数明显大于请求，形成上下行不对称。"},{"who":"攻击者","to":"内网跳板","label":"持续收发，把隧道当长连接使用，传输文件或横向移动","note":"流量特征只有大小分布、频率与固定目的地址，需行为检测才能识别。"}],"defense":"按类型+代码最小放行，并对 ICMP 载荷大小、熵、请求响应对称性与频率做行为检测；关键区段直接禁止 ICMP 出网。"},{"name":"Smurf Attack","cn":"Smurf 放大攻击","impact":"一份伪造源地址的请求换来整个网段的应答，受害者带宽被数十倍流量淹没。","steps":[{"who":"攻击者","to":"放大网络边界路由器","label":"ICMP Echo 类型=8，目的=定向广播 192.168.5.255，源=受害者地址","note":"只发一份报文，源地址被伪造成受害者。"},{"who":"边界路由器","to":"网段内所有主机","label":"把广播 Echo 复制成数百份二层广播","note":"若未关闭定向广播转发（no ip directed-broadcast），这一跳就是放大器。"},{"who":"网段内主机","to":"受害者","label":"每台主机各回一条 Echo Reply，目的=受害者","note":"放大倍数约等于网段内存活主机数。"},{"who":"受害者","to":"—","label":"链路带宽与中断处理被占满，合法业务不可用","note":"攻击者只用极小上行带宽，且真实地址从未出现。"},{"who":"攻击者","to":"多个放大网络","label":"轮换使用不同放大网段并发起","note":"多源汇聚，按单一来源限速完全无效。"}],"defense":"边界路由器关闭定向广播转发，接入侧做入口过滤丢弃源地址不属于本网段的报文。"},{"name":"Ping of Death","cn":"死亡之 ping（ICMP 超长回送请求）","impact":"重组后超过 65535 字节的 Echo 请求撑爆固定缓冲区，目标崩溃或重启。","steps":[{"who":"攻击者","to":"受害者主机","label":"ICMP Echo 类型=8，Data 字段构造成 65536 字节以上","note":"单凭数据长度就突破了 16 位总长度字段能表达的上限。"},{"who":"中间路由器","to":"受害者主机","label":"按 MTU 切成数十片，每片总长 ≤1500、字段全合法","note":"过滤设备逐片检查，看不到任何异常。"},{"who":"受害者主机","to":"—","label":"按标识与偏移重组，得到 65536+ 字节的 ICMP 报文","note":"协议没有对“重组后总长”设硬上限。"},{"who":"受害者主机","to":"—","label":"拷贝进按 65535 字节分配的缓冲区","note":"栈或堆被覆盖，返回地址与相邻数据被破坏。"},{"who":"受害者主机","to":"—","label":"崩溃、挂起或重启，服务中断","note":"单包即可拒绝服务，属于典型的剧毒包；现代协议栈多已修复，但构造手法仍被复用于其他协议。"}],"defense":"协议栈对重组总长设硬性上限并拒绝超长 ICMP；边界设备丢弃异常大包与可疑分片。"}],"defenses":[{"name":"主机侧关闭接受重定向","how":"在主机上禁止 ICMP 重定向处理（如 Linux 的 accept_redirects=0、Windows 的 Dead Gateway Detection 与路由项保护），并监控路由表是否出现异常下一跳。","limit":"正常网络里重定向出现概率很低，关掉几乎无业务代价；但在双出口且主机选错网关的拓扑中会失去自动优化，容器与部分嵌入式系统也不提供细粒度开关。"},{"name":"ICMP 类型/代码白名单 + 速率限制","how":"边界只放行必要组合（如 0/8 回送、3/3 与 3/4 差错、11/0 超时），禁止 5 重定向与 17/18 掩码类，并对每源 ICMP 速率设上限。","limit":"隧道正是走被放行的 Echo/EchoReply，白名单拦不住；限速对分布式来源无效，且过度限制会打断 PMTUD 与排障，形成“能 ping 通但打不开网页”的黑洞。"},{"name":"关闭定向广播 + 入口过滤","how":"在路由器上关闭定向广播转发（no ip directed-broadcast），并在接入侧丢弃源地址不属于本网段的报文，从两头切断 Smurf 的放大链。","limit":"需要边界与接入两侧同时配置，任一环节缺失放大链就成立；历史配置遗留与多运营商环境难以统一，只能降低而非消除放大能力。"},{"name":"载荷行为检测（大小/熵/对称性/频率）","how":"对 ICMP 载荷做统计：长度分布是否集中在固定档位、内容熵是否接近随机、请求与响应字节数是否明显不对称、目的地址是否长期单一、发送间隔是否机械。","limit":"加密或压缩后的隧道载荷近似随机，与正常大包 ping 难以区分；需要长期干净基线，误报会打断正常运维，且对低速低频隧道几乎无效。"}],"calcs":["checksum"],"quiz":[{"q":"ICMP 校验和与 IP 首部检验和的覆盖范围有何不同？","options":["ICMP 覆盖整个 ICMP 报文，IP 只覆盖首部","两者都覆盖首部与数据","IP 覆盖整个数据报，ICMP 只覆盖首部","两者都只覆盖首部"],"a":0,"why":"ICMP 校验和覆盖类型、代码、校验和与全部数据；IP 首部检验和只覆盖 20~60 字节首部，载荷完全不校验。这就是隧道实现必须重算 ICMP 校验和的原因。"},{"q":"为什么“只放行 ping”的防火墙挡不住 ICMP 隧道？","options":["因为隧道使用端口 53","因为隧道就藏在被放行的 Echo/EchoReply 载荷里","因为 ICMP 不经过防火墙","因为隧道会加密报文头"],"a":1,"why":"隧道不改类型，只把 Data 字段换成命令与文件数据并重算校验和。类型白名单必然放行它，只能靠大小分布、熵、请求响应对称性等行为特征识别。"},{"q":"把 ICMP 整类封禁最直接的副作用是什么？","options":["SSH 无法登录","DNS 解析全部失败","PMTUD 黑洞导致大包不通、小包正常","交换机无法学习 MAC"],"a":2,"why":"PMTUD 依赖类型 3 编码 4 把下一跳 MTU 带回源端。全封后发送方学不到路径 MTU，大包被静默丢弃，典型表现是能 ping 通、小页面能开、大页面打不开。"}]},"script":{"id":"icmp","notes":{"Next-Hop MTU":{"short":"这跳能过的最大字节数","more":"16 位，出现在类型 3 编码 4（需要分片但 DF 置位）里，告诉源端下一跳链路的 MTU 是多少，源端据此调小报文尺寸。这是 PMTUD 的唯一信令。","sec":"全量封禁 ICMP 会让这条信令回不去，形成「能 ping 通、大包不通」的黑洞。"},"Gateway Internet Address":{"short":"「更好的下一跳」地址","more":"32 位，重定向报文用它告诉主机：去往某个目的时，直接交给这个网关更近。代码 0/1/2/3 分别对应网络、主机、服务类型三种粒度。","sec":"伪造这一字段，就等于远程改写别人的路由表。"},"Original IP Header + 8 bytes":{"short":"引用原始报文，可被伪造","more":"差错报文必须带回触发它的原始 IP 首部与前 8 字节，让源端知道是哪条流出错。至少 28 字节，重定向里也用它证明「我引用的是你的包」。","sec":"这段引用内容无人核对，攻击者可以凭空编造一个不存在的原始报文。"},"Originate Timestamp":{"short":"毫秒时间戳，泄漏运行时长","more":"32 位，自世界时午夜起的毫秒数。时间戳请求/应答（13/14）里还有接收与发送时间戳，据此可推测对端的时钟、时区与开机时长。","sec":"老设备仍会应答，等于免费交出一条时间侧信道。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"四字节头加一段数据：报错、改道、探测，全靠类型与代码区分","lead":"ICMP 是 IP 的传话人，自己也被封在 IP 里。看四类报文：成对的问答、只回源端的差错、会改行为的重定向。","scenes":[{"name":"回送 → 差错 → 重定向 → 时间戳","steps":[{"who":"主机A","to":"目的服务器","pkt":0,"bubble":"Echo Request 类型 8","hl":["Type","Code","Identifier","Sequence Number","Checksum"],"vals":{"Type":"8（回送请求）","Code":"0","Identifier":"0x04d2","Sequence Number":"1","Checksum":"覆盖整个 ICMP 报文"},"say":"ping 直接坐在 IP 上，不经过 TCP/UDP——任何端口策略都对它无效。","sub":"外层 IP 首部的协议字段填 1，表示载荷是 ICMP。"},{"who":"目的服务器","to":"主机A","pkt":0,"bubble":"Echo Reply 类型 0","hl":["Type","Checksum","Data"],"vals":{"Type":"0（回送应答）","Checksum":"重算","Data":"32 字节载荷原样回填"},"say":"应答把标识、序号和载荷原样回填，只把类型改成 0。","sub":"载荷本无意义（默认填字母），这正是隧道能塞数据的地方。"},{"who":"网关R1","to":"主机A","pkt":1,"bubble":"类型 3 编码 4：需要分片","hl":["Type","Code","Next-Hop MTU","Original IP Header + 8 bytes"],"vals":{"Type":"3（目的不可达）","Code":"4（需分片但 DF 置位）","Next-Hop MTU":"1500","Original IP Header + 8 bytes":"引用了那个大包"},"say":"装不下又不许分片，路由器只能丢掉并回一条差错，顺带报出这跳 MTU。","sub":"差错只回源主机，从不发给中间转发者。"},{"who":"网关R1","to":"主机A","pkt":2,"bubble":"类型 5：改走 10.10.10.8","hl":["Type","Code","Gateway Internet Address"],"vals":{"Type":"5（重定向）","Code":"1（基于主机）","Gateway Internet Address":"10.10.10.8"},"say":"同网段有更近的出口时，网关建议改道——正常网络里极少触发。","sub":"它假设路由器一定比主机更懂拓扑，且一定可信。"},{"who":"主机A","to":"目的服务器","pkt":3,"bubble":"时间戳请求 类型 13","hl":["Type","Originate Timestamp","Receive Timestamp","Transmit Timestamp"],"vals":{"Type":"13（时间戳请求）","Originate Timestamp":"0x0a1b2c3d","Receive Timestamp":"0x0a1b2c50","Transmit Timestamp":"0x0a1b2c6e"},"say":"时间戳请求不用端口、不用握手，顺手交出一条时间侧信道。","sub":"三个毫秒时间戳能推出对端时钟与处理时延。"}],"cmds":{"linux":[{"c":"ping -c 4 -s 32 8.8.8.8","n":"标准 ping：看丢包率与 RTT；-s 指定载荷，载荷改了校验和也得跟着重算","s":"《系统》Linux.md · ping"},{"c":"ping -M do -s 2000 8.8.8.8","n":"置 DF 打 2000 字节，应回「Frag needed and DF set」，附下一跳 MTU","s":"《系统》Linux.md · ping"},{"c":"traceroute -n -I 8.8.8.8","n":"-I 用 ICMP Echo 探测，每跳靠「超时」差错报文回话","s":"补充（vault 无 traceroute，看差错报文实际形状）"}],"ps":[{"c":"Test-NetConnection 8.8.8.8 -InformationLevel Detailed","n":"Windows 侧看 ping 是否通、RTT 与源地址，等价于一次 ICMP 探测","s":"《系统》PowerShell.md · Test-NetConnection"}],"cmd":[{"c":"ping -n 4 8.8.8.8","n":"-n 指定次数；TTL 值能反推对端系统与经过的跳数","s":"《系统》Windows CMD.md · ping"},{"c":"tracert -d 8.8.8.8","n":"逐跳靠 ICMP 超时报错，看差错报文从哪一跳开始缺席","s":"《系统》Windows CMD.md · tracert"}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"一条报文能改路由，一段载荷能开隧道，一个广播能放大几十倍","lead":"两幕各有侧重：重定向改写主机行为，隧道与放大把 ICMP 当搬运工和放大器。共同点是都没有认证。","scenes":[{"name":"重定向改路由：一条报文换一条路由","steps":[{"who":"攻击者","to":"受害者主机","pkt":2,"bubble":"类型 5｜更好的下一跳 = 攻击者","evil":true,"hl":["Type","Code","Gateway Internet Address","Original IP Header + 8 bytes"],"vals":{"Type":"5（重定向）","Code":"1（基于主机）","Gateway Internet Address":"10.10.10.66（攻击者）","Original IP Header + 8 bytes":"伪造成受害者的原始报文"},"say":"伪造一条重定向，源地址写成网关，字段与校验和全都合法。","sub":"同网段即可直发，不需要攻破任何设备。"},{"who":"受害者主机","to":"—","pkt":2,"bubble":"接受改道，写进路由表","hl":["Gateway Internet Address","Original IP Header + 8 bytes"],"vals":{"Gateway Internet Address":"10.10.10.66","Original IP Header + 8 bytes":"目的 172.16.5.5"},"say":"主机接受建议：去 172.16.5.5 的下一跳改成攻击者，且长期有效。","sub":"不像 ARP 那样几分钟过期，路由项会一直留着。"},{"who":"受害者主机","to":"攻击者","pkt":0,"bubble":"后续报文全部改道","hl":["Type","Identifier","Sequence Number"],"vals":{"Type":"8（回送请求）","Identifier":"0x04d2","Sequence Number":"递增"},"say":"之后发往该目标的报文全都绕到攻击者：监听、篡改、丢弃随它。","sub":"只改一个目的，其他业务正常，最难被发现。"},{"who":"攻击者","to":"受害者主机","pkt":2,"bubble":"每 60 秒重发维持","evil":true,"hl":["Type","Code"],"vals":{"Type":"5（重定向）","Code":"1"},"say":"周期重发维持条目：被路由更新覆盖了也会被重新写回。","sub":"主机路由表里那条是「自己学来的」，排查先怀疑网络。"},{"who":"受害者主机","to":"—","pkt":2,"bubble":"无从核对引用内容","hl":["Original IP Header + 8 bytes","Gateway Internet Address"],"vals":{"Original IP Header + 8 bytes":"可以凭空编造","Gateway Internet Address":"10.10.10.66"},"say":"连「引用的原始报文」都能伪造，主机无从确认自己是否真发过那个包。","sub":"报文层面没有任何畸形字段可查。"}],"cmds":{"linux":[{"c":"sudo tcpdump -ni any 'icmp[icmptype] == 5'","n":"只抓重定向：正常网络里应该一条都没有，出现即异常","s":"补充（vault 无 tcpdump，重定向取证必备）"},{"c":"sysctl net.ipv4.conf.all.accept_redirects net.ipv4.conf.eth0.accept_redirects","n":"1 表示愿意接受改道建议；改 0 是主机侧最省事的防护","s":"补充（vault 无 accept_redirects 小节）"},{"c":"ip route get 172.16.5.5","n":"看这个目的实际走哪个下一跳，被劫持时这里会是攻击者地址","s":"《系统》Linux.md · ip"}],"ps":[{"c":"Get-NetRoute -DestinationPrefix 0.0.0.0/0 | Select-Object NextHop,RouteMetric","n":"默认路由的下一跳；出现陌生下一跳说明路由被改过","s":"《系统》PowerShell.md · 网络管理 Cmdlet"}],"cmd":[{"c":"netsh int ipv4 show route","n":"整张 IPv4 路由表，重点看目标前缀后面那列网关地址","s":"《系统》Windows CMD.md · netsh"}]}},{"name":"隐蔽隧道与 Smurf 放大：把它当搬运工","steps":[{"who":"攻击者","to":"边界防火墙","pkt":0,"bubble":"Echo 类型 8｜载荷换成数据","evil":true,"hl":["Type","Identifier","Data"],"vals":{"Type":"8（回送请求）","Identifier":"0x04d2（会话号）","Data":"命令分片，重算校验和"},"say":"把载荷换成数据，类型仍是最常见的回送请求——排障放行的口子成了通道。","sub":"标识符被复用成会话号，一台主机可开多条通道。"},{"who":"边界防火墙","to":"内网跳板","pkt":0,"bubble":"按类型放行，不看载荷","hl":["Type","Code"],"vals":{"Type":"8 / 0 放行","Code":"0"},"say":"没有端口可查：端口策略与主机监听检查都抓不到这条通道。","sub":"载荷内容不在任何规则里，只能靠行为检测。"},{"who":"内网跳板","to":"攻击者","pkt":0,"bubble":"Echo Reply｜回传命令输出","hl":["Type","Data"],"vals":{"Type":"0（回送应答）","Data":"Base64 后的命令输出"},"say":"应答字节数明显大于请求，形成上下行不对称——行为特征的起点。","sub":"内核直接处理，不占任何监听端口。"},{"who":"攻击者","to":"放大网段","pkt":0,"bubble":"源=受害者，目的=定向广播","evil":true,"hl":["Type","Data","Identifier"],"vals":{"Type":"8（回送请求）","Data":"目的 192.168.5.255 定向广播","Identifier":"源地址=受害者"},"say":"换一种用法：源地址写成受害者，目的写成整个网段的广播地址。","sub":"只要边界还转发定向广播，这一跳就是放大器。"},{"who":"网段内主机","to":"受害者","pkt":0,"bubble":"Echo Reply ×N → 受害者","hl":["Type","Code"],"vals":{"Type":"0（回送应答）","Code":"目的=受害者地址"},"say":"每台主机各回一条应答，一份请求换来几十倍流量砸在受害者身上。","sub":"放大倍数约等于网段内存活主机数。"}],"cmds":{"linux":[{"c":"sudo tcpdump -ni any 'icmp and greater 100'","n":"抓大于 100 字节的 ICMP：隧道载荷普遍比正常 ping 大且长度固定","s":"补充（vault 无 tcpdump，隧道取证必备）"},{"c":"ping -c 3 -s 1200 8.8.8.8","n":"自己发个大包 ping 作对照，比较载荷分布与响应字节数","s":"《系统》Linux.md · ping"},{"c":"sudo tcpdump -ni any 'icmp[icmptype] == 8 and dst net 192.168.5.0/24'","n":"抓发往某网段的 Echo 请求，源地址不在本网段即为 Smurf 素材","s":"补充（vault 无 tcpdump）"}],"ps":[{"c":"Test-NetConnection 8.8.8.8 -InformationLevel Detailed","n":"本机能否发 ICMP 出去：能通了才谈得上隧道","s":"《系统》PowerShell.md · Test-NetConnection"}],"cmd":[{"c":"netsh int ipv4 show global","n":"看本机 IPv4 全局参数（转发、路由行为），判断是否在替别人放大","s":"《系统》Windows CMD.md · netsh"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"主机不轻信、网关不乱发、网络不放任，三条线分别掐断一招","lead":"口诀只有三句，落点很清楚：改行为的报文别信，被放行的类型要看载荷，放大器要关掉。","scenes":[{"name":"不轻信 / 不乱发 / 不放任","steps":[{"who":"受害者主机","to":"—","pkt":2,"bubble":"accept_redirects=0","hl":["Type","Code","Gateway Internet Address"],"vals":{"Type":"5 → 丢弃","Code":"1","Gateway Internet Address":"10.10.10.66"},"say":"主机侧不轻信：重定向报文根本不进路由表，改道建议一律无效。","sub":"正常网络里重定向极少出现，关掉几乎零代价。"},{"who":"网关R1","to":"—","pkt":2,"bubble":"非网关发出的重定向 → 丢弃","hl":["Type","Code","Gateway Internet Address"],"vals":{"Type":"5","Code":"1","Gateway Internet Address":"不是本机地址"},"say":"网关侧不乱发：只允许网关自己发重定向，其他来源一律丢。","sub":"同时检查路由表是否出现异常下一跳。"},{"who":"边界防火墙","to":"—","pkt":0,"bubble":"类型白名单 + 载荷行为检测","hl":["Type","Code","Data"],"vals":{"Type":"只留 0/8、3/3、3/4、11/0","Code":"其余丢弃","Data":"长度 / 熵 / 请求响应对称性"},"say":"白名单只留必要组合；隧道走的正是被放行的 0/8，得靠载荷行为抓。","sub":"大小集中、熵偏高、响应明显大于请求，三条同时成立。"},{"who":"边界路由器","to":"—","pkt":0,"bubble":"关闭定向广播转发","hl":["Type","Data"],"vals":{"Type":"8 → 定向广播被拒","Data":"no ip directed-broadcast"},"say":"关掉定向广播转发，Smurf 的放大器那一跳直接被拆掉。","sub":"没有放大器，伪造源地址也只能一对一。"},{"who":"接入路由器","to":"—","pkt":0,"bubble":"入口过滤：源不在本网段即丢","hl":["Type","Identifier"],"vals":{"Type":"8","Identifier":"源地址属于本网段才放行"},"say":"入口过滤让伪造源地址发不出去，放大链两头同时断。","sub":"边界与接入要一起配，缺一环放大链就成立。"}],"cmds":{"linux":[{"c":"sudo sysctl -w net.ipv4.conf.all.accept_redirects=0","n":"立刻关闭重定向接收，改完可用 ip route get 复查下一跳","s":"补充（vault 无 accept_redirects 小节）"},{"c":"sudo iptables -A INPUT -p icmp --icmp-type redirect -j DROP","n":"在主机防火墙上直接丢掉类型 5，作为 sysctl 之外的第二道","s":"补充（iptables 规则，vault 无）"},{"c":"sudo tcpdump -ni any 'icmp[icmptype] == 5 or (icmp and greater 100)'","n":"同时盯重定向与大载荷 ICMP，两条防线一次验证","s":"补充（vault 无 tcpdump）"}],"ps":[{"c":"Get-NetFirewallRule -DisplayName '*ICMP*' | Select-Object DisplayName,Enabled","n":"列出与 ICMP 相关的防火墙规则，确认没有把类型 5 放进来","s":"《系统》PowerShell.md · 网络管理 Cmdlet"}],"cmd":[{"c":"netsh advfirewall firewall show rule name=all | findstr /i icmp","n":"看哪些 ICMP 规则生效；规则越少，可被利用的类型越少","s":"《系统》Windows CMD.md · netsh"},{"c":"route print -4","n":"核对路由表有没有多出来的主机路由（重定向留下的痕迹）","s":"《系统》Windows CMD.md · 网络命令"}]}}]}]}},{"proto":{"id":"ipsec","name":"IPSec","cn":"IP 安全协议族","en":"Internet Protocol Security","layer":"network","chapter":"第三章","extra":false,"oneLine":"在 IP 层用 AH/ESP 补上认证与加密、用 IKE 自动协商密钥：让无连接的网络层在两端之间临时变成有合同约束的通道。","sections":[{"h":"在 IP 层做安全，一次部署就能保护所有上层协议","p":"TCP/IP 最初没有考虑安全，业务数据在公网上被伪造、篡改、窃取的通道一直存在。IPSec 的思路不是给每个应用打补丁，而是在 IP 层统一加一层：上层无论是 TCP、UDP 还是 ICMP，都被同一条安全通道保护，应用不需要改一行代码。这是它与 TLS 最本质的差别——TLS 要改应用，IPSec 只改网络配置。\n\n它由三个协议组成：AH 提供数据源认证与完整性（不加密），ESP 提供加密并可选认证，IKE 负责协商密钥与参数。IPSec 本身不规定用什么算法，算法与密钥长度全部由安全关联（SA）协商决定，这也是它三十年不过时的原因：1998 年的框架可以跑今天的 AES-GCM 或国密算法，换算法不动框架。"},{"h":"AH 只认证不加密，认证范围覆盖 IP 首部，因此与 NAT 天然冲突","p":"AH 首部 12 字节固定字段加可变长 ICV：下一个首部、有效载荷长度（以 32 位字为单位、表示总长减 2）、保留、32 位 SPI、32 位序列号。它把“除传输中会变的字段（如 TTL、首部检验和）之外的整个 IP 包”都纳入摘要计算——包括源地址与目的地址。这带来两个直接后果：任何对载荷或源地址的篡改都会被发现，这是 IPSec 能“从机制上防止 IP 地址欺骗”的来源；而 NAT 一改写地址或端口，ICV 必然失配，整包被丢弃，所以 AH 穿不过 NAT。\n\nICV 的长度由算法决定，必须是 32 位整数倍（常见 96 位或 128 位截断）。序列号用于抗重放，32 位耗尽前必须换密钥，否则要用扩展序列号（ESN）。"},{"h":"ESP 把整个载荷加密，认证只覆盖 ESP 头之后的部分","p":"ESP 的结构是“明文头 + 密文 + 明文尾”：明文部分是 32 位 SPI 与 32 位序列号，接收端靠 SPI 找到 SA、靠序列号判重放；密文部分是载荷数据，传输模式下装传输层报文，隧道模式下装整个原始 IP 数据报；尾部是填充、填充长度与下一个首部，填充用于把明文凑成加密算法要求的块长，同时隐藏真实长度。最后的 ICV 覆盖 SPI 到下一个首部的全部内容，但不包含外层新 IP 首部。\n\n这个覆盖范围的差别决定了工程选择：ESP 不保护外层地址，所以能穿 NAT（地址被改写不影响 ICV）；代价是外层首部可被篡改做流量分析或重定向。现实中几乎只用 ESP，AH 更多出现在教材与合规条款里。"},{"h":"两种模式的分野是“保护对象”，也是“谁来承担部署成本”","p":"传输模式保留原 IP 首部，只在其后插入 IPSec 首部、只保护传输层报文：加的开销小，中间设备仍能看到源和目的地址，可继续做 QoS；但每台主机都要装 IPSec 实现，端用户得不到透明服务，且源/目的地址明文暴露，抗不住流量分析。隧道模式把整个原始数据报加密，外面套一个新的 IP 首部：子网内主机无需改造即获透明保护，可用私有地址，真实地址被隐藏，抗流量分析；代价是网关负载上升，且网关在边界，管不到内网横向流量。\n\n无论哪种模式，外层 IP 首部都不加密——否则沿途路由器无法转发。隧道模式下外层协议字段为 50（ESP）或 51（AH），接收端据此决定把载荷交给谁处理，这也是 ESP 报文能被正确分流处理的唯一依据。"},{"h":"SA 是单向合同，SPD 决定要不要保护，SAD 存怎么保护","p":"安全关联 SA 是被保护流量的“合同”：一条 SA 单向有效，双向通信要两条；用三元组唯一标识——SPI、IP 目的地址、安全协议标识符（AH 或 ESP）。SA 里存着加密算法与密钥、完整性算法与密钥、抗重放窗口、序列号计数器、模式（传输/隧道）与生存期。SPI 由接收方生成并写进报文，接收端据此在 SAD 中定位该用哪份合同。\n\n策略与参数是分开的：SPD 决定“这条流要不要保护”，三种结果是丢弃、绕过、应用；SAD 存“已协商好的参数”。处理一个包时先查 SPD，需要保护再查 SAD，没有匹配的 SA 就触发 IKE 协商。IKEv2 用 IKE_SA_INIT 交换 DH 参数与随机数、用 IKE_AUTH 完成身份认证，再派生出加密与认证密钥——正是这套自动化让 N 个站点之间 N(N−1)/2 条 SA 的规模问题变得可运维。"}],"packets":[{"title":"AH 首部（传输模式，24 字节含 12 字节 ICV）","hex":"45 00 00 40 5a 01 40 00 40 33 c9 84 0a 01 01 01 0a 02 02 02 06 04 00 00 2f 4a 8b 01 00 00 00 01 d4 ab e3 1e e8 a8 2a 81 9f 4e aa aa 01 bb c9 3b 11 22 33 44 55 66 77 88 50 10 fa f0 c1 92 00 00","note":"外层 IPv4 协议字段=51；AH 之后是完整 TCP 首部。ICV 为示例字节，真实值由 SA 协商的算法与密钥计算并截断。","fields":[{"name":"Outer IPv4 Header","cn":"外层 IPv4 首部","off":0,"len":20,"bits":"20 字节，协议字段=51","tone":"addr","desc":"本例 10.1.1.1 → 10.2.2.2，协议字段 51 表示 AH。标识、TTL、校验和等固定字段全为明文，路由器据此正常转发。","sec":"AH 的 ICV 覆盖这个首部中不会变化的字段（含源与目的地址），所以任何地址改写都会导致校验失败——这是它防地址欺骗的机制，也是它穿不过 NAT 的原因。"},{"name":"Next Header","cn":"下一个首部","off":20,"len":1,"bits":"8 位 = 6","tone":"proto","desc":"指出 AH 之后是什么：6 TCP、17 UDP、50 ESP、4 IPv4、41 IPv6。本例 6。","sec":"该值填错会让接收端把载荷交给错误的上层解析器；在 IPv6 中它还承担扩展首部链的衔接作用。"},{"name":"Payload Length","cn":"有效载荷长度","off":21,"len":1,"bits":"8 位，单位 32 位字，值 = 总长/4 − 2","tone":"len","desc":"本例 AH 共 24 字节 = 6 个 32 位字，故填 4。注意 IPv6 中 AH 的长度仍按 32 位字计，与其他扩展首部的 8 字节单位不同。","sec":"长度字段与实际不符是畸形包构造点：解析器按错误长度找 ICV，就会把载荷当成认证数据或反之，造成越界读。"},{"name":"Reserved","cn":"保留","off":22,"len":2,"bits":"16 位，必须置 0","tone":"pad","desc":"发送方必须置 0，接收方忽略其值，但它参与 ICV 计算。","sec":"非 0 可作为异常判据；由于参与 ICV，改动它同样会导致校验失败，不能用作隐蔽信道。"},{"name":"SPI","cn":"安全参数索引","off":24,"len":4,"bits":"32 位","tone":"spi","desc":"本例 0x2f4a8b01。接收端用 SPI + 目的地址 + 协议号在 SAD 中定位 SA，凭它找到该用哪套算法与密钥。","sec":"SPI 明文可见：可被用来枚举目标存在哪些 SA，甚至试探某条 SA 是否仍有效，属于低成本侦察信息。"},{"name":"Sequence Number","cn":"序列号","off":28,"len":4,"bits":"32 位，单调递增，从 1 开始","tone":"seq","desc":"同一 SA 内每包加 1，接收端用抗重放窗口判断是否已见过。本例 1。","sec":"这是抗重放的唯一手段：重放整包会因序号落在窗口之外被丢弃。32 位耗尽前必须换密钥，否则序号回绕会让重放重新可行。"},{"name":"ICV","cn":"完整性校验值","off":32,"len":12,"bits":"可变长，算法决定，须为 32 位整数倍","tone":"icv","desc":"本例取 12 字节（96 位截断，常见于 HMAC-SHA-1-96），覆盖范围含 IP 首部可变字段之外的整包。示例字节仅用于展示长度。","sec":"覆盖源地址是它“防地址欺骗”的机制来源；也正因为覆盖地址，任何 NAT 改写都会让它失配，AH 因此无法穿 NAT。"},{"name":"TCP Header (after AH)","cn":"AH 之后的 TCP 首部","off":44,"len":20,"bits":"20 字节","tone":"port","desc":"说明 AH 只插在 IP 与传输层之间，传输层报文本身未被加密，端口与标志全部明文可读。","sec":"AH 不提供机密性：源/目的地址、端口、TCP 标志、应用数据全部可被旁路嗅探，只保证“不能被改而不被发现”。"}]},{"title":"ESP 报文（隧道模式，88 字节，含 16 字节块对齐填充）","hex":"45 00 00 58 5a 02 40 00 40 32 c9 6c 0a 01 01 01 0a 02 02 02 2f 4a 8b 02 00 00 00 01 fc c7 c7 e3 02 30 61 17 16 5a 57 bc cf aa be 41 c7 76 45 ea 4a 48 f8 ae 5a ef c5 97 b0 55 9c 9c 15 63 0e 54 ee d3 6c 9f 01 02 03 04 05 06 06 04 a7 34 56 3c 57 9a 5d 09 3f e1 ef 03","note":"外层协议字段=50；内层是完整的原始 IPv4 数据报（40 字节）被加密，填充 6 字节使 40+6+2 为 AES 块长 16 的整数倍。","fields":[{"name":"Outer IPv4 Header","cn":"外层 IPv4 首部","off":0,"len":20,"bits":"20 字节，协议字段=50","tone":"addr","desc":"本例 10.1.1.1 → 10.2.2.2，协议字段 50 表示 ESP。内层真实地址 10.1.1.10 → 10.2.2.20 已被加密。","sec":"ESP 的 ICV 不含这个首部，地址与端口可被改写而不被发现：这是它能穿 NAT 的原因，也留下重定向与流量分析的余地。"},{"name":"SPI","cn":"安全参数索引","off":20,"len":4,"bits":"32 位","tone":"spi","desc":"本例 0x2f4a8b02。同一 SA 内所有报文使用相同 SPI，接收端据此在 SAD 中定位算法与密钥。","sec":"SPI 明文传输，可被观察与枚举；攻击者可据此判断某条隧道是否在使用，或对特定 SPI 做定向丢包。"},{"name":"Sequence Number","cn":"序列号","off":24,"len":4,"bits":"32 位，单调递增","tone":"seq","desc":"本例 1，接收端用抗重放窗口判重。","sec":"重放整包会因序号不在窗口内被丢弃；但序号本身不加密，可被用来做流量统计与丢包推断。"},{"name":"Payload Data","cn":"载荷数据（密文）","off":28,"len":40,"bits":"可变长（含 IV/密文）","tone":"data","desc":"本例 40 字节密文，对应内层一个 40 字节的 IPv4+TCP 报文；AES-CBC 等模式还会在开头带初始化向量。","sec":"机密性核心：攻击者能看到长度与方向，但看不到内层地址、端口与内容，抗流量分析能力强于传输模式。"},{"name":"Padding","cn":"填充","off":68,"len":6,"bits":"0~255 字节","tone":"pad","desc":"本例 01 02 03 04 05 06。用于把明文补到分组密码块长的整数倍，同时掩盖真实长度。","sec":"填充长度可暴露原始报文长度的区间，仍是一种侧信道；填充本身不加密前可被用于构造特定块边界以配合比特翻转攻击。"},{"name":"Pad Length","cn":"填充长度","off":74,"len":1,"bits":"8 位 = 6","tone":"len","desc":"告诉接收端解密后要丢弃多少字节填充。","sec":"它受 ICV 保护，篡改会被发现；若实现漏检，去填充错位会让上层解析到错误数据。"},{"name":"Next Header","cn":"下一个首部","off":75,"len":1,"bits":"8 位 = 4","tone":"proto","desc":"指出载荷里的数据类型：4 表示 IPv4（隧道模式），6 表示 TCP（传输模式）。","sec":"决定解密后交给谁；把它改成 6 而实际是 IPv4，可让接收端按 TCP 解析内层报文，制造解析层混淆。"},{"name":"ICV","cn":"完整性校验值","off":76,"len":12,"bits":"可变长，算法决定","tone":"icv","desc":"本例 12 字节示例值。覆盖范围从 SPI 到 Next Header，不含外层 IP 首部。","sec":"不含外层首部正是它能穿 NAT 的原因；代价是外层地址可被改写而不被察觉，需靠其他机制防重定向与流量分析。"}]},{"title":"IKEv2 报文首部与 SA 载荷（48 字节，三层嵌套长度）","hex":"11 22 33 44 55 66 77 88 00 00 00 00 00 00 00 00 21 20 22 08 00 00 00 00 00 00 00 30 00 00 00 10 00 00 00 10 01 01 00 01 00 00 00 08 01 00 00 0c","note":"IKE_SA_INIT 请求（Exchange=34，Flags=0x08 表示发起方）。为聚焦长度嵌套只保留 SA 载荷，真实报文随后还会带 KE、Nonce 载荷。","fields":[{"name":"Initiator's SPI","cn":"发起方 SPI","off":0,"len":8,"bits":"64 位，不得为 0","tone":"spi","desc":"本例 1122334455667788，由发起方随机选取，标识这条 IKE SA。","sec":"64 位随机值使猜测成本极高；若实现用可预测值（如时间戳），攻击者可预判并干扰后续协商。"},{"name":"Responder's SPI","cn":"响应方 SPI","off":8,"len":8,"bits":"64 位，首个报文中必须为 0","tone":"spi","desc":"本例全 0，因为响应方尚未分配。后续报文由响应方填入自己选取的值。","sec":"首包必须为 0 是协议强制规则，非 0 可作为伪造/畸形报文的判据。"},{"name":"Next Payload","cn":"下一个载荷","off":16,"len":1,"bits":"8 位 = 33","tone":"proto","desc":"33 表示后面是 SA 载荷。IKEv2 的载荷类型：33 SA、34 KE、35/36 ID、39 AUTH、40 Nonce、41 Notify、44/45 TS、46 SK（加密载荷）。","sec":"载荷链的入口。未知载荷配合 Critical 位可让对端拒绝整条消息，是被用于探测实现差异的点。"},{"name":"Version","cn":"版本","off":17,"len":1,"bits":"高 4 位主版本=2，低 4 位次版本=0","tone":"version","desc":"本例 0x20。IKEv1 为 0x10，接收端按主版本分流。","sec":"主版本大于 2 必须回 INVALID_MAJOR_VERSION；版本混淆可用于让对端走不同的（可能更弱的）协商逻辑。"},{"name":"Exchange Type","cn":"交换类型","off":18,"len":1,"bits":"8 位：34 IKE_SA_INIT / 35 IKE_AUTH / 36 CREATE_CHILD_SA / 37 INFORMATIONAL","tone":"type","desc":"本例 34，即初始交换：协商加密套件、交换 DH 公钥与随机数。","sec":"IKE_SA_INIT 阶段尚未认证，是中间人攻击与离线字典攻击的主要取材点（攻击者可被动记录全部参数）。"},{"name":"Flags","cn":"标志","off":19,"len":1,"bits":"bit0 I（发起方）/ bit1 V / bit2 R（响应）/ bit3 等","tone":"flag","desc":"本例 0x08 表示 I（Initiator）。响应方置 R，版本升级置 V。","sec":"标志与实际方向不符是对端实现差异与状态机攻击的着力点；重复的 I 位报文可用于制造半开状态。"},{"name":"Message ID","cn":"消息标识","off":20,"len":4,"bits":"32 位","tone":"id","desc":"本例 0，用于匹配请求与响应、检测重放；同一 IKE SA 内单调递增。","sec":"窗口外的 Message ID 必须丢弃；实现若不校验，重放的 IKE_AUTH 可被用来重放认证结果。"},{"name":"Length","cn":"报文总长度","off":24,"len":4,"bits":"32 位（含首部）","tone":"len","desc":"本例 48，覆盖整个 IKE 消息。","sec":"长度与实际不符会让解析器越界读；IKEv2 要求严格校验长度一致性，宽松实现是历史漏洞来源。"},{"name":"SA Next Payload","cn":"SA 载荷的下一个","off":28,"len":1,"bits":"8 位 = 0","tone":"proto","desc":"0 表示 SA 是最后一个载荷。真实 IKE_SA_INIT 此处通常为 34（KE）。","sec":"值为 0 却仍有后续字节，会触发长度校验失败；这也是识别截断/拼接报文的判据。"},{"name":"Critical / RESERVED","cn":"关键位与保留","off":29,"len":1,"bits":"bit0 C / bit1-7 保留","tone":"flag","desc":"C=1 表示对端若不认识该载荷类型必须拒绝整条消息；本规范定义的载荷都置 0。","sec":"把 C 置 1 可强制对端丢弃消息（拒绝服务），或探测对端是否实现了某私有载荷。"},{"name":"SA Payload Length","cn":"SA 载荷长度","off":30,"len":2,"bits":"16 位，单位字节（含通用头）","tone":"len","desc":"本例 16 = 4 字节通用头 + 12 字节提案。","sec":"IKEv2 的长度是多层嵌套的（消息→载荷→提案→变换），任一层算错都会让后续解析偏移，是模糊测试的重点。"},{"name":"Proposal Last Substruc","cn":"提案链尾标志","off":32,"len":1,"bits":"8 位：0 表示最后一个提案，3 表示后面还有","tone":"flag","desc":"本例 0，表示只有一个提案。","sec":"多提案时置 3；若实现不按此链式解析，会漏掉后续（可能更弱的）提案，形成策略绕过。"},{"name":"Proposal Reserved","cn":"提案保留字段","off":33,"len":1,"bits":"bit1-7 保留","tone":"pad","desc":"提案头中紧跟 Last Substruc 位的保留位，发送置 0。","sec":"必须为 0，非 0 可作为异常判据；实现若不校验，可被用来夹带数据。"},{"name":"Proposal Length","cn":"提案长度","off":34,"len":2,"bits":"16 位，单位字节","tone":"len","desc":"本例 16 = 8 字节提案头 + 8 字节变换。","sec":"长度覆盖其后的全部变换，算错会让变换被解析成别的东西。"},{"name":"Proposal Number","cn":"提案编号","off":36,"len":1,"bits":"8 位","tone":"id","desc":"从 1 开始编号，响应方按编号选择接受的提案。","sec":"编号重复或乱序可让对端选中与策略意图不同的提案，是实现差异攻击的着力点。"},{"name":"Protocol ID","cn":"协议标识","off":37,"len":1,"bits":"8 位：1 IKE / 2 AH / 3 ESP","tone":"proto","desc":"本例 1 表示这条 SA 保护的是 IKE 自身；子 SA 里会是 3（ESP）。","sec":"把 1 与 3 混淆会让协商出的参数被用到错误的协议上，直接导致隧道建不起来或保护缺失。"},{"name":"SPI Size","cn":"SPI 长度","off":38,"len":1,"bits":"8 位，单位字节","tone":"len","desc":"IKE 协议固定为 0（IKE 用 8 字节 SPI，不在提案里重复）；AH/ESP 提案为 4。","sec":"长度与协议不匹配会让后续变换解析错位，是构造畸形提案的常用手段。"},{"name":"Num Transforms","cn":"变换数量","off":39,"len":1,"bits":"8 位 = 1","tone":"len","desc":"本例 1，表示只提一个变换（AES-CBC-128）。","sec":"数量与实际变换数不符会让解析器读过界或提前结束，历史上多次成为崩溃点。"},{"name":"Transform Last Substruc","cn":"变换链尾标志","off":40,"len":1,"bits":"8 位：0 最后一个，3 后面还有","tone":"flag","desc":"本例 0。一组完整提案通常依次给出 ENCR、PRF、INTEG、DH 四个变换。","sec":"被截断的变换链会让对端只协商到部分算法，出现“加密有、完整性无”的危险组合。"},{"name":"Transform Reserved","cn":"变换保留字段","off":41,"len":1,"bits":"bit1-7 保留","tone":"pad","desc":"变换头中的保留位，发送置 0。","sec":"非 0 可作为异常判据；某些实现对保留位宽松，成了协议模糊测试的入口。"},{"name":"Transform Length","cn":"变换长度","off":42,"len":2,"bits":"16 位，单位字节","tone":"len","desc":"本例 8 = 8 字节变换头，无属性。","sec":"属性（如密钥长度）跟在变换头之后，长度算错会把属性当成下一条变换。"},{"name":"Transform Type","cn":"变换类型","off":44,"len":1,"bits":"8 位：1 ENCR / 2 PRF / 3 INTEG / 4 DH / 5 ESN","tone":"type","desc":"本例 1（加密算法）。","sec":"只协商加密而不协商完整性，会得到“有保密无认证”的 ESP，位翻转攻击因此可行；反之亦然。"},{"name":"Transform ID Reserved","cn":"变换编号前的保留","off":45,"len":1,"bits":"bit1-7 保留","tone":"pad","desc":"变换类型与变换编号之间的保留字节，发送置 0。","sec":"必须为 0；把它填成非 0 可测试对端是否严格校验，是构造畸形提案的常用位置。"},{"name":"Transform ID","cn":"变换编号","off":46,"len":2,"bits":"16 位","tone":"id","desc":"本例 12 = ENCR_AES_CBC（128 位）。","sec":"编号指向具体算法；降级攻击的目标就是让对端接受更弱的编号（如 DES、NULL 加密）。"}]}],"attacks":[{"name":"ESP Bit Flipping","cn":"ESP 字节篡改（无认证的 ESP）","impact":"在只加密未认证的 ESP 上翻转密文字节，可预测地改变明文，实现内容注入或破坏。","steps":[{"who":"攻击者","to":"—","label":"旁路抓包，记录一条 ESP 报文：SPI、序号、密文、ICV 长度","note":"确认该 SA 只协商了加密（如 AES-CBC）而没有完整性算法，ICV 字段缺失或未校验。"},{"who":"攻击者","to":"安全网关","label":"翻转密文中第 n 个块的某一字节（CBC 下影响下一块的对应字节）","note":"密文长度不变，序号不变，路径上没有任何字段能提示改动。"},{"who":"安全网关","to":"内网服务器","label":"解密得到被改动一个字节的明文，直接交给上层","note":"没有 ICV 就没有完整性校验；若内层是明文协议（如 HTTP 头、DNS 查询），改一个字节即可改变语义。"},{"who":"攻击者","to":"安全网关","label":"再用截断：删掉密文末尾若干块并调整长度字段","note":"在 CBC 下会得到截短的明文，可用于让上层解析出异常长度或错误状态。"},{"who":"内网服务器","to":"—","label":"按被篡改的数据执行（改收款账号、改 DNS 应答、注入命令）","note":"攻击者无需密钥，只需知道明文格式；这类攻击在只有加密没有认证的旧部署中真实存在。"}],"defense":"ESP 必须同时启用完整性（ICV）或直接使用 AEAD（AES-GCM），并在 SA 中强制要求完整性算法。"},{"name":"IKE PSK Brute Force","cn":"IKE 预共享密钥暴力破解","impact":"离线字典命中弱 PSK 后，攻击者可冒充任一对等体或解密历史流量。","steps":[{"who":"攻击者","to":"—","label":"被动记录一次完整的 IKE_SA_INIT 与 IKE_AUTH 交换","note":"IKE_SA_INIT 明文，含 DH 公钥与随机数；IKE_AUTH 含加密的 ID 与 AUTH 载荷。"},{"who":"攻击者","to":"—","label":"从 IKE_SA_INIT 取出 Ni、Nr 与 DH 公钥，离线推导出 SKEYSEED 的候选值","note":"DH 公钥可离线计算共享秘密，无需与网关交互。"},{"who":"攻击者","to":"—","label":"对字典中每个候选 PSK 计算 AUTH = PRF(prf(SK_pi, Ni|IDi), ...)，与抓到的 AUTH 比对","note":"纯离线，不受网关速率限制，也不产生任何登录失败日志。"},{"who":"攻击者","to":"—","label":"命中后得到 PSK，可解密该次交换派生的子 SA","note":"若同时抓到 ESP 流量，历史业务数据被解密。"},{"who":"攻击者","to":"安全网关","label":"用同一 PSK 发起自己的 IKE_AUTH，冒充合法分支","note":"站点到站点部署常全网共用一条 PSK，一台分支失守即全网失守。"}],"defense":"用证书或 EAP 替代 PSK；必须用 PSK 时改为每对等体独立的高熵密钥，并禁用弱 DH 组。"},{"name":"AH No Confidentiality","cn":"AH 无机密性（明文嗅探与流量分析）","impact":"AH 只保证不被篡改，业务内容、端口与内层结构全部明文暴露。","steps":[{"who":"攻击者","to":"—","label":"在路径上旁路抓取 AH 报文，读到外层 IP 首部与明文传输层首部","note":"AH 的认证范围覆盖首部与载荷，但不加密任何字节。"},{"who":"攻击者","to":"—","label":"解析出 TCP/UDP 端口、标志与应用层协议","note":"可直接判断业务类型（数据库、SMB、HTTP），无需解密。"},{"who":"攻击者","to":"—","label":"提取应用层数据（若上层未再加 TLS，则内容完全可读）","note":"AH 常被误认为“加密隧道”，导致管理员在上层不再加密。"},{"who":"攻击者","to":"—","label":"结合包长与时间做流量分析，推断业务节奏与数据量","note":"传输模式下源/目的地址也明文，可画出通信关系图。"},{"who":"攻击者","to":"受害双方","label":"丢弃或延迟特定 AH 报文（认证无法阻止丢包）","note":"完整性不等于可用性，拒绝服务依然成立。"}],"defense":"敏感流量一律用 ESP（必要时 ESP 嵌套 AH），需要隐藏地址时用隧道模式。"},{"name":"NAT Incompatibility","cn":"NAT 穿越失败（AH 与端口封锁）","impact":"AH 经 NAT 后 ICV 必然失配，全部丢包；攻击者也可封锁 UDP 500/4500 让隧道建不起来。","steps":[{"who":"远程用户","to":"NAT 网关","label":"发出 AH（协议号 51）保护的报文，源 192.168.1.10:5000","note":"AH 的 ICV 覆盖源地址与传输层伪首部。"},{"who":"NAT 网关","to":"安全网关","label":"把源地址改写为公网地址、必要时改写端口","note":"地址与端口在传输途中被修改，而 AH 的认证范围正好包含它们。"},{"who":"安全网关","to":"—","label":"重算 ICV 与报文中的值比对，失配 → 丢弃","note":"没有任何字段能告诉它“这是 NAT 改的”，只能当篡改处理。"},{"who":"攻击者","to":"边界防火墙","label":"封锁 UDP 500 与 4500（IKE 与 NAT-T 端口），或丢弃协议号 51","note":"隧道无法建立，管理员为避免业务中断可能被迫改用不加密的通道。"},{"who":"安全网关","to":"—","label":"连接持续黑洞，日志只有大量认证失败","note":"表现为“配置正确但就是不通”，排障成本极高，且易被误判为密钥问题。"}],"defense":"用 ESP + NAT-T（UDP 4500 封装）并放行 IKE 端口；AH 只用于无 NAT 的可信域。"}],"defenses":[{"name":"统一用 ESP，必要时嵌套","how":"站点到站点与远程接入一律部署 ESP（AEAD 优先），需要隐藏内层地址时用隧道模式；确有“必须认证 IP 首部”的合规要求时，用 ESP 外套 AH 的嵌套方式，而不是单用 AH。","limit":"ESP 不认证外层 IP 首部，源地址在外层仍可被改写（虽不影响解密，但可被用于重定向与流量分析）；嵌套会带来额外开销与 MTU 压力，配置复杂度也显著上升。"},{"name":"证书或 EAP 认证替代 PSK","how":"IKEv2 用 X.509 证书做对等体认证，远程接入用 EAP（如 EAP-TLS）绑定用户身份；必须用 PSK 时，为每一对等体分配独立的高熵密钥并定期轮换。","limit":"需要 PKI 签发、分发与吊销体系，运维成本高；PSK 即使加强也仍是共享秘密，一处泄露即影响该对等体的全部隧道，且无法提供不可否认性。"},{"name":"NAT-T 与 IKE 端口放行","how":"启用 NAT 穿越：检测到路径存在 NAT 后把 ESP 封装进 UDP 4500，并在 IKE 中协商保活；边界放行 UDP 500/4500，同时保证 PMTUD 的 ICMP 差错可达。","limit":"封装增加 8 字节以上开销并进一步压缩有效 MTU，容易触发分片；部分老设备不支持 NAT-T，多级 NAT 下仍可能失败，且 UDP 4500 常被策略误封。"},{"name":"AEAD + 抗重放窗口与 ESN","how":"选用 AES-GCM 等 AEAD 算法，把加密与认证合成一步，避免“只加密未认证”的错误组合；SAD 中维护抗重放窗口，必要时启用扩展序列号（64 位）防止 32 位序号回绕。","limit":"AEAD 不防流量分析（包长、时序仍可见），也不防内网侧的横向攻击与端点失陷；窗口设得太小会丢合法乱序包，设得太大则削弱抗重放效果并增加状态开销。"}],"calcs":[],"quiz":[{"q":"为什么 AH 不能穿 NAT，而 ESP 可以？","options":["AH 的 ICV 覆盖了会被 NAT 改写的 IP 首部字段，ESP 的 ICV 不含外层首部","AH 用了 UDP 500 端口","AH 不支持 IPv4","ESP 会重新计算 AH 的校验和"],"a":0,"why":"AH 把源/目的地址与传输层伪首部纳入摘要，NAT 一改写就失配；ESP 的 ICV 只覆盖 SPI 到 Next Header，外层地址被改不影响校验，因此能穿 NAT。"},{"q":"只启用加密、不启用完整性的 ESP 会有什么后果？","options":["无法建立 SA","攻击者可翻转密文字节，可预测地改变明文而不被发现","序号会失效","ESP 会自动降级为 AH"],"a":1,"why":"没有 ICV 就没有任何完整性校验。CBC 模式下翻转密文某块会让下一块对应位翻转，攻击者只要知道明文格式就能改内容，这正是必须用 AEAD 的原因。"},{"q":"一条 SA 能同时保护双向通信吗？","options":["能，SPI 相同即可","能，只要用隧道模式","不能，SA 是单向的，双向需要两条（各自独立的 SPI 与密钥）","不能，除非用 AH"],"a":2,"why":"SA 由 SPI、目的地址、协议号三元组唯一标识，是单向的安全通道。双向通信要在两个方向各建一条 SA，各自有独立的算法、密钥与序列号状态。"}]},"script":{"id":"ipsec","notes":{"Next Header":{"short":"后面装的是什么协议","more":"8 位。AH 里它指向被保护的上层（6 TCP、17 UDP、4 IPv4）；ESP 里它在尾部，解密去填充后才读得到，决定载荷交给谁处理。IPv6 的扩展首部链也靠它串起来。","sec":"值被改会让解析错位，接收端把数据交给错的协议处理。"},"SPI":{"short":"32 位安全参数索引，选 SA 用","more":"与目的 IP、安全协议标识（AH/ESP）三元组唯一标识一条 SA。接收方靠它在 SAD 里找到「这份报文该用哪套算法与密钥」，同一 SA 内 SPI 相同。","sec":"SPI 是明文，可被用来探测哪些 SA 存在、哪些被丢弃。"},"ICV":{"short":"完整性校验值，长度由算法定","more":"AH 的 ICV 覆盖整个 IP 包（易变字段除外）；ESP 的 ICV 只覆盖 SPI 到下一个首部，不含外层新首部。长度须为 32 位整数倍，常见 96 或 128 位截断。","sec":"没有 ICV（只加密不认证）的 ESP 可被翻转字节，改动会直达明文。"},"Exchange Type":{"short":"34 建 SA / 35 认证","more":"8 位。34 = IKE_SA_INIT，明文协商算法并交换 DH 公钥；35 = IKE_AUTH，加密传身份做认证；36 建子 SA；37 负责删除与保活。","sec":"记下 34/35 两包，就够做离线 PSK 字典爆破。"},"Initiator's SPI":{"short":"发起方 SPI，不得为 0","more":"64 位，标识这次 IKE 交换的发起方。首个报文中响应方 SPI 必须填 0，之后由响应方补上自己的值，两边用这一对 SPI 认这条 IKE SA。","sec":"SPI 可预测时，攻击者能抢先插入自己的交换。"},"Transform Type":{"short":"加密/PRF/完整性/DH","more":"8 位，每个 Transform 说明自己在协商什么：1 = ENCR 加密，2 = PRF 伪随机函数，3 = INTEG 完整性，4 = DH 组，5 = ESN 扩展序号。","sec":"只看协商了 ENCR 没协商 INTEG，就知道这条 SA 可被翻转。"},"Pad Length":{"short":"填充了多少字节","more":"8 位，配合填充字段把明文凑成加密算法要求的块长，并隐藏真实长度。接收端解密后按它截掉尾部，再读下一个首部决定交给谁。","sec":"改这个值会让去填充错位，明文边界随之偏移。"}},"acts":[{"key":"normal","no":"第 1 幕","title":"它正常怎么工作","desc":"IKE 谈好算法与密钥，AH/ESP 按合同逐包处理","lead":"IPSec 不改应用，只在 IP 层补一层。先看三个包：IKE 协商、AH 认证、ESP 加密，再看接收端怎么按 SA 把它拆开。","scenes":[{"name":"IKE 谈合同 → AH / ESP 执行","steps":[{"who":"发起方","to":"响应方","pkt":2,"bubble":"IKE_SA_INIT｜Exchange 34","hl":["Initiator's SPI","Responder's SPI","Exchange Type","Next Payload","Length"],"vals":{"Initiator's SPI":"0x1122334455667788","Responder's SPI":"0（首个报文）","Exchange Type":"34（IKE_SA_INIT）","Next Payload":"33（SA）","Length":"48"},"say":"先谈合同：IKE_SA_INIT 交算法提案与 DH 公钥，此时一切都还没加密。","sub":"长度字段层层嵌套：IKE 头、SA、Proposal、Transform。"},{"who":"安全网关A","to":"安全网关B","pkt":0,"bubble":"AH｜协议 51，整包摘要","hl":["Outer IPv4 Header","Next Header","SPI","Sequence Number","ICV"],"vals":{"Outer IPv4 Header":"协议字段 = 51","Next Header":"6（TCP）","SPI":"0x2f4a8b01","Sequence Number":"1","ICV":"12 字节截断"},"say":"AH 给整包做摘要，连源地址一起算——地址被改就验不过。","sub":"代价是它穿不过 NAT，而且不加密。"},{"who":"安全网关A","to":"安全网关B","pkt":1,"bubble":"ESP｜协议 50，整段加密","hl":["Outer IPv4 Header","SPI","Sequence Number","Payload Data"],"vals":{"Outer IPv4 Header":"协议字段 = 50","SPI":"0x2f4a8b02","Sequence Number":"1","Payload Data":"原始 IP 数据报整段加密"},"say":"ESP 把整个原始数据报加密，外面只留 SPI 与序号。","sub":"隧道模式下新加的外层首部不加密，路由器才转得动。"},{"who":"安全网关B","to":"—","pkt":1,"bubble":"验 ICV → 去填充 → 解密","hl":["Padding","Pad Length","Next Header","ICV"],"vals":{"Padding":"6 字节全 0","Pad Length":"6","Next Header":"4（IPv4）","ICV":"校验通过"},"say":"接收端先验 ICV、查序号，再去填充解密，按下一个首部交回 IP。","sub":"四步顺序固定，任何一步失败整包丢弃。"},{"who":"安全网关B","to":"—","pkt":0,"bubble":"抗重放：序号 + 窗口","hl":["SPI","Sequence Number"],"vals":{"SPI":"0x2f4a8b01","Sequence Number":"窗口内 → 接受；重复 → 丢弃"},"say":"序号单调递增，配合抗重放窗口：重放的包连解密机会都没有。","sub":"32 位耗尽前必须换密钥，否则要用扩展序号。"}],"cmds":{"linux":[{"c":"sudo ip xfrm state list","n":"SAD：每条 SA 的 SPI、算法、密钥与生存期，IPSec 的「合同」都在这","s":"补充（iproute2 的 xfrm 子命令，vault 无）"},{"c":"sudo ip xfrm policy list","n":"SPD：哪些流要 IPSec（apply）、哪些绕过（bypass）、哪些直接丢","s":"补充（iproute2 的 xfrm 子命令，vault 无）"},{"c":"sudo tcpdump -ni any 'ip proto 50 or ip proto 51'","n":"只看 ESP/AH：内容不可读，能读到 SPI 与序号，判断有没有在跑","s":"补充（vault 无 tcpdump）"}],"ps":[{"c":"Get-NetIPsecRule | Select-Object DisplayName,Enabled","n":"本机 IPSec 连接安全规则清单，等价于 SPD 的可视化","s":"《系统》PowerShell.md · 网络管理 Cmdlet"}],"cmd":[{"c":"netsh advfirewall consec show rule name=all","n":"列出连接安全规则（要求认证/加密的流量），看哪些流被要求 IPSec","s":"《系统》Windows CMD.md · netsh"},{"c":"netsh advfirewall monitor show mmsa","n":"主模式安全关联：对端、算法与 SPI，隧道通不通先看这张表","s":"《系统》Windows CMD.md · netsh"}]}}]},{"key":"attack","no":"第 2 幕","title":"它会被怎么打","desc":"只加密不认证的 ESP 可翻字节；弱 PSK 可离线爆破","lead":"两招都不碰算法本身：一招打「认证缺失」的配置错配，一招打「共享秘密」的人为弱点。","scenes":[{"name":"ESP 位翻转：只加密不认证就等于没认证","steps":[{"who":"攻击者","to":"—","pkt":1,"bubble":"旁路抓包，先看 SA 有没有认证","evil":true,"hl":["SPI","Sequence Number","Payload Data","ICV"],"vals":{"SPI":"0x2f4a8b02","Sequence Number":"1","Payload Data":"抓到的密文","ICV":"长度 0 → 没协商完整性"},"say":"先确认这条 SA 只协商了加密：ICV 字段缺失或从来不被校验。","sub":"AES-CBC 单独使用时，正是这种错配的典型。"},{"who":"攻击者","to":"安全网关B","pkt":1,"bubble":"翻转第 n 块的一个字节","evil":true,"hl":["Sequence Number","Payload Data"],"vals":{"Sequence Number":"1（不变）","Payload Data":"密文第 n 块某字节 ^= 0x01"},"say":"翻转密文一个字节：长度、序号都不变，路径上没有字段能提示改动。","sub":"CBC 下会连带影响下一块，改动是可预测的。"},{"who":"安全网关B","to":"内网服务器","pkt":1,"bubble":"解密后直接交给上层","hl":["Payload Data","ICV","Next Header"],"vals":{"Payload Data":"明文被改掉一字节","ICV":"无 → 不校验","Next Header":"4（IPv4）"},"say":"没有 ICV 就没有完整性校验，被改的明文直接进了内网。","sub":"内层若是明文协议，改一字节就改了语义。"},{"who":"攻击者","to":"安全网关B","pkt":1,"bubble":"再截断末尾若干块","evil":true,"hl":["Payload Data","Padding","Pad Length"],"vals":{"Payload Data":"删掉密文末尾若干块","Padding":"跟随调整","Pad Length":"改小"},"say":"再截断：删掉末尾密文并调长度字段，得到一段被截短的明文。","sub":"上层会解析出异常长度或错误状态。"},{"who":"内网服务器","to":"—","pkt":1,"bubble":"按被改的数据执行","hl":["Next Header","Payload Data"],"vals":{"Next Header":"4（IPv4）","Payload Data":"改收款账号 / 改 DNS 应答 / 注入命令"},"say":"改一个字节就能改收款账号或 DNS 应答，全程不需要密钥。","sub":"攻击者只需知道明文格式，不必破解算法。"}],"cmds":{"linux":[{"c":"sudo tcpdump -ni any -X 'ip proto 50'","n":"把 ESP 密文按十六进制打出来，看清 SPI、序号与密文的边界","s":"补充（vault 无 tcpdump）"},{"c":"sudo ip xfrm state list | grep -Ei 'auth|enc'","n":"只有 enc 没有 auth，就是可翻转的 SA——先查这条再谈其它","s":"补充（iproute2 的 xfrm 子命令，vault 无）"},{"c":"sudo ip xfrm state list | grep -c auth","n":"数一下配了 auth 的 SA 条数，0 说明整机都在裸加密","s":"补充（iproute2 的 xfrm 子命令，vault 无）"}],"ps":[{"c":"Get-NetIPsecRule | Select-Object DisplayName,AuthenticationMethod","n":"看每条规则的认证方法；为空或 None 意味着只加密不认证","s":"《系统》PowerShell.md · 网络管理 Cmdlet"}],"cmd":[{"c":"netsh advfirewall consec show rule name=all","n":"规则详情里看「要求认证」这一项是否被勾选","s":"《系统》Windows CMD.md · netsh"}]}},{"name":"IKE PSK 爆破：抓一次交换，离线猜密码","steps":[{"who":"攻击者","to":"—","pkt":2,"bubble":"抓 IKE_SA_INIT + IKE_AUTH","evil":true,"hl":["Exchange Type","Initiator's SPI","Flags","Message ID"],"vals":{"Exchange Type":"34 → 35（两次交换都要）","Initiator's SPI":"0x1122334455667788","Flags":"I（发起方）","Message ID":"0"},"say":"被动记录一次 IKE_SA_INIT 与 IKE_AUTH，全程不与对端交互。","sub":"INIT 明文，AUTH 加密——爆破的原料都在里面。"},{"who":"攻击者","to":"—","pkt":2,"bubble":"取 Ni、Nr 与 DH 公钥","hl":["Next Payload","Length","SA Payload Length"],"vals":{"Next Payload":"33（SA）","Length":"48","SA Payload Length":"16"},"say":"从明文报文里取出随机数与 DH 公钥，离线算出共享秘密。","sub":"DH 公钥可离线计算，不需要和网关说一句话。"},{"who":"攻击者","to":"—","pkt":2,"bubble":"对字典逐个候选 PSK 算 AUTH","hl":["Transform Type","Transform ID","Protocol ID"],"vals":{"Transform Type":"2（PRF）/ 3（INTEG）","Transform ID":"协商出的算法","Protocol ID":"1（IKE）"},"say":"对每个候选 PSK 算一遍 AUTH，与抓到的值逐字节比对。","sub":"纯离线，不受网关限速，也不产生登录失败日志。"},{"who":"攻击者","to":"—","pkt":2,"bubble":"命中：拿到 PSK","hl":["Initiator's SPI","Responder's SPI"],"vals":{"Initiator's SPI":"0x1122334455667788","Responder's SPI":"响应方 SPI"},"say":"字典够好就会命中：拿到 PSK 就能解出这次交换派生的子 SA。","sub":"若同时抓到 ESP 流量，历史业务数据一并被解密。"},{"who":"攻击者","to":"安全网关B","pkt":2,"bubble":"用同一 PSK 发起 IKE_AUTH","evil":true,"hl":["Exchange Type","Initiator's SPI","Flags"],"vals":{"Exchange Type":"35（IKE_AUTH）","Initiator's SPI":"自己的新 SPI","Flags":"I（发起方）"},"say":"拿同一 PSK 发起 IKE_AUTH，直接冒充合法分支接入内网。","sub":"共享秘密一处泄露，等于所有分支的门都开了。"}],"cmds":{"linux":[{"c":"sudo tcpdump -ni any 'udp port 500' -w ike.pcap","n":"把 IKE 交换落盘，后续离线爆破与复盘都用这份 pcap","s":"补充（vault 无 tcpdump）"},{"c":"sudo ike-scan --aggressive --pskcrack=psk.txt 10.2.2.2","n":"主动探测网关支持的 IKE 参数并抓取可爆破的哈希（仅授权环境）","s":"补充（ike-scan，vault 无）"},{"c":"sudo tcpdump -ni any 'udp port 4500'","n":"NAT-T 封装的 ESP 走 4500，抓不到 500 时改看这个端口","s":"补充（vault 无 tcpdump）"}],"ps":[{"c":"Get-NetIPsecMainModeSA | Select-Object Name,LocalAddress,RemoteAddress","n":"当前主模式 SA：对端是谁、用哪种认证（PSK 还是证书）","s":"《系统》PowerShell.md · 网络管理 Cmdlet"}],"cmd":[{"c":"netsh advfirewall monitor show mmsa","n":"主模式关联与认证方式，PSK 的条目一眼可辨","s":"《系统》Windows CMD.md · netsh"}]}}]},{"key":"defend","no":"第 3 幕","title":"防护在哪一步掐断它","desc":"把完整性变成必选项，把共享秘密换成证书","lead":"防守点只有两个：SA 里必须同时有 ENCR 与 INTEG（或用 AEAD 合一），身份认证不要靠一把人人皆知的 PSK。","scenes":[{"name":"强制完整性 + 换掉共享秘密","steps":[{"who":"安全网关B","to":"—","pkt":1,"bubble":"ICV 验不过 → 整包丢弃","hl":["ICV","Payload Data","Sequence Number"],"vals":{"ICV":"96 位，与摘要不符","Payload Data":"改过的密文","Sequence Number":"1"},"say":"ESP 必须同时启用完整性：开了 ICV，翻转一字节就当场验不过。","sub":"这是把「只加密」这条错配从 SA 里彻底去掉。"},{"who":"安全网关B","to":"—","pkt":1,"bubble":"改用 AEAD：加密与认证合一","hl":["Payload Data","Padding","Pad Length"],"vals":{"Payload Data":"AES-GCM 一次算出密文与标签","Padding":"按块长凑齐","Pad Length":"6"},"say":"直接上 AEAD，加密与认证一步完成，没有「只加密」的错配空间。","sub":"分两步做既慢又容易漏，工程正解是合一。"},{"who":"安全网关B","to":"—","pkt":2,"bubble":"协商时就锁死算法","hl":["Transform Type","Transform ID","Protocol ID"],"vals":{"Transform Type":"1（ENCR）→ 要求 AEAD","Transform ID":"AES-GCM","Protocol ID":"3（ESP）"},"say":"在 SA 提案里只允许 AEAD 与强 PRF，弱组合根本协商不出来。","sub":"算法可替换正是这套框架能活三十年的原因。"},{"who":"安全网关B","to":"—","pkt":2,"bubble":"IKE_AUTH 改证书/EAP","hl":["Exchange Type","Initiator's SPI"],"vals":{"Exchange Type":"35（IKE_AUTH）","Initiator's SPI":"校验对端证书链"},"say":"用 X.509 证书或 EAP-TLS 替代 PSK：没有共享秘密可拿来爆破。","sub":"必须用 PSK 时，一对等体一把高熵密钥并定期轮换。"},{"who":"安全网关B","to":"—","pkt":2,"bubble":"冒充分支：AUTH 校验失败","hl":["Initiator's SPI","Flags","Message ID"],"vals":{"Initiator's SPI":"陌生发起方","Flags":"I","Message ID":"不匹配"},"say":"闭环：没有 PSK 也没有证书，AUTH 就过不了，历史流量也解不开。","sub":"再配合关闭弱 DH 组，离线预计算也一起失效。"}],"cmds":{"linux":[{"c":"sudo ip xfrm state list","n":"逐条核对：auth 非空、算法是 AEAD、序号窗口已启用","s":"补充（iproute2 的 xfrm 子命令，vault 无）"},{"c":"sudo ip xfrm policy list","n":"确认敏感流命中 apply 而不是 bypass，否则加密形同虚设","s":"补充（iproute2 的 xfrm 子命令，vault 无）"},{"c":"sudo tcpdump -ni any 'udp port 500 or udp port 4500'","n":"看 IKE 与 NAT-T 是否正常；重建失败的隧道会反复重试","s":"补充（vault 无 tcpdump）"}],"ps":[{"c":"Get-NetIPsecRule | Select-Object DisplayName,AuthenticationMethod,Enabled","n":"核对每条规则的认证方式：Certificate 优于 PSK，None 属高危","s":"《系统》PowerShell.md · 网络管理 Cmdlet"}],"cmd":[{"c":"netsh advfirewall monitor show mmsa","n":"主模式关联的认证方式与算法，巡检时一眼看出谁是 PSK","s":"《系统》Windows CMD.md · netsh"},{"c":"netsh advfirewall consec show rule name=all","n":"规则里是否要求加密与认证同时具备","s":"《系统》Windows CMD.md · netsh"}]}}]}]}},{"proto":{"id":"tcp","name":"TCP","cn":"传输控制协议","en":"Transmission Control Protocol","layer":"transport","chapter":"第四章","extra":false,"oneLine":"面向连接、可靠的字节流传输，靠序号+确认+重传把不可靠的 IP 服务变成可靠管道。","sections":[{"h":"端口号把“主机到主机”切成“进程到进程”","p":"网络层只保证把分组送到目的主机，至于交给主机上的哪个进程，由传输层的 16 位端口号完成。发送端把多个应用的数据统一交给 IP（复用），接收端按目的端口把数据分回正确进程（分用），这一对动作的实现手段就是端口，因此端口写错的报文哪怕校验和全对，也会在分用阶段被丢弃。\n\n端口分三段：0–1023 熟知端口由 IANA 固定分配（443 是 HTTPS、53 是 DNS），1024–49151 登记端口，49152–65535 短暂端口由内核动态分配。端口只有本地意义，同一个数字在另一台主机上毫无关系；TCP 与 UDP 的端口空间彼此独立，DNS 因此能在两个空间里同时占用 53。"},{"h":"序号与确认号是可靠性的全部支点","p":"TCP 把应用字节流按字节编号：seq 指出本报文第一个数据字节的编号，ack=N 表示 N-1 及之前全部按序收到，这就是累计确认——用一个数字压缩了整段历史。SYN 与 FIN 即使不携带数据也各消耗一个序号，所以三次握手里客户端的第二个报文 seq 必然是 x+1。\n\n可靠性由此展开：超时重传靠 seq 定位丢失区间，滑动窗口用 win 限制在途字节，SACK 报告空洞以实现选择性重传。代价是两端必须长期维护两个方向的序号与窗口状态（TCB），而状态就是可被耗尽的资源——一旦序号可预测或状态被占满，可靠性机制立刻变成负担。"},{"h":"标志位是攻击者最直接的操作杆","p":"8 个控制位各自对应一次状态跃迁：SYN 请求同步序号、ACK 使确认号有效、PSH 要求立即交付应用、RST 立即作废连接、FIN 表示本方数据发完、URG 指向紧急数据，CWR 与 ECE 用于 ECN 协商。正常流量里它们的组合是固定的，异常组合往往就是扫描或攻击的指纹。\n\nRST 与 FIN 的差别决定了危害形态：RST 无需确认即释放全部资源，所以几十字节的伪造包就能断链并丢弃缓冲区中未被应用读取的数据；FIN 只关闭一个方向，可被用来制造半关闭让业务单向失效。而 SYN 是唯一能在不携带任何数据的情况下让服务器分配资源的标志位——这是 SYN 泛洪的起点。"},{"h":"选项字段是协议扩展面，也是解析差异的来源","p":"20 字节固定首部之外还有最多 40 字节选项，承载 MSS、窗口扩大因子、SACK、时间戳这些现代 TCP 必需的能力。选项以 kind-length-value 编码，但 kind 1（NOP）与 kind 0（EOL）只有单字节、没有长度字段，解析器必须先看 kind 再决定要不要读长度——这处分支是历史上大量畸形包漏洞的根源。\n\n选项的第二个麻烦是它只在 SYN 段协商：窗口扩大因子一旦在 SYN 里丢失，整条连接的窗口就永远被限制在 64 KB。这解释了 SYN Cookie 的代价——把状态挤进序号字段后就没有余量保存选项，MSS 只能用编码位近似，窗口扩大只能放弃。"},{"h":"连接状态既是功能，也是可被榨取的资源","p":"三次握手的目的不是打招呼，而是让双方各自确认对方的接收能力与本方序号的可见性：服务器在收到第三个 ACK 之前无法确认客户端收到了自己的 SYN+ACK，因此只把连接放在 SYN-RCVD（半连接），但此时 TCB 已经分配。这个“先分配、后验证”的顺序是效率选择，也正是资源被榨取的位置。\n\n四次挥手把两个方向分开关闭，TIME-WAIT 等 2MSL 是为了让最后一个 ACK 有机会重发、并让旧报文在网络中消逝。于是状态成了双向负担：半连接可被打满、TIME-WAIT 可被短连接堆积、FIN-WAIT-2 可被长期挂起——所有状态都是可耗尽的资源，防御的共同思路就是推迟分配或取消分配。"}],"packets":[{"title":"TCP 首部（固定 20 字节 + 20 字节选项 = 40 字节）","note":"一次 HTTPS 连接的 SYN 段，客户端 192.168.1.100:49572 → 服务器 93.184.216.34:443，携带 MSS/SACK-Permitted/Timestamps/Window Scale 四个常用选项","hex":"c1 a4 01 bb 8f 3a 2c 17 00 00 00 00 a0 02 fa f0 7c 00 00 00 02 04 05 b4 04 02 08 0a 1f 2a 3b 4c 00 00 00 00 01 03 03 07","fields":[{"name":"Source Port","cn":"源端口","off":0,"len":2,"bits":"","tone":"port","desc":"16 位发送方端口，本例 0xc1a4 = 49572，落在 49152–65535 的短暂端口区间。客户端由内核在发起连接时挑选，现代实现会混入四元组与随机盐做哈希，避免线性递增被外推到别的连接上。","sec":"源端口是四元组的一半：伪造 RST 或注入数据段时源端口必须与真实流完全相等，否则分用逻辑直接丢弃。它同时是 NAT 复用表的键与端口扫描的观察点。"},{"name":"Destination Port","cn":"目的端口","off":2,"len":2,"bits":"","tone":"port","desc":"16 位目的端口，本例 0x01bb = 443（HTTPS）。接收端靠
